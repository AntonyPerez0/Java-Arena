name: Build, verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The site's own domain (also set under Settings > Pages > Custom domain).
  # Empty: publish at https://<owner>.github.io/<repo>/
  CUSTOM_DOMAIN: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    # The slowest runs on main took about 47 minutes before fx-check (6 to 8 more), and pull requests
    # also run Lighthouse (about 4): 90 leaves room for a slow runner and for more lessons.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the built Java engine is committed
        run: git ls-files --error-unmatch engine/dist/compiler/javac.wasm engine/dist/compiler/manifest.json engine/dist/runner/runner.core.wasm engine/dist/runner/jdk.zip engine/dist/runner/manifest.json

      - name: Cache the reference JDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/java-arena
          key: reference-jdk-${{ hashFiles('scripts/get-jdk.sh') }}

      - name: Reference JDK (Temurin 21.0.10+7, the build the engine's class library comes from)
        run: |
          echo "JAVA_HOME=$(bash scripts/get-jdk.sh)" >> "$GITHUB_ENV"
          "$(bash scripts/get-jdk.sh)/bin/java" -version

      - name: Install dependencies (also copies the Java engine into public/engine)
        run: npm ci

      - name: Unit tests (class diagrams in lesson text, checks of written files, explanations of mistakes, Java Arena's JavaFX on the reference JDK)
        run: npm run test:unit

      - name: Work out the site address
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$CUSTOM_DOMAIN" >> "$GITHUB_ENV"
          else
            owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$owner.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Run the fidelity suite on the real JDK
        run: npm run fidelity:jdk

      - name: Check the lessons on the real JDK, type-check and build the site
        run: npm run build

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      # After npm ci (which empties node_modules) and after the system libraries the step above
      # installs (real JavaFX's text needs fontconfig and pango). Keyed by the pinned versions.
      - name: Cache the OpenJFX and Monocle jars for the real-JavaFX check
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/java-arena-fx
          key: fx-check-jars-${{ hashFiles('scripts/fx-check/jars.json') }}

      - name: Run every JavaFX program (lessons, fidelity, probes) on real OpenJFX 21 without a screen and compare with Java Arena's JavaFX
        run: npm run fx-check

      - name: Run the fidelity suite in the browser engine and compare with the JDK
        run: npm run fidelity:browser

      - name: Run every lesson program in the browser engine and compare with the JDK
        run: npm run content:browser

      - name: Browser tests (engine, accessibility with axe, phone widths, offline, mobile data)
        run: npm run test:e2e -- --shots screenshots

      - name: Keep the screenshots and the fidelity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-reports
          path: |
            screenshots
            fidelity/out
          if-no-files-found: ignore

      # Scores key pages as a phone would, and fails the PR below the thresholds in lighthouserc.cjs.
      - name: Lighthouse (performance, accessibility, SEO, best practices)
        if: github.event_name == 'pull_request'
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - name: Keep the Lighthouse reports
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lhci
          if-no-files-found: ignore

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
