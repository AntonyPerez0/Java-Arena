  - type: bug
    after: edges
    prompt: "`wrap` should wrap any value, negative ones too, into the range from 0 up to `size`. Fix the line marked `// BUG`."
    pre: |
      public static double wrap(double value, double size) {
          double result = value % size;
          if (result < 0) {
              result = result - size; // BUG
          }
          return result;
      }
    body: |
      System.out.println(wrap(370, 360));
      System.out.println(wrap(-10, 360));
    fix: result = result + size;
    why: "In Java a remainder has the sign of the number on the left: `-10 % 360` is -10. Taking `size` away makes it -370, even further out; adding `size` brings it into the sea, at 350. A positive value such as 370 gives the remainder 10, which is already right."

  - type: bug
    after: movers
    prompt: "A TumblingKite should move as a Kite does and then turn. Fix the line marked `// BUG`."
    classes: |
      class Kite {
          private int x;

          public void move() {
              x += 3;
          }

          public int getX() {
              return x;
          }
      }

      class TumblingKite extends Kite {
          private int angle;

          @Override
          public void move() {
              move(); // BUG
              angle += 10;
          }

          public int getAngle() {
              return angle;
          }
      }
    body: |
      TumblingKite k = new TumblingKite();
      k.move();
      k.move();
      System.out.println(k.getX() + " " + k.getAngle());
    fix: super.move();
    why: "Inside TumblingKite, `move()` calls TumblingKite's own `move` again, which calls it again, until the program crashes with a StackOverflowError. `super.move()` runs the parent's version, which moves the TumblingKite by 3."

