  - type: choice
    after: keys-and-loop
    prompt: Why does the game keep the held keys in a `Map<KeyCode, Boolean>` and turn the submarine in the AnimationTimer, rather than turning it in the key pressed handler?
    choices:
      - "A key handler can't change a shape's rotate."
      - "Holding a key gives one press here (and, on a computer, repeated presses only after a pause), while the game loop runs in every frame, so turning there is smooth and the same everywhere."
      - "The map makes the program faster."
      - "`setOnKeyPressed` works only for letter keys."
    answer: 2
    why: "The pressed handler runs once per press. Here a held key isn't repeated at all, and on a computer its repeats start after a short pause and come about 30 times a second, so turning in the handler would be jerky. The map remembers which keys are down, and the timer acts on them in every frame."

  - type: choice
    after: collisions
    prompt: Why do the games of this module make their Random with a seed, as in `new Random(8)`?
    choices:
      - "Without a seed, `nextInt` would always return 0."
      - "A seed makes the numbers more random."
      - "The page runs the program again from the start for every new key or frames line, so the jellyfish must be in the same places on every run."
      - "JavaFX can't use a Random without a seed."
    answer: 3
    why: "Each new event on the page reruns the whole program. A seeded Random gives the same numbers in the same order on every run, so the game continues where it was; an unseeded one would place the jellyfish elsewhere every time, and the window couldn't be compared with the model solution's."

