    why: "The second `put` replaces the value of the key UP, so UP is `false`, and `getOrDefault` returns that value: its default is used only for a key that isn't in the map. DOWN was never put, so it gets the default `false`. The map has one key."

  - type: predict
    after: vectors
    prompt: "This code runs inside `start`. What does it print? (Drills have no import lines, so JavaFX's classes are written with their full names.)"
    body: |
      javafx.geometry.Point2D v = new javafx.geometry.Point2D(1, 2);
      v.add(10, 10);
      javafx.geometry.Point2D w = v.add(v).multiply(0.5);
      System.out.println(v);
      System.out.println(w.equals(v));
    why: "A Point2D is immutable: `v.add(10, 10)` returns a new point that nobody keeps, so `v` is still (1, 2). `v.add(v)` is (2, 4), and half of it is (1, 2) again, so `w` equals `v`."

  - type: predict
    after: vectors
    prompt: What does this print?
    body: |
      double angle = Math.toRadians(90);
      System.out.println(Math.round(Math.cos(angle) * 4) + " " + Math.round(Math.sin(angle) * 4));
      angle = Math.toRadians(180);
      System.out.println(Math.round(Math.cos(angle) * 4) + " " + Math.round(Math.sin(angle) * 4));
    why: "At 90 degrees the direction is (0, 1): down on the screen. At 180 degrees it's (-1, 0): left. Multiplied by 4 and rounded, the tiny errors of cos and sin (such as the cosine of 90 degrees, which is about 0.00000000000000006 instead of 0) disappear, and `Math.round` of a double gives a `long`, printed without `.0`."

