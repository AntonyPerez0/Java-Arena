    solution: |
      import javafx.application.Application;
      import javafx.scene.Scene;
      import javafx.scene.input.KeyCode;
      import javafx.scene.layout.Pane;
      import javafx.scene.text.Text;
      import javafx.stage.Stage;

      public class Main extends Application {
          private int shots = 0;

          @Override
          public void start(Stage stage) {
              Pane pane = new Pane();
              pane.setPrefSize(200, 60);
              Text text = new Text(10, 30, "Shots: 0");
              pane.getChildren().add(text);

              Scene scene = new Scene(pane);
              scene.setOnKeyPressed(event -> {
                  if (event.getCode() == KeyCode.SPACE) {
                      shots++;
                      text.setText("Shots: " + shots);
                      System.out.println("Shots: " + shots);
                  }
              });

              stage.setScene(scene);
              stage.setTitle("Shots");
              stage.show();
          }

          public static void main(String[] args) {
              launch(Main.class);
          }
      }
    hints:
      - "The count must be a field, `private int shots = 0;`, since the lambda changes it. The Text goes into the pane with `pane.getChildren().add(text);`."
      - "`scene.setOnKeyPressed(event -> { if (event.getCode() == KeyCode.SPACE) { ... } });`, where the braces add one, call `text.setText(...)` and print."
    tests:
      - events: |
          key SPACE
          key SPACE
      - events: |
          key A
          key SPACE
          press key LEFT
          key SPACE
          release key LEFT
          key SPACE
        hidden: true
      - events: []
        hidden: true
