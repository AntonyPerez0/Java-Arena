    body: |
      Map<javafx.scene.input.KeyCode, Boolean> held = new HashMap<>();
      held.put(javafx.scene.input.KeyCode.UP, true);
      held.put(javafx.scene.input.KeyCode.UP, false);
      boolean up = held.getOrDefault(javafx.scene.input.KeyCode.UP, true);
      boolean down = held.getOrDefault(javafx.scene.input.KeyCode.DOWN, false);
