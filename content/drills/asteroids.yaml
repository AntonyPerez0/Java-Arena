  - type: predict
    after: shapes
    prompt: "This code runs inside `start`. What does it print? (Drills have no import lines, so JavaFX's classes are written with their full names.)"
    body: |
      javafx.scene.shape.Polygon fin = new javafx.scene.shape.Polygon(0, 0, 10, 0, 5, 8);
      fin.setTranslateX(40);
      fin.setRotate(fin.getRotate() + 30);
      fin.setRotate(fin.getRotate() - 50);
      System.out.println(fin.getTranslateX() + " " + fin.getRotate());
      System.out.println(fin.getPoints().size());
    why: "Translate and rotate are doubles that start at 0, so the shape is at x `40.0` and turned 30 - 50 = `-20.0` degrees. Moving and turning never change the corners: `getPoints()` still holds the 6 numbers it was given, an x and a y for each of the 3 corners."

  - type: predict
    after: keys-and-loop
