  - type: boss
    after: slider
    prompt: |
      A times table you can slide. Write `start`: the window, titled `Times tables`, holds a VBox (spacing 10) with a slider and a line chart, in that order.

      - The slider goes from 1 to 10, starts at 2, shows tick labels, has a major tick every 1 and no minor ticks, and snaps to ticks.
      - The chart's title is `Times table of 2` (with the slider's value as an int), its x axis is labeled `x` and goes from 1 to 10 with a tick every 1, its y axis is labeled `n times x` and goes from 0 to 100 with a tick every 10, and its legend is hidden. Its one series, `Table`, has the points (x, n * x) for x from 1 to 10, where n is the slider's value as an int.
      - When the slider moves, the title and the series's points follow the new value.
    seed: |
      import javafx.application.Application;
      import javafx.scene.Scene;
      import javafx.scene.chart.LineChart;
      import javafx.scene.chart.NumberAxis;
      import javafx.scene.chart.XYChart;
      import javafx.scene.control.Slider;
      import javafx.scene.layout.VBox;
      import javafx.stage.Stage;

      public class Main extends Application {

          @Override
          public void start(Stage stage) {

              stage.setTitle("Times tables");
              stage.show();
          }

          public static void main(String[] args) {
              launch(Main.class);
          }
      }
    solution: |
      import javafx.application.Application;
      import javafx.scene.Scene;
      import javafx.scene.chart.LineChart;
      import javafx.scene.chart.NumberAxis;
      import javafx.scene.chart.XYChart;
      import javafx.scene.control.Slider;
      import javafx.scene.layout.VBox;
      import javafx.stage.Stage;

      public class Main extends Application {

          @Override
          public void start(Stage stage) {
              Slider n = new Slider(1, 10, 2);
              n.setShowTickLabels(true);
              n.setMajorTickUnit(1);
              n.setMinorTickCount(0);
              n.setSnapToTicks(true);

              LineChart<Number, Number> chart = new LineChart<>(new NumberAxis("x", 1, 10, 1), new NumberAxis("n times x", 0, 100, 10));
              chart.setLegendVisible(false);
              XYChart.Series<Number, Number> table = new XYChart.Series<>();
              table.setName("Table");
              this.fill(chart, table, 2);
              chart.getData().add(table);
              n.valueProperty().addListener((observable, oldValue, newValue) -> this.fill(chart, table, newValue.intValue()));

              stage.setScene(new Scene(new VBox(10, n, chart)));
              stage.setTitle("Times tables");
              stage.show();
          }

          private void fill(LineChart<Number, Number> chart, XYChart.Series<Number, Number> table, int n) {
              chart.setTitle("Times table of " + n);
              table.getData().clear();
              for (int x = 1; x <= 10; x++) {
                  table.getData().add(new XYChart.Data<>(x, n * x));
              }
          }

          public static void main(String[] args) {
              launch(Main.class);
          }
      }
    hints:
      - "Write a method that sets the title and refills the series for a given n (clear the points, then add the ten new ones). Call it once in `start` with 2, and in the listener of the slider's `valueProperty()` with `newValue.intValue()`."
      - "The axes are `new NumberAxis(\"x\", 1, 10, 1)` and `new NumberAxis(\"n times x\", 0, 100, 10)`, and the scene's root is `new VBox(10, slider, chart)`."
    tests:
