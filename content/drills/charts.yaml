  - type: choice
    after: several-series
    prompt: "A program keeps its series in a `HashMap` from each name to its series. Why does it sort the names before adding the series to the chart?"
    choices:
      - "A HashMap's keys come in an order the program didn't choose, and the legend and the checks follow the order of the series"
      - "JavaFX throws an exception when series are added in an order that isn't sorted"
      - "A chart can only show series whose names are in alphabetical order"
      - "Sorting makes the chart draw faster"
    answer: 1
    why: "The order in which series are added is the order of the legend and of the chart's list of series, which the checks compare. A HashMap's order is no order you decided, so the program sorts the names (or keeps the file's order) to make it fixed. JavaFX itself accepts any order."

  - type: choice
    after: honest-charts
    prompt: "Three made-up products scored 980, 1000 and 1010. Which y axis makes an honest bar chart of them?"
    choices:
      - "`new NumberAxis(970, 1015, 5)`"
      - "`new NumberAxis(0, 1200, 200)`"
      - "`new NumberAxis(950, 1050, 10)`"
    answer: 2
    why: "The length of a bar must stand for its value, so bars start at 0. An axis that starts at 970 or 950 cuts the same amount off every bar, which makes the 3 percent difference between 980 and 1010 look several times bigger."

  - type: boss
    after: series-from-formula
    prompt: |
      A survey's answers are counts per option, and a chart of shares wants them in percent. Write the class `Shares` with the method `public static List<Integer> percents(List<Integer> counts)`: for each count, its share of the sum of all counts, in percent, rounded to a whole number with `Math.round` (so 1 of 3 is 33). When the sum is 0, every share is 0. The check runs:

      ```java fragment
      List<Integer> counts = new ArrayList<>();
      counts.add(1);
      counts.add(1);
      counts.add(2);
      System.out.println(Shares.percents(counts));
      ```

      and expects `[25, 25, 50]`.
    seed:
      Shares.java: |
        import java.util.ArrayList;
        import java.util.List;

        public class Shares {

        }
      Main.java: |
        import java.util.ArrayList;
        import java.util.List;

        public class Main {
            public static void main(String[] args) {
                List<Integer> counts = new ArrayList<>();
                counts.add(1);
                counts.add(1);
                counts.add(2);
                System.out.println(Shares.percents(counts));
            }
        }
    solution:
      Shares.java: |
        import java.util.ArrayList;
        import java.util.List;

        public class Shares {

            public static List<Integer> percents(List<Integer> counts) {
                int sum = 0;
                for (int count : counts) {
                    sum += count;
                }
                List<Integer> shares = new ArrayList<>();
                for (int count : counts) {
                    if (sum == 0) {
                        shares.add(0);
                    } else {
                        shares.add((int) Math.round(100.0 * count / sum));
                    }
                }
                return shares;
            }
        }
      Main.java: |
        import java.util.ArrayList;
        import java.util.List;

        public class Main {
            public static void main(String[] args) {
                List<Integer> counts = new ArrayList<>();
                counts.add(1);
                counts.add(1);
                counts.add(2);
                System.out.println(Shares.percents(counts));
            }
        }
    hints:
      - "Add up the counts first. Then each share is `100.0 * count / sum`: the `100.0` makes the division a double one, so 1 of 3 isn't 0."
      - "`Math.round` returns a long, so `(int) Math.round(...)` makes it an int for the list. Check `sum == 0` before dividing."
    tests:
