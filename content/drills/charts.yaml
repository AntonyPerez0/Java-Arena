topic: charts
drills:
  - type: predict
    after: rows-to-numbers
    prompt: What does this print?
    body: |
      String[] friday = "Fri,12,".split(",");
      String[] saturday = "Sat,,7".split(",");
      System.out.println(friday.length + " " + saturday.length);
      System.out.println("[" + saturday[1] + "]");
    why: "`split` drops empty values at the **end** of the text, so `\"Fri,12,\"` gives only `Fri` and `12`. An empty value in the middle stays, as an empty string: `\"Sat,,7\"` gives `Sat`, `\"\"` and `7`. That's why files of data mark a missing value with a `-`."

  - type: predict
    after: rows-to-numbers
    prompt: What does this print?
    body: |
      String[] rows = {"week,km", "1,5.5", "2,-", "3,6"};
      Map<Integer, Double> km = new HashMap<>();
      for (int i = 1; i < rows.length; i++) {
          String[] parts = rows[i].split(",");
          if (!parts[1].equals("-")) {
              km.put(Integer.valueOf(parts[0]), Double.valueOf(parts[1]));
          }
      }
      System.out.println(km.size() + " " + km.get(3) + " " + km.get(2));
    why: "The loop skips the header, and week 2's `-` never goes into the map, so the map has 2 weeks. `Double.valueOf(\"6\")` is the double `6.0`, and `get` returns `null` for a key that isn't in the map."

  - type: predict
    after: line-chart
    prompt: "This code runs inside `start`. What does it print? (Drills have no import lines, so JavaFX's classes are written with their full names.)"
    body: |
      javafx.scene.chart.XYChart.Series<Number, Number> steps = new javafx.scene.chart.XYChart.Series<>();
      for (int week = 1; week <= 3; week++) {
          steps.getData().add(new javafx.scene.chart.XYChart.Data<>(week, week * 10));
      }
      steps.getData().remove(0);
      System.out.println(steps.getData().size() + " " + steps.getData().get(0));
    why: "A series's `getData()` is a list of its points, and it works like any list: removing index 0 removes week 1's point, so 2 points are left and the first is now week 2's. Printing a point gives `Data[x,y,null]`."

  - type: predict
    after: slider
    prompt: "This code runs inside `start`. What does it print? (Drills have no import lines, so JavaFX's classes are written with their full names.)"
    body: |
      javafx.scene.control.Slider speed = new javafx.scene.control.Slider(0, 50, 20);
      speed.valueProperty().addListener((observable, oldValue, newValue) -> System.out.print(newValue.intValue() + " "));
      speed.setValue(35.8);
      speed.setValue(-5);
      speed.setValue(0);
      System.out.println(speed.getValue());
    why: "The listener prints the new value as an int: `intValue()` cuts 35.8 to 35. `setValue(-5)` is below the min, so the slider goes to 0, and the listener hears that change. `setValue(0)` changes nothing, so the listener doesn't run. `getValue()` is a double: `0.0`."

  - type: predict
    after: honest-charts
    prompt: What does this print?
    body: |
      int[] values = {35, 72, 18};
      int max = 0;
      for (int value : values) {
          max = Math.max(max, value);
      }
      int tick = 25;
      int upper = tick;
      while (upper < max) {
          upper += tick;
      }
      System.out.println(max + " " + upper);
    why: "The largest value is 72, and the loop climbs a tick at a time, 25, 50, 75, until it reaches it. So the axis would go from 0 to 75: a whole number of ticks, with room for the tallest bar."

