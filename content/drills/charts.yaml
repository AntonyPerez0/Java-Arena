  - type: bug
    after: slider
    prompt: "This code runs inside `start`. Each round should replace the line's points with new ones and keep the line in the chart, so it should print `1 series, 3 points`. It prints `0 series, 6 points`. Which line has the bug? (Drills have no import lines, so JavaFX's classes are written with their full names.)"
    body: |
      javafx.scene.chart.LineChart<Number, Number> chart = new javafx.scene.chart.LineChart<>(new javafx.scene.chart.NumberAxis(), new javafx.scene.chart.NumberAxis());
      javafx.scene.chart.XYChart.Series<Number, Number> line = new javafx.scene.chart.XYChart.Series<>();
      chart.getData().add(line);
      for (int round = 1; round <= 2; round++) {
          chart.getData().clear(); // BUG
          for (int x = 0; x < 3; x++) {
              line.getData().add(new javafx.scene.chart.XYChart.Data<>(x, x * round));
          }
      }
      System.out.println(chart.getData().size() + " series, " + line.getData().size() + " points");
    fix: line.getData().clear();
    why: "`chart.getData()` is the chart's list of series, so clearing it takes the line out of the chart, and the old points stay in the series. To redraw, clear the series's own list of points, `line.getData()`."

  - type: compiles
    after: bar-charts
    prompt: "This code runs inside `start`. Does it compile? (Drills have no import lines, so JavaFX's classes are written with their full names.)"
