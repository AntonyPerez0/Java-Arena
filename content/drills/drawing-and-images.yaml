    solution: |
      import javafx.scene.image.Image;
      import javafx.scene.image.PixelReader;
      import javafx.scene.image.PixelWriter;
      import javafx.scene.image.WritableImage;
      import javafx.scene.paint.Color;

      public class Main {
          public static void main(String[] args) {
              describe(mirror(sample(3, 2)));
          }

          public static WritableImage mirror(Image source) {
              PixelReader reader = source.getPixelReader();
              int width = (int) source.getWidth();
              int height = (int) source.getHeight();
              WritableImage result = new WritableImage(width, height);
              PixelWriter writer = result.getPixelWriter();
              for (int y = 0; y < height; y++) {
                  for (int x = 0; x < width; x++) {
                      writer.setColor(x, y, reader.getColor(width - 1 - x, y));
                  }
              }
              return result;
          }

          // An image to try things on: pixel (x, y) has red x * 30 and green y * 60.
          public static WritableImage sample(int width, int height) {
              WritableImage image = new WritableImage(width, height);
              PixelWriter writer = image.getPixelWriter();
              for (int y = 0; y < height; y++) {
                  for (int x = 0; x < width; x++) {
                      writer.setColor(x, y, Color.rgb(x * 30, y * 60, 0));
                  }
              }
              return image;
          }

          // Prints the size, then the color of every pixel, a row on each line.
          public static void describe(Image image) {
              int width = (int) image.getWidth();
              int height = (int) image.getHeight();
              System.out.println(width + " x " + height);
              PixelReader reader = image.getPixelReader();
              for (int y = 0; y < height; y++) {
                  String row = "";
                  for (int x = 0; x < width; x++) {
                      row += " " + reader.getColor(x, y);
                  }
                  System.out.println(row.trim());
              }
          }
      }
    hints:
      - "Make a WritableImage of the source's size (as ints) and get its PixelWriter and the source's PixelReader."
      - "For each pixel, `writer.setColor(x, y, reader.getColor(width - 1 - x, y));`, and return the new image at the end."
    tests:
      - call: describe(mirror(sample(3, 2)));
      - call: describe(mirror(sample(5, 1)));
        hidden: true
      - call: |
          describe(mirror(sample(1, 3)));
          describe(mirror(sample(4, 2)));
        hidden: true
