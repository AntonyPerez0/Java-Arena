    solution: |
      import javafx.application.Application;
      import javafx.scene.Scene;
      import javafx.scene.canvas.Canvas;
      import javafx.scene.canvas.GraphicsContext;
      import javafx.scene.layout.Pane;
      import javafx.scene.paint.Color;
      import javafx.stage.Stage;

      public class Main extends Application {

          @Override
          public void start(Stage stage) {
              Canvas canvas = new Canvas(200, 120);
              GraphicsContext pen = canvas.getGraphicsContext2D();
              pen.setFill(Color.SIENNA);
              canvas.setOnMouseClicked(event -> {
                  int x = (int) event.getX() / 20 * 20;
                  int y = (int) event.getY() / 20 * 20;
                  pen.fillRect(x, y, 20, 20);
              });

              stage.setScene(new Scene(new Pane(canvas)));
              stage.setTitle("Mosaic maker");
              stage.show();
          }

          public static void main(String[] args) {
              launch(Main.class);
          }
      }
    hints:
      - "Get the canvas's GraphicsContext, set its fill to `Color.SIENNA`, and give the canvas a handler with `setOnMouseClicked`."
      - "In the handler, `(int) event.getX() / 20` is the square's column (a whole-number division), and times 20 it's the square's left edge. Then `pen.fillRect(x, y, 20, 20);`."
    tests:
      - events: |
          click Canvas 1 at 25 47
          click Canvas 1 at 199.5 0
      - events: |
          click Canvas 1 at 0 119
          click Canvas 1 at 59.9 60
          click Canvas 1 at 100 20
