  - type: choice
    after: what-hashcode-is
    prompt: "`a.hashCode() == b.hashCode()` is true. What does that tell you about `a.equals(b)`?"
    choices:
      - "It must be true"
      - "It must be false"
      - "It may be true or false"
    answer: 3
    why: "The rule goes one way only: equal objects must have equal hash codes, but unequal objects may share one too. `\"Aa\"` and `\"BB\"` both have the hash code 2112, and they aren't equal. Only `equals` can tell."

