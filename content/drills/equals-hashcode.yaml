drills:
  - type: predict
    after: equals-again
    classes: |
      class Stamp {
          private String country;
          private int year;

          public Stamp(String country, int year) {
              this.country = country;
              this.year = year;
          }

          public boolean equals(Object compared) {
              if (this == compared) {
                  return true;
              }
              if (!(compared instanceof Stamp)) {
                  return false;
              }
              Stamp other = (Stamp) compared;
              return this.country.equals(other.country) && this.year == other.year;
          }
      }
    body: |
      ArrayList<Stamp> album = new ArrayList<>();
      album.add(new Stamp("Peru", 1985));
      HashMap<Stamp, Integer> pages = new HashMap<>();
      pages.put(new Stamp("Peru", 1985), 12);
      System.out.println(album.contains(new Stamp("Peru", 1985)) + " " + pages.get(new Stamp("Peru", 1985)));
    why: "The list's `contains` compares with `equals`, which Stamp has, so it finds the equal stamp. The map compares hash codes first, and Stamp has no `hashCode` of its own: each new Stamp gets Java's default one, which in practice is almost certainly a different number, so `get` never gets as far as `equals` and gives `null`."

  - type: predict
