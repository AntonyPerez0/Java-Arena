              if (this == compared) {
                  return true;
              }
              if (!(compared instanceof Booking)) {
                  return false;
              }
              Booking other = (Booking) compared;
              return this.train == other.train && this.seat == other.seat;
          }

          public int hashCode() {
              return Objects.hash(this.train, this.seat, this.passenger); // BUG
          }
