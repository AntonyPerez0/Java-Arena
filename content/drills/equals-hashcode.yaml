    solution:
      Color.java: |
        import java.util.Objects;

        public class Color {
            private int red;
            private int green;
            private int blue;

            public Color(int red, int green, int blue) {
                this.red = red;
                this.green = green;
                this.blue = blue;
            }

            public boolean equals(Object compared) {
                if (this == compared) {
                    return true;
                }
                if (!(compared instanceof Color)) {
                    return false;
                }
                Color other = (Color) compared;
                return this.red == other.red && this.green == other.green && this.blue == other.blue;
            }

            public int hashCode() {
                return Objects.hash(this.red, this.green, this.blue);
            }

            public String toString() {
                return "(" + this.red + ", " + this.green + ", " + this.blue + ")";
            }
        }
      Main.java: |
        import java.util.ArrayList;
        import java.util.HashMap;

        public class Main {
            public static void main(String[] args) {
                ArrayList<Color> pixels = new ArrayList<>();
                pixels.add(new Color(255, 0, 0));
                pixels.add(new Color(0, 0, 255));
                pixels.add(new Color(0, 0, 255));
                pixels.add(new Color(255, 0, 0));
                pixels.add(new Color(0, 0, 255));
                System.out.println(mostCommon(pixels));
            }

            public static Color mostCommon(ArrayList<Color> pixels) {
                HashMap<Color, Integer> counts = new HashMap<>();
                for (Color pixel : pixels) {
                    if (counts.containsKey(pixel)) {
                        counts.put(pixel, counts.get(pixel) + 1);
                    } else {
                        counts.put(pixel, 1);
                    }
                }
                Color best = pixels.get(0);
                for (Color pixel : pixels) {
                    if (counts.get(pixel) > counts.get(best)) {
                        best = pixel;
                    }
                }
                return best;
            }
        }
    hints:
      - "Color's `equals` compares the three ints, and `hashCode` can be `Objects.hash(this.red, this.green, this.blue)`, with `import java.util.Objects;` at the top of `Color.java`."
      - "First count: go through the pixels, and put each one in the map with its count plus one, or with 1. Then go through the list again, not the map, and keep the pixel whose count is bigger than the best so far, with `>`. Going through the list in its own order makes the first color win a tie."
