      String quiet = loud.toLowerCase();
      System.out.println((word == quiet) + " " + word.equals(quiet) + " " + (word.hashCode() == quiet.hashCode()));
    why: "`loud` is `TEA`, which has capital letters to change, so `toLowerCase` makes a new String object, and `==` is false. It has the same characters as `word`, so `equals` is true, and equal Strings always have equal hash codes."

  - type: predict
    after: writing-hashcode
    classes: |
      class Tile {
          private int x;
          private int y;

          public Tile(int x, int y) {
              this.x = x;
              this.y = y;
          }

          public boolean equals(Object compared) {
              if (this == compared) {
                  return true;
              }
              if (!(compared instanceof Tile)) {
                  return false;
              }
              Tile other = (Tile) compared;
              return this.x == other.x && this.y == other.y;
          }

          public int hashCode() {
              return 31 * this.x + this.y;
          }
      }
    body: |
      Tile a = new Tile(2, 5);
      Tile b = new Tile(1, 36);
      System.out.println(a.hashCode() + " " + b.hashCode() + " " + a.equals(b));
    why: "31 * 2 + 5 is 67, and so is 31 * 1 + 36. The two tiles have the same hash code, but they aren't equal. That's allowed: the rule only asks equal objects to have equal hash codes. A map would keep both tiles as keys, in the same bucket, and `equals` would tell them apart."

