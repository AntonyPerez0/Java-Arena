topic: generics
drills:
  - type: predict
    after: why-type-parameters
    classes: |
      class Pouch<T> {
          private T item;

          public Pouch(T item) {
              this.item = item;
          }

          public T get() {
              return this.item;
          }

          public T swap(T newItem) {
              T old = this.item;
              this.item = newItem;
              return old;
          }
      }
    body: |
      Pouch<String> pouch = new Pouch<String>("coin");
      String first = pouch.swap("key");
      String second = pouch.swap(first);
      System.out.println(first + " " + second + " " + pouch.get());
    why: "`swap` puts the new item in and returns the old one. The first swap returns `coin` and leaves `key` in the pouch. The second puts `coin` back and returns `key`. So the pouch holds `coin` again."

  - type: predict
    after: type-arguments
    classes: |
      class Pouch<T> {
          private T item;

          public Pouch(T item) {
              this.item = item;
          }

          public T get() {
              return this.item;
          }
      }
    body: |
      Pouch<Integer> whole = new Pouch<>(9);
      Pouch<Double> decimal = new Pouch<>(9.0);
      Pouch<String> text = new Pouch<>("9");
      System.out.println(whole.get() / 2 + " " + decimal.get() / 2 + " " + text.get() + 2);
    why: "The type argument decides what `get()` returns. An Integer divided by 2 drops the decimals, 4; a Double keeps them, 4.5. The String `\"9\"` followed by `+ 2` is joined with it, `92`."

  - type: predict
    after: several-type-parameters
    classes: |
      class Duo<A, B> {
          private A first;
          private B second;

          public Duo(A first, B second) {
              this.first = first;
              this.second = second;
          }

          public A getFirst() {
              return this.first;
          }

          public B getSecond() {
              return this.second;
          }

          public Duo<B, A> swapped() {
              return new Duo<>(this.second, this.first);
          }
      }
    body: |
      Duo<String, Integer> stop = new Duo<>("Oslo", 3);
      Duo<Integer, String> back = stop.swapped();
      System.out.println(back.getFirst() + stop.getSecond() + " " + stop.getFirst() + stop.getSecond());
    why: "`back` is a `Duo<Integer, String>`, so `back.getFirst()` is the Integer 3, and 3 + 3 adds up to 6 before any String comes along. Then `\" \"` makes the rest text: `Oslo` and `3` are joined, `Oslo3`."

  - type: predict
    after: generic-interfaces
    classes: |
      interface Rater<T> {
          int rate(T item);
      }

      class LengthRater implements Rater<String> {
          @Override
          public int rate(String item) {
              return item.length();
          }
      }

      class Doubler implements Rater<Integer> {
          @Override
          public int rate(Integer item) {
              return item * 2;
          }
      }
    body: |
      Rater<String> words = new LengthRater();
      Rater<Integer> numbers = new Doubler();
      System.out.println(words.rate("12") + numbers.rate(12));
    why: "LengthRater is a `Rater<String>`: it rates the text `\"12\"` by its length, 2. Doubler is a `Rater<Integer>`: it rates the number 12 as 24. Both return ints, so they add up to 26."

  - type: predict
    after: putting-it-together
    classes: |
      class Bag<T> {
          private ArrayList<T> items;

          public Bag() {
              this.items = new ArrayList<>();
          }

          public void add(T item) {
              this.items.add(item);
          }

          public void takeOut(T item) {
              this.items.remove(item);
          }

          @Override
          public String toString() {
              return this.items.toString();
          }
      }
    body: |
      Bag<Integer> bag = new Bag<>();
      bag.add(5);
      bag.add(0);
      bag.add(9);
      bag.takeOut(0);
      System.out.println(bag);
    why: "Inside Bag, `item` is a T, an object, never an int. So `remove(item)` is the version of `remove` that takes an object and removes an element equal to it: the 0, not the element at index 0, which History's `remove(0)` would remove. The bag keeps `[5, 9]`."

  - type: fill
    after: why-type-parameters
    prompt: "Fill in the blank, a type, so that `getValue` returns what the field holds, whatever its type."
    classes: |
      class Field<T> {
          private String label;
          private T value;

          public Field(String label, T value) {
              this.label = label;
              this.value = value;
          }

          public [[T]] getValue() {
              return this.value;
          }
      }
    body: |
      Field<Integer> price = new Field<Integer>("price", 12);
      int doubled = price.getValue() * 2;
      System.out.println(doubled);
    why: "The value is a T, so `getValue` returns a T. For a `Field<Integer>`, that's an Integer, which can be doubled. With `Object`, the multiplication wouldn't compile, and with `Integer`, the class wouldn't: a T isn't always an Integer."

