    solution:
      Callouts.java: |
        import java.util.ArrayList;

        public class Callouts<T> {
            private ArrayList<T> said;

            public Callouts() {
                this.said = new ArrayList<>();
            }

            public void say(T item) {
                this.said.add(item);
            }

            public int timesSaid(T item) {
                int count = 0;
                for (T one : this.said) {
                    if (one.equals(item)) {
                        count++;
                    }
                }
                return count;
            }

            public T firstRepeat() {
                ArrayList<T> heard = new ArrayList<>();
                for (T one : this.said) {
                    if (heard.contains(one)) {
                        return one;
                    }
                    heard.add(one);
                }
                return null;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Callouts<String> animals = new Callouts<>();
                animals.say("fox");
                animals.say("owl");
                animals.say("cat");
                animals.say("owl");
                animals.say("fox");
                System.out.println(animals.timesSaid("fox") + " " + animals.timesSaid("cat") + " " + animals.timesSaid("yak"));
                System.out.println(animals.firstRepeat());
                Callouts<Integer> numbers = new Callouts<>();
                numbers.say(7);
                numbers.say(13);
                numbers.say(21);
                numbers.say(13);
                int repeated = numbers.firstRepeat();
                System.out.println("Out on " + repeated);
            }
        }
    hints:
      - "The header is `public class Callouts<T>`, with `private ArrayList<T> said;`. `say` adds to the list, and `timesSaid` counts the elements that are `equals` to the item: T is an object, and every object has `equals`."
      - "In `firstRepeat`, keep a second `ArrayList<T>` of what you've gone past. Go through `said` in order: an item that's already in that list (`contains` uses `equals`) is the answer; otherwise add it. After the loop, return `null`."
    require:
      - pattern: \b(?:Array)?List\s*<\s*\w+\s*>
        message: "Keep what was said in an `ArrayList<T>`, or in a `List<T>` that holds one."
