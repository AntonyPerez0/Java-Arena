    body: |
      Pouch<[[Character]]> initial = new Pouch<>('A');
      char letter = initial.get();
      System.out.println(letter + "da");
    why: "`char` is a primitive type, so it can't be a type argument. Its wrapper class is `Character`, and Java converts `'A'` into a Character and back by itself."

  - type: bug
    after: why-type-parameters
    prompt: "The program should print `map`. Which line is wrong?"
    classes: |
      class Pouch<T> {
          private T item;

          public Pouch<T>(T item) { // BUG
              this.item = item;
          }

          public T get() {
              return this.item;
          }
      }
    body: |
      Pouch<String> pouch = new Pouch<String>("map");
      System.out.println(pouch.get());
    fix: "public Pouch(T item) {"
    why: "The type parameter is written once, after the class's name in the class header. A constructor is named after the class alone, `public Pouch(T item)`, and it can use T because it's inside the class."

  - type: bug
    after: generic-interfaces
    prompt: "The program should print `true false`. Which line is wrong?"
    classes: |
      interface Rule<T> {
          boolean allows(T value);
      }

      class Even implements Rule<Integer> {
          @Override
          public boolean allows(int value) { // BUG
              return value % 2 == 0;
          }
      }
    body: |
      Rule<Integer> even = new Even();
      System.out.println(even.allows(4) + " " + even.allows(7));
    fix: "public boolean allows(Integer value) {"
    why: "With T chosen as Integer, the interface's method is `allows(Integer value)`. A method that takes an `int` is a different method, so `@Override` fails and Even doesn't have the method it promised. Inside, `value % 2` works on an Integer just as well."

  - type: compiles
    after: type-arguments
    classes: |
      class Pouch<T> {
          private T item;

          public Pouch(T item) {
              this.item = item;
          }

          public T get() {
              return this.item;
          }
      }
    body: |
      Pouch<Pouch<String>> outer = new Pouch<>(new Pouch<>("ring"));
      System.out.println(outer.get().get());
    why: "Yes. A type argument can be any class or interface, a generic one too: `outer` is a pouch whose T is `Pouch<String>`. `outer.get()` returns the inner pouch, and its `get()` returns the String."

  - type: compiles
    after: putting-it-together
    classes: |
      class Caption<T> {
          private T text;

          public Caption(T text) {
              this.text = text;
          }

          public int width() {
              return this.text.length();
          }
      }
    body: |
      Caption<String> caption = new Caption<>("Harbor at dawn");
      System.out.println(caption.width());
    why: "No. Inside Caption, T could stand for any class or interface, and most have no `length()`: javac says `cannot find symbol` for a variable `of type T`. A value of type T can only use Object's methods, whatever type a Caption is later created with."

  - type: choice
    after: type-arguments
    prompt: "Which line compiles?"
    choices:
      - "`Pouch<double> weight = new Pouch<>(2.5);`"
      - "`Pouch<Double> weight = new Pouch<>(2);`"
      - "`Pouch<Double> weight = new Pouch<>(2.5);`"
      - "`Pouch<> weight = new Pouch<Double>(2.5);`"
    answer: 3
    why: "A type argument must be a reference type (a class, an interface or an array type, never a primitive type), so `double` won't do. Java turns `2.5` into a Double, but it never turns the int `2` into a Double. And the diamond goes after `new`, where Java can work it out from the variable's type; the variable needs the full type."

  - type: choice
    after: generic-interfaces
    prompt: "`Rule<T>` is an interface with one method, `boolean allows(T value)`. Which class header gives a class that can be a `Rule<String>` or a `Rule<Integer>`, whichever it's created as?"
    choices:
      - "`public class Anything implements Rule<T>`"
      - "`public class Anything<T> implements Rule<T>`"
      - "`public class Anything implements Rule<Object>`"
      - "`public class Anything<T> implements Rule<String>`"
    answer: 2
    why: "The class needs a type parameter of its own to hand on to the interface, as `OneOf<T> implements Rule<T>` does. Without `<T>` after the class's name, T is unknown and the first header doesn't compile. The third is a Rule for Objects only, and the fourth a Rule for Strings only, whatever T is."

  - type: boss
    after: putting-it-together
    prompt: |
      In a party game, the players take turns saying an animal, or in another round a number, and whoever says something that was already said is out. In `Callouts.java`, write the class `Callouts<T>`, which keeps what was said, in order, in an `ArrayList<T>` (a `List<T>` variable that holds an ArrayList is fine too), with:

      - a constructor `Callouts()`, which starts with nothing said
      - `say(T item)`, which records one thing said
      - `timesSaid(T item)`, which returns how many times that item was said
      - `firstRepeat()`, which goes through what was said, in order, and returns the first item that had already been said before it. When nothing was said twice, it returns `null`.

      The check runs:

      ```java fragment
      Callouts<String> animals = new Callouts<>();
      animals.say("fox");
      animals.say("owl");
      animals.say("cat");
      animals.say("owl");
      animals.say("fox");
      System.out.println(animals.timesSaid("fox") + " " + animals.timesSaid("cat") + " " + animals.timesSaid("yak"));
      System.out.println(animals.firstRepeat());
      Callouts<Integer> numbers = new Callouts<>();
      numbers.say(7);
      numbers.say(13);
      numbers.say(21);
      numbers.say(13);
      int repeated = numbers.firstRepeat();
      System.out.println("Out on " + repeated);
      ```

      and expects:

      ```
      2 1 0
      owl
      Out on 13
      ```
