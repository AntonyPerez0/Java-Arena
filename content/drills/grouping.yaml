topic: grouping
drills:
  - type: predict
    after: list-as-value
    body: |
      HashMap<String, ArrayList<String>> beds = new HashMap<>();
      beds.getOrDefault("North", new ArrayList<>()).add("kale");
      System.out.println(beds.size());
      System.out.println(beds.getOrDefault("North", new ArrayList<>()));
    why: "There's no North in the map, so `getOrDefault` returns the new list it was given, and the kale goes on that list. Nothing ever puts the list in the map, so the map stays empty: its size is 0, and the second `getOrDefault` gives another new, empty list. To keep the kale, the list has to be stored with `put`."

  - type: predict
    after: list-as-value
    body: |
      HashMap<String, ArrayList<String>> clubs = new HashMap<>();
      ArrayList<String> members = new ArrayList<>();
      clubs.put("Chess", members);
      clubs.put("Drama", members);
      clubs.get("Chess").add("Amira");
      System.out.println(clubs.get("Drama"));
    why: "Both keys refer to the same list object: there's only one `new ArrayList<>()`. Adding Amira through Chess adds her to that one list, so Drama shows her too. Each key needs a list of its own, created with `new` for that key."

  - type: predict
    after: counting-and-grouping
    body: |
      String[] orders = {"tea", "soup", "tea", "pie", "tea"};
      HashMap<String, Integer> counts = new HashMap<>();
      for (String order : orders) {
          counts.put(order, counts.getOrDefault(order, 0) + 1);
      }
      System.out.println(counts.get("tea") + " " + counts.size() + " " + counts.get("cake"));
    why: "Tea was ordered 3 times. The map has one key for each different dish: tea, soup and pie, so its size is 3. `get` gives `null` for a key that isn't in the map, and `null` joined to a String prints as `null`. `getOrDefault(\"cake\", 0)` would have given 0."

  - type: predict
    after: counting-and-grouping
    body: |
      HashMap<String, ArrayList<String>> byTable = new HashMap<>();
      byTable.put("3", new ArrayList<>());
      byTable.put("12", new ArrayList<>());
      byTable.put("7", new ArrayList<>());
      ArrayList<String> tables = new ArrayList<>(byTable.keySet());
      Collections.sort(tables);
      System.out.println(tables);
    why: "The keys are Strings, not numbers, so they're sorted character by character (module 28). `\"12\"` starts with `1`, which comes before `3` and `7`. With `Integer` keys, `Collections.sort` would give `[3, 7, 12]`."

  - type: predict
    after: groups-in-a-class
    classes: |
      class Register {
          private HashMap<String, ArrayList<String>> clubs;

          public Register() {
              this.clubs = new HashMap<>();
          }

          public void join(String club, String student) {
              if (!this.clubs.containsKey(club)) {
                  this.clubs.put(club, new ArrayList<>());
              }
              this.clubs.get(club).add(student);
          }

          public void leave(String club, String student) {
              if (this.clubs.containsKey(club)) {
                  ArrayList<String> members = this.clubs.get(club);
                  members.remove(student);
                  if (members.isEmpty()) {
                      this.clubs.remove(club);
                  }
              }
          }

          public ArrayList<String> clubNames() {
              ArrayList<String> names = new ArrayList<>(this.clubs.keySet());
              Collections.sort(names);
              return names;
          }
      }
    body: |
      Register register = new Register();
      register.join("Drama", "Leo");
      register.join("Chess", "Amira");
      register.join("Art", "Mei");
      register.join("Chess", "Amira");
      register.leave("Chess", "Amira");
      register.leave("Drama", "Leo");
      System.out.println(register.clubNames());
    why: "Amira joined Chess twice, so its list has her twice, and `remove` takes out only the first copy: Chess still has a member. Leo was Drama's only member, so leaving empties the list and the club is removed. `clubNames` sorts what's left."

  - type: fill
    after: list-as-value
    prompt: Fill in the blank, so that each club gets a list of its own the first time someone joins it.
    body: |
      HashMap<String, ArrayList<String>> clubs = new HashMap<>();
      String[] joins = {"Chess", "Art", "Chess"};
      for (String club : joins) {
          if (!clubs.[[containsKey]](club)) {
              clubs.put(club, new ArrayList<>());
          }
          clubs.get(club).add("member");
      }
      System.out.println(clubs.get("Chess").size());
    why: "`containsKey(club)` is true when the club is already a key. With the `!`, the `if` puts a new list in the map only for a club's first member, so the second Chess member goes on the same list as the first."

  - type: fill
