    prompt: "Fill in the blank, an expression, so that the plants are grouped by the bed they grow in."
    classes: |
      class Plant {
          private String name;
          private String bed;

          public Plant(String name, String bed) {
              this.name = name;
              this.bed = bed;
          }

          public String getName() {
              return this.name;
