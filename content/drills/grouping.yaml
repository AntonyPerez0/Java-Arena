  - type: bug
    after: counting-and-grouping
    prompt: "The program should print `2 1`. Which line is wrong?"
    body: |
      String[] dishes = {"soup", "curry", "soup"};
      HashMap<String, Integer> counts = new HashMap<>();
      for (String dish : dishes) {
          counts.put(dish, counts.getOrDefault(dish, 1) + 1); // BUG
      }
      System.out.println(counts.get("soup") + " " + counts.get("curry"));
    fix: counts.put(dish, counts.getOrDefault(dish, 0) + 1);
    why: "The default is the count of a dish that hasn't been seen yet, and that's 0. With 1, the first order of every dish already counts as 2, so the program prints `3 2`."

  - type: compiles
    after: list-as-value
    body: |
      HashMap<String, ArrayList<String>> clubs = new HashMap<>();
      clubs.put("Chess", "Amira");
      System.out.println(clubs.get("Chess"));
    why: "No. The map's values are lists, `ArrayList<String>`, and `\"Amira\"` is a String: javac says `incompatible types`. Put a list in the map for the club, and add the name to that list: `clubs.get(\"Chess\").add(\"Amira\")`."

  - type: compiles
    after: counting-and-grouping
    body: |
      HashMap<String, Integer> counts = new HashMap<>();
      counts.put("soup", 2);
      counts.put("curry", 3);
      ArrayList<String> dishes = counts.keySet();
      Collections.sort(dishes);
      System.out.println(dishes);
    why: "No. `keySet()` gives the map's keys as a set, which isn't an ArrayList: javac says `incompatible types`. To sort the keys, copy them into a new list first, with `new ArrayList<>(counts.keySet())`."

  - type: choice
    after: counting-and-grouping
    prompt: "A program prints every group of a `HashMap<String, ArrayList<String>>` by going through `keySet()` directly. In what order do the groups come out?"
    choices:
      - "In alphabetical order of the keys"
      - "In the order the keys were first added"
      - "In an order set by the keys' hash codes, which isn't the order they were added in and can't be relied on"
    answer: 3
    why: "A HashMap places its keys by their hash codes, and goes through them in that order. For String keys it's the same on every run, but it's not alphabetical and not the adding order, and more keys can change it. When the order matters, copy the keys into a list and sort it with `Collections.sort`."

  - type: choice
    after: fast-lookups
    prompt: "Why doesn't finding a key in a hash map get slower as the map grows?"
    choices:
      - "The key's hash code tells the map where to look, so it compares the key only with the few entries stored there"
      - "The map keeps its keys sorted and does a binary search"
      - "The map goes through all its keys, but it does so faster than a list does"
      - "The map keeps the keys used most often at the front"
    answer: 1
    why: "The hash code picks one bucket, and only the entries in that bucket are compared with the key. As the map grows, it adds buckets and spreads its entries out, so each bucket stays small. A HashMap doesn't keep its keys sorted, and it never goes through all of them to find one."

  - type: choice
    after: fast-lookups
    prompt: Which of these jobs fits a list better than a hash map?
    choices:
      - "Finding a student by card number"
      - "Keeping every song a player has played, in the order played, the same song possibly many times"
      - "Counting how many times each dish was ordered"
    answer: 2
    why: "A list keeps its values in order, and the same value as often as it's added. A map keeps each key once, in an order of its own, but finds a key fast, which suits finding a student by card and counting by dish."

  - type: boss
    after: counting-and-grouping
    prompt: |
      Read words, one per line, until an empty line. Group them by their first letter, and print each letter and its words, like `m: [moon, mist]`: the letters in alphabetical order, and the words of each letter in the order they were read. For the input `sun`, `moon`, `sea`, `mist`, `star` and an empty line, the program prints:

      ```
      m: [moon, mist]
      s: [sun, sea, star]
      ```
    seed: |
      import java.util.ArrayList;
      import java.util.Collections;
      import java.util.HashMap;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);

          }
      }
    solution: |
      import java.util.ArrayList;
      import java.util.Collections;
      import java.util.HashMap;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              HashMap<String, ArrayList<String>> byLetter = new HashMap<>();
              while (true) {
                  String word = scanner.nextLine();
                  if (word.isEmpty()) {
                      break;
                  }
                  String first = word.substring(0, 1);
                  if (!byLetter.containsKey(first)) {
                      byLetter.put(first, new ArrayList<>());
                  }
                  byLetter.get(first).add(word);
              }

              ArrayList<String> letters = new ArrayList<>(byLetter.keySet());
              Collections.sort(letters);
              for (String letter : letters) {
                  System.out.println(letter + ": " + byLetter.get(letter));
              }
          }
      }
    hints:
      - "Keep a `HashMap<String, ArrayList<String>>`. Each word's key is its first letter, `word.substring(0, 1)`, and the word goes on that letter's list, which is created the first time the letter comes up."
      - "After reading, copy the keys into a list with `new ArrayList<>(byLetter.keySet())`, sort it with `Collections.sort`, and print each letter with `byLetter.get(letter)`."
    require:
      - pattern: \bHashMap\b
        message: "Group the words in a `HashMap` from a letter to a list of words."
    tests:
      - stdin: |+
          sun
          moon
          sea
          mist
          star

      - stdin: |+
          zebra
          yak
          apple
          ant
          bee
          yarn
          ape

        hidden: true
      - stdin: |+
          kiwi

        hidden: true
