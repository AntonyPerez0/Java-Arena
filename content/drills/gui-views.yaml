topic: gui-views
drills:
  - type: predict
    after: form-and-result
    prompt: "This code runs inside `start`. What does it print? (Drills have no import lines, so JavaFX's classes are written with their full names.)"
    body: |
      javafx.scene.control.TextField name = new javafx.scene.control.TextField();
      javafx.scene.control.Label message = new javafx.scene.control.Label("");
      javafx.scene.control.Button checkIn = new javafx.scene.control.Button("Check in");
      checkIn.setOnAction(event -> {
          if (name.getText().trim().isEmpty()) {
              message.setText("Name first");
          } else {
              message.setText("Room for " + name.getText().trim());
          }
      });
      name.setText("   ");
      checkIn.fire();
      String first = message.getText();
      name.appendText("Rex ");
      checkIn.fire();
      System.out.println(first + " / " + message.getText());
    why: "Three spaces trim to an empty text, so the first click is refused with `Name first`. `appendText` adds `Rex ` after the spaces, and the trimmed text is then `Rex`, so the second click gets the room."

  - type: predict
    after: changing-center
    prompt: "This code runs inside `start`. What does it print? `getParent()` returns the pane a node is in, or `null`. (Drills have no import lines, so JavaFX's classes are written with their full names.)"
    body: |
      javafx.scene.layout.BorderPane frame = new javafx.scene.layout.BorderPane();
      javafx.scene.control.Label hall = new javafx.scene.control.Label("Great hall");
      javafx.scene.control.Label tower = new javafx.scene.control.Label("Tower");
      frame.setTop(new javafx.scene.control.Label("Menu"));
      frame.setCenter(hall);
      frame.setCenter(tower);
      System.out.println(frame.getChildren().size() + " " + (hall.getParent() == null) + " " + (frame.getCenter() == tower));
    why: "The center holds one node, so the second `setCenter` takes `hall` out and puts `tower` in. The BorderPane then holds two nodes, the menu label on top and the tower, and `hall` has no parent until it's put somewhere again."

  - type: predict
    after: views-as-classes
    prompt: "This code runs inside `start`. Two view classes, each with a `getView()` method. What does the program print? (Drills have no import lines, so JavaFX's classes are written with their full names.)"
    classes: |
      class HoursView {
          javafx.scene.Parent getView() {
              return new javafx.scene.layout.VBox(new javafx.scene.control.Label("Open 9 to 17"));
          }
      }

      class ToursView {
          private javafx.scene.layout.VBox view;

          ToursView() {
              this.view = new javafx.scene.layout.VBox(new javafx.scene.control.Label("Tours at 14"));
          }

          javafx.scene.Parent getView() {
              return this.view;
          }
      }
    body: |
      HoursView hours = new HoursView();
      ToursView tours = new ToursView();
      System.out.println((hours.getView() == hours.getView()) + " " + (tours.getView() == tours.getView()));
    why: "HoursView makes a new VBox at every call, so two calls give two different objects. ToursView makes its VBox once, in the constructor, and returns that same object every time, which is why a view built this way keeps what happens in it."

  - type: predict
    after: practice-app-logic
    prompt: "The turn goes round the cards in a fixed order, as in the capitals trainer. What does this print?"
    body: |
      String[] cards = {"Peru", "Kenya", "Japan"};
      int next = 0;
      String asked = "";
      for (int i = 0; i < 5; i++) {
          asked += cards[next] + " ";
          next++;
          if (next >= cards.length) {
              next = 0;
          }
      }
      System.out.println(asked + next);
    why: "After Japan, the last card, `next` reaches 3 and goes back to 0, so Peru and Kenya come again. After the fifth card, Kenya, `next` is 2: Japan would be next."

  - type: predict
    after: end-of-part-13
    prompt: "This code runs inside `start`. Each button's handler counts its own clicks in a two-dimensional array (module 47). What does it print? (Drills have no import lines, so JavaFX's classes are written with their full names.)"
    body: |
      int[][] clicks = new int[2][2];
      ArrayList<javafx.scene.control.Button> buttons = new ArrayList<>();
      for (int row = 0; row < 2; row++) {
          for (int column = 0; column < 2; column++) {
              int r = row;
              int c = column;
              javafx.scene.control.Button cell = new javafx.scene.control.Button("?");
              cell.setOnAction(event -> clicks[r][c]++);
              buttons.add(cell);
          }
      }
      buttons.get(1).fire();
      buttons.get(2).fire();
      buttons.get(1).fire();
      System.out.println(Arrays.deepToString(clicks));
    why: "The loops make the buttons row by row, so index 1 is row 0, column 1, and index 2 is row 1, column 0. Each lambda keeps its own copies `r` and `c`. The lambdas may change the array's cells: `clicks` itself always refers to the same array, so it's effectively final."

  - type: fill
