  - type: fill
    after: end-of-part-13
    prompt: "Clicks on a board of three cells: a click takes a free cell (one that is still `null`) for the player whose turn it is, and then the turn changes; a click on a taken cell is ignored. Fill in the blank, an operator."
    body: |
      String[] owners = new String[3];
      String turn = "Red";
      int[] clicks = {1, 1, 0};
      for (int cell : clicks) {
          if (owners[cell] [[==]] null) {
              owners[cell] = turn;
              if (turn.equals("Red")) {
                  turn = "Blue";
              } else {
                  turn = "Red";
              }
          }
      }
      System.out.println(Arrays.toString(owners) + " " + turn);
    why: "A cell is free while it's `null`, so the move happens when `owners[cell] == null`. Red takes cell 1, the second click on cell 1 is ignored, and Blue takes cell 0, which leaves the turn with Red."

  - type: bug
