    solution: |
      import javafx.application.Application;
      import javafx.scene.Scene;
      import javafx.scene.control.Button;
      import javafx.scene.layout.GridPane;
      import javafx.stage.Stage;

      public class Main extends Application {

          @Override
          public void start(Stage stage) {
              GridPane board = new GridPane();
              int[][] counts = new int[2][3];
              for (int row = 0; row < 2; row++) {
                  for (int column = 0; column < 3; column++) {
                      int r = row;
                      int c = column;
                      Button cell = new Button("0");
                      cell.setOnAction(event -> {
                          counts[r][c]++;
                          cell.setText("" + counts[r][c]);
                      });
                      board.add(cell, c, r);
                  }
              }

              stage.setScene(new Scene(board));
              stage.setTitle("Tally board");
              stage.show();
          }

          public static void main(String[] args) {
              launch(Main.class);
          }
      }
    hints:
      - "Two nested loops make the six buttons, and `board.add(cell, column, row)` puts each in its cell. A lambda can't use the loop variables: copy them first, `int r = row;` and `int c = column;`."
      - "The handler can read the button's own number, `Integer.valueOf(cell.getText())`, and set it one higher; or keep the counts in an `int[2][3]` array and use the copies `r` and `c` as its indexes."
    tests:
      - events: |
          click Button 5
          click Button 5
          click Button 1
      - events: []
        hidden: true
      - events: |
          click Button 6
          click Button 6
          click Button 6
          click Button 2
          click Button 4
        hidden: true

  - type: boss
    after: logic-and-views
    prompt: |
      The logic of an app that shows one page at a time, with Back and Next buttons. In `Pages.java`, write the class `Pages` (no JavaFX in it):

      - a constructor `Pages()`, which starts with no pages
      - `add(String name)`, which adds a page after the others
      - `current()`, which returns the name of the page that shows, or `null` when there are no pages. At first the first page shows.
      - `next()`, which moves to the next page and returns `true`; on the last page, or with no pages, it stays where it is and returns `false`
      - `back()`, which moves to the page before and returns `true`; on the first page, or with no pages, it stays and returns `false`

      The check runs:

      ```java fragment
      Pages pages = new Pages();
      System.out.println(pages.current() + " " + pages.next());
      pages.add("Welcome");
      pages.add("Rules");
      System.out.println(pages.back() + " " + pages.current());
      System.out.println(pages.next() + " " + pages.next() + " " + pages.current());
      ```

      and expects:

      ```
      null false
      false Welcome
      true false Rules
      ```
    seed:
      Pages.java: |
        import java.util.ArrayList;

        public class Pages {

        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Pages pages = new Pages();
                System.out.println(pages.current() + " " + pages.next());
                pages.add("Welcome");
                pages.add("Rules");
                System.out.println(pages.back() + " " + pages.current());
                System.out.println(pages.next() + " " + pages.next() + " " + pages.current());
            }
        }
    solution:
      Pages.java: |
        import java.util.ArrayList;

        public class Pages {
            private ArrayList<String> names;
            private int showing;

            public Pages() {
                this.names = new ArrayList<>();
            }

            public void add(String name) {
                this.names.add(name);
            }

            public String current() {
                if (this.names.isEmpty()) {
                    return null;
                }
                return this.names.get(this.showing);
            }

            public boolean next() {
                if (this.showing + 1 >= this.names.size()) {
                    return false;
                }
                this.showing++;
                return true;
            }

            public boolean back() {
                if (this.showing == 0) {
                    return false;
                }
                this.showing--;
                return true;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Pages pages = new Pages();
                System.out.println(pages.current() + " " + pages.next());
                pages.add("Welcome");
                pages.add("Rules");
                System.out.println(pages.back() + " " + pages.current());
                System.out.println(pages.next() + " " + pages.next() + " " + pages.current());
            }
        }
    hints:
      - "Keep the names in an `ArrayList<String>` and the index of the page that shows in an int, which starts at 0."
      - "`next()` can move only while `showing + 1` is below the list's size, and `back()` only while `showing` is above 0. `current()` returns `null` for an empty list, and otherwise the name at `showing`."
    tests:
      - call: |
          Pages pages = new Pages();
          System.out.println(pages.current() + " " + pages.next());
          pages.add("Welcome");
          pages.add("Rules");
          System.out.println(pages.back() + " " + pages.current());
          System.out.println(pages.next() + " " + pages.next() + " " + pages.current());
      - call: |
          Pages pages = new Pages();
          System.out.println(pages.back());
          pages.add("Start");
          System.out.println(pages.next() + " " + pages.current());
          pages.add("Map");
          pages.add("Score");
          pages.next();
          pages.next();
          System.out.println(pages.current() + " " + pages.next());
          pages.back();
          System.out.println(pages.current() + " " + pages.back() + " " + pages.back() + " " + pages.current());
        hidden: true
