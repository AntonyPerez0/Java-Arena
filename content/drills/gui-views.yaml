  - type: compiles
    after: end-of-part-13
    prompt: "This code runs inside `start`. Does it compile? (Drills have no import lines, so JavaFX's classes are written with their full names.)"
    body: |
      javafx.scene.control.Label shown = new javafx.scene.control.Label("");
      String[] teams = {"Herons", "Beavers"};
      for (String team : teams) {
          javafx.scene.control.Button button = new javafx.scene.control.Button(team);
          button.setOnAction(event -> shown.setText("Point for " + team));
          button.fire();
      }
      System.out.println(shown.getText());
    why: "It compiles, and prints `Point for Beavers`. The variable of a for-each loop is a new variable in every round, which never changes after it gets its value, so a lambda may use it. A counting loop's `int i` is one variable that changes, and a lambda can't use it without a copy."

  - type: compiles
    after: views-as-classes
    prompt: "This code runs inside `start`. Does it compile? (Drills have no import lines, so JavaFX's classes are written with their full names.)"
    classes: |
      class HoursView {
          javafx.scene.Node getView() {
              return new javafx.scene.layout.VBox(new javafx.scene.control.Label("Open 9 to 17"));
          }
      }
    body: |
      HoursView hours = new HoursView();
      javafx.scene.Scene scene = new javafx.scene.Scene(hours.getView());
      System.out.println("Ready");
    why: "A Scene's root must be a Parent, and `getView()` is declared to return a Node, which is more general: not every Node is a Parent. javac goes by the declared type, not by the VBox inside. That's why view classes return `Parent`: it fits both `new Scene(...)` and `setCenter(...)`."

  - type: choice
    after: changing-center
    prompt: An application has a menu along the top that should stay in place while the rest of the window changes from view to view. Which way fits it best?
    choices:
      - "A scene for each view, each with its own copy of the menu, and `stage.setScene(...)` to switch"
      - "A BorderPane with the menu in its top region, and `setCenter(...)` to switch the views"
      - "A new window (a new Stage) for each view"
    answer: 2
    why: "`setCenter` changes only the center region and leaves the menu as it is. A scene for each view replaces everything in the window, and since a node can be in one place at a time, each scene would need menu buttons of its own."

  - type: choice
    after: logic-and-views
    prompt: A savings app has a logic class `SavingsJar` and a view `DepositView` with a text field and a button. Which of these belongs in SavingsJar, not in the view?
    choices:
      - "Reading the text of the text field"
      - "Turning the field's text into an int with `Integer.valueOf`"
      - "The rule that an amount must be at least 1 euro"
      - "Showing a message in a label"
    answer: 3
    why: "The rule is about the data, so it goes in the logic class, where every view follows it and a test can check it without a window. Text fields, the text in them and labels are parts of the window, so the view handles them, and forwards the number to the jar."

