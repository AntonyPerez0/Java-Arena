    solution:
      Main.java: |
        import java.util.ArrayList;
        import java.util.List;

        public class Main {
            public static void main(String[] args) {
                List<Chargeable> devices = new ArrayList<>();
                devices.add(new Laptop(20));
                devices.add(new Headphones(80));
                devices.add(new Headphones(10));
                List<Chargeable> low = needCharging(devices, 50);
                System.out.println(low);
                chargeAll(low, 5);
                System.out.println(devices);
            }

            public static List<Chargeable> needCharging(List<Chargeable> devices, int limit) {
                List<Chargeable> low = new ArrayList<>();
                for (Chargeable device : devices) {
                    if (device.batteryPercent() < limit) {
                        low.add(device);
                    }
                }
                return low;
            }

            public static void chargeAll(List<Chargeable> devices, int minutes) {
                for (Chargeable device : devices) {
                    device.charge(minutes);
                }
            }
        }
      Chargeable.java: |
        public interface Chargeable {
            int batteryPercent();
            void charge(int minutes);
        }
      Laptop.java: |
        public class Laptop implements Chargeable {
            private int battery;

            public Laptop(int battery) {
                this.battery = battery;
            }

            @Override
            public int batteryPercent() {
                return this.battery;
            }

            @Override
            public void charge(int minutes) {
                this.battery += minutes;
                if (this.battery > 100) {
                    this.battery = 100;
                }
            }

            @Override
            public String toString() {
                return "Laptop " + this.battery + "%";
            }
        }
      Headphones.java: |
        public class Headphones implements Chargeable {
            private int battery;

            public Headphones(int battery) {
                this.battery = battery;
            }

            @Override
            public int batteryPercent() {
                return this.battery;
            }

            @Override
            public void charge(int minutes) {
                this.battery += 5 * minutes;
                if (this.battery > 100) {
                    this.battery = 100;
                }
            }

            @Override
            public String toString() {
                return "Headphones " + this.battery + "%";
            }
        }
    hints:
      - "`needCharging` makes a new `List<Chargeable>`, goes through `devices` with a for-each loop, adds each device whose `batteryPercent()` is below `limit`, and returns the new list."
      - "`chargeAll` calls `charge(minutes)` on every device; each object runs its own `charge`. The new list holds the same objects as `devices`, not copies, so charging the low ones shows up in `devices` too."
    require:
      - pattern: \bpublic\s+static\s+List<Chargeable>\s+needCharging\s*\(\s*List<Chargeable>\s+\w+\s*,\s*int\s+\w+\s*\)
        message: "Write the method as `public static List<Chargeable> needCharging(List<Chargeable> devices, int limit)`."
      - pattern: \bpublic\s+static\s+void\s+chargeAll\s*\(\s*List<Chargeable>\s+\w+\s*,\s*int\s+\w+\s*\)
        message: "Write the method as `public static void chargeAll(List<Chargeable> devices, int minutes)`."
