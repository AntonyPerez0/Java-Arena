      - `needCharging(List<Chargeable> devices, int limit)`, which returns a new list of the devices whose battery is below `limit`, in the same order
      - `chargeAll(List<Chargeable> devices, int minutes)`, which charges every device in the list for that many minutes

      The check runs:

      ```java fragment
      List<Chargeable> devices = new ArrayList<>();
      devices.add(new Laptop(20));
      devices.add(new Headphones(80));
      devices.add(new Headphones(10));
      List<Chargeable> low = needCharging(devices, 50);
      System.out.println(low);
      chargeAll(low, 5);
      System.out.println(devices);
      ```

      and expects:

      ```
      [Laptop 20%, Headphones 10%]
      [Laptop 25%, Headphones 80%, Headphones 35%]
      ```
