  - type: compiles
    after: variable-type
    classes: |
      interface Chargeable {
          int batteryPercent();
          void charge(int minutes);
      }
    body: |
      Chargeable gadget = new Chargeable();
      gadget.charge(10);
      System.out.println(gadget.batteryPercent());
    why: "No. An interface has no code to run, so there are no objects of it: javac says `Chargeable is abstract; cannot be instantiated`. A Chargeable variable refers to an object of some class that implements Chargeable."

  - type: compiles
    after: collection-interface
    body: |
      Set<String> tags = new HashSet<>();
      tags.add("garden");
      Collection<String> all = tags;
      List<String> sorted = new ArrayList<>(all);
      System.out.println(sorted.size());
    why: "Yes. A HashSet is a Set, and every Set is a Collection, so `all` can refer to it. `new ArrayList<>(...)` takes any Collection, and makes a list of its values."

  - type: choice
    after: several
    prompt: "A robot mower is an Appliance, and it can also be switched on and charged. Appliance is a class; Switchable and Chargeable are interfaces. Which header compiles?"
    choices:
      - "`public class RobotMower implements Switchable, Chargeable extends Appliance`"
      - "`public class RobotMower extends Appliance implements Switchable, Chargeable`"
      - "`public class RobotMower extends Appliance, Switchable, Chargeable`"
      - "`public class RobotMower implements Appliance, Switchable, Chargeable`"
    answer: 2
    why: "`extends` comes first, with the one superclass, and then `implements`, with the interfaces separated by commas. A class can't extend an interface, and it can't implement a class."

  - type: choice
    after: collection-interface
    prompt: "A method should accept an `ArrayList<String>`, a `HashSet<String>` and a map's `keySet()`. Which parameter type fits all three?"
    choices:
      - "`List<String>`"
      - "`Set<String>`"
      - "`Collection<String>`"
      - "`ArrayList<String>`"
    answer: 3
    why: "An ArrayList is a List, and a HashSet and a `keySet()` are Sets. List and Set both extend Collection, so only `Collection<String>` accepts all three. Inside the method, a for-each loop goes through any of them."

