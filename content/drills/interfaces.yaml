topic: interfaces
drills:
  - type: predict
    after: promise
    classes: |
      interface Switchable {
          void turnOn();
          void turnOff();
          boolean isOn();
      }

      class Humidifier implements Switchable {
          private int water;
          private boolean on;

          public void fill(int liters) {
              this.water += liters;
          }

          @Override
          public void turnOn() {
              if (this.water > 0) {
                  this.on = true;
              }
          }

          @Override
          public void turnOff() {
              this.on = false;
          }

          @Override
          public boolean isOn() {
              return this.on;
          }
      }
    body: |
      Humidifier humidifier = new Humidifier();
      humidifier.turnOn();
      boolean first = humidifier.isOn();
      humidifier.fill(2);
      humidifier.turnOn();
      System.out.println(first + " " + humidifier.isOn());
    why: "The interface only lists the headers: what `turnOn` does is up to Humidifier. Its `turnOn` does nothing while there's no water, so `first` is `false`. After `fill(2)`, the second `turnOn` switches it on."

  - type: predict
    after: variable-type
    classes: |
      interface Switchable {
          void turnOn();
          void turnOff();
          boolean isOn();
      }

      interface Chargeable {
          int batteryPercent();
          void charge(int minutes);
      }

      class Drone implements Switchable, Chargeable {
          private boolean on;
          private int battery;

          public Drone(int battery) {
              this.battery = battery;
          }

          @Override
          public void turnOn() {
              this.on = true;
          }

          @Override
          public void turnOff() {
              this.on = false;
          }

          @Override
          public boolean isOn() {
              return this.on;
          }

          @Override
          public int batteryPercent() {
              return this.battery;
          }

          @Override
          public void charge(int minutes) {
              this.battery += minutes;
          }
      }
    body: |
      Drone drone = new Drone(40);
      Switchable power = drone;
      Chargeable battery = drone;
      power.turnOn();
      battery.charge(15);
      System.out.println(drone.isOn() + " " + drone.batteryPercent() + " " + battery.batteryPercent());
    why: "`power` and `battery` aren't copies: all three variables refer to the one Drone object. Through `power` only Switchable's methods can be called, and through `battery` only Chargeable's, but both change the same drone. It's on, with 40 + 15 = 55 percent, whichever variable you ask."

  - type: predict
    after: return-and-lists
    classes: |
      interface Priced {
          int price();
      }

      class Magnet implements Priced {
          @Override
          public int price() {
              return 4;
          }
      }

      class Mug implements Priced {
          private boolean large;

          public Mug(boolean large) {
              this.large = large;
          }

          @Override
          public int price() {
              if (this.large) {
                  return 12;
              }
              return 9;
          }
      }
    pre: |
      public static Priced dearest(ArrayList<Priced> items) {
          Priced best = items.get(0);
          for (Priced item : items) {
              if (item.price() > best.price()) {
                  best = item;
              }
          }
          return best;
      }
    body: |
      ArrayList<Priced> basket = new ArrayList<>();
      basket.add(new Magnet());
      basket.add(new Mug(false));
      basket.add(new Magnet());
      basket.add(new Mug(true));
      int total = 0;
      for (Priced item : basket) {
          total += item.price();
      }
      System.out.println(total + " " + dearest(basket).price());
    why: "Each item in the list runs its own class's `price`: 4 for a magnet, 9 for a small mug and 12 for a large one, so the total is 4 + 9 + 4 + 12 = 29. `dearest` returns a Priced, the large mug, and its price is 12."

  - type: predict
    after: list-interface
    pre: |
      public static void addStop(List<String> route, String stop) {
          route.add(stop);
      }
    body: |
      ArrayList<String> stops = new ArrayList<>();
      stops.add("Harbor");
      List<String> same = stops;
      addStop(same, "Mill");
      List<String> copy = new ArrayList<>(stops);
      addStop(copy, "Depot");
      System.out.println(stops.size() + " " + copy.size() + " " + stops);
    why: "`same` is a second name for the list in `stops`, and `addStop` gets that same list, so Mill goes into `stops`. `new ArrayList<>(stops)` makes a separate list, so Depot goes only into `copy`. A List variable or parameter doesn't copy anything: it's just another way to refer to the ArrayList."

  - type: predict
    after: set-interface
    body: |
      Set<String> tags = new HashSet<>();
      String[] words = {"garden", "light", "Garden", "light", "garden"};
      for (String word : words) {
          tags.add(word);
      }
      System.out.println(tags.size() + " " + tags.contains("GARDEN") + " " + tags.add("light"));
    why: "A set keeps each value once, but `garden` and `Garden` are different Strings, so the set holds three: garden, light and Garden. `GARDEN` isn't one of them. `add` returns `false` when the value is there already, and light is."

  - type: fill
    after: promise
    prompt: "Fill in the blank, a word, so that the dehumidifier keeps Switchable's promise."
    classes: |
      interface Switchable {
          void turnOn();
          void turnOff();
          boolean isOn();
      }

      class Dehumidifier [[implements]] Switchable {
          private boolean on;

          @Override
          public void turnOn() {
              this.on = true;
          }

          @Override
          public void turnOff() {
              this.on = false;
          }

          @Override
          public boolean isOn() {
              return this.on;
          }
      }
    body: |
      Switchable device = new Dehumidifier();
      device.turnOn();
      System.out.println(device.isOn());
    why: "A class *implements* an interface: `class Dehumidifier implements Switchable`. `extends` is for a superclass. With an interface after `extends`, javac says `no interface expected here`."

  - type: fill
    after: collection-interface
    prompt: "Fill in the blank, a type, so that `average` accepts both the list and the set."
    pre: |
      public static int average([[Collection]]<Integer> numbers) {
          int sum = 0;
          for (int number : numbers) {
              sum += number;
          }
          return sum / numbers.size();
      }
    body: |
      List<Integer> list = new ArrayList<>();
      list.add(10);
      list.add(20);
      list.add(20);
      Set<Integer> set = new HashSet<>(list);
      System.out.println(average(list) + " " + average(set));
    why: "List and Set both extend Collection, so a `Collection<Integer>` parameter takes either. With `List<Integer>`, the call with the set wouldn't compile, and with `Set<Integer>`, the call with the list. The list averages 50 / 3, which is 16 in int division, and the set, which keeps 20 once, averages 30 / 2 = 15."

  - type: bug
    after: promise
    prompt: "The program should print `true`. Which line is wrong?"
    classes: |
      interface Switchable {
          void turnOn();
          void turnOff();
          boolean isOn();
      }

      class Fountain implements Switchable {
          private boolean on;

          @Override
          public void turnOn() {
              this.on = true;
          }

          @Override
          void turnOff() { // BUG
              this.on = false;
          }

          @Override
          public boolean isOn() {
              return this.on;
          }
      }
    body: |
      Fountain fountain = new Fountain();
      fountain.turnOn();
      System.out.println(fountain.isOn());
    fix: "public void turnOff() {"
    why: "The methods an interface lists are public, and a class may not make them less visible, so this doesn't compile: javac says `attempting to assign weaker access privileges; was public`. Every method that implements an interface's method is written with `public`."

