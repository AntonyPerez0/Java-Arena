  - type: fill
    after: binary-search-trees
    prompt: "Fill in the blank, an expression, so that `walk` visits the tree in order and prints its values from smallest to biggest."
    classes: |
      class Node {
          int value;
          Node left;
          Node right;

          Node(int value) {
              this.value = value;
          }
      }
    pre: |
      public static Node add(Node node, int value) {
          if (node == null) {
              return new Node(value);
          }
          if (value < node.value) {
              node.left = add(node.left, value);
          } else {
              node.right = add(node.right, value);
          }
          return node;
      }

      public static void walk(Node node) {
          if (node == null) {
              return;
          }
          walk(node.left);
          System.out.print(node.value + " ");
          walk([[node.right]]);
      }
    body: |
      Node root = null;
      int[] values = {8, 3, 10, 6, 1};
      for (int value : values) {
          root = add(root, value);
      }
      walk(root);
      System.out.println();
    why: "An in-order walk visits the left subtree, then the node, then the right subtree: `walk(node.right)`. In a search tree that's smallest first: `1 3 6 8 10`."

  - type: bug
    after: nodes-and-links
    prompt: "The loop should visit every bead, the last one too, so that the program prints `3 beads`. Which line is wrong?"
    classes: |
      class Bead {
          String color;
          Bead next;

          Bead(String color) {
              this.color = color;
          }
      }
    body: |
      Bead first = new Bead("red");
      first.next = new Bead("blue");
      first.next.next = new Bead("green");
      int count = 0;
      Bead current = first;
      while (current.next != null) { // BUG
          count++;
          current = current.next;
      }
      System.out.println(count + " beads");
    fix: "while (current != null) {"
    why: "`current.next != null` stops at the last bead, before counting it, so the loop counts 2. Testing `current != null` runs one more round, for the last bead, and stops after it. It also works for an empty chain, where `current.next` would crash."

  - type: bug
    after: array-deque
    prompt: "A chess app keeps the moves on a stack, so that it can take back the last one. The program should print `Take back Nf3`, and `pop` is how it takes a move back. Which line is wrong?"
    body: |
      var history = new java.util.ArrayDeque<String>();
      String[] moves = {"e4", "e5", "Nf3"};
      for (String move : moves) {
          history.offer(move); // BUG
      }
      System.out.println("Take back " + history.pop());
    fix: "history.push(move);"
    why: "`pop` takes from the front of the deque. `offer` adds at the back, so the first move stays at the front and `pop` returns `e4`. `push` adds at the front, so the last move is on top."

