      class Bead {
          String color;
          Bead next;

          Bead(String color) {
              this.color = color;
          }
      }
    body: |
      Bead a = new Bead("red");
      Bead b = new Bead("blue");
      Bead c = new Bead("green");
      a.next = b;
      b.next = c;
      a.next = c;
      String colors = "";
      Bead current = a;
      while (current != null) {
          colors += current.color + " ";
          current = current.next;
      }
      System.out.println(colors.trim());
    why: "`a.next = c;` replaces the link from red to blue with a link from red to green. Blue still refers to green, but nothing refers to blue any more, so the walk from `a` never reaches it: `red green`."

