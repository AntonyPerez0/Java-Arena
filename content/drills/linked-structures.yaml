    solution:
      BusRoute.java: |
        public class BusRoute {
            private StopNode head;
            private StopNode tail;

            public void addLast(String stop) {
                StopNode node = new StopNode(stop);
                if (this.tail == null) {
                    this.head = node;
                } else {
                    this.tail.next = node;
                }
                this.tail = node;
            }

            public void reverse() {
                StopNode previous = null;
                StopNode current = this.head;
                this.tail = this.head;
                while (current != null) {
                    StopNode following = current.next;
                    current.next = previous;
                    previous = current;
                    current = following;
                }
                this.head = previous;
            }

            @Override
            public String toString() {
                String result = "";
                StopNode current = this.head;
                while (current != null) {
                    result += current.stop;
                    if (current.next != null) {
                        result += " -> ";
                    }
                    current = current.next;
                }
                return result;
            }
        }
      StopNode.java: |
        public class StopNode {
            String stop;
            StopNode next;

            public StopNode(String stop) {
                this.stop = stop;
                this.next = null;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                BusRoute route = new BusRoute();
                route.addLast("Harbor");
                route.addLast("Market");
                route.addLast("Museum");
                route.addLast("Station");
                route.reverse();
                System.out.println(route);
                route.addLast("Depot");
                System.out.println(route);
            }
        }
    hints:
      - "Walk the route with two variables, `previous` (starting at `null`) and `current` (starting at `head`). Before changing `current.next`, keep the node after it in a third variable, or you lose the rest of the route."
      - "In each round: `following = current.next; current.next = previous; previous = current; current = following;`. The old head becomes the tail, and at the end `previous` is the new head."
    forbid:
      - pattern: \b(ArrayList|ArrayDeque|LinkedList|Stack)\b
        message: "Turn the links around in place, without a collection."
