    why: "8 is the root. 3 goes left of it and 10 right. 6 is smaller than 8 and bigger than 3, so it's the right child of 3. 1 is the left child of 3, and 7 goes left at 8, right at 3 and right at 6. So `root.left.right` is 6, and its right child is 7."

