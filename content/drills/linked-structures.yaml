      var stack = new java.util.ArrayDeque<Integer>();
      stack.push(1);
      stack.push(2);
      stack.push(3);
      int top = stack.pop();
      stack.push(top * 10);
      System.out.println(stack.pop() + stack.pop());
    why: "The 3 is popped and 30 pushed in its place, so the stack is 30, 2, 1 from the top. The last line pops 30 and then 2. Both are Integers, so `+` adds them: 32."

  - type: predict
    after: array-deque
    body: |
      var deque = new java.util.ArrayDeque<String>();
      deque.offer("b");
      deque.push("a");
      deque.offer("c");
      deque.push("z");
      System.out.println(deque.poll() + deque.pollLast() + deque);
    why: "`push` adds at the front and `offer` at the back, so the deque is `[z, a, b, c]`. `poll` takes `z` from the front and `pollLast` takes `c` from the back, which leaves `[a, b]`: `zc[a, b]`."

