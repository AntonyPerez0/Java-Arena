  - type: predict
    after: own-list
    classes: |
      class PhotoRoll {
          private String[] photos;
          private int size;

          public PhotoRoll() {
              this.photos = new String[2];
              this.size = 0;
          }

          public void add(String photo) {
              if (this.size == this.photos.length) {
                  String[] bigger = new String[this.photos.length * 2];
                  for (int i = 0; i < this.size; i++) {
                      bigger[i] = this.photos[i];
                  }
                  this.photos = bigger;
              }
              this.photos[this.size] = photo;
              this.size++;
          }

          public int size() {
              return this.size;
          }

          public int room() {
              return this.photos.length;
          }
      }
    body: |
      PhotoRoll roll = new PhotoRoll();
      String[] photos = {"beach", "dog", "cake", "bridge", "moon"};
      for (String photo : photos) {
          roll.add(photo);
      }
      System.out.println(roll.size() + " " + roll.room());
    why: "The array grows only when a photo arrives and every place is taken. The third photo finds 2 of 2 used, and the array becomes 4 long; the fifth finds 4 of 4 used, and it becomes 8 long. So 5 photos sit in an array of 8."

