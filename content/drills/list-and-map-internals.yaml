    why: "No. javac says `generic array creation`. An array of a type with a type argument, such as `ArrayList<String>`, can't be created, for the same reason as `new T[4]`. SimpleMap creates `new ArrayList[8]`, without the angle brackets, and suppresses the unchecked note."

  - type: choice
    after: collisions-and-growing
    prompt: "Why does SimpleMap's `grow` put every pair again, instead of copying old bucket 5 into new bucket 5?"
    choices:
      - "A key's bucket depends on the number of buckets, so after growing, `get` looks for many keys in another bucket"
      - "Growing changes the keys' hash codes"
      - "An ArrayList can't be copied from one array into another"
      - "The pairs must be sorted by key in the new array"
    answer: 1
    why: "The bucket is the hash code's remainder after dividing by the number of buckets. A hash code of 2157 gives bucket 5 out of 8, but bucket 13 out of 16. The hash code itself never changes; the number it's divided by does."

  - type: choice
    after: why-lookups-are-fast
    prompt: "A class's `hashCode` returns 42 for every object, and its `equals` works. What happens with 10,000 such keys in your SimpleMap?"
    choices:
      - "Only one key is kept, since the hash codes are all equal"
      - "They all share one bucket, so the map still works, but `get` compares with key after key"
      - "The program crashes when the second key is put"
      - "The map grows until each key has a bucket of its own"
    answer: 2
    why: "Equal hash codes don't make keys equal: `equals` tells them apart, so all 10,000 are kept. But they all land in one bucket, and growing can't spread them out, since every key picks the same bucket however many there are. A lookup becomes a linear search."

  - type: boss
    after: get-and-search
    prompt: |
      A step counter keeps the steps of each day. In `NumberList.java`, write the class `NumberList`, which keeps whole numbers in an `int` array that starts with room for 2 and becomes twice as long when it's full. No ArrayList. It has:

      - `add(int number)`, which adds a number at the end
      - `get(int index)`, which returns the number at that index; an index below 0, or at the size or above, throws an IndexOutOfBoundsException with the message `Index 3 out of bounds for size 3` (with the index and the size in it)
      - `size()`, the number of numbers added
      - `sum()`, the sum of the numbers added

      The check runs:

      ```java fragment
      NumberList steps = new NumberList();
      steps.add(4200);
      steps.add(8100);
      steps.add(6400);
      System.out.println(steps.size() + " " + steps.get(1) + " " + steps.sum());
      try {
          steps.get(3);
      } catch (IndexOutOfBoundsException e) {
          System.out.println(e.getMessage());
      }
      ```

      and expects:

      ```
      3 8100 18700
      Index 3 out of bounds for size 3
      ```
