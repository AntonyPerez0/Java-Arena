  - type: predict
    after: own-hash-map
    body: |
      int buckets = 8;
      int[] keys = {21, 13, -3, 16};
      for (int key : keys) {
          System.out.print(Math.abs(Integer.valueOf(key).hashCode() % buckets) + " ");
      }
      System.out.println();
    why: "An Integer's hash code is its own value. 21 % 8 and 13 % 8 are both 5, so those two keys share a bucket. -3 % 8 is -3, which `Math.abs` makes 3, and 16 % 8 is 0."

