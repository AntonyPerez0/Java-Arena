  - type: fill
    after: generic-list
    prompt: "Fill in the blank, a class name: `new T[3]` doesn't compile."
    classes: |
      class Rack<T> {
          private T[] items;

          @SuppressWarnings("unchecked")
          public Rack() {
              this.items = (T[]) new [[Object]][3];
          }

          public void put(int index, T item) {
              this.items[index] = item;
          }

          public T get(int index) {
              return this.items[index];
          }
      }
    body: |
      Rack<String> rack = new Rack<>();
      rack.put(0, "jam");
      System.out.println(rack.get(0) + " " + rack.get(1));
    why: "Java can't create an array of a type parameter, since T is gone when the program runs. It creates an array of `Object`, which can hold any object, and casts it to `T[]`. javac warns that it can't check that cast, and `@SuppressWarnings(\"unchecked\")` says that you have."

