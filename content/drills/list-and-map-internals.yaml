    solution:
      NumberList.java: |
        public class NumberList {
            private int[] numbers;
            private int size;

            public NumberList() {
                this.numbers = new int[2];
                this.size = 0;
            }

            public void add(int number) {
                if (this.size == this.numbers.length) {
                    int[] bigger = new int[this.numbers.length * 2];
                    for (int i = 0; i < this.size; i++) {
                        bigger[i] = this.numbers[i];
                    }
                    this.numbers = bigger;
                }
                this.numbers[this.size] = number;
                this.size++;
            }

            public int get(int index) {
                if (index < 0 || index >= this.size) {
                    throw new IndexOutOfBoundsException("Index " + index + " out of bounds for size " + this.size);
                }
                return this.numbers[index];
            }

            public int size() {
                return this.size;
            }

            public int sum() {
                int sum = 0;
                for (int i = 0; i < this.size; i++) {
                    sum += this.numbers[i];
                }
                return sum;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                NumberList steps = new NumberList();
                steps.add(4200);
                steps.add(8100);
                steps.add(6400);
                System.out.println(steps.size() + " " + steps.get(1) + " " + steps.sum());
                try {
                    steps.get(3);
                } catch (IndexOutOfBoundsException e) {
                    System.out.println(e.getMessage());
                }
            }
        }
    hints:
      - "Two instance variables, `private int[] numbers;` and `private int size;`, with `this.numbers = new int[2];` in the constructor. `add` grows the array first when `this.size == this.numbers.length`, the way Playlist's `add` does."
      - "`get` checks `index < 0 || index >= this.size` and throws, before it returns `this.numbers[index]`. `sum` adds up the first `this.size` numbers only."
    require:
      - pattern: \bnew\s+int\s*\[
        message: "Keep the numbers in an `int` array, created with `new int[...]`."
      - pattern: \bthrow\s+new\s+IndexOutOfBoundsException\s*\(
        message: "Refuse a bad index with `throw new IndexOutOfBoundsException(...)`."
    forbid:
