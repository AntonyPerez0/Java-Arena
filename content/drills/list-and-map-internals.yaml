    body: |
      Tags tags = new Tags();
      tags.add("jazz");
      tags.add("live");
      System.out.println(tags.contains("live") + " " + tags.contains("rock"));
    fix: "for (int i = 0; i < this.size; i++) {"
    why: "The loop goes to the end of the array, but only the first `size` places hold tags. Looking for rock, it reaches index 2, which holds `null`, and calling `equals` on `null` throws. The search must stop at `this.size`."

  - type: bug
    after: own-hash-map
    prompt: "This map of desk numbers should print `14 27`, but the second `put` crashes with an ArrayIndexOutOfBoundsException. Which line is wrong? (The `return` line of `bucketFor` is right as it is.)"
    classes: |
      class KeyValue<K, V> {
          private K key;
          private V value;

          public KeyValue(K key, V value) {
              this.key = key;
              this.value = value;
          }

          public K getKey() {
              return this.key;
          }

          public V getValue() {
              return this.value;
          }
      }

      class SimpleMap<K, V> {
          private ArrayList<KeyValue<K, V>>[] buckets;

          @SuppressWarnings("unchecked")
          public SimpleMap() {
              this.buckets = new ArrayList[8];
              for (int i = 0; i < this.buckets.length; i++) {
                  this.buckets[i] = new ArrayList<>();
              }
          }

          private ArrayList<KeyValue<K, V>> bucketFor(K key) {
              int index = key.hashCode() % this.buckets.length; // BUG
              return this.buckets[index];
          }

          public void put(K key, V value) {
              bucketFor(key).add(new KeyValue<>(key, value));
          }

          public V get(K key) {
              for (KeyValue<K, V> pair : bucketFor(key)) {
                  if (pair.getKey().equals(key)) {
                      return pair.getValue();
                  }
              }
              return null;
          }
      }
    body: |
      SimpleMap<String, Integer> desks = new SimpleMap<>();
      desks.put("Tuva", 14);
      desks.put("Hendrik", 27);
      System.out.println(desks.get("Tuva") + " " + desks.get("Hendrik"));
    fix: "int index = Math.abs(key.hashCode() % this.buckets.length);"
    why: "The index must be from 0 to 7, one of the array's places. Tuva's hash code is positive, but Hendrik's is -1822988127, and the remainder of a negative number is negative too: `-1822988127 % 8` is -7, and `this.buckets[-7]` throws. `Math.abs` around the remainder turns -7 to 7 into 0 to 7, as in this step's SimpleMap. (`Math.floorMod(key.hashCode(), this.buckets.length)` works too.)"

