          public Tags() {
              this.tags = new String[4];
              this.size = 0;
          }

          public void add(String tag) {
              this.tags[this.size] = tag;
              this.size++;
          }

          public boolean contains(String tag) {
              for (int i = 0; i < this.tags.length; i++) { // BUG
