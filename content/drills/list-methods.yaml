  - type: bug
    after: contains-and-index-of
    prompt: "The program should print `Found at 0`, because `Ada` is the first name. Which line is wrong?"
    body: |
      ArrayList<String> names = new ArrayList<>();
      names.add("Ada");
      names.add("Bo");
      int index = names.indexOf("Ada");
      if (index > 0) { // BUG
          System.out.println("Found at " + index);
      } else {
          System.out.println("Not found");
      }
    fix: if (index >= 0) {
    why: "0 is a real index: the first one. `indexOf` says \"not found\" with -1, so the check must be `index >= 0` (or `index != -1`). With `index > 0`, a value at the very front counts as missing."

  - type: bug
    after: removing-values
    prompt: "The program should remove the value 4 from the list. `leaving` holds that value and should stay the `int` 4. Which line is wrong?"
    body: |
      ArrayList<Integer> spots = new ArrayList<>();
      spots.add(10);
      spots.add(4);
      spots.add(7);
      int leaving = 4;
      spots.remove(leaving); // BUG
      System.out.println(spots);
    fix: spots.remove(Integer.valueOf(leaving));
    why: "Given an `int`, `remove` removes an index, and there's no index 4 in a list of three values, so the program crashes. `Integer.valueOf(leaving)` makes it look for the value 4 instead."

  - type: compiles
    after: for-each
    body: |
      ArrayList<Integer> numbers = new ArrayList<>();
      numbers.add(3);
      for (int number : numbers) {
          number = number * 2;
      }
      System.out.println(numbers);
    why: "Yes. The loop variable holds a copy of each value, and a variable can be changed. The list itself isn't, though: the program prints `[3]`, because changing the copy doesn't change the value in the list."

