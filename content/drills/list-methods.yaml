  - type: boss
    after: list-toolbox
    prompt: |
      Write a method `removeEvery(ArrayList<String> list, String value)` that removes every copy of `value` from the list, not just the first one. It returns nothing: it changes the caller's list. The check builds a list of `red`, `sale`, `red`, `new` and `red`, calls `removeEvery(tags, "red");` and prints the list:

      ```
      [sale, new]
      ```
    seed: |
      import java.util.ArrayList;

      public class Main {
          public static void main(String[] args) {
              ArrayList<String> tags = new ArrayList<>();
              tags.add("red");
              tags.add("sale");
              tags.add("red");
              tags.add("new");
              tags.add("red");
              removeEvery(tags, "red");
              System.out.println(tags);
          }

          // Write the removeEvery method here.
      }
    solution: |
      import java.util.ArrayList;

      public class Main {
          public static void main(String[] args) {
              ArrayList<String> tags = new ArrayList<>();
              tags.add("red");
              tags.add("sale");
              tags.add("red");
              tags.add("new");
              tags.add("red");
              removeEvery(tags, "red");
              System.out.println(tags);
          }

          public static void removeEvery(ArrayList<String> list, String value) {
              while (list.contains(value)) {
                  list.remove(value);
              }
          }
      }
    hints:
      - "`list.remove(value)` removes only the first copy. Keep removing as long as the list still contains the value."
      - "`while (list.contains(value)) { list.remove(value); }` (an index loop that goes backwards works too)."
    tests:
