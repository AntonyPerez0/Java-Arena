    prompt: |
      Write a method `countAtLeast(ArrayList<Integer> scores, int passMark)` that returns how many scores in the list are at least `passMark`. The check builds a list of 45, 70, 50 and 38, and runs `System.out.println(countAtLeast(scores, 50));`:

      ```
      2
      ```
