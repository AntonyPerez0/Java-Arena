    solution: |
      import java.util.ArrayList;

      public class Main {
          public static void main(String[] args) {
              ArrayList<Integer> scores = new ArrayList<>();
              scores.add(45);
              scores.add(70);
              scores.add(50);
              scores.add(38);
              System.out.println(countAtLeast(scores, 50));
          }

          public static int countAtLeast(ArrayList<Integer> scores, int passMark) {
              int count = 0;
              for (int score : scores) {
                  if (score >= passMark) {
                      count++;
                  }
              }
              return count;
          }
      }
    hints:
      - "The method starts `public static int countAtLeast(ArrayList<Integer> scores, int passMark) {`."
      - "A counter, a for-each loop with `if (score >= passMark)`, and `return count;` after the loop."
