  - type: choice
    after: list-toolbox
    prompt: "Which line puts `Zoe` at the front of the list `names`, keeping every name already in it?"
    choices:
      - '`names.set(0, "Zoe");`'
      - '`names.add(0, "Zoe");`'
      - '`names.add("Zoe");`'
    answer: 2
    why: "`add(index, value)` puts the value at the index, and the values from there on move up one place. `set(0, ...)` would replace the first name, and `add(\"Zoe\")` adds to the end."

