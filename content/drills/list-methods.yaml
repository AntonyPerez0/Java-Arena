      public static void pack(ArrayList<String> bag, int count) {
          bag.add("map");
          count++;
      }
    body: |
      ArrayList<String> items = new ArrayList<>();
      items.add("tent");
      int count = 1;
      pack(items, count);
      System.out.println(items);
      System.out.println(count);
    why: "The method gets a copy of the `int`, so its `count++` changes only its own copy, and `main`'s `count` is still 1. For the list it gets a copy of the reference, which leads to `main`'s own list, so `map` is added to that list."

