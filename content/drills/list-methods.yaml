  - type: predict
    after: for-each
    body: |
      ArrayList<String> letters = new ArrayList<>();
      letters.add("s");
      letters.add("t");
      letters.add("o");
      letters.add("p");
      String word = "";
      for (String letter : letters) {
          word = letter + word;
      }
      System.out.println(word);
    why: "The loop goes through the list in order, but each round puts the new letter in front of the word so far: `s`, `ts`, `ots`, `pots`. It's `letter + word` that turns the order around."

  - type: predict
    after: totals-flags-and-text
    body: |
      ArrayList<Integer> readings = new ArrayList<>();
      readings.add(3);
      readings.add(-2);
      readings.add(5);
      boolean allAboveZero = true;
      for (int reading : readings) {
          if (reading <= 0) {
              allAboveZero = false;
          } else {
              allAboveZero = true;
          }
      }
      System.out.println(allAboveZero);
    why: "The `else` sets the flag back to `true` for every value above 0, so only the last value decides. The -2 makes it `false`, but the 5 after it turns it `true` again. A flag like this needs the `if` without the `else`."

  - type: predict
    after: contains-and-index-of
    body: |
      ArrayList<String> colors = new ArrayList<>();
      colors.add("red");
      colors.add("blue");
      colors.add("red");
      System.out.println(colors.indexOf("red"));
      System.out.println(colors.indexOf("Blue"));
      System.out.println(colors.contains("blue"));
    why: "`indexOf` gives the first index where the value is, so `red` is at 0 even though it's in the list twice. The comparison is exact: `Blue` with a capital B isn't in the list, so that gives -1. `blue` is there, so `contains` is `true`."

  - type: predict
    after: removing-values
    body: |
      ArrayList<Integer> numbers = new ArrayList<>();
      numbers.add(2);
      numbers.add(0);
      numbers.add(5);
      numbers.add(1);
      numbers.remove(2);
      numbers.remove(Integer.valueOf(2));
      System.out.println(numbers);
    why: "`numbers.remove(2)` gets an `int`, so it removes index 2, the 5: the list is then `[2, 0, 1]`. `numbers.remove(Integer.valueOf(2))` looks for the value 2 and removes it, which leaves `[0, 1]`."

  - type: predict
