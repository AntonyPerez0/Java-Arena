    solution:
      Main.java: |
        import java.util.ArrayList;
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner scanner = new Scanner(System.in);
                ArrayList<Player> players = new ArrayList<>();

                while (true) {
                    String name = scanner.nextLine();
                    if (name.isEmpty()) {
                        break;
                    }
                    int points = Integer.valueOf(scanner.nextLine());
                    players.add(new Player(name, points));
                }

                int sum = 0;
                for (Player player : players) {
                    sum += player.getPoints();
                }
                double average = (double) sum / players.size();

                for (Player player : players) {
                    if (player.getPoints() > average) {
                        System.out.println(player.getName());
                    }
                }
            }
        }
      Player.java: |
        public class Player {
            private String name;
            private int points;

            public Player(String name, int points) {
                this.name = name;
                this.points = points;
            }

            public String getName() {
                return this.name;
            }

            public int getPoints() {
                return this.points;
            }
        }
    hints:
      - "The average needs every player's points, so read the whole list first. Then one loop adds up `player.getPoints()`, and `(double) sum / players.size()` is the average."
      - "A second loop goes through the list again and prints `player.getName()` when `player.getPoints() > average`."
