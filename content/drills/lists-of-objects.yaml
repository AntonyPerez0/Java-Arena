  - type: bug
    after: objects-from-input
    prompt: "The program should read names until an empty line, and then print how many players there are. Which line is wrong?"
    stdin: "Ada\nBen\n\n"
    classes: |
      class Player {
          private String name;

          public Player(String name) {
              this.name = name;
          }
      }
    body: |
      Scanner scanner = new Scanner(System.in);
      ArrayList<Player> players = new ArrayList<>();
      while (true) {
          String name = scanner.nextLine();
          if (name.isEmpty()) {
              continue; // BUG
          }
          players.add(new Player(name));
      }
      System.out.println(players.size() + " players");
    fix: break;
    why: "`continue` only skips to the next round, so nothing ever ends the `while (true)` loop. javac sees that the line after the loop can never run and refuses it as an unreachable statement. `break` ends the loop at the empty line."

