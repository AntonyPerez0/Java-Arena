  - type: choice
    after: objects-from-input
    prompt: "A loop reads names until an empty line and adds a `Badge` for each. Why does the empty-line check come before `badges.add(new Badge(name));`?"
    choices:
      - "`new` can't be used before an `if` in the same loop."
      - "Otherwise the empty line would be added as a badge too."
      - "`break` only works as the first statement in a loop."
      - "The list can take only one new object in each round."
    answer: 2
    why: "The loop does its lines in order. With `add` first, the empty line becomes a `Badge` with an empty name before the `if` stops the loop, and the list ends up one badge too long."

  - type: choice
    after: finding-in-the-list
    prompt: "Which header fits a method that gives back the oldest pet of a list, so the caller can print its name and its age?"
    choices:
      - "`public static int oldest(ArrayList<Pet> pets)`"
      - "`public static void oldest(ArrayList<Pet> pets)`"
      - "`public static Pet oldest(ArrayList<Pet> pets)`"
      - "`public static ArrayList<Pet> oldest(Pet pets)`"
    answer: 3
    why: "The method returns one pet, so its return type is `Pet`, and it gets the list as its parameter. An `int` would give back only the age, and a `void` method gives back nothing."

