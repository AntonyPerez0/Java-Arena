    pre: |
      public static int ageOf(ArrayList<Pet> pets, String name) {
          for (Pet pet : pets) {
              if (pet.getName().equals(name)) {
                  return pet.getAge();
              }
          }
          return -1;
      }
    body: |
      ArrayList<Pet> pets = new ArrayList<>();
      pets.add(new Pet("Rex", 4));
      pets.add(new Pet("Misty", 2));
      pets.add(new Pet("Rex", 9));
      System.out.println(ageOf(pets, "Rex"));
      System.out.println(ageOf(pets, "rex"));
    why: "The `return` inside the loop ends the method at the first match, so the second Rex is never reached. `equals` tells capitals apart, so no pet is called `rex`, and the method gets to `return -1;`."

