topic: lists
drills:
  - type: predict
    after: creating-a-list
    body: |
      ArrayList<String> log = new ArrayList<>();
      log.add("open");
      System.out.println(log);
      log.add("save");
      log.add("open");
      System.out.println("Log: " + log);
    why: "`add` puts each value at the end, in the order of the calls, and a list may hold the same value more than once. Printing a list shows all its values in square brackets."

  - type: predict
    after: getting-values
    body: |
      ArrayList<Integer> goals = new ArrayList<>();
      goals.add(2);
      goals.add(3);
      System.out.println(goals.get(0) + goals.get(1));
      System.out.println("Goals: " + goals.get(0) + goals.get(1));
    why: "Values from an `ArrayList<Integer>` add up like any numbers, so the first line is 5. In the second line the text comes first, so each `+` joins text: `Goals: ` then 2 then 3. `(goals.get(0) + goals.get(1))` in parentheses would print 5."

  - type: predict
    after: size
    body: |
      ArrayList<Integer> hops = new ArrayList<>();
      hops.add(2);
      hops.add(0);
      hops.add(1);
      System.out.println(hops.get(hops.get(0)));
      System.out.println(hops.get(hops.size() - 1) + hops.size());
    why: "`hops.get(0)` is 2, so the first line is `hops.get(2)`, which is 1. On the second line the last index is `3 - 1`, so the value there (1) is added to the size (3): 4."

  - type: predict
    after: looping-over-a-list
    body: |
      ArrayList<Integer> readings = new ArrayList<>();
      readings.add(3);
      readings.add(7);
      readings.add(4);
      readings.add(9);
      for (int i = 1; i < readings.size(); i++) {
          System.out.println(readings.get(i) - readings.get(i - 1));
      }
    why: "The loop starts at index 1, so every round has a value before it, at `i - 1`. It prints the change from one reading to the next: 7 - 3, 4 - 7 and 9 - 4."

  - type: predict
    after: largest-and-smallest
    body: |
      ArrayList<Integer> temps = new ArrayList<>();
      temps.add(-4);
      temps.add(-9);
      temps.add(-2);
      int highest = 0;
      for (int i = 0; i < temps.size(); i++) {
          if (temps.get(i) > highest) {
              highest = temps.get(i);
          }
      }
      System.out.println("Highest: " + highest);
    why: "No temperature is above the starting value 0, so `highest` never changes, and the program prints a value that isn't in the list. Starting with `temps.get(0)` gives the right answer, -2."

  - type: predict
    after: searching
    body: |
      ArrayList<String> colors = new ArrayList<>();
      colors.add("red");
      colors.add("blue");
      colors.add("red");
      colors.add("green");
      int found = -1;
      for (int i = 0; i < colors.size(); i++) {
          if (colors.get(i).equals("red")) {
              found = i;
          }
      }
      System.out.println(found);
    why: "Without a `break`, the loop goes on after the first match at index 0, and the match at index 2 overwrites it. So `found` ends up as the last match. A `break` after `found = i;` would keep the first one."

  - type: fill
    after: size
    prompt: "Fill the blank with an expression that uses `size()`, so the program prints the last song of a list of any length."
    body: |
      ArrayList<String> songs = new ArrayList<>();
      songs.add("Intro");
      songs.add("Rise");
      songs.add("Outro");
      System.out.println("Last: " + songs.get([[songs.size() - 1‖(songs.size() - 1)]]));
    why: "Indexes start at 0, so the last index is one less than the size: `songs.size() - 1`, which is 2 here. `songs.get(songs.size())` would ask for index 3 and crash."

  - type: fill
    after: looping-over-a-list
    prompt: "Fill in the loop's condition (an expression), so the loop prints every name in the list."
    body: |
      ArrayList<String> names = new ArrayList<>();
      names.add("Iris");
      names.add("Omar");
      names.add("Pia");
      for (int i = 0; [[i < names.size()‖i <= names.size() - 1‖i != names.size()]]; i++) {
          System.out.println(names.get(i));
      }
    why: "The indexes go from 0 to `names.size() - 1`, so the loop runs while `i < names.size()`. With `<=` it would ask for index 3 and crash."

  - type: bug
    after: looping-over-a-list
    prompt: The program should print the names from the last one to the first. Which line is wrong?
    body: |
      ArrayList<String> names = new ArrayList<>();
      names.add("Ann");
      names.add("Bo");
      names.add("Cy");
      for (int i = names.size(); i >= 0; i--) { // BUG
          System.out.println(names.get(i));
      }
    fix: "for (int i = names.size() - 1; i >= 0; i--) {"
    why: "The list has 3 values, so its last index is 2, not 3. Starting at `names.size()` makes the first round ask for index 3, and the program crashes with an `IndexOutOfBoundsException`. Start at `names.size() - 1`."

  - type: bug
    after: largest-and-smallest
    prompt: The program should print the fastest time, which is the smallest one. Which line is wrong?
    body: |
      ArrayList<Integer> times = new ArrayList<>();
      times.add(42);
      times.add(38);
      times.add(45);
      times.add(40);
      int best = times.get(0);
      for (int i = 1; i < times.size(); i++) {
          if (times.get(i) > best) { // BUG
              best = times.get(i);
          }
      }
      System.out.println("Fastest: " + best + " s");
    fix: "if (times.get(i) < best) {"
    why: "With `>`, `best` takes every value that is bigger, so the program finds the slowest time, 45. The fastest is the smallest, which takes `<`."

  - type: compiles
    after: what-a-list-holds
    body: |
      ArrayList<Double> prices = new ArrayList<>();
      prices.add(2.5);
      prices.add(4);
      System.out.println(prices);
    why: "No. Java turns an `int` into an `Integer` by itself, but never into a `Double`, so `prices.add(4)` doesn't compile: `int cannot be converted to Double`. Written as `4.0`, it works."

  - type: compiles
    after: index-out-of-bounds
    body: |
      ArrayList<String> names = new ArrayList<>();
      System.out.println(names.get(0));
    why: "Yes. javac only checks that `get` is given an `int`: it can't know how many values the list will hold when the program runs. Running it is another matter: it crashes with `IndexOutOfBoundsException: Index 0 out of bounds for length 0`."

  - type: choice
    after: getting-values
    prompt: A list holds 5 values. Which indexes can you give to `get`?
    choices:
      - "1 to 5"
      - "0 to 4"
      - "0 to 5"
      - "Any index from 0 up; a missing one gives null"
    answer: 2
    why: "Indexes count from 0, so 5 values are at the indexes 0, 1, 2, 3 and 4. Any other index, 5 included, stops the program with an `IndexOutOfBoundsException`."

  - type: choice
    after: what-a-list-holds
    prompt: Which line creates a list for whole numbers?
    choices:
      - "`ArrayList<int> numbers = new ArrayList<>();`"
      - "`ArrayList<Integer> numbers = new ArrayList<>();`"
      - "`ArrayList<Number> numbers = new ArrayList<int>();`"
    answer: 2
    why: "A list holds objects, so its type needs the object type `Integer`, not the primitive `int`. `ArrayList<int>` doesn't compile, anywhere in the line."

  - type: choice
    after: index-out-of-bounds
    prompt: "`list` holds 4 values. A program crashes with `Index 4 out of bounds for length 4`. Which call caused it?"
    choices:
      - "`list.get(list.size())`"
      - "`list.get(list.size() - 1)`"
      - "`list.get(3)`"
      - "`list.get(0)`"
    answer: 1
    why: "`list.size()` is 4, and the indexes go only up to 3. `list.get(list.size() - 1)` and `list.get(3)` both get the last value."

  - type: boss
    after: searching
    prompt: |
      Read words, one per line, until `end`. Then read one more word, the one to look for. Print the first and the last index where it appears in the list, as `First: ` and `Last: ` lines. When the word isn't in the list, print `Not found`. For the input `to`, `be`, `or`, `not`, `to`, `be`, `end` and `be` the program prints:

      ```
      First: 1
      Last: 5
      ```
    seed: |
      import java.util.ArrayList;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              ArrayList<String> words = new ArrayList<>();

          }
      }
    solution: |
      import java.util.ArrayList;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              ArrayList<String> words = new ArrayList<>();
              while (true) {
                  String word = scanner.nextLine();
                  if (word.equals("end")) {
                      break;
                  }
                  words.add(word);
              }
              String wanted = scanner.nextLine();
              int first = -1;
              int last = -1;
              for (int i = 0; i < words.size(); i++) {
                  if (words.get(i).equals(wanted)) {
                      if (first == -1) {
                          first = i;
                      }
                      last = i;
                  }
              }
              if (first == -1) {
                  System.out.println("Not found");
              } else {
                  System.out.println("First: " + first);
                  System.out.println("Last: " + last);
              }
          }
      }
    hints:
      - "Two variables, `first` and `last`, both starting at -1. One loop over every index, without `break`, can fill both."
      - "On a match, set `first` only while it's still -1, and set `last` every time. If `first` is still -1 after the loop, the word isn't there."
    require:
      - pattern: \bwords\.get\s*\(
        message: "Search the list with `words.get(i)`."
    tests:
      - stdin: |
          to
          be
          or
          not
          to
          be
          end
          be
      - stdin: |
          to
          be
          or
          not
          end
