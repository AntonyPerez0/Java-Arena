  - type: compiles
    after: rows-of-different-lengths
    body: |
      int[][] grid = new int[][3];
      System.out.println(grid.length);
    why: "No. When you give sizes, the first one, the number of rows, must be there, and javac stops at the empty brackets: `']' expected`. Only the later sizes can be left out, as in `new int[3][]`, which makes 3 places for rows to be created one by one. (With values in braces, as in `new int[][] {{1, 2}, {3}}`, you give no sizes at all, because Java counts them.)"

