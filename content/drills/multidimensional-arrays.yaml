  - type: boss
    after: rows-of-different-lengths
    prompt: |
      Write a method `transposed(int[][] grid)` that returns a **new** grid in which rows and columns trade places: row `r` of the result holds the values of column `r` of `grid`, so a grid of 2 rows and 3 columns becomes one of 3 rows and 2 columns. Every row of `grid` has the same length, and there's at least one row. The check passes the grid `{{1, 2, 3}, {4, 5, 6}}` and prints what your method returns with `Arrays.deepToString`:

      ```
      [[1, 4], [2, 5], [3, 6]]
      ```
    seed: |
      import java.util.Arrays;

      public class Main {
          public static void main(String[] args) {
              int[][] grid = {
                  {1, 2, 3},
                  {4, 5, 6}
              };
              System.out.println(Arrays.deepToString(transposed(grid)));
          }

          // Write the transposed method here.
      }
    solution: |
      import java.util.Arrays;

      public class Main {
          public static void main(String[] args) {
              int[][] grid = {
                  {1, 2, 3},
                  {4, 5, 6}
              };
              System.out.println(Arrays.deepToString(transposed(grid)));
          }

          public static int[][] transposed(int[][] grid) {
              int[][] result = new int[grid[0].length][grid.length];
              for (int row = 0; row < grid.length; row++) {
                  for (int column = 0; column < grid[row].length; column++) {
                      result[column][row] = grid[row][column];
                  }
              }
              return result;
          }
      }
    hints:
      - "The result has as many rows as `grid` has columns, and as many columns as `grid` has rows: `new int[grid[0].length][grid.length]`."
      - "Go through every cell of `grid`, and put its value in the result with the two indexes swapped: `result[column][row] = grid[row][column];`"
