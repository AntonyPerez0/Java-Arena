  - type: predict
    after: equals
    classes: |
      class Key {
          private int number;

          public Key(int number) {
              this.number = number;
          }
      }
    body: |
      Key a = new Key(5);
      Key b = new Key(5);
      System.out.println(a.equals(b) + " " + a.equals(a));
    why: "Key has no `equals` of its own, so it uses the one every class gets, which does the same as `==`. `a` and `b` are two objects, so they aren't equal, even though both hold 5. An object is always equal to itself."

  - type: predict
    after: equals-and-lists
    classes: |
      class Tag {
          private String name;

          public Tag(String name) {
              this.name = name;
          }

          public boolean equals(Object compared) {
              if (this == compared) {
                  return true;
              }
              if (!(compared instanceof Tag)) {
                  return false;
              }
              Tag other = (Tag) compared;
              return this.name.equals(other.name);
          }
      }
    body: |
      ArrayList<Tag> tags = new ArrayList<>();
      tags.add(new Tag("home"));
      tags.add(new Tag("work"));
      tags.add(new Tag("home"));
      tags.remove(new Tag("home"));
      System.out.println(tags.size() + " " + tags.indexOf(new Tag("home")));
    why: "`remove` with an object removes the first equal one, the `home` tag at index 0. The list is then `work`, `home`, so the size is 2 and the equal `home` tag is at index 1."

  - type: predict
    after: returning-objects
    classes: |
      class Word {
          private String text;

          public Word(String text) {
              this.text = text;
          }

          public Word plural() {
              return new Word(this.text + "s");
          }

          public String toString() {
              return this.text;
          }
      }
    body: |
      Word cat = new Word("cat");
      cat.plural();
      Word cats = cat.plural();
      System.out.println(cat + " " + cats + " " + cats.plural());
    why: "`plural()` returns a new Word and never changes the one it's called on. The first call's result isn't stored, so it's lost, and `cat` stays `cat`. `cats.plural()` adds another `s` to `cats`."

  - type: fill
    after: equals
    classes: |
      class Seat {
          private String row;
          private int number;

          public Seat(String row, int number) {
              this.row = row;
              this.number = number;
          }

          public boolean equals(Object compared) {
              if (this == compared) {
                  return true;
              }
              if (!(compared [[instanceof]] Seat)) {
                  return false;
              }
              Seat other = (Seat) compared;
              return this.row.equals(other.row) && this.number == other.number;
          }
      }
    body: |
      Seat seat = new Seat("A", 1);
      System.out.println(seat.equals(new Seat("A", 1)) + " " + seat.equals("A1"));
    why: "`compared instanceof Seat` is true when `compared` is a Seat object. Anything else, like the String `\"A1\"`, isn't a seat, so `equals` returns false before the cast is ever tried."

