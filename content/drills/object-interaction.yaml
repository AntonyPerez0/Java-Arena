  - type: boss
    after: end-of-part-5
    prompt: |
      A domino has two numbers, one on each half, and it can be turned around: `[2|5]` and `[5|2]` are the same domino. `Domino.java` has a constructor and `toString`. Write two methods:

      - `flipped()` returns a new Domino with the two numbers swapped. The domino it's called on doesn't change.
      - `equals(Object compared)`, in the classic way: two dominoes are equal when they have the same two numbers, either way around.

      The check runs:

      ```java fragment
      Domino a = new Domino(2, 5);
      Domino b = new Domino(5, 2);
      System.out.println(a.flipped() + " " + a);
      System.out.println(a.equals(b) + " " + a.equals(new Domino(2, 6)));
      ```

      and expects:

      ```
      [5|2] [2|5]
      true false
      ```
    seed:
      Domino.java: |
        public class Domino {
            private int left;
            private int right;

            public Domino(int left, int right) {
                this.left = left;
                this.right = right;
            }

            public String toString() {
                return "[" + this.left + "|" + this.right + "]";
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Domino a = new Domino(2, 5);
                Domino b = new Domino(5, 2);
                System.out.println(a.flipped() + " " + a);
                System.out.println(a.equals(b) + " " + a.equals(new Domino(2, 6)));
            }
        }
    solution:
      Domino.java: |
        public class Domino {
            private int left;
            private int right;

            public Domino(int left, int right) {
                this.left = left;
                this.right = right;
            }

            public Domino flipped() {
                return new Domino(this.right, this.left);
            }

            public boolean equals(Object compared) {
                if (this == compared) {
                    return true;
                }
                if (!(compared instanceof Domino)) {
                    return false;
                }
                Domino other = (Domino) compared;
                if (this.left == other.left && this.right == other.right) {
                    return true;
                }
                return this.left == other.right && this.right == other.left;
            }

            public String toString() {
                return "[" + this.left + "|" + this.right + "]";
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Domino a = new Domino(2, 5);
                Domino b = new Domino(5, 2);
                System.out.println(a.flipped() + " " + a);
                System.out.println(a.equals(b) + " " + a.equals(new Domino(2, 6)));
            }
        }
    hints:
      - "`flipped` makes a new Domino with the numbers the other way around, and returns it. In `equals`, after the `this ==` check, `instanceof Domino` and the cast, there are two ways to be equal: the numbers match as they are, or they match crosswise."
      - "`return new Domino(this.right, this.left);` for `flipped`. In `equals`: `if (this.left == other.left && this.right == other.right) { return true; }` and then `return this.left == other.right && this.right == other.left;`."
    require:
      - pattern: \bpublic\s+boolean\s+equals\s*\(\s*Object\s+\w+\s*\)
        message: "Write the header exactly as `public boolean equals(Object compared)`."
      - pattern: \binstanceof\s+Domino\b
        message: "Check with `instanceof Domino` before the cast."
    tests:
      - call: |
          Domino a = new Domino(2, 5);
          Domino b = new Domino(5, 2);
          System.out.println(a.flipped() + " " + a);
          System.out.println(a.equals(b) + " " + a.equals(new Domino(2, 6)));
      - call: |
          Domino double6 = new Domino(6, 6);
          System.out.println(double6.flipped());
          System.out.println(double6.equals(new Domino(6, 6)) + " " + double6.equals(new Domino(6, 1)));
          System.out.println(double6.equals("[6|6]") + " " + double6.equals(double6));
        hidden: true
      - call: |
          Domino d = new Domino(0, 3);
          System.out.println(d.equals(new Domino(0, 3)) + " " + d.equals(new Domino(3, 0)) + " " + d.equals(new Domino(3, 3)));
          System.out.println(d.flipped().flipped().equals(d) + " " + (d.flipped() == d));
          ArrayList<Domino> box = new ArrayList<>();
          box.add(new Domino(4, 1));
          System.out.println(box.contains(new Domino(1, 4)));
        hidden: true
      - call: |
          System.out.println(new Domino(2, 5).equals(new Domino(3, 4)) + " " + new Domino(1, 6).equals(new Domino(6, 1)));
          System.out.println(new Domino(0, 4).equals(new Domino(2, 2)) + " " + new Domino(4, 0).equals(new Domino(0, 4)));
        hidden: true
