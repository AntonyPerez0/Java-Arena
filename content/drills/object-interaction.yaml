topic: object-interaction
drills:
  - type: predict
    after: object-as-parameter
    classes: |
      class Plant {
          private int height;

          public Plant(int height) {
              this.height = height;
          }

          public void grow(int cm) {
              this.height = this.height + cm;
          }

          public int getHeight() {
              return this.height;
          }
      }

      class Gardener {
          private int watered;

          public Gardener() {
              this.watered = 0;
          }

          public void water(Plant plant) {
              plant.grow(2);
              this.watered++;
          }

          public int getWatered() {
              return this.watered;
          }
      }
    body: |
      Plant fern = new Plant(10);
      Plant ivy = new Plant(10);
      Gardener sam = new Gardener();
      sam.water(fern);
      sam.water(fern);
      sam.water(ivy);
      System.out.println(fern.getHeight() + " " + ivy.getHeight() + " " + sam.getWatered());
    why: "`water` gets a reference to the plant itself, not a copy, so `plant.grow(2)` changes the plant in `main`. The fern was watered twice (10 + 2 + 2 is 14), the ivy once (12), and the gardener counted all three waterings."

  - type: predict
    after: object-inside-object
    classes: |
      class Router {
          private String name;

          public Router(String name) {
              this.name = name;
          }

          public void rename(String name) {
              this.name = name;
          }

          public String toString() {
              return this.name;
          }
      }

      class Flat {
          private int number;
          private Router router;

          public Flat(int number, Router router) {
              this.number = number;
              this.router = router;
          }

          public String toString() {
              return "Flat " + this.number + " uses " + this.router;
          }
      }
    body: |
      Router router = new Router("Home5G");
      Flat upstairs = new Flat(1, router);
      Flat downstairs = new Flat(2, router);
      router.rename("Attic");
      System.out.println(upstairs);
      System.out.println(downstairs);
    why: "Both flats hold a reference to the same Router object, the one `router` refers to. `router.rename(\"Attic\")` changes that one router, and each flat's `toString` asks the router for its text when it's called, so both show `Attic`."

  - type: predict
    after: same-class-parameter
    classes: |
      class Rope {
          private int meters;

          public Rope(int meters) {
              this.meters = meters;
          }

          public boolean isLongerThan(Rope other) {
              return this.meters > other.meters;
          }
      }
    body: |
      Rope a = new Rope(12);
      Rope b = new Rope(12);
      Rope c = new Rope(5);
      System.out.println(a.isLongerThan(b) + " " + b.isLongerThan(a) + " " + a.isLongerThan(c));
