  - type: choice
    after: equals-and-lists
    prompt: "Which header makes a list's `contains` use your class's `equals`?"
    choices:
      - "`public boolean equals(Seat other)`"
      - "`public boolean equals(Object compared)`"
      - "`public boolean equals()`"
      - "`public String equals(Object compared)`"
    answer: 2
    why: "`contains`, `indexOf` and `remove` call `equals` with an `Object` parameter, since a list can be asked about any object. A method that takes a Seat is a different method, and they never call it. And `equals` answers yes or no, so it returns a `boolean`."

