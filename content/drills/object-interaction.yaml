  - type: bug
    after: same-class-parameter
    prompt: "The program should print `true`: the oak is older than the birch. Which line is wrong?"
    classes: |
      class Tree {
          private String name;
          private int age;

          public Tree(String name, int age) {
              this.name = name;
              this.age = age;
          }

          public boolean isOlderThan(Tree other) {
              return this.age > this.age; // BUG
          }
      }
    body: |
      Tree oak = new Tree("oak", 80);
      Tree birch = new Tree("birch", 30);
      System.out.println(oak.isOlderThan(birch));
    fix: return this.age > other.age;
    why: "The method compares the tree's age with itself, which is never greater, so it always returns false. It should compare with the other tree's age: `other.age`, which the method may read because it's in the Tree class."

  - type: bug
    after: equals
    prompt: "Two guests with the same name are equal, so the program should print `true`. Which line is wrong?"
    classes: |
      class Guest {
          private String name;

          public Guest(String name) {
              this.name = name;
          }

          public boolean equals(Object compared) {
              if (this == compared) {
                  return true;
              }
              if (!(compared instanceof Guest)) {
                  return false;
              }
              Guest other = (Guest) compared;
              return this.name == other.name; // BUG
          }
      }
    body: |
      String start = "Mi";
      Guest a = new Guest(start + "ra");
      Guest b = new Guest("Mira");
      System.out.println(a.equals(b));
    fix: return this.name.equals(other.name);
    why: "The names are Strings, and `==` asks whether they're the same String object. `start + \"ra\"` makes a new String while the program runs, so it's a different object from `\"Mira\"`, although the letters are the same. Strings are compared with `equals`."

  - type: bug
    after: returning-objects
    prompt: "The program should print `3 min, 5 min`. Which line is wrong?"
    classes: |
      class Countdown {
          private int minutes;

          public Countdown(int minutes) {
              this.minutes = minutes;
          }

          public Countdown extendedBy(int more) {
              return new Countdown(more); // BUG
          }

          public String toString() {
              return this.minutes + " min";
          }
      }
    body: |
      Countdown tea = new Countdown(3);
      Countdown longer = tea.extendedBy(2);
      System.out.println(tea + ", " + longer);
    fix: return new Countdown(this.minutes + more);
    why: "The new countdown should have this countdown's minutes plus the extra ones. `new Countdown(more)` forgets `this.minutes`, so it prints `2 min`. The original stays at 3 minutes either way, because `extendedBy` makes a new Countdown."

