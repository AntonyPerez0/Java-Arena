  - type: choice
    after: list-as-instance-variable
    prompt: "A `Recipe` keeps its ingredients in `private ArrayList<String> ingredients;`. Where should the list be made?"
    choices:
      - "In the constructor: `this.ingredients = new ArrayList<>();`"
      - "In `addIngredient`, just before the ingredient is added"
      - "Nowhere: the declaration already makes an empty list"
      - "In `main`, before the recipe is made"
    answer: 1
    why: "The constructor runs once for each new recipe, so each recipe gets one list of its own, ready before any method uses it. Made in `addIngredient`, a new list would replace the old one at every add, and only the last ingredient would be left. The declaration alone leaves the variable `null`, and a list in `main` isn't the recipe's own."

