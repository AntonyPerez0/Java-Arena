  - type: fill
    after: finding-an-object
    prompt: "Fill in what `find` returns when no dog has the name."
    classes: |
      class Dog {
          private String name;

          public Dog(String name) {
              this.name = name;
          }

          public String getName() {
              return this.name;
          }

          public String toString() {
              return this.name;
          }
      }

      class Kennel {
          private ArrayList<Dog> dogs;

          public Kennel() {
              this.dogs = new ArrayList<>();
          }

          public void add(Dog dog) {
              this.dogs.add(dog);
          }

          public Dog find(String name) {
              for (Dog dog : this.dogs) {
                  if (dog.getName().equals(name)) {
                      return dog;
                  }
              }
              return [[null]];
          }
      }
    body: |
      Kennel kennel = new Kennel();
      kennel.add(new Dog("Rex"));
      System.out.println(kennel.find("Rex") + " " + kennel.find("Fido"));
    why: "The method must return a Dog, and when no dog matched there's none to give. `null` means *no object*, and it's allowed wherever an object is expected. The caller checks for it before calling the result's methods."

  - type: bug
    after: list-as-instance-variable
    prompt: "The program should print `1`, but it crashes with a NullPointerException. Which line is wrong?"
    classes: |
      class StampAlbum {
          private ArrayList<String> stamps;

          public StampAlbum() {
              ArrayList<String> stamps = new ArrayList<>(); // BUG
          }

          public void add(String stamp) {
              this.stamps.add(stamp);
          }

          public int count() {
              return this.stamps.size();
          }
      }
    body: |
      StampAlbum album = new StampAlbum();
      album.add("Penny Black");
      System.out.println(album.count());
    fix: this.stamps = new ArrayList<>();
    why: "With a type in front, `ArrayList<String> stamps = ...` declares a new local variable in the constructor, which is gone when the constructor ends. The instance variable `this.stamps` is never set, so it stays `null`, and `add` crashes. Without the type, and with `this.`, the list goes into the instance variable."

  - type: bug
    after: clearing-and-removing
    prompt: "`cancel` should remove the score it's given, and it keeps its `int` parameter. The program should print `Scores: [3, 7]`. Which line is wrong?"
    classes: |
      class Scorecard {
          private ArrayList<Integer> scores;

          public Scorecard() {
              this.scores = new ArrayList<>();
          }

          public void add(int score) {
              this.scores.add(score);
          }

          public void cancel(int score) {
              this.scores.remove(score); // BUG
          }

          public String toString() {
              return "Scores: " + this.scores;
          }
      }
    body: |
      Scorecard card = new Scorecard();
      card.add(3);
      card.add(0);
      card.add(7);
      card.cancel(0);
      System.out.println(card);
    fix: this.scores.remove(Integer.valueOf(score));
    why: "`score` is an `int`, and `remove` with an `int` removes by index (module 14). `cancel(0)` removes index 0, the 3, and prints `Scores: [0, 7]`. `Integer.valueOf(score)` makes it the value to look for."

  - type: bug
    after: totals-from-the-list
    prompt: "The tab's total should be 12. Which line is wrong?"
    classes: |
      class Snack {
          private String name;
          private int price;

          public Snack(String name, int price) {
              this.name = name;
              this.price = price;
          }

          public int getPrice() {
              return this.price;
          }
      }

      class Tab {
          private ArrayList<Snack> snacks;

          public Tab() {
              this.snacks = new ArrayList<>();
          }

          public void add(Snack snack) {
              this.snacks.add(snack);
          }

          public int total() {
              int total = 0;
              for (Snack snack : this.snacks) {
                  total = snack.getPrice(); // BUG
              }
              return total;
          }
      }
    body: |
      Tab tab = new Tab();
      tab.add(new Snack("tea", 3));
      tab.add(new Snack("cake", 4));
      tab.add(new Snack("jam", 5));
      System.out.println(tab.total());
    fix: total = total + snack.getPrice();
    why: "Each round sets `total` to one snack's price, forgetting what was there, so the method returns the last price, 5. A sum adds each price to the total so far: `total = total + snack.getPrice();`."

