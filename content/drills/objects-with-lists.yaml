  - type: choice
    after: rules-for-adding
    prompt: "`ParkingGarage` adds cars only in `park`, which checks that there's a free spot. Which method, added to the class, would let a caller get past that rule?"
    choices:
      - "`public int count() { return this.cars.size(); }`"
      - "`public ArrayList<Car> getCars() { return this.cars; }`"
      - "`public boolean isParked(String plate)`"
      - "`public String toString()`"
    answer: 2
    why: "`getCars()` returns a reference to the garage's own list, not a copy, so a caller can write `garage.getCars().add(car)` and put a car on the list without `park`. The others only give back a number, a boolean or text, which can't change the list."

  - type: boss
    after: rules-for-adding
    prompt: |
      A game's leaderboard keeps one score for each player. `Score.java` is ready, with `getPlayer()`, `getPoints()` and `setPoints(int points)`. In `Leaderboard.java`, write two methods:

      - `submit(String player, int points)`: when the player has no score on the board yet, it adds a new Score. When the player already has one, the board keeps the higher of the two, so a lower score changes nothing.
      - `best()` returns the Score with the most points, or `null` when the board is empty. On a tie, it returns the one that got on the board first.

      The check runs:

      ```java fragment
      Leaderboard board = new Leaderboard();
      System.out.println(board.best());
      board.submit("Ada", 40);
      board.submit("Ben", 55);
      board.submit("Ada", 70);
      board.submit("Ben", 30);
      System.out.println(board);
      System.out.println(board.best());
      ```

      and expects:

      ```
      null
      [Ada 70, Ben 55]
      Ada 70
      ```
    seed:
      Leaderboard.java: |
        import java.util.ArrayList;

        public class Leaderboard {
            private ArrayList<Score> scores;

            public Leaderboard() {
                this.scores = new ArrayList<>();
            }

            // Write the methods submit and best here.

            public String toString() {
                return "" + this.scores;
            }
        }
      Score.java: |
        public class Score {
            private String player;
            private int points;

            public Score(String player, int points) {
                this.player = player;
                this.points = points;
            }

            public String getPlayer() {
                return this.player;
            }

            public int getPoints() {
                return this.points;
            }

            public void setPoints(int points) {
                this.points = points;
            }

            public String toString() {
                return this.player + " " + this.points;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Leaderboard board = new Leaderboard();
                System.out.println(board.best());
                board.submit("Ada", 40);
                board.submit("Ben", 55);
                board.submit("Ada", 70);
                board.submit("Ben", 30);
                System.out.println(board);
                System.out.println(board.best());
            }
        }
    solution:
      Leaderboard.java: |
        import java.util.ArrayList;

        public class Leaderboard {
            private ArrayList<Score> scores;

            public Leaderboard() {
                this.scores = new ArrayList<>();
            }

            public void submit(String player, int points) {
                for (Score score : this.scores) {
                    if (score.getPlayer().equals(player)) {
                        if (points > score.getPoints()) {
                            score.setPoints(points);
                        }
                        return;
                    }
                }
                this.scores.add(new Score(player, points));
            }

            public Score best() {
                Score best = null;
                for (Score score : this.scores) {
                    if (best == null || score.getPoints() > best.getPoints()) {
                        best = score;
                    }
                }
                return best;
            }

            public String toString() {
                return "" + this.scores;
            }
        }
      Score.java: |
        public class Score {
            private String player;
            private int points;

            public Score(String player, int points) {
                this.player = player;
                this.points = points;
            }

            public String getPlayer() {
                return this.player;
            }

            public int getPoints() {
                return this.points;
            }

            public void setPoints(int points) {
                this.points = points;
            }

            public String toString() {
                return this.player + " " + this.points;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Leaderboard board = new Leaderboard();
                System.out.println(board.best());
                board.submit("Ada", 40);
                board.submit("Ben", 55);
                board.submit("Ada", 70);
                board.submit("Ben", 30);
                System.out.println(board);
                System.out.println(board.best());
            }
        }
    hints:
      - "In `submit`, look for the player's Score first. When you find it, raise its points with `setPoints` if the new points are higher, and `return`, since the work is done. After the loop, nobody had that name: add `new Score(player, points)`."
      - "`best` keeps the best Score so far, starting from `null`: `if (best == null || score.getPoints() > best.getPoints()) { best = score; }`. With `>`, a later score that only ties never takes the place of the first one. An empty board never runs the loop, so it returns `null`."
    require:
      - pattern: \bpublic\s+void\s+submit\s*\(\s*String\s+\w+\s*,\s*int\s+\w+\s*\)
        message: "Write the method as `public void submit(String player, int points)`."
      - pattern: \bpublic\s+Score\s+best\s*\(\s*\)
        message: "Write the method as `public Score best()`."
