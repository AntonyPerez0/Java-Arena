      rack.add("salt");
      rack.add("pepper");
      rack.add("cumin");
      rack.add("dill");
      System.out.println(rack.countLongerThan(4) + " " + rack.countLongerThan(5));
    why: "The names are 4, 6, 5 and 4 letters long. Longer than 4 are `pepper` and `cumin`, so 2. Longer than 5 is only `pepper`, so 1: `cumin` has exactly 5 letters, and `>` doesn't count equal."

  - type: predict
    after: totals-from-the-list
    classes: |
      class Balloon {
          private int air;

          public Balloon(int air) {
              this.air = air;
          }

          public void inflate(int more) {
              this.air = this.air + more;
          }

          public int getAir() {
              return this.air;
          }
      }

      class Party {
          private ArrayList<Balloon> balloons;

          public Party() {
              this.balloons = new ArrayList<>();
          }

          public void add(Balloon balloon) {
              this.balloons.add(balloon);
          }

          public int totalAir() {
              int total = 0;
              for (Balloon balloon : this.balloons) {
                  total = total + balloon.getAir();
              }
              return total;
          }
      }
    body: |
      Party party = new Party();
      Balloon red = new Balloon(10);
      party.add(red);
      party.add(new Balloon(5));
      System.out.println(party.totalAir());
      red.inflate(20);
      party.add(red);
      System.out.println(party.totalAir());
    why: "First 10 + 5 is 15. Then the red balloon grows to 30, and the list holds a reference to it, not a copy, so the party sees the change. Adding `red` again puts a second reference to the same balloon on the list: 30 + 5 + 30 is 65."

