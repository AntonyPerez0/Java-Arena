  - type: predict
    after: finding-an-object
    classes: |
      class Peak {
          private String name;
          private int meters;

          public Peak(String name, int meters) {
              this.name = name;
              this.meters = meters;
          }

          public String getName() {
              return this.name;
          }

          public int getMeters() {
              return this.meters;
          }
      }

      class Range {
          private ArrayList<Peak> peaks;

          public Range() {
              this.peaks = new ArrayList<>();
          }

          public void add(Peak peak) {
              this.peaks.add(peak);
          }

          public Peak highest() {
              Peak best = null;
              for (Peak peak : this.peaks) {
                  if (best == null || peak.getMeters() >= best.getMeters()) {
                      best = peak;
                  }
              }
              return best;
          }
      }
    body: |
      Range range = new Range();
      System.out.println(range.highest());
      range.add(new Peak("Ash", 900));
      range.add(new Peak("Birch", 1200));
      range.add(new Peak("Cedar", 1200));
      System.out.println(range.highest().getName());
    why: "With no peaks the loop never runs, so `best` stays `null`, and printing it prints `null`. Birch and Cedar are equally high, and with `>=` a peak as high as the best one takes its place, so the last of them, Cedar, wins. With `>` it would be Birch."

