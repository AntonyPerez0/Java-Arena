          System.out.println(small.rent(5) + " " + small.rent(4) + " " + small.onShelf() + " " + small.rentedOut());
          System.out.println(small.giveBack(5) + " " + small.giveBack(3) + " " + small.onShelf() + " " + small.rentedOut());
