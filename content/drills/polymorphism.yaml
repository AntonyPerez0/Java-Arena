  - type: choice
    after: many-types
    prompt: "`Taxi` extends `Car`, `Car` and `Truck` extend `Vehicle`, and Taxi and Truck implement the interface `Commercial`. Which line does NOT compile?"
    choices:
      - "`Commercial customer = new Truck();`"
      - "`Vehicle vehicle = new Taxi();`"
      - "`Car car = new Truck();`"
      - "`Object thing = new Taxi();`"
    answer: 3
    why: "A variable can refer to objects of its own type and of any type below it. A Truck is a Vehicle, a Commercial and an Object, but it isn't a Car: Car and Truck sit side by side under Vehicle."

  - type: choice
    after: end-of-part-9
    prompt: "A game has bats and dragons, which are enemies, and balloons, which aren't. All three fly, at some altitude. Goblins are enemies too, and they don't fly. What's the best way to give bats, dragons and balloons `altitude()`?"
    choices:
      - "A class `Flying` with `altitude()`, which Enemy and Balloon both extend"
      - "An interface `Flying` with `altitude()`, which Bat, Dragon and Balloon implement"
      - "`Balloon extends Bat`, so that it gets the bat's `altitude()`"
      - "An `altitude()` in Enemy, and `Balloon extends Enemy`"
    answer: 2
    why: "Flying is an ability that unrelated classes share, which is what an interface is for. If Enemy extended a Flying class, goblins would fly too. A balloon isn't a bat or an enemy, so `extends` would give it health and everything else an enemy has."

  - type: boss
    after: one-list-many-kinds
    prompt: |
      The game's scoring works out each enemy's points with a chain of `instanceof`, so every new kind of enemy would need another `else if`. Rewrite it the polymorphic way:

      - In `Enemy.java`, add an abstract method `public abstract int points();`.
      - Override it in `Goblin` (10 points), `Troll` (50) and `Slime` (2).
      - In `Main.java`, make `totalPoints` add up `enemy.points()`, without `instanceof`.

      The check runs:

      ```java fragment
      ArrayList<Enemy> defeated = new ArrayList<>();
      defeated.add(new Goblin("Snip"));
      defeated.add(new Troll("Grak"));
      defeated.add(new Slime("Blob"));
      defeated.add(new Goblin("Nab"));
      System.out.println(totalPoints(defeated));
      ```

      and expects:

      ```
      72
      ```
    seed:
      Main.java: |
        import java.util.ArrayList;

        public class Main {
            public static void main(String[] args) {
                ArrayList<Enemy> defeated = new ArrayList<>();
                defeated.add(new Goblin("Snip"));
                defeated.add(new Troll("Grak"));
                defeated.add(new Slime("Blob"));
                defeated.add(new Goblin("Nab"));
                System.out.println(totalPoints(defeated));
            }

            public static int totalPoints(ArrayList<Enemy> defeated) {
                int total = 0;
                for (Enemy enemy : defeated) {
                    if (enemy instanceof Goblin) {
                        total += 10;
                    } else if (enemy instanceof Troll) {
                        total += 50;
                    } else if (enemy instanceof Slime) {
                        total += 2;
                    }
                }
                return total;
            }
        }
      Enemy.java: |
        public abstract class Enemy {
            private String name;

            public Enemy(String name) {
                this.name = name;
            }

            public String getName() {
                return this.name;
            }
        }
      Goblin.java: |
        public class Goblin extends Enemy {
            public Goblin(String name) {
                super(name);
            }
        }
      Troll.java: |
        public class Troll extends Enemy {
            public Troll(String name) {
                super(name);
            }
        }
      Slime.java: |
        public class Slime extends Enemy {
            public Slime(String name) {
                super(name);
            }
        }
    solution:
      Main.java: |
        import java.util.ArrayList;

        public class Main {
            public static void main(String[] args) {
                ArrayList<Enemy> defeated = new ArrayList<>();
                defeated.add(new Goblin("Snip"));
                defeated.add(new Troll("Grak"));
                defeated.add(new Slime("Blob"));
                defeated.add(new Goblin("Nab"));
                System.out.println(totalPoints(defeated));
            }

            public static int totalPoints(ArrayList<Enemy> defeated) {
                int total = 0;
                for (Enemy enemy : defeated) {
                    total += enemy.points();
                }
                return total;
            }
        }
      Enemy.java: |
        public abstract class Enemy {
            private String name;

            public Enemy(String name) {
                this.name = name;
            }

            public String getName() {
                return this.name;
            }

            public abstract int points();
        }
      Goblin.java: |
        public class Goblin extends Enemy {
            public Goblin(String name) {
                super(name);
            }

            @Override
            public int points() {
                return 10;
            }
        }
      Troll.java: |
        public class Troll extends Enemy {
            public Troll(String name) {
                super(name);
            }

            @Override
            public int points() {
                return 50;
            }
        }
      Slime.java: |
        public class Slime extends Enemy {
            public Slime(String name) {
                super(name);
            }

            @Override
            public int points() {
                return 2;
            }
        }
    hints:
      - "Enemy gets one new line, `public abstract int points();`. Then each of the three classes won't compile until it has its own `points()`, with `@Override` above it, returning its number."
      - "The loop in `totalPoints` becomes one line: `total += enemy.points();`. Each object runs its own version."
    require:
      - pattern: \bpublic\s+abstract\s+int\s+points\s*\(\s*\)\s*;
        message: "Add `public abstract int points();` to Enemy."
      - pattern: \.\s*points\s*\(\s*\)
        message: "Make `totalPoints` call `enemy.points()`."
    forbid:
      - pattern: \binstanceof\b
        message: "Each enemy knows its own points now, so `totalPoints` needs no `instanceof`."
    tests:
      - call: |
          ArrayList<Enemy> defeated = new ArrayList<>();
          defeated.add(new Goblin("Snip"));
          defeated.add(new Troll("Grak"));
          defeated.add(new Slime("Blob"));
          defeated.add(new Goblin("Nab"));
          System.out.println(totalPoints(defeated));
      - call: |
