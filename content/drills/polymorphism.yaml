  - type: predict
    after: instanceof-and-casts
    classes: |
      abstract class Enemy {
          private int health;

          public Enemy(int health) {
              this.health = health;
          }

          public int getHealth() {
              return this.health;
          }

          public void heal(int amount) {
              this.health += amount;
          }
      }

      class Troll extends Enemy {
          public Troll() {
              super(30);
          }

          public void regenerate() {
              this.heal(5);
          }
      }
    body: |
      Enemy grak = new Troll();
      Troll troll = (Troll) grak;
      troll.regenerate();
      troll.regenerate();
      System.out.println(grak.getHealth() + " " + (grak == troll));
    why: "A cast doesn't copy the object. `troll` refers to the same troll as `grak`, only with the type Troll, so `regenerate()` can be called. Both calls heal that one object, from 30 to 40."

  - type: predict
    after: one-list-many-kinds
    classes: |
      abstract class Employee {
          public abstract int monthlyPay();
      }

      class Salaried extends Employee {
          private int yearly;

          public Salaried(int yearly) {
              this.yearly = yearly;
          }

          @Override
          public int monthlyPay() {
              return this.yearly / 12;
          }
      }

      class Manager extends Salaried {
          public Manager(int yearly) {
              super(yearly);
          }

          @Override
          public int monthlyPay() {
              return super.monthlyPay() + 400;
          }
      }

      class Intern extends Employee {
          @Override
          public int monthlyPay() {
              return 900;
          }
      }
    body: |
      ArrayList<Employee> staff = new ArrayList<>();
      staff.add(new Salaried(36000));
      staff.add(new Manager(36000));
      staff.add(new Intern());
      int total = 0;
      for (Employee employee : staff) {
          total += employee.monthlyPay();
      }
      System.out.println(total);
    why: "The loop calls `monthlyPay()` on each Employee, and each object runs its own version: 36000 / 12 is 3000, the manager adds 400 to Salaried's 3000, and the intern gets 900. 3000 + 3400 + 900 is 7300."

