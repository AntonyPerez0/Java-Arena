      Vehicle second = new Vehicle();
      System.out.println((first instanceof Commercial) + " " + (second instanceof Commercial) + " " + first.toll());
    why: "TankerTruck doesn't write `implements Commercial`, but it extends Truck, which does, and interfaces are inherited like methods. A plain Vehicle isn't Commercial. The tanker's `toll()` is Truck's 12 plus 10."

