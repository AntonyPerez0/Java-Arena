topic: polymorphism
drills:
  - type: predict
    after: many-types
    classes: |
      interface Commercial {
          String company();
      }

      class Vehicle {
          public int toll() {
              return 3;
          }
      }

      class Truck extends Vehicle implements Commercial {
          @Override
          public int toll() {
              return 12;
          }

          @Override
          public String company() {
              return "Nordic Freight";
          }
      }
    body: |
      Truck truck = new Truck();
      Vehicle vehicle = truck;
      Commercial customer = truck;
      Object thing = customer;
      System.out.println(vehicle.toll() + " " + customer.company() + " " + (thing == vehicle));
    why: "There's one `new`, so there's one object, a Truck, in four variables of four types. The object's class decides which `toll()` runs, so it's Truck's 12 even through a Vehicle variable. `thing` and `vehicle` refer to the same truck, so `==` is `true`."

