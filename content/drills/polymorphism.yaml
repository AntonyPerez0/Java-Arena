  - type: bug
    after: instanceof-and-casts
    prompt: "Every flying enemy's altitude should be added up. Which line is wrong?"
    classes: |
      interface Flying {
          int altitude();
      }

      abstract class Enemy {
      }

      class Bat extends Enemy implements Flying {
          @Override
          public int altitude() {
              return 3;
          }
      }

      class Hawk extends Enemy implements Flying {
          @Override
          public int altitude() {
              return 40;
          }
      }
    body: |
      ArrayList<Enemy> enemies = new ArrayList<>();
      enemies.add(new Bat());
      enemies.add(new Hawk());
      int height = 0;
      for (Enemy enemy : enemies) {
          if (enemy instanceof Flying) {
              Bat flyer = (Bat) enemy; // BUG
              height += flyer.altitude();
          }
      }
      System.out.println(height);
    fix: Flying flyer = (Flying) enemy;
    why: "The `if` lets every Flying enemy through, but the cast wants a Bat. The hawk flies and isn't a bat, so the cast crashes with a ClassCastException. Cast to the type that was checked: `(Flying) enemy`. Checking `instanceof Bat` instead would skip the hawk."

