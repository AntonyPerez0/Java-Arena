topic: printing
drills:
  - type: predict
    after: first-program
    body: |
      System.out.println("Java");
      System.out.println("Arena");
    why: Each `println` prints its text and then moves to a new line, so the two words land on two lines.

  - type: predict
    after: several-lines
    body: |
      System.out.println("3");
      System.out.println("2");
      System.out.println("1");
      System.out.println("Go!");
    why: Statements run from top to bottom, one after another, so the lines come out in the order they're written.

  - type: predict
    after: print-and-println
    body: |
      System.out.print("A");
      System.out.print("B");
      System.out.println("C");
      System.out.println("D");
    why: "`print` stays on the same line; only `println` moves on to the next one. So A, B and C share a line, and D gets its own."

  - type: predict
    after: print-and-println
    body: |
      System.out.println("Ready");
      System.out.print("Set");
      System.out.println("Go");
    why: "`print` doesn't end the line, so `Go` comes right after `Set` on the same line, with no space between them: `SetGo`. Only `println` moves to a new line."

  - type: predict
    after: comments
    body: |
      // System.out.println("one");
      System.out.println("two"); // three
    why: "Everything from `//` to the end of the line is a comment, which Java skips: the first line is all comment, and `// three` is only a note after the statement."

  - type: predict
    after: comments
    body: |
      System.out.println("start");
      /* System.out.println("middle");
      System.out.println("still middle"); */
      System.out.println("end");
    why: "A block comment runs from `/*` to the next `*/`, across lines, so both print lines inside it are skipped."

  - type: predict
    after: first-program
    body: |
      System.out.println("5 + 3");
    why: Text in double quotes is printed exactly as written. Java doesn't calculate anything inside a string.

  - type: fill
    after: several-lines
    prompt: Fill the blank so the program prints the two lines shown.
    body: |
      System.out.[[println]]("Line one");
      System.out.println("Line two");
    why: "With `print`, `Line two` would continue on the same line. `println` ends the first line."

  - type: fill
    after: print-and-println
    prompt: Fill the blank so the program prints the output shown, on one line.
    body: |
      System.out.[[print]]("Loading");
      System.out.println("...");
    why: "`print` doesn't end the line, so the dots come straight after `Loading`."

  - type: bug
    after: compiler-errors
    body: |
      System.out.println("Roses are red,");
      System.out.println("Violets are blue,") // BUG
      System.out.println("Java is fun.");
    fix: System.out.println("Violets are blue,");
    why: The second statement has no semicolon at its end, so the program doesn't compile. Every statement ends with `;`.

  - type: bug
    after: print-and-println
    prompt: The program should print `First line` and `Second line` on two lines. Which line is wrong?
    body: |
      System.out.print("First line"); // BUG
      System.out.println("Second line");
    fix: System.out.println("First line");
    why: "`print` doesn't end the line, so the two texts run together as `First lineSecond line`. The first line needs `println`."

  - type: compiles
    after: compiler-errors
    body: |
      System.out.println("Hello")
    why: The statement is missing its semicolon. javac reports `';' expected`, and the program doesn't compile.

  - type: compiles
    after: compiler-errors
    body: |
      system.out.println("Hi");
    why: "Java tells capital and small letters apart: `System` needs its capital S. With a small s, javac says `package system does not exist`."

  - type: compiles
    after: comments
    body: |
      System.out.println("Hi"); // prints Hi
    why: Comments are skipped by the compiler, so a comment after a statement is fine.

  - type: choice
    after: comments
    prompt: Which of these lines is a comment in Java?
    choices:
      - "`// This is a comment`"
      - "`# This is a comment`"
      - "`-- This is a comment`"
      - "`<!-- This is a comment -->`"
    answer: 1
    why: "Java comments start with `//` (to the end of the line) or sit between `/*` and `*/`. The other three are comment styles of other languages."

  - type: choice
    after: print-and-println
    prompt: What is the difference between `print` and `println`?
    choices:
      - "`println` moves to a new line after printing; `print` doesn't"
      - "`print` moves to a new line after printing; `println` doesn't"
      - "`println` prints in bold"
      - "There is no difference"
    answer: 1
    why: "The `ln` stands for line: `println` prints the text and then ends the line."

  - type: boss
    after: several-lines
    prompt: |
      Write a program that prints this small box:

      ```
      +---+
      |   |
      +---+
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {

          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              System.out.println("+---+");
              System.out.println("|   |");
              System.out.println("+---+");
          }
      }
    hints:
      - One `println` per line of the box.
      - "The middle line has three spaces between the bars: `\"|   |\"`."
