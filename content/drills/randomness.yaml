topic: randomness
drills:
  - type: predict
    after: seeds
    body: |
      Random random = new Random(3);
      int odd = 0;
      int largest = 0;
      for (int i = 0; i < 1000; i++) {
          int value = random.nextInt(4) * 2 + 1;
          if (value % 2 == 1) {
              odd++;
          }
          if (value > largest) {
              largest = value;
          }
      }
      System.out.println(odd + " " + largest);
    why: "`nextInt(4)` gives 0, 1, 2 or 3. Times 2 that's 0, 2, 4 or 6, and plus 1 it's 1, 3, 5 or 7: always odd, so all 1000 values count, and the largest of them is 7. Whatever the seed, 1000 draws are plenty for 7 to come up."

  - type: predict
    after: seeds
    body: |
      Random first = new Random(99);
      Random second = new Random(99);
      int same = 0;
      for (int i = 0; i < 5; i++) {
          if (first.nextInt(100) == second.nextInt(100)) {
              same++;
          }
      }
      System.out.println(same + " of 5");
    why: "Two generators with the same seed hand out the same series of numbers, as long as they're asked the same questions in the same order. Each round asks both for `nextInt(100)`, so every pair is equal."

  - type: predict
    after: decimals-and-chances
    body: |
      Random random = new Random(8);
      int smallest = 100;
      int largest = -100;
      for (int i = 0; i < 1000; i++) {
          int slot = (int) (random.nextDouble() * 3);
          if (slot < smallest) {
              smallest = slot;
          }
          if (slot > largest) {
              largest = slot;
          }
      }
      System.out.println(smallest + " to " + largest);
    why: "`nextDouble()` is from 0.0 up to, but never, 1.0, so times 3 it's from 0.0 up to just below 3.0. The cast to `int` drops the decimals, which leaves 0, 1 or 2. 3 would need `nextDouble()` to return 1.0, which it never does."

  - type: predict
    after: picking-and-shuffling
    body: |
      ArrayList<String> hat = new ArrayList<>();
      hat.add("Ada");
      hat.add("Ben");
      hat.add("Cleo");
      hat.add("Dev");
      Random random = new Random(12);
      HashSet<String> drawn = new HashSet<>();
      while (!hat.isEmpty()) {
          drawn.add(hat.remove(random.nextInt(hat.size())));
      }
      System.out.println(drawn.size() + " " + hat.size());
    why: "`remove` takes the drawn name out of the hat and returns it, so a name can't be drawn twice, and the bound `hat.size()` shrinks with every draw. The loop ends when the hat is empty, after four draws of four different names."

  - type: predict
    after: picking-and-shuffling
    body: |
      ArrayList<Integer> numbers = new ArrayList<>();
      for (int i = 1; i <= 4; i++) {
          numbers.add(i);
      }
      ArrayList<Integer> copy = new ArrayList<>(numbers);
      Collections.shuffle(copy, new Random(4));
      System.out.println(numbers + " " + copy.contains(3));
    why: "`new ArrayList<>(numbers)` makes a separate list, and only that copy is shuffled, so `numbers` keeps its order. A shuffle changes the order, never which elements there are, so the copy still holds the 3."

  - type: fill
    after: seeds
    prompt: "Fill in the blank, a number, so that `coins` (the coins in a treasure chest) is a whole number from 10 to 20, both included, and the program prints the output shown."
    body: |
      Random random = new Random(5);
      int smallest = 100;
      int largest = -100;
      for (int i = 0; i < 10000; i++) {
          int coins = random.nextInt([[11]]) + 10;
          if (coins < smallest) {
              smallest = coins;
          }
          if (coins > largest) {
              largest = coins;
          }
      }
      System.out.println(smallest + " " + largest);
    why: "From 10 to 20 there are 20 - 10 + 1 = 11 whole numbers, so the bound is 11. `nextInt(11)` gives 0 to 10, and adding 10 moves that to 10 to 20. With a bound of 10, 20 would never come up."

  - type: fill
