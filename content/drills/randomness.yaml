    solution: |
      import java.util.Random;

      public class Main {
          public static void main(String[] args) {
              Random random = new Random(17);
              for (int i = 0; i < 5; i++) {
                  System.out.print(rollsUntilDouble(random) + " ");
              }
              System.out.println();
          }

          public static int rollsUntilDouble(Random random) {
              int rolls = 0;
              while (true) {
                  int first = random.nextInt(6) + 1;
                  int second = random.nextInt(6) + 1;
                  rolls++;
                  if (first == second) {
                      return rolls;
                  }
              }
          }
      }
    hints:
      - "Count the rolls in a variable. In a `while (true)` loop, roll both dice and add one to the count."
      - "When `first == second`, return the count. Use the Random from the parameter for both dice, the first one first."
