  - type: bug
    after: seeds
    prompt: "The program rolls a die 6000 times and should print the smallest and the largest roll, 1 and 6. Which line is wrong?"
    body: |
      Random random = new Random(2);
      int smallest = 100;
      int largest = -100;
      for (int i = 0; i < 6000; i++) {
          int roll = random.nextInt(6); // BUG
          if (roll < smallest) {
              smallest = roll;
          }
          if (roll > largest) {
              largest = roll;
          }
      }
      System.out.println(smallest + " " + largest);
    fix: int roll = random.nextInt(6) + 1;
    why: "`nextInt(6)` gives six numbers, but from 0 to 5. Adding 1 shifts them to 1 to 6, the faces of a die. `nextInt(7)` would be wrong too: 0 to 6, seven numbers."

  - type: bug
    after: seeds
    prompt: "`roll` should roll a die with the Random it's given, so that the 100 rolls show every face. Which line is wrong?"
    pre: |
      public static int roll(Random random) {
          return new Random(42).nextInt(6) + 1; // BUG
      }
    body: |
      Random random = new Random(42);
      HashSet<Integer> faces = new HashSet<>();
      for (int i = 0; i < 100; i++) {
          faces.add(roll(random));
      }
      System.out.println(faces.size() + " different faces");
    fix: return random.nextInt(6) + 1;
    why: "`new Random(42)` starts a new generator from the same seed on every call, and takes its first number: the same number every time, so the set holds just one face. The method should use its parameter, which keeps going through its series from call to call."

  - type: bug
    after: decimals-and-chances
    prompt: "The program should roll a die 6000 times with `Math.random()` and print the largest roll, 6. Which line is wrong?"
    body: |
      int largest = 0;
      for (int i = 0; i < 6000; i++) {
          int roll = (int) Math.random() * 6 + 1; // BUG
          if (roll > largest) {
              largest = roll;
          }
      }
      System.out.println("largest " + largest);
    fix: int roll = (int) (Math.random() * 6) + 1;
    why: "A cast applies to the value right after it. `(int) Math.random()` turns a number below 1.0 into 0, so every roll is 0 * 6 + 1 = 1. With parentheses, `Math.random() * 6` is worked out first, from 0.0 up to 6.0, and the cast makes it 0 to 5."

  - type: compiles
    after: decimals-and-chances
    body: |
      Random random = new Random();
      int percent = random.nextDouble() * 100;
      System.out.println(percent + "%");
    why: "No. `random.nextDouble() * 100` is a `double`, and Java won't put a double in an `int` variable on its own, since the decimals would be lost: `possible lossy conversion from double to int`. A cast says that's what you want: `int percent = (int) (random.nextDouble() * 100);`."

  - type: compiles
    after: picking-and-shuffling
    body: |
      ArrayList<String> names = new ArrayList<>();
      names.add("Ada");
      names.add("Ben");
      Collections.shuffle(names);
      System.out.println(names.size());
    why: "Yes, and it prints 2. `Collections.shuffle` also has a version without a Random: it then uses a generator of its own, without a seed. That's fine in a game, but the order can't be repeated, so a program that should be tested passes a Random of its own."

  - type: choice
    after: next-int
    prompt: Which expression gives a whole number from 5 to 10, both included, each as likely as the others?
    choices:
      - "`random.nextInt(10) + 5`"
      - "`random.nextInt(6) + 5`"
      - "`random.nextInt(5) + 5`"
      - "`random.nextInt(11) - 5`"
    answer: 2
    why: "From 5 to 10 there are six numbers, so the bound is 6: `nextInt(6)` gives 0 to 5, and adding 5 makes it 5 to 10. `nextInt(10) + 5` goes up to 14, `nextInt(5) + 5` stops at 9, and `nextInt(11) - 5` gives -5 to 5."

  - type: choice
    after: decimals-and-chances
    prompt: "A class needs random numbers, and its tests should see the same numbers on every run. Where should its Random come from?"
    choices:
      - "Each method that needs a number creates `new Random()`"
      - "The class takes a Random as a constructor parameter, so a test can pass `new Random(42)` and the game `new Random()`"
      - "The class uses `Math.random()`, which needs no object"
      - "Each method that needs a number creates `new Random(42)`"
    answer: 2
    why: "Taking the Random as a parameter lets whoever creates the object decide: a seed for a test, which then gets the same numbers on every run, and no seed for the real thing. `new Random()` and `Math.random()` can't be given a seed, and a `new Random(42)` in each method starts the same series again on every call, so it returns the same number each time."

