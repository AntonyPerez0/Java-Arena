      class Loaf implements Comparable<Loaf> {
          private String name;
          private int grams;

          public Loaf(String name, int grams) {
              this.name = name;
              this.grams = grams;
          }

          public String getName() {
              return this.name;
          }

          @Override
          public int compareTo(Loaf other) {
              return Integer.compare(this.grams, other.grams);
          }
      }
    body: |
      ArrayList<Loaf> shelf = new ArrayList<>();
      shelf.add(new Loaf("rye", 800));
      shelf.add(new Loaf("baguette", 250));
      shelf.add(new Loaf("sourdough", 800));
      shelf.add(new Loaf("brioche", 400));
      Collections.sort(shelf);
      System.out.println(shelf.get(0).getName() + " " + shelf.get(3).getName());
    why: "`compareTo` puts the lighter loaf first, so the order is 250, 400, 800, 800 grams, with the baguette first. Rye and sourdough tie at 800 grams, and Java's sort keeps ties in the order the list had: rye stays before sourdough, so sourdough is last."

  - type: predict
    after: comparable
    body: |
      boolean first = "pear".compareTo("peach") < 0;
      boolean second = "Zebra".compareTo("apple") < 0;
      boolean third = "cat".compareTo("catalog") < 0;
      System.out.println(first + " " + second + " " + third);
    why: "Strings are compared letter by letter. pear and peach share `pea`, and then r comes after c, so pear comes after peach: `false`. Every capital from A to Z comes before every small letter from a to z, so Zebra comes before apple. When one String is the start of the other, the shorter one comes first."

