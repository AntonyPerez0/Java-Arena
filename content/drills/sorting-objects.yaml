      kittens.add(new Kitten("Miso", 9));
      kittens.add(new Kitten("Pip", 6));
      kittens.add(new Kitten("Juniper", 11));
      kittens.sort((a, b) -> a.getWeeks() < b.getWeeks()); // BUG
      System.out.println(kittens);
    fix: "kittens.sort((a, b) -> Integer.compare(a.getWeeks(), b.getWeeks()));"
