    body: |
      List<Cruise> cruises = new ArrayList<>();
      cruises.add(new Cruise("Fjord", 14));
      cruises.add(new Cruise("Harbor", 6));
      cruises.add(new Cruise("Islands", 21));
      cruises.add(new Cruise("Canal", 9));
      cruises.stream()
              .sorted((a, b) -> b.compareTo(a))
              .limit(2)
              .forEach(cruise -> System.out.println(cruise.getRoute()));
      System.out.println(cruises.get(0).getRoute());
    why: "`b.compareTo(a)` asks the natural order with the two swapped, so the longest cruise comes first: Islands, 21 km, then Fjord, 14 km, and `limit(2)` stops there. The stream sorts only what passes through it, so the list itself still starts with Fjord."

