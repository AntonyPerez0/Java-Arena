    classes: |
      class Contestant implements Comparable<Contestant> {
          private String name;
          private int points;

          public Contestant(String name, int points) {
              this.name = name;
              this.points = points;
          }

          @Override
          public int compareTo(Contestant other) {
              return Integer.compare([[other.points]], this.points);
          }

          @Override
          public String toString() {
              return this.name;
          }
      }
    body: |
      ArrayList<Contestant> quiz = new ArrayList<>();
      quiz.add(new Contestant("Mila", 12));
      quiz.add(new Contestant("Tomas", 19));
      quiz.add(new Contestant("Wen", 15));
      Collections.sort(quiz);
      System.out.println(quiz);
    why: "`Integer.compare(other.points, this.points)` is negative when `this` has *more* points than `other`, so the contestant with more points comes first. With `this.points` first, it would be the usual order, fewest points first."

