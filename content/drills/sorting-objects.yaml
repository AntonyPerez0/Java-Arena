    solution:
      Main.java: |
        import java.util.ArrayList;
        import java.util.Comparator;
        import java.util.List;

        public class Main {
            public static void main(String[] args) {
                List<Invoice> invoices = new ArrayList<>();
                invoices.add(new Invoice("Pine Bakery", 3));
                invoices.add(new Invoice("Harbor Dental", 12));
                invoices.add(new Invoice("Blue Door Books", 3));
                invoices.add(new Invoice("Nordic Yoga", 7));
                System.out.println(overdueReport(invoices));
                System.out.println(invoices.get(0));
            }

            public static List<Invoice> overdueReport(List<Invoice> invoices) {
                List<Invoice> report = new ArrayList<>(invoices);
                report.sort(Comparator.comparing(Invoice::getDaysLate).reversed().thenComparing(Invoice::getClient));
                return report;
            }
        }
      Invoice.java: |
        public class Invoice {
            private String client;
            private int daysLate;

            public Invoice(String client, int daysLate) {
                this.client = client;
                this.daysLate = daysLate;
            }

            public String getClient() {
                return this.client;
            }

            public int getDaysLate() {
                return this.daysLate;
            }

            @Override
            public String toString() {
                return this.client + " (" + this.daysLate + " days late)";
            }
        }
    hints:
      - "Sort a copy, `new ArrayList<>(invoices)`, and return it, or use a stream with `sorted(...)` and `collect`. Either way the given list keeps its order."
      - "Only the days are reversed, so `reversed()` goes right after them: `Comparator.comparing(Invoice::getDaysLate).reversed().thenComparing(Invoice::getClient)`."
