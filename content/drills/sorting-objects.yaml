  - type: choice
    after: comparable
    prompt: "`a.compareTo(b)` returns -5. What does that mean?"
    choices:
      - "`a` comes before `b`"
      - "`a` comes after `b`"
      - "`a` is 5 smaller than `b`"
      - "Nothing: `compareTo` must return -1, 0 or 1"
    answer: 1
    why: "Only the sign counts: any negative number means that `a` comes before `b`, zero means a tie, and a positive number means after. The size of the number says nothing, and String's `compareTo`, for one, often returns numbers other than -1 and 1."

  - type: choice
    after: several-criteria
    prompt: "A scoreboard should show the highest score first, and teams with the same score from A to Z. Which comparator does that?"
    choices:
      - "`Comparator.comparing(Team::getScore).thenComparing(Team::getName).reversed()`"
      - "`Comparator.comparing(Team::getScore).reversed().thenComparing(Team::getName)`"
      - "`Comparator.comparing(Team::getName).thenComparing(Team::getScore).reversed()`"
      - "`Comparator.comparing(Team::getScore).thenComparing(Team::getName)`"
    answer: 2
    why: "`reversed()` turns around everything to its left. Right after the score, it turns around only the score, and `thenComparing` then adds the names from A to Z. At the end of the chain, it would turn the names around too, from Z to A. The third one sorts by name first, and the last puts the lowest score first."

  - type: choice
    after: choosing
    prompt: "A recipe app lists its recipes by cooking time on one page, by rating on another, and by name in the search. None of these is the one order of a recipe. Where should the orders go?"
    choices:
      - "A comparator for each page, where that page sorts, and no `compareTo` in Recipe"
      - "One `compareTo` in Recipe that compares the cooking time, then the rating, then the name"
      - "Three `compareTo` methods in Recipe, one for each order"
      - "Nowhere: `Collections.sort(recipes)` works out an order from Recipe's instance variables"
    answer: 1
    why: "A natural order is for the one order everybody expects of a class, like a version number's. Here each page wants its own, so each page sorts with its own comparator. A class can have only one `compareTo(Recipe other)`, and `Collections.sort(recipes)` compiles only if Recipe implements Comparable."

