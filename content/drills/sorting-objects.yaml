  - type: bug
    after: several-criteria
    prompt: "A warehouse robot visits the storage bins in order: by aisle, and by shelf within an aisle. Which line is wrong?"
    classes: |
      class Bin implements Comparable<Bin> {
          private int aisle;
          private int shelf;

          public Bin(int aisle, int shelf) {
              this.aisle = aisle;
              this.shelf = shelf;
          }

          @Override
          public int compareTo(Bin other) {
              int byAisle = Integer.compare(this.aisle, other.aisle);
              if (byAisle == 0) { // BUG
                  return byAisle;
              }
              return Integer.compare(this.shelf, other.shelf);
          }

          @Override
          public String toString() {
              return this.aisle + "/" + this.shelf;
          }
      }
    body: |
      ArrayList<Bin> route = new ArrayList<>();
      route.add(new Bin(3, 1));
      route.add(new Bin(1, 7));
      route.add(new Bin(3, 5));
      route.add(new Bin(1, 2));
      Collections.sort(route);
      System.out.println(route);
    fix: "if (byAisle != 0) {"
    why: "The aisle settles the order when the aisles *differ*, so `byAisle` is the answer when it isn't 0. As written, two bins in the same aisle count as a tie, and bins in different aisles are ordered by shelf, the other way around. With `!=`, the shelves are compared only within an aisle."

