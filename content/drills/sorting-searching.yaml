topic: sorting-searching
drills:
  - type: predict
    after: smallest-value
    body: |
      int[] stock = {6, 2, 9, 2, 4};
      int low = 0;
      for (int i = 1; i < stock.length; i++) {
          if (stock[i] <= stock[low]) {
              low = i;
          }
      }
      System.out.println(low + " " + stock[low]);
    why: "The smallest value is 2, at indexes 1 and 3. With `<=`, a value equal to the smallest so far takes its place, so the later 2 wins: index 3. With `<`, it would be the first one, at index 1."

  - type: predict
    after: swapping
    body: |
      int[] cups = {3, 8, 5};
      cups[0] = cups[2];
      cups[2] = cups[0];
      System.out.println(Arrays.toString(cups));
    why: "The first line copies the 5 over the 3, so the 3 is lost. The second line copies that same 5 back to index 2. A swap needs a third variable to keep one of the values: `int temp = cups[0];`."

  - type: predict
    after: selection-sort
    body: |
      int[] a = {8, 3, 10, 6, 1, 7};
      for (int i = 0; i < 3; i++) {
          int lowest = i;
          for (int j = i + 1; j < a.length; j++) {
              if (a[j] < a[lowest]) {
                  lowest = j;
              }
          }
          int temp = a[i];
          a[i] = a[lowest];
          a[lowest] = temp;
      }
      System.out.println(Arrays.toString(a));
    why: "Three rounds of selection sort run. The first swaps the smallest value, 1, to index 0: `[1, 3, 10, 6, 8, 7]`. In the second, 3 is already the smallest from index 1 on, so it swaps with itself. The third finds the 6 at index 3 and swaps it with the 10. The last three values aren't sorted yet."

