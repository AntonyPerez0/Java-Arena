      int[] prices = {5, 2, 9};
      int[] sorted = Arrays.sort(prices);
      System.out.println(Arrays.toString(sorted));
    why: "No. `Arrays.sort` returns nothing (it's `void`): it sorts the array it's given, in place, so there's no value to put in `sorted`. Call `Arrays.sort(prices);` on a line of its own, and then print `prices`."

