      selectionSort(values);
      System.out.println(Arrays.toString(values));
    fix: int lowest = i;
    why: "Each round should search from index `i` on, so the smallest so far must start at `i`. The first round happens to work. In the second round, `lowest` starts at 0, where the smallest value already is, so nothing beats it, and the swap moves it out of its place. Later rounds keep pulling values from index 0 the same way."

