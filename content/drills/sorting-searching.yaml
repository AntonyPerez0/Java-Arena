  - type: predict
    after: binary-search
    pre: |
      public static int find(int[] values, int wanted) {
          int low = 0;
          int high = values.length - 1;
          while (low <= high) {
              int middle = (low + high) / 2;
              if (values[middle] == wanted) {
                  return middle;
              }
              if (values[middle] < wanted) {
                  low = middle + 1;
              } else {
                  high = middle - 1;
              }
          }
          return -1;
      }
    body: |
      int[] codes = {40, 10, 30, 20, 50};
      System.out.println(find(codes, 10));
      System.out.println(find(codes, 50));
    why: "Binary search needs sorted data, and this array isn't sorted. For 10, the middle is 30, which is larger, so the search keeps only the left part, `40, 10`. Its middle is 40, larger again, so the range becomes empty: -1, though 10 is at index 1. 50 is found only because the values it passed on the way happened to be smaller."

  - type: fill
    after: selection-sort
    prompt: "Fill in the expression where the inner loop starts, so that the program prints the sorted array."
    body: |
      int[] values = {8, 3, 6, 1};
      for (int i = 0; i < values.length - 1; i++) {
          int lowest = i;
          for (int j = [[i + 1‖i‖lowest + 1‖lowest]]; j < values.length; j++) {
              if (values[j] < values[lowest]) {
                  lowest = j;
              }
          }
          int temp = values[i];
          values[i] = values[lowest];
          values[lowest] = temp;
      }
      System.out.println(Arrays.toString(values));
    why: "Each round looks for the smallest value from index `i` on. `lowest` starts at `i`, so the inner loop can start at the next index, `i + 1` (here that's the same as `lowest + 1`). Starting at 0 would also look at the sorted front part, and pull values that are already in place back out."

  - type: fill
    after: binary-search
    prompt: "Fill in the expression for the index in the middle of the range."
    pre: |
      public static int find(int[] sorted, int wanted) {
          int low = 0;
          int high = sorted.length - 1;
          while (low <= high) {
              int middle = [[(low + high) / 2‖(high + low) / 2‖low + (high - low) / 2]];
              if (sorted[middle] == wanted) {
                  return middle;
              }
              if (sorted[middle] < wanted) {
                  low = middle + 1;
              } else {
                  high = middle - 1;
              }
          }
          return -1;
      }
    body: |
      int[] sorted = {4, 9, 15, 22, 31, 40, 58};
      System.out.println(find(sorted, 40) + " " + find(sorted, 5));
    why: "The range runs from `low` to `high`, and its middle is `(low + high) / 2`. Integer division keeps it a whole index. `sorted.length / 2` is the middle only in the first round: after that, the range has moved."

