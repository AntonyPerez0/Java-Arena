    solution: |
      import java.util.ArrayList;

      public class Main {
          public static void main(String[] args) {
              ArrayList<Integer> times = new ArrayList<>();
              insertInOrder(times, 250);
              insertInOrder(times, 190);
              insertInOrder(times, 310);
              insertInOrder(times, 240);
              System.out.println(times);
          }

          public static void insertInOrder(ArrayList<Integer> times, int time) {
              int index = 0;
              while (index < times.size() && times.get(index) <= time) {
                  index++;
              }
              times.add(index, time);
          }
      }
    hints:
      - "First find the index: move on from 0 while the time there is not larger than the new one, `times.get(index) <= time`, but stop at `times.size()`."
      - "Then `times.add(index, time);` puts the new time there. When no time is larger, the index ends up at `times.size()`, and `add` at that index puts it at the end."
    require:
      - pattern: \bpublic\s+static\s+void\s+insertInOrder\s*\(\s*ArrayList<Integer>\s+\w+\s*,\s*int\s+\w+\s*\)
        message: "Write the method as `public static void insertInOrder(ArrayList<Integer> times, int time)`."
    forbid:
      - pattern: \bCollections\b|\bArrays\b
        message: "Put the new time in its place yourself, without sorting the whole list."
