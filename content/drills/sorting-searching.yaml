    why: "Yes. `Arrays.sort` sorts arrays of Strings too, in the same character-code order as `Collections.sort` uses for lists. It prints `Amazon`."

  - type: choice
    after: selection-sort
    prompt: "Selection sort sorts an array of 10,000 values. About how many comparisons does it make for an array of 20,000 values, compared with that?"
    choices:
      - "The same number"
      - "Twice as many"
      - "Four times as many"
      - "Only one more"
    answer: 3
    why: "The comparisons add up to `n * (n - 1) / 2`: about 50 million for 10,000 values, and about 200 million for 20,000. Twice the values means twice as many rounds, each about twice as long. One more look is what binary search needs when its data doubles."

  - type: choice
    after: binary-search
    prompt: "A sorted array holds 1,000,000 numbers. At most how many values does binary search look at, to find a number or to learn that it isn't there?"
    choices:
      - "20"
      - "1,000"
      - "500,000"
      - "1,000,000"
    answer: 1
    why: "Each look halves the range, and 2 to the 20th power is 1,048,576, more than a million, so 20 halvings always leave nothing. A linear search could look at all 1,000,000."

  - type: boss
    after: linear-search
    prompt: |
      A race's results keep the finish times, in seconds, in a list sorted from the fastest. Write the method `insertInOrder(ArrayList<Integer> times, int time)`, which adds a new time to the list in its right place, so that the list stays sorted: in front of the first time that's larger, or at the end if no time is larger. `add(index, value)` (module 14) puts a value at an index, and moves the ones after it along. Don't sort the whole list again. The check runs:

      ```java fragment
      ArrayList<Integer> times = new ArrayList<>();
      insertInOrder(times, 250);
      insertInOrder(times, 190);
      insertInOrder(times, 310);
      insertInOrder(times, 240);
      System.out.println(times);
      ```

      and expects:

      ```
      [190, 240, 250, 310]
      ```
    seed: |
