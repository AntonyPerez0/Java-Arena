  - type: bug
    after: terminal-operations
    prompt: "This doesn't compile. Keep the stream as it is. Which line is wrong?"
    body: |
      ArrayList<Integer> expenses = new ArrayList<>();
      expenses.add(54);
      expenses.add(120);
      expenses.add(64);
      int count = expenses.stream().filter(amount -> amount > 60).count(); // BUG
      System.out.println(count + " big expenses");
    fix: "long count = expenses.stream().filter(amount -> amount > 60).count();"
    why: "`count()` returns a `long`, and javac won't put a `long` into an `int` variable: `possible lossy conversion from long to int`. Make the variable a `long`."

  - type: bug
    after: intermediate-operations
    prompt: "The program should print the three smallest ticket counts, from the smallest up. Which line is wrong?"
    body: |
      ArrayList<Integer> tickets = new ArrayList<>();
      tickets.add(85);
      tickets.add(140);
      tickets.add(32);
      tickets.add(120);
      tickets.add(64);
      tickets.stream().limit(3).sorted().forEach(System.out::println); // BUG
    fix: "tickets.stream().sorted().limit(3).forEach(System.out::println);"
    why: "Each step works on what the step before it let through. `limit(3)` first keeps the first three of the day, 85, 140 and 32, and only those are sorted. Sort first, then `limit(3)` keeps the three smallest: 32, 64 and 85."

  - type: bug
    after: from-input
    prompt: "The program should print the sum of the readings, leaving out the missing ones, which are sent as `-`. Which line is wrong?"
    body: |
      ArrayList<String> lines = new ArrayList<>();
      lines.add("12");
      lines.add("-");
      lines.add("7");
      int sum = lines.stream().mapToInt(Integer::valueOf).sum(); // BUG
      System.out.println(sum);
    fix: "int sum = lines.stream().filter(line -> !line.equals(\"-\")).mapToInt(Integer::valueOf).sum();"
    why: "`Integer.valueOf(\"-\")` throws a NumberFormatException, so the program crashes. A `filter` that drops the dashes must come before `mapToInt`: then only 12 and 7 are turned into numbers, and the sum is 19."

  - type: compiles
    after: lambdas
    body: |
      ArrayList<Integer> rides = new ArrayList<>();
      rides.add(42);
      rides.add(18);
      long count = rides.stream().filter(km -> {
          int limit = 40;
          return km > limit;
      }).count();
      System.out.println(count);
    why: "Yes. A lambda's body can be a block in braces, with statements and a `return` for its answer, like a method's body. The lambda given to `filter` returns a boolean, as it must. It prints 1."

  - type: compiles
    after: terminal-operations
    body: |
      ArrayList<Integer> expenses = new ArrayList<>();
      expenses.add(54);
      expenses.add(120);
      int total = expenses.stream().sum();
      System.out.println(total);
    why: "No. A stream of Integer objects has no `sum` method: javac says `cannot find symbol`. `mapToInt(amount -> amount)` turns it into an IntStream first, and an IntStream has `sum()`."

  - type: choice
    after: reduce-and-intstream
    prompt: "Which numbers does `IntStream.range(1, 4)` give?"
    choices:
      - "1, 2 and 3"
      - "1, 2, 3 and 4"
      - "0, 1, 2 and 3"
      - "4, 3, 2 and 1"
    answer: 1
    why: "`range` includes its start and leaves out its end, like `for (int i = 1; i < 4; i++)`. `IntStream.rangeClosed(1, 4)` would include the 4."

  - type: choice
    after: loop-or-stream
    prompt: "Which of these jobs is plainer with a loop than with the streams of this module?"
    choices:
      - "Counting the rides longer than 50 km"
      - "Adding up the prices of the books sold"
      - "Finding the number of the first day with more than 100 sales, and stopping there"
      - "Listing the films shown today, each once, in alphabetical order"
    answer: 3
    why: "A loop can `return` as soon as it finds the day, and its index gives the day's number. The other three are keep, change, count or collect jobs, which a stream says in a line: `filter` and `count`, `mapToInt` and `sum`, `distinct`, `sorted` and `collect`."

