    solution:
      Main.java: |
        import java.util.ArrayList;
        import java.util.List;

        public class Main {
            public static void main(String[] args) {
                List<Expense> expenses = new ArrayList<>();
                expenses.add(new Expense("groceries", 54));
                expenses.add(new Expense("rent", 850));
                expenses.add(new Expense("groceries", 38));
                expenses.add(new Expense("groceries", 25));
                System.out.println(averageOf(expenses, "groceries"));
                System.out.println(averageOf(expenses, "phone"));
            }

            public static double averageOf(List<Expense> expenses, String category) {
                long count = expenses.stream()
                        .filter(expense -> expense.getCategory().equals(category))
                        .count();
                if (count == 0) {
                    return 0.0;
                }
                return expenses.stream()
                        .filter(expense -> expense.getCategory().equals(category))
                        .mapToInt(Expense::getAmount)
                        .average()
                        .getAsDouble();
            }
        }
      Expense.java: |
        public class Expense {
            private String category;
            private int amount;

            public Expense(String category, int amount) {
                this.category = category;
                this.amount = amount;
            }

            public String getCategory() {
                return this.category;
            }

            public int getAmount() {
                return this.amount;
            }
        }
    hints:
      - "The header is `public static double averageOf(List<Expense> expenses, String category)`. `getAsDouble()` crashes on an empty stream, so first count the category's expenses with `filter` and `count()`, and return `0.0` when there are none."
      - "Otherwise, the same `filter`, then `mapToInt(Expense::getAmount)`, `average()` and `getAsDouble()`."
    require:
      - pattern: \bpublic\s+static\s+double\s+averageOf\s*\(\s*List<Expense>\s+\w+\s*,\s*String\s+\w+\s*\)
        message: "Write the method as `public static double averageOf(List<Expense> expenses, String category)`."
      - pattern: \.average\s*\(\s*\)
        message: "Let the stream work out the average with `average()`."
    forbid:
      - pattern: \b(for|while)\b
        message: "Use streams this time, not a loop."
