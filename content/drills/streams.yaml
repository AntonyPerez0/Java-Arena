topic: streams
drills:
  - type: predict
    after: why-streams
    body: |
      ArrayList<Integer> rides = new ArrayList<>();
      rides.add(20);
      rides.add(55);
      rides.add(70);
      rides.add(55);
      long count = rides.stream().filter(km -> km > 50).filter(km -> km < 70).count();
      System.out.println(count + " " + rides.size());
    why: "The first filter lets 55, 70 and 55 through, and the second drops 70, so `count()` gives 2. The stream only reads the list: it still has all 4 rides."

  - type: predict
    after: lambdas
    body: |
      ArrayList<String> titles = new ArrayList<>();
      titles.add("Emma");
      titles.add("Kindred");
      titles.add("Dune");
      titles.stream()
              .filter(title -> title.length() == 4)
              .forEach(title -> System.out.println(title.charAt(0)));
    why: "Only Emma and Dune have 4 letters, so `filter` drops Kindred. The `forEach` lambda runs once for each title that got through and prints its first letter on a line of its own: `E`, then `D`."

  - type: predict
    after: terminal-operations
    body: |
      ArrayList<Integer> expenses = new ArrayList<>();
      expenses.add(10);
      expenses.add(25);
      expenses.add(40);
      double average = expenses.stream().mapToInt(amount -> amount).average().getAsDouble();
      int sum = expenses.stream().filter(amount -> amount > 10).mapToInt(amount -> amount).sum();
      System.out.println(average + " " + sum);
    why: "`average()` divides the sum by the count as a double: 75 / 3 is 25.0, printed with its `.0`. The second stream adds up only the expenses over 10: 25 + 40 = 65, an `int`."

  - type: predict
    after: intermediate-operations
    body: |
      ArrayList<Integer> tickets = new ArrayList<>();
      tickets.add(70);
      tickets.add(20);
      tickets.add(90);
      tickets.add(20);
      tickets.add(50);
      int first = tickets.stream().distinct().limit(3).mapToInt(sold -> sold).sum();
      int second = tickets.stream().sorted().limit(3).mapToInt(sold -> sold).sum();
      System.out.println(first + " " + second);
    why: "`distinct()` drops the second 20, and `limit(3)` keeps the first three that are left: 70, 20 and 90, which add up to 180. The second chain sorts first, 20, 20, 50, 70, 90, and keeps the three smallest, copies included: 20 + 20 + 50 = 90."

  - type: predict
    after: objects
    classes: |
      class Ride {
          private String rider;
          private int km;

          public Ride(String rider, int km) {
              this.rider = rider;
              this.km = km;
          }

          public String getRider() {
              return this.rider;
          }

          public int getKm() {
              return this.km;
          }
      }
    body: |
      List<Ride> rides = new ArrayList<>();
      rides.add(new Ride("Ines", 40));
      rides.add(new Ride("Tom", 25));
      rides.add(new Ride("Ines", 60));
      long riders = rides.stream().map(Ride::getRider).distinct().count();
      int ines = rides.stream().filter(ride -> ride.getRider().equals("Ines")).mapToInt(Ride::getKm).sum();
      System.out.println(riders + " " + ines);
    why: "`map(Ride::getRider)` turns the rides into the names Ines, Tom and Ines, and `distinct()` keeps two of them. The second stream keeps Ines's rides and adds up their distances: 40 + 60 = 100."

  - type: predict
    after: reduce-and-intstream
    body: |
      ArrayList<String> films = new ArrayList<>();
      films.add("Up");
      films.add("Heat");
      films.add("Jaws");
      String result = films.stream()
              .map(film -> film.length() + "")
              .reduce("", (text, digits) -> text + digits);
      System.out.println(result);
    why: "`map` turns each film into its length as text: `\"2\"`, `\"4\"` and `\"4\"`. `reduce` starts from the empty String and joins them on: `2`, then `24`, then `244`. The values are Strings, so `+` joins them instead of adding them up to 10."

  - type: fill
    after: lambdas
    prompt: "Fill in the blank, a method reference that prints each title on a line of its own."
    body: |
      ArrayList<String> titles = new ArrayList<>();
      titles.add("Beloved");
      titles.add("Emma");
      titles.stream().forEach([[System.out::println]]);
    why: "`System.out::println` is short for `title -> System.out.println(title)`: the stream hands each value to `println`. A method reference has two colons and no parentheses."

  - type: fill
