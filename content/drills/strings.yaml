  - type: choice
    after: characters
    prompt: What does this print?
    body: |
      String word = "ok";
      System.out.println(word.charAt(0) + word.charAt(1));
    choices:
      - "`ok`"
      - "`o k`"
      - "`218`"
    answer: 3
    verify: output
    why: "`charAt` gives chars, and a char is stored as a number, its character code. `+` between two chars adds the codes (111 for `o` and 107 for `k`). With a String first, `\"\" + word.charAt(0) + word.charAt(1)`, it would print `ok`."

  - type: choice
    after: fixed-format-data
    prompt: What is in `parts` after this line?
    body: |
      String[] parts = "Ada;36".split(",");
    choices:
      - "One part: `Ada;36`"
      - "Two parts: `Ada` and `36`"
      - "Nothing: `parts.length` is 0"
    answer: 1
    why: "The text has no comma, so there's nowhere to cut: `split` returns an array with a single part, the whole text. Using `parts[1]` would crash with an `ArrayIndexOutOfBoundsException`. This data needs `split(\";\")`."

  - type: boss
    after: characters
    prompt: |
      Write a method `isPalindrome(String word)` that returns `true` when the word reads the same forwards and backwards, whatever the capitals, and `false` otherwise. The check runs `System.out.println(isPalindrome("Level"));` and expects:

      ```
      true
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(isPalindrome("Level"));
          }

          // Write the isPalindrome method here.
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(isPalindrome("Level"));
          }

          public static boolean isPalindrome(String word) {
              String lower = word.toLowerCase();
              for (int i = 0; i < lower.length(); i++) {
                  if (lower.charAt(i) != lower.charAt(lower.length() - 1 - i)) {
                      return false;
                  }
              }
              return true;
          }
      }
    hints:
      - Make the word small first. Then compare the first character with the last, the second with the second to last, and so on.
      - "The character that mirrors index `i` is at `lower.length() - 1 - i`. Return `false` at the first pair that differs, and `true` after the loop."
    require:
      - pattern: \.charAt\s*\(
        message: "Compare the characters with `charAt`."
    tests:
      - call: System.out.println(isPalindrome("Level"));
      - call: System.out.println(isPalindrome("kayak"));
        hidden: true
      - call: System.out.println(isPalindrome("Java"));
        hidden: true
      - call: System.out.println(isPalindrome("a"));
        hidden: true
      - call: System.out.println(isPalindrome("Noon"));
        hidden: true
      - call: System.out.println(isPalindrome("abca"));
        hidden: true

  - type: boss
    after: putting-it-together
    prompt: |
      Write a method `capitalizeWords(String sentence)` that returns the sentence with the first letter of every word in capitals, and the rest of each word as it was. The words are separated by single spaces. The check runs `System.out.println(capitalizeWords("the quick brown fox"));` and expects:

      ```
      The Quick Brown Fox
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(capitalizeWords("the quick brown fox"));
          }

          // Write the capitalizeWords method here.
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(capitalizeWords("the quick brown fox"));
          }

          public static String capitalizeWords(String sentence) {
              String[] words = sentence.split(" ");
              String result = "";
              for (int i = 0; i < words.length; i++) {
                  String word = words[i];
                  result += word.substring(0, 1).toUpperCase() + word.substring(1);
                  if (i < words.length - 1) {
                      result += " ";
                  }
              }
              return result;
          }
      }
    hints:
      - "Split the sentence into words. For each word, `word.substring(0, 1).toUpperCase()` is its first letter in capitals, and `word.substring(1)` is the rest."
      - "Put a space between the words but not after the last one: add `\" \"` only when `i < words.length - 1`. (Or add one after every word and `trim()` the result at the end.)"
    require:
      - pattern: \.split\s*\(
        message: "Cut the sentence into words with `split`."
    tests:
      - call: System.out.println(capitalizeWords("the quick brown fox"));
      - call: System.out.println(capitalizeWords("hello"));
        hidden: true
      - call: System.out.println(capitalizeWords("java is fun"));
        hidden: true
      - call: System.out.println("[" + capitalizeWords("a b c") + "]");
        hidden: true
      - call: System.out.println(capitalizeWords("use camelCase names"));
        hidden: true
