  - type: predict
    after: strings-again
    body: |
      String name = "  Ada ";
      name.trim();
      System.out.println("[" + name.trim() + "]" + name.length());
    why: "`name.trim();` on its own line throws its result away, so `name` keeps its spaces and its length of 6. Only the trimmed copy made inside the print line is shown in the brackets."

