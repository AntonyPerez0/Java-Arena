topic: text-ui
drills:
  - type: predict
    after: command-loop
    stdin: |
      go
      wait
      stop
    body: |
      Scanner scanner = new Scanner(System.in);
      while (true) {
          System.out.print("> ");
          String command = scanner.nextLine();
          if (command.equals("stop")) {
              System.out.println("done");
              break;
          }
          System.out.println(command.length());
      }
    why: "The prompt is printed with `print`, so each answer follows its `> ` on the same line, and the typed commands aren't part of the output. `go` has 2 characters and `wait` has 4. `stop` prints `done` and ends the loop."

  - type: predict
    after: command-loop
    stdin: |
      one
      two
      quit
      four
    body: |
      Scanner scanner = new Scanner(System.in);
      int rounds = 0;
      while (true) {
          rounds++;
          if (scanner.nextLine().equals("quit")) {
              break;
          }
          System.out.println(scanner.nextLine());
      }
      System.out.println(rounds);
    why: "Every `nextLine()` reads a new line. The first round reads `one` for the check, and prints the line after it, `two`. The second round's check reads `quit`, so the loop ends after 2 rounds, and `four` is never read. Reading the command once into a variable avoids this."

  - type: predict
    after: remembering
    stdin: |
      a
      b
      c
      end
    body: |
      Scanner scanner = new Scanner(System.in);
      int total = 0;
      while (true) {
          int count = 0;
          String command = scanner.nextLine();
          if (command.equals("end")) {
              break;
          }
          count++;
          total++;
          System.out.println(count + " " + total);
      }
    why: "`count` is created inside the loop, so every round makes it again, starting from 0, and it never gets past 1. `total` is created before the loop, so it lasts from round to round and counts all three commands."

  - type: predict
    after: user-interface-class
    classes: |
      class Counter {
          private int value;

          public Counter() {
              this.value = 0;
          }

          public void add() {
              this.value++;
          }

          public int getValue() {
              return this.value;
          }
      }

      class CounterUi {
          private Scanner scanner;
          private Counter counter;

          public CounterUi(Scanner scanner, Counter counter) {
              this.scanner = scanner;
              this.counter = counter;
          }

          public void start() {
              while (true) {
                  String command = this.scanner.nextLine();
                  if (command.equals("quit")) {
                      break;
                  }
                  if (command.equals("add")) {
                      this.counter.add();
                  }
              }
          }
      }
    body: |
      Counter counter = new Counter();
      CounterUi ui = new CounterUi(new Scanner("add\nadd\nquit\nadd\n"), counter);
      ui.start();
      counter.add();
      System.out.println(counter.getValue());
    why: "The user interface reads until `quit`, so it adds twice and never reads the last `add`. `counter` in `main` and `this.counter` in the user interface refer to the same Counter object, so `main`'s own `add()` after `start()` makes it 3."

  - type: predict
    after: changing-the-inside
    classes: |
