      readings.add(7);
      readings.add(4);
      System.out.println(readings.lowest());
      readings.add(-2);
      System.out.println(readings.lowest());
    why: "`lowest` starts at 0, and neither 7 nor 4 is lower than 0, so the lowest reading stays 0, although no reading was 0. Only -2 is lower. The first reading should set the lowest, whatever it is."

  - type: fill
    after: command-loop
    stdin: |
      hi
      bye
    body: |
      Scanner scanner = new Scanner(System.in);
      while (true) {
          System.out.[[print‖printf]]("> ");
          String command = scanner.nextLine();
          if (command.equals("bye")) {
              System.out.println("See you");
