  - type: fill
    after: user-interface-class
    prompt: Fill in the left side of the assignment, so the program prints the output shown.
    classes: |
      class Greeter {
          private Scanner scanner;

          public Greeter(Scanner scanner) {
              [[this.scanner]] = scanner;
          }

          public void start() {
              String name = this.scanner.nextLine();
              System.out.println("Hello, " + name);
          }
      }
    body: |
      Greeter greeter = new Greeter(new Scanner("Ada\n"));
      greeter.start();
    why: "Inside the constructor, `scanner` alone is the parameter, so `scanner = scanner;` would only give the parameter its own value. `this.scanner` is the instance variable that `start()` reads. Without it, `this.scanner` stays `null`, and `start()` crashes with a NullPointerException."

  - type: bug
    after: command-loop
    prompt: "The program should count the commands before `quit`, and print `2 commands`. Which line is wrong?"
    stdin: |
      look
      wait
      quit
    body: |
      Scanner scanner = new Scanner(System.in);
      int commands = 0;
      while (true) {
          String command = scanner.nextLine();
          if (command == "quit") { // BUG
              break;
          }
          commands++;
      }
      System.out.println(commands + " commands");
    fix: if (command.equals("quit")) {
    why: "`==` asks whether two Strings are the same object, and the line read by the Scanner is a different object from `\"quit\"`, although the letters are the same. So the loop never stops, and `nextLine()` crashes when the input runs out. Strings are compared with `equals`."

  - type: bug
    after: changing-the-inside
    prompt: "StepLog used to keep a list of every day's steps. Now it keeps only the total and the number of days, and the program should still print `5000`. Which line is wrong?"
    classes: |
      class StepLog {
          private int total;
          private int days;

          public StepLog() {
              this.total = 0;
              this.days = 0;
          }

          public void add(int steps) {
              this.total = steps; // BUG
              this.days++;
          }

          public int average() {
              return this.total / this.days;
          }
      }
    body: |
      StepLog log = new StepLog();
      log.add(4000);
      log.add(6000);
      System.out.println(log.average());
    fix: this.total = this.total + steps;
    why: "`this.total = steps;` replaces the total with the last day's steps, so the average is 6000 / 2, which is 3000. The total has to grow by each day's steps: `this.total = this.total + steps;`. A change inside a class must still give the same answers as before."

  - type: compiles
    after: logic-class
    classes: |
      class PracticeLog {
          private ArrayList<Integer> sessions;

          public PracticeLog() {
              this.sessions = new ArrayList<>();
          }

          public void add(int minutes) {
              this.sessions.add(minutes);
          }
      }
    body: |
      PracticeLog log = new PracticeLog();
      log.add(30);
      System.out.println(log.sessions.size());
    why: "No. `sessions` is private, so only the code of PracticeLog may use it: javac says `sessions has private access in PracticeLog`. `main` can only use the public methods. That's also why PracticeLog can change how it keeps its sessions without breaking `main`."

  - type: compiles
    after: user-interface-class
    classes: |
      class Menu {
          public Menu(Scanner scanner) {
          }

          public void start() {
              String command = scanner.nextLine();
              System.out.println(command);
          }
      }
    body: |
      Menu menu = new Menu(new Scanner("hi\n"));
      menu.start();
    why: "No. A parameter only exists inside its own method, here the constructor, so `start()` can't see `scanner`: `cannot find symbol`. The constructor must keep the Scanner in an instance variable, `this.scanner = scanner;`, and `start()` then reads `this.scanner.nextLine()`."

  - type: choice
    after: logic-class
    prompt: "Which method fits best in a logic class such as `PracticeLog`?"
    choices:
      - "`public int total()`, which returns the total minutes"
      - "`public void printTotal()`, which prints `Total: 65 minutes`"
      - "`public void askMinutes()`, which reads the minutes with a Scanner of its own"
    answer: 1
    why: "The logic class keeps the data and answers with return values. Reading and printing are the user interface's job, so the words `Total:` and `minutes` belong there. A method that returns the number can be used by any user interface, and checked without typing anything."

  - type: choice
    after: user-interface-class
    prompt: "Why does `UserInterface` get its Scanner as a constructor parameter, instead of creating `new Scanner(System.in)` itself?"
    choices:
      - "A Scanner can only be created in `main`"
      - "The program then has only one Scanner reading `System.in`, and the user interface can read from any Scanner, such as one that reads a String"
      - "A class can't have a Scanner as an instance variable"
    answer: 2
    why: "A Scanner may read more of the input than the line it returns, so a second Scanner on `System.in` could miss lines. And a user interface that takes any Scanner can be run with commands written in a String, as the checks do. A Scanner can be created anywhere, and kept in an instance variable like any other object."

  - type: choice
    after: changing-the-inside
    prompt: "A user interface calls `add(int minutes)`, `total()` and `longest()` of `PracticeLog`. Which change to `PracticeLog` forces a change in the user interface?"
    choices:
      - "Keeping the total in an `int` instead of adding up a list"
      - "Renaming the private list from `sessions` to `minutes`"
      - "Renaming `total()` to `sum()`"
      - "Adding a new method `average()`"
    answer: 3
    why: "The user interface calls `total()`, so after the rename its code no longer compiles. The public methods are what other classes use. Private variables and how answers are worked out can change freely, and a new method breaks nothing: no one calls it yet."

  - type: choice
    after: adding-a-feature
    prompt: "A new command, `reset`, should empty the practice log, whose sessions are in a private list. Where does the code go?"
    choices:
      - "Only in `UserInterface`: it clears the log's list"
      - "A method `reset()` in `PracticeLog`, and one more `else if` in `UserInterface` that calls it and prints a message"
      - "Only in `main`, before `ui.start()`"
    answer: 2
    why: "Emptying the log is logic, and only PracticeLog can touch its private list, so it gets a `reset()` method. The command and its message are the user interface's part. `main` only puts the program together, and code before `start()` runs before any command is read."

  - type: boss
    after: bigger-program
    prompt: |
      A vending machine sells snacks for 180 cents each. `UserInterface.java` and `Main.java` are ready. Write the logic class, `VendingMachine.java`:

      - `VendingMachine(int price)`: a machine with that price for a snack, and no credit.
      - `insert(int cents)`: adds the coin's cents to the credit.
      - `buy()`: if the credit is at least the price, takes the price off the credit and returns `true`. Otherwise it changes nothing and returns `false`.
      - `getCredit()`: returns the credit.

      The class doesn't print anything. For the input shown, the program prints:

      ```
      > Credit: 100
      > Not enough credit
      > Credit: 200
      > Enjoy! Credit: 20
      > Bye
      ```
    seed:
      VendingMachine.java: |
        public class VendingMachine {
            // Write the logic here.
        }
      UserInterface.java: |
        import java.util.Scanner;

        public class UserInterface {
            private Scanner scanner;
            private VendingMachine machine;

            public UserInterface(Scanner scanner, VendingMachine machine) {
                this.scanner = scanner;
                this.machine = machine;
            }

            public void start() {
                while (true) {
                    System.out.print("> ");
                    String command = this.scanner.nextLine();
                    if (command.equals("quit")) {
                        System.out.println("Bye");
                        break;
                    }
                    if (command.equals("coin")) {
                        this.machine.insert(Integer.valueOf(this.scanner.nextLine()));
                        System.out.println("Credit: " + this.machine.getCredit());
                    } else if (command.equals("buy")) {
                        if (this.machine.buy()) {
                            System.out.println("Enjoy! Credit: " + this.machine.getCredit());
                        } else {
                            System.out.println("Not enough credit");
                        }
                    } else {
                        System.out.println("Unknown command: " + command);
                    }
                }
            }
        }
      Main.java: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner scanner = new Scanner(System.in);
                VendingMachine machine = new VendingMachine(180);
                UserInterface ui = new UserInterface(scanner, machine);
                ui.start();
            }
        }
    solution:
      VendingMachine.java: |
        public class VendingMachine {
            // Write the logic here.
            private int price;
            private int credit;

            public VendingMachine(int price) {
                this.price = price;
                this.credit = 0;
            }

            public void insert(int cents) {
                this.credit = this.credit + cents;
            }

            public boolean buy() {
                if (this.credit < this.price) {
                    return false;
                }
                this.credit = this.credit - this.price;
                return true;
            }

            public int getCredit() {
                return this.credit;
            }
        }
      UserInterface.java: |
        import java.util.Scanner;

        public class UserInterface {
            private Scanner scanner;
            private VendingMachine machine;

            public UserInterface(Scanner scanner, VendingMachine machine) {
                this.scanner = scanner;
                this.machine = machine;
            }

            public void start() {
                while (true) {
                    System.out.print("> ");
                    String command = this.scanner.nextLine();
                    if (command.equals("quit")) {
                        System.out.println("Bye");
                        break;
                    }
                    if (command.equals("coin")) {
                        this.machine.insert(Integer.valueOf(this.scanner.nextLine()));
                        System.out.println("Credit: " + this.machine.getCredit());
                    } else if (command.equals("buy")) {
                        if (this.machine.buy()) {
                            System.out.println("Enjoy! Credit: " + this.machine.getCredit());
                        } else {
                            System.out.println("Not enough credit");
                        }
                    } else {
                        System.out.println("Unknown command: " + command);
                    }
                }
            }
        }
      Main.java: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner scanner = new Scanner(System.in);
                VendingMachine machine = new VendingMachine(180);
                UserInterface ui = new UserInterface(scanner, machine);
                ui.start();
            }
        }
    hints:
      - "The machine remembers two numbers: the price, given to the constructor, and the credit, which starts at 0."
      - "In `buy()`, return `false` first when `this.credit < this.price`. Otherwise take the price off the credit and return `true`."
    forbid:
      - pattern: \bclass\s+VendingMachine\b[\s\S]*\bSystem\s*\.\s*out\b[\s\S]*\bclass\s+UserInterface\b
        message: "VendingMachine doesn't print. `buy()` returns `true` or `false`, and the user interface prints the messages."
