            }
        }
    solution:
      Main.java: |
        import java.util.ArrayList;
        import java.util.Iterator;
        import java.util.List;

        public class Main {
            public static void main(String[] args) {
                List<String> codes = new ArrayList<>();
                codes.add("SAVE10");
                codes.add("save10");
                codes.add("DEAL5");
                codes.add("GIFT25");
                System.out.println(removeInvalid(codes) + " " + codes);
            }

            public static int removeInvalid(List<String> codes) {
                int removed = 0;
                Iterator<String> iterator = codes.iterator();
                while (iterator.hasNext()) {
                    if (!iterator.next().matches("[A-Z]{4}[0-9]{2}")) {
                        iterator.remove();
                        removed++;
                    }
                }
                return removed;
            }
        }
    hints:
      - "The form is `[A-Z]{4}[0-9]{2}`. Go through the list with `Iterator<String> iterator = codes.iterator();` and `while (iterator.hasNext())`."
      - "When `iterator.next()` doesn't match the form, call `iterator.remove()` and count it. Return the count after the loop."
    require:
      - pattern: '\.iterator\s*\(\s*\)'
        message: "Go through the codes with an iterator: `codes.iterator()`."
      - pattern: '\.matches\s*\('
        message: "Check each code's form with `matches`."
    forbid:
      - pattern: '\bremoveIf\b'
        message: "`removeIf` would do the loop for you. Use an iterator this time."
