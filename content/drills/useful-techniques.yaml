        import java.util.Iterator;
        import java.util.List;

        public class Main {
            public static void main(String[] args) {
                List<String> codes = new ArrayList<>();
                codes.add("SAVE10");
                codes.add("save10");
                codes.add("DEAL5");
                codes.add("GIFT25");
                System.out.println(removeInvalid(codes) + " " + codes);
            }

            public static int removeInvalid(List<String> codes) {
