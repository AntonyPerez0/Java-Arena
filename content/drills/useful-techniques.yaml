  - type: boss
    after: stringbuilder
    prompt: |
      **Run-length encoding** shortens a text that has long runs of the same character: each run is written as its character followed by how many times it comes in a row. `aaabccdddd` becomes `a3b1c2d4`. Write the method `compress(String text)`, which returns the text written that way, built with a StringBuilder. Capital and small letters are different characters, and an empty text gives an empty text. The check runs:

      ```java fragment
      System.out.println(compress("aaabccdddd"));
      System.out.println(compress("wwwwwwwwwwwwb"));
      ```

      and expects:

      ```
      a3b1c2d4
      w12b1
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(compress("aaabccdddd"));
              System.out.println(compress("wwwwwwwwwwwwb"));
          }

          public static String compress(String text) {
              return text;
          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(compress("aaabccdddd"));
              System.out.println(compress("wwwwwwwwwwwwb"));
          }

          public static String compress(String text) {
              StringBuilder result = new StringBuilder();
              int run = 1;
              for (int i = 1; i <= text.length(); i++) {
                  if (i < text.length() && text.charAt(i) == text.charAt(i - 1)) {
                      run++;
                  } else {
                      result.append(text.charAt(i - 1)).append(run);
                      run = 1;
                  }
              }
              return result.toString();
          }
      }
    hints:
      - "Go through the indexes and compare each character with the one before it. While they're the same, the run grows by one. When they differ, or the text ends, append the run's character and its length, and start a new run of 1."
      - "Append the character and the count separately, as in `result.append(c).append(run)`. `result.append(c + run)` would add the char's code and the count as numbers: `'a' + 3` is 100."
    require:
      - pattern: '\bnew\s+StringBuilder\s*\('
        message: "Build the result in a `StringBuilder`."
      - pattern: '\.append\s*\('
        message: "Add the characters and the counts with `append`."
    tests:
      - call: |
          System.out.println(compress("aaabccdddd"));
          System.out.println(compress("wwwwwwwwwwwwb"));
      - call: |
          System.out.println("[" + compress("") + "]");
          System.out.println(compress("x") + " " + compress("abab") + " " + compress("AAaa") + " " + compress("!!??"));
        hidden: true
      - call: |
          StringBuilder many = new StringBuilder();
          for (int i = 0; i < 105; i++) {
              many.append("z");
          }
          System.out.println(compress(many.toString() + "yy") + " " + compress("ppq"));
        hidden: true
