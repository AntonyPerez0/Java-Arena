  - type: bug
    after: for-loop-again
    prompt: "The program should print 10, 5 and 0. Which line is wrong?"
    body: |
      for (int i = 10; i <= 0; i -= 5) { // BUG
          System.out.println(i);
      }
    fix: "for (int i = 10; i >= 0; i -= 5) {"
    why: "The condition is checked before the first round, and 10 isn't at most 0, so the loop never runs, and nothing tells you so. Counting down, the loop goes on while `i >= 0`."

  - type: bug
    after: stringbuilder
    prompt: "The program should print `palindrome` for a word that reads the same backwards. The variable `backwards` should stay a StringBuilder. Which line is wrong?"
    body: |
      String word = "noon";
      StringBuilder backwards = new StringBuilder(word).reverse();
      if (backwards.equals(word)) { // BUG
          System.out.println("palindrome");
      } else {
          System.out.println("not a palindrome");
      }
    fix: "if (backwards.toString().equals(word)) {"
    why: "StringBuilder has no `equals` of its own. It has Object's, which asks whether two variables refer to the same object, so a StringBuilder is never equal to a String. `backwards.toString()` gives the text as a String, and String's `equals` compares the characters."

  - type: bug
    after: regular-expressions
    prompt: "`isFood` should accept exactly `cat food` and `dog food`. Which line is wrong?"
    pre: |
      public static boolean isFood(String text) {
          return text.matches("cat|dog food"); // BUG
      }
    body: |
      System.out.println(isFood("cat food") + " " + isFood("dog food") + " " + isFood("cat"));
    fix: "return text.matches(\"(cat|dog) food\");"
    why: "Without parentheses, `|` splits the whole regex: `cat|dog food` means `cat`, or `dog food`. So `cat food` doesn't match, and plain `cat` does. A group, `(cat|dog) food`, keeps the choice to the first word."

  - type: compiles
    after: stringbuilder
    body: |
      String text = new StringBuilder("abc").append("d");
      System.out.println(text);
    why: "No. `append` returns the StringBuilder, and a StringBuilder isn't a String: javac says `incompatible types: StringBuilder cannot be converted to String`. With `.toString()` at the end, it compiles."

  - type: compiles
    after: enums
    classes: |
      enum Light {
          RED, YELLOW, GREEN
      }
    body: |
      Light light = Light.RED;
      if (light.equals("RED")) {
          System.out.println("Stop");
      }
      System.out.println(light);
    why: "Yes, since `equals` takes any Object. But a Light is never equal to a String, so `Stop` is never printed. Compare constants with `==` and the constant itself: `light == Light.RED`."

  - type: choice
    after: quantifiers
    prompt: "Which regex matches both `color` and `colour`, and nothing else?"
    choices:
      - "`colou?r`"
      - "`colou*r`"
      - "`colo(u)+r`"
      - "`colo|colour`"
    answer: 1
    why: "`?` makes the u optional: once, or not at all. `colou*r` also matches colouuur, `colo(u)+r` needs at least one u, so it misses color, and `colo|colour` means colo, or colour."

  - type: choice
    after: iterators
    prompt: "`iterator` goes through a list of names, and its `next()` has just returned Ben. What does `iterator.remove()` do?"
    choices:
      - "It removes Ben, the element that `next()` returned last."
      - "It removes the element after Ben."
      - "It removes the first element of the list."
      - "It removes every Ben in the list."
    answer: 1
    why: "An iterator's `remove()` removes the element that the last `next()` returned, from the collection itself, and then the loop carries on from there. It takes no parameter, so it can't be told what else to remove."

  - type: boss
    after: iterators
    prompt: |
      A shop's coupon codes are four capital letters followed by two digits, like `SAVE10`. Write the method `removeInvalid(List<String> codes)`, which removes every code of another form from the list, with an iterator, and returns how many codes it removed. The check runs:

      ```java fragment
