topic: useful-techniques
drills:
  - type: predict
    after: for-loop-again
    body: |
      int count = 0;
      int sum = 0;
      for (int i = 20; i > 0; i -= 6) {
          count++;
          sum += i;
      }
      System.out.println(count + " " + sum);
    why: "`i` takes the values 20, 14, 8 and 2. The next one, -4, fails `i > 0`, so the loop runs 4 rounds, and 20 + 14 + 8 + 2 = 44."

  - type: predict
    after: stringbuilder
    body: |
      StringBuilder word = new StringBuilder("tops");
      word.reverse().append("!");
      word.insert(0, word.length());
      System.out.println(word);
    why: "`reverse()` turns tops into spot and returns the same StringBuilder, so `append` adds the `!` to it: spot!, which is 5 characters long. `insert(0, 5)` then puts the number 5 in front."

  - type: predict
    after: quantifiers
    body: |
      boolean first = "aaab".matches("a+b");
      boolean second = "b".matches("a+b");
      boolean third = "b".matches("a*b");
      boolean fourth = "ab".matches("a?b?c?");
      System.out.println(first + " " + second + " " + third + " " + fourth);
    why: "`+` needs at least one a, so aaab matches `a+b`, but b alone doesn't. `*` allows zero a's, so b matches `a*b`. In `a?b?c?` every part is optional: ab has the a and the b, and no c."

  - type: predict
    after: enums
    classes: |
      enum Season {
          SPRING, SUMMER, AUTUMN, WINTER
      }
    body: |
      Season now = Season.AUTUMN;
      Season[] all = Season.values();
      System.out.println(now.ordinal() + " " + all[all.length - 1] + " " + now.name().length());
    why: "`ordinal()` counts from 0, so AUTUMN, the third constant, is 2. `values()` lists the constants in the order they're written, so the last one is WINTER. `name()` is the text AUTUMN, 6 letters."

  - type: predict
    after: enum-fields
    classes: |
      enum Floor {
          BASEMENT(-1),
          LOBBY(0),
          ROOFTOP(12);

          private int number;

          private Floor(int number) {
              this.number = number;
          }

          public int getNumber() {
              return this.number;
          }

          public int floorsTo(Floor other) {
              return Math.abs(other.number - this.number);
          }
      }
    body: |
      System.out.println(Floor.BASEMENT.floorsTo(Floor.ROOFTOP) + " " + Floor.LOBBY.getNumber() + " " + Floor.ROOFTOP.ordinal());
    why: "Each constant got its number from the constructor. From the basement, -1, to the rooftop, 12, is 12 - (-1) = 13 floors. The lobby's number is 0, and ROOFTOP is the third constant, so its ordinal is 2."

  - type: fill
    after: stringbuilder
    prompt: "Fill in the blank, a method name, so that the program checks whether the word reads the same backwards."
    body: |
      String word = "racecar";
      String backwards = new StringBuilder(word).[[reverse]]().toString();
      System.out.println(word.equals(backwards));
