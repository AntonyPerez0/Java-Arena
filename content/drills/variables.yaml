topic: variables
drills:
  - type: predict
    after: variables-and-types
    body: |
      int seats = 40;
      double ticket = 12;
      boolean soldOut = false;
      System.out.println(seats + " seats at " + ticket + " each");
      System.out.println("Sold out: " + soldOut);
    why: "`ticket` is a `double`, so the whole number 12 is stored as `12.0` and printed that way. `+` joins the `int` and the `boolean` into the text as they are."

  - type: predict
    after: changing-values
    body: |
      String song = "Intro";
      System.out.println("Now playing: " + song);
      song = "Chorus";
      song = "Outro";
      System.out.println("Now playing: " + song);
    why: "Each assignment replaces the old value. `song` holds `Chorus` only until the next line, so the second print shows `Outro`."

  - type: predict
    after: naming-variables
    body: |
      String score = "low";
      String Score = "high";
      System.out.println(Score + " " + score);
    why: "Capitals matter in names, so `score` and `Score` are two separate variables. It compiles, but names that differ only in capitals are easy to mix up."

  - type: predict
    after: reading-integers
    stdin: "007"
    body: |
      Scanner scanner = new Scanner(System.in);
      int code = Integer.valueOf(scanner.nextLine());
      System.out.println("Agent " + code);
    why: "`Integer.valueOf` turns the text `007` into the number 7. An `int` is just a number and keeps no leading zeros, so joining it to text gives `7`."

  - type: predict
    after: doubles-and-booleans
    stdin: |
      sure
      TRUE
    body: |
      Scanner scanner = new Scanner(System.in);
      boolean hungry = Boolean.valueOf(scanner.nextLine());
      boolean sleepy = Boolean.valueOf(scanner.nextLine());
      System.out.println("Hungry: " + hungry);
      System.out.println("Sleepy: " + sleepy);
    why: "`Boolean.valueOf` gives `true` only for the text true, in any mix of capitals, so `TRUE` gives `true`. Anything else, like `sure`, gives `false`."

  - type: fill
    after: changing-values
    body: |
      String mood = "sleepy";
      System.out.println("Mood: " + mood);
      [[mood]] = "awake";
      System.out.println("Mood: " + mood);
    why: "The variable already exists, so changing it takes only its name. Writing `String mood` again would create a second variable with the same name, which doesn't compile."

  - type: fill
    after: doubles-and-booleans
    stdin: "62.4"
    body: |
      Scanner scanner = new Scanner(System.in);
      double weight = [[Double]].valueOf(scanner.nextLine());
      System.out.println("Weight: " + weight + " kg");
    why: "The line holds a decimal number, so `Double.valueOf` turns it into a `double`. `Integer.valueOf` would stop with a `NumberFormatException` on `62.4`."

  - type: bug
    after: variables-and-types
    body: |
      String town = "Port Ellis";
      int population = 8400;
      boolean coastal = "true"; // BUG
      System.out.println(town + ", " + population + ", coastal: " + coastal);
    fix: boolean coastal = true;
    why: "`\"true\"` in quotes is a String, and a String can't go into a `boolean`, so the program doesn't compile. The boolean value is `true`, without quotes."

  - type: bug
    after: mixing-input-types
    stdin: |
      Sam
      12
    body: |
      Scanner scanner = new Scanner(System.in);
      String name = scanner.nextLine();
      int age = Integer.valueOf(name); // BUG
      System.out.println(name + " is " + age);
    fix: int age = Integer.valueOf(scanner.nextLine());
    why: "The age is on the second line, but this line converts `name` instead, and `Integer.valueOf` stops with a `NumberFormatException` on `Sam`. Every value needs its own `scanner.nextLine()`."

  - type: compiles
    after: naming-variables
    body: |
      int total_score = 99;
      System.out.println(total_score);
    why: "`_` is allowed in names, so this compiles. Java programmers would usually write `totalScore` in camelCase, but that's a habit, not a rule."

  - type: compiles
    after: reading-integers
    body: |
      Scanner scanner = new Scanner(System.in);
      int count = scanner.nextLine();
      System.out.println(count);
    why: "`nextLine()` always gives a String, even when the user types digits, and a String can't be put into an `int`. javac says `incompatible types: String cannot be converted to int`; `Integer.valueOf(...)` has to convert it first."

  - type: choice
    after: naming-variables
    prompt: Which of these is a valid variable name?
    choices:
      - "`2ndTry`"
      - "`first-try`"
      - "`public`"
      - "`tryNumber2`"
    answer: 4
    why: "Digits are fine anywhere except at the start, so `tryNumber2` works. `2ndTry` starts with a digit, `first-try` contains `-`, and `public` is a word of Java itself."

  - type: choice
    after: reading-integers
    prompt: The user types `2.5`. What happens?
    body: |
      Scanner scanner = new Scanner(System.in);
      int number = Integer.valueOf(scanner.nextLine());
      System.out.println(number);
    choices:
      - "It prints `2`: the decimal part is dropped"
      - "It prints `3`: the number is rounded"
      - "It stops with a `NumberFormatException`"
      - "It prints `2.5`"
    answer: 3
    why: "`Integer.valueOf` only accepts text that is a whole number. `2.5` isn't one, so the program compiles but stops with a `NumberFormatException` when it runs."

  - type: boss
    after: mixing-input-types
    prompt: |
      Read a book's title, its number of pages (a whole number), your rating (a decimal number) and whether you've finished it (true or false). Then print one summary line. For the input `The Quiet Moon`, `312`, `4` and `True` the program prints:

      ```
      Title:
      Pages:
      Rating:
      Finished?
      The Quiet Moon: 312 pages, rated 4.0, finished: true
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println("Title:");
              String title = scanner.nextLine();
              System.out.println("Pages:");
              int pages = Integer.valueOf(scanner.nextLine());
              System.out.println("Rating:");
              double rating = Double.valueOf(scanner.nextLine());
              System.out.println("Finished?");
              boolean finished = Boolean.valueOf(scanner.nextLine());
              System.out.println(title + ": " + pages + " pages, rated " + rating + ", finished: " + finished);
          }
      }
    hints:
      - Print each question before its read. The title stays a String; convert the other three with `Integer.valueOf`, `Double.valueOf` and `Boolean.valueOf`.
      - "Stored in a `double`, the rating `4` prints as `4.0`, and `Boolean.valueOf` turns `True` into `true`."
    require:
      - pattern: Integer\s*\.\s*(valueOf|parseInt)\s*\(
        message: "Read the pages as an `int` with `Integer.valueOf(...)`."
      - pattern: Double\s*\.\s*(valueOf|parseDouble)\s*\(
        message: "Read the rating as a `double` with `Double.valueOf(...)`."
      - pattern: Boolean\s*\.\s*(valueOf|parseBoolean)\s*\(
        message: "Read the last answer as a `boolean` with `Boolean.valueOf(...)`."
    tests:
      - stdin: |
          The Quiet Moon
          312
          4
          True
      - stdin: |
          Short Tales
          96
          3.5
          not yet
        hidden: true
      - stdin: |
          Z
          2
          5
          false
        hidden: true
