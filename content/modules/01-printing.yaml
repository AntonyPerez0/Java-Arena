id: printing
summary: Your first Java programs. The class and main method every program needs, printing lines with println and print, comments, and reading what the compiler says when something is wrong.
steps:
  - id: printing-first-program
    slug: first-program
    title: Your first Java program
    text: |
      A **program** is a list of instructions that a computer carries out one after another. You write the instructions as text, called **source code**. Java can't run that text directly: first a tool called the **compiler** (named `javac`) checks it and translates it into a compact form, and then the **Java virtual machine** runs the result. When you press **Check** on this site, both happen right in your browser, with the real Java 21 compiler.

      ### The shape of a Java program

      ```java run
      public class Main {
          public static void main(String[] args) {
              System.out.println("Hello, Java!");
          }
      }
      ```

      ```output
      Hello, Java!
      ```

      Almost every line here is a frame that you'll write the same way every time:

      - `public class Main { ... }` creates a **class** called `Main`. All Java code lives inside a class. The class name has to match the name of the file, and on this site the file is always `Main.java`, so the class is always `Main`.
      - `public static void main(String[] args) { ... }` is the **main method**: the place where the program starts running. The words around `main` all have a meaning that later modules explain. For now, copy the line exactly as it is.
      - `System.out.println("Hello, Java!");` is the one line that does something: it prints the text between the double quotes and then ends the line. The quotes themselves are not printed.
      - Every `{` has a matching `}`. The class's braces wrap the main method, and the main method's braces wrap the instructions.

      In other Java courses and tools the class often has a different name, such as `Sandbox` or `Program`. That's fine: the rule is only that the class name and the file name match.

      ### Capital letters matter

      Java reads `System` and `system` as two different words. `System.out.println` has a capital `S` and nothing else in capitals. If one letter is off, the compiler stops and says what it couldn't understand. Step 5 of this module shows how to read those messages.

      **Your turn:** fill in the blank so the program prints `Grace Hopper`, the name of a computing pioneer.
    fill: |
      public class Main {
          public static void main(String[] args) {
              System.out.[[println]]("Grace Hopper");
          }
      }
    hints:
      - The method that prints a line is `println`, short for "print line".
      - "Type only the method name into the blank: `println`. The dot and the parentheses are already there."
    tests:
      - expect: Grace Hopper
    more:
      - task: |
          Fill in the frame of the program: the word that starts a class, and the two missing words of the main method. The program should print `Every program needs a frame.`
        fill: |
          public [[class]] Main {
              public [[static]] void [[main]](String[] args) {
                  System.out.println("Every program needs a frame.");
              }
          }
        hints:
          - The first line of the program creates a class, so the missing word is `class`.
          - The main method line always reads `public static void main(String[] args)`.
          - "`main` is written in lower case. With a capital `M` the program compiles, but Java can't find where to start."
        tests:
          - expect: Every program needs a frame.
      - task: |
          This time the editor is empty. Write the whole program yourself: the class, the main method and one line that prints `Ready, set, code!`
        seed: |
          // Write the whole program below this line.
        solution: |
          // Write the whole program below this line.
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Ready, set, code!");
              }
          }
        hints:
          - "Start with `public class Main {` and finish with a closing `}`."
          - "Inside the class goes `public static void main(String[] args) {` and its own closing `}`."
          - "Inside main: `System.out.println(\"Ready, set, code!\");` Every quote, parenthesis and the semicolon count."
        tests:
          - expect: Ready, set, code!

  - id: printing-several-lines
    slug: several-lines
    title: Several lines, in order
    text: |
      A program's instructions are called **statements**. Inside `main` they run from top to bottom, one after another, and each `System.out.println` prints one line. In Java every statement ends with a semicolon `;`, much like a sentence ends with a full stop.

      ```java run
      public class Main {
          public static void main(String[] args) {
              System.out.println("3");
              System.out.println("2");
              System.out.println("1");
              System.out.println("Liftoff!");
          }
      }
      ```

      ```output
      3
      2
      1
      Liftoff!
      ```

      Swap two of the lines and the countdown is in the wrong order: the computer does exactly what the statements say, in the order they are written.

      ### The output has to match exactly

      The checks on this site compare what your program prints with the expected output, character by character. `Liftoff!` and `liftoff!` are different, and so are `Hello, world` and `Hello,world`. The only things ignored are spaces at the very end of a line and empty lines at the very end of the output. Real programs are held to the same standard: another program reading your output won't guess what you meant.

      ### Less typing

      `System.out.println` is long to type, especially on a phone. On a touch screen, the row of keys under the editor has a **sout** key that types `System.out.println();` for you, with the cursor inside the parentheses. Many Java editors have the same shortcut: type `sout` and press Tab.

      **Your turn:** the program prints the first line of a short rhyme. Add the two missing lines so it prints exactly:

      ```
      Semicolons end the line,
      braces keep the blocks in line,
      println makes the output shine.
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              System.out.println("Semicolons end the line,");
          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              System.out.println("Semicolons end the line,");
              System.out.println("braces keep the blocks in line,");
              System.out.println("println makes the output shine.");
          }
      }
    hints:
      - Each line of the rhyme needs its own `System.out.println("...");` statement, below the first one.
      - Copy the text exactly, including the commas, the full stop and the lower-case first letters.
    require:
      - pattern: System\.out\.println\s*\(
        min: 3
        max: 3
        message: Print each line of the rhyme with its own `System.out.println`, three in all.
    tests:
      - expect: |
          Semicolons end the line,
          braces keep the blocks in line,
          println makes the output shine.
    more:
      - task: |
          The morning routine got shuffled. Put the four statements in the right order so the program prints:

          ```
          Wake up
          Brush teeth
          Eat breakfast
          Start coding
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Eat breakfast");
                  System.out.println("Wake up");
                  System.out.println("Start coding");
                  System.out.println("Brush teeth");
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Wake up");
                  System.out.println("Brush teeth");
                  System.out.println("Eat breakfast");
                  System.out.println("Start coding");
              }
          }
        hints:
          - The statements run from top to bottom, so the line that should be printed first goes at the top.
          - "Move whole lines. On a phone: select a line, cut it, tap where it should go and paste."
        require:
          - pattern: System\.out\.println\s*\(
            min: 4
            max: 4
            message: Keep the four `System.out.println` statements and only change their order.
        tests:
          - expect: |
              Wake up
              Brush teeth
              Eat breakfast
              Start coding
      - task: |
          Print this label exactly, spaces included, with exactly four `System.out.println` statements, one per line:

          ```
          +-----------------+
          |  JAVA ARENA     |
          |  Part 1: Basics |
          +-----------------+
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  // Print the label here, one line per statement.
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  // Print the label here, one line per statement.
                  System.out.println("+-----------------+");
                  System.out.println("|  JAVA ARENA     |");
                  System.out.println("|  Part 1: Basics |");
                  System.out.println("+-----------------+");
              }
          }
        hints:
          - "All four lines are 19 characters wide. Count the spaces: two after the left `|`, and enough before the right `|` to line it up."
          - "The top and bottom lines are the same: a `+`, 17 dashes and a `+`."
        require:
          - pattern: System\.out\.println\s*\(
            min: 4
            max: 4
            message: Use exactly four `System.out.println` statements, one for each line of the label.
        tests:
          - expect: |
              +-----------------+
              |  JAVA ARENA     |
              |  Part 1: Basics |
              +-----------------+

  - id: printing-print-and-println
    slug: print-and-println
    title: print and println
    text: |
      `System.out.println` prints its text and then ends the line, so the next output starts on a new line. Its sibling `System.out.print` prints the text and stays on the same line, so the next output continues right after it.

      ```java main
      System.out.print("Loading");
      System.out.print("...");
      System.out.println(" done");
      System.out.println("Next line");
      ```

      ```output
      Loading... done
      Next line
      ```

      `print` never adds a space by itself. The space before `done` is there because it is inside the quotes.

      ### An empty line

      `System.out.println()` with nothing between the parentheses prints nothing and ends the line. That gives an empty line, or finishes a line that `print` started.

      ```java main
      System.out.println("First paragraph.");
      System.out.println();
      System.out.println("Second paragraph.");
      ```

      ```output
      First paragraph.

      Second paragraph.
      ```

      **Your turn:** choose `print` or `println` for the two blanks so the program prints exactly:

      ```
      Compiling... done!
      Running.
      ```
    fill: |
      public class Main {
          public static void main(String[] args) {
              System.out.[[print]]("Compiling... ");
              System.out.[[println]]("done!");
              System.out.println("Running.");
          }
      }
    hints:
      - "`Compiling... ` and `done!` are on the same line, so the first call must not end the line."
      - "The second call has to end the line, or `Running.` would continue right after `done!`."
    tests:
      - expect: |
          Compiling... done!
          Running.
    more:
      - task: |
          The text has two paragraphs, but they run together. Add an empty line between them, using `System.out.println()` with nothing inside the parentheses. The output should be:

          ```
          Step one: write the code.
          Step two: press Check.

          If a test fails, read the message,
          fix the code and press Check again.
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Step one: write the code.");
                  System.out.println("Step two: press Check.");
                  System.out.println("If a test fails, read the message,");
                  System.out.println("fix the code and press Check again.");
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Step one: write the code.");
                  System.out.println("Step two: press Check.");
                  System.out.println();
                  System.out.println("If a test fails, read the message,");
                  System.out.println("fix the code and press Check again.");
              }
          }
        hints:
          - The empty line goes between `Step two: press Check.` and `If a test fails, read the message,`.
          - "Add a new statement `System.out.println();` in that spot."
        require:
          - pattern: System\.out\.println\s*\(\s*\)
            message: "Make the empty line with `System.out.println()`, with nothing between the parentheses."
        tests:
          - expect: |
              Step one: write the code.
              Step two: press Check.

              If a test fails, read the message,
              fix the code and press Check again.
      - task: |
          Build the first line from three `print` calls, one for `Ready, `, one for `set, ` and one for `go!`, and then end the line. The whole output should be:

          ```
          Ready, set, go!
          Race started.
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  // Three print calls, then end the line.

                  System.out.println("Race started.");
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  // Three print calls, then end the line.
                  System.out.print("Ready, ");
                  System.out.print("set, ");
                  System.out.print("go!");
                  System.out.println();
                  System.out.println("Race started.");
              }
          }
        hints:
          - "`System.out.print(\"Ready, \");` prints the first piece and stays on the line. Mind the space after the comma."
          - "After the third `print`, the line is still open. `System.out.println();` ends it, so `Race started.` gets its own line."
        require:
          - pattern: System\.out\.print\s*\(
            min: 3
            message: Build the first line from three `System.out.print` calls.
        tests:
          - expect: |
              Ready, set, go!
              Race started.

  - id: printing-comments
    slug: comments
    title: Comments
    text: |
      A **comment** is a note for people reading the code. The compiler skips it completely, so it never changes what the program does. Java has two kinds:

      - `//` starts a comment that runs to the end of the line.
      - `/*` starts a comment that runs until the next `*/`, even across several lines.

      ```java run
      public class Main {
          public static void main(String[] args) {
              // This is a note. Java skips this line.
              System.out.println("Visible");
              // System.out.println("Hidden");
              /* A block comment
                 can span several lines. */
              System.out.println("Also visible");
          }
      }
      ```

      ```output
      Visible
      Also visible
      ```

      The fifth line shows a common trick: putting `//` in front of a statement **comments it out**. The statement stays in the file, so it's easy to bring back, but it doesn't run. That's handy when you want to try the program without one line.

      Inside quotes, `//` is ordinary text: `System.out.println("// not a comment");` prints `// not a comment`.

      **Your turn:** the shopping list has a line that doesn't belong on it. Comment out that line with `//` (don't delete it) so the program prints:

      ```
      Shopping list:
      - bread
      - milk
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              System.out.println("Shopping list:");
              System.out.println("- bread");
              System.out.println("- homework");
              System.out.println("- milk");
          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              System.out.println("Shopping list:");
              System.out.println("- bread");
              // System.out.println("- homework");
              System.out.println("- milk");
          }
      }
    hints:
      - The line to switch off is the one that prints `- homework`.
      - "Put `//` at the start of that line. The rest of the line becomes a comment."
    require:
      - pattern: //\s*System\.out\.println\s*\(\s*"- homework"
        raw: true
        message: "Turn the `- homework` line into a comment with `//` instead of deleting it."
    tests:
      - expect: |
          Shopping list:
          - bread
          - milk
    more:
      - task: |
          Someone wrote notes straight into the program, so it doesn't compile. Turn the three lines of notes into one block comment, starting with `/*` and ending with `*/`. Then the program compiles and prints:

          ```
          Program version 1
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  Notes for later:
                  add a greeting
                  print the date
                  System.out.println("Program version 1");
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  /* Notes for later:
                  add a greeting
                  print the date */
                  System.out.println("Program version 1");
              }
          }
        hints:
          - "Java tries to read the notes as code, and they aren't Java. Inside a comment they're skipped."
          - "Put `/*` before `Notes for later:` and `*/` after `print the date`."
        require:
          - pattern: /\*[\s\S]*Notes for later[\s\S]*print the date[\s\S]*\*/
            raw: true
            message: "Keep the notes, inside one block comment: `/*` before them and `*/` after them."
        tests:
          - expect: Program version 1
      - task: |
          This program should greet the player and then give an instruction, but the greeting never appears: a comment ends in the wrong place and hides it. Fix the comments so the notes stay comments and the program prints:

          ```
          Welcome, player one!
          Press Check to begin.
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  /* Say hello to the player.
                  System.out.println("Welcome, player one!");
                  Then give the first instruction. */
                  System.out.println("Press Check to begin.");
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  /* Say hello to the player. */
                  System.out.println("Welcome, player one!");
                  /* Then give the first instruction. */
                  System.out.println("Press Check to begin.");
              }
          }
        hints:
          - "The block comment starts at `/*` on the first line and only ends at the `*/` two lines further down, so the greeting is inside it."
          - "End the first comment right after `Say hello to the player.`, and make `Then give the first instruction.` a comment of its own."
        require:
          - pattern: Then give the first instruction
            raw: true
            message: Keep the note `Then give the first instruction.` as a comment.
        tests:
          - expect: |
              Welcome, player one!
              Press Check to begin.

  - id: printing-compiler-errors
    slug: compiler-errors
    title: Reading compiler errors
    text: |
      Before a program runs, the compiler reads all of it. If something isn't valid Java, it stops and prints an **error** instead, and nothing runs. Errors are normal: they're the compiler pointing at the exact spot it didn't understand. Here is a program with one character missing:

      ```java error
      public class Main {
          public static void main(String[] args) {
              System.out.println("Hello")
          }
      }
      ```

      ```javac
      Main.java:3: error: ';' expected
              System.out.println("Hello")
                                         ^
      1 error
      ```

      Read it piece by piece:

      - `Main.java:3` is the file and the **line number**: line 3.
      - `error: ';' expected` says what went wrong: Java expected a semicolon.
      - The next line repeats the code, and the `^` below it points at the exact position, here the end of the line where the `;` belongs.
      - `1 error` counts the errors. Fix the first one first: one mistake sometimes confuses the compiler into reporting more lines after it.

      On this site each error also gets a plain-English explanation under it, and the editor marks the line.

      ### A few words to know

      - A **statement** is one instruction, ending in a semicolon.
      - The text inside the parentheses of `println( ... )` is the **parameter**: the value the method works with.
      - A **typo** in a name gives a `cannot find symbol` error. For example `System.out.printn("Hi");` makes the compiler report that there is no method `printn`.

      **Your turn:** this program has one small mistake that stops it from compiling. Press **Check** to see the error, fix it, and check again. The program should print:

      ```
      First line
      Second line
      Third line
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              System.out.println("First line");
              System.out.println("Second line")
              System.out.println("Third line");
          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              System.out.println("First line");
              System.out.println("Second line");
              System.out.println("Third line");
          }
      }
    hints:
      - The error message names a line number. Look at the end of that line.
      - Every statement ends with a semicolon `;`. One of the three is missing its semicolon.
    tests:
      - expect: |
          First line
          Second line
          Third line
    more:
      - task: |
          Two mistakes this time, both about spelling and capital letters. Fix them so the program prints:

          ```
          Upper and lower case matter.
          Java noticed.
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  system.out.println("Upper and lower case matter.");
                  System.out.printin("Java noticed.");
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Upper and lower case matter.");
                  System.out.println("Java noticed.");
              }
          }
        hints:
          - "`System` starts with a capital `S`. With a small `s`, Java thinks `system` is the name of a package, which is why the message talks about a package that doesn't exist."
          - "The method is `println`: print, then a lower-case L and N, for line."
        tests:
          - expect: |
              Upper and lower case matter.
              Java noticed.
      - task: |
          A closing quote and a closing brace are missing. Find both and fix them so the program prints:

          ```
          Almost there
          Done!
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Almost there);
                  System.out.println("Done!");
              }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Almost there");
                  System.out.println("Done!");
              }
          }
        hints:
          - "Text starts and ends with a double quote on the same line. Which text has only one quote?"
          - "Count the braces: the class and the main method each need a `{` and a `}`. The program ends one `}` short."
        tests:
          - expect: |
              Almost there
              Done!
