id: reading-input
summary: Programs that react to what the user types. Reading lines with a Scanner, keeping text in String variables, and joining text together with +.
steps:
  - id: reading-input-scanner
    slug: reading-a-line
    title: Reading a line with Scanner
    text: |
      So far the programs printed the same thing every time. Most programs also take **input**: something the user types. In Java, a **Scanner** reads it. Using one takes three pieces:

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println("Write a message:");
              String message = scanner.nextLine();
              System.out.println(message);
          }
      }
      ```

      ```input
      Hello there
      ```

      ```output
      Write a message:
      Hello there
      ```

      - `import java.util.Scanner;` at the very top tells the compiler where the Scanner comes from. Scanner is part of Java's standard library, in the package `java.util`, and a program has to import it before using it.
      - `Scanner scanner = new Scanner(System.in);` creates a Scanner called `scanner` that reads from `System.in`, the program's input. One Scanner is enough for the whole program.
      - `String message = scanner.nextLine();` waits until the user has typed a line and pressed Enter, then keeps that line in `message`. The next step explains what `String message` means.

      ### Input on this site

      When you run a program in a terminal, you type the input while it runs, and your typing appears on the screen between the program's lines. The checks here give the program all of its input at the start instead, like a pre-typed answer sheet, so the expected output only contains what the program itself prints. That's why `Hello there` appears once in the output above, not twice.

      **Your turn:** fill in the two blanks: the class to import, and the Scanner method that reads a whole line. The program then prints back whatever line it reads.
    fill: |
      import java.util.[[Scanner‖*]];

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              String line = scanner.[[nextLine]]();
              System.out.println(line);
          }
      }
    hints:
      - The import names the class the program uses, with the same capital letters.
      - "The method that reads one whole line is `nextLine`, with a capital L."
    tests:
      - stdin: Echo, echo
      - stdin: Anything at all
        hidden: true
      - stdin: "  spaces at the start are kept"
        hidden: true
    more:
      - task: |
          Read one line, then print `You said:` followed by the line twice, each on its own line. For the input `Good morning` the program prints:

          ```
          You said:
          Good morning
          Good morning
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  // Read the line, then print the three lines.
              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  // Read the line, then print the three lines.
                  String line = scanner.nextLine();
                  System.out.println("You said:");
                  System.out.println(line);
                  System.out.println(line);
              }
          }
        hints:
          - "`String line = scanner.nextLine();` reads the line once. You can print `line` as many times as you like."
          - "`System.out.println(line);` prints the text that was read. Without quotes around `line`, Java prints its contents."
        require:
          - pattern: \.nextLine\s*\(\s*\)
            max: 1
            message: Read the line only once, with one `nextLine()`, and print it twice.
        tests:
          - stdin: Good morning
          - stdin: Java is fun
            hidden: true
          - stdin: "42"
            hidden: true
      - task: |
          Write the whole program: read one line and print it three times, between two lines of five equals signs. For the input `Java` it prints:

          ```
          =====
          Java
          Java
          Java
          =====
          ```
        seed: |
          // Remember the import, the class and the main method.
        solution: |
          // Remember the import, the class and the main method.
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  String text = scanner.nextLine();
                  System.out.println("=====");
                  System.out.println(text);
                  System.out.println(text);
                  System.out.println(text);
                  System.out.println("=====");
              }
          }
        hints:
          - "The program needs `import java.util.Scanner;` at the top, then the class and main method."
          - "Create the Scanner, read the line with `nextLine()`, then print five lines."
        tests:
          - stdin: Java
          - stdin: Hello, world
            hidden: true
          - stdin: x
            hidden: true

  - id: reading-input-string-variables
    slug: string-variables
    title: String variables
    text: |
      A **variable** is a named place that holds a value. `String message = scanner.nextLine();` in the last step created one. Variables can also get their value straight from the code:

      ```java main
      String food = "pizza";
      System.out.println(food);
      System.out.println("food");
      ```

      ```output
      pizza
      food
      ```

      The line `String food = "pizza";` has three parts:

      - `String` is the variable's **type**: what kind of value it holds. A `String` holds text.
      - `food` is the variable's **name**. You choose it.
      - `= "pizza"` gives it its value.

      After that, the name stands for the value. That's why `System.out.println(food)` prints `pizza`, while `System.out.println("food")`, with quotes, prints the word `food` itself. Quotes mean "this exact text"; no quotes mean "the value of this variable".

      A variable has to be created before it's used, and Java checks the name's spelling and capitals: `Food` and `food` are two different names.

      **Your turn:** create a String variable called `planet` that holds the text `Mars`, and print the variable (not the text in quotes).
    seed: |
      public class Main {
          public static void main(String[] args) {
              // Create the variable, then print it.
          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              // Create the variable, then print it.
              String planet = "Mars";
              System.out.println(planet);
          }
      }
    hints:
      - "A String variable is created like this: `String name = \"value\";`"
      - "Then `System.out.println(planet);` prints its value. No quotes around `planet`."
    require:
      - pattern: String\s+planet\s*=
        message: "Create the variable with `String planet = ...`."
      - pattern: println\s*\(\s*planet\s*\)
        message: "Print the variable: `System.out.println(planet);`."
    tests:
      - expect: Mars
    more:
      - task: |
          This program should print the values of its two variables, but it prints their names instead. Fix it so it prints:

          ```
          Helsinki
          Finland
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  String city = "Helsinki";
                  String country = "Finland";
                  System.out.println("city");
                  System.out.println("country");
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  String city = "Helsinki";
                  String country = "Finland";
                  System.out.println(city);
                  System.out.println(country);
              }
          }
        hints:
          - Text in quotes is printed exactly as written, so `"city"` prints the word city.
          - Remove the quotes around the names, so Java prints the variables' values.
        forbid:
          - pattern: println\s*\(\s*""\s*\)
            message: Print the variables themselves, with no quotes around their names.
        tests:
          - expect: |
              Helsinki
              Finland
      - task: |
          Create three String variables: `breakfast` holding `oatmeal`, `lunch` holding `soup` and `dinner` holding `pasta`. Then print the variables in this order: dinner, breakfast, lunch.

          ```
          pasta
          oatmeal
          soup
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  // Three variables, then three prints.
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  // Three variables, then three prints.
                  String breakfast = "oatmeal";
                  String lunch = "soup";
                  String dinner = "pasta";
                  System.out.println(dinner);
                  System.out.println(breakfast);
                  System.out.println(lunch);
              }
          }
        hints:
          - "One line per variable, for example `String lunch = \"soup\";`"
          - The order of the prints decides the order of the output, not the order of the variables.
        require:
          - pattern: String\s+breakfast\s*=
            message: Create a variable called `breakfast`.
          - pattern: String\s+lunch\s*=
            message: Create a variable called `lunch`.
          - pattern: String\s+dinner\s*=
            message: Create a variable called `dinner`.
        forbid:
          - pattern: println\s*\(\s*""\s*\)
            message: Print the variables, not text in quotes.
        tests:
          - expect: |
              pasta
              oatmeal
              soup

  - id: reading-input-joining-strings
    slug: joining-strings
    title: Joining strings with +
    text: |
      Between pieces of text, `+` joins them into one longer text. This is called **concatenation**. It works with variables too, so a program can build a sentence around what the user typed:

      ```java main
      Scanner scanner = new Scanner(System.in);
      System.out.println("What is your name?");
      String name = scanner.nextLine();
      System.out.println("Hi " + name + ", nice to meet you!");
      ```

      ```input
      Ada
      ```

      ```output
      What is your name?
      Hi Ada, nice to meet you!
      ```

      (From here on, some examples show only the lines inside `main`. The class, the main method and the import around them are the same as before.)

      `+` adds no spaces of its own. Every space in the result has to be inside some quotes: `"Hi " + name` gives `Hi Ada`, but `"Hi" + name` gives `HiAda`. The same goes for commas and other punctuation.

      A single `println` can join as many pieces as you like: `"a" + b + "c" + d` works from left to right.

      **Your turn:** the variable `language` holds `Java`. Print `I am learning Java!` by joining the variable between two pieces of text, instead of typing `Java` into the text.
    seed: |
      public class Main {
          public static void main(String[] args) {
              String language = "Java";
              // Print: I am learning Java! (use the variable)
          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              String language = "Java";
              // Print: I am learning Java! (use the variable)
              System.out.println("I am learning " + language + "!");
          }
      }
    hints:
      - "The text before the variable is `\"I am learning \"`, with a space at the end."
      - "Join three pieces: `\"I am learning \" + language + \"!\"`."
    require:
      - pattern: \+\s*language\s*\+
        message: "Join the variable between two pieces of text with `+`: `\"...\" + language + \"...\"`."
    forbid:
      - pattern: println\s*\([^;]*"[^"]*Java
        raw: true
        message: Use the variable `language` instead of typing `Java` into the printed text.
    tests:
      - expect: I am learning Java!
    more:
      - task: |
          Ask for a name, read it, and greet the person. For the input `Ada` the program prints:

          ```
          What is your name?
          Hello, Ada!
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  System.out.println("What is your name?");
                  String name = scanner.nextLine();
                  System.out.println("Hello, " + name + "!");
              }
          }
        hints:
          - Print the question first, then read the name with `scanner.nextLine()`.
          - "`\"Hello, \" + name + \"!\"` puts the name between the comma and space and the exclamation mark."
        tests:
          - stdin: Ada
          - stdin: Linus
            hidden: true
          - stdin: Grace Hopper
            hidden: true
      - task: |
          Read a first name and a last name, on two lines, and print them back in two ways. For the input `Ada` and `Lovelace` the program prints:

          ```
          First name:
          Last name:
          Nice to meet you, Ada Lovelace.
          In a list: Lovelace, Ada
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  System.out.println("First name:");
                  String first = scanner.nextLine();
                  System.out.println("Last name:");
                  String last = scanner.nextLine();
                  System.out.println("Nice to meet you, " + first + " " + last + ".");
                  System.out.println("In a list: " + last + ", " + first);
              }
          }
        hints:
          - "Two questions, two reads: each `nextLine()` reads the next line of input."
          - "Between the names goes `\" \"`, a text that is just one space: `first + \" \" + last`."
          - "The list form is `last + \", \" + first`."
        tests:
          - stdin: |
              Ada
              Lovelace
          - stdin: |
              Alan
              Turing
            hidden: true
          - stdin: |
              Margaret
              Hamilton
            hidden: true

  - id: reading-input-several-inputs
    slug: several-inputs
    title: Several inputs in order
    text: |
      Each call to `nextLine()` reads the next line of input, so a program can read as many lines as it needs, one after another. They're read in order: the first `nextLine()` gets the first line, the second gets the second, and so on. The program waits at each `nextLine()` until a line is there.

      ```java main
      Scanner scanner = new Scanner(System.in);
      System.out.println("First word?");
      String first = scanner.nextLine();
      System.out.println("Second word?");
      String second = scanner.nextLine();
      System.out.println(second + " " + first);
      ```

      ```input
      world
      hello
      ```

      ```output
      First word?
      Second word?
      hello world
      ```

      The variables keep their values, so the program can print them in any order and as often as it likes. Only the reading has to follow the order of the input.

      If a program asks for more lines than the input has, it stops with an error: `NoSuchElementException: No line found`. When that happens on this site, the result explains it. It usually means the program reads one line too many.

      **Your turn:** ask two questions and print the answers. For the input `blue` and `whale` the program prints:

      ```
      Favorite color?
      Favorite animal?
      Color: blue
      Animal: whale
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println("Favorite color?");
              String color = scanner.nextLine();
              System.out.println("Favorite animal?");
              String animal = scanner.nextLine();
              System.out.println("Color: " + color);
              System.out.println("Animal: " + animal);
          }
      }
    hints:
      - "Ask, read, ask, read: print a question, then read its answer with `nextLine()`."
      - "Keep each answer in its own variable, for example `color` and `animal`, and print them at the end."
    tests:
      - stdin: |
          blue
          whale
      - stdin: |
          green
          frog
        hidden: true
      - stdin: |
          dark red
          red panda
        hidden: true
    more:
      - task: |
          Read three lines and print them back in reverse order. For the input `one`, `two` and `three` the program prints:

          ```
          three
          two
          one
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  String first = scanner.nextLine();
                  String second = scanner.nextLine();
                  String third = scanner.nextLine();
                  System.out.println(third);
                  System.out.println(second);
                  System.out.println(first);
              }
          }
        hints:
          - Read all three lines first, each into its own variable.
          - Then print the variables starting from the last one read.
        tests:
          - stdin: |
              one
              two
              three
          - stdin: |
              red
              green
              blue
            hidden: true
          - stdin: |
              first line
              middle line
              last line
            hidden: true
      - task: |
          Write a tiny story generator. Ask for a hero's name and a place, then print a three-line story that uses each of them more than once. For the input `Ada` and `Helsinki` the program prints:

          ```
          Hero's name?
          A place?
          Once upon a time, Ada set off for Helsinki.
          Ada walked for days and days.
          When Ada finally reached Helsinki, the whole town cheered.
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  System.out.println("Hero's name?");
                  String hero = scanner.nextLine();
                  System.out.println("A place?");
                  String place = scanner.nextLine();
                  System.out.println("Once upon a time, " + hero + " set off for " + place + ".");
                  System.out.println(hero + " walked for days and days.");
                  System.out.println("When " + hero + " finally reached " + place + ", the whole town cheered.");
              }
          }
        hints:
          - Read the two answers into variables first. Each variable can then be used as many times as you need.
          - "Build each story line with `+`, for example `\"Once upon a time, \" + hero + \" set off for \" + place + \".\"`."
          - "The apostrophe in `Hero's` is fine inside double quotes."
        tests:
          - stdin: |
              Ada
              Helsinki
          - stdin: |
              Captain Byte
              the Moon
            hidden: true
          - stdin: |
              Mo
              Rome
            hidden: true
