id: variables
summary: Variables of the four basic types (int, double, boolean and String), changing their values, naming them well, and reading numbers and true or false answers from the user.
steps:
  - id: variables-types
    slug: variables-and-types
    title: Variables and their types
    text: |
      A variable holds a value under a name. Every Java variable also has a **type**, which says what kind of value it can hold. Four types cover most of what you'll need for now:

      | Type | Holds | Examples |
      |---|---|---|
      | `int` | whole numbers | `3`, `-12`, `2026` |
      | `double` | numbers with a decimal point | `0.45`, `-3.5`, `2.0` |
      | `boolean` | true or false | `true`, `false` |
      | `String` | text | `"apple"`, `"Hello!"` |

      A variable is created by writing its type, its name and its first value:

      ```java main
      int apples = 12;
      double price = 0.45;
      boolean inStock = true;
      String fruit = "apple";
      System.out.println(fruit + ": " + apples + " at " + price);
      System.out.println("In stock: " + inStock);
      ```

      ```output
      apple: 12 at 0.45
      In stock: true
      ```

      As the last two lines show, `+` joins numbers and booleans into text too: `"In stock: " + inStock` becomes `In stock: true`.

      ### The type decides what fits

      A variable can only hold values that fit its type. Putting a decimal number into an `int` would lose the part after the point, so Java refuses to compile it:

      ```java error
      public class Main {
          public static void main(String[] args) {
              int price = 4.99;
              System.out.println(price);
          }
      }
      ```

      ```javac
      Main.java:3: error: incompatible types: possible lossy conversion from double to int
              int price = 4.99;
                          ^
      1 error
      ```

      The other way round is fine: `double distance = 5;` compiles, because a whole number fits in a `double` without losing anything (it becomes `5.0`).

      Note the capital `S` in `String`: it's a class, like `Scanner`, while `int`, `double` and `boolean` are built into the language and written in lower case.

      **Your turn:** fill in the three values so the program prints exactly `Mo ran 3 laps of 2.5 km`.
    fill: |
      public class Main {
          public static void main(String[] args) {
              int laps = [[3]];
              double distance = [[2.5]];
              String runner = "[[Mo]]";
              System.out.println(runner + " ran " + laps + " laps of " + distance + " km");
          }
      }
    hints:
      - "Compare the print line with the output: `runner` becomes `Mo`, `laps` becomes `3` and `distance` becomes `2.5`."
      - "A String's value goes between the quotes, which are already there. Numbers are written without quotes."
    tests:
      - expect: Mo ran 3 laps of 2.5 km
    more:
      - task: |
          Choose the right type for each of the four variables, so the program compiles and prints `Oslo, 2026: -3.5 degrees, raining: false`.
        fill: |
          public class Main {
              public static void main(String[] args) {
                  [[int‖long]] year = 2026;
                  [[double]] temperature = -3.5;
                  [[boolean]] raining = false;
                  [[String]] city = "Oslo";
                  System.out.println(city + ", " + year + ": " + temperature + " degrees, raining: " + raining);
              }
          }
        hints:
          - "Look at each value: a whole number, a number with a decimal point, `false`, and text in quotes."
          - "The types are `int`, `double`, `boolean` and `String`. Only `String` starts with a capital letter."
        tests:
          - expect: "Oslo, 2026: -3.5 degrees, raining: false"
      - task: |
          Create four variables: a String `name` holding `Kai`, an int `age` holding `17`, a double `height` holding `1.82` and a boolean `student` holding `true`. Then print them with labels, using the variables (not the values typed into the text):

          ```
          Name: Kai
          Age: 17
          Height: 1.82
          Student: true
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  // Four variables, then four lines of output.
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  // Four variables, then four lines of output.
                  String name = "Kai";
                  int age = 17;
                  double height = 1.82;
                  boolean student = true;
                  System.out.println("Name: " + name);
                  System.out.println("Age: " + age);
                  System.out.println("Height: " + height);
                  System.out.println("Student: " + student);
              }
          }
        hints:
          - "One line per variable, for example `double height = 1.82;`"
          - "Print each with its label: `System.out.println(\"Age: \" + age);`"
        require:
          - pattern: String\s+name\s*=
            message: Create a String variable called `name`.
          - pattern: int\s+age\s*=
            message: Create an int variable called `age`.
          - pattern: double\s+height\s*=
            message: Create a double variable called `height`.
          - pattern: boolean\s+student\s*=
            message: Create a boolean variable called `student`.
        forbid:
          - pattern: print(ln|f)?\s*\([^;]*"[^"]*(Kai|17|1\.82|true)[^"]*"
            raw: true
            message: Print the variables; don't type their values into the printed text.
        tests:
          - expect: |
              Name: Kai
              Age: 17
              Height: 1.82
              Student: true

  - id: variables-changing
    slug: changing-values
    title: Changing a value
    text: |
      A variable's value can change while the program runs. To give an existing variable a new value, write its name, `=` and the value, without the type in front:

      ```java main
      int lives = 3;
      System.out.println("Lives: " + lives);
      lives = 2;
      System.out.println("Lives: " + lives);
      ```

      ```output
      Lives: 3
      Lives: 2
      ```

      The `=` here means "put this value into the variable", not "is equal to". The old value is gone after the assignment.

      ### Create once, change many times

      The type is written only once, when the variable is created. Writing it again creates a second variable with the same name, which Java doesn't allow:

      ```java error
      public class Main {
          public static void main(String[] args) {
              int points = 10;
              int points = 25;
              System.out.println(points);
          }
      }
      ```

      ```javac
      Main.java:4: error: variable points is already defined in method main(String[])
              int points = 25;
                  ^
      1 error
      ```

      And the type stays the same for the variable's whole life: an `int` variable can't later hold text. `age = "twenty";` fails with `incompatible types: String cannot be converted to int`.

      **Your turn:** change `weather` to `rainy` between the two prints, so the program prints:

      ```
      Morning: sunny
      Evening: rainy
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              String weather = "sunny";
              System.out.println("Morning: " + weather);
              // Change weather to rainy here.
              System.out.println("Evening: " + weather);
          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              String weather = "sunny";
              System.out.println("Morning: " + weather);
              // Change weather to rainy here.
              weather = "rainy";
              System.out.println("Evening: " + weather);
          }
      }
    hints:
      - "The variable already exists, so leave out the type: `weather = ...;`"
      - "`weather = \"rainy\";` goes between the two print lines."
    require:
      - pattern: String\s+weather
        max: 1
        message: "Keep the one `String weather` variable and give it a new value; don't create a second one."
    forbid:
      - pattern: print(ln|f)?\s*\([^;]*rainy
        raw: true
        message: "Print the variable in the second line too; don't type `rainy` into the printed text."
    tests:
      - expect: |
          Morning: sunny
          Evening: rainy
    more:
      - task: |
          This program doesn't compile, because it creates the variable `points` twice. Fix it so it changes the value instead, and prints:

          ```
          Points: 10
          Points: 25
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  int points = 10;
                  System.out.println("Points: " + points);
                  int points = 25;
                  System.out.println("Points: " + points);
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  int points = 10;
                  System.out.println("Points: " + points);
                  points = 25;
                  System.out.println("Points: " + points);
              }
          }
        hints:
          - The error says the variable is already defined. The second line that starts with `int points` is the problem.
          - Remove `int` from that line, so it changes the existing variable.
        require:
          - pattern: int\s+points
            max: 1
            message: "Create `points` only once."
        tests:
          - expect: |
              Points: 10
              Points: 25
      - task: |
          A price with cents doesn't fit in an `int`, so this program doesn't compile. Choose the right type for `price` so it prints:

          ```
          Price: 4.99
          Sale price: 3.99
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  int price = 4.99;
                  System.out.println("Price: " + price);
                  price = 3.99;
                  System.out.println("Sale price: " + price);
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  double price = 4.99;
                  System.out.println("Price: " + price);
                  price = 3.99;
                  System.out.println("Sale price: " + price);
              }
          }
        hints:
          - "The error says `possible lossy conversion from double to int`: the value has a decimal part, but the variable is an `int`."
          - "Numbers with a decimal point go in a `double`."
        tests:
          - expect: |
              Price: 4.99
              Sale price: 3.99

  - id: variables-naming
    slug: naming-variables
    title: Naming variables
    text: |
      You choose each variable's name. A good name says what the value means: `price`, `laps`, `firstName`. Java has a few rules for names:

      - Letters, digits, `_` and `$` are allowed, but a name can't **start** with a digit: `level2` is fine, `2ndLevel` isn't.
      - No spaces and no other symbols, like `!`, `-` or `.`.
      - Words that are part of Java itself, such as `class`, `int` or `public`, can't be names.
      - Capitals matter: `score` and `Score` are two different names.

      When a name is made of several words, Java programmers write it in **camelCase**: the first word in lower case, and every following word starting with a capital: `firstName`, `numberOfLaps`, `isRaining`.

      ```java main
      String firstName = "Grace";
      int yearOfBirth = 1906;
      System.out.println(firstName + " was born in " + yearOfBirth + ".");
      ```

      ```output
      Grace was born in 1906.
      ```

      A name that breaks the rules confuses the compiler, and its errors can look strange. `String first name` gives `';' expected`, because Java reads `first` as the whole name and then doesn't know what `name` is doing there.

      **Your turn:** the names below contain spaces, so the program doesn't compile. Rename them to `firstName` and `lastName` (camelCase), so it prints `Grace Hopper`.
    seed: |
      public class Main {
          public static void main(String[] args) {
              String first name = "Grace";
              String last name = "Hopper";
              System.out.println(first name + " " + last name);
          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              String firstName = "Grace";
              String lastName = "Hopper";
              System.out.println(firstName + " " + lastName);
          }
      }
    hints:
      - "Remove the space and start the second word with a capital: `first name` becomes `firstName`."
      - Change the names everywhere they appear, in the print line too.
    require:
      - pattern: \bfirstName\b
        message: "Name the first variable `firstName`."
      - pattern: \blastName\b
        message: "Name the second variable `lastName`."
    tests:
      - expect: Grace Hopper
    more:
      - task: |
          Two names break the rules: one starts with a digit and one contains `!`. Rename `2ndPlace` to `secondPlace` and `bonus!` to `bonus`, so the program prints:

          ```
          Second place: 7
          Bonus: 3
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  int 2ndPlace = 7;
                  int bonus! = 3;
                  System.out.println("Second place: " + 2ndPlace);
                  System.out.println("Bonus: " + bonus!);
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  int secondPlace = 7;
                  int bonus = 3;
                  System.out.println("Second place: " + secondPlace);
                  System.out.println("Bonus: " + bonus);
              }
          }
        hints:
          - A name can't start with a digit, and `!` isn't allowed in names at all.
          - Change the names in all four lines.
        require:
          - pattern: \bsecondPlace\b
            message: "Name the first variable `secondPlace`."
          - pattern: int\s+bonus\s*=
            message: "Name the second variable `bonus`."
        tests:
          - expect: |
              Second place: 7
              Bonus: 3
      - task: |
          This program works, but its names `a`, `b` and `c` say nothing. Rename them to `city`, `population` and `area`, keeping the output the same:

          ```
          Riverton has 48200 people and covers 31.5 square km.
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  // Riverton is a made-up town.
                  String a = "Riverton";
                  int b = 48200;
                  double c = 31.5;
                  System.out.println(a + " has " + b + " people and covers " + c + " square km.");
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  // Riverton is a made-up town.
                  String city = "Riverton";
                  int population = 48200;
                  double area = 31.5;
                  System.out.println(city + " has " + population + " people and covers " + area + " square km.");
              }
          }
        hints:
          - "`a` holds the town's name, `b` the number of people and `c` the size."
          - Rename each variable where it's created and where it's printed.
        require:
          - pattern: String\s+city\s*=
            message: "Name the text variable `city`."
          - pattern: int\s+population\s*=
            message: "Name the whole-number variable `population`."
          - pattern: double\s+area\s*=
            message: "Name the decimal variable `area`."
        forbid:
          - pattern: \b[abc]\b
            message: "Replace every `a`, `b` and `c` with the new names."
        tests:
          - expect: Riverton has 48200 people and covers 31.5 square km.

  - id: variables-reading-integers
    slug: reading-integers
    title: Reading integers
    text: |
      `scanner.nextLine()` always gives text, a String, even when the user types digits. To calculate with the number, the text has to be turned into an `int`. `Integer.valueOf(...)` does that:

      ```java main
      Scanner scanner = new Scanner(System.in);
      System.out.println("How old are you?");
      int age = Integer.valueOf(scanner.nextLine());
      System.out.println("Next year you'll be " + (age + 1) + ".");
      ```

      ```input
      29
      ```

      ```output
      How old are you?
      Next year you'll be 30.
      ```

      Reading and converting fit on one line: the inner part, `scanner.nextLine()`, runs first and gives the text `"29"`, and `Integer.valueOf` turns it into the number `29`. (`age + 1` in parentheses is calculated before it's joined to the text; the next module is all about calculating.)

      `Integer.parseInt(...)` does the same job, and you'll see both in Java code. If the text isn't a whole number, for example `twenty` or `2.5`, the program stops with a `NumberFormatException`.

      **Your turn:** fill in the blank, so the program turns the line it reads into an `int`.
    fill: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int number = Integer.[[valueOf‖parseInt]](scanner.nextLine());
              System.out.println("You gave the number " + number);
          }
      }
    hints:
      - The method of `Integer` that turns text into a number is `valueOf`.
      - "`Integer.valueOf(scanner.nextLine())` reads a line and converts it."
    tests:
      - stdin: "42"
      - stdin: "-7"
        hidden: true
      - stdin: "0"
        hidden: true
    more:
      - task: |
          Ask for a lucky number, read it as an `int`, and print it in a sentence. For the input `7` the program prints:

          ```
          What is your lucky number?
          Your lucky number is 7.
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  System.out.println("What is your lucky number?");
                  int lucky = Integer.valueOf(scanner.nextLine());
                  System.out.println("Your lucky number is " + lucky + ".");
              }
          }
        hints:
          - "Print the question, then read and convert: `int lucky = Integer.valueOf(scanner.nextLine());`"
          - "The full stop at the end goes in its own text: `... + lucky + \".\"`."
        require:
          - pattern: Integer\s*\.\s*(valueOf|parseInt)\s*\(
            message: "Turn the input into an `int` with `Integer.valueOf(...)`."
        tests:
          - stdin: "7"
          - stdin: "13"
            hidden: true
          - stdin: "2026"
            hidden: true
      - task: |
          Read two whole numbers, one per line, and print them on one line. No calculating yet. For the input `4` and `9` the program prints:

          ```
          First number:
          Second number:
          You gave 4 and 9.
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  System.out.println("First number:");
                  int first = Integer.valueOf(scanner.nextLine());
                  System.out.println("Second number:");
                  int second = Integer.valueOf(scanner.nextLine());
                  System.out.println("You gave " + first + " and " + second + ".");
              }
          }
        hints:
          - "Two questions and two reads, each read converted with `Integer.valueOf`."
          - "`\"You gave \" + first + \" and \" + second + \".\"` joins the pieces."
        require:
          - pattern: Integer\s*\.\s*(valueOf|parseInt)\s*\(
            min: 2
            message: "Turn both inputs into `int` values with `Integer.valueOf(...)`."
        tests:
          - stdin: |
              4
              9
          - stdin: |
              100
              -5
            hidden: true
          - stdin: |
              0
              0
            hidden: true

  - id: variables-doubles-booleans
    slug: doubles-and-booleans
    title: Reading doubles and booleans
    text: |
      Decimal numbers and true-or-false answers are read the same way: read a line, then convert it.

      - `Double.valueOf(text)` turns text like `2.5` or `-0.75` into a `double`.
      - `Boolean.valueOf(text)` gives `true` when the text is `true` in any mix of capitals (`TRUE`, `True`), and `false` for anything else.

      ```java main
      Scanner scanner = new Scanner(System.in);
      double height = Double.valueOf(scanner.nextLine());
      boolean ready = Boolean.valueOf(scanner.nextLine());
      System.out.println("Height: " + height);
      System.out.println("Ready: " + ready);
      ```

      ```input
      2
      yes
      ```

      ```output
      Height: 2.0
      Ready: false
      ```

      Two things in that output are worth a second look:

      - The input was `2`, but the program prints `2.0`. A `double` is always printed with its decimal part.
      - The input was `yes`, which isn't `true`, so the boolean is `false`.

      **Your turn:** ask for a decimal number, read it as a `double` and print it. For the input `3.75` the program prints:

      ```
      Give a decimal number:
      You gave 3.75
      ```

      A hidden test types a whole number: as a `double`, `4` is printed as `4.0`.
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println("Give a decimal number:");
              double number = Double.valueOf(scanner.nextLine());
              System.out.println("You gave " + number);
          }
      }
    hints:
      - "`Double.valueOf(scanner.nextLine())` reads a line and turns it into a `double`."
      - "Keep the value in a `double` variable, so a whole number is printed with `.0`."
    require:
      - pattern: Double\s*\.\s*(valueOf|parseDouble)\s*\(
        message: "Turn the input into a `double` with `Double.valueOf(...)`."
    tests:
      - stdin: "3.75"
      - stdin: "4"
        hidden: true
      - stdin: "-0.5"
        hidden: true
    more:
      - task: |
          Ask whether it's raining, read the answer as a `boolean` with `Boolean.valueOf`, and print it. For the input `true` the program prints:

          ```
          Is it raining?
          Raining: true
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  System.out.println("Is it raining?");
                  boolean raining = Boolean.valueOf(scanner.nextLine());
                  System.out.println("Raining: " + raining);
              }
          }
        hints:
          - "`boolean raining = Boolean.valueOf(scanner.nextLine());`"
          - "Hidden tests type `TrUe` and `maybe`. `Boolean.valueOf` already handles both: capitals don't matter, and anything that isn't `true` is `false`."
        require:
          - pattern: Boolean\s*\.\s*(valueOf|parseBoolean)\s*\(
            message: "Turn the input into a `boolean` with `Boolean.valueOf(...)`."
        tests:
          - stdin: "true"
          - stdin: "TrUe"
            hidden: true
          - stdin: "maybe"
            hidden: true
      - task: |
          Read a price (a `double`) and whether the customer is a member (a `boolean`), in that order, and print both with labels. For the input `12.5` and `false` the program prints:

          ```
          Price:
          Member?
          Price: 12.5
          Member: false
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  System.out.println("Price:");
                  double price = Double.valueOf(scanner.nextLine());
                  System.out.println("Member?");
                  boolean member = Boolean.valueOf(scanner.nextLine());
                  System.out.println("Price: " + price);
                  System.out.println("Member: " + member);
              }
          }
        hints:
          - The price is read and converted with `Double.valueOf`, the answer with `Boolean.valueOf`.
          - Ask both questions first, then print the two labelled lines.
        require:
          - pattern: Double\s*\.\s*(valueOf|parseDouble)\s*\(
            message: "Read the price with `Double.valueOf(...)`."
          - pattern: Boolean\s*\.\s*(valueOf|parseBoolean)\s*\(
            message: "Read the answer with `Boolean.valueOf(...)`."
        tests:
          - stdin: |
              12.5
              false
          - stdin: |
              3
              TRUE
            hidden: true
          - stdin: |
              0.99
              no
            hidden: true

  - id: variables-mixing-types
    slug: mixing-input-types
    title: Mixing input types
    text: |
      A program often reads several kinds of values. The recipe is the same every time: read one line with `scanner.nextLine()`, then convert it to the type you need.

      | To get | Write |
      |---|---|
      | a `String` | `scanner.nextLine()` |
      | an `int` | `Integer.valueOf(scanner.nextLine())` |
      | a `double` | `Double.valueOf(scanner.nextLine())` |
      | a `boolean` | `Boolean.valueOf(scanner.nextLine())` |

      Each read takes the next line of input, so the order of the reads has to match the order of the input.

      ```java main
      Scanner scanner = new Scanner(System.in);
      String item = scanner.nextLine();
      int count = Integer.valueOf(scanner.nextLine());
      double weight = Double.valueOf(scanner.nextLine());
      System.out.println(count + " x " + item + ", " + weight + " kg each");
      ```

      ```input
      melon
      3
      1.25
      ```

      ```output
      3 x melon, 1.25 kg each
      ```

      **Your turn:** read a name and then an age (an `int`), and print one sentence. For the input `Ada` and `36` the program prints:

      ```
