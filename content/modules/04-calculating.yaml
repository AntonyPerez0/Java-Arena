  - id: calculating-with-input
    slug: calculating-with-input
    title: Calculating with input
    text: |
      Numbers read from the user work like any other numbers once they're converted. A common pattern: read, calculate, then print the result.

      ```java main
      Scanner scanner = new Scanner(System.in);
      int price = Integer.valueOf(scanner.nextLine());
      int count = Integer.valueOf(scanner.nextLine());
      int total = price * count;
      System.out.println("Total: " + total);
      ```

      ```input
      12
      4
      ```

      ```output
      Total: 48
      ```

      Storing the result in its own variable (`total` here) gives it a name, which makes the program easier to read than one long line. It also lets you use the result more than once.

      **Your turn:** read two whole numbers and print their sum. For the input `3` and `8` the program prints:

      ```
      First number:
      Second number:
      Sum: 11
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println("First number:");
              int first = Integer.valueOf(scanner.nextLine());
              System.out.println("Second number:");
              int second = Integer.valueOf(scanner.nextLine());
              int sum = first + second;
              System.out.println("Sum: " + sum);
          }
      }
    hints:
      - Read both numbers with `Integer.valueOf(scanner.nextLine())`.
      - "Calculate the sum into its own variable, then print `\"Sum: \" + sum`."
