  - id: calculating-tracing
    slug: tracing-values
    title: Tracing values
    text: |
      `=` copies a value into a variable, once. After `a = b;`, the variable `a` holds the same number as `b`, but the two aren't linked: changing `b` later doesn't change `a`.

      ```java main
      int b = 5;
      int a = b;
      b = 8;
      System.out.println(a);
      System.out.println(b);
      ```

      ```output
      5
      8
      ```

      When a program gets confusing, trace it by hand: go through it line by line and write down what each variable holds after each line.

      | After line | a | b |
      |---|---|---|
      | `int b = 5;` | | 5 |
      | `int a = b;` | 5 | 5 |
      | `b = 8;` | 5 | 8 |

      Tracing is how programmers check their own thinking, and it's a skill worth practicing on paper, without running anything.

      **Your turn:** what does this program print? Trace it and type each line.
    predict: |
      public class Main {
          public static void main(String[] args) {
              int first = 10;
              int second = 3;
              first = second;
              System.out.println(first);
              System.out.println(second);
          }
      }
    hints:
      - "`first = second;` copies the value of `second`, which is 3, into `first`."
      - "`second` itself doesn't change."
    more:
      - task: |
          And this one? Watch the change to `b` after the copy.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  int a = 4;
                  int b = a * 2;
                  a = b;
                  b = b + 1;
                  System.out.println(a);
                  System.out.println(b);
              }
          }
        hints:
          - "`b` starts as `4 * 2`, which is 8. Then `a` gets a copy of 8."
          - "`b = b + 1` changes only `b`: it becomes 9, while `a` stays 8."
      - task: |
          Three values this time. Trace carefully: the order of the lines matters.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  int x = 2;
                  int y = x + 3;
                  int z = y * x;
                  x = z - y;
                  y = y + x;
                  System.out.println(x);
                  System.out.println(y);
                  System.out.println(z);
              }
          }
        hints:
          - "After the first three lines: x is 2, y is 5 and z is 10."
          - "Then `x = z - y` makes x 5, and `y = y + x` uses that new x: 5 + 5."
