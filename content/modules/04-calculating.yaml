id: calculating
summary: Arithmetic with + - * /, the order of operations, joining numbers and text without surprises, integer division and casting to double, and tracing what each variable holds.
steps:
  - id: calculating-arithmetic
    slug: arithmetic
    title: Arithmetic and precedence
    text: |
      Java calculates with the usual operators: `+` adds, `-` subtracts, `*` multiplies and `/` divides. A calculation can use numbers, variables, or both, and its result can be stored in a variable:

      ```java main
      int minutes = 3 * 60;
      int total = minutes + 45;
      System.out.println(total);
      ```

      ```output
      225
      ```

      ### Which part first

      As in maths, `*` and `/` are done before `+` and `-`. Parentheses change the order: whatever is inside them is calculated first.

      ```java main
      System.out.println(2 + 3 * 4);
      System.out.println((2 + 3) * 4);
      ```

      ```output
      14
      20
      ```

      A piece of code that has a value, like `2 + 3 * 4` or `minutes + 45`, is called an **expression**. A statement such as `int total = minutes + 45;` calculates the expression and does something with its value, here storing it.

      **Your turn:** add parentheses in the two blanks, so the program prints `20`.
    fill: |
      public class Main {
          public static void main(String[] args) {
              int result = [[(]]2 + 3[[)]] * 4;
              System.out.println(result);
          }
      }
    hints:
      - Without parentheses, `3 * 4` is calculated first and the result is 14.
      - "The addition has to happen first: `(2 + 3) * 4`."
    tests:
      - expect: "20"
    more:
