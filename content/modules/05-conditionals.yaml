  - id: conditionals-else-if
    slug: else-if
    title: else if chains
    text: |
      With more than two cases, chain conditions with `else if`. Java checks them from the top, runs the block of the **first** condition that's true, and skips the rest. A final `else` catches everything else.

      ```java main
      int temperature = 12;
      if (temperature > 25) {
          System.out.println("Hot");
      } else if (temperature > 15) {
          System.out.println("Warm");
      } else if (temperature > 5) {
          System.out.println("Cool");
      } else {
          System.out.println("Cold");
      }
      ```

      ```output
      Cool
      ```

      For 12, the first two conditions are false and the third is true, so the program prints `Cool` and the rest of the chain is skipped. Exactly one block of the chain runs. The final `else` is optional; without it, no block runs when no condition is true.

      **Your turn:** read a number and print whether it's `Positive`, `Negative` or `Zero`. For the input `-3` the program prints:

      ```
      Negative
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int number = Integer.valueOf(scanner.nextLine());

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int number = Integer.valueOf(scanner.nextLine());
              if (number > 0) {
                  System.out.println("Positive");
              } else if (number < 0) {
                  System.out.println("Negative");
              } else {
                  System.out.println("Zero");
              }
          }
      }
    hints:
      - "Three cases: `if (number > 0)`, `else if (number < 0)`, and `else`."
      - When the number is neither greater nor less than 0, it's 0.
    tests:
      - stdin: "-3"
      - stdin: "0"
        hidden: true
      - stdin: "8"
        hidden: true
