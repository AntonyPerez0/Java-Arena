id: conditionals
summary: Programs that choose what to do. if, blocks and indentation, the comparison operators, else, else if chains, and why the order of conditions matters.
steps:
  - id: conditionals-if
    slug: if-statements
    title: if
    text: |
      So far every line of a program ran every time. An `if` statement runs a block of code only when a **condition** is true:

      ```java main
      int temperature = 31;
      if (temperature > 30) {
          System.out.println("Hot day: drink water.");
      }
      System.out.println("Temperature: " + temperature);
      ```

      ```output
      Hot day: drink water.
      Temperature: 31
      ```

      - The condition goes in parentheses after `if`. Here it's `temperature > 30`, which is either true or false.
      - The **block** in braces `{ }` runs only when the condition is true. With `temperature = 25`, the program would print only the second line.
      - The line after the block runs either way.

      ### No semicolon after the condition

      A semicolon right after `if (...)` ends the `if` there, with nothing in it. The block below it then runs every time, and Java doesn't warn about it:

      ```java main
      int speed = 30;
      if (speed > 50); {
          System.out.println("Too fast!");
      }
      ```

      ```output
      Too fast!
      ```

      Only 30, and yet "Too fast!". When an `if` seems to be ignored, check for this semicolon first.

      **Your turn:** fill in the condition, so the program prints `Speeding ticket!` only when the speed is over 120. Every run ends with `Drive safely.`
    fill: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int speed = Integer.valueOf(scanner.nextLine());
              if ([[speed > 120‖speed >= 121‖120 < speed]]) {
                  System.out.println("Speeding ticket!");
              }
              System.out.println("Drive safely.");
          }
      }
    hints:
      - "The condition compares `speed` with 120 using `>`."
      - "Exactly 120 is not over 120, so `speed > 120` is right and `speed >= 120` isn't."
    tests:
      - stdin: "125"
      - stdin: "120"
        hidden: true
      - stdin: "80"
        hidden: true
