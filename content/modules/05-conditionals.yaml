  - id: conditionals-indentation
    slug: indentation
    title: Blocks and indentation
    text: |
      A **block** is the code between a `{` and its `}`. The class, the main method and each `if` have one, and blocks sit inside each other.

      Java itself doesn't care about spaces at the start of a line. People do: indentation shows at a glance which lines are inside which block. The usual rule, used throughout this site:

      - every line inside a block is indented **4 spaces** more than the line that opened the block;
      - the closing `}` lines up with the line that opened the block.

      ```java run
      public class Main {
          public static void main(String[] args) {
              int points = 12;
              if (points > 10) {
                  System.out.println("Level up!");
              }
              System.out.println("Points: " + points);
          }
      }
      ```

      ```output
      Level up!
      Points: 12
      ```

      The editor helps: after a `{`, pressing Enter indents the next line, and the **Tab** key (also on the symbol bar on phones) adds 4 spaces.

      ### Checking the style

      In this step, **Check** also checks the indentation. On other steps, indentation that doesn't match the braces shows up as a note after the tests, but doesn't stop a challenge from passing.

      **Your turn:** this program works, but its indentation is a mess. Re-indent every line so it follows the rule. The output stays:

      ```
      Warm day
      Have a nice day
      ```
    seed: |
      public class Main {
      public static void main(String[] args) {
      int temperature = 25;
        if (temperature > 20) {
      System.out.println("Warm day");
          }
       System.out.println("Have a nice day");
      }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              int temperature = 25;
              if (temperature > 20) {
                  System.out.println("Warm day");
              }
              System.out.println("Have a nice day");
          }
      }
    style: indent
