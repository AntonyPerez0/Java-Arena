  - id: conditionals-else
    slug: else
    title: else
    text: |
      `else` adds a second block that runs when the condition is **false**. Exactly one of the two blocks runs, never both, never neither:

      ```java main
      int number = -4;
      if (number > 0) {
          System.out.println("The number is positive.");
      } else {
          System.out.println("The number is not positive.");
      }
      ```

      ```output
      The number is not positive.
      ```

      `else` has no condition of its own: it simply catches every case the `if` didn't. The `} else {` line closes the first block and opens the second, so it lines up with the `if`.

      **Your turn:** read a number and print `Positive` when it's greater than 0, and `Not positive` otherwise. For the input `5` the program prints:

      ```
      Positive
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int number = Integer.valueOf(scanner.nextLine());

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int number = Integer.valueOf(scanner.nextLine());
              if (number > 0) {
                  System.out.println("Positive");
              } else {
                  System.out.println("Not positive");
              }
          }
      }
    hints:
      - "`if (number > 0) { ... } else { ... }`"
      - Zero is not greater than 0, so it's "Not positive".
    tests:
