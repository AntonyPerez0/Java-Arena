  - id: conditionals-comparisons
    slug: comparisons
    title: Comparison operators
    text: |
      A condition is usually a comparison. Java has six comparison operators, and each one gives `true` or `false`:

      | Operator | Means | Example that's true |
      |---|---|---|
      | `>` | greater than | `5 > 3` |
      | `>=` | greater than or equal to | `3 >= 3` |
      | `<` | less than | `2 < 7` |
      | `<=` | less than or equal to | `7 <= 7` |
      | `==` | equal to | `4 == 4` |
      | `!=` | not equal to | `4 != 5` |

      ### `==` compares, `=` assigns

      Comparing uses two equals signs. With one, Java reads it as an assignment, and an assignment is not a true or false value:

      ```java error
      public class Main {
          public static void main(String[] args) {
              int number = 5;
              if (number = 5) {
                  System.out.println("Five!");
              }
          }
      }
      ```

      ```javac
      Main.java:4: error: incompatible types: int cannot be converted to boolean
              if (number = 5) {
                         ^
      1 error
      ```

      These operators compare numbers. Comparing text is different, and the next module shows how.

      **Your turn:** read a number and print `Correct!` when it's exactly 7. Then always print `Game over.` For the input `7` the program prints:

      ```
      Guess the number:
      Correct!
      Game over.
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println("Guess the number:");
              int guess = Integer.valueOf(scanner.nextLine());

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println("Guess the number:");
              int guess = Integer.valueOf(scanner.nextLine());
              if (guess == 7) {
