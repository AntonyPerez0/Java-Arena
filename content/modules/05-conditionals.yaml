              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int score = Integer.valueOf(scanner.nextLine());
                  if (score > 100) {
                      System.out.println("Invalid score");
                  } else if (score >= 95) {
                      System.out.println("A+");
                  } else if (score >= 85) {
                      System.out.println("A");
                  } else if (score >= 75) {
                      System.out.println("B");
                  } else if (score >= 65) {
                      System.out.println("C");
                  } else if (score >= 55) {
                      System.out.println("D");
                  } else if (score >= 45) {
                      System.out.println("E");
                  } else if (score >= 0) {
                      System.out.println("F");
                  } else {
                      System.out.println("Invalid score");
                  }
              }
          }
        hints:
          - Check for scores over 100 first, then go down the bands from the top.
          - "What's left after `score >= 0` is negative: that's invalid too, so the final `else` prints `Invalid score`."
