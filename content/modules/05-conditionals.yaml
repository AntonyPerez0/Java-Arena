      - task: |
          A finer scale, and a check on the input. Scores go from 0 to 100; anything else is `Invalid score`. The grades (an invented scale for this exercise):

          | Score | Grade |
          |---|---|
          | 95 to 100 | `A+` |
          | 85 to 94 | `A` |
          | 75 to 84 | `B` |
          | 65 to 74 | `C` |
          | 55 to 64 | `D` |
          | 45 to 54 | `E` |
          | 0 to 44 | `F` |

          For the input `88` the program prints:

          ```
          A
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
