  - id: conditionals-order
    slug: order-of-conditions
    title: The first true branch wins
    text: |
      In an `else if` chain only the first true condition counts, so the **order** of the conditions changes what the program does. Look at this chain, meant to give a grade:

      ```java main
      int points = 95;
      if (points >= 50) {
          System.out.println("Passed");
      } else if (points >= 90) {
          System.out.println("Excellent");
      }
      ```

      ```output
      Passed
      ```

      95 should be `Excellent`, but `points >= 50` is checked first, it's true, and the rest of the chain is skipped. `Excellent` can never be printed. Checking the strictest condition first fixes it:

      ```java main
      int points = 95;
      if (points >= 90) {
          System.out.println("Excellent");
      } else if (points >= 50) {
          System.out.println("Passed");
      }
      ```

      ```output
      Excellent
      ```

      When conditions overlap, put the most specific one first. Each `else if` can then rely on the earlier conditions having been false: in the second version, the `>= 50` branch only ever sees points below 90.

      **Your turn:** this chain is in the wrong order, so it never prints `Gold`. Reorder the branches, so 1000 points or more gives `Gold`, 500 or more `Silver`, and anything less `Bronze`. For the input `1200` the program prints `Gold`.
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int points = Integer.valueOf(scanner.nextLine());
              if (points >= 500) {
                  System.out.println("Silver");
              } else if (points >= 1000) {
                  System.out.println("Gold");
              } else {
                  System.out.println("Bronze");
              }
          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int points = Integer.valueOf(scanner.nextLine());
              if (points >= 1000) {
                  System.out.println("Gold");
              } else if (points >= 500) {
