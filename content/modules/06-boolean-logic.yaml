  - id: boolean-logic-order
    slug: specific-first
    title: Most specific condition first
    text: |
      When conditions overlap, the order of an `else if` chain decides the answer, and the most specific case has to come first. The classic example is **FizzBuzz**: print `Fizz` for multiples of 3, `Buzz` for multiples of 5, `FizzBuzz` for multiples of both, and the number itself otherwise.

      ```java main
      int number = 15;
      if (number % 3 == 0 && number % 5 == 0) {
          System.out.println("FizzBuzz");
      } else if (number % 3 == 0) {
          System.out.println("Fizz");
      } else if (number % 5 == 0) {
          System.out.println("Buzz");
      } else {
          System.out.println(number);
      }
      ```

      ```output
      FizzBuzz
      ```

      15 is a multiple of 3, so if the `number % 3 == 0` check came first, it would print `Fizz` and never reach the combined case. Checking "both" first works, because every later branch can then assume that "both" was false.

      **Your turn:** read a number and print `FizzBuzz`, `Fizz`, `Buzz` or the number itself, by the rules above. For the input `9` the program prints:

      ```
      Fizz
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int number = Integer.valueOf(scanner.nextLine());

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int number = Integer.valueOf(scanner.nextLine());
              if (number % 3 == 0 && number % 5 == 0) {
                  System.out.println("FizzBuzz");
              } else if (number % 3 == 0) {
                  System.out.println("Fizz");
              } else if (number % 5 == 0) {
                  System.out.println("Buzz");
              } else {
                  System.out.println(number);
              }
          }
      }
    hints:
      - The combined case goes first, before the checks for 3 and for 5.
      - "The last `else` prints the number itself."
    tests:
      - stdin: "9"
      - stdin: "15"
        hidden: true
      - stdin: "10"
        hidden: true
      - stdin: "7"
        hidden: true
    more:
