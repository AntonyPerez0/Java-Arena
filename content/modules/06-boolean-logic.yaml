        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int days = Integer.valueOf(scanner.nextLine());
                  if (days <= 0) {
                      System.out.println("Nothing to pay");
                  } else {
                      int fee;
                      if (days <= 7) {
                          fee = days;
                      } else if (days <= 14) {
                          fee = 7 + 2 * (days - 7);
                      } else if (days <= 30) {
                          fee = 21 + 3 * (days - 14);
                      } else {
                          fee = 70;
                      }
                      System.out.println("Fee: " + fee + " euros");
                  }
              }
          }
        hints:
          - "Handle 0 first with its own message, then the four fee brackets from the smallest up."
          - "In the 8 to 14 bracket, the days over 7 are `days - 7`: 10 days is 7 + 2 * 3 = 13."
