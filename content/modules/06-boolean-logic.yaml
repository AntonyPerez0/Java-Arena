id: boolean-logic
summary: Conditions as true-or-false values. Boolean variables, the remainder operator %, comparing text with equals, combining conditions with && || and !, and choosing the order of conditions. The end of MOOC part 1.
steps:
  - id: boolean-logic-variables
    slug: boolean-conditions
    title: Booleans in conditions
    text: |
      A comparison like `age >= 18` is an expression with a value, and that value is a `boolean`: `true` or `false`. It can be stored in a variable, printed, or used later as a condition:

      ```java main
      int age = 20;
      boolean adult = age >= 18;
      System.out.println("Adult: " + adult);
      if (adult) {
          System.out.println("Welcome in.");
      }
      ```

      ```output
      Adult: true
      Welcome in.
      ```

      `if (adult)` reads naturally: the condition is the variable itself, so there's no need to write `if (adult == true)`.

      A well-named boolean variable makes a condition easier to read, especially when the test is long or used more than once. Names like `adult`, `isRaining` or `hasTicket` work well: they read like yes-or-no questions.

      **Your turn:** fill in the blank, so `canVote` is `true` for an age of 18 or more. For the input `20` the program prints `Can vote: true`.
    fill: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int age = Integer.valueOf(scanner.nextLine());
              boolean canVote = [[age >= 18‖age > 17‖18 <= age]];
              System.out.println("Can vote: " + canVote);
          }
      }
    hints:
      - The blank is a comparison, the same you'd write inside an `if`.
      - "18 or more is `age >= 18`."
    tests:
      - stdin: "20"
      - stdin: "18"
        hidden: true
      - stdin: "17"
        hidden: true
    more:
      - task: |
          Read whether the customer is a member (`true` or `false`) into a boolean. Use the variable itself as the condition: members get `Discount applied`, others `Full price`. For the input `true` the program prints:

          ```
