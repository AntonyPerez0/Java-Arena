          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int temperature = Integer.valueOf(scanner.nextLine());
                  boolean raining = Boolean.valueOf(scanner.nextLine());
