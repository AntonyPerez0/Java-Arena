  - id: boolean-logic-strings
    slug: comparing-strings
    title: Comparing text with equals
    text: |
      Text is compared with `equals`, not with `==`:

      ```java main
      Scanner scanner = new Scanner(System.in);
      String first = scanner.nextLine();
      String second = scanner.nextLine();
      System.out.println(first.equals(second));
      System.out.println(first == second);
      ```

      ```input
      cat
      cat
      ```

      ```output
      true
      false
      ```

      Both lines are `cat`, yet `==` says false. For Strings, `==` doesn't check whether the texts are the same: it checks whether the two variables refer to the very same String object in memory. Every `nextLine()` creates a new one, so two separate reads are never `==`. `first.equals(second)` compares the characters, which is what you want. Module 22 explains objects and references properly.

      To compare with a fixed word, write the text in quotes: `command.equals("quit")`. Capitals count: `"Quit".equals("quit")` is false. `equalsIgnoreCase` ignores them.

      **Your turn:** ask for a password and print `Welcome!` when it's `swordfish`, otherwise `Wrong password`. For the input `swordfish` the program prints:

      ```
      Password:
      Welcome!
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println("Password:");
              String password = scanner.nextLine();

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println("Password:");
              String password = scanner.nextLine();
              if (password.equals("swordfish")) {
                  System.out.println("Welcome!");
              } else {
                  System.out.println("Wrong password");
              }
          }
      }
    hints:
      - "`password.equals(\"swordfish\")` is true when the text matches exactly."
      - With `==` the check would fail even for the right password.
    forbid:
      - pattern: (==|!=)\s*""|""\s*(==|!=)
        message: "Compare text with `equals`, not `==`."
    tests:
      - stdin: swordfish
      - stdin: Swordfish
        hidden: true
      - stdin: "12345"
        hidden: true
    more:
      - task: |
          Read two words and print `Same` when they're the same text, otherwise `Different`. For the input `apple` and `apple` the program prints:

          ```
          Same
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  String first = scanner.nextLine();
                  String second = scanner.nextLine();

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  String first = scanner.nextLine();
                  String second = scanner.nextLine();
