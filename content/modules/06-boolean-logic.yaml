        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int km = Integer.valueOf(scanner.nextLine());
                  double price;
                  if (km <= 5) {
                      price = 3.0;
                  } else if (km <= 20) {
                      price = 3.0 + 0.5 * (km - 5);
                  } else {
                      price = 10.5 + 1.0 * (km - 20);
                  }
                  System.out.println("Price: " + price + " euros");
              }
          }
