          Read a temperature (an `int`) and whether it's raining (`true` or `false`). Store `temperature > 20` in a boolean called `warm`. Then print `Wear a T-shirt` when it's warm and `Wear a sweater` otherwise, and add `Take an umbrella` when it's raining. For the input `24` and `true` the program prints:

          ```
          Wear a T-shirt
