      - task: |
          A tiny command menu. Read a command and answer:

          - `help` prints `Commands: help, hello, quit`
          - `hello` prints `Hi there!`
          - `quit` prints `Bye!`
          - anything else prints `Unknown command: ` and the command

          For the input `hello` the program prints `Hi there!`.
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  String command = scanner.nextLine();

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  String command = scanner.nextLine();
                  if (command.equals("help")) {
                      System.out.println("Commands: help, hello, quit");
                  } else if (command.equals("hello")) {
                      System.out.println("Hi there!");
                  } else if (command.equals("quit")) {
                      System.out.println("Bye!");
                  } else {
                      System.out.println("Unknown command: " + command);
                  }
              }
          }
        hints:
          - "An `else if` chain with one `equals` per command."
          - "The final `else` prints `\"Unknown command: \" + command`."
        forbid:
          - pattern: (==|!=)\s*""|""\s*(==|!=)
            message: "Compare text with `equals`, not `==`."
        tests:
          - stdin: hello
          - stdin: help
            hidden: true
          - stdin: quit
            hidden: true
          - stdin: dance
            hidden: true

  - id: boolean-logic-operators
    slug: and-or-not
    title: And, or, not
    text: |
      Conditions can be combined:

      - `a && b` (**and**) is true when both `a` and `b` are true.
      - `a || b` (**or**) is true when at least one of them is true.
      - `!a` (**not**) is true when `a` is false.

      A range check is the classic use of `&&`: a number is between 1 and 10 when it's at least 1 **and** at most 10.

      ```java main
      int number = 7;
      if (number >= 1 && number <= 10) {
          System.out.println("In range");
      }
      if (number < 1 || number > 10) {
          System.out.println("Out of range");
      }
      System.out.println(!(number > 5));
      ```

      ```output
      In range
      false
      ```

      Java checks `&&` and `||` from left to right and stops as soon as the answer is known: in `a && b`, when `a` is false, `b` isn't looked at.

      **Your turn:** read an age and, using a single `if` with `&&`, print `Teenager` for ages 13 to 19 and `Not a teenager` for any other age. For the input `15` the program prints:

      ```
      Teenager
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int age = Integer.valueOf(scanner.nextLine());

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int age = Integer.valueOf(scanner.nextLine());
              if (age >= 13 && age <= 19) {
                  System.out.println("Teenager");
              } else {
                  System.out.println("Not a teenager");
              }
          }
      }
    hints:
      - "13 to 19 means at least 13 **and** at most 19."
      - "`if (age >= 13 && age <= 19) { ... } else { ... }`"
    require:
      - pattern: "&&"
        message: "Combine the two checks with `&&`."
      - pattern: \bif\b
        max: 1
        message: "Use a single `if` (with an `else`)."
    tests:
      - stdin: "15"
      - stdin: "13"
        hidden: true
      - stdin: "19"
        hidden: true
      - stdin: "20"
        hidden: true
      - stdin: "12"
        hidden: true
