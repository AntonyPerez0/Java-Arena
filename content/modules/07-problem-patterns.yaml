  - id: patterns-combining
    slug: combining-patterns
    title: Combining the patterns
    text: |
      Bigger programs combine the patterns: read several values, calculate from them, decide, and print a sentence that uses the results. Here are two prices, and the program says which is cheaper and by how much:

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int shopA = Integer.valueOf(scanner.nextLine());
              int shopB = Integer.valueOf(scanner.nextLine());
              int difference = Math.abs(shopA - shopB);
              if (shopA < shopB) {
                  System.out.println("Shop A is cheaper by " + difference);
              } else if (shopB < shopA) {
                  System.out.println("Shop B is cheaper by " + difference);
              } else {
                  System.out.println("Same price");
              }
          }
      }
      ```

      ```input
      35
      29
      ```

      ```output
      Shop B is cheaper by 6
      ```

      The difference is worked out once, before the decision, and each branch uses it. The same plan works for most problems of this kind: read everything, calculate what the sentences need, then decide which sentence to print.

      **Your turn:** read the heights of two plants in centimetres. Print `The first plant is taller by X cm`, `The second plant is taller by X cm` or `The plants are equally tall`. For the input `30` and `25` the program prints:

      ```
      The first plant is taller by 5 cm
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int first = Integer.valueOf(scanner.nextLine());
              int second = Integer.valueOf(scanner.nextLine());

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int first = Integer.valueOf(scanner.nextLine());
              int second = Integer.valueOf(scanner.nextLine());
              int difference = Math.abs(first - second);
              if (first > second) {
                  System.out.println("The first plant is taller by " + difference + " cm");
              } else if (second > first) {
                  System.out.println("The second plant is taller by " + difference + " cm");
              } else {
                  System.out.println("The plants are equally tall");
              }
          }
      }
    hints:
      - "Work out the difference first: `Math.abs(first - second)` is the same whichever plant is taller."
      - Three cases, like the shop example.
    tests:
      - stdin: |
          30
          25
      - stdin: |
          12
          40
        hidden: true
      - stdin: |
          18
          18
        hidden: true
    more:
      - task: |
          Read the prices of two items and then how much money you have. Print `You can buy both` when the money covers both, and otherwise `You need X more`. For the input `12`, `15` and `20` the program prints:

          ```
          You need 7 more
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int first = Integer.valueOf(scanner.nextLine());
                  int second = Integer.valueOf(scanner.nextLine());
                  int money = Integer.valueOf(scanner.nextLine());

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int first = Integer.valueOf(scanner.nextLine());
                  int second = Integer.valueOf(scanner.nextLine());
                  int money = Integer.valueOf(scanner.nextLine());
                  int total = first + second;
                  if (total <= money) {
                      System.out.println("You can buy both");
                  } else {
                      System.out.println("You need " + (total - money) + " more");
                  }
              }
          }
        hints:
          - Calculate the total price first.
          - "Exactly enough money is enough: `if (total <= money)`. Otherwise the missing amount is `total - money`."
