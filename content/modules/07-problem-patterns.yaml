      - task: |
          Read three test scores and print the highest and the lowest, using `Math.max` and `Math.min`. For the input `67`, `92` and `80` the program prints:

          ```
          Highest: 92
          Lowest: 67
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int first = Integer.valueOf(scanner.nextLine());
                  int second = Integer.valueOf(scanner.nextLine());
                  int third = Integer.valueOf(scanner.nextLine());

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int first = Integer.valueOf(scanner.nextLine());
                  int second = Integer.valueOf(scanner.nextLine());
                  int third = Integer.valueOf(scanner.nextLine());
                  int highest = Math.max(first, Math.max(second, third));
                  int lowest = Math.min(first, Math.min(second, third));
                  System.out.println("Highest: " + highest);
                  System.out.println("Lowest: " + lowest);
              }
          }
        hints:
          - "`Math.max` takes two values. For three, put one call inside another: `Math.max(first, Math.max(second, third))`."
          - "The lowest works the same way with `Math.min`."
        require:
          - pattern: Math\.max\s*\(
            message: "Use `Math.max` for the highest."
          - pattern: Math\.min\s*\(
            message: "Use `Math.min` for the lowest."
        tests:
          - stdin: |
              67
              92
              80
          - stdin: |
              50
              50
              50
            hidden: true
          - stdin: |
              99
              12
              45
