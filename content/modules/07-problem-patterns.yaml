id: problem-patterns
summary: The start of MOOC part 2. Most small programs follow a few patterns, and knowing them makes new problems familiar. Read, calculate and print; the Math methods; read, decide and print; and programs that combine them.
steps:
  - id: patterns-read-calculate-print
    slug: read-calculate-print
    title: Read, calculate, print
    text: |
      Many programs have the same three parts, whatever they're about:

      1. **Read** the input into variables.
      2. **Calculate** the result from them.
      3. **Print** the result.

      Here the input is a temperature in Celsius, and the result is the same temperature in Fahrenheit:

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              // 1. Read
              int celsius = Integer.valueOf(scanner.nextLine());
              // 2. Calculate
              double fahrenheit = celsius * 9 / 5.0 + 32;
              // 3. Print
              System.out.println(celsius + " C is " + fahrenheit + " F");
          }
      }
      ```

      ```input
      25
      ```

      ```output
      25 C is 77.0 F
      ```

      When a new problem looks hard, start by naming the three parts: what does the program get, what does it work out, and what does it show? Each part is often just a line or two.

      Keeping the calculation in its own variable (`fahrenheit`) makes the print line short and gives the result a name.

      **Your turn:** read the side of a square garden in metres and print its area. For the input `7` the program prints:

      ```
      Area: 49
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int side = Integer.valueOf(scanner.nextLine());
              int area = side * side;
              System.out.println("Area: " + area);
          }
      }
    hints:
      - "Read: `int side = Integer.valueOf(scanner.nextLine());`"
      - "Calculate: the area of a square is the side times itself. Then print it with its label."
    tests:
      - stdin: "7"
      - stdin: "1"
        hidden: true
      - stdin: "12"
        hidden: true
