  - id: patterns-read-decide-print
    slug: read-decide-print
    title: Read, decide, print
    text: |
      In the second pattern the input decides what the program prints. Between reading and printing there's an `if`:

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int battery = Integer.valueOf(scanner.nextLine());
              if (battery < 20) {
                  System.out.println("Charge soon");
              } else {
                  System.out.println("Battery OK");
              }
          }
      }
      ```

      ```input
      12
      ```

      ```output
      Charge soon
      ```

      A decision can also change a value instead of printing: the `if` fixes up a variable, and one print line after it shows the result. This keeps the printing in one place:

      ```java main
      int speed = 140;
      if (speed > 120) {
          speed = 120;
      }
      System.out.println("Speed: " + speed);
      ```

      ```output
      Speed: 120
      ```

      **Your turn:** a weather app reads how many degrees the temperature changed since yesterday, negative when it got colder. Print the size of the change, without a minus sign. Use an `if` for it, not `Math.abs`, to practice the pattern. For the input `-7` the program prints:

      ```
      Change of 7 degrees
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int change = Integer.valueOf(scanner.nextLine());

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int change = Integer.valueOf(scanner.nextLine());
              if (change < 0) {
                  change = -change;
              }
              System.out.println("Change of " + change + " degrees");
          }
      }
    hints:
      - Only a negative change needs fixing up before it's printed.
      - "`-change` is the number with its sign flipped: `if (change < 0) { change = -change; }`"
    forbid:
      - pattern: Math\.abs
        message: "Solve this one with an `if`, without `Math.abs`."
    tests:
      - stdin: "-7"
      - stdin: "5"
        hidden: true
      - stdin: "0"
        hidden: true
    more:
      - task: |
          A volume control goes from 0 to 100. Read a volume setting and keep it in that range: below 0 becomes 0, above 100 becomes 100, and anything else stays. For the input `130` the program prints:

          ```
          Volume: 100
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int volume = Integer.valueOf(scanner.nextLine());

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int volume = Integer.valueOf(scanner.nextLine());
                  if (volume < 0) {
                      volume = 0;
                  }
                  if (volume > 100) {
                      volume = 100;
                  }
                  System.out.println("Volume: " + volume);
              }
          }
        hints:
          - Two separate checks, each fixing the variable when it's out of range.
          - "Print once, after both checks: `System.out.println(\"Volume: \" + volume);`"
        tests:
          - stdin: "130"
          - stdin: "-5"
            hidden: true
          - stdin: "42"
            hidden: true
          - stdin: "100"
            hidden: true
      - task: |
          Read the points from two rounds of a game and print the total. Then print `Level up!` when the total is 100 or more, `Almost there` when it's 80 to 99, and `Keep going` otherwise. For the input `45` and `60` the program prints:

          ```
          Total: 105
          Level up!
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int first = Integer.valueOf(scanner.nextLine());
                  int second = Integer.valueOf(scanner.nextLine());

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int first = Integer.valueOf(scanner.nextLine());
                  int second = Integer.valueOf(scanner.nextLine());
                  int total = first + second;
                  System.out.println("Total: " + total);
                  if (total >= 100) {
                      System.out.println("Level up!");
                  } else if (total >= 80) {
                      System.out.println("Almost there");
                  } else {
                      System.out.println("Keep going");
                  }
              }
          }
        hints:
          - Calculate the total first and print it. Then decide, using the total.
          - "Check the highest range first: `if (total >= 100)`, then `else if (total >= 80)`, then `else`."
