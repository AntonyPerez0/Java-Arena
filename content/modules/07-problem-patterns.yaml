          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int minutes = Integer.valueOf(scanner.nextLine());
                  int hours = minutes / 60;
                  int rest = minutes % 60;
                  System.out.println(hours + " h " + rest + " min");
              }
          }
