      - task: |
          Alex and Sam each took two tests. Read Alex's two scores, then Sam's two, and print both averages and who has the higher one (or `Same average`). For the input `80`, `90`, `85` and `86` the program prints:

          ```
          Alex: 85.0
          Sam: 85.5
          Sam has the higher average
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int alex1 = Integer.valueOf(scanner.nextLine());
                  int alex2 = Integer.valueOf(scanner.nextLine());
                  int sam1 = Integer.valueOf(scanner.nextLine());
                  int sam2 = Integer.valueOf(scanner.nextLine());

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int alex1 = Integer.valueOf(scanner.nextLine());
                  int alex2 = Integer.valueOf(scanner.nextLine());
                  int sam1 = Integer.valueOf(scanner.nextLine());
                  int sam2 = Integer.valueOf(scanner.nextLine());
                  double alex = (alex1 + alex2) / 2.0;
                  double sam = (sam1 + sam2) / 2.0;
                  System.out.println("Alex: " + alex);
                  System.out.println("Sam: " + sam);
                  if (alex > sam) {
                      System.out.println("Alex has the higher average");
                  } else if (sam > alex) {
                      System.out.println("Sam has the higher average");
                  } else {
                      System.out.println("Same average");
                  }
              }
          }
        hints:
          - "Divide by `2.0`, not `2`, so the average keeps its decimals."
          - Calculate and print both averages, then compare the two averages.
        tests:
          - stdin: |
              80
              90
              85
              86
          - stdin: |
              70
              71
              60
              80
            hidden: true
          - stdin: |
              90
              90
              100
              80
            hidden: true
