          A survey collects answers, `yes` or `no`, until `stop`. Print the share of `yes` answers as a percentage, calculated as 100.0 times the yes answers divided by all answers. There's always at least one answer. For the input `yes`, `yes`, `no`, `yes` and `stop` the program prints:

          ```
          75.0% said yes
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int answers = 0;
                  int yes = 0;
                  while (true) {
                      String answer = scanner.nextLine();
                      if (answer.equals("stop")) {
                          break;
                      }
                      answers++;
                      if (answer.equals("yes")) {
                          yes++;
                      }
                  }
                  double percentage = 100.0 * yes / answers;
                  System.out.println(percentage + "% said yes");
              }
          }
        hints:
          - Two counters, all answers and the yes answers.
          - "`100.0 * yes / answers` starts with a `double`, so the division keeps its decimals."
