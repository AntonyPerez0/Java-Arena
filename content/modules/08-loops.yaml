  - id: loops-continue
    slug: continue
    title: continue
    text: |
      `break` leaves the loop. Its partner `continue` only skips the rest of this round: the loop goes straight back to its start and carries on. It's handy for skipping input that shouldn't be handled:

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              while (true) {
                  int number = Integer.valueOf(scanner.nextLine());
                  if (number == 0) {
                      break;
                  }
                  if (number % 2 != 0) {
                      System.out.println(number + " is odd, skipped");
                      continue;
                  }
                  System.out.println("Half of " + number + " is " + number / 2);
              }
          }
      }
      ```

      ```input
      8
      5
      12
      0
      ```

      ```output
      Half of 8 is 4
      5 is odd, skipped
      Half of 12 is 6
      ```

      For 5 the `continue` runs, so the "Half of" line is skipped for that round only. The loop then reads 12 as usual.

      A loop often starts with its checks, each ending in `break` or `continue`, and then does the real work for the input that got through them.

      **Your turn:** read test scores until `-1`. A score above 100 is a typing mistake: print `Invalid score` and skip it with `continue`. Print every other score as `Score: X`. For the input `85`, `120`, `70` and `-1` the program prints:

      ```
      Score: 85
      Invalid score
      Score: 70
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              while (true) {
                  int score = Integer.valueOf(scanner.nextLine());
                  if (score == -1) {
                      break;
                  }
                  if (score > 100) {
                      System.out.println("Invalid score");
                      continue;
                  }
                  System.out.println("Score: " + score);
              }
          }
      }
    hints:
      - "First check for `-1` and `break`. Then check for a score over 100."
      - "Inside the second `if`: print `Invalid score`, then `continue;`"
    require:
