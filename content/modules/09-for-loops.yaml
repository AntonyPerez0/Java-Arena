  - id: for-loops-multiplying
    slug: multiplying
    title: Multiplying in a loop
    text: |
      A product is built up like a sum, with one difference: it starts at **1**, not 0. Starting at 0 would make every product 0.

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int doublings = Integer.valueOf(scanner.nextLine());
              int value = 1;
              for (int i = 0; i < doublings; i++) {
                  value *= 2;
              }
              System.out.println("2 doubled " + doublings + " times is " + value);
          }
      }
      ```

      ```input
      10
      ```

      ```output
      2 doubled 10 times is 1024
      ```

      With `0` as the input the loop doesn't run, and the value stays 1, which is right: 2 to the power 0 is 1.

      Products grow fast. An `int` holds values up to 2147483647 (module 4), so these programs only work for fairly small inputs. The tests here stay inside that limit.

      **Your turn:** read a base and an exponent, and calculate the power with a loop, without `Math.pow`. For the input `3` and `4` the program prints:

      ```
      3 to the power 4 is 81
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int base = Integer.valueOf(scanner.nextLine());
              int exponent = Integer.valueOf(scanner.nextLine());

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int base = Integer.valueOf(scanner.nextLine());
              int exponent = Integer.valueOf(scanner.nextLine());
              int result = 1;
              for (int i = 0; i < exponent; i++) {
                  result *= base;
              }
              System.out.println(base + " to the power " + exponent + " is " + result);
          }
      }
    hints:
      - "Start the result at 1 and multiply it by the base once per round."
      - The loop runs `exponent` rounds.
    forbid:
      - pattern: Math\.pow
        message: "Calculate the power with a loop, without `Math.pow`."
    tests:
      - stdin: |
          3
          4
      - stdin: |
          7
          0
        hidden: true
      - stdin: |
          2
          20
        hidden: true
    more:
      - task: |
          In how many different orders can `n` books stand on a shelf? The first place can hold any of the `n` books, the next any of the `n - 1` left, and so on, so the answer is n times (n - 1) times ... times 1. With 0 books there's exactly 1 way (an empty shelf). Read `n` and print the answer. For the input `5` the program prints:

          ```
          5 books can be arranged in 120 ways
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int books = Integer.valueOf(scanner.nextLine());

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int books = Integer.valueOf(scanner.nextLine());
                  int ways = 1;
                  for (int i = 1; i <= books; i++) {
                      ways *= i;
                  }
                  System.out.println(books + " books can be arranged in " + ways + " ways");
              }
          }
        hints:
          - "Multiply the numbers from 1 to `books` together, starting from 1."
          - "With 0 books the loop doesn't run, and `ways` stays 1, as it should."
        tests:
          - stdin: "5"
          - stdin: "0"
            hidden: true
          - stdin: "10"
