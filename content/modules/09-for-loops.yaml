        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int total = 0;
                  int days = 0;
                  int goalDays = 0;
                  int best = 0;
                  while (true) {
                      int steps = Integer.valueOf(scanner.nextLine());
                      if (steps == -1) {
                          break;
                      }
                      total += steps;
                      days++;
                      if (steps >= 10000) {
                          goalDays++;
                      }
                      if (steps > best) {
                          best = steps;
                      }
                  }
                  System.out.println("Days: " + days);
                  System.out.println("Total: " + total);
                  System.out.println("Average: " + (double) total / days);
                  System.out.println("Days at 10000 or more: " + goalDays);
                  System.out.println("Best day: " + best);
              }
          }
        hints:
          - "Two more variables before the loop: a counter for goal days and `int best = 0;`."
          - "In the loop: `if (steps >= 10000) { goalDays++; }` and `if (steps > best) { best = steps; }`."
