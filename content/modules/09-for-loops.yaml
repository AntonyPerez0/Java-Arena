id: for-loops
summary: Loops with a condition, and the for loop. Counting loops, bounds that come from the input, exactly when a loop's condition is checked, sums and products built up in a loop, and a larger program built one feature at a time.
steps:
  - id: for-loops-while-condition
    slug: loop-conditions
    title: while with a condition
    text: |
      `while (true)` needs a `break` to stop. A loop can instead have a real **condition**: it's checked before every round, and the loop ends as soon as it's false.

      ```java main
      int number = 1;
      while (number <= 5) {
          System.out.println(number);
          number++;
      }
      System.out.println("Done, number is now " + number);
      ```

      ```output
      1
      2
      3
      4
      5
      Done, number is now 6
      ```

      This is a **counting loop**, and it has three parts:

      1. a variable set before the loop (`int number = 1;`),
      2. a condition that decides whether another round runs (`number <= 5`),
      3. a change inside the loop that moves toward the end (`number++`).

      Forget the third part and `number` stays 1 forever: the condition never turns false.

      When the loop should end at a known point, a condition says so right at the top. `while (true)` with `break` suits loops that end on something the loop reads, like a word such as `end`.

      **Your turn:** fill in the condition, so the loop prints 10, 20, 30, 40 and 50, one per line.
    fill: |
      public class Main {
          public static void main(String[] args) {
              int number = 10;
              while ([[number <= 50‖number < 60‖number < 51‖number != 60]]) {
                  System.out.println(number);
                  number += 10;
              }
          }
      }
    hints:
      - The loop should still run when `number` is 50, and stop when it reaches 60.
      - "`number <= 50`"
    tests:
      - expect: |
          10
          20
          30
          40
          50
    more:
      - task: |
          Read a number of steps and print `Step 1`, `Step 2` and so on, up to that number. Use `while` with a condition, not `while (true)`. For the input `3` the program prints:

          ```
          Step 1
          Step 2
          Step 3
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int steps = Integer.valueOf(scanner.nextLine());

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int steps = Integer.valueOf(scanner.nextLine());
                  int step = 1;
                  while (step <= steps) {
                      System.out.println("Step " + step);
                      step++;
                  }
              }
          }
        hints:
          - "A counter from 1: `int step = 1;` before the loop."
          - "`while (step <= steps)`, and `step++;` at the end of the loop's block."
        require:
          - pattern: while\s*\(
            message: "Use a `while` loop."
        forbid:
          - pattern: while\s*\(\s*true\s*\)
            message: "Give the loop a real condition instead of `true`."
        tests:
          - stdin: "3"
          - stdin: "1"
            hidden: true
          - stdin: "6"
            hidden: true
      - task: |
          Read a whole number, then keep halving it (whole-number division by 2) and print each value while it's above 0. Use a condition, not `break`. For the input `20` the program prints:

          ```
          20
          10
          5
          2
          1
          ```
        seed: |
