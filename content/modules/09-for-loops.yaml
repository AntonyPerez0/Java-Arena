  - id: for-loops-condition-checked
    slug: when-the-condition-is-checked
    title: When the condition is checked
    text: |
      A loop's condition is checked at one moment only: **before each round**, including the very first. It isn't watched during the round. If the variable passes the limit halfway through the block, the rest of the block still runs, and the loop stops only at the next check.

      ```java main
      int total = 0;
      int rounds = 0;
      while (total < 10) {
          total += 4;
          rounds++;
          System.out.println("Round " + rounds + ": total " + total);
      }
      System.out.println("After the loop: " + total);
      ```

      ```output
      Round 1: total 4
      Round 2: total 8
      Round 3: total 12
      After the loop: 12
      ```

      In round 3, `total` went past 10, but the round finished and printed. Only then did the check `12 < 10` fail. So after a loop, its variable holds the first value that made the condition false, which isn't necessarily the limit.

      Tracing a loop by hand (writing down each variable after each round) is the surest way to know what it does. These three challenges are for tracing.

      **Your turn:** what does this program print? Trace `i` and `rounds` round by round.
    predict: |
      public class Main {
          public static void main(String[] args) {
              int i = 0;
              int rounds = 0;
              while (i < 10) {
                  i += 3;
                  rounds++;
              }
              System.out.println("Rounds: " + rounds);
              System.out.println("i: " + i);
          }
      }
    hints:
      - "`i` goes 0, 3, 6, 9, and then one more round, because 9 is still below 10."
      - "The fourth round makes `i` 12 and `rounds` 4. Then `12 < 10` is false."
    more:
      - task: |
          What does this program print? Two variables change in each round.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  int a = 1;
                  int b = 10;
                  while (a < b) {
                      a *= 2;
                      b--;
                  }
                  System.out.println(a);
                  System.out.println(b);
              }
          }
        hints:
          - "After each round: a 2 and b 9, then a 4 and b 8, then a 8 and b 7."
          - "Now `8 < 7` is false, so the loop ends with a 8 and b 7."
      - task: |
          What does this program print? The loop's variable also changes inside the block.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  for (int i = 0; i < 6; i++) {
                      System.out.println(i);
                      i++;
                  }
              }
          }
        hints:
          - "Each round adds one inside the block, and the `for` line adds another one at the end of the round."
          - "So `i` is 0, then 2, then 4 when it's printed. After that it becomes 6, and `6 < 6` is false."

  - id: for-loops-repeating-calculation
    slug: repeating-a-calculation
    title: Repeating a calculation
    text: |
      The loop variable can take part in the calculation. Here the loop adds up 1 + 2 + 3 + ... up to a number from the input:

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int last = Integer.valueOf(scanner.nextLine());
              int sum = 0;
              for (int i = 1; i <= last; i++) {
                  sum += i;
              }
              System.out.println("Sum: " + sum);
          }
      }
      ```

      ```input
      4
      ```

      ```output
      Sum: 10
      ```

      Traced, the sum goes 0, 1, 3, 6, 10. The pattern has the same pieces as summing input: a sum that starts at 0 before the loop, and one addition per round. Only now the added value is `i` itself, or anything calculated from it.

      **Your turn:** read two positive numbers and multiply them without `*`: add the first number to a sum as many times as the second number says. For the input `6` and `4` the program prints:

      ```
      24
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int number = Integer.valueOf(scanner.nextLine());
              int times = Integer.valueOf(scanner.nextLine());

          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int number = Integer.valueOf(scanner.nextLine());
              int times = Integer.valueOf(scanner.nextLine());
              int result = 0;
              for (int i = 0; i < times; i++) {
                  result += number;
              }
              System.out.println(result);
          }
      }
    hints:
      - A loop that runs `times` rounds, with a sum that starts at 0.
      - "Each round: `result += number;`"
    forbid:
      - pattern: \*
        message: "Multiply with a loop of additions, without `*`."
    tests:
      - stdin: |
          6
          4
      - stdin: |
          9
          1
        hidden: true
      - stdin: |
          12
          12
        hidden: true
    more:
