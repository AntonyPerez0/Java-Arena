  - id: for-loops-for
    slug: for-loops
    title: for loops
    text: |
      Counting loops are so common that Java has a shorter way to write them. The **for loop** puts all three parts on one line, separated by semicolons:

      ```java main
      for (int i = 1; i <= 5; i++) {
          System.out.println(i);
      }
      ```

      ```output
      1
      2
      3
      4
      5
      ```

      `for (start; condition; change)` does the same as this `while` loop:

      ```java fragment
      int i = 1;
      while (i <= 5) {
          System.out.println(i);
          i++;
      }
      ```

      - The start runs once, before the first round.
      - The condition is checked before every round.
      - The change runs at the end of every round.

      A loop variable is often called `i`. Made in the `for` line, it only exists inside the loop. Counting down and other steps work too: `for (int i = 10; i >= 1; i--)` counts from 10 to 1, and `i += 2` instead of `i++` takes every second number.

      **Your turn:** rewrite this `while` loop as a `for` loop. The program prints:

      ```
      Lap 1
      Lap 2
      Lap 3
      Lap 4
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              int lap = 1;
              while (lap <= 4) {
                  System.out.println("Lap " + lap);
                  lap++;
              }
          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              for (int lap = 1; lap <= 4; lap++) {
                  System.out.println("Lap " + lap);
              }
          }
      }
    hints:
      - "The three parts are already there: `int lap = 1`, `lap <= 4` and `lap++`."
      - "`for (int lap = 1; lap <= 4; lap++) { ... }`, and the loop's block keeps only the print line."
    require:
      - pattern: \bfor\s*\(
        message: "Use a `for` loop."
    forbid:
      - pattern: \bwhile\b
        message: "Replace the `while` loop with the `for` loop."
    more:
