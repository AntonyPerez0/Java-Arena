      - task: |
          Read a number `n` and print the product of the odd numbers from 1 to `n`. For the input `7` the program prints `105`, because 1 times 3 times 5 times 7 is 105:

          ```
          105
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int n = Integer.valueOf(scanner.nextLine());

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int n = Integer.valueOf(scanner.nextLine());
                  int product = 1;
                  for (int i = 1; i <= n; i += 2) {
                      product *= i;
                  }
                  System.out.println(product);
              }
          }
