id: methods
summary: Dividing a program into methods. Defining and calling your own methods, calling them from loops, giving them parameters (one or several), and why a method gets copies of the values it's given.
steps:
  - id: methods-define-and-call
    slug: defining-methods
    title: Defining and calling a method
    text: |
      So far every program has been one long `main` method. As programs grow, that gets hard to read. A **method** is a named piece of code: you write it once and run it by its name, as often as you like.

      ```java run
      public class Main {
          public static void main(String[] args) {
              System.out.println("Let's begin.");
              greet();
              greet();
              System.out.println("Done.");
          }

          public static void greet() {
              System.out.println("Hello from a method!");
          }
      }
      ```

      ```output
      Let's begin.
      Hello from a method!
      Hello from a method!
      Done.
      ```

      - `public static void greet() { ... }` **defines** the method. It sits inside the class, next to `main`, never inside another method.
      - `greet();` **calls** it: Java runs the method's lines, then carries on after the call.
      - Every method in these lessons starts with `public static`; the modules on objects explain what that means. `void` means the method gives nothing back. Module 11 is about methods that do.
      - Method names follow the same style as variable names: a small first letter, and a capital for each new word, such as `printMenu` or `showScore`.

      The order of the methods in the class doesn't matter: Java always starts at `main`.

      **Your turn:** fill in the blanks, so `main` calls `printBanner` before and after the welcome. The program prints:

      ```
      **********
      Welcome!
      **********
      ```
    fill: |
      public class Main {
          public static void main(String[] args) {
              [[printBanner]]();
              System.out.println("Welcome!");
              [[printBanner]]();
          }

          public static void printBanner() {
              System.out.println("**********");
          }
      }
    hints:
      - A call is the method's name followed by `()`.
      - "Both blanks are `printBanner`: the `();` is already there."
    more:
      - task: |
          Write a method `printRules()` that prints two lines, `No running` and then `No diving`. The check calls your method:

          ```
          No running
          No diving
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  printRules();
              }

              // Write the printRules method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  printRules();
              }

              public static void printRules() {
                  System.out.println("No running");
                  System.out.println("No diving");
              }
          }
        hints:
          - "The method goes inside the class but outside `main`: after `main`'s closing `}`."
          - "Start it with `public static void printRules() {` and put the two print lines inside."
        tests:
          - call: printRules();
          - call: |
              printRules();
              printRules();
            hidden: true
      - task: |
          Write two methods: `morning()` prints `Good morning` and `evening()` prints `Good evening`. Then make `main` call them, so the program prints:

          ```
          Good morning
          Good evening
          Good morning
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {

              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  morning();
                  evening();
                  morning();
              }

              public static void morning() {
                  System.out.println("Good morning");
              }

              public static void evening() {
                  System.out.println("Good evening");
              }
          }
        hints:
          - Each method has one print line. `main` then has three calls and no print lines of its own.
          - "`main` calls `morning();`, then `evening();`, then `morning();` again."
        require:
          - pattern: ^\s*morning\s*\(\s*\)\s*;
            flags: m
            min: 2
            message: "Let `main` call `morning()` for both of its lines."
          - pattern: ^\s*evening\s*\(\s*\)\s*;
            flags: m
            message: "Let `main` call `evening()`."
        tests:
          - name: The program
          - call: evening();
            hidden: true
          - call: morning();
            hidden: true

  - id: methods-in-loops
    slug: calling-in-a-loop
    title: Calling a method from a loop
    text: |
      A method call is a statement like any other, so it can go inside a loop. The method's lines are written once and run every time the loop comes round:

      ```java run
      public class Main {
          public static void main(String[] args) {
              for (int round = 1; round <= 3; round++) {
                  System.out.println("Round " + round);
                  printDivider();
              }
          }

          public static void printDivider() {
              System.out.println("-----");
          }
      }
      ```

      ```output
      Round 1
      -----
      Round 2
      -----
      Round 3
      -----
      ```

      Methods also make a program easier to change. To make the divider longer, you change one line in `printDivider`, and every call prints the new one.

      **Your turn:** make `main` print the line three times, with a single call to `printLine()` inside a loop. The program prints:

      ```
      ==========
      ==========
      ==========
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {

          }

          public static void printLine() {
              System.out.println("==========");
          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              for (int i = 0; i < 3; i++) {
                  printLine();
              }
          }

          public static void printLine() {
              System.out.println("==========");
          }
      }
    hints:
      - "A `for` loop that runs three times: `for (int i = 0; i < 3; i++) { ... }`."
      - The only line inside the loop is the call `printLine();`.
    require:
      - pattern: \b(for|while)\s*\(
        message: Use a loop.
      - pattern: \bprintLine\s*\(\s*\)\s*;
        min: 1
        max: 1
        message: "Write the call `printLine();` once, inside the loop: the loop repeats it."
    more:
      - task: |
          Read how many cheers the crowd wants, and call `cheer()` that many times. For the input `3` the program prints:

          ```
          Hip hip hooray!
          Hip hip hooray!
          Hip hip hooray!
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int times = Integer.valueOf(scanner.nextLine());

              }

              public static void cheer() {
                  System.out.println("Hip hip hooray!");
              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int times = Integer.valueOf(scanner.nextLine());
                  for (int i = 0; i < times; i++) {
                      cheer();
                  }
              }

              public static void cheer() {
                  System.out.println("Hip hip hooray!");
              }
          }
        hints:
          - The loop runs `times` times instead of a fixed number.
          - "`for (int i = 0; i < times; i++) { cheer(); }`"
        require:
          - pattern: \bcheer\s*\(\s*\)\s*;
            min: 1
            max: 1
            message: "Write the call `cheer();` once, inside a loop."
        tests:
          - stdin: "3"
          - stdin: "1"
            hidden: true
          - stdin: "5"
            hidden: true
      - task: |
          Write two methods: `tick()` prints `tick` and `tock()` prints `tock`. Then read a number of rounds, and in each round call `tick()` and then `tock()`. For the input `2` the program prints:

          ```
          tick
          tock
          tick
          tock
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int rounds = Integer.valueOf(scanner.nextLine());

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int rounds = Integer.valueOf(scanner.nextLine());
                  for (int i = 0; i < rounds; i++) {
                      tick();
                      tock();
                  }
              }

              public static void tick() {
                  System.out.println("tick");
              }

              public static void tock() {
                  System.out.println("tock");
              }
          }
        hints:
          - Write the two methods first, each with one print line.
          - The loop runs `rounds` times, and its body has two calls.
        require:
          - pattern: \b(for|while)\s*\(
            message: Use a loop for the rounds.
        tests:
          - stdin: "2"
          - stdin: "1"
            hidden: true
          - stdin: "3"
            hidden: true
          - call: |
              tock();
              tick();
            hidden: true

  - id: methods-parameters
    slug: parameters
    title: Parameters
    text: |
      A method can take **parameters**: values it gets from the call. They're declared in the parentheses, each with a type and a name, and inside the method they work like variables:

      ```java run
      public class Main {
          public static void main(String[] args) {
              greet("Ada");
              greet("Linus");
              String name = "Grace";
              greet(name);
          }

          public static void greet(String name) {
              System.out.println("Hello, " + name + "!");
          }
      }
      ```

      ```output
      Hello, Ada!
      Hello, Linus!
      Hello, Grace!
      ```

      - `String name` in `greet(String name)` is the parameter. Each call gives it a value: `greet("Ada")` runs the method with `name` holding `"Ada"`.
      - The value in the call is the **argument**. It can be a literal, a variable or a calculation, such as `greet(first + " " + last)`.
      - The argument must fit the parameter's type: `greet(42)` doesn't compile, because 42 isn't a String.

      The same method now does something different on each call, depending on what it's given.

      ### Challenges that call your method

      From here on, some challenges ask for a method, and the check calls it directly. The task card shows the call it makes, such as `countdown(3);`, and what that call must print. Your own `main` can call the method however you like: that's what **Run with my input** runs.

      **Your turn:** fill in the parameter of `shout`, and use it in the print line. The check calls `shout("hey");` and expects:

      ```
      hey!!!
      ```
    fill: |
      public class Main {
          public static void main(String[] args) {
              shout("hello");
              shout("goodbye");
          }

          public static void shout([[String word]]) {
              System.out.println([[word]] + "!!!");
          }
      }
    hints:
      - "A parameter is a type and a name, like a variable declaration without a value: `String word`."
      - "The print line uses the parameter by its name: `word`."
    tests:
      - call: shout("hey");
      - call: shout("Java");
        hidden: true
    more:
      - task: |
          Write a method `countdown(int start)` that prints the numbers from `start` down to 1, one per line, and then `Liftoff!`. The check calls `countdown(3);` and expects:

          ```
          3
          2
          1
          Liftoff!
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  countdown(3);
              }

              // Write the countdown method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  countdown(3);
              }

              public static void countdown(int start) {
                  for (int i = start; i >= 1; i--) {
                      System.out.println(i);
                  }
                  System.out.println("Liftoff!");
              }
          }
        hints:
          - "The method starts `public static void countdown(int start) {`."
          - "A loop counting down: `for (int i = start; i >= 1; i--)`. `Liftoff!` comes after the loop."
        tests:
          - call: countdown(3);
          - call: countdown(1);
            hidden: true
          - call: countdown(0);
            hidden: true
          - call: countdown(6);
            hidden: true
      - task: |
          Write a method `printSquares(int n)` that prints the squares of the numbers from 1 to `n`, one per line: 1 times 1, then 2 times 2, and so on. The check calls `printSquares(4);` and expects:

          ```
          1
          4
          9
          16
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  printSquares(4);
              }

              // Write the printSquares method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  printSquares(4);
              }

              public static void printSquares(int n) {
                  for (int i = 1; i <= n; i++) {
                      System.out.println(i * i);
                  }
              }
          }
        hints:
          - "A loop from 1 to `n`: `for (int i = 1; i <= n; i++)`."
          - Inside it, print `i * i`.
        tests:
          - call: printSquares(4);
          - call: printSquares(1);
            hidden: true
          - call: printSquares(7);
            hidden: true

  - id: methods-several-parameters
    slug: several-parameters
    title: Several parameters
    text: |
      A method can have several parameters, separated by commas, each with its own type. The arguments in a call go to the parameters in order: the first to the first, the second to the second.

      ```java run
      public class Main {
          public static void main(String[] args) {
              printSum(3, 4);
              printSum(10, -2);
          }

          public static void printSum(int first, int second) {
              System.out.println(first + " + " + second + " = " + (first + second));
          }
      }
      ```

      ```output
      3 + 4 = 7
      10 + -2 = 8
      ```

      A call must give exactly as many arguments as there are parameters, and of fitting types. With one argument missing, it doesn't compile:

      ```java error
      public class Main {
          public static void main(String[] args) {
              printSum(3);
          }

          public static void printSum(int first, int second) {
              System.out.println(first + " + " + second + " = " + (first + second));
          }
      }
      ```

      ```javac
      Main.java:3: error: method printSum in class Main cannot be applied to given types;
              printSum(3);
              ^
        required: int,int
        found:    int
        reason: actual and formal argument lists differ in length
      1 error
      ```

      `required` is what the method's parameters need, and `found` is what the call gave. The parameters can have different types too: `printPrice(String item, double price)` is called as `printPrice("Tea", 2.5)`.

      **Your turn:** write a method `printProduct(int a, int b)` that prints the calculation and its result. The check calls `printProduct(3, 4);` and expects:

      ```
      3 * 4 = 12
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              printProduct(3, 4);
          }

          // Write the printProduct method here.
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              printProduct(3, 4);
          }

          public static void printProduct(int a, int b) {
              System.out.println(a + " * " + b + " = " + (a * b));
          }
      }
    hints:
      - "The method starts `public static void printProduct(int a, int b) {`."
      - "Put the multiplication in parentheses inside the print line: `(a * b)`."
    tests:
      - call: printProduct(3, 4);
      - call: printProduct(-2, 5);
        hidden: true
      - call: printProduct(0, 9);
        hidden: true
    more:
      - task: |
          Write a method `printAverage(int a, int b)` that prints the average of its two parameters as a decimal number. The check calls `printAverage(3, 4);` and expects:

          ```
          The average is 3.5
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  printAverage(3, 4);
              }

              // Write the printAverage method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  printAverage(3, 4);
              }

              public static void printAverage(int a, int b) {
                  double average = (a + b) / 2.0;
                  System.out.println("The average is " + average);
              }
          }
        hints:
          - "Dividing two `int`s drops the decimals. Divide by `2.0` instead of `2`."
          - "`double average = (a + b) / 2.0;`"
        tests:
          - call: printAverage(3, 4);
          - call: printAverage(10, 10);
            hidden: true
          - call: printAverage(-3, 2);
            hidden: true
      - task: |
          Write a method `printEvery(int start, int end, int step)` that prints `start`, then every `step`-th number after it, as long as the number is at most `end`. The check calls `printEvery(3, 10, 3);` and expects:

          ```
          3
          6
          9
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  printEvery(3, 10, 3);
              }

              // Write the printEvery method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  printEvery(3, 10, 3);
              }

              public static void printEvery(int start, int end, int step) {
                  for (int i = start; i <= end; i = i + step) {
                      System.out.println(i);
                  }
              }
          }
        hints:
          - "Three parameters, all `int`: `(int start, int end, int step)`."
          - "A loop that adds `step` each round: `for (int i = start; i <= end; i = i + step)`."
        tests:
          - call: printEvery(3, 10, 3);
          - call: printEvery(0, 20, 5);
            hidden: true
          - call: printEvery(7, 7, 4);
            hidden: true
          - call: printEvery(1, 10, 4);
            hidden: true

  - id: methods-copies
    slug: parameters-are-copies
    title: Parameters are copies
    text: |
      When a method is called, each parameter gets a **copy** of the argument's value. The method can change its parameter, but that changes only its own copy:

      ```java run
      public class Main {
          public static void main(String[] args) {
              int score = 10;
              doubleIt(score);
              System.out.println("In main: " + score);
          }

          public static void doubleIt(int score) {
              score = score * 2;
              System.out.println("In the method: " + score);
          }
      }
      ```

      ```output
      In the method: 20
      In main: 10
      ```

      Both variables are called `score`, but they're two different variables: each method has its own. The name used in the call doesn't matter either. Only the value is passed on, so `doubleIt(score)`, `doubleIt(10)` and `doubleIt(5 + 5)` all do the same.

      To get a value back out of a method, the method has to **return** it. That's the next module. (For objects, such as lists, there's more to the story; the module on primitive and reference variables tells it.)

      **Your turn:** what does this program print? Trace it line by line and type each line.
    predict: |
      public class Main {
          public static void main(String[] args) {
              int number = 5;
              addTen(number);
              System.out.println(number);
          }

          public static void addTen(int number) {
              number = number + 10;
              System.out.println("Inside: " + number);
          }
      }
    hints:
      - "The method prints first, with its own copy changed to 15."
      - "`main`'s `number` was never changed: it's still 5."
    more:
      - task: |
          What does this program print? Watch which value goes to which parameter.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  int x = 1;
                  int y = 2;
                  show(y, x);
              }

              public static void show(int x, int y) {
                  System.out.println("x = " + x);
                  System.out.println("y = " + y);
              }
          }
        hints:
          - The first argument goes to the first parameter, whatever the names are.
          - "The call is `show(y, x)`, so the method's `x` gets 2 and its `y` gets 1."
      - task: |
          What does this program print? The method changes its parameter in a loop.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  int n = 0;
                  countUp(n);
                  System.out.println("n is still " + n);
              }

              public static void countUp(int n) {
                  while (n < 3) {
                      n++;
                      System.out.println(n);
                  }
              }
          }
        hints:
          - "Inside the method, `n` starts at 0 and goes up by one before each print."
          - "The loop prints 1, 2 and 3. Then `main` prints its own `n`, which is still 0."
