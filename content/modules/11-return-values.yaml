      - task: |
          Write `printDiamond(int size)`: a pyramid of `o` with `size` rows, followed by the same pyramid upside down without its widest row, so the diamond has `2 * size - 1` rows. The check runs `printDiamond(3);` and expects:

          ```
            o
           ooo
          ooooo
           ooo
            o
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  printDiamond(3);
              }

              public static String repeat(String text, int times) {
                  String result = "";
                  for (int i = 0; i < times; i++) {
                      result += text;
                  }
                  return result;
              }

              // Write the printDiamond method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  printDiamond(3);
              }

              public static String repeat(String text, int times) {
                  String result = "";
                  for (int i = 0; i < times; i++) {
                      result += text;
                  }
                  return result;
              }

              public static void printDiamond(int size) {
                  for (int row = 1; row <= size; row++) {
                      printRow(size, row);
                  }
                  for (int row = size - 1; row >= 1; row--) {
                      printRow(size, row);
                  }
              }

              public static void printRow(int size, int row) {
                  System.out.println(repeat(" ", size - row) + repeat("o", 2 * row - 1));
              }
          }
        hints:
          - "The top half is the pyramid from the lesson. The bottom half is the same rows again, from `size - 1` down to 1."
          - "A helper `printRow(int size, int row)` that prints one pyramid row keeps both loops short."
        require:
          - pattern: \brepeat\s*\(
            min: 2
            message: "Build the rows with `repeat`."
        tests:
          - call: printDiamond(3);
          - call: printDiamond(1);
            hidden: true
          - call: printDiamond(4);
            hidden: true
