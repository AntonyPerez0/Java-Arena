  - id: return-values-building-text
    slug: returning-text
    title: Returning text built in a loop
    text: |
      A method can build a String in a loop and return it. Start from the empty String `""`, and add a piece in each round with `+=`:

      ```java run
      public class Main {
          public static void main(String[] args) {
              System.out.println(dashes(5));
              System.out.println("[" + dashes(3) + "]");
              System.out.println("[" + dashes(0) + "]");
          }

          public static String dashes(int count) {
              String line = "";
              for (int i = 0; i < count; i++) {
                  line += "-";
              }
              return line;
          }
      }
      ```

      ```output
      -----
      [---]
      []
      ```

      Returning the text, instead of printing it, means the caller can put it anywhere: on a line of its own, between brackets, or in front of other text on the same line. The next step uses exactly that to draw shapes.

      (Java has a ready-made way to do this, `"-".repeat(5)`. Here the point is the loop, so the challenges ask you to write it yourself.)

      **Your turn:** write a method `repeat(String text, int times)` that returns `text` repeated `times` times. The check runs `System.out.println(repeat("ab", 3));` and expects:

      ```
      ababab
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(repeat("ab", 3));
          }

          // Write the repeat method here.
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(repeat("ab", 3));
          }

          public static String repeat(String text, int times) {
              String result = "";
              for (int i = 0; i < times; i++) {
                  result += text;
              }
              return result;
          }
      }
    hints:
      - "Like `dashes`, with `text` in place of `\"-\"` and `times` in place of `count`."
      - "Start with `String result = \"\";`, add `text` in each round, and return `result` after the loop."
    forbid:
      - pattern: \.repeat\s*\(
        message: "Build the text with a loop, without Java's ready-made `.repeat`."
    tests:
      - call: System.out.println(repeat("ab", 3));
      - call: System.out.println(repeat("#", 1));
        hidden: true
      - call: System.out.println("[" + repeat("x", 0) + "]");
        hidden: true
    more:
      - task: |
          Write `printStripes(int width, int rows)`, which prints `rows` lines, each `width` characters long. The lines take turns: `=` first, then `-`, then `=` again, and so on. Use the `repeat` method that's already there. The check runs `printStripes(5, 3);` and expects:

          ```
          =====
          -----
          =====
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  printStripes(5, 3);
              }

              public static String repeat(String text, int times) {
                  String result = "";
                  for (int i = 0; i < times; i++) {
                      result += text;
                  }
                  return result;
              }

              // Write the printStripes method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  printStripes(5, 3);
              }

              public static String repeat(String text, int times) {
                  String result = "";
                  for (int i = 0; i < times; i++) {
                      result += text;
                  }
                  return result;
              }

              public static void printStripes(int width, int rows) {
                  for (int row = 1; row <= rows; row++) {
                      if (row % 2 == 1) {
                          System.out.println(repeat("=", width));
                      } else {
                          System.out.println(repeat("-", width));
                      }
                  }
              }
          }
        hints:
          - "A loop over the rows. Odd rows (1, 3, 5, ...) are `=`, even rows are `-`: `row % 2 == 1` tells them apart."
          - "Each row is one line: `System.out.println(repeat(\"=\", width));`"
        require:
          - pattern: \brepeat\s*\(
            min: 2
            message: "Build each line with `repeat`."
        tests:
          - call: printStripes(5, 3);
          - call: printStripes(2, 4);
            hidden: true
          - call: printStripes(7, 1);
            hidden: true
      - task: |
          Write `printFrame(int width, int height)`, which prints a frame of `#`: the top and bottom lines are full, and the lines between have a `#` at each end with spaces between. Width and height are always at least 2. Use `repeat`. The check runs `printFrame(5, 4);` and expects:

          ```
          #####
          #   #
          #   #
          #####
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  printFrame(5, 4);
              }

              public static String repeat(String text, int times) {
                  String result = "";
                  for (int i = 0; i < times; i++) {
                      result += text;
                  }
                  return result;
              }

              // Write the printFrame method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  printFrame(5, 4);
              }

              public static String repeat(String text, int times) {
                  String result = "";
                  for (int i = 0; i < times; i++) {
                      result += text;
                  }
                  return result;
              }

              public static void printFrame(int width, int height) {
                  System.out.println(repeat("#", width));
                  for (int row = 2; row < height; row++) {
                      System.out.println("#" + repeat(" ", width - 2) + "#");
                  }
                  System.out.println(repeat("#", width));
              }
          }
        hints:
          - "The top and bottom lines are `repeat(\"#\", width)`. The lines between them number `height - 2`."
          - "A middle line is `\"#\" + repeat(\" \", width - 2) + \"#\"`."
        require:
          - pattern: \brepeat\s*\(
            min: 2
            message: "Build the lines with `repeat`."
        tests:
          - call: printFrame(5, 4);
          - call: printFrame(2, 2);
            hidden: true
          - call: printFrame(6, 3);
            hidden: true

  - id: return-values-shapes
    slug: drawing-shapes
    title: Drawing shapes with methods
    text: |
      Text shapes are a good workout for loops and methods together. The trick is to look at a shape one row at a time, and write down what each row is made of. Here's a pyramid of height 3:

      ```
        ^
       ^^^
      ^^^^^
      ```

      | Row | Spaces | Symbols |
      |---|---|---|
      | 1 | 2 | 1 |
      | 2 | 1 | 3 |
      | 3 | 0 | 5 |

      The spaces go down by one per row: for a height `h`, row `r` has `h - r` of them. The symbols go up by two: `2 * r - 1`. With a method that returns repeated text, each row is then one line of code:

      ```java run
      public class Main {
          public static void main(String[] args) {
              printPyramid(3);
          }

          public static void printPyramid(int height) {
              for (int row = 1; row <= height; row++) {
                  System.out.println(repeat(" ", height - row) + repeat("^", 2 * row - 1));
              }
          }

          public static String repeat(String text, int times) {
              String result = "";
              for (int i = 0; i < times; i++) {
                  result += text;
              }
              return result;
          }
      }
      ```

      ```output
        ^
       ^^^
      ^^^^^
      ```

      Spaces at the start of a line count, so the checks compare them exactly. (Spaces at the end of a line are ignored.)

      ### The end of part 2

      This step ends the material of the MOOC's second part. As programs get more features they grow, and bigger programs are harder to understand. This part took the first steps toward keeping them manageable: loops run code again and again without copying it, and methods split a program into smaller parts with names. The MOOC closes the part with [a short self-reflection questionnaire](https://java-programming.mooc.fi/part-2/5-end-questionnaire) on its own site.

      **Your turn:** write `printDiagonal(int size)`, which prints `size` rows with an `o` in each, every row one space further to the right. Use `repeat` for the spaces. The check runs `printDiagonal(3);` and expects:

      ```
      o
       o
        o
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              printDiagonal(3);
          }

          public static String repeat(String text, int times) {
              String result = "";
              for (int i = 0; i < times; i++) {
                  result += text;
              }
              return result;
          }

          // Write the printDiagonal method here.
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              printDiagonal(3);
          }

          public static String repeat(String text, int times) {
              String result = "";
              for (int i = 0; i < times; i++) {
                  result += text;
              }
              return result;
          }

          public static void printDiagonal(int size) {
              for (int row = 1; row <= size; row++) {
                  System.out.println(repeat(" ", row - 1) + "o");
              }
          }
      }
    hints:
      - "Row 1 has no spaces before the `o`, row 2 has one, row 3 has two: row `r` has `r - 1`."
      - "`System.out.println(repeat(\" \", row - 1) + \"o\");` inside a loop over the rows."
    require:
      - pattern: \brepeat\s*\(
        min: 2
        message: "Make the spaces with `repeat`."
    tests:
      - call: printDiagonal(3);
      - call: printDiagonal(1);
        hidden: true
      - call: printDiagonal(5);
        hidden: true
