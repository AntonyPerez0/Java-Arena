  - id: return-values-calling-methods
    slug: methods-calling-methods
    title: Methods that call methods
    text: |
      Any method can call other methods, not only `main`. A bigger method can then be built from smaller ones that each do one thing:

      ```java run
      public class Main {
          public static void main(String[] args) {
              System.out.println(distance(3, 4));
          }

          public static int square(int number) {
              return number * number;
          }

          public static double distance(int x, int y) {
              return Math.sqrt(square(x) + square(y));
          }
      }
      ```

      ```output
      5.0
      ```

      `distance` calls `square` twice and uses what it returns. Each small method can be checked on its own, and once `square` works, every method that uses it can rely on it.

      Methods that print can call each other too. A method that prints a table can call a method that prints one row, once for each row. The row method then only has to know how to print a single row.

      **Your turn:** write `daysInYear(int year)`, which returns 366 for a leap year and 365 otherwise. Use the `isLeapYear` method that's already there (it follows the leap year rules from module 6). The check runs `System.out.println(daysInYear(2024));` and expects:

      ```
      366
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(daysInYear(2024));
          }

          public static boolean isLeapYear(int year) {
              if (year % 400 == 0) {
                  return true;
              }
              if (year % 100 == 0) {
                  return false;
              }
              return year % 4 == 0;
          }

          // Write the daysInYear method here.
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(daysInYear(2024));
          }

          public static boolean isLeapYear(int year) {
              if (year % 400 == 0) {
                  return true;
              }
              if (year % 100 == 0) {
                  return false;
              }
              return year % 4 == 0;
          }

          public static int daysInYear(int year) {
              if (isLeapYear(year)) {
                  return 366;
              }
              return 365;
          }
      }
    hints:
      - "`isLeapYear(year)` gives `true` or `false`, so it can be the condition of an `if`."
      - "`if (isLeapYear(year)) { return 366; }` and then `return 365;`"
    require:
      - pattern: \bisLeapYear\s*\(
        min: 2
        message: "Use `isLeapYear` inside `daysInYear`."
    tests:
      - call: System.out.println(daysInYear(2024));
      - call: System.out.println(daysInYear(1900));
        hidden: true
      - call: System.out.println(daysInYear(2000));
        hidden: true
