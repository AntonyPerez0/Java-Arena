  - id: return-values-branches
    slug: returning-from-branches
    title: Returning from branches
    text: |
      A method can have several `return` statements, one in each branch. The first `return` that runs ends the method:

      ```java run
      public class Main {
          public static void main(String[] args) {
              System.out.println(result(72));
              System.out.println(result(35));
          }

          public static String result(int points) {
              if (points >= 50) {
                  return "pass";
              }
              return "fail";
          }
      }
      ```

      ```output
      pass
      fail
      ```

      For 72 the first `return` runs, and the method ends there. For 35 the `if` is skipped and the second `return` runs. No `else` is needed, because the method never gets past a `return`.

      Java checks that every way through the method ends in a `return`. Without the last line, the method has no value to give back when the points are below 50, and it doesn't compile:

      ```java error
      public class Main {
          public static void main(String[] args) {
              System.out.println(result(72));
          }

          public static String result(int points) {
              if (points >= 50) {
                  return "pass";
              }
          }
      }
      ```

      ```javac
      Main.java:10: error: missing return statement
          }
          ^
      1 error
      ```

      **Your turn:** write a method `isAdult(int age)` that returns `true` for an age of 18 or more, and `false` otherwise. The check runs `System.out.println(isAdult(18));` and expects:

      ```
      true
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(isAdult(18));
          }

          // Write the isAdult method here.
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(isAdult(18));
          }

          public static boolean isAdult(int age) {
              if (age >= 18) {
                  return true;
              }
              return false;
          }
      }
    hints:
      - "The return type is `boolean`."
      - "An `if` with `return true;`, and `return false;` after it. (A shorter way works too: `return age >= 18;`)"
    tests:
      - call: System.out.println(isAdult(18));
      - call: System.out.println(isAdult(17));
        hidden: true
      - call: System.out.println(isAdult(40));
        hidden: true
    more:
      - task: |
          Write a method `sign(int number)` that returns -1 for a negative number, 0 for zero and 1 for a positive number. The check runs `System.out.println(sign(-8));` and expects:

          ```
          -1
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(sign(-8));
              }

              // Write the sign method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(sign(-8));
              }

              public static int sign(int number) {
                  if (number < 0) {
                      return -1;
                  }
                  if (number == 0) {
                      return 0;
                  }
                  return 1;
              }
          }
        hints:
          - Three cases, each with its own `return`.
          - "The last case needs no `if`: whatever gets past the first two checks is positive."
        tests:
          - call: System.out.println(sign(-8));
          - call: System.out.println(sign(0));
            hidden: true
          - call: System.out.println(sign(25));
            hidden: true
      - task: |
          Write a method `clamp(int value, int low, int high)` that keeps `value` inside the range from `low` to `high`: below it, return `low`; above it, return `high`; otherwise return the value itself. The check runs `System.out.println(clamp(130, 0, 100));` and expects:

          ```
          100
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(clamp(130, 0, 100));
              }

              // Write the clamp method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(clamp(130, 0, 100));
              }

              public static int clamp(int value, int low, int high) {
                  if (value < low) {
                      return low;
                  }
                  if (value > high) {
                      return high;
                  }
                  return value;
              }
          }
        hints:
          - "Like the volume control in module 7, but with the limits as parameters and a `return` in each case."
          - "`if (value < low) { return low; }`, the same for `high`, and `return value;` last."
        tests:
          - call: System.out.println(clamp(130, 0, 100));
          - call: System.out.println(clamp(-5, 0, 100));
            hidden: true
          - call: System.out.println(clamp(42, 0, 100));
            hidden: true
          - call: System.out.println(clamp(5, 10, 20));
            hidden: true

  - id: return-values-local-variables
    slug: variables-inside-methods
    title: Variables inside methods
    text: |
      A variable made inside a method belongs to that method: it's a **local variable**. It exists while the method runs and disappears when the method ends. Other methods can't see it, not even `main`. The same goes for parameters.

      ```java error
      public class Main {
          public static void main(String[] args) {
              addTax(100);
              System.out.println(withTax);
          }

          public static double addTax(double price) {
              double withTax = price * 1.25;
              return withTax;
          }
      }
      ```

      ```javac
      Main.java:4: error: cannot find symbol
              System.out.println(withTax);
                                 ^
        symbol:   variable withTax
        location: class Main
      1 error
      ```

      `withTax` lives only inside `addTax`. To get its value out, use the return value: store what the call returns in a variable of `main`'s own.

      ```java run
      public class Main {
          public static void main(String[] args) {
              double withTax = addTax(100);
              System.out.println(withTax);
          }

          public static double addTax(double price) {
              double withTax = price * 1.25;
              return withTax;
          }
      }
      ```

      ```output
      125.0
      ```

      The two `withTax` variables are different variables that happen to share a name, one in each method.

      Another mistake gives the same `cannot find symbol` error: using a method's name without the parentheses and arguments, as `square` instead of `square(5)`. Without them, Java looks for a variable called `square`.

      **Your turn:** `main` tries to use the method's variable `total`, so the program doesn't compile. Fix `main` by using the value `calculateTotal` returns. The program prints:

      ```
      Total: 7
      ```
    seed: |
      public class Main {
          public static void main(String[] args) {
              calculateTotal(3, 4);
              System.out.println("Total: " + total);
          }

          public static int calculateTotal(int first, int second) {
              int total = first + second;
              return total;
          }
      }
    solution: |
      public class Main {
          public static void main(String[] args) {
              int total = calculateTotal(3, 4);
              System.out.println("Total: " + total);
          }

          public static int calculateTotal(int first, int second) {
              int total = first + second;
              return total;
          }
      }
    hints:
      - "The `total` inside `calculateTotal` doesn't exist in `main`."
      - "Store the returned value: `int total = calculateTotal(3, 4);`"
    tests:
      - name: The program
      - call: System.out.println(calculateTotal(10, 5));
        hidden: true
