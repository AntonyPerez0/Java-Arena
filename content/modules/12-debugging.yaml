      - task: |
          Trace this program by hand, with a table for `a` and `b`, then write down what it prints.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  int a = 1;
                  int b = 1;
                  for (int round = 1; round <= 4; round++) {
                      int next = a + b;
                      a = b;
