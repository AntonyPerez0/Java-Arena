      - task: |
          The method `sumBetween(int from, int to)` should add up every whole number from `from` to `to`, both included. For 3 and 6 that's 3 + 4 + 5 + 6 = 18, but it returns 12. Find the bug and fix it. The check runs `System.out.println(sumBetween(3, 6));` and expects:

          ```
          18
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(sumBetween(3, 6));
              }

              public static int sumBetween(int from, int to) {
                  int sum = 0;
                  for (int n = from; n < to; n++) {
                      sum += n;
                  }
                  return sum;
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(sumBetween(3, 6));
              }

              public static int sumBetween(int from, int to) {
                  int sum = 0;
                  for (int n = from; n <= to; n++) {
                      sum += n;
                  }
                  return sum;
              }
          }
        hints:
          - "Print `n` inside the loop. Which numbers are added, and which one is missing?"
          - "`to` itself must be added too: the condition should be `n <= to`."
        tests:
