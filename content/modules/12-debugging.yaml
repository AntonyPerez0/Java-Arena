              210
          - stdin: |
              10
              30
            hidden: true
      - task: |
          What does this program print? Watch for the comments.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  int lives = 3;
                  // lives = lives + 1;
                  System.out.println("Lives: " + lives);
                  /* lives = 0;
                  System.out.println("Game over"); */
