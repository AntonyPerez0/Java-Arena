  - id: debugging-names-comments
    slug: names-and-comments
    title: Names and comments
    text: |
      When you read your own code, you tend to see what you *meant* to write, not what's actually there. Psychologists call this **perceptual blindness**: your brain fills in the expected picture. It's why a bug can sit in plain sight while you read over it again and again.

      Two habits make code easier to read, both for others and for you next week.

      ### Names that say what a value is

      Compare these two versions of the same calculation:

      ```java main
      int a = 3;
      int b = 250;
      int c = a * b;
      System.out.println(c);
      ```

      ```output
      750
      ```

      ```java main
      int tickets = 3;
      int priceInCents = 250;
      int totalInCents = tickets * priceInCents;
      System.out.println(totalInCents);
      ```

      ```output
      750
      ```

      Both work, but only the second one tells you what it does. A wrong line such as `int totalInCents = tickets + priceInCents;` stands out when the names make sense, and hides easily among `a`, `b` and `c`. Short names are fine where the meaning is obvious, such as `i` for a loop counter.

      ### Comments that explain why

      A comment starts with `//` and runs to the end of the line; `/*` starts one that runs until `*/`, even over several lines. Java skips comments completely:

      ```java main
      /* Prices are kept in cents,
         so no rounding happens. */
      int priceInCents = 250;
      // A discount of 10 percent on orders of 4 or more
      int tickets = 4;
      if (tickets >= 4) {
          priceInCents = priceInCents * 90 / 100;
      }
      System.out.println(tickets * priceInCents);
      ```

      ```output
      900
      ```

      Good comments say what the code can't: why it's written this way, or what a rule means. A comment that repeats the code (`// adds one to count` above `count++;`) adds nothing, and a comment that no longer matches the code is worse than none.

      Comments are also a debugging tool: turning a line into a comment ("commenting it out") switches it off without deleting it.

      **Your turn:** the program below prints a debug line that shouldn't be in the output. Switch it off by turning it into a comment, so the program prints only:

      ```
      Total: 12
      ```
    fill: |
      public class Main {
          public static void main(String[] args) {
              int total = 0;
              for (int i = 1; i <= 3; i++) {
                  total += i * 2;
                  [[//]] System.out.println("debug: total is now " + total);
              }
              System.out.println("Total: " + total);
          }
      }
    hints:
      - "A line that starts with `//` is skipped by Java."
      - "The blank is `//`."
    tests:
      - expect: "Total: 12"
    more:
      - task: |
          This program works, but its names hide what it does. It reads a distance in kilometers and a time in minutes, and prints the average speed in kilometers per hour. Rename the variables `a`, `b` and `c` to names that say what they hold (the output must stay the same). With the input `42` and `210` it prints:

          ```
          Average speed: 12.0 km/h
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  double a = Double.valueOf(scanner.nextLine());
                  double b = Double.valueOf(scanner.nextLine());
                  double c = a / (b / 60);
                  System.out.println("Average speed: " + c + " km/h");
              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  double kilometers = Double.valueOf(scanner.nextLine());
                  double minutes = Double.valueOf(scanner.nextLine());
                  double kilometersPerHour = kilometers / (minutes / 60);
                  System.out.println("Average speed: " + kilometersPerHour + " km/h");
              }
          }
        hints:
          - "`a` is the distance, `b` the time in minutes, and `c` the speed. Change every place a name is used, not only where it's declared."
          - "For example `kilometers`, `minutes` and `kilometersPerHour`."
        forbid:
          - pattern: \b(double|int)\s+[a-z]\s*=
            message: "Give every variable a name of more than one letter that says what it holds."
