  - id: lists-get
    slug: getting-values
    title: Getting values by index
    text: |
      Every value in a list has an **index**: its position, counting from 0. The first value is at index 0, the second at index 1, and so on. `get(index)` gives back the value at that index:

      ```java main
      ArrayList<String> colors = new ArrayList<>();
      colors.add("red");
      colors.add("green");
      colors.add("blue");
      System.out.println(colors.get(0));
      System.out.println(colors.get(2));
      System.out.println(colors.get(1));
      ```

      ```output
      red
      blue
      green
      ```

      | index | 0 | 1 | 2 |
      |---|---|---|---|
      | value | red | green | blue |

      So the third value is at index 2: the index is always one less than the place as people count it. `get` only reads the value, and the list stays as it was.

      The index can be any `int` expression: a variable, as in `colors.get(i)`, or a calculation, as in `colors.get(i + 1)`.

      ### Using the values

      A value from an `ArrayList<Integer>` works like any `int`. Store it in a variable, or use it in a calculation:

      ```java main
      ArrayList<Integer> points = new ArrayList<>();
      points.add(8);
      points.add(5);
      points.add(10);
      int first = points.get(0);
      int total = points.get(0) + points.get(1) + points.get(2);
      System.out.println("First round: " + first);
      System.out.println("Total: " + total);
      System.out.println("Last two: " + (points.get(1) + points.get(2)));
      ```

      ```output
      First round: 8
      Total: 23
      Last two: 15
      ```

      Mind the parentheses in the last line. Without them, Java joins `"Last two: "` and 5 into text first, and then adds 10 to that text: `Last two: 510`.

      **Your turn:** the list holds the runners of a race, in the order they crossed the finish line. Fill in the blanks so the program prints the top three:

      ```
      Gold: Kofi
      Silver: Mei
      Bronze: Lars
      ```
    fill: |
      import java.util.ArrayList;

      public class Main {
          public static void main(String[] args) {
              ArrayList<String> finishers = new ArrayList<>();
              finishers.add("Kofi");
              finishers.add("Mei");
              finishers.add("Lars");
              finishers.add("Ines");
              System.out.println("Gold: " + finishers.[[get(0)]]);
              System.out.println("Silver: " + finishers.get(1));
              System.out.println("Bronze: " + finishers.get([[2]]));
          }
      }
    hints:
      - "`get` takes the index in parentheses, and the first runner is at index 0."
      - The third runner is at index 2.
