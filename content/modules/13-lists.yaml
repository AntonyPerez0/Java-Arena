    hints:
      - "The message says index 3, for a list of length 3: its indexes only go up to 2."
      - "All three indexes are one too big. The first stop is at index 0."
    require:
      - pattern: \bstops\.get\s*\(
        min: 3
        message: "Keep getting each stop from the list with `stops.get(...)`."
    tests:
      - name: The program
