          - `Laps: ` and the number of laps,
          - `Average: ` and the average lap time, as a decimal number,
          - `Fastest: lap ` and the number of the fastest lap, counting from 1 (on a tie, the earlier lap),
          - `Slower than average:`, and after it `lap ` and the number of every lap whose time is above the average, one per line.

