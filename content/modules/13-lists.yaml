          public static void main(String[] args) {
              ArrayList<String> stops = new ArrayList<>();
              stops.add("Station");
              stops.add("Library");
              stops.add("Harbor");
              System.out.println("First stop: " + stops.get(1));
              System.out.println("Second stop: " + stops.get(2));
              System.out.println("Last stop: " + stops.get(3));
          }
      }
    solution: |
