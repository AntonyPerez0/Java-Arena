        solution: |
          import java.util.ArrayList;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  ArrayList<Integer> laps = new ArrayList<>();
                  while (true) {
                      int time = Integer.valueOf(scanner.nextLine());
                      if (time == 0) {
                          break;
                      }
                      laps.add(time);
                  }

                  int total = 0;
                  for (int i = 0; i < laps.size(); i++) {
                      total += laps.get(i);
                  }
                  double average = (double) total / laps.size();

                  int fastest = 0;
                  for (int i = 1; i < laps.size(); i++) {
                      if (laps.get(i) < laps.get(fastest)) {
                          fastest = i;
                      }
                  }

                  System.out.println("Laps: " + laps.size());
                  System.out.println("Average: " + average);
                  System.out.println("Fastest: lap " + (fastest + 1));
                  System.out.println("Slower than average:");
                  for (int i = 0; i < laps.size(); i++) {
                      if (laps.get(i) > average) {
                          System.out.println("lap " + (i + 1));
                      }
                  }
              }
          }
        hints:
          - "Work in parts, after reading the list: a loop for the sum (then the average with `(double) total / laps.size()`), a loop for the index of the fastest lap, and a loop that prints the slow laps."
          - "The fastest lap is the smallest time: keep its index, and compare with `laps.get(i) < laps.get(fastest)`. A lap is slow when `laps.get(i) > average`."
