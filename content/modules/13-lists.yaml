      - task: |
          Read the titles of books you'd like to read, one per line, until the line `stop`. Add each title to the list `books` (but not `stop` itself). After the loop, print `Reading list: ` followed by the list. For the input `Dune`, `Emma`, `Beloved` and `stop` the program prints:

          ```
          Reading list: [Dune, Emma, Beloved]
          ```
        seed: |
          import java.util.ArrayList;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  ArrayList<String> books = new ArrayList<>();

              }
          }
        solution: |
          import java.util.ArrayList;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  ArrayList<String> books = new ArrayList<>();
                  while (true) {
                      String title = scanner.nextLine();
                      if (title.equals("stop")) {
                          break;
                      }
                      books.add(title);
                  }
                  System.out.println("Reading list: " + books);
              }
          }
        hints:
