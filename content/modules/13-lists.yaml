              int found = -1;
              for (int i = 0; i < playlist.size(); i++) {
                  if (playlist.get(i).equals(wanted)) {
                      found = i;
                      break;
                  }
              }
              if (found == -1) {
                  System.out.println("Not in the playlist");
              } else {
                  System.out.println("Track " + (found + 1));
              }
          }
      }
