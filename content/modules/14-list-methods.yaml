  - id: list-methods-sum-average
    slug: sums-and-averages
    title: Sums, averages and counts
    text: |
      The last module added up a list with an index loop. A for-each loop does it with less code. A sum starts at 0 and adds each value; a count starts at 0 and goes up by one when a value fits a condition. One loop can do both:

      ```java main
      ArrayList<Integer> temperatures = new ArrayList<>();
      temperatures.add(14);
      temperatures.add(19);
      temperatures.add(12);
      temperatures.add(16);

      int sum = 0;
      int warmDays = 0;
      for (int temperature : temperatures) {
          sum += temperature;
          if (temperature >= 15) {
              warmDays++;
          }
      }

      System.out.println("Sum: " + sum);
      System.out.println("Warm days: " + warmDays);
      System.out.println("Average: " + (double) sum / temperatures.size());
      ```

      ```output
      Sum: 61
      Warm days: 2
      Average: 15.25
      ```

      ### The average needs a double

      The number of values is `temperatures.size()`, an `int`. With `sum` an `int` too, `sum / temperatures.size()` is whole-number division: 61 / 4 gives 15, and the .25 is lost. As before, the cast `(double)` in front of `sum` keeps the decimals.

      An empty list has no average, because its size is 0. When the list might be empty, check `temperatures.size() > 0` before dividing.

      ### Going through the list twice

      Values kept in a list can be looked at as often as you like. To count the days warmer than the average, one loop works out the average first, and a second loop compares each value with it. Numbers read one by one without a list can be added up, but once the reading loop is over they're gone.

      **Your turn:** the program reads how many kilometers you cycled each day until the line `end`, into the list `rides`. Add a for-each loop that adds up the values, then print the total and the average per day. For the input 4, 0, 12 and 5 the program prints:

      ```
      Total: 21 km
      Average: 5.25 km per day
      ```
    seed: |
      import java.util.ArrayList;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              ArrayList<Integer> rides = new ArrayList<>();
              while (true) {
                  String line = scanner.nextLine();
                  if (line.equals("end")) {
                      break;
                  }
                  rides.add(Integer.valueOf(line));
              }

              // Add up the values with a for-each loop, and print the total and the average.
          }
      }
    solution: |
      import java.util.ArrayList;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              ArrayList<Integer> rides = new ArrayList<>();
              while (true) {
                  String line = scanner.nextLine();
                  if (line.equals("end")) {
                      break;
                  }
                  rides.add(Integer.valueOf(line));
              }

              int total = 0;
              for (int kilometers : rides) {
                  total += kilometers;
              }
              System.out.println("Total: " + total + " km");
              System.out.println("Average: " + (double) total / rides.size() + " km per day");
          }
      }
    hints:
      - "`int total = 0;` before the loop, and `total += kilometers;` inside `for (int kilometers : rides)`."
      - "The average is `(double) total / rides.size()`. Without the cast, 21 / 4 gives 5."
    require:
      - pattern: 'for\s*\(\s*\w+\s+\w+\s*:'
        message: "Add up the values with a for-each loop."
