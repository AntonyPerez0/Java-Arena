          Write a shopping list program that reads commands until `quit`. The commands `add` and `remove` are followed by a line with an item.

          - `add`: add the item and print `Added ` and the item. If it's already on the list, print `bread is already on the list` (with the item's name) instead.
          - `remove`: remove the item and print `Removed ` and the item. If it isn't on the list, print `cheese is not on the list` (with the item's name) instead.
          - `show`: print each item as `- ` and the item, with a for-each loop, or `The list is empty` when there's nothing on it.
          - `quit`: print `Bye!` and stop.

          For the input shown, the program prints:

