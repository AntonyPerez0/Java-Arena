        solution: |
          import java.util.ArrayList;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  ArrayList<String> items = new ArrayList<>();
                  while (true) {
                      String command = scanner.nextLine();
                      if (command.equals("quit")) {
                          System.out.println("Bye!");
                          break;
                      }
                      if (command.equals("add")) {
                          String item = scanner.nextLine();
                          if (items.contains(item)) {
                              System.out.println(item + " is already on the list");
                          } else {
                              items.add(item);
                              System.out.println("Added " + item);
                          }
                      } else if (command.equals("remove")) {
                          String item = scanner.nextLine();
                          if (items.contains(item)) {
                              items.remove(item);
                              System.out.println("Removed " + item);
                          } else {
                              System.out.println(item + " is not on the list");
                          }
                      } else if (command.equals("show")) {
                          if (items.isEmpty()) {
                              System.out.println("The list is empty");
                          }
                          for (String item : items) {
                              System.out.println("- " + item);
                          }
                      }
                  }
              }
          }
        hints:
          - "One `if` per command. For `add` and `remove`, read the item with another `scanner.nextLine()` inside that branch."
          - "`items.contains(item)` decides between the two messages of `add`, and of `remove`. For `show`, `items.isEmpty()` tells when to print `The list is empty`."
        require:
          - pattern: 'for\s*\(\s*\w+\s+\w+\s*:'
            message: "Print the items for `show` with a for-each loop."
