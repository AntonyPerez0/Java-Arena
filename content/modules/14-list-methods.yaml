            hidden: true
      - task: |
          Things come out of a moving box in the opposite order to how they went in. Read items until the line `close`. Print `Packed: ` and each item in order with a for-each loop. Then print `Unpacked: ` and each item from the last to the first, with an index loop that counts down. For the input `books`, `lamp`, `mugs` the program prints:

          ```
          Packed: books
          Packed: lamp
          Packed: mugs
          Unpacked: mugs
          Unpacked: lamp
          Unpacked: books
          ```
        seed: |
          import java.util.ArrayList;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  ArrayList<String> box = new ArrayList<>();

              }
          }
        solution: |
          import java.util.ArrayList;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  ArrayList<String> box = new ArrayList<>();
                  while (true) {
                      String item = scanner.nextLine();
                      if (item.equals("close")) {
                          break;
                      }
                      box.add(item);
                  }

                  for (String item : box) {
                      System.out.println("Packed: " + item);
                  }
                  for (int i = box.size() - 1; i >= 0; i--) {
                      System.out.println("Unpacked: " + box.get(i));
                  }
              }
          }
        hints:
          - "The for-each loop does the packing. A for-each loop can only go forwards, so unpacking needs an index."
          - "The last index is `box.size() - 1`: `for (int i = box.size() - 1; i >= 0; i--)`, with `box.get(i)` inside."
        require:
          - pattern: 'for\s*\(\s*\w+\s+\w+\s*:'
            message: "Print the packed items with a for-each loop."
          - pattern: \.get\s*\(
            message: "Unpack with an index loop that counts down and uses `get`."
