          Some visitors sign a guest book more than once. Read names until the line `done`, and keep each name only the first time it appears: add a name to the list only if the list doesn't contain it yet. Then print the names in the order they first signed, and how many different guests there were. For the input `Ada`, `Ben`, `Ada`, `Cleo`, `Ben` the program prints:

