          import java.util.ArrayList;

          public class Main {
              public static void main(String[] args) {
                  ArrayList<String> recent = new ArrayList<>();
                  recent.add("maps");
                  recent.add("mail");
                  recent.add("camera");
                  markUsed(recent, "camera");
                  System.out.println(recent);
              }

              public static void markUsed(ArrayList<String> recent, String app) {
                  if (recent.contains(app)) {
                      recent.remove(app);
                  }
                  recent.add(0, app);
              }
          }
