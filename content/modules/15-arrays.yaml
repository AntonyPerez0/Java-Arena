          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int seats = Integer.valueOf(scanner.nextLine());
                  boolean[] booked = new boolean[seats];
                  while (true) {
                      int seat = Integer.valueOf(scanner.nextLine());
                      if (seat == -1) {
                          break;
                      }
                      booked[seat] = true;
                  }
                  for (int i = 0; i < booked.length; i++) {
                      if (!booked[i]) {
                          System.out.println("Seat " + i + " is free");
                      }
                  }
              }
          }
