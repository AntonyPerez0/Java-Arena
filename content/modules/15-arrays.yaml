          A small theater numbers its seats from 0. Read the number of seats, then the numbers of the booked seats, one per line, until `-1`. Keep track of them in a `boolean[]` where `true` means booked. Then print every free seat, in order. For the input `5`, `1`, `3` and `-1` the program prints:

          ```
          Seat 0 is free
          Seat 2 is free
          Seat 4 is free
          ```
