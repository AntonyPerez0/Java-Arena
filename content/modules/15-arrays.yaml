id: arrays
summary: Collections with a fixed size. Creating an array and using its elements, length and loops, arrays of any element type, searching an array, arrays as method parameters and return values, the short way to create one, and when to choose an array or a list.
steps:
  - id: arrays-creating
    slug: creating-an-array
    title: Creating an array
    text: |
      A list grows as you add to it. An **array** is a simpler collection: you say how big it is when you create it, and that size never changes. In return, every place in it exists from the start, ready to use.

      ```java main
      int[] numbers = new int[5];
      numbers[2] = 7;
      numbers[0] = 3;
      System.out.println(numbers[0]);
      System.out.println(numbers[2]);
      System.out.println(numbers[4]);
      ```

      ```output
      3
      7
      0
      ```

      - `int[]` is the type "array of ints". The square brackets make it an array.
      - `new int[5]` creates an array with room for five ints. Their indexes are 0 to 4, as in a list.
      - `numbers[2] = 7;` stores 7 at index 2. There's no `add`: the place is already there, and you assign to it.
      - `numbers[2]` reads the value at index 2, where a list would say `list.get(2)`.

      Index 4 was never given a value, and it holds 0. The array has exactly five places for as long as it exists: there's no way to make it hold a sixth value later.

      ### Default values

      A new array isn't empty: every element starts with a default value. It's 0 for `int`, 0.0 for `double`, `false` for `boolean`, and `null` for `String`. (`null` means "no value here yet".)

      ```java main
      double[] prices = new double[3];
      boolean[] done = new boolean[3];
      String[] names = new String[3];
      System.out.println(prices[0]);
      System.out.println(done[1]);
      System.out.println(names[2]);
      ```

      ```output
      0.0
      false
      null
      ```

      ### An element works like a variable

      Each element behaves like a variable of the element type. You can use its value in a calculation, and change it with `=`, `+=` or `++`. The index can be any whole-number expression, such as a variable:

      ```java main
      int[] goals = new int[3];
      goals[1] = 2;
      goals[1]++;
      goals[0] = goals[1] * 2;
      int last = 2;
      goals[last] += 5;
      System.out.println(goals[0] + " " + goals[1] + " " + goals[2]);
      ```

      ```output
      6 3 5
      ```

      **Your turn:** a parking garage has four levels, numbered 0 to 3. Fill in the blanks: make the array big enough for the four levels, and give level 3 its 20 free spots. Level 2 is never assigned, so it keeps the default value. The program prints:

      ```
      Level 0: 12 free
      Level 1: 5 free
      Level 2: 0 free
      Level 3: 20 free
      ```
    fill: |
      public class Main {
          public static void main(String[] args) {
              int[] freeSpots = new int[[[4]]];
              freeSpots[0] = 12;
              freeSpots[1] = 5;
              freeSpots[[[3]]] = 20;
              System.out.println("Level 0: " + freeSpots[0] + " free");
              System.out.println("Level 1: " + freeSpots[1] + " free");
              System.out.println("Level 2: " + freeSpots[2] + " free");
              System.out.println("Level 3: " + freeSpots[3] + " free");
          }
      }
    hints:
      - "The number in `new int[...]` is how many elements the array has: one for each level."
      - "The levels are 0, 1, 2 and 3, so the size is 4, and the second blank is the index 3."
