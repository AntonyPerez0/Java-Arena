          public static void main(String[] args) {
              int[] primes = [[{2, 3, 5, 7, 11}‖new int[] {2, 3, 5, 7, 11}]];
              System.out.println(primes.length + " primes");
              System.out.println(Arrays.[[toString]](primes));
          }
      }
    hints:
      - "The values go in braces, separated by commas: `{2, 3, 5, 7, 11}`."
      - "The method of `Arrays` that turns an array into text is `toString`."
    more:
      - task: |
          A form stores its answers in an array of Strings, and a question left unanswered is the empty String `""`. Write a method `withoutBlanks(String[] answers)` that returns a **new** array holding only the answers that aren't empty, in the same order. An array can't grow, so count those answers first, and then create an array of exactly that size. The check passes the array `{"red", "", "green", "", "blue"}` and prints what your method returns with `Arrays.toString`:

          ```
          [red, green, blue]
          ```
        seed: |
          import java.util.Arrays;

          public class Main {
              public static void main(String[] args) {
                  String[] answers = {"red", "", "green", "", "blue"};
                  System.out.println(Arrays.toString(withoutBlanks(answers)));
              }

              // Write the withoutBlanks method here.
          }
        solution: |
          import java.util.Arrays;

          public class Main {
              public static void main(String[] args) {
                  String[] answers = {"red", "", "green", "", "blue"};
                  System.out.println(Arrays.toString(withoutBlanks(answers)));
              }

              public static String[] withoutBlanks(String[] answers) {
                  int count = 0;
                  for (String answer : answers) {
                      if (!answer.equals("")) {
                          count++;
                      }
                  }
                  String[] result = new String[count];
                  int next = 0;
                  for (String answer : answers) {
                      if (!answer.equals("")) {
                          result[next] = answer;
                          next++;
                      }
                  }
                  return result;
              }
          }
        hints:
          - "The method starts `public static String[] withoutBlanks(String[] answers) {`. A first loop counts the answers where `!answer.equals(\"\")`, and then `String[] result = new String[count];` makes the new array."
