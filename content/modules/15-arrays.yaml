            message: "Keep the powers in an array: `new int[n]`."
          - pattern: 'for\s*\(\s*int\s+\w+\s*:'
            message: "Print the elements with a for-each loop."
        forbid:
          - pattern: \bArrayList\b
            message: "Use an array for this one, not a list."
