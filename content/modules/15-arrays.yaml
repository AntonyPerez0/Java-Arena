      - task: |
          This program should read a count, fill an array with that many odd numbers (1, 3, 5 and so on), and print them from the last to the first. It crashes. Fix both loops. For the input `4` the program prints:

          ```
          7
          5
          3
          1
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int count = Integer.valueOf(scanner.nextLine());
                  int[] odd = new int[count];
                  for (int i = 0; i <= odd.length; i++) {
                      odd[i] = 2 * i + 1;
                  }
                  for (int i = odd.length; i > 0; i--) {
                      System.out.println(odd[i]);
                  }
              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int count = Integer.valueOf(scanner.nextLine());
                  int[] odd = new int[count];
                  for (int i = 0; i < odd.length; i++) {
                      odd[i] = 2 * i + 1;
                  }
                  for (int i = odd.length - 1; i >= 0; i--) {
                      System.out.println(odd[i]);
                  }
              }
          }
        hints:
          - "The first loop reaches index `odd.length`, one past the last index. It should stop before it: `i < odd.length`."
          - "The last index is `odd.length - 1`, and the first is 0, so the second loop goes from `odd.length - 1` down to `i >= 0`."
        require:
          - pattern: \bodd\s*\[
            min: 2
            message: "Keep both loops working on the array `odd`: one fills it and one prints it."
        tests:
          - stdin: "4"
          - stdin: "1"
            hidden: true
          - stdin: "6"
            hidden: true

  - id: arrays-element-types
    slug: other-element-types
    title: Arrays of other types
    text: |
      The elements can be of any type. The array's type is the element type followed by `[]`: `double[]`, `String[]`, `boolean[]`. Two arrays of the same length can work as a pair, where the same index in each describes the same thing:

      ```java main
      String[] dishes = new String[3];
      double[] prices = new double[3];
      dishes[0] = "Soup";
      prices[0] = 4.5;
      dishes[1] = "Pasta";
      prices[1] = 9.0;
      dishes[2] = "Pie";
      prices[2] = 3.75;
      for (int i = 0; i < dishes.length; i++) {
          System.out.println(dishes[i] + ": " + prices[i]);
      }
      ```

      ```output
      Soup: 4.5
      Pasta: 9.0
      Pie: 3.75
      ```

      All the elements of one array have the same type, and a value of another type doesn't fit:

      ```java error
      public class Main {
          public static void main(String[] args) {
              int[] ages = new int[2];
              ages[0] = "twelve";
          }
      }
      ```

      ```javac
      Main.java:4: error: incompatible types: String cannot be converted to int
              ages[0] = "twelve";
                        ^
      1 error
      ```

      One difference from lists: an array of whole numbers is written with the basic type, `int[]`. A list needs `ArrayList<Integer>`, but an array has no such rule.

      ### Reading values into an array

      When the program is told how many values are coming, it can make an array of exactly that size. Here the first line of input says how many names follow:

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int count = Integer.valueOf(scanner.nextLine());
              String[] guests = new String[count];
              for (int i = 0; i < guests.length; i++) {
                  guests[i] = scanner.nextLine();
              }
              System.out.println("Guest list:");
              for (int i = 0; i < guests.length; i++) {
                  System.out.println((i + 1) + ". " + guests[i]);
              }
          }
      }
      ```

      ```input
      3
      Amira
      Bruno
      Chen
      ```

      ```output
      Guest list:
      1. Amira
      2. Bruno
      3. Chen
      ```

      The size comes from the input, but once the array exists, it can't grow. When a program can't know the count before it starts reading (for example, when it reads until an empty line), a list is the better choice.

      ### Swapping two elements

      To swap two elements, keep one of them aside first. Otherwise its value is gone before it's copied:

      ```java main
      String[] podium = new String[3];
      podium[0] = "Kim";
      podium[1] = "Lea";
      podium[2] = "Max";
      String kept = podium[0];
      podium[0] = podium[1];
      podium[1] = kept;
      for (String name : podium) {
          System.out.println(name);
      }
      ```

      ```output
      Lea
      Kim
      Max
      ```

      Without `kept`, the line `podium[0] = podium[1];` would write over Kim, and both places would end up holding Lea.

      **Your turn:** fill in the blanks. The program reads how many prices follow, then the prices, and prints their total. For the input `3`, `2.5`, `4.0` and `1.25` it prints:

      ```
      Total: 7.75
      ```
