      - task: |
          Read words, one per line, until a word is the same as the one just before it (capitals count). Then print `Said twice: ` and that word. For the input `red`, `green`, `blue` and `blue` the program prints:

          ```
          Said twice: blue
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  String previous = "";

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  String previous = "";
                  while (true) {
                      String word = scanner.nextLine();
                      if (word.equals(previous)) {
                          System.out.println("Said twice: " + word);
                          break;
                      }
                      previous = word;
                  }
              }
          }
        hints:
          - "`previous` keeps the last word. In each round, read a new word and compare it with `previous` before you overwrite it."
          - "`if (word.equals(previous)) { ... break; }`, and after the `if`, `previous = word;`."
        forbid:
          - pattern: \b(word|previous)\s*(==|!=)|(==|!=)\s*(word|previous)\b|(==|!=)\s*""|""\s*(==|!=)
            message: "Compare the words with `equals`: `==` checks whether two strings are the same object, not whether they hold the same text."
