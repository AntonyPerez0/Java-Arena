      - task: |
          Write a method `fileKind(String fileName)` that returns `image` for names that end in `.jpg` or `.png`, `document` for names that end in `.pdf` or `.txt`, and `other` for anything else. Capitals don't matter: `Beach.JPG` is an image. The check runs `System.out.println(fileKind("Beach.JPG"));` and expects:

          ```
          image
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(fileKind("Beach.JPG"));
              }

              // Write the fileKind method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(fileKind("Beach.JPG"));
              }

              public static String fileKind(String fileName) {
                  String name = fileName.toLowerCase();
                  if (name.endsWith(".jpg") || name.endsWith(".png")) {
                      return "image";
                  }
                  if (name.endsWith(".pdf") || name.endsWith(".txt")) {
                      return "document";
                  }
                  return "other";
              }
          }
        hints:
          - "Make the name small first: `String name = fileName.toLowerCase();`. Then `.JPG` becomes `.jpg`."
          - "`if (name.endsWith(\".jpg\") || name.endsWith(\".png\")) { return \"image\"; }`, the same for documents, and `return \"other\";` last."
        require:
          - pattern: \.endsWith\s*\(
            message: "Check the end of the name with `endsWith`."
        tests:
          - call: System.out.println(fileKind("Beach.JPG"));
          - call: System.out.println(fileKind("notes.txt"));
            hidden: true
