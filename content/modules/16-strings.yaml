        solution: |
          public class Main {
              public static void main(String[] args) {
                  String[] lines = {"Lisbon,14", "Oslo,-3", "Rome,11"};
                  System.out.println(coldest(lines));
              }

              public static String coldest(String[] lines) {
                  int lowest = 1000;
                  String city = "";
                  for (String line : lines) {
                      String[] parts = line.split(",");
                      int temperature = Integer.valueOf(parts[1]);
                      if (temperature < lowest) {
                          lowest = temperature;
                          city = parts[0];
                      }
                  }
                  return city + " (" + lowest + ")";
              }
          }
