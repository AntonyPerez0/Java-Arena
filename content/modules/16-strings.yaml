          public class Main {
              public static void main(String[] args) {
                  System.out.println(countWord("The cat saw the other cat", "the"));
              }

              public static int countWord(String text, String word) {
                  int count = 0;
                  for (String part : text.split(" ")) {
                      if (part.equalsIgnoreCase(word)) {
                          count++;
                      }
                  }
                  return count;
              }
          }
