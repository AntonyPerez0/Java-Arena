  - id: strings-characters
    slug: characters
    title: Characters
    text: |
      A string is a row of characters, and each character has an index, counted from 0, just like the elements of a list or an array. `charAt(index)` gives the character at an index:

      | Index | 0 | 1 | 2 | 3 |
      |---|---|---|---|---|
      | `"Java"` | J | a | v | a |

      ```java main
      String word = "Java";
      char first = word.charAt(0);
      char last = word.charAt(word.length() - 1);
      System.out.println(first);
      System.out.println(last);
      ```

      ```output
      J
      a
      ```

      The last index is always `length() - 1`, one less than the length, because counting starts at 0.

      ### The char type

      `charAt` returns a `char`: a type that holds exactly one character. A char is written in **single** quotes, `'a'`, while double quotes make a String, `"a"`. Like `int`, `char` is a primitive type, not an object, so chars are compared with `==`:

      ```java main
      String word = "banana";
      int count = 0;
      for (int i = 0; i < word.length(); i++) {
          char c = word.charAt(i);
          if (c == 'a') {
              count++;
          }
      }
      System.out.println("The letter a appears " + count + " times");
      ```

      ```output
      The letter a appears 3 times
      ```

      This loop is the way to go through a string: the index runs from 0 as long as it's less than `length()`, and `charAt(i)` gives each character in turn. Other characters work the same way: `' '` is a space and `'!'` an exclamation mark.

      A char and a String are different types, even when they hold the same letter, so comparing one with the other doesn't compile:

      ```java error
      public class Main {
          public static void main(String[] args) {
              String word = "cat";
              if (word.charAt(0) == "c") {
                  System.out.println("Starts with c");
              }
          }
      }
      ```

      ```javac
      Main.java:4: error: bad operand types for binary operator '=='
              if (word.charAt(0) == "c") {
                                 ^
        first type:  char
        second type: String
      1 error
      ```

      One more surprise: a char is stored as a number, its character code, so `+` between two chars adds their codes. With a String first, `+` joins as usual:

      ```java main
      String word = "ok";
      System.out.println(word.charAt(0) + word.charAt(1));
      System.out.println("" + word.charAt(0) + word.charAt(1));
      ```

      ```output
      218
      ok
      ```

      ### Past the end

      The indexes of `"cat"` are 0, 1 and 2. Asking for index 3 crashes the program with a `StringIndexOutOfBoundsException`. The usual cause is a loop that uses `<=` where it should use `<`:

      ```java run crash
      public class Main {
          public static void main(String[] args) {
              String word = "cat";
              for (int i = 0; i <= word.length(); i++) {
                  System.out.println(word.charAt(i));
              }
          }
      }
      ```

      ```output
      c
      a
      t
      ```

      ```crash
      Exception in thread "main" java.lang.StringIndexOutOfBoundsException: Index 3 out of bounds for length 3
      	at Main.main(Main.java:5)
      ```

      The message says which index was asked for and how long the string is, and the `at` line points to line 5, the `charAt` call. The loop condition should be `i < word.length()`.

      **Your turn:** fill in the blanks, so the program counts the question marks in a line. For the input `Who? What? Why?` it prints:

      ```
      Questions: 3
      ```
    fill: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              String text = scanner.nextLine();
              int count = 0;
              for (int i = 0; i < text.[[length]](); i++) {
                  if (text.[[charAt]](i) == '?') {
                      count++;
                  }
              }
              System.out.println("Questions: " + count);
          }
      }
    hints:
      - The loop runs as long as `i` is less than the number of characters in `text`.
      - "The character at index `i` is `text.charAt(i)`."
    tests:
      - stdin: Who? What? Why?
      - stdin: No questions here.
        hidden: true
      - stdin: "???"
        hidden: true
    more:
      - task: |
          Write a method `countVowels(String text)` that returns how many vowels (a, e, i, o and u, small or capital) the text has. The check runs `System.out.println(countVowels("Education"));` and expects:

          ```
          5
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(countVowels("Education"));
              }

              // Write the countVowels method here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(countVowels("Education"));
              }

              public static int countVowels(String text) {
                  String lower = text.toLowerCase();
                  int count = 0;
                  for (int i = 0; i < lower.length(); i++) {
                      char c = lower.charAt(i);
                      if (c == 'a' || c == 'e' || c == 'i' || c == 'o' || c == 'u') {
                          count++;
                      }
                  }
                  return count;
              }
          }
        hints:
          - "Make the text small first, `String lower = text.toLowerCase();`, so there are only five vowels to look for."
          - "In the loop, `char c = lower.charAt(i);` and then `if (c == 'a' || c == 'e' || c == 'i' || c == 'o' || c == 'u')`."
        require:
          - pattern: \.charAt\s*\(
            message: "Look at the characters one at a time with `charAt`."
        tests:
          - call: System.out.println(countVowels("Education"));
          - call: System.out.println(countVowels("rhythm"));
            hidden: true
          - call: System.out.println(countVowels("AEIOU aeiou"));
            hidden: true
          - call: System.out.println(countVowels(""));
            hidden: true
          - call: System.out.println(countVowels("Programming in Java"));
            hidden: true
      - task: |
          What does this program print? The loop runs backwards.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  String word = "drawer";
                  String result = "";
                  for (int i = word.length() - 1; i >= 0; i--) {
                      result += word.charAt(i);
                  }
                  System.out.println(result);
                  System.out.println(word.charAt(1) + "" + word.charAt(4));
              }
          }
        hints:
          - The loop starts at the last index, 5, and goes down to 0, adding one character in each round.
          - "`drawer` backwards is `reward`. On the last line, the `\"\"` in the middle makes `+` join the two chars instead of adding their codes."

  - id: strings-parts
    slug: finding-parts
    title: Finding parts of a string
    text: |
      `substring` cuts a piece out of a string. Like every String method, it gives back a new string and leaves the original whole.

      - `substring(start)` gives everything from the index `start` to the end.
      - `substring(start, end)` gives the characters from `start` up to, **but not including**, `end`.

      | Index | 0 | 1 | 2 | 3 | 4 | 5 |
      |---|---|---|---|---|---|---|
      | `"carpet"` | c | a | r | p | e | t |

      ```java main
      String word = "carpet";
      System.out.println(word.substring(3));
      System.out.println(word.substring(0, 3));
      System.out.println(word.substring(1, 4));
      ```

      ```output
      pet
      car
      arp
      ```

      Because the end isn't included, `substring(start, end)` is always `end - start` characters long: `substring(1, 4)` has 3. An index past the end crashes the program with the same `StringIndexOutOfBoundsException` as `charAt`.

      ### Searching in a string

      `indexOf` looks for a piece of text and returns the index where it first starts, or -1 when it isn't there. Together with `substring`, it cuts a string at a certain character, wherever that character happens to be:

      ```java main
      String email = "ada@example.com";
      int at = email.indexOf("@");
      System.out.println(at);
      System.out.println(email.substring(0, at));
      System.out.println(email.substring(at + 1));
      System.out.println(email.indexOf("#"));
      ```

      ```output
      3
      ada
      example.com
      -1
      ```

      Three more methods answer yes-or-no questions with a `boolean`:

      ```java main
      String file = "holiday-photo.jpg";
      System.out.println(file.contains("photo"));
      System.out.println(file.startsWith("holiday"));
      System.out.println(file.endsWith(".png"));
      ```

      ```output
      true
      true
      false
      ```

      All of these count capitals: `"Photo.JPG".endsWith(".jpg")` is `false`. When capitals shouldn't matter, make the text small first: `file.toLowerCase().endsWith(".jpg")`.

      **Your turn:** fill in the numbers, so the program cuts `sun` and `flower` out of `sunflower`. It prints:

      ```
      sun
      flower
      ```
    fill: |
      public class Main {
          public static void main(String[] args) {
              String word = "sunflower";
              System.out.println(word.substring([[0]], [[3]]));
              System.out.println(word.substring([[3]]));
          }
      }
    hints:
      - "`sun` is at the indexes 0, 1 and 2. The end index is the first one that's *not* included."
      - "`flower` starts at index 3 and goes on to the end, so it needs only the start."
    tests:
