        solution: |
          import java.util.ArrayList;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  ArrayList<String> names = new ArrayList<>();
                  ArrayList<String> cities = new ArrayList<>();
                  while (true) {
                      String line = scanner.nextLine();
                      if (line.isEmpty()) {
                          break;
                      }
                      String[] parts = line.split(",");
                      names.add(parts[0]);
                      cities.add(parts[1]);
                  }
                  String wanted = scanner.nextLine();
                  int found = 0;
                  for (int i = 0; i < names.size(); i++) {
                      if (cities.get(i).equals(wanted)) {
                          System.out.println(names.get(i));
                          found++;
                      }
                  }
                  if (found == 0) {
                      System.out.println("Nobody from " + wanted);
                  }
              }
          }
        hints:
          - "The first loop is like the ones in the last step: stop at an empty line, split, and add `parts[0]` to `names` and `parts[1]` to `cities`."
          - "Then read the city to look for, and loop over the indexes: when `cities.get(i).equals(wanted)`, print `names.get(i)`. Count the matches, so that at the end you know whether there were none."
        require:
          - pattern: \.split\s*\(
            message: "Cut each line into its parts with `split`."
          - pattern: \.equals(IgnoreCase)?\s*\(
            message: "Compare the cities with `equals`."
        forbid:
          - pattern: (==|!=)\s*""|""\s*(==|!=)
            message: "Check for the empty line with `isEmpty()` or `equals(\"\")`, not `==`."
          - pattern: \bwanted\s*(==|!=)|(==|!=)\s*wanted\b
            message: "Compare the cities with `equals`, not `==`."
