        solution:
          Player.java: |
            public class Player {
                private String name;
                private int square;

                public Player(String name) {
                    this.name = name;
                    this.square = 1;
                }

                public void move(int squares) {
                    this.square = this.square + squares;
                    if (this.square > 30) {
                        this.square = 30;
                    }
                }

                public void printPosition() {
                    System.out.println(this.name + " is on square " + this.square);
                }
            }
          Main.java: |
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    Player first = new Player(scanner.nextLine());
                    Player second = new Player(scanner.nextLine());
                    boolean firstsTurn = true;
                    while (true) {
                        String line = scanner.nextLine();
                        if (line.equals("end")) {
                            break;
                        }
                        int roll = Integer.valueOf(line);
                        if (firstsTurn) {
                            first.move(roll);
                        } else {
                            second.move(roll);
                        }
                        firstsTurn = !firstsTurn;
                    }
                    first.printPosition();
                    second.printPosition();
                }
            }
