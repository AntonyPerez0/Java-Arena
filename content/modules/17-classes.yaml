  - id: classes-constructor
    slug: constructors
    title: Constructors
    text: |
      A new plant should get its name and height the moment it's created. That's the job of a **constructor**: code in the class that runs when an object is built with `new`, and gives the instance variables their first values.

      ```java run
      public class Main {
          public static void main(String[] args) {
              System.out.println("Start");
              Plant fern = new Plant("fern", 30);
              Plant cactus = new Plant("cactus", 12);
              System.out.println("End");
          }
      }
      // ==== Plant.java ====
      public class Plant {
          private String name;
          private int height;

          public Plant(String name, int height) {
              this.name = name;
              this.height = height;
              System.out.println("Planted a " + this.name + ", " + this.height + " cm");
          }
      }
      ```

      ```output
      Start
      Planted a fern, 30 cm
      Planted a cactus, 12 cm
      End
      ```

      (Constructors don't usually print anything. This one does, so that you can see when it runs: once for each `new`.)

      - A constructor is written like a method, but it has the class's name and no return type, not even `void`: `public Plant(String name, int height)`.
      - Its parameters work like a method's. `new Plant("fern", 30)` gives `"fern"` to `name` and 30 to `height`, in that order.
      - `this` means the object being built. `this.name` is the object's instance variable `name`, while `name` on its own is the parameter. So `this.name = name;` copies the parameter's value into the object. A parameter with the same name as the instance variable it fills is the usual way to write a constructor; module 18 looks at `this` more closely.
      - The parameters disappear when the constructor ends, but the values stored in the instance variables stay with the object for as long as it exists.

      Not every instance variable needs a parameter. The `Lamp` in step 1 is built with only its place, and its constructor starts every lamp off with `this.on = false;`.

      ### When the values don't fit

      A class without any constructor can be built with empty parentheses, as in step 2. Once `Plant` has a constructor that takes a name and a height, Java no longer adds that empty one, and every `new Plant` must give both values, just as a method call must fit the method's parameters:

      ```java error
      public class Main {
          public static void main(String[] args) {
              Plant basil = new Plant();
          }
      }
      // ==== Plant.java ====
      public class Plant {
          private String name;
          private int height;

          public Plant(String name, int height) {
              this.name = name;
              this.height = height;
          }
      }
      ```

      ```javac
      Main.java:3: error: constructor Plant in class Plant cannot be applied to given types;
              Plant basil = new Plant();
                            ^
        required: String,int
        found:    no arguments
        reason: actual and formal argument lists differ in length
      1 error
      ```

      `required` lists the constructor's parameters, and `found` what the `new` gave. With the values the wrong way round, as in `new Plant(30, "basil")`, javac says `incompatible types: int cannot be converted to String`.

      **Your turn:** `Parcel.java` has its instance variables and a method that prints them. Write the constructor, so that `new Parcel("Amir", 1200)` makes a parcel for Amir that weighs 1200 grams. The check runs:

      ```java fragment
      Parcel parcel = new Parcel("Amir", 1200);
      parcel.printInfo();
      ```

      and expects:

      ```
      Parcel for Amir, 1200 g
      ```
    seed:
      Parcel.java: |
        public class Parcel {
            private String recipient;
            private int grams;

            // Write the constructor here.

            public void printInfo() {
                System.out.println("Parcel for " + this.recipient + ", " + this.grams + " g");
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Parcel parcel = new Parcel("Amir", 1200);
                parcel.printInfo();
            }
        }
    solution:
      Parcel.java: |
        public class Parcel {
            private String recipient;
            private int grams;

            public Parcel(String recipient, int grams) {
                this.recipient = recipient;
                this.grams = grams;
            }

            public void printInfo() {
                System.out.println("Parcel for " + this.recipient + ", " + this.grams + " g");
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Parcel parcel = new Parcel("Amir", 1200);
                parcel.printInfo();
            }
        }
    hints:
      - "The constructor has the class's name and no `void`: `public Parcel(String recipient, int grams) {`."
      - "Inside it, store each parameter in its instance variable: `this.recipient = recipient;` and `this.grams = grams;`."
    tests:
      - call: |
          Parcel parcel = new Parcel("Amir", 1200);
          parcel.printInfo();
      - call: |
          Parcel parcel = new Parcel("Sofia", 350);
          parcel.printInfo();
        hidden: true
      - call: |
          Parcel light = new Parcel("Ben", 90);
          Parcel heavy = new Parcel("Kai", 5000);
          heavy.printInfo();
          light.printInfo();
        hidden: true
    more:
      - task: |
          A new water bottle comes full. `WaterBottle.java` has two instance variables, `capacity` and `milliliters` (how much water is in it), and a method `printInfo()`. Write the constructor `WaterBottle(int capacity)`: it stores the capacity and fills the bottle, so `milliliters` starts at the same value. The check runs:

          ```java fragment
          WaterBottle bottle = new WaterBottle(750);
          bottle.printInfo();
          ```

          and expects:

          ```
          750/750 ml
