        hints:
          - "`hall` and `garage` are two separate lamps. Both are turned on, and then only the hall lamp is turned off again."
          - "`spare` is a third lamp. Its place is also `hall`, but it's a different object, so turning it on doesn't change the lamp in `hall`."
      - task: |
          `Poll.java` holds a class for a quick vote. Write `Main`: the first line of input is the question, and every line after it is a vote, `y` or `n`, until the line `end`. Create a Poll for the question, give it each vote with `voteYes()` or `voteNo()`, and at the end call `printResult()`. The poll does the counting, so `Main` needs no counters of its own. For the input `Pizza on Friday?`, `y`, `n`, `y` and `end`, one per line, the program prints:

          ```
          Pizza on Friday?
          Yes 2, no 1
          ```
        seed:
          Main.java: |
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    String question = scanner.nextLine();

                }
            }
          Poll.java: |
            public class Poll {
                private String question;
                private int yes;
                private int no;

                public Poll(String question) {
                    this.question = question;
                    this.yes = 0;
                    this.no = 0;
                }

                public void voteYes() {
                    this.yes = this.yes + 1;
                }

                public void voteNo() {
                    this.no = this.no + 1;
                }

                public void printResult() {
                    System.out.println(this.question);
                    System.out.println("Yes " + this.yes + ", no " + this.no);
                }
            }
        solution:
          Main.java: |
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    String question = scanner.nextLine();
                    Poll poll = new Poll(question);
                    while (true) {
                        String vote = scanner.nextLine();
                        if (vote.equals("end")) {
                            break;
                        }
                        if (vote.equals("y")) {
                            poll.voteYes();
                        } else if (vote.equals("n")) {
                            poll.voteNo();
                        }
                    }
                    poll.printResult();
                }
            }
          Poll.java: |
            public class Poll {
                private String question;
                private int yes;
                private int no;

                public Poll(String question) {
                    this.question = question;
                    this.yes = 0;
                    this.no = 0;
                }

                public void voteYes() {
                    this.yes = this.yes + 1;
                }

                public void voteNo() {
                    this.no = this.no + 1;
                }

                public void printResult() {
                    System.out.println(this.question);
                    System.out.println("Yes " + this.yes + ", no " + this.no);
                }
            }
        hints:
          - "Create the poll before the loop, so the same poll gets every vote: `Poll poll = new Poll(question);`."
          - "In the loop, read a line and `break` at `end`. For `y` call `poll.voteYes();`, for `n` call `poll.voteNo();`. After the loop, `poll.printResult();`."
        require:
          - pattern: \bnew\s+Poll\s*\(
            message: "Create the poll with `new Poll(question)`."
          - pattern: \.voteYes\s*\(\s*\)
            message: "Give the poll each yes vote with `voteYes()`."
          - pattern: \.voteNo\s*\(\s*\)
            message: "Give the poll each no vote with `voteNo()`."
          - pattern: \.printResult\s*\(\s*\)
            message: "Print the result with the poll's `printResult()` method."
        tests:
          - stdin: |
              Pizza on Friday?
              y
              n
              y
              end
          - stdin: |
              Picnic in the rain?
              n
              n
              n
              end
            hidden: true
          - stdin: |
              Any questions?
              end
            hidden: true
          - stdin: |
              Longer breaks?
              y
              y
              n
              y
              y
              end
            hidden: true

  - id: classes-creating
    slug: writing-a-class
    title: Writing a class
    text: |
      Now you write classes of your own. The example in this module is a class for the plants in a garden, where every plant has a name and a height in centimeters.

      ### The class and its file

      A class starts with `public class` and its name, and everything in it goes between its braces:

      ```java fragment
      public class Plant {

      }
      ```

      - A `public class Plant` must be in a file called `Plant.java`: the same name, capitals and all, plus `.java`. That's why `Main` has always been in `Main.java`.
      - Class names start with a capital letter, and so does each new word in them: `Plant`, `GardenBed`, `ArrayList`. Variables and methods start with a small letter.
      - The files of a program go side by side: in the editor as tabs, on your own computer in the same folder.

      ### Instance variables

      The data that every object carries is declared at the top of the class, inside its braces but outside any method:

      ```java fragment
      public class Plant {
          private String name;
          private int height;
      }
      ```

      These are **instance variables** (also called fields). An *instance* is an object made from a class, and each instance gets its own copy of every instance variable: one plant can be a 30 cm fern while another is a 12 cm cactus. An instance variable lives as long as its object does, while a method's own variables disappear when the method ends.

      Everything inside a class is indented one level (4 spaces), just as the lines of a method are indented inside the method.

      ### private

      `private` means that only the code inside the `Plant` class can use the variable. Code in `Main` can't read it or change it:

      ```java error
      public class Main {
          public static void main(String[] args) {
              Plant fern = new Plant();
              fern.height = 30;
          }
      }
      // ==== Plant.java ====
      public class Plant {
          private String name;
          private int height;
      }
      ```

      ```javac
      Main.java:4: error: height has private access in Plant
              fern.height = 30;
                  ^
      1 error
      ```

      Why lock the data away? Because then the class decides what happens to it. When every change to `height` has to go through the class's own methods, the class can make sure that no plant ever gets a height of -20. Code outside the class uses a Plant through its methods, the way you use an ArrayList through `add` and `get` without touching its insides. Hiding the data like this is called **encapsulation**, and in this course instance variables are always `private`.

      ### A class that does nothing yet

      The class above already works as a blueprint: `Plant fern = new Plant();` builds a Plant object. A class without a constructor of its own (that's the next step) can be built with empty parentheses like this, and its number variables start at 0. But this plant can't do anything yet: it has no methods, and nothing outside it can set its name or height. The next steps give it a constructor and methods.

      **Your turn:** in `Bicycle.java`, write the class `Bicycle` with two private instance variables: `brand`, a String, and `gears`, an int. `Main.java` already builds two bicycles, and the program prints:

      ```
      Two bicycles in the shed
      ```
    seed:
      Bicycle.java: |
        public class Bicycle {

        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Bicycle city = new Bicycle();
                Bicycle mountain = new Bicycle();
                System.out.println("Two bicycles in the shed");
            }
        }
    solution:
      Bicycle.java: |
        public class Bicycle {
            private String brand;
            private int gears;
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Bicycle city = new Bicycle();
                Bicycle mountain = new Bicycle();
                System.out.println("Two bicycles in the shed");
            }
        }
    hints:
      - "An instance variable is declared like any other variable, with `private` in front and without a value: `private String brand;`."
      - "Both lines go inside the class's braces, indented one level: `private String brand;` and `private int gears;`."
    require:
      - pattern: \bprivate\s+String\s+brand\s*;
        message: "Declare `brand` as a private String inside the class: `private String brand;`."
      - pattern: \bprivate\s+int\s+gears\s*;
        message: "Declare `gears` as a private int inside the class: `private int gears;`."
    tests:
      - name: The program
    more:
