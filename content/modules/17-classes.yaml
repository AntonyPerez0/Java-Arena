                }
            }
        }
    hints:
      - "Create the lamp with the room's name: `Lamp lamp = new Lamp(room);`."
      - "Then call the methods on it, in order: `lamp.printState();`, `lamp.turnOn();` and `lamp.printState();` again."
    require:
      - pattern: \bnew\s+Lamp\s*\(
        message: "Create the lamp with `new Lamp(room)`."
      - pattern: \.turnOn\s*\(\s*\)
        message: "Turn the lamp on with its `turnOn()` method."
      - pattern: \.printState\s*\(\s*\)
        min: 2
        message: "Print the lamp's state with its `printState()` method, before and after turning it on."
    tests:
