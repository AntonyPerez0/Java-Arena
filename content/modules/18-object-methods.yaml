        solution:
          Scoreboard.java: |
            public class Scoreboard {
                private int home;
                private int away;

                public Scoreboard() {
                    this.home = 0;
                    this.away = 0;
                }

                public void homeScores(int points) {
                    this.home = this.home + points;
                }

                public void awayScores(int points) {
                    this.away = this.away + points;
                }

                public int totalPoints() {
                    return this.home + this.away;
                }

                public String leader() {
                    if (this.home > this.away) {
                        return "home";
                    }
                    if (this.away > this.home) {
                        return "away";
                    }
                    return "tie";
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Scoreboard game = new Scoreboard();
                    game.awayScores(2);
                    System.out.println("Leading: " + game.leader());
                }
            }
        hints:
          - "The method returns a String: `public String leader() {`."
          - "Returning from branches, as in module 11: `if (this.home > this.away) { return \"home\"; }`, the same for the away team, and `return \"tie\";` last."
