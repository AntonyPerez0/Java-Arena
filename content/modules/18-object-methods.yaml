            public Guitar(String model, int strings) {
                this.model = model;
                this.strings = strings;
            }

            // Write the toString method here.
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Guitar guitar = new Guitar("Lark", 6);
                System.out.println(guitar);
            }
        }
    solution:
