        solution:
          ParkingMeter.java: |
            public class ParkingMeter {
                private int paid;

                public ParkingMeter() {
                    this.paid = 0;
                }

                public void insert(int cents) {
                    if (this.paid + cents <= 400) {
                        this.paid = this.paid + cents;
                    }
                }

                public int minutes() {
                    return this.paid / 50 * 15;
                }

                public String toString() {
                    return this.paid + " cents, " + this.minutes() + " minutes";
                }
            }
