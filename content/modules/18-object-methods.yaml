        solution:
          RainLog.java: |
            public class RainLog {
                private int days;
                private int total;
                private int wettest;

                public RainLog() {
                    this.days = 0;
                    this.total = 0;
                    this.wettest = 0;
                }

                public void add(int mm) {
                    this.days++;
                    this.total = this.total + mm;
                    if (mm > this.wettest) {
                        this.wettest = mm;
                    }
                }

                public int days() {
                    return this.days;
                }

                public int total() {
                    return this.total;
                }

                public double average() {
