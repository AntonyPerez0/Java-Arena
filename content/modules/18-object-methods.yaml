                    }
                    System.out.println("Your change: " + machine.change() + " cents");
                }
            }
        solution:
          VendingMachine.java: |
            public class VendingMachine {
                private int credit;

                public VendingMachine() {
                    this.credit = 0;
                }

                public void insert(int cents) {
                    this.credit = this.credit + cents;
                }

                public boolean buy(int price) {
                    if (this.credit >= price) {
                        this.credit = this.credit - price;
                        return true;
                    }
                    return false;
                }

                public int change() {
                    int left = this.credit;
                    this.credit = 0;
                    return left;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    VendingMachine machine = new VendingMachine();
                    machine.insert(200);
                    if (machine.buy(150)) {
                        System.out.println("Enjoy your snack!");
                    }
                    System.out.println("Your change: " + machine.change() + " cents");
                }
            }
        hints:
          - "`buy` returns a boolean: `if (this.credit >= price) { ... return true; }`, and `return false;` after it."
          - "`change()` has to remember the credit before setting it to 0: `int left = this.credit;`, then `this.credit = 0;`, then `return left;`"
