        solution:
          Chore.java: |
            public class Chore {
                private String title;
                private boolean done;

                public Chore(String title) {
                    this.title = title;
                    this.done = false;
                }

                public void markDone() {
                    this.done = true;
                }

                public String toString() {
                    if (this.done) {
                        return "[x] " + this.title;
                    }
                    return "[ ] " + this.title;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Chore chore = new Chore("Water the plants");
                    System.out.println(chore);
                    chore.markDone();
                    System.out.println(chore);
                }
            }
        hints:
