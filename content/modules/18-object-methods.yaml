  - id: object-methods-bigger-class
    slug: a-class-that-counts
    title: A class that keeps statistics
    text: |
      Objects are good at remembering. A class can collect numbers one at a time and answer questions about them whenever it's asked: how many there have been, their total, their average, the largest. This log of bike trips does that:

      ```java run
      public class Main {
          public static void main(String[] args) {
              TripLog log = new TripLog();
              log.add(12);
              log.add(40);
              log.add(5);
              System.out.println("Trips: " + log.tripCount());
              System.out.println("Total: " + log.totalKm() + " km");
              System.out.println("Longest: " + log.longestKm() + " km");
              System.out.println("Average: " + log.averageKm() + " km");
          }
      }
      // ==== TripLog.java ====
      public class TripLog {
          private int count;
          private int total;
          private int longest;

          public TripLog() {
              this.count = 0;
              this.total = 0;
              this.longest = 0;
          }

          public void add(int km) {
              this.count++;
              this.total = this.total + km;
              if (km > this.longest) {
                  this.longest = km;
              }
          }

          public int tripCount() {
              return this.count;
          }

          public int totalKm() {
              return this.total;
          }

          public int longestKm() {
              return this.longest;
          }

          public double averageKm() {
              if (this.count == 0) {
                  return 0.0;
              }
              return (double) this.total / this.count;
          }
      }
      ```

      ```output
      Trips: 3
      Total: 57 km
      Longest: 40 km
      Average: 19.0 km
      ```

      - The log doesn't keep the trips themselves, only what it needs for its answers: how many trips, their sum, and the longest so far. Each `add` updates all three. (Later in the course, an object gets a list of its own.)
      - The average isn't stored: `averageKm()` works it out when it's asked, from the count and the total. `(double)` turns the total into a `double` before the division, so the decimals aren't lost (module 4).
      - `averageKm()` checks for an empty log first. With no trips there's no average, and the method returns 0.0 instead of dividing by zero.

      The class does the bookkeeping, and `main` only gives it numbers and asks questions. The same class works whether the numbers are written in the code, as here, or typed in by a user.

      **Your turn:** a `RainLog` collects the rainfall of each day, in millimeters. Write its methods: `add(int mm)` records one day's rain, `days()` returns how many days have been recorded, and `total()` returns all the rain together. The instance variables are ready. The check records 4, 0 and 11 mm, and prints the days and the total:

      ```
      3 days, 15 mm
      ```
    seed:
      RainLog.java: |
        public class RainLog {
            private int days;
            private int total;

            public RainLog() {
                this.days = 0;
                this.total = 0;
            }

            // Write add, days and total here.
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                RainLog log = new RainLog();
                log.add(4);
                log.add(0);
                log.add(11);
                System.out.println(log.days() + " days, " + log.total() + " mm");
            }
        }
    solution:
