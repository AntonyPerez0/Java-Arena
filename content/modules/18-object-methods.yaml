        public class Recipe {
            private String name;
            private int minutes;

            public Recipe(String name, int minutes) {
                name = name;
                minutes = minutes;
            }

            public String toString() {
                return this.name + " (" + this.minutes + " min)";
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Recipe recipe = new Recipe("Pancakes", 20);
                System.out.println(recipe);
            }
        }
