          A `VendingMachine` keeps the money put in as credit, in cents. Write two methods. `buy(int price)` takes the price off the credit and returns `true` when the credit covers the price; otherwise it returns `false`, and the credit stays as it was. `change()` returns the credit that's left and sets the credit to 0, as when the machine gives the coins back. The check puts in 200 cents, tries to buy two things that cost 150 cents, and asks for change twice:

          ```
          true
          false
          50
          0
          ```
