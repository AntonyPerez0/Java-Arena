                  oven.heat(80);
                  String note = "Was at " + oven;
                  oven.turnOff();
                  System.out.println(note);
                  System.out.println("Now " + oven);
              }
          }
          // ==== Oven.java ====
          public class Oven {
              private int degrees;

              public Oven() {
                  this.degrees = 0;
              }

              public void heat(int amount) {
                  this.degrees = this.degrees + amount;
              }

              public void turnOff() {
                  this.degrees = 0;
              }

              public String toString() {
                  if (this.degrees == 0) {
                      return "off";
                  }
                  return this.degrees + " degrees";
              }
          }
        hints:
          - "`\"Was at \" + oven` calls `toString` right there, while the oven is at 180 degrees. The String stored in `note` doesn't change when the oven does."
          - "The first line is printed before any heating, and the last one after `turnOff()`: both times `toString` returns `off`."

  - id: object-methods-this
    slug: this-and-parameters
    title: Parameters and this
    text: |
      Since module 17 your constructors have set their instance variables like this:

      ```java fragment
      public Guest(String name, int nights) {
          this.name = name;
          this.nights = nights;
      }
      ```

      As module 17 said, `this` is the object itself: in a constructor, the object being built, and in a method, the object the method was called on. This step takes a closer look at why the `this.` matters.

      Inside this constructor there are two variables called `name`: the parameter, and the object's instance variable. A plain `name` always means the parameter, because a parameter hides an instance variable of the same name. `this.name` is the way past it to the object's own variable, so the line copies the parameter's value into the object.

      ### Without this

      Leave out `this.`, and both sides of `name = name;` mean the parameter. The line copies the parameter into itself, and the instance variable is never set. It keeps the value every instance variable starts with: 0 for a number, `false` for a boolean, and `null` for a String, which means *no String at all*:

      ```java run
      public class Main {
          public static void main(String[] args) {
              Guest guest = new Guest("Amara", 3);
              System.out.println(guest);
          }
      }
      // ==== Guest.java ====
      public class Guest {
          private String name;
          private int nights;

          public Guest(String name, int nights) {
              name = name;
              nights = nights;
          }

          public String toString() {
              return this.name + ", " + this.nights + " nights";
          }
      }
      ```

      ```output
      null, 0 nights
      ```

      Java doesn't complain: `name = name;` is allowed, it just does nothing useful. When an object shows `null` or 0 where you expected a value, a missing `this.` is the first thing to look for.

      ### Methods with parameters

      The same goes for every method whose parameter has the name of an instance variable. Methods that change an object often get the new value as a parameter:

      ```java run
      public class Main {
          public static void main(String[] args) {
              Guest guest = new Guest("Amara", 3);
              guest.extend(2);
              guest.rename("Amara Obi");
              System.out.println(guest);
          }
      }
      // ==== Guest.java ====
      public class Guest {
          private String name;
          private int nights;

          public Guest(String name, int nights) {
              this.name = name;
              this.nights = nights;
          }

          public void extend(int nights) {
              this.nights = this.nights + nights;
          }

          public void rename(String newName) {
              name = newName;
          }

          public String toString() {
              return this.name + ", " + this.nights + " nights";
          }
      }
      ```

      ```output
      Amara Obi, 5 nights
      ```

      - In `extend`, `this.nights` is the guest's nights so far, and `nights` is the parameter: the nights to add.
      - In `rename` the parameter has another name, so `name` can only mean the instance variable, and `this.` isn't needed. Many programmers write it anyway, and so does this course: with `this.` in front, it's always clear which variables belong to the object.

      **Your turn:** this program should print `Pancakes (20 min)`, but it prints `null (0 min)`. Fix the constructor of `Recipe`. The check creates `new Recipe("Pancakes", 20)` and prints it:

      ```
      Pancakes (20 min)
      ```
    seed:
