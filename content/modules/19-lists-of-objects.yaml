        solution:
          Crop.java: |
            public class Crop {
                private String name;
                private int kilos;

                public Crop(String name, int kilos) {
                    this.name = name;
                    this.kilos = kilos;
                }

                public String getName() {
                    return this.name;
                }

                public int getKilos() {
                    return this.kilos;
                }

                public String toString() {
                    return this.name + " (" + this.kilos + " kg)";
                }
            }
          Main.java: |
            import java.util.ArrayList;
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    ArrayList<Crop> crops = new ArrayList<>();

                    while (true) {
                        String name = scanner.nextLine();
                        if (name.isEmpty()) {
                            break;
                        }
                        int kilos = Integer.valueOf(scanner.nextLine());
                        crops.add(new Crop(name, kilos));
                    }

                    if (crops.isEmpty()) {
                        System.out.println("No crops.");
                        return;
                    }

                    System.out.println("10 kg or more:");
                    int total = 0;
                    Crop best = crops.get(0);
                    for (Crop crop : crops) {
                        if (crop.getKilos() >= 10) {
                            System.out.println(crop);
                        }
                        total += crop.getKilos();
                        if (crop.getKilos() > best.getKilos()) {
                            best = crop;
                        }
                    }
                    System.out.println("Total: " + total + " kg");
                    System.out.println("Best: " + best);
                }
            }
        hints:
          - "`Crop` needs `private String name;` and `private int kilos;`, a constructor `public Crop(String name, int kilos)`, a getter `getKilos()` and `toString()`."
          - "In `main`: the reading loop, then `if (crops.isEmpty())` for `No crops.`. One for-each loop can do the rest: print the crops of 10 kilos or more, add up the kilos, and keep the heaviest crop so far, starting from `crops.get(0)`."
