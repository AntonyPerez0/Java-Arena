      - task: |
          A program to end the module, with a class of your own. First write `Crop`: a crop has a name and a weight in kilos, kept in private object variables, and it prints like `potatoes (42 kg)`. Then write `main`. Read crops, a name and then the kilos, until the name is an empty line. Then print:

          - `10 kg or more:` and then every crop of at least 10 kilos, one per line;
          - `Total: ` with the kilos of all the crops added up, and ` kg`;
          - `Best: ` and the heaviest crop (the first of them, if two weigh the same).

          If no crops were entered, print only `No crops.` For the input `potatoes`, `42`, `beans`, `3`, `carrots`, `12` and an empty line, the program prints:

          ```
          10 kg or more:
          potatoes (42 kg)
          carrots (12 kg)
          Total: 57 kg
          Best: potatoes (42 kg)
          ```
