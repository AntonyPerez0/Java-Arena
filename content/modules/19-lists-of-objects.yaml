        import java.util.ArrayList;

        public class Main {
            public static void main(String[] args) {
                ArrayList<Swimmer> swimmers = new ArrayList<>();
                swimmers.add(new Swimmer("Ines", 71));
                swimmers.add(new Swimmer("Tom", 64));
                swimmers.add(new Swimmer("Mia", 68));
                System.out.println(fastest(swimmers));
            }

            public static Swimmer fastest(ArrayList<Swimmer> swimmers) {
                Swimmer best = swimmers.get(0);
                for (Swimmer swimmer : swimmers) {
                    if (swimmer.getSeconds() < best.getSeconds()) {
                        best = swimmer;
                    }
                }
                return best;
            }
        }
