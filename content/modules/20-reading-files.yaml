                        if (flight.getDelay() > latest.getDelay()) {
                            latest = flight;
                        }
                    }
                    System.out.println("Flights: " + flights.size());
                    System.out.println("Over 30 minutes late: " + veryLate);
                    System.out.println("Latest: " + latest);
                }
