  - id: reading-files-name-from-user
    slug: a-file-chosen-by-the-user
    title: A file chosen by the user
    text: |
      A program is more useful when the user can pick the file. It then needs two Scanners: one for the keyboard and one for the file, each with a name of its own:

      ```file shopping.txt
      apples
      bread
      coffee
      ```

      ```java run
      import java.nio.file.Paths;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println("Which file?");
              String fileName = scanner.nextLine();

              try (Scanner fileScanner = new Scanner(Paths.get(fileName))) {
                  while (fileScanner.hasNextLine()) {
                      System.out.println(fileScanner.nextLine());
                  }
              } catch (Exception e) {
                  System.out.println("Error: " + e.getMessage());
              }
          }
      }
      ```

      ```input
      shopping.txt
      ```

      ```output
      Which file?
      apples
      bread
      coffee
      ```

      - `scanner` reads the keyboard, and `fileScanner` reads the file. Mixing them up is an easy slip: `scanner.nextLine()` inside the loop would read the keyboard, not the file.
      - `Paths.get(fileName)` takes any String, here the name the user typed.
      - A name that doesn't exist, such as `shoping.txt`, ends up in the `catch` block, and the program prints `Error: shoping.txt`.
      - The keyboard Scanner isn't put in a `try (...)`. Closing it would close the keyboard input as well, and nothing more could be read from it.

      **Your turn:** the program reads a file name and prints how many lines that file has. Fill in the blanks. For the input `monday.txt` and the files shown below, it prints:

      ```
      Which file?
      monday.txt: 3 lines
      ```
    fill: |
      import java.nio.file.Paths;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println("Which file?");
              String fileName = scanner.nextLine();
              int lines = 0;
              try (Scanner fileScanner = new Scanner(Paths.get([[fileName]]))) {
                  while ([[fileScanner]].hasNextLine()) {
                      fileScanner.nextLine();
                      lines++;
                  }
                  System.out.println(fileName + ": " + lines + " lines");
              } catch (Exception e) {
                  System.out.println("Error: " + e.getMessage());
              }
          }
      }
    hints:
      - "The file to open is the one the user named: the variable `fileName`, without quotes."
      - "The loop asks the file's Scanner, `fileScanner`, whether it has lines left."
