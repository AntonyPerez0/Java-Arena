                public static int readRecipes(String fileName, ArrayList<Recipe> recipes) {
                    int skipped = 0;
                    try (Scanner scanner = new Scanner(Paths.get(fileName))) {
                        while (scanner.hasNextLine()) {
                            String[] parts = scanner.nextLine().split(",");
                            if (parts.length < 2) {
                                skipped++;
                                continue;
                            }
                            recipes.add(new Recipe(parts[0], Integer.valueOf(parts[1])));
                        }
                    } catch (Exception e) {
                        System.out.println("Error: " + e.getMessage());
                        return 0;
                    }
                    return skipped;
                }
            }
