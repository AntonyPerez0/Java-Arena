                  while (scanner.hasNextLine()) {
                      String line = scanner.nextLine();
                      int minutes = Integer.[[valueOf‖parseInt]](line);
                      total += minutes;
                      calls++;
                  }
                  System.out.println("Total: " + total + " minutes");
                  System.out.println("Average: " + ((double) total / [[calls]]) + " minutes");
              } catch (Exception e) {
                  System.out.println("Error: " + e.getMessage());
              }
          }
      }
    hints:
      - "A line becomes an `int` with `Integer.valueOf(line)`."
      - "The average is the total divided by the number of calls, `calls`."
