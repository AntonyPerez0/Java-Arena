          The file `queue.txt` lists the people in a queue, one name per line, from the front of the queue to the back. Print how many people are in the queue, who is first and who is last. The file has at least one name. For the file shown below, the program prints:

          ```
          In the queue: 4
          First: Oona
          Last: Tariq
          ```
