id: reading-files
summary: Reading data from files. Reading input until it ends, files, folders and paths, reading a file line by line with a Scanner, what try and catch do when a file is missing, letting the user choose the file, and searching files, adding up numbers, splitting records and creating objects from the lines of a file. The end of MOOC part 4.
steps:
  - id: reading-files-keyboard
    slug: reading-until-end
    title: Reading until the input ends
    text: |
      This module is about reading data from files. A program reads a file one line at a time, much as it reads what a user types, so it starts at the keyboard.

      Module 19 read input in a `while (true)` loop that stops at a signal, such as an empty line: read a line, `break` if it's the signal, and only then use it. This step adds two more ways to know when to stop.

      ### Until the input ends

      A Scanner's `hasNextLine()` tells whether there's another line to read. It's `true` while there is one, and `false` once the input has ended, so a loop can read every line without waiting for a signal:

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int count = 0;
              while (scanner.hasNextLine()) {
                  String line = scanner.nextLine();
                  count++;
                  System.out.println(count + ": " + line);
              }
              System.out.println("Lines: " + count);
          }
      }
      ```

      ```input
      red
      green
      blue
      ```

      ```output
      1: red
      2: green
      3: blue
      Lines: 3
      ```

      - `hasNextLine()` only looks. `nextLine()` then reads the line, so the next round sees the line after it.
      - An empty line is a line too: `hasNextLine()` is `true` for it, and `nextLine()` gives `""`.
      - In the checks on this site, the input ends after its last line. A person at a keyboard has no natural end, which is why keyboard programs usually wait for a stop signal instead. (In a terminal, Ctrl+D ends the input, or Ctrl+Z and then Enter on Windows.)

      A file does have an end, and this loop is exactly how the next steps read one.

      ### A stop word in any capitals

      A stop word typed by a person may come as `end`, `End` or `END`. `equalsIgnoreCase` from module 16 accepts all of them:

      ```java fragment
      String line = scanner.nextLine();
      if (line.equalsIgnoreCase("end")) {
          break;
      }
      ```

      **Your turn:** the program reads a letter until its input ends, and prints how many lines it has and how many of them are empty (the gaps between paragraphs). Fill in the blanks. For the input shown below, it prints:

      ```
      Lines: 5
      Empty lines: 2
      ```
    fill: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int lines = 0;
              int empty = 0;
              while (scanner.[[hasNextLine]]()) {
                  String line = scanner.nextLine();
                  lines++;
                  if ([[line.isEmpty()‖line.equals("")]]) {
                      empty++;
                  }
              }
              System.out.println("Lines: " + lines);
              System.out.println("Empty lines: " + empty);
          }
      }
    hints:
      - "The loop runs while there's another line to read: `hasNextLine`."
      - "The second blank checks whether the line is empty: `line.isEmpty()`."
    tests:
      - stdin: "Dear Mia,\n\nthe garden is in bloom.\n\nLeo\n"
      - stdin: "Hello\n"
        hidden: true
      - stdin: "One\n\n\nTwo\nThree\n\n"
        hidden: true
    more:
      - task: |
          Read words until the stop word `end`, which may be typed in any capitals, such as `End` or `END`. Print each word in capital letters with `!` after it, and at the end the number of words, not counting the stop word. For the input `hello`, `world`, `End`, the program prints:

          ```
          HELLO!
          WORLD!
          Words: 2
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int words = 0;
                  while (true) {
                      String word = scanner.nextLine();
                      if (word.equalsIgnoreCase("end")) {
                          break;
                      }
                      words++;
                      System.out.println(word.toUpperCase() + "!");
                  }
                  System.out.println("Words: " + words);
              }
          }
        hints:
          - "`word.equalsIgnoreCase(\"end\")` is true for `end`, `End`, `END` and every other mix of capitals."
          - "`word.toUpperCase()` gives the word in capitals. Check for the stop word before you print or count."
        tests:
          - stdin: "hello\nworld\nEnd\n"
          - stdin: "quiet\nEND\n"
            hidden: true
          - stdin: "a\nbee\nsea\nend\nextra\n"
            hidden: true
          - stdin: "eNd\n"
            hidden: true
      - task: |
          A traffic counter types a line for each vehicle that passes: `car`, `bike` or `bus`. Read the lines until the input ends, with `hasNextLine()`, and print how many vehicles of each kind passed. For the input shown below, the program prints:

          ```
          Cars: 3
          Bikes: 2
          Buses: 1
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int cars = 0;
                  int bikes = 0;
                  int buses = 0;
                  while (scanner.hasNextLine()) {
                      String vehicle = scanner.nextLine();
                      if (vehicle.equals("car")) {
                          cars++;
                      } else if (vehicle.equals("bike")) {
                          bikes++;
                      } else if (vehicle.equals("bus")) {
                          buses++;
                      }
                  }
                  System.out.println("Cars: " + cars);
                  System.out.println("Bikes: " + bikes);
                  System.out.println("Buses: " + buses);
              }
          }
        hints:
          - "One counter for each kind, all made before the loop and starting at 0."
          - "In the loop, read the line and compare it with `equals`: `if (vehicle.equals(\"car\")) { cars++; } else if ...`."
        require:
          - pattern: \.hasNextLine\s*\(
            message: "Read until the input ends with `hasNextLine()`."
        tests:
          - stdin: "car\nbike\ncar\nbus\nbike\ncar\n"
          - stdin: "bus\n"
            hidden: true
          - stdin: "bike\nbike\nbike\ncar\n"
            hidden: true

  - id: reading-files-files
    slug: files-and-folders
    title: Files and folders
    text: |
      Everything a program keeps in its variables is gone when it ends. Data that has to last, such as contacts, high scores or a year of measurements, is kept in **files**.

      - A **file** is a piece of data stored under a name: a photo, a song, a document, a program. This module reads **text files**, which hold plain text in lines. Any text editor can open and change them, and your `.java` files are text files too.
      - The end of a file's name, such as `.txt`, `.csv` or `.java`, is its **extension**. It tells what kind of data the file holds, and it's part of the name: `scores` and `scores.txt` are two different names. Windows and macOS can hide extensions when they list files, but the extension is still there.
      - A **folder** (also called a directory) holds files and other folders. A file's **path** names the folders on the way to it: `school/biology/cells.txt` is the file `cells.txt` in the folder `biology`, which is in the folder `school`. Windows writes paths with `\` instead of `/`.

      ### Where does the program look?

      When a program opens a file by its name alone, such as `plants.txt`, Java looks for it in the program's **working folder** (or working directory): the folder the program runs in.

      - **On your own computer**, when you run a project from an editor such as NetBeans, IntelliJ IDEA or VS Code, the working folder is usually the project's main folder, the one that holds the `src` folder. A file your program reads goes there, next to `src`, not inside it.
      - **On Java Arena** there's no project folder of your own. Instead, each challenge that reads files provides them: the task shows each file with its name and contents, and the check puts the files in your program's working folder before it runs, just like files next to a program on a computer. **Run with my input** gets the same files. Hidden tests give files with other contents, so the program has to really read them.

      ### A first look

      This program reads the file `plants.txt` and prints a line for each plant in it:

      ```file plants.txt
      basil
      mint
      rosemary
      ```

      ```java run
      import java.nio.file.Paths;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              try (Scanner scanner = new Scanner(Paths.get("plants.txt"))) {
                  while (scanner.hasNextLine()) {
                      String line = scanner.nextLine();
                      System.out.println("Water the " + line);
                  }
              } catch (Exception e) {
                  System.out.println("Error: " + e.getMessage());
              }
          }
      }
      ```

      ```output
      Water the basil
      Water the mint
      Water the rosemary
      ```

      The next steps go through this program part by part. For now, find the file's name in `Paths.get("plants.txt")`: that's where the program says which file to read. Put another name there, and the same program reads another file.

      **Your turn:** this challenge gives the file `recipe.txt`, shown below. Fill in its name, so the program prints each line of the recipe after a dash. For the file shown, it prints:

      ```
      - 2 eggs
      - 1 cup of milk
      - 1 cup of flour
      ```
    fill: |
      import java.nio.file.Paths;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              try (Scanner scanner = new Scanner(Paths.get("[[recipe.txt]]"))) {
                  while (scanner.hasNextLine()) {
                      String line = scanner.nextLine();
                      System.out.println("- " + line);
                  }
              } catch (Exception e) {
                  System.out.println("Error: " + e.getMessage());
              }
          }
      }
    hints:
      - The task shows the file's name above its contents.
      - "The whole name goes between the quotes, extension included: `recipe.txt`."
    tests:
      - files:
          recipe.txt: |
            2 eggs
            1 cup of milk
            1 cup of flour
      - files:
          recipe.txt: |
            200 g of rice
            1 onion
            2 cups of water
            salt
        hidden: true
    more:
      - task: |
          This program should print every bird in the file `birds.txt` after `Seen: `, but it prints `Error: birds` instead. Fix it. For the file shown below, it prints:

          ```
          Seen: robin
          Seen: magpie
          Seen: blue tit
          ```
