      - task: |
          A parcel locker at a station has a number of compartments, each for one parcel. Write the class `ParcelLocker`:

          - `ParcelLocker(int compartments)` makes an empty locker with that many compartments.
          - `free()` returns how many compartments are empty.
          - `store()` puts a parcel in an empty compartment and returns `true`. When no compartment is free, it returns `false` and nothing changes. Use `free()` to check.
          - `pickUp()` takes a parcel out. When the locker is empty, nothing changes.
          - `toString()` returns how many compartments are in use, as in the output below.

          Decide the instance variables yourself: what must a locker remember? The check makes a locker of 2 compartments, tries to store three parcels (printing what `store()` returns each time), prints the locker, picks up a parcel and prints `free()`:

          ```
          true
          true
          false
          2 of 2 compartments in use
          1
          ```
        seed:
          ParcelLocker.java: |
            public class ParcelLocker {

            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    ParcelLocker locker = new ParcelLocker(2);
                    System.out.println(locker.store());
                    System.out.println(locker.store());
                    System.out.println(locker.store());
                    System.out.println(locker);
                    locker.pickUp();
                    System.out.println(locker.free());
                }
            }
        solution:
          ParcelLocker.java: |
            public class ParcelLocker {
                private int compartments;
                private int parcels;

                public ParcelLocker(int compartments) {
                    this.compartments = compartments;
                    this.parcels = 0;
                }

                public int free() {
                    return this.compartments - this.parcels;
                }

                public boolean store() {
                    if (this.free() == 0) {
                        return false;
                    }
                    this.parcels = this.parcels + 1;
                    return true;
                }

                public void pickUp() {
                    if (this.parcels > 0) {
                        this.parcels = this.parcels - 1;
                    }
                }

                public String toString() {
                    return this.parcels + " of " + this.compartments + " compartments in use";
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    ParcelLocker locker = new ParcelLocker(2);
                    System.out.println(locker.store());
                    System.out.println(locker.store());
                    System.out.println(locker.store());
                    System.out.println(locker);
                    locker.pickUp();
                    System.out.println(locker.free());
                }
            }
        hints:
          - "A locker must remember how many compartments it has and how many parcels are in it. The free compartments follow from those two, so `free()` works them out: `return this.compartments - this.parcels;`."
          - "`store()` starts with `if (this.free() == 0) { return false; }`. After that there's room, so it adds a parcel and returns `true`. `pickUp()` takes one off only when there's at least one."
        require:
          - pattern: \bfree\s*\(\s*\)
            min: 3
            message: "Write `free()`, and let `store()` call it to check for an empty compartment."
        forbid:
          - pattern: \bprivate\s+int\s+free\b
            message: "The free compartments follow from the other two numbers: work them out in `free()` instead of storing them."
        tests:
          - call: |
              ParcelLocker locker = new ParcelLocker(2);
              System.out.println(locker.store());
              System.out.println(locker.store());
              System.out.println(locker.store());
              System.out.println(locker);
              locker.pickUp();
              System.out.println(locker.free());
          - call: |
              ParcelLocker locker = new ParcelLocker(4);
              System.out.println(locker);
              System.out.println(locker.free());
              locker.pickUp();
              System.out.println(locker.free());
              System.out.println(locker.store());
              System.out.println(locker);
            hidden: true
          - call: |
              ParcelLocker locker = new ParcelLocker(1);
              System.out.println(locker.store());
              System.out.println(locker.store());
              locker.pickUp();
              locker.pickUp();
              System.out.println(locker.store());
              System.out.println(locker);
            hidden: true

  - id: class-design-constructors
    slug: several-constructors
    title: Several constructors
    text: |
      Some objects are nearly always made the same way. At a café, most coffee orders are for a medium cup, so writing `"medium"` in every order gets tiresome. A class can have more than one constructor, and `new` picks the one that fits:

      ```java run
      public class Main {
          public static void main(String[] args) {
              CoffeeOrder first = new CoffeeOrder("latte");
              CoffeeOrder second = new CoffeeOrder("mocha", "large");
              System.out.println(first);
              System.out.println(second);
          }
      }
      // ==== CoffeeOrder.java ====
      public class CoffeeOrder {
          private String drink;
          private String size;

          public CoffeeOrder(String drink) {
              this.drink = drink;
              this.size = "medium";
          }

          public CoffeeOrder(String drink, String size) {
              this.drink = drink;
              this.size = size;
          }

          public String toString() {
              return this.size + " " + this.drink;
          }
      }
      ```

      ```output
      medium latte
      large mocha
      ```

      - Both constructors have the class's name, but different parameters. Constructors like these are called **overloaded** constructors.
      - Java picks the constructor whose parameters fit the values in `new`. `new CoffeeOrder("latte")` gives one String, so it runs the first constructor. `new CoffeeOrder("mocha", "large")` gives two, so it runs the second. Values that fit no constructor, as in `new CoffeeOrder(2)`, don't compile.
      - The first constructor fills in a **default value**: the size used when the order doesn't say one.

      ### A constructor without parameters

      Module 17 showed that Java adds a default constructor, without parameters, only to a class that has no constructor of its own. `CoffeeOrder` has two, so `new CoffeeOrder()` doesn't compile. If the café wants a quick way to order "the usual", the class needs a third constructor, written out:

      ```java fragment
      public CoffeeOrder() {
          this.drink = "filter coffee";
          this.size = "medium";
      }
      ```

      A class can have as many constructors as it needs, in any order.

      ### What makes constructors different

      Constructors must differ in their **parameter types**: in the number of parameters, in their types, or in the order of the types. The parameter names don't count. Say the café wants a constructor for a drink and a kind of milk. It takes two Strings, just like the one for a drink and a size, so `new CoffeeOrder("tea", "oat")` couldn't say which one it meant, and javac doesn't allow it:

      ```java error
      public class Main {
          public static void main(String[] args) {
              CoffeeOrder order = new CoffeeOrder("tea", "oat");
          }
      }
      // ==== CoffeeOrder.java ====
      public class CoffeeOrder {
          private String drink;
          private String size;
          private String milk;

          public CoffeeOrder(String drink, String size) {
              this.drink = drink;
              this.size = size;
              this.milk = "none";
          }

          public CoffeeOrder(String drink, String milk) {
              this.drink = drink;
              this.size = "medium";
              this.milk = milk;
          }
      }
      ```

      ```javac
      CoffeeOrder.java:12: error: constructor CoffeeOrder(String,String) is already defined in class CoffeeOrder
          public CoffeeOrder(String drink, String milk) {
                 ^
      1 error
      ```

      `CoffeeOrder(String,String)` is the constructor as javac sees it: only the types, no names. A constructor for a drink, a size and a milk, `CoffeeOrder(String drink, String size, String milk)`, would be fine, since it takes three values.

