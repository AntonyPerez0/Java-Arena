id: class-design
summary: Designing classes of your own. Turning a program of plain variables into objects, deciding a class's instance variables, constructor and methods from a description, several constructors for one class, one constructor calling another with `this(...)`, and methods with the same name. The start of MOOC part 5.
steps:
  - id: class-design-objects
    slug: from-variables-to-objects
    title: Turning a program into objects
    text: |
      This module is about designing classes: deciding what a class should hold and do, and giving it several constructors, or several methods of the same name. It starts with why a class of your own is worth writing at all.

      ### A program of plain variables

      Here's a program that follows two people's steps for a day, written the way you'd have written it before module 17. The goal is 10000 steps a day.

      ```java main
      String firstName = "Noor";
      int firstSteps = 0;
      String secondName = "Theo";
      int secondSteps = 0;

      firstSteps = firstSteps + 6200;
      secondSteps = secondSteps + 3100;
      firstSteps = firstSteps + 4500;

      if (firstSteps >= 10000) {
          System.out.println(firstName + ": " + firstSteps + " steps, goal reached");
      } else {
          System.out.println(firstName + ": " + firstSteps + " steps");
      }
      if (secondSteps >= 10000) {
          System.out.println(secondName + ": " + secondSteps + " steps, goal reached");
      } else {
          System.out.println(secondName + ": " + secondSteps + " steps");
      }
      ```

      ```output
      Noor: 10700 steps, goal reached
      Theo: 3100 steps
      ```

      It works, but look at what it takes:

      - Four variables, and only their names say that `firstName` and `firstSteps` belong together.
      - The goal check is written twice. To change the goal, you have to find and change both copies.
      - A third person means two more variables and a copy of every line that uses them. Write `firstSteps` in one of the copies where you meant `secondSteps`, and the program adds the steps to the wrong person, without any error message.

      ### The same program with objects

      Each person has a name and a number of steps, and the same goal applies to everyone. That's a class: a `StepCounter` holds one person's name and steps, and knows the goal.

      ```java run
      public class Main {
          public static void main(String[] args) {
              StepCounter noor = new StepCounter("Noor");
              StepCounter theo = new StepCounter("Theo");

              noor.walk(6200);
              theo.walk(3100);
              noor.walk(4500);

              System.out.println(noor);
              System.out.println(theo);
          }
      }
      // ==== StepCounter.java ====
      public class StepCounter {
          private String name;
          private int steps;

          public StepCounter(String name) {
              this.name = name;
              this.steps = 0;
          }

          public void walk(int steps) {
              this.steps = this.steps + steps;
          }

          public String toString() {
              if (this.steps >= 10000) {
                  return this.name + ": " + this.steps + " steps, goal reached";
              }
              return this.name + ": " + this.steps + " steps";
          }
      }
      ```

      ```output
      Noor: 10700 steps, goal reached
      Theo: 3100 steps
      ```

      The output is the same, but the program reads differently:

      - `main` tells what happens in the words of the problem: Noor walks 6200 steps, Theo walks 3100. How the steps are added up is the class's business.
      - Each person's name and steps travel together in one object, so they can't get mixed up with someone else's.
      - The goal is written once, in `toString`. Change it there, and it changes for everyone.
      - A third person is one more line: `StepCounter maya = new StepCounter("Maya");`.

      This is the idea behind **object-oriented programming**: a program is built from objects, and each object looks after its own data and the rules that go with it. A class stands for one idea of the problem (here, a step counter), its instance variables are what each object must remember, and its methods are what can be done with it. The rest of the program only calls the methods, just as it uses an ArrayList without knowing how it works inside.

      A class is worth it even when there's only one object. A program about a single person is still easier to read with a `StepCounter`, because the names of the class and its methods say what the variables are for.

      **Your turn:** in a game, a hero starts with 100 health. A hit takes health away, but never below 0, and healing gives health back, but never above 100. `Main.java` is ready and uses a `Hero` object. Write the class in `Hero.java`:

      - `Hero(String name)` makes a hero with 100 health.
      - `hit(int damage)` takes `damage` off the health. The health doesn't go below 0.
      - `heal(int amount)` adds `amount` to the health. The health doesn't go above 100.
      - `toString()` returns the name and the health, as in the output below.

      The program prints:

      ```
      Aria, health 90
      Aria, health 100
      Aria, health 0
      ```
    seed:
      Hero.java: |
        public class Hero {

        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Hero hero = new Hero("Aria");
                hero.hit(30);
                hero.heal(20);
                System.out.println(hero);
                hero.heal(50);
                System.out.println(hero);
                hero.hit(120);
                System.out.println(hero);
            }
        }
    solution:
      Hero.java: |
        public class Hero {
            private String name;
            private int health;

            public Hero(String name) {
                this.name = name;
                this.health = 100;
            }

            public void hit(int damage) {
                this.health = this.health - damage;
                if (this.health < 0) {
                    this.health = 0;
                }
            }

            public void heal(int amount) {
                this.health = this.health + amount;
                if (this.health > 100) {
                    this.health = 100;
                }
            }

            public String toString() {
                return this.name + ", health " + this.health;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Hero hero = new Hero("Aria");
                hero.hit(30);
                hero.heal(20);
                System.out.println(hero);
                hero.heal(50);
                System.out.println(hero);
                hero.hit(120);
                System.out.println(hero);
            }
        }
    hints:
      - "A hero must remember two things: `private String name;` and `private int health;`. The constructor stores the name and sets the health to 100."
      - "`hit` subtracts and then sets the health back to 0 if it went below 0. `heal` adds and then sets it back to 100 if it went above 100. `toString` returns `this.name + \", health \" + this.health`."
    require:
      - pattern: \bprivate\s+\w+\s+\w+\s*[;=]
        min: 2
        message: "Keep the hero's name and health in private instance variables."
    tests:
      - name: The program
      - call: |
          Hero hero = new Hero("Bram");
          System.out.println(hero);
          hero.hit(100);
          System.out.println(hero);
          hero.heal(35);
          System.out.println(hero);
        hidden: true
      - call: |
          Hero first = new Hero("Cleo");
          Hero second = new Hero("Dev");
          first.hit(45);
          second.hit(5);
          second.heal(3);
          System.out.println(first);
          System.out.println(second);
        hidden: true
      - call: |
          Hero hero = new Hero("Eli");
          hero.heal(10);
          System.out.println(hero);
          hero.hit(250);
          hero.hit(10);
          System.out.println(hero);
        hidden: true
    more:
      - task: |
          This program counts the visitors at the two gates of a zoo. It reads a line for each visitor, `north` or `south`, until the line `end`, and then prints both counts. It keeps the counts in plain variables. `Gate.java` holds a class that does the counting: rewrite `main` so it uses two Gate objects instead of the two counters, gives each visitor to the right gate with `pass()`, and prints the gates. For the input `north`, `south`, `north` and `end`, one per line, the program still prints:

          ```
          North gate: 2
          South gate: 1
          ```
        seed:
          Main.java: |
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    int northVisitors = 0;
                    int southVisitors = 0;
                    while (true) {
                        String line = scanner.nextLine();
                        if (line.equals("end")) {
                            break;
                        }
                        if (line.equals("north")) {
                            northVisitors++;
                        } else if (line.equals("south")) {
                            southVisitors++;
                        }
                    }
                    System.out.println("North gate: " + northVisitors);
                    System.out.println("South gate: " + southVisitors);
                }
            }
          Gate.java: |
            public class Gate {
                private String name;
                private int visitors;

                public Gate(String name) {
                    this.name = name;
                    this.visitors = 0;
                }

                public void pass() {
                    this.visitors = this.visitors + 1;
                }

                public String toString() {
                    return this.name + " gate: " + this.visitors;
                }
            }
        solution:
          Main.java: |
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    Gate north = new Gate("North");
                    Gate south = new Gate("South");
                    while (true) {
                        String line = scanner.nextLine();
                        if (line.equals("end")) {
                            break;
                        }
                        if (line.equals("north")) {
                            north.pass();
                        } else if (line.equals("south")) {
                            south.pass();
                        }
                    }
                    System.out.println(north);
                    System.out.println(south);
                }
            }
          Gate.java: |
            public class Gate {
                private String name;
                private int visitors;

                public Gate(String name) {
                    this.name = name;
                    this.visitors = 0;
                }

                public void pass() {
                    this.visitors = this.visitors + 1;
                }

                public String toString() {
                    return this.name + " gate: " + this.visitors;
                }
            }
        hints:
          - "Replace the two counters with two gates before the loop: `Gate north = new Gate(\"North\");` and `Gate south = new Gate(\"South\");`."
          - "In the loop, `north.pass();` instead of `northVisitors++;`, and the same for south. At the end, `System.out.println(north);` prints the gate with its `toString`."
        require:
          - pattern: \bnew\s+Gate\s*\(
            min: 2
            message: "Create two gates with `new Gate(...)`, one for each side."
          - pattern: \.pass\s*\(\s*\)
            message: "Count each visitor with the gate's `pass()` method."
        forbid:
          - pattern: \b(northVisitors|southVisitors)\b
            message: "Let the Gate objects do the counting: remove `northVisitors` and `southVisitors` from `main`."
        tests:
          - stdin: |
              north
              south
              north
              end
          - stdin: |
              end
            hidden: true
          - stdin: |
              south
              south
              south
              north
              south
              end
            hidden: true
          - stdin: |
              west
              north
              end
            hidden: true
