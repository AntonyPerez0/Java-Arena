        solution:
          Alarm.java: |
            public class Alarm {
                private int hours;
                private int minutes;

                public Alarm() {
                    this.hours = 7;
                    this.minutes = 0;
                }

                public void set(int hours, int minutes) {
                    this.hours = hours;
                    this.minutes = minutes;
                }

                public void set(String time) {
                    String[] parts = time.split(":");
                    this.set(Integer.valueOf(parts[0]), Integer.valueOf(parts[1]));
                }

                public String toString() {
                    if (this.minutes < 10) {
                        return "Alarm at " + this.hours + ":0" + this.minutes;
                    }
                    return "Alarm at " + this.hours + ":" + this.minutes;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Alarm alarm = new Alarm();
                    alarm.set(7, 30);
                    System.out.println(alarm);
                    alarm.set("6:05");
                    System.out.println(alarm);
                }
            }
        hints:
          - "The header is `public void set(String time) {`. Inside it, `String[] parts = time.split(\":\");` gives the hours in `parts[0]` and the minutes in `parts[1]`, as text."
          - "`Integer.valueOf` turns each part into a number (`\"05\"` becomes 5). Then `this.set(Integer.valueOf(parts[0]), Integer.valueOf(parts[1]));` runs the other `set`."
        require:
          - pattern: \bset\s*\(\s*String\s+\w+\s*\)
            message: "Write the new method as `public void set(String time)`."
          - pattern: \.split\s*\(
            message: "Split the time at the `:` with `split(\":\")`."
          - pattern: \bset\s*\(\s*Integer\.(valueOf|parseInt)\s*\(|\bset\s*\(\s*[a-z]\w*\s*,\s*[a-z]\w*\s*\)
            message: "Let `set(String time)` call `set(int hours, int minutes)` with the two numbers, instead of storing them itself."
