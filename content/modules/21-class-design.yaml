          What does this program print? The kitchen scale has three `add` methods, and two of them call another one.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  KitchenScale scale = new KitchenScale();
                  scale.add(250);
                  scale.add("egg");
                  scale.add("250");
                  scale.add(40, 2);
                  System.out.println(scale.getGrams() + " g in total");
              }
          }
          // ==== KitchenScale.java ====
          public class KitchenScale {
              private int grams;

              public KitchenScale() {
                  this.grams = 0;
              }

              public void add(int grams) {
                  this.grams = this.grams + grams;
                  System.out.println("Added " + grams + " g");
              }

              public void add(String item) {
                  if (item.equals("egg")) {
                      this.add(60);
                  } else if (item.equals("apple")) {
                      this.add(150);
                  } else {
                      System.out.println("Unknown: " + item);
                  }
              }

              public void add(int grams, int times) {
                  for (int i = 0; i < times; i++) {
                      this.add(grams);
                  }
              }

              public int getGrams() {
                  return this.grams;
              }
          }
