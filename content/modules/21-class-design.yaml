              public static void main(String[] args) {
                  Hero aria = new Hero("Aria");
                  Hero bram = new Hero("Bram");
                  aria.hit(40);
                  bram.hit(70);
                  bram.heal(50);
                  aria.hit(80);
                  aria.heal(10);
                  System.out.println(aria);
                  System.out.println(bram);
              }
          }
          // ==== Hero.java ====
          public class Hero {
              private String name;
              private int health;

              public Hero(String name) {
                  this.name = name;
                  this.health = 100;
              }

              public void hit(int damage) {
                  this.health = this.health - damage;
                  if (this.health < 0) {
                      this.health = 0;
                  }
              }

              public void heal(int amount) {
                  this.health = this.health + amount;
                  if (this.health > 100) {
                      this.health = 100;
                  }
              }

              public String toString() {
                  return this.name + ", health " + this.health;
              }
          }
        hints:
          - "Follow each hero on their own. Aria goes from 100 to 60, and then a hit of 80 would take her below 0."
          - "Bram goes from 100 to 30, and healing 50 takes him to 80, which is still under the limit of 100."

  - id: class-design-designing
    slug: designing-a-class
    title: Designing a class
    text: |
      Writing a class starts before the code. From a description of the problem, you decide what the class holds and what it can do. Take this one:

      > A train has a name and a number of cars. Every car seats 60 people. Cars can be added to the train and taken off it, but a train always keeps at least one car. We want to know how many seats a train has, and to print it like `Coast Line: 3 cars, 180 seats`.

      Four questions lead from a description like this to a class.

      **1. What must each object remember?** The answer gives the instance variables. A train must remember its name and its number of cars. They differ from train to train, and the cars can change: `private String name;` and `private int cars;`.

      The seats are different: they follow from the number of cars. If the class kept them in a variable of their own, every method that changes the cars would also have to update the seats, and a single forgotten line would leave a train with 3 cars and 240 seats. A value that can be worked out from the others is best worked out by a method, each time it's needed. The 60 seats of a car are the same for every train, so that method can simply use the number 60.

      **2. What does a new object need?** The answer gives the constructor's parameters. A new train needs its name. The description doesn't say how many cars a train starts with, so let it start with one: `public Train(String name)`.

      **3. What can be done with it, and what do we want to know?** The answers give the methods. The things that are done, adding cars and taking them off, become methods that change the object: `addCar()` and `removeCar()`. The rule "at least one car" goes into `removeCar`, the only place where the cars go down. The question "how many seats?" becomes a method that returns a value: `seats()`.

      **4. How should it look as text?** The answer goes in `toString`, which can call `seats()` instead of multiplying again.

      ```java run
      public class Main {
          public static void main(String[] args) {
              Train train = new Train("Coast Line");
              train.addCar();
              train.addCar();
              System.out.println(train);
              train.removeCar();
              train.removeCar();
              train.removeCar();
              System.out.println(train.seats());
          }
      }
      // ==== Train.java ====
      public class Train {
          private String name;
          private int cars;

          public Train(String name) {
              this.name = name;
              this.cars = 1;
          }

          public void addCar() {
              this.cars = this.cars + 1;
          }

          public void removeCar() {
              if (this.cars > 1) {
                  this.cars = this.cars - 1;
              }
          }

          public int seats() {
              return this.cars * 60;
          }

          public String toString() {
              return this.name + ": " + this.cars + " cars, " + this.seats() + " seats";
          }
      }
      ```

      ```output
      Coast Line: 3 cars, 180 seats
      60
      ```

      - `main` doesn't need to know that the seats are worked out rather than stored: it just asks `seats()`.
      - `toString` calls the object's own `seats()`, so "60 seats a car" is written in one place only.
      - `removeCar` keeps the train at one car at least, whatever `main` does. The third `removeCar()` above changes nothing.

      Designs can differ. Another program might need a constructor that also takes the number of cars, or a method that tells whether a group fits on the train. Start with what the description asks for: a method that nothing calls is only more code to read.

      **Your turn:** here's a description. *A garden bed is a rectangle, with a length and a width in whole meters. Every square meter has room for 4 plants. We want to know a bed's area and how many plants it has room for, and to print it like `3 x 2 m, room for 24 plants`.*

      Write the class `GardenBed`, with the constructor `GardenBed(int length, int width)` and the methods `area()`, `room()` and `toString()`. Keep only what a bed must remember in instance variables. `room()` should use `area()`, and `toString()` should use `room()`. The check creates `new GardenBed(3, 2)` and prints its area and then the bed:

      ```
      6
      3 x 2 m, room for 24 plants
      ```
    seed:
      GardenBed.java: |
        public class GardenBed {

        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                GardenBed bed = new GardenBed(3, 2);
                System.out.println(bed.area());
                System.out.println(bed);
            }
        }
    solution:
      GardenBed.java: |
        public class GardenBed {
            private int length;
            private int width;

            public GardenBed(int length, int width) {
                this.length = length;
                this.width = width;
            }

            public int area() {
                return this.length * this.width;
            }

            public int room() {
                return this.area() * 4;
            }

            public String toString() {
                return this.length + " x " + this.width + " m, room for " + this.room() + " plants";
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                GardenBed bed = new GardenBed(3, 2);
                System.out.println(bed.area());
                System.out.println(bed);
            }
        }
    hints:
      - "A bed must remember its length and its width: two private `int` instance variables. The area and the room follow from them, so they're methods: `public int area()` and `public int room()`."
      - "`area()` returns `this.length * this.width`, and `room()` returns `this.area() * 4`. `toString` builds the text with `this.room()`."
    require:
      - pattern: \barea\s*\(\s*\)
        min: 3
        message: "Write `area()`, and let `room()` call it instead of multiplying the length and the width again."
      - pattern: \broom\s*\(\s*\)
        min: 2
        message: "Write `room()`, and let `toString()` call it."
    forbid:
      - pattern: \bprivate\s+int\s+(area|room)\b
        message: "The area and the room follow from the length and the width: work them out in `area()` and `room()` instead of storing them in instance variables."
    tests:
      - call: |
          GardenBed bed = new GardenBed(3, 2);
          System.out.println(bed.area());
          System.out.println(bed);
      - call: |
          GardenBed bed = new GardenBed(5, 4);
          System.out.println(bed.area());
          System.out.println(bed.room());
          System.out.println(bed);
        hidden: true
      - call: |
          GardenBed small = new GardenBed(1, 1);
          GardenBed strip = new GardenBed(12, 1);
          System.out.println(strip);
          System.out.println(small);
        hidden: true
    more:
