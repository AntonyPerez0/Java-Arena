            private int km;

            public Odometer() {
                this.km = 0;
            }

            public void add(int km) {
                this.km = this.km + km;
            }

            // Write the second add method here.

            public String toString() {
                return this.km + " km";
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Odometer odometer = new Odometer();
                odometer.add(35);
                odometer.add(2, 80);
                System.out.println(odometer);
            }
        }
    solution:
