id: references
summary: What a variable really holds. A primitive variable holds its value, while a variable of a class type holds a reference to an object. What that means for assigning one variable to another, for `==` and for method parameters, and the value `null`, which refers to no object at all, with the NullPointerException that comes from using it.
steps:
  - id: references-primitives
    slug: primitive-variables
    title: Primitive variables
    text: |
      Every Java variable is one of two kinds, and the kind decides what `=` copies, what a method can change, and what `==` compares. This module is about the difference, starting with the simpler kind.

      ### The primitive types

      Java has eight **primitive types**. Four of them you've used all along:

      | Type | Holds | Examples |
      |---|---|---|
      | `int` | whole numbers, from about -2.1 billion to 2.1 billion | `42`, `-7` |
      | `double` | numbers with a decimal point | `3.75`, `-0.5` |
      | `boolean` | true or false | `true`, `false` |
      | `char` | one character, in single quotes | `'A'`, `'?'` |

      You'll rarely need the other four: `long` holds whole numbers too big for an `int`, `float` is a less precise decimal number, and `byte` and `short` hold whole numbers with small ranges. All eight names start with a small letter.

      Every other type is a **reference type**: `String`, `Scanner`, `ArrayList`, arrays such as `int[]`, and every class you write. Those are the next step.

      ### A primitive variable holds its value

      A primitive variable holds the value itself. Picture a box with a number in it. Assigning one variable to another copies the value into the other box, and after that the two boxes have nothing to do with each other:

      ```java main
      int planned = 12;
      int done = planned;
      done = done - 5;
      planned++;
      System.out.println("Planned: " + planned);
      System.out.println("Done: " + done);
      ```

      ```output
      Planned: 13
      Done: 7
      ```

      - `int done = planned;` copies the value 12 into `done`. It doesn't tie `done` to `planned` in any way.
      - Changing `done` doesn't touch `planned`, and changing `planned` doesn't touch `done`.

      The same goes for a value worked out from other variables. `int total = a + b;` stores the sum as it is at that moment, and if `a` changes later, `total` keeps the old sum.

      ### Swapping two values

      Assigning puts a new value in the box, and the old one is gone. That's why swapping the values of two variables takes three steps and a third variable:

      ```java main
      int left = 3;
      int right = 8;
      int temp = left;
      left = right;
      right = temp;
      System.out.println(left + " " + right);
      ```

      ```output
      8 3
      ```

      With only `left = right;` and `right = left;`, the first line overwrites the 3, and both variables end up 8. `temp` keeps a copy of the old value until it's needed.

      **Your turn:** what does this program print? Keep track of each variable's value on paper, line by line.
    predict: |
      public class Main {
          public static void main(String[] args) {
              int first = 7;
              int second = first;
              first = first * 2;
              second++;
              int sum = first + second;
              first = 1;
              char grade = 'B';
              char copy = grade;
              grade = 'A';
              System.out.println(first);
              System.out.println(second);
              System.out.println(sum);
              System.out.println(grade + " " + copy);
          }
      }
    hints:
      - "`int second = first;` copies 7 into `second`. Doubling `first` afterwards doesn't change `second`, and `second++` makes it 8."
      - "`sum` is worked out once, from 14 and 8. Setting `first` to 1 later doesn't change it. The chars work the same way: `copy` keeps the `'B'` it was given."
    more:
      - task: |
          In a game, the player starts with some lives. The program reads the starting number, then one event per line until `end`: `hit` takes a life and `heart` gives one. The first line and the two prints at the end are ready. Declare `lives` as a copy of `start`, and change only `lives` in the loop, so that `start` still holds the starting number at the end. For the input `3`, `hit`, `hit`, `heart`, `hit` and `end`, one per line, the program prints:

          ```
          Lives at the start: 3
          Lives now: 1
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int start = Integer.valueOf(scanner.nextLine());
                  // Declare lives here, then read the events.

                  System.out.println("Lives at the start: " + start);
                  System.out.println("Lives now: " + lives);
              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int start = Integer.valueOf(scanner.nextLine());
                  int lives = start;
                  while (true) {
                      String event = scanner.nextLine();
                      if (event.equals("end")) {
                          break;
                      }
                      if (event.equals("hit")) {
                          lives--;
                      } else if (event.equals("heart")) {
                          lives++;
                      }
                  }
                  System.out.println("Lives at the start: " + start);
                  System.out.println("Lives now: " + lives);
              }
          }
        hints:
          - "`int lives = start;` copies the starting number. From then on the two variables are separate, so changing `lives` leaves `start` as it was."
          - "In a `while (true)` loop, read a line and `break` at `end`. For `hit` do `lives--;`, for `heart` do `lives++;`."
        require:
          - pattern: \bint\s+lives\s*=\s*start\s*;
            message: "Start `lives` as a copy of the starting number: `int lives = start;`."
