  - id: references-parameters
    slug: values-and-references-as-parameters
    title: Values and references as parameters
    text: |
      Module 10's rule is still the whole story: a parameter gets a copy of the argument. What gets copied depends on the kind of variable. For a primitive it's the value, and for an object it's the reference.

      ```java run
      public class Main {
          public static void main(String[] args) {
              int km = 120;
              Bike bike = new Bike("blue", 120);
              addToNumber(km);
              addToBike(bike);
              System.out.println(km);
              System.out.println(bike);
          }

          public static void addToNumber(int km) {
              km = km + 50;
          }

          public static void addToBike(Bike bike) {
              bike.ride(50);
          }
      }
      // ==== Bike.java ====
      public class Bike {
          private String color;
          private int km;

          public Bike(String color, int km) {
              this.color = color;
              this.km = km;
          }

          public void ride(int km) {
              this.km = this.km + km;
          }

          public String toString() {
              return "The " + this.color + " bike, " + this.km + " km";
          }
      }
      ```

      ```output
      120
      The blue bike, 170 km
      ```

      - `addToNumber` gets a copy of the number 120. It changes its own copy, and `main`'s `km` stays 120.
      - `addToBike` gets a copy of the reference. The copy points at the same bike as `main`'s variable, so `bike.ride(50)` rides `main`'s bike. That's also why a method can change a list or an array it's given, as in modules 14 and 15.

      ### A new object for the parameter

      A method can change the object its parameter points at, but it can't change which object the caller's variable points at. Giving the parameter a new object only moves the parameter's own arrow:

      ```java run
      public class Main {
          public static void main(String[] args) {
              Bike bike = new Bike("blue", 120);
              replace(bike);
              System.out.println(bike);
          }

          public static void replace(Bike bike) {
              bike = new Bike("green", 0);
              bike.ride(5);
              System.out.println("In the method: " + bike);
          }
      }
      // ==== Bike.java ====
      public class Bike {
          private String color;
          private int km;

          public Bike(String color, int km) {
              this.color = color;
              this.km = km;
          }

          public void ride(int km) {
              this.km = this.km + km;
          }

          public String toString() {
              return "The " + this.color + " bike, " + this.km + " km";
          }
      }
      ```

      ```output
      In the method: The green bike, 5 km
      The blue bike, 120 km
      ```

      After `bike = new Bike("green", 0);` the parameter points at a new green bike, and `ride(5)` rides that one. `main`'s variable was never touched, so it still points at the blue bike. When a method should give the caller a new object, it returns it, as `findOldest` in module 19 returned a Pet.

      In short:

      | The parameter's type | The method gets | What the method can change |
      |---|---|---|
      | primitive (`int`, `double`, `boolean`, `char`, ...) | a copy of the value | only its own copy |
      | a class (an object) | a copy of the reference | the object's state, through its methods, but not which object the caller's variable points at |

      **Your turn:** `Jug.java` is ready. In `Main`, write a method `pourAll(Jug from, Jug to)` that pours all the water from one jug into the other: `to` gets everything `from` had, and `from` ends up empty. It returns nothing, since it changes the two jugs themselves. The check runs:

      ```java fragment
      Jug big = new Jug(300);
      Jug small = new Jug(150);
      pourAll(small, big);
      System.out.println(big + " and " + small);
      ```

      and expects:

      ```
      450 ml and 0 ml
      ```
    seed:
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Jug big = new Jug(300);
                Jug small = new Jug(150);
                pourAll(small, big);
                System.out.println(big + " and " + small);
            }

            // Write the pourAll method here.
        }
      Jug.java: |
        public class Jug {
            private int milliliters;

            public Jug(int milliliters) {
                this.milliliters = milliliters;
            }

            public int getMilliliters() {
                return this.milliliters;
            }

            public void add(int milliliters) {
                this.milliliters = this.milliliters + milliliters;
            }

            public void empty() {
                this.milliliters = 0;
            }

            public String toString() {
                return this.milliliters + " ml";
            }
        }
    solution:
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Jug big = new Jug(300);
                Jug small = new Jug(150);
                pourAll(small, big);
                System.out.println(big + " and " + small);
            }

            public static void pourAll(Jug from, Jug to) {
                to.add(from.getMilliliters());
                from.empty();
            }
        }
      Jug.java: |
        public class Jug {
            private int milliliters;

            public Jug(int milliliters) {
                this.milliliters = milliliters;
            }

            public int getMilliliters() {
                return this.milliliters;
            }

            public void add(int milliliters) {
