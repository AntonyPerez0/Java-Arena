          The program reads two whole numbers, the ends of a range, and prints every number from the smaller one up to the larger one. The user may type the ends in either order. The loop is ready, and it counts from `low` up to `high`: when `low` is the larger number, swap the values of `low` and `high` before the loop, with a third variable as in the example. For the input `6` and `3` the program prints:

          ```
          3
          4
          5
          6
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int low = Integer.valueOf(scanner.nextLine());
                  int high = Integer.valueOf(scanner.nextLine());
                  // Swap the values here when low is larger than high.

                  for (int i = low; i <= high; i++) {
                      System.out.println(i);
                  }
              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int low = Integer.valueOf(scanner.nextLine());
                  int high = Integer.valueOf(scanner.nextLine());
                  if (low > high) {
                      int temp = low;
                      low = high;
                      high = temp;
                  }
                  for (int i = low; i <= high; i++) {
                      System.out.println(i);
                  }
              }
          }
        hints:
          - "Swap only when it's needed: `if (low > high) { ... }`."
          - "Inside the `if`, three lines: `int temp = low;`, then `low = high;`, then `high = temp;`."
        require:
          - pattern: \blow\s*=\s*high\s*;
            message: "Swap the values of the two variables: one of the three lines is `low = high;`."
          - pattern: for\s*\(\s*int\s+i\s*=\s*low\s*;\s*i\s*<=\s*high\s*;
            message: "Keep the loop as it is: it counts from `low` up to `high`."
