            message: "Add the points to the team whose turn it is: `current.addPoints(...)`."
          - pattern: \bcurrent\s*==|==\s*current\b
            message: "Use `==` to see which team `current` points at, as in `if (current == red)`."
        forbid:
          - pattern: \b(red|blue)\.addPoints\s*\(
            message: "Add the points through `current`, not through `red` or `blue` directly."
