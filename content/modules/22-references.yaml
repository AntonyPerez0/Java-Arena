      - task: |
          In a quiz, two teams answer in turns, red first. The program reads the points for each answer, one per line, until `end`: the first answer is red's, the second blue's, the third red's again, and so on. `Main` already has a variable `current` that points at the team whose turn it is. For each answer, add the points with `current.addPoints(...)`, then point `current` at the other team, using `==` to see which team it points at now. At the end, print both teams. For the input `3`, `2`, `4`, `1` and `end`, one per line, the program prints:

          ```
          Red: 7 points
          Blue: 3 points
          ```
        seed:
          Main.java: |
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    Team red = new Team("Red");
                    Team blue = new Team("Blue");
                    Team current = red;

                    System.out.println(red);
                    System.out.println(blue);
                }
            }
          Team.java: |
            public class Team {
                private String name;
                private int points;

                public Team(String name) {
                    this.name = name;
                    this.points = 0;
                }

                public void addPoints(int points) {
                    this.points = this.points + points;
                }

                public String toString() {
                    return this.name + ": " + this.points + " points";
                }
            }
        solution:
          Main.java: |
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    Team red = new Team("Red");
                    Team blue = new Team("Blue");
                    Team current = red;
                    while (true) {
                        String line = scanner.nextLine();
                        if (line.equals("end")) {
                            break;
                        }
                        current.addPoints(Integer.valueOf(line));
                        if (current == red) {
                            current = blue;
                        } else {
                            current = red;
                        }
                    }
                    System.out.println(red);
                    System.out.println(blue);
                }
            }
          Team.java: |
            public class Team {
                private String name;
                private int points;

                public Team(String name) {
                    this.name = name;
                    this.points = 0;
                }

                public void addPoints(int points) {
                    this.points = this.points + points;
                }

                public String toString() {
                    return this.name + ": " + this.points + " points";
                }
            }
        hints:
          - "In a `while (true)` loop: read a line, `break` at `end`, and otherwise `current.addPoints(Integer.valueOf(line));`. The points go to whichever team `current` points at."
          - "Then pass the turn: `if (current == red) { current = blue; } else { current = red; }`. That only changes where `current` points, and both teams keep their points."
        require:
