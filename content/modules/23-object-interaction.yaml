      Robot.java: |
        public class Robot {
            private String name;
            private Position position;

            public Robot(String name, Position start) {
                this.name = name;
                this.position = start;
            }

            public void move(String direction) {
                if (direction.equals("up")) {
                    this.position = this.position.moved(0, 1);
                } else if (direction.equals("down")) {
                    this.position = this.position.moved(0, -1);
                } else if (direction.equals("right")) {
                    this.position = this.position.moved(1, 0);
                } else if (direction.equals("left")) {
                    this.position = this.position.moved(-1, 0);
                }
            }

            public boolean isAt(Position place) {
                return this.position.equals(place);
            }

            public String toString() {
                return this.name + " at " + this.position;
            }
        }
