        solution:
          Main.java: |
            import java.util.ArrayList;
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    ArrayList<Position> treasures = new ArrayList<>();
                    treasures.add(new Position(1, 0));
                    treasures.add(new Position(2, 2));
                    treasures.add(new Position(-1, 3));

                    Scanner scanner = new Scanner(System.in);
                    Position here = new Position(0, 0);
                    while (true) {
                        String move = scanner.nextLine();
                        if (move.isEmpty()) {
                            break;
                        }
                        if (move.equals("up")) {
                            here = here.moved(0, 1);
                        } else if (move.equals("down")) {
                            here = here.moved(0, -1);
                        } else if (move.equals("right")) {
                            here = here.moved(1, 0);
                        } else if (move.equals("left")) {
                            here = here.moved(-1, 0);
                        }
                        if (treasures.contains(here)) {
                            treasures.remove(here);
                            System.out.println("Found a coin at " + here);
                        }
                    }
                    System.out.println("Coins left: " + treasures.size());
                }
            }
          Position.java: |
            public class Position {
                private int x;
                private int y;

                public Position(int x, int y) {
                    this.x = x;
                    this.y = y;
                }

                public Position moved(int dx, int dy) {
                    return new Position(this.x + dx, this.y + dy);
                }

                public int stepsTo(Position other) {
                    return Math.abs(this.x - other.x) + Math.abs(this.y - other.y);
                }

                public boolean equals(Object compared) {
                    if (this == compared) {
                        return true;
                    }
                    if (!(compared instanceof Position)) {
                        return false;
                    }
                    Position other = (Position) compared;
                    return this.x == other.x && this.y == other.y;
                }

                public String toString() {
                    return "(" + this.x + ", " + this.y + ")";
                }
            }
