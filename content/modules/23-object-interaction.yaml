      - task: |
          A train ticket keeps its route in a `Route` object, and `Route.java` is ready. In `Ticket.java`, write:

          - the constructor `Ticket(String passenger, String from, String to)`, which stores the passenger and makes the route itself, from `from` and `to`;
          - the method `goesTo(String city)`, which returns `true` when the ticket's route ends in that city. Ask the route where it ends with `getTo()`.

          The check runs:

          ```java fragment
          Ticket ticket = new Ticket("Lea", "Harbor Town", "Hill Park");
          System.out.println(ticket);
          System.out.println(ticket.goesTo("Hill Park"));
          System.out.println(ticket.goesTo("Harbor Town"));
          ```

          and expects:

          ```
          Lea: Harbor Town to Hill Park
          true
          false
          ```
        seed:
          Ticket.java: |
            public class Ticket {
                private String passenger;
                private Route route;

                // Write the constructor and the goesTo method here.

                public String toString() {
                    return this.passenger + ": " + this.route;
                }
            }
          Route.java: |
            public class Route {
                private String from;
                private String to;

                public Route(String from, String to) {
                    this.from = from;
                    this.to = to;
                }

                public String getFrom() {
                    return this.from;
                }

                public String getTo() {
                    return this.to;
                }

                public String toString() {
                    return this.from + " to " + this.to;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Ticket ticket = new Ticket("Lea", "Harbor Town", "Hill Park");
                    System.out.println(ticket);
                    System.out.println(ticket.goesTo("Hill Park"));
                    System.out.println(ticket.goesTo("Harbor Town"));
                }
            }
        solution:
          Ticket.java: |
            public class Ticket {
                private String passenger;
                private Route route;

                public Ticket(String passenger, String from, String to) {
                    this.passenger = passenger;
                    this.route = new Route(from, to);
                }

                public boolean goesTo(String city) {
                    return this.route.getTo().equals(city);
                }

                public String toString() {
