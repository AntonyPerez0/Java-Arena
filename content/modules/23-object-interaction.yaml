          What does this program print? Each call to `enter` works with two objects: the gate it's called on and the passport it's given.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  Passport ana = new Passport("Ana");
                  Passport ben = new Passport("Ben");
                  Gate north = new Gate("North gate");
                  Gate south = new Gate("South gate");
                  north.enter(ana);
                  south.enter(ben);
                  north.enter(ana);
                  south.enter(ana);
                  System.out.println(ana);
                  System.out.println(ben);
                  System.out.println(north);
              }
