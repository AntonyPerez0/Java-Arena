      PlayingCard second = new PlayingCard("hearts", 7);
      PlayingCard third = new PlayingCard("spades", 7);
      System.out.println(first.equals(second));
      System.out.println(first.equals(third));
      ```

      and expects:

      ```
      true
      false
      ```
