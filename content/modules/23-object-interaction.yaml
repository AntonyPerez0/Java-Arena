                  return this.owner + ", stamps: " + this.stamps;
              }
          }
        hints:
          - "`enter` gets the passport itself, not a copy, so `passport.addStamp()` changes the Passport object in `ana` or `ben`. Then the gate counts one more entry of its own."
          - "Ana's passport is given to `enter` three times: twice at the north gate and once at the south gate. Ben's is given once. The north gate counted two entries, both Ana's."
      - task: |
          A kettle pours hot water into cups. `Cup.java` is ready: `space()` returns how many milliliters still fit in the cup, and `fill(int ml)` adds water to it. In `Kettle.java`, write the method `pour(Cup cup)`. It pours until the cup is full or the kettle is empty, whichever comes first, and the kettle then has that much less water. The check runs:

          ```java fragment
          Kettle kettle = new Kettle(500);
          Cup mug = new Cup(300);
          Cup glass = new Cup(250);
          kettle.pour(mug);
          kettle.pour(glass);
          System.out.println(mug);
          System.out.println(glass);
          System.out.println(kettle);
          ```

          and expects:

          ```
          300/300 ml
          200/250 ml
          Kettle: 0 ml
          ```
        seed:
          Kettle.java: |
            public class Kettle {
                private int water;

                public Kettle(int water) {
                    this.water = water;
                }

                // Write the pour method here.

                public String toString() {
                    return "Kettle: " + this.water + " ml";
                }
            }
          Cup.java: |
            public class Cup {
                private int capacity;
                private int water;

                public Cup(int capacity) {
                    this.capacity = capacity;
                    this.water = 0;
                }

                public int space() {
                    return this.capacity - this.water;
                }

                public void fill(int ml) {
                    this.water = this.water + ml;
                }

                public String toString() {
                    return this.water + "/" + this.capacity + " ml";
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Kettle kettle = new Kettle(500);
                    Cup mug = new Cup(300);
                    Cup glass = new Cup(250);
                    kettle.pour(mug);
                    kettle.pour(glass);
                    System.out.println(mug);
                    System.out.println(glass);
                    System.out.println(kettle);
                }
            }
        solution:
          Kettle.java: |
            public class Kettle {
                private int water;

                public Kettle(int water) {
                    this.water = water;
                }

                public void pour(Cup cup) {
                    int amount = Math.min(this.water, cup.space());
                    cup.fill(amount);
                    this.water = this.water - amount;
                }

                public String toString() {
                    return "Kettle: " + this.water + " ml";
                }
            }
          Cup.java: |
            public class Cup {
                private int capacity;
                private int water;

                public Cup(int capacity) {
                    this.capacity = capacity;
                    this.water = 0;
                }

                public int space() {
                    return this.capacity - this.water;
                }

                public void fill(int ml) {
                    this.water = this.water + ml;
                }

                public String toString() {
                    return this.water + "/" + this.capacity + " ml";
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Kettle kettle = new Kettle(500);
                    Cup mug = new Cup(300);
                    Cup glass = new Cup(250);
                    kettle.pour(mug);
                    kettle.pour(glass);
                    System.out.println(mug);
                    System.out.println(glass);
                    System.out.println(kettle);
                }
            }
        hints:
          - "The amount to pour is the smaller of two numbers: the kettle's own `this.water` and the cup's `cup.space()`. `Math.min` gives the smaller one."
          - "Then give the cup that amount with `cup.fill(amount);`, and take it from the kettle: `this.water = this.water - amount;`."
        require:
          - pattern: \bpublic\s+void\s+pour\s*\(\s*Cup\s+\w+\s*\)
            message: "Write the method as `public void pour(Cup cup)`."
          - pattern: \.space\s*\(\s*\)
            message: "Ask the cup how much still fits with `space()`."
          - pattern: \.fill\s*\(
            message: "Put the water in the cup with its `fill` method."
        tests:
