          // ==== Gate.java ====
          public class Gate {
              private String name;
              private int entries;

              public Gate(String name) {
                  this.name = name;
                  this.entries = 0;
              }

              public void enter(Passport passport) {
                  passport.addStamp();
                  this.entries++;
              }

              public String toString() {
                  return this.name + ": " + this.entries + " entries";
              }
          }
          // ==== Passport.java ====
          public class Passport {
              private String owner;
              private int stamps;

              public Passport(String owner) {
                  this.owner = owner;
                  this.stamps = 0;
              }

              public void addStamp() {
                  this.stamps++;
