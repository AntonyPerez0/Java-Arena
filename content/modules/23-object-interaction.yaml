    solution:
      PiggyBank.java: |
        public class PiggyBank {
            private int coins;
            private int cents;

            public PiggyBank() {
                this.coins = 0;
                this.cents = 0;
            }

            public void insert(Coin coin) {
                this.coins++;
                this.cents = this.cents + coin.getCents();
            }

            public String toString() {
                return "Coins: " + this.coins + ", total " + this.cents + " cents";
            }
        }
      Coin.java: |
        public class Coin {
            private int cents;

            public Coin(int cents) {
                this.cents = cents;
            }

            public int getCents() {
                return this.cents;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                PiggyBank piggy = new PiggyBank();
                piggy.insert(new Coin(50));
                piggy.insert(new Coin(20));
                piggy.insert(new Coin(100));
                System.out.println(piggy);
            }
        }
    hints:
      - "The parameter's type is the class: `public void insert(Coin coin) {`. Inside the method, `coin` is the coin that was put in."
      - "`this.coins++;` counts the coin, and `this.cents = this.cents + coin.getCents();` adds its value. `coin.cents` doesn't compile in PiggyBank, because it's private to Coin."
    require:
      - pattern: \bpublic\s+void\s+insert\s*\(\s*Coin\s+\w+\s*\)
        message: "Write the method as `public void insert(Coin coin)`."
      - pattern: \.getCents\s*\(\s*\)
        message: "Ask the coin for its value with `getCents()`."
