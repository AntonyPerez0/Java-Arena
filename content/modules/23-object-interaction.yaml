        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner scanner = new Scanner(System.in);
                ArrayList<Sticker> album = new ArrayList<>();
                int doubles = 0;
                while (true) {
                    String line = scanner.nextLine();
                    if (line.isEmpty()) {
                        break;
                    }
                    String[] parts = line.split(" ");
                    Sticker sticker = new Sticker(parts[0], Integer.valueOf(parts[1]));
