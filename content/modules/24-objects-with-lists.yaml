          SignUpSheet.java: |
            import java.util.ArrayList;

            public class SignUpSheet {
                private ArrayList<String> names;

                public SignUpSheet() {
                    this.names = new ArrayList<>();
                }

                public void signUp(String name) {
                    this.names.add(name);
                }

                public int cancel(String name) {
                    int removed = 0;
                    for (int i = this.names.size() - 1; i >= 0; i--) {
                        if (this.names.get(i).equals(name)) {
                            this.names.remove(i);
                            removed++;
                        }
                    }
                    return removed;
                }

                public void reset() {
                    this.names.clear();
                }

                public String toString() {
                    return "Signed up: " + this.names;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    SignUpSheet sheet = new SignUpSheet();
                    sheet.signUp("Ada");
                    sheet.signUp("Ben");
                    sheet.signUp("Ada");
                    sheet.signUp("Ada");
                    sheet.signUp("Cleo");
                    System.out.println(sheet.cancel("Ada"));
                    System.out.println(sheet);
                    System.out.println(sheet.cancel("Zoe"));
                    sheet.reset();
                    System.out.println(sheet);
                }
            }
