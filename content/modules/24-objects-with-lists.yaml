          Roster.java: |
            import java.util.ArrayList;

            public class Roster {
                private String team;
                private int maxPlayers;
                private ArrayList<Player> players;

                public Roster(String team, int maxPlayers) {
                    this.team = team;
                    this.maxPlayers = maxPlayers;
                    this.players = new ArrayList<>();
                }

                public boolean add(Player player) {
                    if (this.players.size() >= this.maxPlayers) {
                        return false;
                    }
                    for (Player other : this.players) {
                        if (other.getNumber() == player.getNumber()) {
                            return false;
                        }
                    }
                    this.players.add(player);
                    return true;
                }

                public boolean remove(int number) {
                    for (int i = 0; i < this.players.size(); i++) {
                        if (this.players.get(i).getNumber() == number) {
                            this.players.remove(i);
                            return true;
                        }
                    }
                    return false;
                }

                public String toString() {
                    String text = this.team + ": " + this.players.size() + "/" + this.maxPlayers + " players";
                    for (Player player : this.players) {
                        text = text + "\n" + player;
                    }
                    return text;
                }
            }
