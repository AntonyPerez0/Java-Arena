      DayPlan.java: |
        import java.util.ArrayList;

        public class DayPlan {
            private int minutes;
            private ArrayList<Meeting> meetings;

            public DayPlan(int minutes) {
                this.minutes = minutes;
                this.meetings = new ArrayList<>();
            }

            public int bookedMinutes() {
                int total = 0;
                for (Meeting meeting : this.meetings) {
                    total = total + meeting.getMinutes();
                }
                return total;
            }

            public boolean add(Meeting meeting) {
                if (this.bookedMinutes() + meeting.getMinutes() > this.minutes) {
                    return false;
                }
                this.meetings.add(meeting);
                return true;
            }

            public String toString() {
                return this.bookedMinutes() + "/" + this.minutes + " min: " + this.meetings;
            }
        }
