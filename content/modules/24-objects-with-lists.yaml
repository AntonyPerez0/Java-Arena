      fridge.put(new Food("cheese", 12));
      fridge.put(new Food("milk", 0));
      fridge.put(new Food("yogurt", -1));
      fridge.put(new Food("jam", 90));
      fridge.throwOutOld();
      System.out.println(fridge);
      ```

      and expects:

      ```
      Fridge: [cheese (12 days), jam (90 days)]
      ```
