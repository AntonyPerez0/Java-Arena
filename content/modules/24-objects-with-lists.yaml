                  ana.deliver("bill");
                  leo.deliver("postcard");
                  home.deliver("magazine");
                  System.out.println(ana.count());
                  System.out.println(leo.count());
                  home = leo;
                  home.deliver("letter");
                  System.out.println(leo);
                  System.out.println(ana);
