          What does this program print? Each Mailbox makes its own list in its constructor. `this.letters` joined to a String writes out the list in brackets, just as printing a list does.
        predict: |
          public class Main {
              public static void main(String[] args) {
                  Mailbox ana = new Mailbox("Ana");
                  Mailbox leo = new Mailbox("Leo");
