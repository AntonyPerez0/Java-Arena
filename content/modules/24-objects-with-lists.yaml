    solution:
      PhotoAlbum.java: |
        import java.util.ArrayList;

        public class PhotoAlbum {
            private String title;
            private ArrayList<String> photos;

            public PhotoAlbum(String title) {
                this.title = title;
                this.photos = new ArrayList<>();
            }

            public String getTitle() {
                return this.title;
            }

            public void add(String photo) {
                this.photos.add(photo);
            }

            public int count() {
                return this.photos.size();
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                PhotoAlbum trip = new PhotoAlbum("Summer trip");
                trip.add("beach.jpg");
                trip.add("tent.jpg");
                PhotoAlbum winter = new PhotoAlbum("Winter");
                System.out.println(trip.getTitle() + ": " + trip.count());
                System.out.println(winter.getTitle() + ": " + winter.count());
            }
        }
    hints:
