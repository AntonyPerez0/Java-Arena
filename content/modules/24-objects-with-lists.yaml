          Main.java: |
            import java.util.ArrayList;
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    ArrayList<Runner> runners = new ArrayList<>();
                    while (true) {
                        String line = scanner.nextLine();
                        if (line.isEmpty()) {
                            break;
                        }
                        String[] parts = line.split(" ");
                        runners.add(new Runner(parts[0], Integer.valueOf(parts[1])));
                    }
                    System.out.println("Runners: " + runners.size());
                    for (int i = runners.size() - 1; i >= 0; i--) {
                        System.out.println(runners.get(i));
                    }
                }
            }
          Runner.java: |
            public class Runner {
                private String name;
                private int minutes;

                public Runner(String name, int minutes) {
                    this.name = name;
                    this.minutes = minutes;
                }

                public String getName() {
                    return this.name;
                }

                public int getMinutes() {
                    return this.minutes;
                }

                public String toString() {
                    return this.name + ", " + this.minutes + " min";
                }
            }
        hints:
          - "Read in a `while (true)` loop and `break` at the empty line. `line.split(\" \")` splits `Ada 27` into the name and the minutes, and `Integer.valueOf(parts[1])` turns the minutes into a number: `runners.add(new Runner(parts[0], Integer.valueOf(parts[1])));`"
          - "A for-each loop only goes forwards. To start from the last runner, loop over the indexes backwards: `for (int i = runners.size() - 1; i >= 0; i--)`, and print `runners.get(i)`."
