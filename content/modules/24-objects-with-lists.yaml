      tank.add(new Fish("Finn", "clownfish"));
      tank.add(new Fish("Coral", "blue tang"));
      System.out.println(tank);
      ```

      and expects:

      ```
      Reef tank: empty
      Reef tank: 2 fish
      Finn the clownfish
      Coral the blue tang
      ```
