        solution:
          DeliLine.java: |
            import java.util.ArrayList;

            public class DeliLine {
                // Move the list and the work on it here.
                private ArrayList<String> names;

                public DeliLine() {
                    this.names = new ArrayList<>();
                }

                public int take(String name) {
                    this.names.add(name);
                    return this.names.size();
                }

                public boolean isEmpty() {
                    return this.names.isEmpty();
                }

                public String next() {
                    String first = this.names.get(0);
                    this.names.remove(0);
                    return first;
                }

                public String toString() {
                    return this.names.toString();
                }
            }
          Main.java: |
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    DeliLine line = new DeliLine();
                    while (true) {
                        System.out.print("> ");
                        String command = scanner.nextLine();
                        if (command.equals("close")) {
                            System.out.println("Closed for today");
                            break;
                        }
                        if (command.equals("take")) {
                            String name = scanner.nextLine();
                            int place = line.take(name);
                            System.out.println(name + ", you're number " + place);
                        } else if (command.equals("next")) {
                            if (line.isEmpty()) {
                                System.out.println("Nobody is waiting");
                            } else {
                                System.out.println("Now serving " + line.next());
                            }
                        } else if (command.equals("queue")) {
                            System.out.println("In line: " + line);
                        } else {
                            System.out.println("Unknown command: " + command);
                        }
                    }
                }
            }
