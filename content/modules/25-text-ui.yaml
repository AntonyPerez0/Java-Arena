          A library card program, all of it: `LibraryCard.java`, `UserInterface.java` and `Main.java`.

          `LibraryCard` holds the titles of the books borrowed on the card, and a limit to how many books can be borrowed at a time. Its methods:

          - `LibraryCard(int limit)`: a card with no books, for at most `limit` books at a time.
          - `has(String title)`: returns `true` when that book is borrowed on the card.
          - `isFull()`: returns `true` when `limit` books are borrowed.
          - `borrow(String title)`: adds the book to the card. The user interface only calls it when the card isn't full and doesn't have the book.
          - `giveBack(String title)`: removes the book and returns `true`, or returns `false` if it isn't on the card.
          - `books()`: returns the titles, an `ArrayList<String>`, in the order they were borrowed.

          `UserInterface` takes a `Scanner` and a `LibraryCard`, and `start()` reads commands, with the prompt `> ` before each one:

          - `borrow`, then a line with a title: print `You already have ` and the title when the card has it, otherwise `Your card is full` when it's full, and otherwise borrow the book and print `Borrowed ` and the title.
          - `return`, then a line with a title: give the book back and print `Returned ` and the title, or print the title and ` isn't on your card`.
          - `books`: print `Books: ` and the list of titles.
          - `quit`: print `See you soon` and return.
          - Anything else: print `Unknown command: ` and the command.

          `main` creates a card with the limit 3 and starts the user interface. For the input shown, the program prints:

          ```
          > Borrowed Emma
          > Borrowed Dune
          > You already have Emma
          > Borrowed Ivanhoe
          > Your card is full
          > Returned Dune
          > Dune isn't on your card
          > Borrowed Beloved
          > Books: [Emma, Ivanhoe, Beloved]
          > See you soon
          ```
