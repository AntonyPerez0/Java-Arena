                        System.out.print("> ");
                        String command = this.scanner.nextLine();
                        if (command.equals("quit")) {
                            System.out.println("See you soon");
                            break;
                        }
                        if (command.equals("borrow")) {
                            String title = this.scanner.nextLine();
                            if (this.card.has(title)) {
                                System.out.println("You already have " + title);
                            } else if (this.card.isFull()) {
                                System.out.println("Your card is full");
                            } else {
                                this.card.borrow(title);
                                System.out.println("Borrowed " + title);
                            }
                        } else if (command.equals("return")) {
                            String title = this.scanner.nextLine();
                            if (this.card.giveBack(title)) {
                                System.out.println("Returned " + title);
                            } else {
                                System.out.println(title + " isn't on your card");
                            }
                        } else if (command.equals("books")) {
                            System.out.println("Books: " + this.card.books());
                        } else {
                            System.out.println("Unknown command: " + command);
                        }
                    }
                }
            }
