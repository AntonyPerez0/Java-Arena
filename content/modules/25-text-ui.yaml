          import java.util.ArrayList;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  // Write the program here.
                  ArrayList<String> sightings = new ArrayList<>();
                  while (true) {
                      System.out.print("> ");
                      String command = scanner.nextLine();
                      if (command.equals("quit")) {
                          System.out.println("Happy birding!");
                          break;
                      }
                      if (command.equals("saw")) {
                          String species = scanner.nextLine();
                          sightings.add(species);
                          System.out.println("Noted: " + species);
                      } else if (command.equals("count")) {
                          String species = scanner.nextLine();
                          int count = 0;
                          for (String bird : sightings) {
                              if (bird.equals(species)) {
                                  count++;
                              }
                          }
                          System.out.println(species + ": " + count);
                      } else if (command.equals("total")) {
                          System.out.println("Birds seen: " + sightings.size());
                      } else {
                          System.out.println("Unknown command: " + command);
                      }
                  }
              }
          }
