      Campsite.java: |
        public class Campsite {
            // Write the instance variables, the constructor and the methods here.
            private int spots;
            private int taken;

            public Campsite(int spots) {
                this.spots = spots;
                this.taken = 0;
            }

            public boolean checkIn() {
                if (this.taken >= this.spots) {
                    return false;
                }
                this.taken++;
                return true;
            }

            public boolean checkOut() {
                if (this.taken == 0) {
                    return false;
                }
                this.taken--;
                return true;
            }

            public int freeSpots() {
                return this.spots - this.taken;
            }
        }
