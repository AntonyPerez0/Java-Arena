    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              // Create the variable for the taken spots here.
              int taken = 0;
              while (true) {
                  System.out.print("> ");
                  String command = scanner.nextLine();
                  if (command.equals("quit")) {
                      System.out.println("Lights out");
                      break;
                  }
                  // Handle arrive, depart, spots and unknown commands here.
                  if (command.equals("arrive")) {
                      if (taken < 3) {
                          taken++;
                          System.out.println("Welcome! Free spots: " + (3 - taken));
                      } else {
                          System.out.println("Sorry, the campsite is full");
                      }
                  } else if (command.equals("depart")) {
                      if (taken > 0) {
                          taken--;
                          System.out.println("Safe travels! Free spots: " + (3 - taken));
                      } else {
                          System.out.println("Nobody is camping");
                      }
                  } else if (command.equals("spots")) {
                      System.out.println("Free spots: " + (3 - taken));
                  } else {
                      System.out.println("Unknown command: " + command);
                  }
              }
          }
      }
    hints:
      - "`int taken = 0;` goes before the loop, so the count lasts from one command to the next. Inside the loop, it would be 0 again in every round."
      - "In the `arrive` branch, check `taken < 3` before adding one. In the `depart` branch, check `taken > 0` before taking one away. The free spots are `3 - taken`, in parentheses when it's part of a longer `+`."
