          - `deposit`, then a line with the amount: print `Balance: ` and the new balance.
          - `withdraw`, then a line with the amount: print `Balance: ` and the new balance, or `Not enough money`.
          - `history`: print `History: ` and the list, like `History: [50, -20]`.
          - `quit`: print `Goodbye` and return.
          - Anything else: print `Unknown command: ` and the command.

          For the input shown, the program prints:

          ```
          > Balance: 50
          > Balance: 30
          > Not enough money
          > Balance: 45
          > History: [50, -20, 15]
          > Goodbye
