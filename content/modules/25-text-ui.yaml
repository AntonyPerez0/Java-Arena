          A weather station's `Thermometer` used to keep a list of every reading. Someone rewrote it to keep only the number of readings and the lowest and highest one. The user interface didn't change, but the answers did: for the input shown, the program now says the lowest reading is 0, although no reading was 0. Fix `Thermometer`, keeping its public methods, so that the program answers as it did before. For the input shown, it prints:

          ```
          > Recorded 12
          > Recorded 17
          > Recorded 9
          > Lowest: 9
          > Highest: 17
          > Station off
          ```
