          QuizScore.java: |
            public class QuizScore {
                private int points;
                private int streak;

                public QuizScore() {
                    this.points = 0;
                    this.streak = 0;
                }

                public void answer(boolean correct) {
                    if (correct) {
                        this.points += 10;
                        this.streak++;
                        if (this.streak == 3) {
                            this.points += 5;
                            this.streak = 0;
                        }
                    } else {
                        this.streak = 0;
                    }
                }

                public int getPoints() {
                    return this.points;
                }
            }
