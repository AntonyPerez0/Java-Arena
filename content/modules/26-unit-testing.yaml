        solution:
          Roster.java: |
            import java.util.ArrayList;

            public class Roster {
                private int places;
                private ArrayList<String> names;

                public Roster(int places) {
                    this.places = places;
                    this.names = new ArrayList<>();
                }

                public boolean enroll(String name) {
                    if (this.isFull() || this.names.contains(name)) {
                        return false;
                    }
                    this.names.add(name);
                    return true;
                }

                public void drop(String name) {
                    this.names.remove(name);
                }

                public int size() {
                    return this.names.size();
                }

                public boolean isFull() {
                    return this.names.size() >= this.places;
                }
            }
