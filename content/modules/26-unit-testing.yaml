  - id: unit-testing-scanner-input
    slug: test-input
    title: Test input for a Scanner
    text: |
      Steps 1 and 5 of the checklist mean running a program again and again with the same input. Typing it every time is slow, and it's easy to type something a little different by mistake. Module 20 showed that a Scanner can read a String, and in module 25 the user interface was given its Scanner instead of making one. Put the two together, and any code that reads input can be tried with input written right in the code.

      The trick is that the method that reads doesn't make its own Scanner: it gets one as a parameter. A hiker writes down the kilometers walked each day, one number per line, and an empty line ends the list:

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              System.out.println(totalKilometers(new Scanner("12\n8\n15\n")));
              System.out.println(totalKilometers(new Scanner("7\n\n30\n")));
              System.out.println(totalKilometers(new Scanner("")));
          }

          public static int totalKilometers(Scanner scanner) {
              int total = 0;
              while (scanner.hasNextLine()) {
                  String line = scanner.nextLine();
                  if (line.isEmpty()) {
                      break;
                  }
                  total += Integer.valueOf(line);
              }
              return total;
          }
      }
      ```

      ```output
      35
      7
      0
      ```

      - Inside the quotes, `\n` is a line break, so `"12\n8\n15\n"` is three lines, just as if someone had typed 12, 8 and 15, pressing Enter after each.
      - `"7\n\n30\n"` has an empty line after the 7, so the method stops there and never reads the 30.
      - `""` has no lines at all, like input that ends right away. It's easy to write here, and awkward to try by typing.
      - In the finished program, `main` gives the method the keyboard: `totalKilometers(new Scanner(System.in))`. The method works the same either way, because it only uses the Scanner it was given.

      A method that makes its own `new Scanner(System.in)` inside can only ever read the keyboard. Taking the Scanner as a parameter is what makes it easy to try out.

      ### A check that says ok or wrong

      Printing the results still means comparing them in your head, every time. Let the program do that too: give it the input and the result it should give, and have it print whether it did.

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              check("12\n8\n15\n", 35);
              check("7\n\n30\n", 7);
              check("", 0);
              check("5\n", 5);
          }

          public static void check(String input, int expected) {
              int result = totalKilometers(new Scanner(input));
              if (result == expected) {
                  System.out.println("ok");
              } else {
                  System.out.println("WRONG: expected " + expected + " but got " + result);
              }
          }

          public static int totalKilometers(Scanner scanner) {
              int total = 0;
              while (scanner.hasNextLine()) {
                  String line = scanner.nextLine();
                  if (line.isEmpty()) {
                      break;
                  }
                  total += Integer.valueOf(line);
              }
              return total;
          }
      }
      ```

      ```output
      ok
      ok
      ok
      ok
      ```

      Now any change to `totalKilometers` can be checked in a second. Say someone changes `break` to `continue`, to skip empty lines instead of stopping at them. Then the second check prints `WRONG: expected 7 but got 37`, and you know at once, without typing a single number.

      Each call to `check` is a small **test**: an input, the result it should give, and a comparison. Tests like these, which check one method or one class on its own, are called **unit tests**. Writing a `check` method for every program gets tedious, though. The next step uses JUnit, a library that does the comparing and the reporting for you.

      **Your turn:** a band keeps its setlist as song titles, one per line. Write the method `longestTitle(Scanner scanner)`: it reads lines until the input ends and returns the longest title. If several are equally long, it returns the first of them, and if there are no lines at all, it returns an empty String. Use the Scanner the method gets as its parameter: `main` gives it the keyboard, and the check gives it a String. The check runs:

      ```java fragment
      System.out.println(longestTitle(new Scanner("Intro\nMidnight Train\nEncore\n")));
      ```

      and expects:

      ```
      Midnight Train
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println(longestTitle(scanner));
          }

          public static String longestTitle(Scanner scanner) {
              return "";
          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              System.out.println(longestTitle(scanner));
          }

          public static String longestTitle(Scanner scanner) {
              String longest = "";
              while (scanner.hasNextLine()) {
                  String title = scanner.nextLine();
                  if (title.length() > longest.length()) {
                      longest = title;
                  }
              }
              return longest;
          }
      }
    hints:
      - "Keep the longest title so far in a variable that starts as `\"\"`. Read with `while (scanner.hasNextLine())`, and compare each title's `length()` with the longest one's."
      - "Replace the longest only when the new title is strictly longer, `title.length() > longest.length()`, so the first of equally long titles stays. With no lines, the loop never runs and `\"\"` is returned."
    require:
      - pattern: new\s+Scanner\s*\(\s*System\.in\s*\)
        max: 1
        message: "Use the Scanner that `longestTitle` gets as its parameter. Don't make another one from `System.in`."
    tests:
      - call: System.out.println(longestTitle(new Scanner("Intro\nMidnight Train\nEncore\n")));
      - call: |
          System.out.println(longestTitle(new Scanner("Red\nBlue\nPink\nGrey\n")));
          System.out.println("[" + longestTitle(new Scanner("")) + "]");
          System.out.println(longestTitle(new Scanner("Hello Goodbye\n")));
        hidden: true
      - stdin: |
          Opening
          Slow Dance
          Finale
        hidden: true
