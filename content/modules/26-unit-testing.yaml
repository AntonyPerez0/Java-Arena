      RecipeBox.java: |
        import java.util.ArrayList;

        public class RecipeBox {
            private ArrayList<Recipe> recipes;

            public RecipeBox() {
                this.recipes = new ArrayList<>();
            }

            public void add(Recipe recipe) {
                this.recipes.add(recipe);
            }

            public Recipe find(String name) {
                for (Recipe recipe : this.recipes) {
                    if (recipe.getName().equals(name)) {
                        return recipe;
                    }
                }
                return null;
            }

            public int minutesFor(String name) {
                return this.find(name).getMinutes();
            }
        }
      Recipe.java: |
        public class Recipe {
            private String name;
            private int minutes;

            public Recipe(String name, int minutes) {
                this.name = name;
                this.minutes = minutes;
            }

            public String getName() {
                return this.name;
            }

            public int getMinutes() {
                return this.minutes;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                RecipeBox box = new RecipeBox();
                box.add(new Recipe("pancakes", 20));
                box.add(new Recipe("soup", 45));
                System.out.println(box.minutesFor("soup"));
                System.out.println(box.minutesFor("pizza"));
            }
        }
    solution:
      RecipeBox.java: |
        import java.util.ArrayList;

        public class RecipeBox {
            private ArrayList<Recipe> recipes;

            public RecipeBox() {
                this.recipes = new ArrayList<>();
            }

            public void add(Recipe recipe) {
                this.recipes.add(recipe);
            }

            public Recipe find(String name) {
                for (Recipe recipe : this.recipes) {
                    if (recipe.getName().equals(name)) {
                        return recipe;
                    }
                }
                return null;
            }

            public int minutesFor(String name) {
                Recipe recipe = this.find(name);
                if (recipe == null) {
                    return 0;
                }
                return recipe.getMinutes();
            }
        }
      Recipe.java: |
        public class Recipe {
            private String name;
            private int minutes;

            public Recipe(String name, int minutes) {
                this.name = name;
                this.minutes = minutes;
            }

            public String getName() {
                return this.name;
            }

            public int getMinutes() {
                return this.minutes;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                RecipeBox box = new RecipeBox();
                box.add(new Recipe("pancakes", 20));
                box.add(new Recipe("soup", 45));
                System.out.println(box.minutesFor("soup"));
                System.out.println(box.minutesFor("pizza"));
            }
        }
    hints:
      - "The first `at` line is `RecipeBox.minutesFor`, line 24 of `RecipeBox.java`, and the message says what was null there: the value `find` returned. So the fix goes in `minutesFor`, before `getMinutes()` is called."
      - "Keep what `find` returns in a variable, `Recipe recipe = this.find(name);`, then `if (recipe == null) { return 0; }`, and after that `return recipe.getMinutes();`."
