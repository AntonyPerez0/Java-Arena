      - task: |
          Reviews on a recipe site give 1 to 5 stars, and anything else is ignored. `average()` returns the average of the stars, and 0.0 when there are none. `ReviewsTest` has one test, which passes even on the broken versions below.

          Write tests that catch a version whose average drops the decimals (giving 4.0 for the stars 4 and 5, instead of 4.5), and two hidden versions with other bugs. Think about the edges: no reviews at all, and stars outside 1 to 5. Compare doubles with a delta, as in `assertEquals(4.5, reviews.average(), 0.001)`.
        seed:
          ReviewsTest.java: |
            import static org.junit.Assert.*;

            import org.junit.Test;

            public class ReviewsTest {
                @Test
                public void oneReviewIsItsOwnAverage() {
                    Reviews reviews = new Reviews();
                    reviews.add(4);
                    assertEquals(4.0, reviews.average(), 0.001);
                }
            }
          Reviews.java: |
            import java.util.ArrayList;

            public class Reviews {
                private ArrayList<Integer> stars;

                public Reviews() {
                    this.stars = new ArrayList<>();
                }

                public void add(int stars) {
                    if (stars >= 1 && stars <= 5) {
                        this.stars.add(stars);
                    }
                }

                public int count() {
                    return this.stars.size();
                }

                public double average() {
                    if (this.stars.isEmpty()) {
                        return 0.0;
                    }
                    int sum = 0;
                    for (int star : this.stars) {
                        sum += star;
                    }
                    return (double) sum / this.stars.size();
                }
            }
        solution:
          ReviewsTest.java: |
            import static org.junit.Assert.*;

            import org.junit.Test;

            public class ReviewsTest {
                @Test
                public void oneReviewIsItsOwnAverage() {
                    Reviews reviews = new Reviews();
                    reviews.add(4);
                    assertEquals(4.0, reviews.average(), 0.001);
                }

                @Test
                public void averageKeepsTheDecimals() {
                    Reviews reviews = new Reviews();
                    reviews.add(4);
                    reviews.add(5);
                    assertEquals(4.5, reviews.average(), 0.001);
                }

                @Test
                public void noReviewsAverageZero() {
                    Reviews reviews = new Reviews();
                    assertEquals(0.0, reviews.average(), 0.001);
                }

                @Test
                public void starsOutsideOneToFiveAreIgnored() {
                    Reviews reviews = new Reviews();
                    reviews.add(0);
                    reviews.add(6);
                    reviews.add(3);
                    assertEquals(1, reviews.count());
                    assertEquals(3.0, reviews.average(), 0.001);
                }
            }
