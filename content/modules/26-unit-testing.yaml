      - task: |
          `countLong` should count the words that have at least 5 letters, and `main` checks it with four inputs. But the method has a bug. What does the program print?
        predict: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  check("apple\nfig\nbanana\n", 2);
                  check("kiwi\n", 0);
                  check("", 0);
                  check("melon\nlemon\n", 2);
              }

              public static void check(String input, int expected) {
                  int result = countLong(new Scanner(input));
                  if (result == expected) {
                      System.out.println("ok");
                  } else {
                      System.out.println("WRONG: expected " + expected + " but got " + result);
                  }
              }

              public static int countLong(Scanner scanner) {
                  int count = 0;
                  while (scanner.hasNextLine()) {
                      if (scanner.nextLine().length() > 5) {
                          count++;
                      }
                  }
                  return count;
              }
          }
        hints:
          - "`> 5` counts only words of 6 letters or more, so a word of exactly 5 letters is missed. Go through each check's words and count what the method really counts."
          - "In the first check only `banana` is counted, so it's 1 instead of 2. `kiwi` and the empty input give 0 as they should. `melon` and `lemon` both have exactly 5 letters, so neither is counted."
      - task: |
          A lap timer reads lap times in seconds, one per line, until the input ends. Its method `readLaps` makes its own Scanner, so it can only ever read the keyboard, and nobody has tried it with no laps at all. Do two things:

          - Change `readLaps` to take the Scanner as a parameter, `readLaps(Scanner scanner)`, and make `main` give it `new Scanner(System.in)`.
          - With no laps, `fastest()` crashes. Make it return 0 then.

          The check runs:

          ```java fragment
          LapTimer timer = new LapTimer();
          timer.readLaps(new Scanner("62\n58\n60\n"));
          System.out.println(timer.count() + " laps, fastest " + timer.fastest());
          LapTimer none = new LapTimer();
          none.readLaps(new Scanner(""));
          System.out.println(none.count() + " laps, fastest " + none.fastest());
          ```

          and expects:

          ```
          3 laps, fastest 58
          0 laps, fastest 0
          ```
        seed:
          LapTimer.java: |
            import java.util.ArrayList;
            import java.util.Scanner;

            public class LapTimer {
                private ArrayList<Integer> laps;

                public LapTimer() {
                    this.laps = new ArrayList<>();
                }

                public void readLaps() {
                    Scanner scanner = new Scanner(System.in);
                    while (scanner.hasNextLine()) {
                        this.laps.add(Integer.valueOf(scanner.nextLine()));
                    }
                }

                public int count() {
                    return this.laps.size();
                }

                public int fastest() {
                    int fastest = this.laps.get(0);
                    for (int lap : this.laps) {
                        if (lap < fastest) {
                            fastest = lap;
                        }
                    }
                    return fastest;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    LapTimer timer = new LapTimer();
                    timer.readLaps();
                    System.out.println(timer.count() + " laps, fastest " + timer.fastest());
                }
            }
        solution:
          LapTimer.java: |
            import java.util.ArrayList;
            import java.util.Scanner;

            public class LapTimer {
                private ArrayList<Integer> laps;

                public LapTimer() {
                    this.laps = new ArrayList<>();
                }

                public void readLaps(Scanner scanner) {
                    while (scanner.hasNextLine()) {
                        this.laps.add(Integer.valueOf(scanner.nextLine()));
                    }
                }

                public int count() {
                    return this.laps.size();
                }

                public int fastest() {
                    if (this.laps.isEmpty()) {
                        return 0;
                    }
                    int fastest = this.laps.get(0);
                    for (int lap : this.laps) {
                        if (lap < fastest) {
                            fastest = lap;
                        }
                    }
                    return fastest;
                }
            }
          Main.java: |
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    LapTimer timer = new LapTimer();
                    timer.readLaps(new Scanner(System.in));
                    System.out.println(timer.count() + " laps, fastest " + timer.fastest());
                }
            }
        hints:
          - "Move the Scanner from the first line of `readLaps` into its parentheses: `public void readLaps(Scanner scanner)`. In `main`, call `timer.readLaps(new Scanner(System.in));`, and add `import java.util.Scanner;` to `Main.java`."
          - "`this.laps.get(0)` crashes on an empty list. Start `fastest()` with `if (this.laps.isEmpty()) { return 0; }`."
        require:
          - pattern: \bvoid\s+readLaps\s*\(\s*Scanner\s+\w+\s*\)
            message: "Give `readLaps` the Scanner as its parameter: `public void readLaps(Scanner scanner)`."
          - pattern: new\s+Scanner\s*\(\s*System\.in\s*\)
            max: 1
            message: "Make only one Scanner from `System.in`, in `main`, and give it to `readLaps`."
        tests:
