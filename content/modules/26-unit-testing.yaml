      - task: |
          A quiz gives 10 points for a right answer and nothing for a wrong one. Three right answers in a row give 5 bonus points, and then the count starts over. A wrong answer ends the streak. `QuizScoreTest` is right, but two of its tests fail on `QuizScore`.

          Run the tests and read the report: each failing test's name says which rule is broken. Fix `QuizScore` one bug at a time, running the tests after each fix. The checks run the tests of `QuizScoreTest` as they are given here, and more tests of their own.
        seed:
          QuizScore.java: |
            public class QuizScore {
                private int points;
                private int streak;

                public QuizScore() {
                    this.points = 0;
                    this.streak = 0;
                }

                public void answer(boolean correct) {
                    if (correct) {
                        this.points += 10;
                        this.streak++;
                        if (this.streak > 3) {
                            this.points += 5;
                            this.streak = 0;
                        }
                    }
                }

                public int getPoints() {
                    return this.points;
                }
            }
          QuizScoreTest.java: |
            import static org.junit.Assert.*;

            import org.junit.Before;
            import org.junit.Test;

            public class QuizScoreTest {
                private QuizScore score;

