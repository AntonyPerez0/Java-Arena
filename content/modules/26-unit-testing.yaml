      - task: |
          On moving day, the list of boxes is read from a Scanner, one box per line, until the input ends. A line that starts with `x ` (an x and a space) is a box that's on the van already, like `x books`, and any other line is a box still to load. Empty lines are skipped. Write `MovingBoxes` so the tests of `MovingBoxesTest` pass:

          - `read(Scanner scanner)` reads the lines. Calling it again reads more boxes onto the same list.
          - `loadedCount()` returns how many boxes are on the van, and `leftToLoad()` how many are not.
          - `isDone()` returns `true` when no box is left to load.

          The checks run the tests of `MovingBoxesTest` as they are given here (changing them won't help), and more tests of their own.
