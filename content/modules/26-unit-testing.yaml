  - id: unit-testing-review
    slug: end-of-part-6
    title: Putting it all together
    text: |
      This module's tools, side by side:

      | Tool | Example |
      | --- | --- |
      | Input for a Scanner, written in the code | `new Scanner("12\n8\n")` |
      | A test method | `@Test public void parkingTakesOneSpot()` |
      | Compare with the expected value | `assertEquals(2, garage.freeSpots())` |
      | Compare doubles, with a delta | `assertEquals(33.33, garage.percentFull(), 0.01)` |
      | Check a boolean | `assertTrue(garage.park())`, `assertFalse(garage.park())` |
      | The same start for every test | `@Before` |

      The last one is new. When every test starts by making the same object, the test class can do that in one place: a method marked `@Before` runs before each test. It puts the object in an instance variable of the test class, and the tests use it from there.

      Here it is in the tests of a poll, which reads its answers from a Scanner. The tests give it Strings, so the idea of the second step and JUnit work together:

      ```java test
      // ==== Poll.java ====
      import java.util.Scanner;

      public class Poll {
          private int yes;
          private int no;

          public Poll() {
              this.yes = 0;
              this.no = 0;
          }

          public void readAnswers(Scanner scanner) {
              while (scanner.hasNextLine()) {
                  String answer = scanner.nextLine();
                  if (answer.equals("yes")) {
                      this.yes++;
                  } else if (answer.equals("no")) {
                      this.no++;
                  }
              }
          }

          public int yesVotes() {
              return this.yes;
          }

          public int noVotes() {
              return this.no;
          }

          public boolean passes() {
              return this.yes > this.no;
          }
      }
      // ==== PollTest.java ====
      import static org.junit.Assert.*;

      import java.util.Scanner;
      import org.junit.Before;
      import org.junit.Test;

      public class PollTest {
          private Poll poll;

          @Before
          public void setUp() {
              this.poll = new Poll();
          }

          @Test
          public void countsBothAnswers() {
              this.poll.readAnswers(new Scanner("yes\nno\nyes\n"));
              assertEquals(2, this.poll.yesVotes());
              assertEquals(1, this.poll.noVotes());
          }

          @Test
          public void otherLinesAreIgnored() {
              this.poll.readAnswers(new Scanner("maybe\n\nyes\n"));
              assertEquals(1, this.poll.yesVotes());
              assertEquals(0, this.poll.noVotes());
          }

          @Test
          public void moreYesThanNoPasses() {
              this.poll.readAnswers(new Scanner("yes\nno\nyes\n"));
              assertTrue(this.poll.passes());
          }

          @Test
          public void tieDoesNotPass() {
              this.poll.readAnswers(new Scanner("no\nyes\n"));
              assertFalse(this.poll.passes());
          }
      }
      ```

      ```output
      PollTest: 4 tests
        countsBothAnswers: passed
        moreYesThanNoPasses: passed
        otherLinesAreIgnored: passed
        tieDoesNotPass: passed
      4 of 4 tests passed
      ```

      - `import org.junit.Before;` brings in `@Before`, and `java.util.Scanner` is imported as in any class that uses it.
      - `private Poll poll;` is an instance variable of the test class, and `setUp()`, marked `@Before`, gives it a new Poll.
      - JUnit makes a new PollTest object for every test, and runs `setUp()` on it before the test. So every test gets a new, empty Poll of its own: the three answers of `countsBothAnswers` never reach `tieDoesNotPass`.
      - Each test gives `readAnswers` exactly the input it's about, from an empty line to a tie, with no typing.

      ### The end of part 6

      This step ends the material of the MOOC's sixth part. Part 6 put lists inside objects: a class kept a list in an instance variable, and its methods decided what could be done with it. Then programs were split in two, with the program's logic in classes of its own and a user interface class that reads the commands and prints the answers, so that each part can change without the other. This module was about knowing that it all works: reading a stack trace, troubleshooting step by step, giving code its input from a String, and unit tests with JUnit, written after the code or before it. Next, part 7 looks at different ways to structure a program, and at algorithms for sorting and searching. Part 6 closes with [the MOOC's page on complex programs](https://java-programming.mooc.fi/part-6/4-complex-programs) on its own site, for reading only.

      **Your turn:** a timesheet reads the hours worked each day, one number per line, until the input ends. Empty lines are skipped, and reading goes on after them. `totalHours()` adds up the hours, and `overtimeDays()` counts the days of more than 8 hours. `TimesheetTest` makes a new Timesheet before each test with `@Before`, and has one test.

      Write tests that give `read` its input as a String, and that catch a Timesheet that counts a day of exactly 8 hours as overtime. Two more versions, hidden, have bugs in how they read the lines.
