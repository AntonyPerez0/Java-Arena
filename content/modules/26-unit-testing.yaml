            }
        }
    solution:
      WaterBottle.java: |
        public class WaterBottle {
            private int capacity;
            private int left;

            public WaterBottle(int capacity) {
                this.capacity = capacity;
                this.left = capacity;
            }

            public void drink(int ml) {
                if (ml > this.left) {
                    this.left = 0;
                } else {
                    this.left = this.left - ml;
                }
            }

            public void refill() {
                this.left = this.capacity;
            }

            public int left() {
                return this.left;
            }
        }
      WaterBottleTest.java: |
        import static org.junit.Assert.*;

        import org.junit.Test;

        public class WaterBottleTest {
            @Test
            public void newBottleIsFull() {
                WaterBottle bottle = new WaterBottle(750);
                assertEquals(750, bottle.left());
            }

            @Test
            public void drinkingTakesWater() {
                WaterBottle bottle = new WaterBottle(750);
                bottle.drink(200);
                assertEquals(550, bottle.left());
            }

            @Test
            public void cannotDrinkMoreThanIsLeft() {
                WaterBottle bottle = new WaterBottle(500);
                bottle.drink(300);
                bottle.drink(300);
                assertEquals(0, bottle.left());
            }

            @Test
            public void refillFillsItUp() {
                WaterBottle bottle = new WaterBottle(500);
                bottle.drink(450);
                bottle.refill();
                assertEquals(500, bottle.left());
            }
        }
    hints:
