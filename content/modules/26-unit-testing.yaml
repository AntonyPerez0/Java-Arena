      - task: |
          A packing list for a trip is read from a Scanner, one item per line, until the input ends. A line that starts with `x ` (an x and a space) is an item that's packed already, like `x tent`, and any other line is an item still to pack. Empty lines are skipped. Write `PackingList` so the tests of `PackingListTest` pass:

          - `read(Scanner scanner)` reads the lines. Calling it again reads more items onto the same list.
          - `packedCount()` returns how many items are packed, and `leftToPack()` how many are not.
          - `isReady()` returns `true` when nothing is left to pack.

          The checks run the tests of `PackingListTest` as they are given here, and more tests of their own.
