          Countdown.java: |
            public class Countdown {
                private int start;
                private int seconds;

                public Countdown(int seconds) {
                    this.start = seconds;
                    this.seconds = seconds;
                }

                public void tick() {
                    if (this.seconds > 0) {
                        this.seconds--;
                    }
                }

                public void reset() {
                    this.seconds = this.start;
                }

                public int secondsLeft() {
                    return this.seconds;
                }
            }
