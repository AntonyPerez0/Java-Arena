            import static org.junit.Assert.*;

            import org.junit.Test;

            public class SetlistTest {
                @Test
                public void longestSongInTheMiddleIsFound() {
                    Setlist setlist = new Setlist();
                    setlist.add(new Song("Intro", 95));
                    setlist.add(new Song("Long Road", 410));
                    setlist.add(new Song("Encore", 200));
                    assertEquals("Long Road", setlist.longestSong());
                }

                @Test
                public void longestSongAtTheEndIsFound() {
                    Setlist setlist = new Setlist();
                    setlist.add(new Song("Intro", 95));
                    setlist.add(new Song("Encore", 300));
                    assertEquals("Encore", setlist.longestSong());
                }

                @Test
                public void firstOfEquallyLongSongsWins() {
                    Setlist setlist = new Setlist();
                    setlist.add(new Song("Blue", 180));
                    setlist.add(new Song("Green", 180));
                    assertEquals("Blue", setlist.longestSong());
                }

                @Test
                public void emptySetlistGivesEmptyTitle() {
                    Setlist setlist = new Setlist();
                    assertEquals("", setlist.longestSong());
                }
            }
