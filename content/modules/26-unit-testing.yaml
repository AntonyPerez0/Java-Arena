    solution:
      CoffeeMachine.java: |
        public class CoffeeMachine {
            private int capacity;
            private int left;

            public CoffeeMachine(int capacity) {
                this.capacity = capacity;
                this.left = capacity;
            }

            public void brew(int ml) {
                if (ml > this.left) {
                    this.left = 0;
                } else {
                    this.left = this.left - ml;
                }
            }

            public void refill() {
                this.left = this.capacity;
            }

            public int left() {
                return this.left;
            }
        }
      CoffeeMachineTest.java: |
        import static org.junit.Assert.*;

        import org.junit.Test;

        public class CoffeeMachineTest {
            @Test
            public void newMachineIsFull() {
                CoffeeMachine machine = new CoffeeMachine(750);
                assertEquals(750, machine.left());
            }

            @Test
            public void brewingUsesWater() {
                CoffeeMachine machine = new CoffeeMachine(750);
                machine.brew(200);
                assertEquals(550, machine.left());
            }

            @Test
            public void cannotUseMoreThanIsLeft() {
                CoffeeMachine machine = new CoffeeMachine(500);
                machine.brew(300);
                machine.brew(300);
                assertEquals(0, machine.left());
            }

            @Test
            public void refillFillsItUp() {
                CoffeeMachine machine = new CoffeeMachine(500);
                machine.brew(450);
                machine.refill();
                assertEquals(500, machine.left());
            }
        }
    hints:
