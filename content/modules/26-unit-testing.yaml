                @Test
                public void countsPackedAndLeft() {
                    this.list.read(new Scanner("x tent\nsleeping bag\nx stove\n"));
                    assertEquals(2, this.list.packedCount());
                    assertEquals(1, this.list.leftToPack());
                }

                @Test
                public void emptyLinesAreSkipped() {
                    this.list.read(new Scanner("boots\n\nx map\n"));
                    assertEquals(1, this.list.packedCount());
                    assertEquals(1, this.list.leftToPack());
                }

                @Test
                public void readyWhenEverythingIsPacked() {
                    this.list.read(new Scanner("x tent\nx map\n"));
                    assertTrue(this.list.isReady());
                }

                @Test
                public void notReadyWithSomethingLeft() {
                    this.list.read(new Scanner("x tent\nboots\n"));
                    assertFalse(this.list.isReady());
                }
            }
        hints:
          - "The tests only ask for counts, so two `int` instance variables are enough: how many items are packed and how many are left. `read` goes through the lines with `while (scanner.hasNextLine())`."
          - "For each line: `if (line.startsWith(\"x \")) { this.packed++; } else if (!line.isEmpty()) { this.left++; }`. `isReady()` is `return this.left == 0;`."
