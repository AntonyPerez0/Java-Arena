          A band's setlist holds its songs, and each song knows its title and length in seconds. `longestSong()` returns the title of the longest song. If several are equally long, it returns the first of them, and with no songs it returns an empty String. The test in `SetlistTest` finds a longest song in the middle of the list, which even buggy versions get right.

          Write tests for the edges: the longest song at the end of the list, two songs that are equally long, and a setlist with no songs. `assertEquals` compares Strings too. The checks run your tests on the Setlist as it is and on three versions with a bug; one of them is shown: a Setlist that never looks at the last song.
