    more:
      - task: |
          Here is a crash from a program you can't see:

          ```crash
          Exception in thread "main" java.lang.IndexOutOfBoundsException: Index 4 out of bounds for length 4
          	at Shelf.bookAt(Shelf.java:18)
          	at Library.lastBookOn(Library.java:31)
          	at Main.main(Main.java:9)
          ```

          Fill in the blanks: the class whose code was running when it crashed, the method of `Library` that called it, and the line of `Library.java` that made the call.
        fill: |
          public class Main {
              public static void main(String[] args) {
                  String crashedClass = "[[Shelf]]";
                  String caller = "[[lastBookOn]]";
                  int callerLine = [[31]];
                  System.out.println(crashedClass + " crashed, called by " + caller + " on line " + callerLine);
              }
          }
        hints:
          - "The top `at` line is where the crash happened, and the line under it is the method that called it."
          - "It crashed in `Shelf` (in its method `bookAt`), which was called by `lastBookOn` on line 31 of `Library.java`."
        tests:
          - expect: Shelf crashed, called by lastBookOn on line 31
      - task: |
          A bike shop rents bikes for 3 euros for the first hour and 2 euros for every hour after it. So 1 hour costs 3 euros, 2 hours cost 5 and 3 hours cost 7. Today three bikes were rented, for 1, 3 and 2 hours, and the program should print `Earnings: 15 euros`, but it prints `Earnings: 17 euros`. Nothing crashes, so no line is named for you.

          Use the checklist: try the methods one at a time with values you know the answer for, find the one wrong line, and fix it. The program then prints:

          ```
          Earnings: 15 euros
          ```
        seed:
          Rental.java: |
            public class Rental {
                private int hours;

                public Rental(int hours) {
                    this.hours = hours;
                }

                public int fee() {
                    if (this.hours <= 1) {
                        return 3;
                    }
                    return 3 + this.hours * 2;
                }
            }
          BikeShop.java: |
            import java.util.ArrayList;

            public class BikeShop {
                private ArrayList<Rental> rentals;

                public BikeShop() {
                    this.rentals = new ArrayList<>();
                }

                public void rent(int hours) {
                    this.rentals.add(new Rental(hours));
                }

                public int earnings() {
                    int total = 0;
                    for (Rental rental : this.rentals) {
                        total += rental.fee();
                    }
                    return total;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    BikeShop shop = new BikeShop();
                    shop.rent(1);
                    shop.rent(3);
                    shop.rent(2);
                    System.out.println("Earnings: " + shop.earnings() + " euros");
                }
            }
        solution:
          Rental.java: |
            public class Rental {
                private int hours;

                public Rental(int hours) {
                    this.hours = hours;
                }

                public int fee() {
                    if (this.hours <= 1) {
                        return 3;
                    }
                    return 3 + (this.hours - 1) * 2;
                }
            }
          BikeShop.java: |
            import java.util.ArrayList;

            public class BikeShop {
                private ArrayList<Rental> rentals;

                public BikeShop() {
                    this.rentals = new ArrayList<>();
                }

                public void rent(int hours) {
                    this.rentals.add(new Rental(hours));
                }

                public int earnings() {
                    int total = 0;
                    for (Rental rental : this.rentals) {
                        total += rental.fee();
                    }
                    return total;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    BikeShop shop = new BikeShop();
                    shop.rent(1);
                    shop.rent(3);
                    shop.rent(2);
                    System.out.println("Earnings: " + shop.earnings() + " euros");
                }
            }
        hints:
          - "Narrow it down: in `main`, print `new Rental(1).fee()`, `new Rental(2).fee()` and `new Rental(3).fee()`. You know they should be 3, 5 and 7. Which ones are wrong?"
          - "A 2-hour rental comes out as 7 instead of 5: `fee` charges 2 euros for every hour, the first one too, although the first hour is already in the 3 euros. The extra hours are `this.hours - 1`."
        tests:
          - call: |
              BikeShop shop = new BikeShop();
              shop.rent(1);
              shop.rent(3);
              shop.rent(2);
              System.out.println("Earnings: " + shop.earnings() + " euros");
          - call: |
              System.out.println(new Rental(1).fee() + " " + new Rental(2).fee() + " " + new Rental(5).fee());
            hidden: true
          - call: |
              BikeShop shop = new BikeShop();
              System.out.println(shop.earnings());
              shop.rent(10);
              shop.rent(4);
              System.out.println(shop.earnings());
            hidden: true
