id: unit-testing
summary: Finding bugs step by step, and tests that check your code for you. Reading a stack trace through several classes, a checklist for troubleshooting, giving code that reads a Scanner its input from a String, unit tests with JUnit and its assertions, choosing good test cases, and test-driven development. The end of MOOC part 6.
steps:
  - id: unit-testing-troubleshooting
    slug: troubleshooting
    title: Bugs and troubleshooting step by step
    text: |
      Every program has bugs at first, and finding them is a big part of programming. This module is about doing it on purpose and step by step: reading what Java tells you, narrowing a problem down, and then writing tests that check your code for you, every time it changes.

      ### Three kinds of errors

      | Kind | When it shows | What points to it |
      | --- | --- | --- |
      | A compile error | Before the program runs | javac names the file, the line and the problem |
      | A crash | While the program runs | The exception and its stack trace name the line |
      | A wrong result | After it runs, if you check | Nothing: you have to find it yourself |

      The first two tell you where to look. The third is the sneaky one: the program ends normally, and what it prints just isn't right. Nobody may notice for a long time, and that's why most of this module is about catching it.

      ### A stack trace through several classes

      Module 12 showed how to read a crash: the exception, its message, and the `at` lines, with the method that crashed at the top. That list of `at` lines is called a **stack trace**. In a program of several classes, each line names the class, the method and the file. A train has cars, and each car tells how full it is:

      ```java run crash
      public class Main {
          public static void main(String[] args) {
              Train train = new Train();
              train.addCar(new Car("A", 40, 31));
              train.addCar(new Car("Dining", 0, 0));
              train.addCar(new Car("B", 40, 12));
              train.printReport();
          }
      }
      // ==== Train.java ====
      import java.util.ArrayList;

      public class Train {
          private ArrayList<Car> cars;

          public Train() {
              this.cars = new ArrayList<>();
          }

          public void addCar(Car car) {
              this.cars.add(car);
          }

          public void printReport() {
              for (Car car : this.cars) {
                  System.out.println(car.getName() + ": " + car.percentFull() + "% full");
              }
          }
      }
      // ==== Car.java ====
      public class Car {
          private String name;
          private int seats;
          private int passengers;

          public Car(String name, int seats, int passengers) {
              this.name = name;
              this.seats = seats;
              this.passengers = passengers;
          }

          public String getName() {
              return this.name;
          }

          public int percentFull() {
              return 100 * this.passengers / this.seats;
          }
      }
      ```

      ```output
      A: 77% full
      ```

      ```crash
      Exception in thread "main" java.lang.ArithmeticException: / by zero
      	at Car.percentFull(Car.java:17)
      	at Train.printReport(Train.java:16)
      	at Main.main(Main.java:7)
      ```

      Read it from the top, one line at a time:

      - `at Car.percentFull(Car.java:17)`: the division on line 17 of `Car.java`, in the method `percentFull`, divided by zero.
      - `at Train.printReport(Train.java:16)`: `percentFull` was called by the train's `printReport`, on line 16 of `Train.java`.
      - `at Main.main(Main.java:7)`: and `printReport` was called on line 7 of `main`.

      Each line is a method that was still running, waiting for the method above it to return. The trace doesn't say which car it was, but the output does: car A was printed, so the crash came with the next car, the dining car, which has no seats. A car without seats is a real thing, so the fix belongs in `percentFull`: return 0 when `seats` is 0, before dividing.

      On your own computer, a stack trace often has lines from inside Java's own classes too, above yours. They start with `at java.base/`, for example when a list's `get` is given an index that doesn't exist. Java Arena leaves them out. When you see them, read down to the first line that names one of your own classes: that's the last place your code was.

      ### A checklist for troubleshooting

      When a program does something wrong and you don't see why, changing things at random usually makes it worse. Work through it step by step:

      1. **Make the bug happen again.** Find an input that shows it every time, as small as you can. Write down what the program should print for it, and what it prints.
      2. **Read everything Java tells you.** The first line of a compile error or a crash, and the first `at` line in your own code.
      3. **Narrow it down.** Find the first place where a value goes wrong. Try one method at a time with a value you know the answer for, or print values along the way (module 12).
      4. **Change one thing, then run again.** If it didn't help, undo it before you try something else.
      5. **Try the other cases again.** A fix for one input can break another input that worked before.
      6. **Clean up.** Remove the debug prints.

      Steps 1 and 5 mean running the same inputs again and again. The rest of this module shows how to make that automatic.

      **Your turn:** a recipe box keeps recipes, and `minutesFor` tells how long a recipe takes. The program crashes:

      ```crash
      Exception in thread "main" java.lang.NullPointerException: Cannot invoke "Recipe.getMinutes()" because the return value of "RecipeBox.find(String)" is null
      	at RecipeBox.minutesFor(RecipeBox.java:24)
      	at Main.main(Main.java:7)
      ```

      `find` returns `null` when the box has no recipe of that name, and `minutesFor` calls `getMinutes()` on what it got. Change `minutesFor` in `RecipeBox.java` so it returns 0 for a recipe that isn't in the box. `Main.java` is ready, and with it the program prints:

      ```
      45
      0
      ```
