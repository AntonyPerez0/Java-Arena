                    Concert evening = new Concert(200);
                    while (true) {
                        System.out.print("> ");
                        String command = scanner.nextLine();
                        if (command.equals("quit")) {
                            System.out.println("Box office closed");
                            break;
                        }
                        if (command.equals("afternoon")) {
                            sellTickets(afternoon, Integer.valueOf(scanner.nextLine()));
                        } else if (command.equals("evening")) {
                            sellTickets(evening, Integer.valueOf(scanner.nextLine()));
                        } else if (command.equals("status")) {
                            System.out.println("Afternoon: " + afternoon.ticketsLeft() + " left, evening: " + evening.ticketsLeft() + " left");
                        } else {
                            System.out.println("Unknown command: " + command);
                        }
                    }
                }

                public static void sellTickets(Concert concert, int count) {
                    if (concert.sell(count)) {
                        System.out.println("Sold! Tickets left: " + concert.ticketsLeft());
                    } else {
                        System.out.println("Sorry, tickets left: " + concert.ticketsLeft());
                    }
                }
            }
          Concert.java: |
            public class Concert {
                private int seats;
                private int sold;

                public Concert(int seats) {
                    this.seats = seats;
                    this.sold = 0;
                }

                public boolean sell(int count) {
                    if (this.sold + count > this.seats) {
                        return false;
                    }
                    this.sold = this.sold + count;
                    return true;
                }

                public boolean refund(int count) {
                    if (count > this.sold) {
                        return false;
                    }
                    this.sold = this.sold - count;
                    return true;
                }

                public int getSold() {
                    return this.sold;
                }

                public int ticketsLeft() {
                    return this.seats - this.sold;
                }
            }
