      BikeDock.java: |
        public class BikeDock {
            // Write the instance variables, the constructor and the methods here.
            private int slots;
            private int bikes;

            public BikeDock(int slots, int bikes) {
                this.slots = slots;
                this.bikes = bikes;
            }

            public boolean rent(int count) {
                if (count > this.bikes) {
                    return false;
                }
                this.bikes = this.bikes - count;
                return true;
            }

            public boolean bringBack(int count) {
                if (count > this.freeSlots()) {
                    return false;
                }
                this.bikes = this.bikes + count;
                return true;
            }

            public int getBikes() {
                return this.bikes;
            }

            public int freeSlots() {
                return this.slots - this.bikes;
            }
        }
