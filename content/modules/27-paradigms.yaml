                public boolean rent(int count) {
                    if (count > this.bikes) {
                        return false;
                    }
                    this.bikes = this.bikes - count;
                    return true;
                }

                public boolean bringBack(int count) {
                    if (count > this.freeSlots()) {
                        return false;
                    }
                    this.bikes = this.bikes + count;
                    return true;
                }

                public int getBikes() {
                    return this.bikes;
                }

                public int freeSlots() {
                    return this.slots - this.bikes;
                }
            }
