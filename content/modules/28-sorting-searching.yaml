      - task: |
          A hiking trail's checkpoints are in an array, in the order of the walk out. Write the method `reverseInPlace(String[] checkpoints)`, which turns the same array around for the walk back: the last checkpoint becomes the first, and so on. Don't make a new array. Swap elements instead: the first with the last, the second with the second to last, and so on, up to the middle. The check runs:

          ```java fragment
          String[] checkpoints = {"Parking", "Lake", "Bridge", "Summit"};
          reverseInPlace(checkpoints);
          System.out.println(Arrays.toString(checkpoints));
          ```

          and expects:

          ```
          [Summit, Bridge, Lake, Parking]
