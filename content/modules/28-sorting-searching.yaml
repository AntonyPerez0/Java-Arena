        seed: |
          import java.util.Arrays;

          public class Main {
              public static void main(String[] args) {
                  String[] checkpoints = {"Parking", "Lake", "Bridge", "Summit"};
                  reverseInPlace(checkpoints);
                  System.out.println(Arrays.toString(checkpoints));
              }

              // Write the method reverseInPlace here.
          }
        solution: |
          import java.util.Arrays;

          public class Main {
              public static void main(String[] args) {
                  String[] checkpoints = {"Parking", "Lake", "Bridge", "Summit"};
                  reverseInPlace(checkpoints);
                  System.out.println(Arrays.toString(checkpoints));
              }

              public static void reverseInPlace(String[] checkpoints) {
                  for (int i = 0; i < checkpoints.length / 2; i++) {
                      int other = checkpoints.length - 1 - i;
                      String temp = checkpoints[i];
                      checkpoints[i] = checkpoints[other];
                      checkpoints[other] = temp;
                  }
              }
          }
        hints:
          - "The element at index `i` trades places with the one at `checkpoints.length - 1 - i`. Swap them with a `temp` variable, which here is a String."
          - "Stop in the middle: `for (int i = 0; i < checkpoints.length / 2; i++)`. A loop over the whole array would swap every pair twice, and put everything back where it was. With an odd count, the middle element stays where it is."
