        solution: |
          public class Main {
              public static void main(String[] args) {
                  int[] evens = new int[1000];
                  for (int i = 0; i < evens.length; i++) {
                      evens[i] = i * 2;
                  }
                  System.out.println(stepsNeeded(evens, 998));
                  System.out.println(stepsNeeded(evens, 1998));
                  System.out.println(stepsNeeded(evens, 7));
              }

              public static int stepsNeeded(int[] sorted, int wanted) {
                  int low = 0;
                  int high = sorted.length - 1;
                  int steps = 0;
                  while (low <= high) {
                      int middle = (low + high) / 2;
                      steps++;
                      if (sorted[middle] == wanted) {
                          return steps;
                      }
                      if (sorted[middle] < wanted) {
                          low = middle + 1;
                      } else {
                          high = middle - 1;
                      }
                  }
                  return steps;
              }
          }
