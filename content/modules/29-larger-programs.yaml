                    System.out.println("Rainy days: " + log.rainyDays());
                    System.out.println("Rain in all: " + log.totalRain() + " mm");
                    Day warmest = log.warmestDryDay();
                    if (warmest == null) {
                        System.out.println("No dry days");
                    } else {
                        System.out.println("Warmest dry day: " + warmest);
                    }
                }
            }
