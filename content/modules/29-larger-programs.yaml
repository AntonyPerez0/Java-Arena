      - task: |
          A bus timetable is being built one piece at a time. Times are written as numbers, so 615 is 6:15. `nextAfter` is written, and `count` is still a placeholder. What does this test drive print?
        predict: |
          public class Main {
              public static void main(String[] args) {
                  Timetable bus = new Timetable();
                  bus.add(615);
                  bus.add(640);
                  bus.add(710);
                  System.out.println(bus.nextAfter(600));
                  System.out.println(bus.nextAfter(640));
                  System.out.println(bus.nextAfter(800));
                  System.out.println(bus.count());
              }
