          At a fishing competition, the length of each fish caught is typed in, in whole centimeters, one per line. A `0` ends the input. The rule: a fish shorter than 25 cm is released back into the water, so it doesn't count in the average or the longest, but it's counted as caught and as released. Print:

          - `Fish caught: ` and the number of fish caught, kept and released together.
          - If at least one fish was caught: `Released: `, the share of released fish as a percentage, calculated as `100.0 * released / caught`, and `%`.
          - If at least one fish was kept: `Average length: `, the average length of the kept fish (calculated with `(double)`) and ` cm`, and then `Longest: `, the longest fish's length and ` cm`.

          For the input shown, the program prints:

          ```
          Fish caught: 5
          Released: 40.0%
          Average length: 41.0 cm
          Longest: 52 cm
          ```
