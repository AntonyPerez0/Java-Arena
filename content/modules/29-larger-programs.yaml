          UserInterface.java: |
            import java.util.Scanner;

            public class UserInterface {
                private Scanner scanner;
                private League league;

                public UserInterface(Scanner scanner, League league) {
                    this.scanner = scanner;
                    this.league = league;
                }

                public void start() {
                    while (true) {
                        System.out.print("> ");
                        String command = this.scanner.nextLine();
                        if (command.equals("quit")) {
                            System.out.println("Good night");
                            break;
                        }
                        if (command.equals("leader")) {
                            Player leader = this.league.leader();
                            if (leader == null) {
                                System.out.println("No players yet");
                            } else {
                                System.out.println("Leader: " + leader);
                            }
                        } else if (command.equals("add")) {
                            // Write the add command here.
                            String name = this.scanner.nextLine();
                            int points = this.toNumber(this.scanner.nextLine());
                            if (points < 0 || points > 10) {
                                System.out.println("Points must be a whole number from 0 to 10");
                            } else {
                                this.league.add(name, points);
                                System.out.println(this.league.find(name));
                            }
                        } else if (command.equals("compare")) {
                            // Write the compare command here.
                            String first = this.scanner.nextLine();
                            String second = this.scanner.nextLine();
                            Player one = this.league.find(first);
                            Player two = this.league.find(second);
                            if (one == null) {
                                System.out.println("No player called " + first);
                            } else if (two == null) {
                                System.out.println("No player called " + second);
                            } else if (one.total() > two.total()) {
                                System.out.println(first + " is ahead of " + second + ": " + one.total() + " to " + two.total());
                            } else if (two.total() > one.total()) {
                                System.out.println(second + " is ahead of " + first + ": " + two.total() + " to " + one.total());
                            } else {
                                System.out.println(first + " and " + second + " are tied at " + one.total());
                            }
                        } else {
                            System.out.println("Unknown command: " + command);
                        }
                    }
                }

                private int toNumber(String text) {
                    try {
                        return Integer.valueOf(text);
                    } catch (Exception e) {
                        return -1;
                    }
                }
            }
