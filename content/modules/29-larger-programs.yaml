        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int caught = 0;
                  int released = 0;
                  int kept = 0;
                  int total = 0;
                  int longest = 0;
                  while (true) {
                      int length = Integer.valueOf(scanner.nextLine());
                      if (length == 0) {
                          break;
                      }
                      caught++;
                      if (length < 25) {
                          released++;
                          continue;
                      }
                      kept++;
                      total += length;
                      if (length > longest) {
                          longest = length;
                      }
                  }
                  System.out.println("Fish caught: " + caught);
                  if (caught > 0) {
                      System.out.println("Released: " + 100.0 * released / caught + "%");
                  }
                  if (kept > 0) {
                      System.out.println("Average length: " + (double) total / kept + " cm");
                      System.out.println("Longest: " + longest + " cm");
                  }
              }
          }
        hints:
          - "Keep five counts before the loop: caught, released, kept, the total length of the kept fish, and the longest. Check for `0` right after reading, before anything is counted."
          - "Every fish adds one to `caught`. A fish under 25 cm then adds one to `released`, and `continue` skips the rest. Check `caught > 0` and `kept > 0` before dividing by them."
