          public class Main {
              public static void main(String[] args) {
                  ArrayList<Tally> tallies = new ArrayList<>();
                  Tally yes = new Tally("yes");
                  tallies.add(yes);
                  tallies.add(new Tally("no"));
                  tallies.add(yes);
                  String[] votes = "yes,no,yes,maybe".split(",");
                  for (String vote : votes) {
                      for (Tally tally : tallies) {
                          if (tally.getLabel().equals(vote)) {
                              tally.add();
                          }
                      }
                  }
                  ArrayList<Integer> counts = new ArrayList<>();
                  for (Tally tally : tallies) {
                      counts.add(tally.getCount());
                  }
                  Collections.sort(counts);
                  System.out.println(tallies.size());
                  System.out.println(yes);
                  System.out.println(counts);
              }
          }
          // ==== Tally.java ====
          public class Tally {
              private String label;
              private int count;

              public Tally(String label) {
                  this.label = label;
                  this.count = 0;
              }

              public String getLabel() {
                  return this.label;
              }

              public int getCount() {
                  return this.count;
              }

              public void add() {
                  this.count++;
              }

              public String toString() {
                  return this.label + ": " + this.count;
              }
          }
