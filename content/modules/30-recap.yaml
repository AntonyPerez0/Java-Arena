      - task: |
          A climber works through the gym's walls, numbered 1 to 6, in order. What does this program print?
        predict: |
          public class Main {
              public static void main(String[] args) {
                  int walls = 0;
                  int meters = 0;
                  for (int wall = 1; wall <= 6; wall++) {
                      if (wall % 2 == 0) {
                          continue;
                      }
                      if (wall == 5) {
                          break;
                      }
