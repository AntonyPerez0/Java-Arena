    solution:
      Main.java: |
        import java.util.ArrayList;
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner scanner = new Scanner(System.in);
                ArrayList<Project> projects = new ArrayList<>();
                while (true) {
                    String line = scanner.nextLine();
                    if (line.isEmpty()) {
                        break;
                    }
                    String[] parts = line.split(",");
                    projects.add(new Project(parts[0], parts[1], Integer.valueOf(parts[2])));
                }
                if (projects.isEmpty()) {
                    System.out.println("No projects");
                } else {
                    int total = 0;
                    for (Project project : projects) {
                        total += project.getHours();
                    }
                    double average = (double) total / projects.size();
                    System.out.println("Projects: " + projects.size());
                    System.out.println("Average: " + average + " hours");
                    System.out.println("Longer than average:");
                    for (Project project : projects) {
                        if (project.getHours() > average) {
                            System.out.println(project);
                        }
                    }
                }
            }
        }
