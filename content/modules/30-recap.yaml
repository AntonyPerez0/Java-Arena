          In a woodworking class, the students cut shelves of 45 cm from boards. The boards' lengths, in whole centimeters, are typed in one per line, until an empty line. From each board, the students cut as many whole shelves as fit, and what's left of the board is waste. Print:

          - `Boards: ` and the number of boards,
          - `Shelves: ` and the number of shelves cut from all the boards,
          - `Waste: `, the waste of all the boards added up, and ` cm`.

          For the input shown, the program prints:

          ```
          Boards: 4
          Shelves: 8
          Waste: 90 cm
          ```
