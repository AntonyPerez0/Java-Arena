          Cast.java: |
            import java.util.ArrayList;

            public class Cast {
                private ArrayList<Role> roles;

                public Cast() {
                    this.roles = new ArrayList<>();
                }

                public boolean add(Role role) {
                    // Replace the placeholders with the real code.
                    if (this.roles.contains(role)) {
                        return false;
                    }
                    this.roles.add(role);
                    return true;
                }

                public boolean recast(Role role) {
                    int index = this.roles.indexOf(role);
                    if (index < 0) {
                        return false;
                    }
                    this.roles.set(index, role);
                    return true;
                }

                public String studentFor(String play, String character) {
                    int index = this.roles.indexOf(new Role(play, character, ""));
                    if (index < 0) {
                        return null;
                    }
                    return this.roles.get(index).getStudent();
                }

                public ArrayList<Role> roles() {
                    return this.roles;
                }
            }
