  - id: recap-together
    slug: putting-it-together
    title: Putting it together
    text: |
      The last step puts the tools of the earlier steps into one program, the way module 29 did: a class for the data, a class for the logic, and a part that reads the input and prints the answers.

      ### The tools

      | Tool | What it does | Taught in |
      | --- | --- | --- |
      | an `ArrayList` of objects | many objects, and loops that ask them questions | module 19, Objects in a list |
      | `new Scanner(Paths.get(fileName))` in a `try` | reads a file, line by line | module 20, Reading files |
      | a class that keeps a list as an instance variable | the logic, apart from the input and output | module 24, Lists inside objects |
      | a loop that reads commands | a text user interface | module 25, Separating the UI from program logic |
      | `null` for "not found" | an answer the caller checks | module 22, Primitive and reference variables |
      | data class, logic class, input part | a plan for a program | module 29, Larger programs |

      ### A worked example

      A farmers' market has a file with one stall per line: the stall's number, the farm and what it sells. Visitors ask at the information desk, and the desk's program answers two commands: `stall`, with a number on the next line, and `sells`, with a word on the next line.

      ```file stalls.csv
      3,Hill Farm,honey
      7,Green Acre,apples
      12,Birch Dairy,cheese
      15,Old Orchard,apple juice
      ```

      ```java run
      import java.nio.file.Paths;
      import java.util.ArrayList;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Market market = readMarket("stalls.csv");
              Scanner scanner = new Scanner(System.in);
              while (true) {
                  System.out.print("> ");
                  String command = scanner.nextLine();
                  if (command.equals("quit")) {
                      System.out.println("Market closed");
                      break;
                  }
                  if (command.equals("stall")) {
                      int number = Integer.valueOf(scanner.nextLine());
                      Stall stall = market.find(number);
                      if (stall == null) {
                          System.out.println("No stall " + number);
                      } else {
                          System.out.println(stall);
                      }
                  } else if (command.equals("sells")) {
                      String word = scanner.nextLine();
                      ArrayList<Stall> found = market.selling(word);
                      if (found.isEmpty()) {
                          System.out.println("Nobody sells " + word);
                      }
                      for (Stall stall : found) {
                          System.out.println(stall);
                      }
                  } else {
                      System.out.println("Unknown command: " + command);
                  }
              }
          }

          public static Market readMarket(String fileName) {
              Market market = new Market();
              try (Scanner scanner = new Scanner(Paths.get(fileName))) {
                  while (scanner.hasNextLine()) {
                      String[] parts = scanner.nextLine().split(",");
                      if (parts.length < 3) {
                          continue;
                      }
                      market.add(new Stall(Integer.valueOf(parts[0]), parts[1], parts[2]));
                  }
              } catch (Exception e) {
                  System.out.println("Error: " + e.getMessage());
              }
              return market;
          }
      }
      // ==== Stall.java ====
      public class Stall {
          private int number;
          private String farm;
          private String product;

          public Stall(int number, String farm, String product) {
              this.number = number;
              this.farm = farm;
              this.product = product;
          }

          public int getNumber() {
              return this.number;
          }

          public String getProduct() {
              return this.product;
          }

          public String toString() {
              return "Stall " + this.number + ": " + this.farm + ", " + this.product;
          }
      }
      // ==== Market.java ====
      import java.util.ArrayList;

      public class Market {
          private ArrayList<Stall> stalls;

          public Market() {
              this.stalls = new ArrayList<>();
          }

          public void add(Stall stall) {
              this.stalls.add(stall);
          }

          public Stall find(int number) {
              for (Stall stall : this.stalls) {
                  if (stall.getNumber() == number) {
                      return stall;
                  }
              }
              return null;
          }

          public ArrayList<Stall> selling(String word) {
              ArrayList<Stall> found = new ArrayList<>();
              for (Stall stall : this.stalls) {
                  if (stall.getProduct().contains(word)) {
                      found.add(stall);
                  }
              }
              return found;
          }
      }
      ```

      ```input
      sells
      apple
      stall
      12
      stall
      20
      sells
      bread
      weigh
      quit
      ```

      ```output
      > Stall 7: Green Acre, apples
      Stall 15: Old Orchard, apple juice
      > Stall 12: Birch Dairy, cheese
      > No stall 20
      > Nobody sells bread
      > Unknown command: weigh
      > Market closed
      ```

      - `Stall` is the data, `Market` is the logic, and `main` reads the file and the commands. Market holds the list, and finds and filters stalls, but prints nothing: it answers with return values.
      - `find` returns `null` when no stall has the number, and the command loop turns that into a message. Calling a method on that `null` would crash the program.
      - `selling` is a filter: it puts the matching stalls in a new list and returns it. `contains` lets `apple` match both `apples` and `apple juice`.
      - `readMarket` is module 20's reading loop. It turns each line into one object, and skips a line with fewer than three parts instead of crashing on it.
      - Each command reads all its lines before it checks anything (module 29). With more commands, the loop would move into a `UserInterface` class of its own (module 25).

      **Your turn:** at the end of a woodworking course, each student's project is typed in, one per line, until an empty line: the student, the project and the hours it took, like `Ada,bird box,6`. `Project.java` is ready. In `Main.java`, read the projects into the `ArrayList<Project>`. The average isn't known until the last project has been read, so the list keeps them until then. After reading, print:

      - `Projects: ` and the number of projects,
      - `Average: `, the average hours as a `double` (the hours added up, divided by the number of projects), and ` hours`,
      - `Longer than average:`, and on the lines after it every project that took more hours than the average, in the order they were typed.

      With no projects, print only `No projects`. For the input shown, the program prints:

      ```
      Projects: 4
      Average: 7.5 hours
      Longer than average:
      Ben: stool, 11 hours
      Dev: bookshelf, 9 hours
      ```
    seed:
      Main.java: |
        import java.util.ArrayList;
        import java.util.Scanner;

