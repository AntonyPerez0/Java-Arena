id: recap
summary: "A warm-up for Java Programming II: practice with the tools of parts 1 to 7, one group at a time. Reading input in a loop, methods that take and return lists and arrays, taking text apart, a class with getters, toString and equals, and a small program of objects read from a file and answered with commands. MOOC section 8.1."
steps:
  - id: recap-input-loops
    slug: input-and-loops
    title: Reading input in a loop
    text: |
      This module opens Java Programming II, the second half of the course. It has nothing new in it: it's a warm-up. Module 29 ended with a list of everything parts 1 to 7 covered, and this module puts that list to work. Each step reminds you of one group of tools and names the module that taught them, works through one example, and then gives you three challenges. If a tool feels rusty, the module named next to it has the full story.

      ### The tools

      | Tool | What it does | Taught in |
      | --- | --- | --- |
      | `scanner.nextLine()` | reads one line of input as a String | module 2, Reading input and strings |
      | `Integer.valueOf(line)` | turns text such as `"42"` into the int 42 | module 3, Variables and types |
      | `if`, `else if`, `else` | picks one branch | module 5, Making decisions |
      | `while (true)` and `break` | repeats until something inside the loop ends it | module 8, Repeating with while |
      | `continue` | skips the rest of this round, and goes on with the next one | module 8, Repeating with while |
      | `for (int i = 0; i < n; i++)` | repeats a known number of times | module 9, Loop conditions and for |
      | `/` and `%` | whole-number division, and what's left over | module 4, Calculating with numbers |

      ### A worked example

      A climbing gym's front desk types in the age of each visitor, one per line, and `close` at the end of the day. At this gym, children under 6 can't climb, so they're only counted as turned away. Climbers under 16 pay the children's price of 8 euros, and everyone else pays 14.

      ```java run
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int children = 0;
              int adults = 0;
              int tooYoung = 0;
              int takings = 0;
              while (true) {
                  String line = scanner.nextLine();
                  if (line.equals("close")) {
                      break;
                  }
                  int age = Integer.valueOf(line);
                  if (age < 6) {
                      tooYoung++;
                      continue;
                  }
                  if (age < 16) {
                      children++;
                      takings += 8;
                  } else {
                      adults++;
                      takings += 14;
                  }
              }
              System.out.println("Climbers: " + (children + adults));
              System.out.println("Children: " + children + ", adults: " + adults);
              System.out.println("Too young to climb: " + tooYoung);
              System.out.println("Takings: " + takings + " euros");
          }
      }
      ```

      ```input
      34
      12
      4
      41
      15
      close
      ```

      ```output
      Climbers: 4
      Children: 2, adults: 2
      Too young to climb: 1
      Takings: 44 euros
      ```

      - The loop reads each line as a String and compares it with `close` first. Only a line that isn't the stop word becomes a number: `Integer.valueOf("close")` would crash the program with a NumberFormatException.
      - A visitor under 6 is counted in `tooYoung`, and `continue` skips the rest of the round, so that visitor never reaches the other counts.
      - Every count and total has its own variable. Each one is created before the loop, starts at 0, and is printed after the loop, when all the input has been read.
      - `(children + adults)` needs its parentheses. Without them, `"Climbers: " + children + adults` joins each number to the text in turn, and prints `Climbers: 22` (module 4).

      **Your turn:** at a school play, the ticket seller types each ticket sold at the door, one per line: `adult` or `child`. The word `curtain` ends the input when the play begins. An adult ticket costs 10 euros, and a child's ticket 6. Any other line is a typing mistake: it's only counted as a mistake. Fill in the blanks. For the input shown, the program prints:

      ```
      Tickets: 4
      Mistakes: 1
      Takings: 32 euros
      ```
    fill: |
