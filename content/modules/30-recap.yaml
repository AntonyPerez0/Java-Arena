          public class Main {
              public static void main(String[] args) {
                  int[] prices = {850, 600, 1200, 600};
                  int[] sorted = sortedCopy(prices);
                  System.out.println(Arrays.toString(sorted));
                  System.out.println(Arrays.toString(prices));
              }

              // Write the method sortedCopy here.
          }
        solution: |
          import java.util.Arrays;

          public class Main {
              public static void main(String[] args) {
                  int[] prices = {850, 600, 1200, 600};
                  int[] sorted = sortedCopy(prices);
                  System.out.println(Arrays.toString(sorted));
                  System.out.println(Arrays.toString(prices));
              }

              public static int[] sortedCopy(int[] prices) {
                  int[] copy = new int[prices.length];
                  for (int i = 0; i < prices.length; i++) {
                      copy[i] = prices[i];
                  }
                  Arrays.sort(copy);
                  return copy;
              }
          }
        hints:
          - "The method starts `public static int[] sortedCopy(int[] prices) {`. `int[] copy = new int[prices.length];` makes an array of the same size, full of zeros."
          - "Copy each price with `for (int i = 0; i < prices.length; i++) { copy[i] = prices[i]; }`, then `Arrays.sort(copy);` and `return copy;`. Sorting `prices` itself would change the caller's array."
