      - task: |
          At a chess tournament, the games are written down one per line: the player with the white pieces, the player with the black pieces, and the result, separated by commas, like `Mira,Jonas,1-0`. The result `1-0` means that white won, `0-1` that black won, and `1/2-1/2` is a draw. A win is worth 1 point, a draw half a point, and a loss nothing.

          The first line of input is a player's name. Then come games, until an empty line. Print how many games that player played, and their points, which are a `double`. Skip the games the player wasn't in. A name must match in full: `Ada` isn't in a game of `Adam`. For the input shown, the program prints:

          ```
          Mira played 4 games
          Points: 2.5
          ```
