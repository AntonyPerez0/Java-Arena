          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int boards = 0;
                  int shelves = 0;
                  int waste = 0;
                  while (true) {
                      String line = scanner.nextLine();
                      if (line.isEmpty()) {
                          break;
                      }
                      int length = Integer.valueOf(line);
                      boards++;
                      shelves += length / 45;
                      waste += length % 45;
                  }
                  System.out.println("Boards: " + boards);
                  System.out.println("Shelves: " + shelves);
                  System.out.println("Waste: " + waste + " cm");
              }
          }
        hints:
          - "Read in a `while (true)` loop, and `break` when the line `isEmpty()`. Keep three variables before the loop: the boards, the shelves and the waste."
          - "For a board of `length` centimeters, `length / 45` is how many whole shelves fit, and `length % 45` is the piece that's left over."
