        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  String player = scanner.nextLine();
                  int games = 0;
                  double points = 0;
                  while (true) {
                      String line = scanner.nextLine();
                      if (line.isEmpty()) {
                          break;
                      }
                      String[] parts = line.split(",");
                      String white = parts[0];
                      String black = parts[1];
                      String result = parts[2];
                      if (!white.equals(player) && !black.equals(player)) {
                          continue;
                      }
                      games++;
                      if (result.equals("1/2-1/2")) {
                          points += 0.5;
                      } else if (result.equals("1-0") && white.equals(player)) {
                          points += 1;
                      } else if (result.equals("0-1") && black.equals(player)) {
                          points += 1;
                      }
                  }
                  System.out.println(player + " played " + games + " games");
                  System.out.println("Points: " + points);
              }
          }
        hints:
