      import java.util.ArrayList;

      public class Main {
          public static void main(String[] args) {
              ArrayList<Integer> pieces = new ArrayList<>();
              pieces.add(240);
              pieces.add(310);
              pieces.add(195);
              pieces.add(300);
              pieces.add(200);
              System.out.println(between(pieces, 200, 300));
              System.out.println(pieces);
          }

          public static ArrayList<Integer> between(ArrayList<Integer> weights, int low, int high) {
              ArrayList<Integer> result = new ArrayList<>();
              for (int weight : weights) {
                  if (weight >= low && weight <= high) {
                      result.add(weight);
                  }
              }
              return result;
          }
      }
    hints:
      - "The method starts `public static ArrayList<Integer> between(ArrayList<Integer> weights, int low, int high) {`. Make a new, empty list first, and return it at the end."
      - "Go through `weights` with a for-each loop, and add a weight to the new list when `weight >= low && weight <= high`. Don't remove anything from `weights`: it's the caller's own list."
