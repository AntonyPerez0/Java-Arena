    more:
      - task: |
          A stall's prices are in cents, and `cheapest` gives back the cheapest ones. What does this program print? Watch what happens to the list that `main` hands the method.
        predict: |
          import java.util.ArrayList;
          import java.util.Collections;

          public class Main {
              public static void main(String[] args) {
                  ArrayList<Integer> prices = new ArrayList<>();
                  prices.add(450);
                  prices.add(200);
                  prices.add(325);
                  ArrayList<Integer> cheap = cheapest(prices, 2);
                  System.out.println(cheap);
                  System.out.println(prices);
                  System.out.println(cheap.size() + prices.size());
              }

              public static ArrayList<Integer> cheapest(ArrayList<Integer> prices, int count) {
                  Collections.sort(prices);
                  ArrayList<Integer> result = new ArrayList<>();
                  for (int i = 0; i < count; i++) {
                      result.add(prices.get(i));
                  }
                  return result;
              }
          }
        hints:
          - "`cheapest` sorts its parameter, and then copies the first `count` prices into a new list. The new list holds the two cheapest prices."
          - "The parameter `prices` is the same list as `main`'s `prices`, not a copy, so `main` sees it sorted too. The last line adds up the sizes of the two lists."
      - task: |
          A bakery stall lists its bread prices, in cents, in an array, in the order the loaves lie on the table. For the sign, it wants the prices sorted from the cheapest up, but the table order must stay as it is. Write the method `sortedCopy(int[] prices)`. It returns a new array with the same prices, sorted, and leaves the array it gets as it was. Make the new array with `new int[prices.length]`, copy the prices into it, and sort the copy with `Arrays.sort`. The check runs:

          ```java fragment
          int[] prices = {850, 600, 1200, 600};
          int[] sorted = sortedCopy(prices);
          System.out.println(Arrays.toString(sorted));
          System.out.println(Arrays.toString(prices));
          ```

          and expects:

          ```
          [600, 600, 850, 1200]
          [850, 600, 1200, 600]
          ```
        seed: |
