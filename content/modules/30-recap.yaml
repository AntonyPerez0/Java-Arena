          Main.java: |
            import java.nio.file.Paths;
            import java.util.ArrayList;
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    ArrayList<ChessPlayer> players = readPlayers("players.csv");
                    Scanner scanner = new Scanner(System.in);
                    // Write the command loop here.
                    while (true) {
                        System.out.print("> ");
                        String command = scanner.nextLine();
                        if (command.equals("quit")) {
                            System.out.println("Bye");
                            break;
                        }
                        if (command.equals("rating")) {
                            String name = scanner.nextLine();
                            ChessPlayer found = null;
                            for (ChessPlayer player : players) {
                                if (player.getName().equals(name)) {
                                    found = player;
                                }
                            }
                            if (found == null) {
                                System.out.println("No player called " + name);
                            } else {
                                System.out.println(found);
                            }
                        } else if (command.equals("above")) {
                            int limit = Integer.valueOf(scanner.nextLine());
                            int count = 0;
                            for (ChessPlayer player : players) {
                                if (player.getRating() > limit) {
                                    System.out.println(player);
                                    count++;
                                }
                            }
                            if (count == 0) {
                                System.out.println("Nobody above " + limit);
                            }
                        } else {
                            System.out.println("Unknown command: " + command);
                        }
                    }
                }

                public static ArrayList<ChessPlayer> readPlayers(String fileName) {
                    ArrayList<ChessPlayer> players = new ArrayList<>();
                    try (Scanner scanner = new Scanner(Paths.get(fileName))) {
                        while (scanner.hasNextLine()) {
                            String[] parts = scanner.nextLine().split(",");
                            if (parts.length < 2) {
                                continue;
                            }
                            players.add(new ChessPlayer(parts[0], Integer.valueOf(parts[1])));
                        }
                    } catch (Exception e) {
                        System.out.println("Error: " + e.getMessage());
                    }
                    return players;
                }
            }
