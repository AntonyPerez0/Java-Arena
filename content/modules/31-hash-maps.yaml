      - task: |
          A radio station takes song requests by text message, and people type the titles any way they like. The map `catalog` has every song the station can play, with the title in small letters as the key and the artist as the value. Read requests, one per line, until an empty line. Tidy each title with `trim()` and `toLowerCase()`, and then print either `Playing `, the tidied title, ` by ` and the artist, or `Not in the catalog: ` and the tidied title. For the input shown, the program prints:

          ```
          Playing night bus by Mira Vale
          Playing paper lanterns by The Quiet Hours
          Not in the catalog: blue tuesday
          ```
        seed: |
