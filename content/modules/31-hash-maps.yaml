        solution: |
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;

          public class Main {
              public static void main(String[] args) {
                  HashMap<String, Integer> plays = new HashMap<>();
                  plays.put("Night Bus", 7);
                  plays.put("Slow River", 2);
                  plays.put("Paper Lanterns", 5);
                  plays.put("Blue Tuesday", 9);
                  printReport(plays, 5);
              }

              public static void printReport(HashMap<String, Integer> plays, int atLeast) {
                  ArrayList<String> titles = new ArrayList<>();
                  int total = 0;
                  for (String title : plays.keySet()) {
                      total += plays.get(title);
                      if (plays.get(title) >= atLeast) {
                          titles.add(title);
                      }
                  }
                  Collections.sort(titles);
                  for (String title : titles) {
                      System.out.println(title + ": " + plays.get(title));
                  }
                  System.out.println("Plays in all: " + total);
              }
          }
        hints:
