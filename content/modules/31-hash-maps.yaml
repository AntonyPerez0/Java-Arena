      - The constructor creates the map.
      - `store(String tag, int shelf)` puts the bag on the shelf and returns `true`. If a bag with that tag is already stored, it changes nothing and returns `false`.
      - `shelfOf(String tag)` returns the bag's shelf, or -1 for a tag that isn't stored.
      - `pickUp(String tag)` hands the bag back: it removes the tag from the map and returns `true`. For a tag that isn't stored, it returns `false`.
      - `bagsStored()` returns how many bags are stored.

      `Main.java` is a test drive, and prints:

      ```
      true
      true
      false
      5 -1 2
      true false 1
      ```
