          A pantry keeps its jars in a `HashMap<String, Integer>`: each food, and how many jars of it there are. A food is in the map only while there's at least one jar of it. Write the method `useOne(HashMap<String, Integer> jars, String food)`. If the pantry has the food, the method takes one jar away and returns `true`, and when that was the last jar, it removes the food from the map. If the pantry has no such food, the method changes nothing and returns `false`. The check runs:

          ```java fragment
          HashMap<String, Integer> jars = new HashMap<>();
          jars.put("marmalade", 2);
          jars.put("olives", 1);
          System.out.println(useOne(jars, "marmalade") + " " + jars.get("marmalade"));
          System.out.println(useOne(jars, "olives") + " " + jars.containsKey("olives"));
          System.out.println(useOne(jars, "olives") + " " + jars.size());
          ```

          and expects:

          ```
          true 1
          true false
          false 1
          ```
