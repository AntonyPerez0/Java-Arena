                  jars.put("marmalade", 2);
                  jars.put("olives", 1);
                  System.out.println(useOne(jars, "marmalade") + " " + jars.get("marmalade"));
                  System.out.println(useOne(jars, "olives") + " " + jars.containsKey("olives"));
                  System.out.println(useOne(jars, "olives") + " " + jars.size());
              }

              // Write the method useOne here.
          }
        solution: |
          import java.util.HashMap;

          public class Main {
              public static void main(String[] args) {
                  HashMap<String, Integer> jars = new HashMap<>();
                  jars.put("marmalade", 2);
                  jars.put("olives", 1);
                  System.out.println(useOne(jars, "marmalade") + " " + jars.get("marmalade"));
                  System.out.println(useOne(jars, "olives") + " " + jars.containsKey("olives"));
                  System.out.println(useOne(jars, "olives") + " " + jars.size());
              }

              public static boolean useOne(HashMap<String, Integer> jars, String food) {
                  if (!jars.containsKey(food)) {
                      return false;
                  }
                  int left = jars.get(food) - 1;
                  if (left == 0) {
                      jars.remove(food);
                  } else {
                      jars.put(food, left);
                  }
                  return true;
              }
          }
        hints:
          - "Start with `if (!jars.containsKey(food)) { return false; }`. After that, the food is surely in the map, so `jars.get(food)` is a number, not `null`."
          - "Work out the jars that are left, `jars.get(food) - 1`. When that's 0, `remove` the food; otherwise `put` the new count, which replaces the old one."
