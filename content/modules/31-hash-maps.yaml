          AudioGuide.java: |
            import java.util.HashMap;

            public class AudioGuide {
                private HashMap<Integer, String> titles;
                private HashMap<Integer, Integer> plays;

                public AudioGuide() {
                    this.titles = new HashMap<>();
                    this.plays = new HashMap<>();
                }

                public void addStop(int number, String title) {
                    this.titles.put(number, title);
                }

                public String play(int number) {
                    if (!this.titles.containsKey(number)) {
                        return "No stop " + number;
                    }
                    this.plays.put(number, this.plays.getOrDefault(number, 0) + 1);
                    return this.titles.get(number);
                }

                public int playsOf(int number) {
                    return this.plays.getOrDefault(number, 0);
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    AudioGuide guide = new AudioGuide();
                    guide.addStop(12, "The Harbor at Dawn");
                    guide.addStop(27, "Bronze Horse");
                    System.out.println(guide.play(27));
                    System.out.println(guide.play(27));
                    System.out.println(guide.play(72));
                    System.out.println(guide.playsOf(27) + " " + guide.playsOf(12) + " " + guide.playsOf(72));
                }
