      - task: |
          Chat apps turn shortcodes such as `:tada:` into emoji. Write the method `expand(HashMap<String, String> emoji, String message)`. The map links shortcodes to the names of their emoji. The method returns the message with every word that is a shortcode in the map replaced by the emoji's name in square brackets. Other words stay as they are. The words of a message are separated by single spaces. The check runs:

          ```java fragment
          HashMap<String, String> emoji = new HashMap<>();
          emoji.put(":tada:", "party popper");
          emoji.put(":rocket:", "rocket");
          emoji.put(":coffee:", "hot beverage");
          System.out.println(expand(emoji, "Launch day :rocket: :tada:"));
          System.out.println(expand(emoji, ":coffee: first, then :eyes: code"));
          ```

          and expects:

          ```
          Launch day [rocket] [party popper]
          [hot beverage] first, then :eyes: code
          ```
        seed: |
