          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  HashMap<String, String> catalog = new HashMap<>();
                  catalog.put("paper lanterns", "The Quiet Hours");
                  catalog.put("night bus", "Mira Vale");
                  catalog.put("cedar smoke", "Juniper Road");
                  catalog.put("slow river", "The Quiet Hours");

                  // Read the requests here.
              }
          }
        solution: |
          import java.util.HashMap;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  HashMap<String, String> catalog = new HashMap<>();
                  catalog.put("paper lanterns", "The Quiet Hours");
                  catalog.put("night bus", "Mira Vale");
                  catalog.put("cedar smoke", "Juniper Road");
                  catalog.put("slow river", "The Quiet Hours");

                  while (true) {
                      String line = scanner.nextLine();
                      if (line.isEmpty()) {
                          break;
                      }
                      String title = line.trim().toLowerCase();
                      String artist = catalog.get(title);
                      if (artist == null) {
                          System.out.println("Not in the catalog: " + title);
                      } else {
                          System.out.println("Playing " + title + " by " + artist);
                      }
                  }
              }
          }
        hints:
          - "Read in a `while (true)` loop that stops with `break` at the empty line. Tidy each line with `line.trim().toLowerCase()` before looking it up."
          - "`catalog.get(title)` gives the artist, or `null` for a title the station doesn't have."
