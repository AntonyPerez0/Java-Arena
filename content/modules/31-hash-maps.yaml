      BagStorage.java: |
        import java.util.HashMap;

        public class BagStorage {
            private HashMap<String, Integer> shelves;

            public BagStorage() {
                this.shelves = new HashMap<>();
            }

            public boolean store(String tag, int shelf) {
                String key = tidy(tag);
                if (this.shelves.containsKey(key)) {
                    return false;
                }
                this.shelves.put(key, shelf);
                return true;
            }

            public int shelfOf(String tag) {
                return this.shelves.getOrDefault(tidy(tag), -1);
            }

            public boolean pickUp(String tag) {
                String key = tidy(tag);
                if (!this.shelves.containsKey(key)) {
                    return false;
                }
                this.shelves.remove(key);
                return true;
            }

            public int bagsStored() {
                return this.shelves.size();
            }

            private String tidy(String tag) {
                return tag.trim().toUpperCase();
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                BagStorage storage = new BagStorage();
                System.out.println(storage.store("B-417", 3));
                System.out.println(storage.store(" c-802", 5));
                System.out.println(storage.store("b-417 ", 1));
                System.out.println(storage.shelfOf("C-802") + " " + storage.shelfOf("A-100") + " " + storage.bagsStored());
                System.out.println(storage.pickUp("b-417") + " " + storage.pickUp("B-417") + " " + storage.bagsStored());
            }
        }
