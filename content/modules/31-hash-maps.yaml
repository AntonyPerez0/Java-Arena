              }

              // Write the method expand here.
          }
        solution: |
          import java.util.HashMap;

          public class Main {
              public static void main(String[] args) {
                  HashMap<String, String> emoji = new HashMap<>();
                  emoji.put(":tada:", "party popper");
                  emoji.put(":rocket:", "rocket");
                  emoji.put(":coffee:", "hot beverage");
                  System.out.println(expand(emoji, "Launch day :rocket: :tada:"));
                  System.out.println(expand(emoji, ":coffee: first, then :eyes: code"));
              }

              public static String expand(HashMap<String, String> emoji, String message) {
                  String result = "";
                  for (String word : message.split(" ")) {
                      String name = emoji.get(word);
                      if (name == null) {
                          result += word + " ";
                      } else {
                          result += "[" + name + "] ";
                      }
                  }
                  return result.trim();
              }
          }
        hints:
          - "Split the message into words with `message.split(\" \")` and go through them. `emoji.get(word)` is the name of the word's emoji, or `null` when the word isn't a shortcode in the map."
          - "Build the result in a String: add either the name in brackets or the word itself, and then a space. At the end, `trim()` removes the last space."
