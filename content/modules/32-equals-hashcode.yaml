  - id: equals-hashcode-objects-as-keys
    slug: objects-as-keys
    title: Objects as keys in practice
    text: |
      All the pieces are here now: a key class with `equals` and `hashCode`, and a `HashMap` that uses it. This step puts them to work in a small program, and deals with one more thing: the order in which to print what's in the map.

      ### A game board

      A board game keeps its pieces in a `HashMap<Square, String>`, from a square to the piece on it. Square is the class from steps 1 and 3, now with both methods. The class `Board` places pieces, looks up squares, moves pieces and prints them all:

      ```java run
      public class Main {
          public static void main(String[] args) {
              Board board = new Board();
              board.place(new Square("e", 1), "king");
              board.place(new Square("a", 1), "rook");
              board.place(new Square("e", 2), "pawn");
              board.move(new Square("e", 2), new Square("e", 4));
              System.out.println(board.pieceAt(new Square("e", 4)));
              System.out.println(board.pieceAt(new Square("e", 2)));
              board.printPieces();
          }
      }
      // ==== Board.java ====
      import java.util.ArrayList;
      import java.util.Collections;
      import java.util.HashMap;

      public class Board {
          private HashMap<Square, String> pieces;

          public Board() {
              this.pieces = new HashMap<>();
          }

          public void place(Square square, String piece) {
              this.pieces.put(square, piece);
          }

          public String pieceAt(Square square) {
              if (this.pieces.containsKey(square)) {
                  return this.pieces.get(square);
              }
              return "empty";
          }

          public void move(Square from, Square to) {
              if (this.pieces.containsKey(from)) {
                  String piece = this.pieces.get(from);
                  this.pieces.remove(from);
                  this.pieces.put(to, piece);
              }
          }

          public void printPieces() {
              ArrayList<String> lines = new ArrayList<>();
              for (Square square : this.pieces.keySet()) {
                  lines.add(square + " " + this.pieces.get(square));
              }
              Collections.sort(lines);
              for (String line : lines) {
                  System.out.println(line);
              }
          }
      }
      // ==== Square.java ====
      public class Square {
          private String column;
          private int row;

          public Square(String column, int row) {
              this.column = column;
              this.row = row;
          }

          public boolean equals(Object compared) {
              if (this == compared) {
                  return true;
              }
              if (!(compared instanceof Square)) {
                  return false;
              }
              Square other = (Square) compared;
              return this.column.equals(other.column) && this.row == other.row;
          }

          public int hashCode() {
              return 31 * this.column.hashCode() + this.row;
          }

          public String toString() {
              return this.column + this.row;
          }
      }
      ```

      ```output
      pawn
      empty
      a1 rook
      e1 king
      e4 pawn
      ```

      - Every method is given a Square made with `new`, never the object that was put in. `containsKey`, `get`, `put` and `remove` still find the right key, because Square has both `equals` and `hashCode`.
      - `remove(key)` takes a key and its value out of the map. `move` gets the piece, removes the old square, and puts the piece on the new one.
      - `pieceAt` checks `containsKey` first, so an empty square gives `empty` instead of `null`.

      ### The order of the keys

      `printPieces` goes through the keys with `keySet()`, as in module 31. A hash map goes through its keys in an order set by their hash codes, not in the order they were added, and it's no order to rely on. With keys of your own class, it depends on how `hashCode` is written. So `printPieces` makes its own order: it builds a line for each piece, puts the lines in a list, and sorts the list with `Collections.sort` (module 28). Square names sort well as Strings on this board: the column's letter first, then the row, which is always one digit.

      Two other ways to get an order you can count on:

      - Keep the keys in an `ArrayList` too, next to the map, in the order they were added. Go through the list, and get each value from the map.
      - Go through the keys you want in the order you want, such as the squares of one row from `a` to `h`, and look each one up with `containsKey` and `get`.

      One warning: never go through, or print, a hash map whose keys have no `hashCode` of their own. Their hash codes are Java's default ones, which can change from run to run, and the order would change with them.

      ### Keys that don't change

      A key goes into the bucket of the hash code it has when it's put in. If the key object changed later, its hash code would change too, and the map would look for it in the wrong bucket. So key classes usually have no setters: none of the key classes in this module can be changed once an object is made. That's why `move` doesn't change a Square: it removes the old key and puts in a new one.

      **Your turn:** a theater keeps its bookings in a `HashMap<Seat, String>`, from a seat to the name it's booked for. `Seat.java` is ready, with `equals`, `hashCode` and `toString`. Write the class `Bookings`, with:

      - a constructor without parameters, which creates the map
      - `book(Seat seat, String name)`, which books the seat for the name and returns `true`, or returns `false` and changes nothing when the seat is booked already
      - `holderOf(Seat seat)`, which returns the name the seat is booked for, or `free`
      - `cancel(Seat seat)`, which removes the seat's booking

      The check runs:

      ```java fragment
      Bookings bookings = new Bookings();
      System.out.println(bookings.book(new Seat("B", 7), "Ada"));
      System.out.println(bookings.book(new Seat("B", 7), "Ben"));
      System.out.println(bookings.holderOf(new Seat("B", 7)));
      bookings.cancel(new Seat("B", 7));
      System.out.println(bookings.holderOf(new Seat("B", 7)));
      ```

      and expects:

      ```
      true
      false
      Ada
      free
      ```
