                private int seat;

                public TrainSeat(int car, int seat) {
                    this.car = car;
                    this.seat = seat;
                }

                public boolean equals(Object compared) {
                    if (this == compared) {
                        return true;
                    }
                    if (!(compared instanceof TrainSeat)) {
                        return false;
                    }
                    TrainSeat other = (TrainSeat) compared;
                    return this.car == other.car && this.seat == other.seat;
                }

                public int hashCode() {
                    return Objects.hash(this.car, this.seat);
                }

                public String toString() {
                    return "car " + this.car + " seat " + this.seat;
                }
            }
          Main.java: |
            import java.util.ArrayList;
            import java.util.HashMap;
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    HashMap<TrainSeat, String> reserved = new HashMap<>();
                    ArrayList<TrainSeat> order = new ArrayList<>();
                    while (true) {
                        String line = scanner.nextLine();
                        if (line.isEmpty()) {
                            break;
                        }
                        String[] parts = line.split(" ");
                        TrainSeat seat = new TrainSeat(Integer.valueOf(parts[0]), Integer.valueOf(parts[1]));
                        if (reserved.containsKey(seat)) {
                            System.out.println("Taken: " + seat);
                        } else {
                            reserved.put(seat, parts[2]);
                            order.add(seat);
                            System.out.println("Reserved: " + seat + " for " + parts[2]);
                        }
                    }
                    System.out.println("Reservations:");
                    for (TrainSeat seat : order) {
                        System.out.println(seat + ": " + reserved.get(seat));
                    }
                }
            }
