        import java.util.Objects;

        public class Trip {
            private String from;
            private String to;

            public Trip(String from, String to) {
                this.from = from;
                this.to = to;
            }

            public boolean equals(Object compared) {
                if (this == compared) {
                    return true;
                }
                if (!(compared instanceof Trip)) {
                    return false;
                }
                Trip other = (Trip) compared;
                return this.from.toLowerCase().equals(other.from.toLowerCase()) && this.to.toLowerCase().equals(other.to.toLowerCase());
            }

            public int hashCode() {
                return Objects.hash(this.from.toLowerCase(), this.to.toLowerCase());
            }

            public String toString() {
                return this.from + " to " + this.to;
            }
        }
