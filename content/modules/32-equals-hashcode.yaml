            import java.util.HashMap;

            public class FareTable {
                private HashMap<String, Integer> fares;

                public FareTable() {
                    this.fares = new HashMap<>();
                }

                public void setFare(String station, int cents) {
                    this.fares.put(tidy(station), cents);
