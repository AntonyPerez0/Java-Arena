        solution:
          Color.java: |
            public class Color {
                private int red;
                private int green;
                private int blue;

                public Color(int red, int green, int blue) {
                    this.red = red;
                    this.green = green;
                    this.blue = blue;
                }

                public boolean equals(Object compared) {
                    if (this == compared) {
                        return true;
                    }
                    if (!(compared instanceof Color)) {
                        return false;
                    }
                    Color other = (Color) compared;
                    return this.red == other.red && this.green == other.green && this.blue == other.blue;
                }

                public String toString() {
                    return "(" + this.red + ", " + this.green + ", " + this.blue + ")";
                }
            }
          Main.java: |
            import java.util.ArrayList;

            public class Main {
                public static void main(String[] args) {
                    ArrayList<Color> pixels = new ArrayList<>();
                    pixels.add(new Color(255, 0, 0));
                    pixels.add(new Color(0, 0, 255));
                    pixels.add(new Color(255, 0, 0));
                    pixels.add(new Color(255, 255, 255));
                    pixels.add(new Color(0, 0, 255));
                    System.out.println(countColors(pixels));
                }

                public static int countColors(ArrayList<Color> pixels) {
                    ArrayList<Color> seen = new ArrayList<>();
                    for (Color pixel : pixels) {
                        if (!seen.contains(pixel)) {
                            seen.add(pixel);
                        }
                    }
                    return seen.size();
                }
            }
        hints:
          - "Color's `equals` is the classic one, with Color in place of Seat. All three values are ints, so the last line is `return this.red == other.red && this.green == other.green && this.blue == other.blue;`."
          - "In `countColors`, make an `ArrayList<Color> seen`, go through the pixels with a for-each loop, and add a pixel to `seen` when `!seen.contains(pixel)`. The answer is `seen.size()`. Without `equals`, `contains` finds nothing, and every pixel counts as a new color."
