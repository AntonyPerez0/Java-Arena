        import java.util.HashMap;

        public class Bookings {
            private HashMap<Seat, String> holders;

            public Bookings() {
                this.holders = new HashMap<>();
            }

            public boolean book(Seat seat, String name) {
                if (this.holders.containsKey(seat)) {
                    return false;
                }
                this.holders.put(seat, name);
                return true;
            }

            public String holderOf(Seat seat) {
                if (this.holders.containsKey(seat)) {
                    return this.holders.get(seat);
                }
                return "free";
            }

            public void cancel(Seat seat) {
                this.holders.remove(seat);
            }
        }
