          A drawing program keeps the color of every pixel of a small picture in a list. A color is three numbers from 0 to 255: how much red, green and blue it has. In `Color.java`, write `equals`: two colors are equal when all three numbers are the same. Then, in `Main.java`, write the method `countColors(ArrayList<Color> pixels)`, which returns how many different colors the picture uses. Keep a second list of the colors seen so far, and add a pixel's color to it only when an equal color isn't there yet. The check runs:

