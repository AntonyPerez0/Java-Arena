      - task: |
          The board game from the lesson wants to know which squares get the most traffic. Read the squares that tokens land on, such as `C4`, one per line, until an empty line, and count the landings on each square in a `HashMap<Square, Integer>`. After the empty line comes one more line: the number of a row. Print that row's squares from column A to F, one per line, each with how many times a token landed there, like `C4: 2`. A square nobody landed on gets 0.

          `Square.java` has the column, the row and a `toString` that gives names like `C4`: write its `equals` and `hashCode`. In `Main.java`, a line such as `C4` gives the column with `line.substring(0, 1)` and the row with `Integer.valueOf(line.substring(1))`. For the output, don't go through the map: go through the columns A to F (an array `{"A", "B", "C", "D", "E", "F"}` works well) and look each square up with a new Square. For the input shown, the program prints:

          ```
          A4: 0
          B4: 1
          C4: 2
          D4: 0
          E4: 0
          F4: 1
          ```
