          Work out buckets the way the table above does. Write the method `bucketOf(String key, int buckets)`, which returns the bucket of a key in a map with the given number of buckets: the remainder of the key's hash code divided by the number of buckets. A hash code can be negative, and then so is the remainder, so return it without its minus sign (`Math.abs`, module 7). The check runs:

