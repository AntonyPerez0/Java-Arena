          Coin.java: |
            import java.util.Objects;

            public class Coin {
                private String country;
                private int year;
                private int cents;

                public Coin(String country, int year, int cents) {
                    this.country = country;
                    this.year = year;
                    this.cents = cents;
                }

                public boolean equals(Object compared) {
                    if (this == compared) {
                        return true;
                    }
                    if (!(compared instanceof Coin)) {
                        return false;
                    }
                    Coin other = (Coin) compared;
                    return this.country.equals(other.country) && this.year == other.year && this.cents == other.cents;
                }

                public int hashCode() {
                    return Objects.hash(this.country, this.year, this.cents);
                }

                public String toString() {
                    return this.country + " " + this.year + " " + this.cents + "c";
                }
            }
          Main.java: |
            import java.util.ArrayList;
            import java.util.HashMap;

            public class Main {
                public static void main(String[] args) {
                    ArrayList<Coin> box = new ArrayList<>();
                    box.add(new Coin("Italy", 2002, 50));
                    box.add(new Coin("Kenya", 2005, 10));
                    box.add(new Coin("Italy", 2002, 50));
                    box.add(new Coin("Italy", 2002, 20));
                    HashMap<Coin, Integer> counts = countCoins(box);
                    System.out.println(counts.get(new Coin("Italy", 2002, 50)));
                    System.out.println(counts.get(new Coin("Kenya", 2005, 10)));
                    System.out.println(counts.size());
                }

                public static HashMap<Coin, Integer> countCoins(ArrayList<Coin> coins) {
                    HashMap<Coin, Integer> counts = new HashMap<>();
                    for (Coin coin : coins) {
                        if (counts.containsKey(coin)) {
                            counts.put(coin, counts.get(coin) + 1);
                        } else {
                            counts.put(coin, 1);
                        }
                    }
                    return counts;
                }
            }
