                    System.out.println(mine.equals(new Coin("Italy", 2002, 20)));
                    ArrayList<Coin> album = new ArrayList<>();
                    album.add(new Coin("Kenya", 2005, 10));
                    album.add(mine);
                    System.out.println(album.indexOf(new Coin("Italy", 2002, 50)));
                }
            }
