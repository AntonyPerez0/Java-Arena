          Coin.java: |
            public class Coin {
                private String country;
                private int year;
                private int cents;

                public Coin(String country, int year, int cents) {
                    this.country = country;
                    this.year = year;
                    this.cents = cents;
                }

                public boolean equals(Object compared) {
                    if (this == compared) {
                        return true;
                    }
                    if (!(compared instanceof Coin)) {
                        return false;
                    }
                    Coin other = (Coin) compared;
                    return this.country.equals(other.country) && this.year == other.year && this.cents == other.cents;
                }

                public String toString() {
                    return this.country + " " + this.year + " " + this.cents + "c";
                }
            }
          Main.java: |
            import java.util.ArrayList;

            public class Main {
                public static void main(String[] args) {
                    Coin mine = new Coin("Italy", 2002, 50);
                    System.out.println(mine.equals(new Coin("Italy", 2002, 50)));
                    System.out.println(mine.equals(new Coin("Italy", 2002, 20)));
                    ArrayList<Coin> album = new ArrayList<>();
                    album.add(new Coin("Kenya", 2005, 10));
                    album.add(mine);
                    System.out.println(album.indexOf(new Coin("Italy", 2002, 50)));
                }
            }
