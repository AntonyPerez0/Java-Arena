          import java.util.HashMap;

          public class Main {
              public static void main(String[] args) {
                  HashMap<Coin, String> places = new HashMap<>();
                  places.put(new Coin("Italy", 2002, 50), "box 1");
                  places.put(new Coin("Italy", 1999, 20), "box 2");
