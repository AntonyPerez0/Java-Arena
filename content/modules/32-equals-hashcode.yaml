        solution:
          Square.java: |
            public class Square {
                private String column;
                private int row;

                public Square(String column, int row) {
                    this.column = column;
                    this.row = row;
                }

                public boolean equals(Object compared) {
                    if (this == compared) {
                        return true;
                    }
                    if (!(compared instanceof Square)) {
                        return false;
                    }
                    Square other = (Square) compared;
                    return this.column.equals(other.column) && this.row == other.row;
                }

                public int hashCode() {
                    return 31 * this.column.hashCode() + this.row;
                }

                public String toString() {
                    return this.column + this.row;
                }
            }
          Main.java: |
            import java.util.HashMap;
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Scanner scanner = new Scanner(System.in);
                    HashMap<Square, Integer> landings = new HashMap<>();
                    while (true) {
                        String line = scanner.nextLine();
                        if (line.isEmpty()) {
                            break;
                        }
                        Square square = new Square(line.substring(0, 1), Integer.valueOf(line.substring(1)));
                        landings.put(square, landings.getOrDefault(square, 0) + 1);
                    }
                    int row = Integer.valueOf(scanner.nextLine());
                    String[] columns = {"A", "B", "C", "D", "E", "F"};
                    for (String column : columns) {
                        Square square = new Square(column, row);
                        System.out.println(square + ": " + landings.getOrDefault(square, 0));
                    }
                }
            }
        hints:
          - "Square's `equals` compares the column with `equals` and the row with `==`, and `hashCode` can be `31 * this.column.hashCode() + this.row`, as in step 3. Without both, every new C4 counts as a different square, and the counts stay at 0 or 1."
          - "Count in a `while (true)` loop that breaks at the empty line: `landings.put(square, landings.getOrDefault(square, 0) + 1);`. Then read the row with `Integer.valueOf(scanner.nextLine())`, and for each column of the array make `new Square(column, row)` and print it with `landings.getOrDefault(square, 0)`."
        require:
          - pattern: \bpublic\s+boolean\s+equals\s*\(\s*Object\s+\w+\s*\)
            message: "Write the header exactly as `public boolean equals(Object compared)`, so that the map uses your method."
          - pattern: \bpublic\s+int\s+hashCode\s*\(\s*\)
            message: "Write the header exactly as `public int hashCode()`, so that the map uses your method."
          - pattern: \bnew\s+Square\s*\(
            message: "Make a Square with `new Square(...)` for each line you read, and one for each square of the row you print, and look it up in the map."
        forbid:
          - pattern: \.keySet\s*\(
            message: "Go through the columns of the row in order, not through the map's keys: they come in the map's own order, and a square nobody landed on isn't a key."
