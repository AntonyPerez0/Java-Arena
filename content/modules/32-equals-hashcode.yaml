      import java.util.ArrayList;
      import java.util.HashMap;

      public class Main {
          public static void main(String[] args) {
              Square corner = new Square("a", 1);
              ArrayList<Square> taken = new ArrayList<>();
              taken.add(corner);
              HashMap<Square, String> pieces = new HashMap<>();
              pieces.put(corner, "rook");
              pieces.put(new Square("a", 1), "king");

              System.out.println(taken.contains(new Square("a", 1)));
              System.out.println(pieces.get(corner));
              System.out.println(pieces.containsKey(new Square("a", 1)));
              System.out.println(pieces.size());
          }
      }
      // ==== Square.java ====
      public class Square {
          private String column;
          private int row;

          public Square(String column, int row) {
              this.column = column;
              this.row = row;
          }

          public boolean equals(Object compared) {
              if (this == compared) {
                  return true;
              }
              if (!(compared instanceof Square)) {
                  return false;
              }
              Square other = (Square) compared;
              return this.column.equals(other.column) && this.row == other.row;
          }

          public String toString() {
              return this.column + this.row;
          }
      }
    hints:
      - "The list compares with `equals`, and a new `Square(\"a\", 1)` is equal to `corner`. `pieces.get(corner)` looks up the very object that was put in with `rook`."
      - "Without a `hashCode` of its own, every new Square looks like a different key to the map. So the `put` with a new a1 adds a second key instead of replacing `rook`, and `containsKey` with a third new a1 finds nothing."
