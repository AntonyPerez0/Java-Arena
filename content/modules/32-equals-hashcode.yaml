          - "Read in a `while (true)` loop that breaks at the empty line, split each line at the spaces, and make the seat from `Integer.valueOf(parts[0])` and `Integer.valueOf(parts[1])`. A free seat goes into both the map and the list. At the end, loop over the list and print `seat + \": \" + reserved.get(seat)`."
