      import java.util.ArrayList;
      import java.util.Collections;
      import java.util.HashMap;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              HashMap<String, Integer> counts = new HashMap<>();
              while (true) {
                  String dish = scanner.nextLine();
                  if (dish.isEmpty()) {
                      break;
                  }
                  counts.put(dish, counts.getOrDefault(dish, 0) + 1);
              }

              ArrayList<String> dishes = new ArrayList<>(counts.keySet());
              Collections.sort(dishes);
              for (String dish : dishes) {
                  System.out.println(dish + ": " + counts.get(dish));
              }
          }
      }
    hints:
      - "Read in a `while (true)` loop that stops with `break` at the empty line. Each dish adds one to its count: `counts.put(dish, counts.getOrDefault(dish, 0) + 1);`."
