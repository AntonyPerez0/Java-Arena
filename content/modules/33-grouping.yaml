          TableOrders.java: |
            import java.util.ArrayList;
            import java.util.Collections;
            import java.util.HashMap;

            public class TableOrders {
                private HashMap<Integer, ArrayList<String>> orders;

                public TableOrders() {
                    this.orders = new HashMap<>();
                }

                public void add(int table, String dish) {
                    if (!this.orders.containsKey(table)) {
                        this.orders.put(table, new ArrayList<>());
                    }
                    this.orders.get(table).add(dish);
                }

                public ArrayList<String> dishesAt(int table) {
                    return this.orders.getOrDefault(table, new ArrayList<>());
                }

                public ArrayList<Integer> tables() {
                    ArrayList<Integer> tables = new ArrayList<>(this.orders.keySet());
                    Collections.sort(tables);
                    return tables;
                }

                public boolean cancel(int table, String dish) {
                    ArrayList<String> dishes = this.dishesAt(table);
                    if (!dishes.contains(dish)) {
                        return false;
                    }
                    dishes.remove(dish);
                    if (dishes.isEmpty()) {
                        this.orders.remove(table);
                    }
                    return true;
                }

                public int countOf(String dish) {
                    int count = 0;
                    for (ArrayList<String> dishes : this.orders.values()) {
                        for (String ordered : dishes) {
                            if (ordered.equals(dish)) {
                                count++;
                            }
                        }
                    }
                    return count;
                }
            }
