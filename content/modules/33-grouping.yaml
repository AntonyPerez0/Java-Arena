      Main.java: |
        import java.util.ArrayList;
        import java.util.HashMap;

        public class Main {
            public static void main(String[] args) {
                ArrayList<Student> students = new ArrayList<>();
                students.add(new Student("S-104", "Amira"));
                students.add(new Student("S-231", "Jonas"));
                students.add(new Student("S-087", "Priya"));
                HashMap<String, Student> byCard = indexByCard(students);
                System.out.println(byCard.get("S-231"));
                System.out.println(byCard.get("S-500"));
                System.out.println(byCard.size());
            }

            public static HashMap<String, Student> indexByCard(ArrayList<Student> students) {
                HashMap<String, Student> byCard = new HashMap<>();
                for (Student student : students) {
                    byCard.put(student.getCard(), student);
                }
                return byCard;
            }
        }
