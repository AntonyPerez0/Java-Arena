          PhotoLibrary.java: |
            import java.util.ArrayList;
            import java.util.Collections;
            import java.util.HashMap;

            public class PhotoLibrary {
                private HashMap<String, Photo> byFile;
                private HashMap<String, ArrayList<Photo>> byPlace;

                public PhotoLibrary() {
                    this.byFile = new HashMap<>();
                    this.byPlace = new HashMap<>();
                }

                public void add(Photo photo) {
                    this.byFile.put(photo.getFile(), photo);
                    String place = photo.getPlace();
                    if (!this.byPlace.containsKey(place)) {
                        this.byPlace.put(place, new ArrayList<>());
                    }
                    this.byPlace.get(place).add(photo);
                }

                public Photo find(String file) {
                    return this.byFile.get(file);
                }

                public ArrayList<Photo> photosAt(String place) {
                    return this.byPlace.getOrDefault(place, new ArrayList<>());
                }

                public ArrayList<String> places() {
                    ArrayList<String> places = new ArrayList<>(this.byPlace.keySet());
                    Collections.sort(places);
                    return places;
                }
            }
