  - id: grouping-fast-lookups
    slug: fast-lookups
    title: Fast lookups, and the end of part 8
    text: |
      Before part 8, finding a value meant going through a list or an array. Module 28's linear search looks at the elements one at a time, and so do a list's `contains` and `indexOf`, which compare the value with each element using `equals`. To find a value near the end of a list of a million elements, or to find out that it isn't there at all, they make about a million comparisons. A hash map finds a key without going through its keys: whether it holds a hundred keys or a million, `get` and `containsKey` do about the same amount of work.

      ### Where the map looks

      Think of a shop that keeps orders for pickup on shelves marked with letters, one shelf for each first letter of the customer's last name. To find Ms. Okafor's order, nobody searches the whole back room: the name says which shelf to look on, and only the few orders on that shelf need checking.

      A hash map works in a similar way. It keeps its entries in many small places, often called **buckets**. When a key is put in the map, the map works out the key's hash code (module 32), and that number picks the bucket the entry goes to. To find a key, `get` does the same calculation, and the hash code leads it straight to the one bucket where the key must be if it's in the map at all. There it compares the key only with the few entries in that bucket, and calls `equals` only on those whose hash code matches. The rest of the map isn't looked at.

      As the map grows, it adds more buckets and spreads its entries out again, so that each bucket keeps only a few entries. That's why finding a key doesn't get slower as the map gets bigger.

      ### Seeing the difference

      A small experiment shows it. A `Card` is a student card with a number. Its `equals` and `hashCode` use the number, as in module 32, and for this experiment only, `equals` also counts how many times it's called. The program puts the same cards in a list and in a map, and then looks for the last card in both, each time with a new Card object that has its number:

      ```java run
      import java.util.ArrayList;
      import java.util.HashMap;

      public class Main {
          public static void main(String[] args) {
              experiment(100);
              experiment(1000);
              experiment(10000);
          }

          public static void experiment(int size) {
              ArrayList<Card> list = new ArrayList<>();
              HashMap<Card, String> map = new HashMap<>();
              for (int i = 1; i <= size; i++) {
                  Card card = new Card("C" + i);
                  list.add(card);
                  map.put(card, "Student " + i);
              }

              Card wanted = new Card("C" + size);
              Card again = new Card("C" + size);
              if (list.contains(wanted) && map.containsKey(again)) {
                  System.out.println(size + " cards: list " + wanted.getComparisons() + ", map " + again.getComparisons());
              }
          }
      }
      // ==== Card.java ====
      public class Card {
          private String number;
          private int comparisons;

          public Card(String number) {
              this.number = number;
              this.comparisons = 0;
          }

          public int getComparisons() {
              return this.comparisons;
          }

          public boolean equals(Object compared) {
              this.comparisons++;
              if (this == compared) {
                  return true;
              }
              if (!(compared instanceof Card)) {
                  return false;
              }
              Card other = (Card) compared;
              return this.number.equals(other.number);
          }

          public int hashCode() {
              return this.number.hashCode();
          }
      }
      ```

      ```output
      100 cards: list 100, map 1
      1000 cards: list 1000, map 1
      10000 cards: list 10000, map 1
      ```

      - `list.contains(wanted)` compared the card with every card in the list before it reached the last one. Ten times the cards, ten times the comparisons.
      - `map.containsKey(again)` went straight to the right bucket, and called `equals` once, on the card it was looking for. Here that's one comparison at every size.
      - Comparisons aren't the whole cost. Working out the hash code takes a moment too: a String's hash code goes through its characters. But that work depends on the key, not on how many keys the map holds.

      This relies on good hash codes. If many keys had the same hash code, they'd all land in the same bucket, and finding one of them would mean comparing it with many of the others: the map would lose much of its speed. That's one more reason why module 32's `hashCode` uses every value that `equals` compares. Java's own String and Integer already have good hash codes.

      ### A list or a map?

      Speed isn't the only thing that matters. Each collection is good at different things:

      | What the program needs | Use |
      | --- | --- |
      | Things in order, and each one by its place: the first, the last, the one at index 3 | a list |
      | The same value more than once, like every song a player has played | a list |
      | A thing found by a key, like a student by card number | a map |
      | One value for each key, where a new value replaces the old one | a map |
      | Counts or groups by a key | a map, with Integer or list values |

      A map pays for its speed: it keeps each key only once, and it goes through its keys in an order of its own. Binary search (module 28) is fast too, with at most 20 looks for a million values, but only on data that's kept sorted.

      Often a program uses both. A list keeps the objects in the order they came, and a map finds them by a key. Building the map takes one loop over the list, and after that, every lookup goes straight to its key.

      ### The end of part 8

      This step ends the material of the MOOC's eighth part, the first part of Java Programming II. It started with a recap of parts 1 to 7, and then brought the hash map, which finds a value by its key. Module 32 showed how Java decides that two objects are the same, with `equals` and `hashCode`, so that objects of your own classes can be keys too. This module put lists in a map to group data, and showed why finding a key stays fast however big the map gets. Next, part 9 brings inheritance and interfaces. Part 8 closes with [the MOOC's page on fast data fetching and grouping information](https://java-programming.mooc.fi/part-8/5-fast-data-fetching-and-grouping-information) on its own site, for reading only.

