      Main.java: |
        import java.util.ArrayList;
        import java.util.HashMap;

        public class Main {
            public static void main(String[] args) {
                ArrayList<Student> students = new ArrayList<>();
                students.add(new Student("S-104", "Amira"));
                students.add(new Student("S-231", "Jonas"));
                students.add(new Student("S-087", "Priya"));
                ArrayList<String> scans = new ArrayList<>();
                scans.add("S-231");
                scans.add("S-500");
                scans.add("S-104");
                scans.add("S-231");
                System.out.println(namesFor(students, scans));
            }

            public static ArrayList<String> namesFor(ArrayList<Student> students, ArrayList<String> scans) {
                HashMap<String, Student> byCard = new HashMap<>();
                for (Student student : students) {
                    byCard.put(student.getCard(), student);
                }

                ArrayList<String> names = new ArrayList<>();
                for (String card : scans) {
                    Student student = byCard.get(card);
                    if (student == null) {
                        names.add("unknown");
                    } else {
                        names.add(student.getName());
                    }
                }
                return names;
            }
        }
