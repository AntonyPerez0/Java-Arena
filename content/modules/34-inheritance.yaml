            public static void main(String[] args) {
                Piano piano = new Piano();
                piano.practice(45);
                System.out.println(piano.needsTuning());
                piano.practice(30);
                System.out.println(piano.needsTuning());
                piano.tune();
                System.out.println(piano.needsTuning());
                System.out.println(piano.getMinutesPlayed());
            }
        }
    solution:
      Piano.java: |
        public class Piano extends Instrument {
            private int minutesAtTuning;

            public void tune() {
                this.minutesAtTuning = this.getMinutesPlayed();
            }

            public boolean needsTuning() {
                return this.getMinutesPlayed() - this.minutesAtTuning >= 60;
            }
        }
      Instrument.java: |
        public class Instrument {
            private int minutesPlayed;

            public void practice(int minutes) {
                this.minutesPlayed += minutes;
            }

            public int getMinutesPlayed() {
                return this.minutesPlayed;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
