      - task: |
          In a museum, every exhibit is kept in some room, but which room depends on the kind of exhibit. Fill in the two blanks, the same word in both, so that `Exhibit` can't be created with `new`, and its subclasses must write `room()`.
        fill: |
          public class Main {
              public static void main(String[] args) {
                  Exhibit lion = new Statue("Marble lion", 900);
                  Exhibit bust = new Statue("Bronze bust", 40);
                  System.out.println(lion.label());
                  System.out.println(bust.label());
              }
          }
          // ==== Exhibit.java ====
          public [[abstract]] class Exhibit {
              private String name;

              public Exhibit(String name) {
                  this.name = name;
              }

              public [[abstract]] String room();

              public String label() {
                  return this.name + ", in the " + this.room();
              }
          }
          // ==== Statue.java ====
          public class Statue extends Exhibit {
              private int kilograms;

              public Statue(String name, int kilograms) {
                  super(name);
                  this.kilograms = kilograms;
              }

              @Override
              public String room() {
                  if (this.kilograms > 500) {
                      return "ground floor hall";
                  }
                  return "sculpture gallery";
              }
          }
        hints:
          - "The same word goes before `class` in the class's header, and before the return type of a method that has no body."
          - "`public abstract class Exhibit` and `public abstract String room();`. A method without a body is allowed only when it's abstract, and only an abstract class may have one."
