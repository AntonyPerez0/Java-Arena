          A display case holds minerals, and `contains` and `indexOf` should find a mineral with the same name and hardness. Fill in the blank, a type, so that `equals` replaces Object's.
        fill: |
          import java.util.ArrayList;

          public class Main {
              public static void main(String[] args) {
                  ArrayList<Mineral> display = new ArrayList<>();
                  display.add(new Mineral("Quartz", 7));
                  display.add(new Mineral("Talc", 1));
                  System.out.println(display.contains(new Mineral("Talc", 1)));
                  System.out.println(display.indexOf(new Mineral("Quartz", 7)));
              }
          }
          // ==== Mineral.java ====
          import java.util.Objects;

          public class Mineral {
              private String name;
              private int hardness;

              public Mineral(String name, int hardness) {
                  this.name = name;
                  this.hardness = hardness;
              }

              public boolean equals([[Object]] compared) {
                  if (this == compared) {
                      return true;
                  }
                  if (!(compared instanceof Mineral)) {
                      return false;
                  }
                  Mineral other = (Mineral) compared;
                  return this.name.equals(other.name) && this.hardness == other.hardness;
              }

              public int hashCode() {
                  return Objects.hash(this.name, this.hardness);
              }
          }
        hints:
