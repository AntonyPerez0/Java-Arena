            public class Main {
                public static void main(String[] args) {
                    ArrayList<Magazine> returned = new ArrayList<>();
                    returned.add(new Magazine("Sky Watch", 12));
                    returned.add(new Magazine("Garden Days", 3));
                    System.out.println(returned.contains(new Magazine("Garden Days", 3)));
                    System.out.println(returned.indexOf(new Magazine("Sky Watch", 12)));
                    Magazine mine = new Magazine("Sky Watch", 12);
                    System.out.println(mine.equals(new Magazine("Sky Watch", 12)));
                }
            }
        solution:
          Magazine.java: |
            import java.util.Objects;

            public class Magazine {
                private String title;
                private int issue;

                public Magazine(String title, int issue) {
                    this.title = title;
                    this.issue = issue;
                }

                @Override
                public boolean equals(Object compared) {
                    if (this == compared) {
                        return true;
                    }
                    if (!(compared instanceof Magazine)) {
                        return false;
                    }
                    Magazine other = (Magazine) compared;
                    return this.title.equals(other.title) && this.issue == other.issue;
                }

                @Override
                public int hashCode() {
                    return Objects.hash(this.title, this.issue);
                }

                @Override
                public String toString() {
                    return this.title + " #" + this.issue;
                }
            }
          Main.java: |
            import java.util.ArrayList;

            public class Main {
                public static void main(String[] args) {
                    ArrayList<Magazine> returned = new ArrayList<>();
                    returned.add(new Magazine("Sky Watch", 12));
                    returned.add(new Magazine("Garden Days", 3));
                    System.out.println(returned.contains(new Magazine("Garden Days", 3)));
                    System.out.println(returned.indexOf(new Magazine("Sky Watch", 12)));
                    Magazine mine = new Magazine("Sky Watch", 12);
                    System.out.println(mine.equals(new Magazine("Sky Watch", 12)));
                }
            }
        hints:
          - "With `@Override`, javac says the method doesn't override anything: `equals(Magazine other)` has a different parameter from Object's `equals(Object)`, so it's an overload, and the list calls Object's version."
          - "Write it as `public boolean equals(Object compared)`: `true` for `this == compared`, `false` when `!(compared instanceof Magazine)`, and otherwise `Magazine other = (Magazine) compared;` and the comparison that's there now."
        require:
          - pattern: "@Override\\s+public\\s+boolean\\s+equals\\s*\\(\\s*Object\\s+\\w+\\s*\\)"
            message: "Write `@Override` and then the header `public boolean equals(Object compared)`, so that it overrides Object's `equals`."
          - pattern: \binstanceof\s+Magazine\b
            message: "Check with `instanceof Magazine` that the compared object is a magazine, before the cast."
