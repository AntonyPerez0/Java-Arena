                piano.practice(45);
                System.out.println(piano.needsTuning());
                piano.practice(30);
                System.out.println(piano.needsTuning());
                piano.tune();
                System.out.println(piano.needsTuning());
                System.out.println(piano.getMinutesPlayed());
            }
        }
    hints:
      - "Start with `public class Piano extends Instrument {`. Piano needs one variable of its own: the minutes played at the last tuning, which starts at 0 like any int instance variable."
      - "`tune()` stores `this.getMinutesPlayed()` in that variable. `needsTuning()` returns `this.getMinutesPlayed() - this.minutesAtTuning >= 60`."
    require:
