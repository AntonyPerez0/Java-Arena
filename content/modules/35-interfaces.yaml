          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class Main {
              public static void main(String[] args) {
                  List<String> reports = new ArrayList<>();
                  reports.add("sprinkler");
                  reports.add("heater");
                  reports.add("camera");
                  reports.add("heater");
                  reports.add("sprinkler");
                  reports.add("heater");
                  System.out.println(reportedTwice(reports));
              }

              public static List<String> reportedTwice(List<String> reports) {
                  Set<String> seen = new HashSet<>();
                  Set<String> again = new HashSet<>();
                  for (String device : reports) {
                      if (!seen.add(device)) {
                          again.add(device);
                      }
                  }
                  List<String> result = new ArrayList<>(again);
                  Collections.sort(result);
                  return result;
              }
          }
