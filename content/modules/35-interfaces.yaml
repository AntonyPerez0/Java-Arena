            public class GarageDoor implements Switchable {
                private boolean open;

                @Override
                public void turnOn() {
                    this.open = true;
                }

                @Override
                public void turnOff() {
                    this.open = false;
                }

                @Override
                public boolean isOn() {
                    return this.open;
                }

                public boolean isOpen() {
                    return this.open;
                }
            }
          Switchable.java: |
