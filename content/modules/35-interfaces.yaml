        import java.util.ArrayList;

        public class Main {
            public static void main(String[] args) {
                ArrayList<Playable> queue = new ArrayList<>();
                queue.add(new VoiceMemo("Groceries", 45));
                queue.add(new RadioShow("Morning News", 5));
