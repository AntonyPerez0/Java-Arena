    solution:
      Sprinkler.java: |
        public class Sprinkler implements Switchable {
            private String zone;
            private boolean on;

            public Sprinkler(String zone) {
                this.zone = zone;
                this.on = false;
            }

            @Override
            public void turnOn() {
                this.on = true;
            }

            @Override
            public void turnOff() {
                this.on = false;
            }

            @Override
            public boolean isOn() {
                return this.on;
            }

            @Override
            public String toString() {
                if (this.on) {
                    return "Sprinkler (" + this.zone + "): on";
                }
                return "Sprinkler (" + this.zone + "): off";
            }
        }
      Switchable.java: |
        public interface Switchable {
            void turnOn();
            void turnOff();
            boolean isOn();
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Sprinkler sprinkler = new Sprinkler("front lawn");
                System.out.println(sprinkler);
                sprinkler.turnOn();
                System.out.println(sprinkler.isOn());
                System.out.println(sprinkler);
            }
        }
    hints:
      - "Start with `public class Sprinkler implements Switchable {`, and give the class two instance variables: the zone, and a boolean that says whether the sprinkler is on."
      - "Each of the three methods is `public`, with `@Override` above it: `turnOn` sets the boolean to `true`, `turnOff` sets it to `false`, and `isOn` returns it. `toString` returns one text or the other, depending on the boolean."
    require:
