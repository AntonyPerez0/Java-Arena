                  System.out.println(guests.size() + " " + names.size());
              }

              public static String describe(Collection<String> people) {
                  int letters = 0;
                  for (String person : people) {
                      letters += person.length();
                  }
                  return people.size() + " people, " + letters + " letters";
              }
          }
