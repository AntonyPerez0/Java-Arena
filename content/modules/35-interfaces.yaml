    solution:
      ElectricScooter.java: |
        public class ElectricScooter implements Switchable, Chargeable {
            private int battery;
            private boolean on;

            public ElectricScooter(int battery) {
                this.battery = battery;
                this.on = false;
            }

            @Override
            public void turnOn() {
                this.on = true;
            }

            @Override
            public void turnOff() {
                this.on = false;
            }

            @Override
            public boolean isOn() {
                return this.on;
            }

            @Override
            public int batteryPercent() {
                return this.battery;
            }

            @Override
            public void charge(int minutes) {
                this.battery += 2 * minutes;
                if (this.battery > 100) {
                    this.battery = 100;
                }
            }

            public void ride(int km) {
                if (this.on) {
                    this.battery -= 5 * km;
                    if (this.battery < 0) {
                        this.battery = 0;
                    }
                }
            }
        }
      Switchable.java: |
        public interface Switchable {
            void turnOn();
            void turnOff();
            boolean isOn();
        }
      Chargeable.java: |
        public interface Chargeable {
            int batteryPercent();
            void charge(int minutes);
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                ElectricScooter scooter = new ElectricScooter(40);
                scooter.ride(3);
                System.out.println(scooter.batteryPercent());
                scooter.turnOn();
                scooter.ride(3);
                System.out.println(scooter.isOn() + " " + scooter.batteryPercent());
                scooter.charge(50);
                System.out.println(scooter.batteryPercent());
            }
        }
    hints:
      - "The header is `public class ElectricScooter implements Switchable, Chargeable {`. The class needs two instance variables: the battery's percentage and whether the scooter is on."
      - "`charge` adds `2 * minutes`, and then sets the battery back to 100 if it went above. `ride` does nothing unless the scooter is on; otherwise it takes away `5 * km`, and sets the battery back to 0 if it went below. `ride` is the scooter's own, so it has no `@Override`."
    require:
      - pattern: \bclass\s+ElectricScooter\s+implements\s+(Switchable\s*,\s*Chargeable|Chargeable\s*,\s*Switchable)\b
        message: "Write the header as `public class ElectricScooter implements Switchable, Chargeable`, so that the scooter makes both promises."
      - pattern: "@Override"
        min: 5
        message: "Put `@Override` above each of the five methods that the two interfaces ask for."
    tests:
      - call: |
          ElectricScooter scooter = new ElectricScooter(40);
          scooter.ride(3);
          System.out.println(scooter.batteryPercent());
          scooter.turnOn();
          scooter.ride(3);
          System.out.println(scooter.isOn() + " " + scooter.batteryPercent());
          scooter.charge(50);
          System.out.println(scooter.batteryPercent());
      - call: |
          ElectricScooter scooter = new ElectricScooter(10);
          scooter.turnOn();
