    more:
      - task: |
          A ceiling fan has three speeds, and speed 0 means that it's off. The fan keeps no boolean: `isOn` works the answer out from the speed. What does this program print?
        predict: |
          public class Main {
              public static void main(String[] args) {
                  CeilingFan fan = new CeilingFan();
                  fan.faster();
                  System.out.println(fan.isOn() + " " + fan.getSpeed());
                  fan.turnOn();
                  fan.faster();
                  fan.faster();
                  fan.faster();
                  fan.turnOn();
                  System.out.println(fan.isOn() + " " + fan.getSpeed());
                  fan.turnOff();
                  System.out.println(fan.isOn() + " " + fan.getSpeed());
              }
          }
          // ==== Switchable.java ====
          public interface Switchable {
              void turnOn();
              void turnOff();
              boolean isOn();
          }
          // ==== CeilingFan.java ====
          public class CeilingFan implements Switchable {
              private int speed;

              @Override
              public void turnOn() {
                  if (this.speed == 0) {
                      this.speed = 1;
                  }
              }

              @Override
              public void turnOff() {
                  this.speed = 0;
              }

              @Override
              public boolean isOn() {
                  return this.speed > 0;
              }

              public void faster() {
                  if (this.speed > 0 && this.speed < 3) {
                      this.speed++;
                  }
              }

              public int getSpeed() {
                  return this.speed;
              }
          }
        hints:
          - "A new fan's speed is 0, and `faster` changes nothing while the fan is off. `turnOn` starts the fan at speed 1, but only if it's off."
          - "After `turnOn`, three calls to `faster` stop at speed 3. The second `turnOn` finds the fan already running, so it keeps speed 3. `turnOff` sets the speed back to 0, and `isOn` is worked out from the speed."
      - task: |
