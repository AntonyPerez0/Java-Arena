      import java.util.HashMap;
      import java.util.Map;

      public class Main {
          public static void main(String[] args) {
              Map<String, Integer> orders = new HashMap<>();
              orders.put("rye", 6);
              orders.put("sourdough", 10);
              orders.put("baguette", 7);
              System.out.println(biggestOrder(orders));
          }

          public static String biggestOrder(Map<String, Integer> orders) {
              String biggest = null;
              for (String bread : orders.keySet()) {
                  if (biggest == null || orders.get(bread) > orders.get(biggest)) {
                      biggest = bread;
                  }
              }
              return biggest;
