          import java.util.ArrayList;
          import java.util.List;

          public class Main {
              public static void main(String[] args) {
                  List<String> there = new ArrayList<>();
                  there.add("Harbor");
                  there.add("Old Mill");
                  there.add("Museum");
                  List<String> back = reversed(there);
                  System.out.println(back);
                  System.out.println(there);
