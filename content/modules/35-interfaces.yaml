        hints:
          - "javac finds two problems: `turnOn` isn't public, and the class has no `isOn()` at all. `isOpen` has another name, so it doesn't count as Switchable's `isOn`."
          - "Write `public void turnOn()`, and add a method `public boolean isOn()` that returns `this.open`. Then put `@Override` above `turnOn`, `turnOff` and `isOn`, but not above `isOpen`, which Switchable doesn't have."
