        message: "Write the header as `public class Sprinkler implements Switchable`, so that a sprinkler keeps Switchable's promise."
      - pattern: "@Override"
        min: 3
        message: "Put `@Override` above each of the methods that Switchable asks for, so that javac checks their headers."
