                    outbox.add(new PushAlert("Weather", "Rain at 3 pm"));
                    outbox.add(new Sms("555-0199", "Table for 4 is ready at the front desk"));
                    sendAll(outbox);
                }

                public static void sendAll(ArrayList<Notification> outbox) {
                    for (Notification notification : outbox) {
                        System.out.println(notification.deliver());
                    }
                    System.out.println(outbox.size() + " sent");
                }
            }
