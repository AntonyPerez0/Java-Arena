        import java.util.ArrayList;

        public class Main {
            public static void main(String[] args) {
                ArrayList<Flying> sky = new ArrayList<>();
                sky.add(new Bat("Squeak", 9));
                sky.add(new Balloon("red", 40));
                sky.add(new Balloon("green", 6));
                sky.add(new Bat("Flit", 12));
                System.out.println(sky);
                System.out.println(lowest(sky));
            }

            public static Flying lowest(ArrayList<Flying> flyers) {
                Flying lowest = null;
                for (Flying flyer : flyers) {
                    if (lowest == null || flyer.altitude() < lowest.altitude()) {
                        lowest = flyer;
                    }
                }
                return lowest;
            }
