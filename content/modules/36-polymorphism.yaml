          Sms.java: |
            public class Sms implements Notification {
                private String phone;
                private String text;

                public Sms(String phone, String text) {
                    this.phone = phone;
                    this.text = text;
                }

                @Override
                public String deliver() {
                    String shown = this.text;
                    if (shown.length() > 20) {
                        shown = shown.substring(0, 20) + "...";
                    }
                    return "SMS to " + this.phone + ": " + shown;
                }
            }
