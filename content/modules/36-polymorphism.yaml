        solution:
          TollBooth.java: |
            import java.util.ArrayList;
            import java.util.Collections;
            import java.util.HashMap;

            public class TollBooth {
                private int total;
                private HashMap<String, Integer> bills;

                public TollBooth() {
                    this.total = 0;
                    this.bills = new HashMap<>();
                }

                public void pass(Vehicle vehicle) {
                    int toll = vehicle.toll();
                    this.total += toll;
                    if (vehicle instanceof Commercial) {
                        Commercial customer = (Commercial) vehicle;
                        String company = customer.company();
                        this.bills.put(company, this.bills.getOrDefault(company, 0) + toll);
                    }
                }

                public int total() {
                    return this.total;
                }

                public int billFor(String company) {
                    return this.bills.getOrDefault(company, 0);
                }

                public ArrayList<String> companies() {
                    ArrayList<String> companies = new ArrayList<>(this.bills.keySet());
                    Collections.sort(companies);
                    return companies;
                }
            }
          Van.java: |
            public class Van extends Vehicle implements Commercial {
                private String company;

                public Van(String plate, String company) {
                    super(plate);
                    this.company = company;
                }

                @Override
                public int toll() {
                    return 7;
                }

                @Override
                public String company() {
                    return this.company;
                }
            }
          Vehicle.java: |
            public class Vehicle {
                private String plate;

                public Vehicle(String plate) {
                    this.plate = plate;
                }

                public String getPlate() {
                    return this.plate;
                }

                public int toll() {
                    return 3;
                }

                @Override
                public String toString() {
                    return this.plate + " pays " + this.toll();
                }
            }
          Truck.java: |
            public class Truck extends Vehicle implements Commercial {
                private String company;
                private int axles;

                public Truck(String plate, String company, int axles) {
                    super(plate);
                    this.company = company;
                    this.axles = axles;
                }

                @Override
                public int toll() {
                    return 5 * this.axles;
                }

                @Override
                public String company() {
                    return this.company;
                }
            }
          Commercial.java: |
            public interface Commercial {
                String company();
            }
