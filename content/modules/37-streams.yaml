          Main.java: |
            import java.nio.file.Files;
            import java.nio.file.Paths;
            import java.util.List;
            import java.util.stream.Collectors;

            public class Main {
                public static void main(String[] args) {
                    try {
                        List<BookSale> sales = Files.lines(Paths.get("sales.csv"))
                                .map(line -> line.split(","))
                                .map(parts -> new BookSale(parts[0], Integer.valueOf(parts[1]), Integer.valueOf(parts[2])))
                                .collect(Collectors.toList());
                        int copies = sales.stream()
                                .mapToInt(BookSale::getCopies)
                                .sum();
                        int takings = sales.stream()
                                .mapToInt(BookSale::total)
                                .sum();
                        List<String> titles = sales.stream()
                                .map(BookSale::getTitle)
                                .distinct()
                                .sorted()
                                .collect(Collectors.toList());
                        System.out.println("Sales: " + sales.size());
                        System.out.println("Copies: " + copies);
                        System.out.println("Takings: " + takings + " dollars");
                        System.out.println("Titles: " + titles);
                    } catch (Exception e) {
                        System.out.println("Error: " + e.getMessage());
                    }
                }
            }
