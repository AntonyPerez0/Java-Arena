        solution: |
          import java.util.ArrayList;
          import java.util.List;

          public class Main {
              public static void main(String[] args) {
                  List<Integer> booksSold = new ArrayList<>();
                  booksSold.add(64);
                  booksSold.add(112);
                  booksSold.add(89);
                  booksSold.add(130);
                  System.out.println(firstDayOver(booksSold, 100));
                  System.out.println(firstDayOver(booksSold, 120));
              }

              public static int firstDayOver(List<Integer> booksSold, int target) {
                  for (int i = 0; i < booksSold.size(); i++) {
                      if (booksSold.get(i) > target) {
                          return i + 1;
                      }
                  }
                  return 0;
              }
          }
