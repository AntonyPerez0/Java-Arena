          Spice.java: |
            public class Spice implements Comparable<Spice> {
                private String name;
                private int grams;

                public Spice(String name, int grams) {
                    this.name = name;
                    this.grams = grams;
                }

                public String getName() {
                    return this.name;
                }

                public int getGrams() {
                    return this.grams;
                }

                @Override
                public int compareTo(Spice other) {
                    return this.name.compareTo(other.name);
                }

                @Override
                public String toString() {
                    return this.name + " (" + this.grams + " g)";
                }
            }
          Main.java: |
            import java.util.ArrayList;
            import java.util.List;

            public class Main {
                public static void main(String[] args) {
                    List<Spice> rack = new ArrayList<>();
                    rack.add(new Spice("Paprika", 50));
                    rack.add(new Spice("Cumin", 40));
                    rack.add(new Spice("Saffron", 2));
                    rack.add(new Spice("Cardamom", 25));
                    printRack(rack);
                    System.out.println(rack.get(0));
                }

                public static void printRack(List<Spice> rack) {
                    rack.stream()
                            .sorted()
                            .forEach(System.out::println);
                }
            }
