      - task: |
          A hackathon's scoreboard shows the teams with the highest score first. Look closely at the order of the two values in `compareTo`. What does this program print?
        predict: |
          import java.util.ArrayList;
          import java.util.Collections;

          public class Main {
              public static void main(String[] args) {
                  ArrayList<Entry> board = new ArrayList<>();
                  board.add(new Entry("Byte Club", 72));
                  board.add(new Entry("Null Pointers", 88));
                  board.add(new Entry("Stack Stars", 72));
                  board.add(new Entry("Loop Troop", 95));
                  Collections.sort(board);
                  for (Entry entry : board) {
                      System.out.println(entry);
                  }
                  System.out.println(board.get(3).compareTo(board.get(0)) > 0);
              }
          }
          // ==== Entry.java ====
          public class Entry implements Comparable<Entry> {
              private String team;
              private int score;

              public Entry(String team, int score) {
                  this.team = team;
                  this.score = score;
              }

              @Override
              public int compareTo(Entry other) {
                  return Integer.compare(other.score, this.score);
              }

              @Override
              public String toString() {
                  return this.team + " " + this.score;
              }
          }
        hints:
          - "`Integer.compare(other.score, this.score)` has the two values swapped: it's negative when `this` has the *higher* score. So a higher score comes first."
          - "The order is 95, 88, 72, 72. Byte Club and Stack Stars tie at 72, and a tie keeps the list's order. Last, Stack Stars comes after Loop Troop, so its `compareTo` is positive."
