        solution:
          Flight.java: |
            public class Flight implements Comparable<Flight> {
                private String destination;
                private String departs;
                private int gate;

                public Flight(String destination, String departs, int gate) {
                    this.destination = destination;
                    this.departs = departs;
                    this.gate = gate;
                }

                public String getDestination() {
                    return this.destination;
                }

                public String getDeparts() {
                    return this.departs;
                }

                public int getGate() {
                    return this.gate;
                }

                @Override
                public int compareTo(Flight other) {
                    int byTime = this.departs.compareTo(other.departs);
                    if (byTime != 0) {
                        return byTime;
                    }
                    return this.destination.compareTo(other.destination);
                }

                @Override
                public String toString() {
                    return this.departs + " " + this.destination + " (gate " + this.gate + ")";
                }
            }
          Board.java: |
            import java.util.ArrayList;
            import java.util.Comparator;
            import java.util.List;
            import java.util.stream.Collectors;

            public class Board {
                private List<Flight> flights;

                public Board() {
                    this.flights = new ArrayList<>();
                }

                public void add(Flight flight) {
                    this.flights.add(flight);
                }

                public List<Flight> departures() {
                    return this.flights.stream()
                            .sorted()
                            .collect(Collectors.toList());
                }

                public List<Flight> atGate(int gate) {
                    return this.flights.stream()
                            .filter(flight -> flight.getGate() == gate)
                            .sorted()
                            .collect(Collectors.toList());
                }

                public List<Flight> byGate() {
                    return this.flights.stream()
                            .sorted(Comparator.comparing(Flight::getGate).thenComparing(Flight::getDeparts))
                            .collect(Collectors.toList());
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Board board = new Board();
                    board.add(new Flight("Lisbon", "13:10", 4));
                    board.add(new Flight("Oslo", "07:45", 12));
                    board.add(new Flight("Dublin", "09:30", 4));
                    board.add(new Flight("Athens", "13:10", 2));
                    board.add(new Flight("Riga", "09:05", 12));
                    System.out.println(board.departures());
                    System.out.println(board.atGate(12));
                    System.out.println(board.byGate());
                }
            }
        hints:
          - "Flight's `compareTo` follows step 3's pattern for two criteria. The times are Strings, so their own `compareTo` compares them. In Board, keep a `List<Flight>` that the constructor creates, and let `add` add to it."
          - "Flight's `compareTo` starts with `int byTime = this.departs.compareTo(other.departs);`, returns `byTime` when it isn't 0, and otherwise compares the destinations. In Board, each method can be one stream that ends with `collect(Collectors.toList())`, which makes a new list. `departures` uses `sorted()`, `atGate` puts a `filter` on the gate before `sorted()`, and `byGate` uses `sorted(Comparator.comparing(Flight::getGate).thenComparing(Flight::getDeparts))`."
