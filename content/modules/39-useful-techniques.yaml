          }
      }
    solution: |
      import java.util.ArrayList;

      public class Main {
          public static void main(String[] args) {
              ArrayList<String> names = new ArrayList<>();
              names.add("Ada");
              names.add("Ben");
              names.add("Cy");
              System.out.println(guestList(names));
          }

          public static String guestList(ArrayList<String> names) {
              if (names.isEmpty()) {
                  return "Guests: none";
              }
              StringBuilder list = new StringBuilder("Guests: ");
              for (int i = 0; i < names.size(); i++) {
                  if (i > 0) {
                      list.append(", ");
                  }
                  list.append(names.get(i));
              }
              return list.toString();
          }
      }
    hints:
      - "Handle the empty list first, with `isEmpty()`. Otherwise start with `new StringBuilder(\"Guests: \")` and append the names in a loop."
      - "The comma goes *between* names: append `\", \"` before every name except the first, which an index loop can tell by `i > 0`. Return `list.toString()` at the end."
    require:
      - pattern: '\bnew\s+StringBuilder\s*\('
        message: "Build the text in a `StringBuilder`."
      - pattern: '\.append\s*\('
        message: "Add the pieces with `append`."
    forbid:
      - pattern: '\+='
        message: "Build the text with `append`, not with `+=`."
      - pattern: '\bString\s*\.\s*join\b'
        message: "`String.join` would do it for you: build the text with a StringBuilder this time."
    tests:
      - call: |
