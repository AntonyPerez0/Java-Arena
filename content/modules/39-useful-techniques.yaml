          BoxOffice.java: |
            import java.util.ArrayList;
            import java.util.Iterator;

            public class BoxOffice {
                private ArrayList<Ticket> tickets;

                public BoxOffice() {
                    this.tickets = new ArrayList<>();
                }

                public void sell(String holder, Pass pass) {
                    this.tickets.add(new Ticket(holder, pass));
                }

                public int refund(String holder) {
                    int money = 0;
                    Iterator<Ticket> iterator = this.tickets.iterator();
                    while (iterator.hasNext()) {
                        Ticket ticket = iterator.next();
                        if (ticket.getHolder().equals(holder)) {
                            iterator.remove();
                            money += ticket.getPass().getPrice();
                        }
                    }
                    return money;
                }

                public String report() {
                    StringBuilder report = new StringBuilder();
                    for (Pass pass : Pass.values()) {
                        int sold = 0;
                        for (Ticket ticket : this.tickets) {
                            if (ticket.getPass() == pass) {
                                sold++;
                            }
                        }
                        if (report.length() > 0) {
                            report.append("\n");
                        }
                        report.append(pass).append(": ").append(sold).append(" sold, ").append(sold * pass.getPrice()).append(" dollars");
                    }
                    return report.toString();
                }
            }
