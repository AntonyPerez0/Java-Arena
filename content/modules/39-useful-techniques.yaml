          Wallet.java: |
            import java.util.ArrayList;
            import java.util.Iterator;

            public class Wallet {
                private ArrayList<Coupon> coupons;

                public Wallet() {
                    this.coupons = new ArrayList<>();
                }

                public void add(Coupon coupon) {
                    this.coupons.add(coupon);
                }

                public void removeExpired(int today) {
                    Iterator<Coupon> iterator = this.coupons.iterator();
                    while (iterator.hasNext()) {
                        if (iterator.next().getLastDay() < today) {
                            iterator.remove();
                        }
                    }
                }

                public int use(String code) {
                    Iterator<Coupon> iterator = this.coupons.iterator();
                    while (iterator.hasNext()) {
                        Coupon coupon = iterator.next();
                        if (coupon.getCode().equals(code)) {
                            iterator.remove();
                            return coupon.getPercent();
                        }
                    }
                    return 0;
                }

                @Override
                public String toString() {
                    return this.coupons.toString();
                }
            }
