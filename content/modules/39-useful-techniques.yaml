      - task: |
          On a parade ground, a marching band faces north, east, south or west, and at the command "right face", everyone makes a quarter turn clockwise. Write:

          - in `Direction.java`, the enum `Direction`, with the constants `NORTH`, `EAST`, `SOUTH` and `WEST`, in that order (clockwise)
          - in `Main.java`, the method `turnRight(Direction facing)`, which returns the direction after a quarter turn clockwise: north to east, east to south, south to west, and west back to north

          `main` is a test drive, and it prints:

          ```
          NORTH
          EAST
          SOUTH
          WEST
          NORTH
          ```
        seed:
          Direction.java: |
            public enum Direction {

            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Direction facing = Direction.NORTH;
                    for (int i = 0; i < 5; i++) {
                        System.out.println(facing);
                        facing = turnRight(facing);
                    }
                }

                // Write the method turnRight here.
            }
        solution:
          Direction.java: |
            public enum Direction {
                NORTH, EAST, SOUTH, WEST
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Direction facing = Direction.NORTH;
                    for (int i = 0; i < 5; i++) {
                        System.out.println(facing);
                        facing = turnRight(facing);
                    }
                }

                public static Direction turnRight(Direction facing) {
                    Direction[] all = Direction.values();
                    return all[(facing.ordinal() + 1) % all.length];
                }
            }
        hints:
          - "The enum is one line inside its braces: the four constants, separated by commas. The method's header is `public static Direction turnRight(Direction facing)`."
          - "Since the constants are in clockwise order, the next direction is the next constant: `Direction.values()[facing.ordinal() + 1]`, except that after WEST comes NORTH again. `% 4` (or `% values().length`) takes care of that. Three `if`s with `==` work too."
