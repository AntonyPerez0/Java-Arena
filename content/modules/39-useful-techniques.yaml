id: useful-techniques
summary: The tools that round off part 10. The traditional for loop once more, for counting down, taking steps and working with indexes; StringBuilder, for building a text piece by piece; regular expressions, which check the form of a string with matches, alternation, groups, quantifiers and character classes; enums, types with a fixed set of values, with fields, a constructor and methods of their own; and iterators, which can remove elements while going through a collection. Last, a look back at the whole of part 10. MOOC sections 10.3 and 10.4.
steps:
  - id: useful-techniques-for-loop
    slug: for-loop-again
    title: The for loop again
    text: |
      Since module 14, you've gone through lists mostly with for-each loops, and module 37 added streams. Both hand you the values one at a time, which is often all a loop needs. The traditional `for` loop from module 9 is still the tool when the loop needs numbers of its own: counting down, jumping ahead by more than one, or knowing *where* each value is. The MOOC's section 10.3 names it first among its learning goals, so this module starts with it, as a recap.

      ### Three parts, any numbers

      `for (start; condition; change)`: the start runs once, the condition is checked before every round, and the change runs at the end of every round. Nothing says that the change must be `i++`. The last seconds of a quiz round count down:

      ```java main
      for (int seconds = 5; seconds >= 1; seconds--) {
          System.out.println(seconds + "...");
      }
      System.out.println("Time's up!");
      ```

      ```output
      5...
      4...
      3...
      2...
      1...
      Time's up!
      ```

      Counting down, the condition turns around too: the loop goes on while `seconds >= 1`. Written as `seconds <= 1`, the condition would be false before the first round (5 isn't at most 1), and the loop would never run, without any error message.

      To jump by more than one, write the change with `+=` or `-=`. Between 2024 and 2040, every fourth year is a leap year:

      ```java main
      for (int year = 2024; year <= 2040; year += 4) {
          System.out.println(year + " is a leap year");
      }
      ```

      ```output
      2024 is a leap year
      2028 is a leap year
      2032 is a leap year
      2036 is a leap year
      2040 is a leap year
      ```

      ### Loops over indexes

      A for-each loop gives you each value, but not its position. When the position matters, loop over the indexes instead, from 0 up to `size() - 1` for a list (`length - 1` for an array). You need the indexes:

      - to compare a value with the one before it or after it
      - to go through two lists side by side, with the same index in both
      - to go through a list backwards, or to take only every second value

      A school garden measures its sunflower every Monday. The growth in a week is a height minus the height of the week before:

      ```java main
      ArrayList<Integer> heights = new ArrayList<>();
      heights.add(12);
      heights.add(19);
      heights.add(31);
      heights.add(30);
      heights.add(45);
      for (int i = 1; i < heights.size(); i++) {
          int growth = heights.get(i) - heights.get(i - 1);
          System.out.println("Week " + i + ": " + growth + " cm");
      }
      ```

      ```output
      Week 1: 7 cm
      Week 2: 12 cm
      Week 3: -1 cm
      Week 4: 15 cm
      ```

      - The loop starts from index 1, since the first height has no week before it. Starting from 0, the first round would ask for `heights.get(-1)`, and the program would stop with an IndexOutOfBoundsException.
      - `i < heights.size()` makes the last round the last index, 4.
      - `i` is also the week's number, which a for-each loop wouldn't know.

      Module 14's way of removing values from a list, a loop that goes backwards with `for (int i = list.size() - 1; i >= 0; i--)`, is an index loop too. Step 7 shows another way to remove, the iterator.

      | The loop needs | Use |
      | --- | --- |
      | each value, from the first to the last | a for-each loop (or a stream) |
      | numbers that count down, or go up in steps | `for` with `--`, `+=` or `-=` |
      | positions: neighbors, two lists at once, going backwards | `for` over the indexes |

      **Your turn:** in `Main.java`, write the method `biggestGrowth(ArrayList<Integer> heights)` with a `for` loop over the indexes. It returns the sunflower's biggest growth from one week to the next: the largest `heights.get(i) - heights.get(i - 1)`. If the sunflower never grew, or the list has fewer than two heights, the method returns 0. The check runs:

      ```java fragment
      ArrayList<Integer> heights = new ArrayList<>();
      heights.add(12);
      heights.add(19);
      heights.add(31);
      heights.add(30);
      heights.add(45);
      System.out.println(biggestGrowth(heights));
      ```

      and expects:

      ```
      15
      ```
    seed: |
      import java.util.ArrayList;

      public class Main {
          public static void main(String[] args) {
              ArrayList<Integer> heights = new ArrayList<>();
              heights.add(12);
              heights.add(19);
              heights.add(31);
              heights.add(30);
              heights.add(45);
              System.out.println(biggestGrowth(heights));
          }

          public static int biggestGrowth(ArrayList<Integer> heights) {
              return 0;
          }
      }
    solution: |
      import java.util.ArrayList;

      public class Main {
          public static void main(String[] args) {
              ArrayList<Integer> heights = new ArrayList<>();
              heights.add(12);
              heights.add(19);
              heights.add(31);
              heights.add(30);
              heights.add(45);
              System.out.println(biggestGrowth(heights));
          }

          public static int biggestGrowth(ArrayList<Integer> heights) {
              int biggest = 0;
              for (int i = 1; i < heights.size(); i++) {
                  int growth = heights.get(i) - heights.get(i - 1);
                  if (growth > biggest) {
                      biggest = growth;
                  }
              }
              return biggest;
          }
      }
    hints:
      - "Keep the biggest growth so far in a variable that starts at 0. Then a week in which the plant shrank never replaces it, and a list of one height, or none, gives 0."
      - "Loop with `for (int i = 1; i < heights.size(); i++)`, work out `heights.get(i) - heights.get(i - 1)`, and keep it when it's bigger than the biggest so far."
    require:
      - pattern: '\bfor\s*\([^:;]*;'
        message: "Use a `for` loop over the indexes, such as `for (int i = 1; i < heights.size(); i++)`."
    forbid:
      - pattern: '\bfor\s*\([^;)]*:'
        message: "A for-each loop doesn't know where each height is. Loop over the indexes, so that you can take the height before, at `i - 1`."
    tests:
      - call: |
          ArrayList<Integer> heights = new ArrayList<>();
          heights.add(12);
          heights.add(19);
          heights.add(31);
          heights.add(30);
          heights.add(45);
          System.out.println(biggestGrowth(heights));
      - call: |
          ArrayList<Integer> heights = new ArrayList<>();
          System.out.println(biggestGrowth(heights));
          heights.add(50);
          System.out.println(biggestGrowth(heights));
          heights.add(48);
          heights.add(40);
          System.out.println(biggestGrowth(heights));
        hidden: true
      - call: |
          ArrayList<Integer> heights = new ArrayList<>();
          heights.add(3);
          heights.add(10);
          heights.add(17);
          heights.add(17);
          heights.add(30);
          heights.add(31);
          System.out.println(biggestGrowth(heights));
          ArrayList<Integer> other = new ArrayList<>();
          other.add(100);
          other.add(1);
          other.add(90);
          System.out.println(biggestGrowth(other) + " " + other.size());
        hidden: true
