              tracks.add(45);
              tracks.add(187);
              tracks.add(30);
              tracks.add(302);

              Iterator<Integer> iterator = tracks.[[iterator]]();
              while (iterator.[[hasNext]]()) {
                  int seconds = iterator.[[next]]();
                  if (seconds < 60) {
                      iterator.[[remove]]();
                  }
              }
              System.out.println(tracks);
          }
      }
