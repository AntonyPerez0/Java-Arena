          Bill.java: |
            public enum Bill {
                ONE(1),
                FIVE(5),
                TEN(10),
                TWENTY(20);

                private int dollars;

                private Bill(int dollars) {
                    this.dollars = dollars;
                }

                public int getDollars() {
                    return this.dollars;
                }
            }
          Main.java: |
            import java.util.ArrayList;

            public class Main {
                public static void main(String[] args) {
                    System.out.println(change(68));
                    System.out.println(change(30));
                }

                public static ArrayList<Bill> change(int dollars) {
                    ArrayList<Bill> bills = new ArrayList<>();
                    Bill[] kinds = Bill.values();
                    for (int i = kinds.length - 1; i >= 0; i--) {
                        while (dollars >= kinds[i].getDollars()) {
                            bills.add(kinds[i]);
                            dollars -= kinds[i].getDollars();
                        }
                    }
                    return bills;
                }
            }
