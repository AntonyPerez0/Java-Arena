          names.add("Maria Lopez");
          names.add("Tom");
          names.add("Ines");
          names.add("Tom");
          System.out.println(guestList(names));
          System.out.println(names.size());
        hidden: true
    more:
      - task: |
          What does this program print?
        predict: |
          public class Main {
              public static void main(String[] args) {
                  StringBuilder text = new StringBuilder("cat");
                  text.append("s").insert(0, "3 ");
                  System.out.println(text + " " + text.length());
                  text.reverse();
                  System.out.println(text);
                  StringBuilder same = text;
                  same.append("!");
                  System.out.println(text);
              }
          }
        hints:
          - "`append(\"s\")` gives `cats`, and it returns the same StringBuilder, so `insert(0, \"3 \")` adds to its front: `3 cats`, which is 6 characters long, the space included."
          - "`reverse()` turns the whole text around, the space too. `same = text` makes no copy: both variables refer to the one StringBuilder, so the `!` shows up when `text` is printed."
      - task: |
          Big numbers are easier to read with a comma between every three digits, counted from the right: 1,234,567. Write the method `withCommas(int number)`, which returns the number written that way, for any number from 0 up. Put the digits in a StringBuilder, and insert the commas with a `for` loop that goes backwards from the end, three digits at a time. The check runs:

          ```java fragment
          System.out.println(withCommas(1234567));
          System.out.println(withCommas(950));
          System.out.println(withCommas(20000));
          ```

          and expects:

          ```
          1,234,567
          950
          20,000
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(withCommas(1234567));
                  System.out.println(withCommas(950));
                  System.out.println(withCommas(20000));
              }

              public static String withCommas(int number) {
                  return "" + number;
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(withCommas(1234567));
                  System.out.println(withCommas(950));
                  System.out.println(withCommas(20000));
              }

              public static String withCommas(int number) {
                  StringBuilder digits = new StringBuilder();
                  digits.append(number);
                  for (int i = digits.length() - 3; i > 0; i -= 3) {
                      digits.insert(i, ",");
                  }
                  return digits.toString();
              }
          }
        hints:
          - "`new StringBuilder().append(number)` holds the digits (`new StringBuilder(number)` would only set its starting room and stay empty). The first comma goes in front of the last three digits, at index `length() - 3`, and each comma after that three places further left."
          - "Loop with `for (int i = digits.length() - 3; i > 0; i -= 3)` and `digits.insert(i, \",\")`. Going from the right, the commas already added are all to the right of `i`, so they don't move the digits still to come. `i > 0` stops a comma from going in front of the first digit."
        require:
          - pattern: '\bnew\s+StringBuilder\s*\('
            message: "Put the digits in a `StringBuilder`."
          - pattern: '\.insert\s*\('
            message: "Add the commas with `insert`."
          - pattern: '\bfor\s*\('
            message: "Insert the commas in a `for` loop that goes backwards, three digits at a time."
        forbid:
          - pattern: '\bString\s*\.\s*format\b|%,'
            raw: true
            message: "Java can format numbers for you, but here the point is to insert the commas yourself."
        tests:
          - call: |
              System.out.println(withCommas(1234567));
              System.out.println(withCommas(950));
              System.out.println(withCommas(20000));
          - call: |
              System.out.println(withCommas(0));
              System.out.println(withCommas(999));
              System.out.println(withCommas(1000));
              System.out.println(withCommas(100000));
            hidden: true
          - call: |
              System.out.println(withCommas(2147483647));
              System.out.println(withCommas(12345));
              System.out.println(withCommas(7));
            hidden: true

  - id: useful-techniques-regex
    slug: regular-expressions
    title: "Regular expressions: matches, | and groups"
    text: |
      Is `KTX-0415` a booking code of the right form? Is `9021O` a postcode, or a typo with the letter O in it? Checking the form of a string with `charAt` and loops takes many lines. A **regular expression**, or **regex** for short, describes a form in one short String, and String's method `matches` checks whether a string has that form.

      ### matches

      ```java main
      System.out.println("yes".matches("yes"));
      System.out.println("Yes".matches("yes"));
      System.out.println("yes!".matches("yes"));
      ```

      ```output
      true
      false
      false
      ```

      - Letters and digits in a regex stand for themselves, so the regex `yes` describes exactly the text yes.
      - Upper and lower case differ, as they do for `equals`.
      - The **whole** string must fit the regex: `yes!` has a `!` left over.

      So far, that's what `equals` does. The rest of this step and the next are what `equals` can't do.

      ### Alternation: |

      A `|` means "or". The regex `yes|y|ok` describes three texts, and a string matches if it's any one of them:

      ```java main
      String[] answers = {"yes", "y", "ok", "okay", "no"};
      for (String answer : answers) {
          System.out.println(answer + ": " + answer.matches("yes|y|ok"));
      }
      ```

      ```output
      yes: true
      y: true
      ok: true
      okay: false
      no: false
      ```

      `okay` begins with `ok`, but the whole string has to fit one of the three.

      ### Groups: ( )

      A `|` splits the whole regex in two. A ferry sells four kinds of tickets: `adult single`, `adult return`, `child single` and `child return`. The regex `adult|child single|return` would mean three choices: `adult`, `child single` or `return`. Parentheses make a **group**, and a `|` inside a group chooses only there:

      ```java main
      String ticket = "(adult|child) (single|return)";
      System.out.println("child return".matches(ticket));
      System.out.println("adult single".matches(ticket));
      System.out.println("adult".matches(ticket));
      System.out.println("senior single".matches(ticket));
      ```

      ```output
      true
      true
      false
      false
      ```

      The regex describes four texts: one of the words in the first group, a space, and one of the words in the second group. A group can be a part of a word, too: `gr(a|e)y` matches both gray and grey.

      ```java main
      System.out.println("grey".matches("gr(a|e)y") + " " + "gray".matches("gr(a|e)y") + " " + "groy".matches("gr(a|e)y"));
      ```

      ```output
      true true false
      ```

      ### Characters with a meaning of their own

      `|`, `(` and `)` aren't matched as themselves: they're part of the regex's own language. So are a few more characters, `. * + ? [ { ^ $ \`, and also `]` and `}` when they close a `[` or a `{`. Step 4 gives most of them their meaning. (`^` and `$` mark the start and the end of the text, which `matches` checks anyway.) Letters, digits, spaces, dashes and colons are plain characters. To match a special character as itself, put `\\` in front of it in the Java String: in a regex, a backslash takes the special meaning away, and in a Java String, `\\` is how you write one backslash.

      ```java main
      System.out.println("(1)".matches("\\(1\\)"));
      ```

      ```output
      true
      ```

      **Your turn:** an ice cream stand sells four things: `single cone`, `single cup`, `double cone` and `double cup`. Fill in the regex, with two groups, so that it describes exactly those four. The program then prints:

      ```
      single cone: true
      double cup: true
      single cup: true
      double cone: true
      triple cone: false
      double: false
      single cones: false
      ```
