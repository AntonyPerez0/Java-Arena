            public class Seedling {
                private String name;
                private int price;

                public Seedling(String name, int price) {
                    this.name = name;
                    this.price = price;
                }

                public int getPrice() {
                    return this.price;
                }

                @Override
                public String toString() {
                    return this.name + " (" + this.price + " dollars)";
                }
            }
          Tray.java: |
            import java.util.ArrayList;

            public class Tray {
                private ArrayList<Seedling> seedlings;

                public Tray() {
                    this.seedlings = new ArrayList<>();
                }

                public boolean add(Seedling seedling) {
                    if (this.seedlings.size() >= 6) {
                        return false;
                    }
                    this.seedlings.add(seedling);
                    return true;
                }

                public int total() {
                    int sum = 0;
                    for (Seedling seedling : this.seedlings) {
                        sum += seedling.getPrice();
                    }
                    return sum;
                }

                @Override
                public String toString() {
                    return this.seedlings.size() + " seedlings, " + this.total() + " dollars";
                }
            }
