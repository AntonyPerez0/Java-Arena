          `Patient.java` is ready. Write the class `Bed` in `Bed.java`:

          - A new bed is free: its patient is `null`.
          - `assign` puts the patient in the bed and returns `true`, but only if the bed is free. A bed that has a patient keeps them, and `assign` returns `false`.
          - `release` makes the bed free, and `getPatient` returns the bed's patient, or `null` for a free bed.
