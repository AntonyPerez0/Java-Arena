        tests:
          - name: The program's output
          - call: |
              Greenhouse cactus = new Greenhouse("Cactus house", 30.0);
              System.out.println(cactus.isOpen() + " " + cactus.getDegrees());
              cactus.warm(0.5);
              cactus.openVents();
              System.out.println(cactus.getName() + " " + cactus.isOpen() + " " + cactus.getDegrees());
            hidden: true
      - task: |
          A board-game café lends games to its guests, and pieces go missing. Write the class `GameBox` in `GameBox.java`, as this box shows:

          ```classes
          class GameBox
          - title: String
          - pieces: int
          - missing: int
          + GameBox(title: String, pieces: int)
          + lose(count: int): void
          + find(count: int): void
          + isComplete(): boolean
          + toString(): String
          - present(): int
          ```

          - A new box has all its pieces: none are missing.
          - `lose` adds to the missing pieces. `find` takes found pieces off them, but never below 0.
          - `isComplete` says whether no pieces are missing.
          - `present` is a private helper that returns how many pieces are in the box. `toString` uses it, and returns `Harbor Lights: 80 of 84 pieces`, with the box's own title and numbers.

          The check runs:

          ```java fragment
          GameBox box = new GameBox("Harbor Lights", 84);
          box.lose(5);
          box.find(1);
          System.out.println(box + " " + box.isComplete());
          box.find(10);
          System.out.println(box + " " + box.isComplete());
          ```

          and expects:

          ```
          Harbor Lights: 80 of 84 pieces false
          Harbor Lights: 84 of 84 pieces true
          ```
        seed:
          GameBox.java: |
            public class GameBox {

            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    GameBox box = new GameBox("Harbor Lights", 84);
                    box.lose(5);
                    box.find(1);
                    System.out.println(box + " " + box.isComplete());
                    box.find(10);
                    System.out.println(box + " " + box.isComplete());
                }
            }
        solution:
          GameBox.java: |
            public class GameBox {
                private String title;
                private int pieces;
                private int missing;

                public GameBox(String title, int pieces) {
                    this.title = title;
                    this.pieces = pieces;
                    this.missing = 0;
                }

                public void lose(int count) {
                    this.missing += count;
                }

                public void find(int count) {
                    this.missing -= count;
                    if (this.missing < 0) {
                        this.missing = 0;
                    }
                }

                public boolean isComplete() {
                    return this.missing == 0;
                }

                @Override
                public String toString() {
                    return this.title + ": " + this.present() + " of " + this.pieces + " pieces";
                }

                private int present() {
                    return this.pieces - this.missing;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    GameBox box = new GameBox("Harbor Lights", 84);
                    box.lose(5);
                    box.find(1);
                    System.out.println(box + " " + box.isComplete());
                    box.find(10);
                    System.out.println(box + " " + box.isComplete());
                }
            }
        hints:
          - "Three instance variables, a constructor that sets `missing` to 0, and a method for each line of the box. The `-` in front of `present` makes it `private int present()`."
          - "`find` subtracts, then sets `missing` back to 0 if it went below. `present()` returns the pieces minus the missing ones, and `toString` calls `this.present()`."
        require:
          - pattern: \bprivate\s+int\s+present\s*\(\s*\)
            message: "The box's line `-present(): int` is a private method: `private int present()`."
          - pattern: \bpresent\s*\(\s*\)
