    solution:
      Wheelchair.java: |
        public class Wheelchair implements Cleanable {
            private int number;
            private int uses;

            public Wheelchair(int number) {
                this.number = number;
                this.uses = 0;
            }

            public void use() {
                this.uses++;
            }

            @Override
            public void clean() {
                this.uses = 0;
            }

            @Override
            public boolean isClean() {
                return this.uses == 0;
            }

            @Override
            public String toString() {
                return "Wheelchair " + this.number + ": " + this.uses + " uses since cleaning";
            }
        }
      Cleanable.java: |
        public interface Cleanable {
            void clean();
            boolean isClean();
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Wheelchair chair = new Wheelchair(7);
                chair.use();
                chair.use();
                System.out.println(chair + " " + chair.isClean());
                Cleanable job = chair;
                job.clean();
                System.out.println(chair + " " + chair.isClean());
            }
        }
