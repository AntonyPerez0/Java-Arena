        solution:
          Billable.java: |
            public interface Billable {
                int price();
            }
          TableTime.java: |
            public class TableTime implements Billable {
                private int hours;
                private int players;

                public TableTime(int hours, int players) {
                    this.hours = hours;
                    this.players = players;
                }

                @Override
                public int price() {
                    return 3 * this.players * this.hours;
                }
            }
          Drink.java: |
            public class Drink implements Billable {
                private String name;
                private boolean large;

                public Drink(String name, boolean large) {
                    this.name = name;
                    this.large = large;
                }

                @Override
                public int price() {
                    if (this.large) {
                        return 6;
                    }
                    return 4;
                }
            }
          Visit.java: |
            import java.util.ArrayList;

            public class Visit {
                private String guest;
                private ArrayList<Billable> items;

                public Visit(String guest) {
                    this.guest = guest;
                    this.items = new ArrayList<>();
                }

                public void add(Billable item) {
                    this.items.add(item);
                }

                public int total() {
                    int sum = 0;
                    for (Billable item : this.items) {
                        sum += item.price();
                    }
                    return sum;
                }

                @Override
                public String toString() {
                    return "Visit of " + this.guest + ": " + this.items.size() + " items, " + this.total() + " dollars";
                }
            }
