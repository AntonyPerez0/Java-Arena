      - task: |
          A garden center planned its shrubs with this box:

          ```classes
          class Shrub
          - species: String
          - height: double
          - potLiters: int
          ```

          In `Shrub.java`, two instance variables don't match the box, and the program prints `Lilac: 19 cm, pot 10 liters`: half centimeters get lost along the way. Fix those two lines, and leave the constructor and the methods as they are. The program should print:

          ```
          Lilac: 20.0 cm, pot 10 liters
          ```
        seed:
          Shrub.java: |
            public class Shrub {
                public String species;
                private int height;
                private int potLiters;

                public Shrub(String species, int potLiters) {
                    this.species = species;
                    this.height = 0;
                    this.potLiters = potLiters;
                }

                public void grow(double centimeters) {
                    this.height += centimeters;
                }

                @Override
                public String toString() {
                    return this.species + ": " + this.height + " cm, pot " + this.potLiters + " liters";
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Shrub lilac = new Shrub("Lilac", 10);
                    lilac.grow(12.5);
                    lilac.grow(7.5);
                    System.out.println(lilac);
                }
            }
        solution:
          Shrub.java: |
            public class Shrub {
                private String species;
                private double height;
                private int potLiters;

                public Shrub(String species, int potLiters) {
                    this.species = species;
                    this.height = 0;
                    this.potLiters = potLiters;
                }

                public void grow(double centimeters) {
                    this.height += centimeters;
                }

                @Override
                public String toString() {
                    return this.species + ": " + this.height + " cm, pot " + this.potLiters + " liters";
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Shrub lilac = new Shrub("Lilac", 10);
                    lilac.grow(12.5);
                    lilac.grow(7.5);
                    System.out.println(lilac);
                }
            }
        hints:
          - "Compare each line of the box with its instance variable: the sign (`-` is private), the name and the type."
          - "`species` should be `private`, and `height` should be a `double`. With an `int`, `+=` drops the half centimeter of each `grow`."
        require:
          - pattern: \bprivate\s+String\s+species\s*;
            message: "The `-` in front of `species: String` means private: `private String species;`."
          - pattern: \bprivate\s+double\s+height\s*;
            message: "The box says `-height: double`, so the instance variable is `private double height;`."
        tests:
          - name: The program's output
          - call: |
              Shrub box = new Shrub("Boxwood", 3);
              box.grow(0.5);
              box.grow(0.25);
              System.out.println(box);
            hidden: true

  - id: class-diagrams-methods
    slug: methods
    title: Constructors and methods in a box
    text: |
      A box has room for more than fields. Under a second line come the class's constructors and methods. Here's the recycling center's bin with them:

      ```classes
      class Bin
      - material: String
      - capacity: int
      - load: int
      + Bin(material: String, capacity: int)
      + getMaterial(): String
      + add(kilos: int): boolean
      + empty(): void
      + toString(): String
      ```

      - A **constructor** is the class's name with its parameters in parentheses, and nothing after them: a constructor has no return type, in a diagram as in Java.
      - A **method** is its name, its parameters in parentheses, a colon and its **return type**: `getMaterial(): String` returns a String. A method that returns nothing has `void`.
      - Each **parameter** is written like a field, name first: `add(kilos: int)` takes an int called `kilos`. Parameters are separated by commas, and a method without parameters has empty parentheses.
      - The sign in front is the visibility again. Constructors and methods that other classes call are public, `+`. A private helper method gets a `-`.
      - Constructors come first, then methods.

      So each line gives you a header:

      | In the box | In Java |
      |---|---|
      | `+Bin(material: String, capacity: int)` | `public Bin(String material, int capacity)` |
      | `+getMaterial(): String` | `public String getMaterial()` |
      | `+add(kilos: int): boolean` | `public boolean add(int kilos)` |
      | `+empty(): void` | `public void empty()` |

      `toString` is one of Bin's methods, so it has a line too. `@Override` isn't shown: a box shows headers, and nothing above them or inside them.

      ### What a box doesn't say

      The box gives every header, but not what the methods do. Does `add` refuse a load that doesn't fit? What does `toString` return? A diagram leaves that to the code, or, before the code exists, to words. The team that drew this box agreed that a new bin is empty, that `add` puts the load in and returns `true` only if the bin's load stays within its capacity (otherwise it changes nothing and returns `false`), and that `empty` sets the load back to 0. With those words and the box, the class almost writes itself:

      ```java run
      public class Main {
          public static void main(String[] args) {
              Bin glass = new Bin("glass", 500);
              System.out.println(glass.add(300));
              System.out.println(glass.add(250));
              System.out.println(glass);
              glass.empty();
              System.out.println(glass.add(250) + " " + glass.getMaterial());
          }
      }
      // ==== Bin.java ====
      public class Bin {
          private String material;
          private int capacity;
          private int load;

          public Bin(String material, int capacity) {
              this.material = material;
              this.capacity = capacity;
              this.load = 0;
          }

          public String getMaterial() {
              return this.material;
          }

          public boolean add(int kilos) {
              if (this.load + kilos > this.capacity) {
                  return false;
              }
              this.load += kilos;
              return true;
          }

          public void empty() {
              this.load = 0;
          }

          @Override
          public String toString() {
              return this.material + ": " + this.load + "/" + this.capacity + " kg";
          }
      }
      ```

      ```output
      true
      false
      glass: 300/500 kg
      true glass
      ```

      The challenges in this module work the same way: a box, and words that say what the methods do. Follow the box's headers exactly. Other classes call the methods by those names, with those types, and a header that's different can make their calls fail to compile, or quietly change what they compute.

      **Your turn:** the ward gives each of its beds an object. Write the class `Bed` in `Bed.java`, as this box shows:

      ```classes
      class Bed
      - number: int
      - patient: String
      + Bed(number: int)
      + isFree(): boolean
      + assign(name: String): void
      + release(): void
      + toString(): String
      ```

      - A new bed is free: its patient is `null`.
      - `assign` puts the patient's name in the bed, and `release` makes the bed free again.
      - `isFree` says whether the bed is free.
      - `toString` returns `Bed 4: free` for a free bed and `Bed 4: Ines Moreau` for a bed with a patient, with the bed's own number and patient.

      The check runs:

      ```java fragment
      Bed bed = new Bed(4);
      System.out.println(bed + " " + bed.isFree());
      bed.assign("Ines Moreau");
      System.out.println(bed + " " + bed.isFree());
      bed.release();
      System.out.println(bed);
      ```

      and expects:

      ```
      Bed 4: free true
      Bed 4: Ines Moreau false
      Bed 4: free
      ```
    seed:
      Bed.java: |
        public class Bed {

        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Bed bed = new Bed(4);
                System.out.println(bed + " " + bed.isFree());
                bed.assign("Ines Moreau");
                System.out.println(bed + " " + bed.isFree());
                bed.release();
                System.out.println(bed);
            }
        }
    solution:
      Bed.java: |
        public class Bed {
            private int number;
            private String patient;

            public Bed(int number) {
                this.number = number;
                this.patient = null;
            }

            public boolean isFree() {
                return this.patient == null;
            }

            public void assign(String name) {
                this.patient = name;
            }

            public void release() {
                this.patient = null;
            }

            @Override
            public String toString() {
                if (this.isFree()) {
                    return "Bed " + this.number + ": free";
                }
                return "Bed " + this.number + ": " + this.patient;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Bed bed = new Bed(4);
                System.out.println(bed + " " + bed.isFree());
                bed.assign("Ines Moreau");
                System.out.println(bed + " " + bed.isFree());
                bed.release();
                System.out.println(bed);
            }
        }
    hints:
      - "Start with the two instance variables from the box's fields, then the constructor `public Bed(int number)`. Each method line becomes a header: `+assign(name: String): void` is `public void assign(String name)`."
      - "`isFree` returns `this.patient == null`, and `release` sets the patient back to `null`. `toString` checks `isFree()` and returns one text or the other."
    require:
      - pattern: \bprivate\s+String\s+patient\s*;
        message: "The box's field `-patient: String` is `private String patient;`."
      - pattern: \bpublic\s+void\s+assign\s*\(\s*String\s+\w+\s*\)
        message: "The box's line `+assign(name: String): void` is the header `public void assign(String name)`."
    tests:
      - call: |
          Bed bed = new Bed(4);
          System.out.println(bed + " " + bed.isFree());
          bed.assign("Ines Moreau");
          System.out.println(bed + " " + bed.isFree());
          bed.release();
          System.out.println(bed);
      - call: |
          Bed first = new Bed(1);
          Bed second = new Bed(2);
          second.assign("Oskar Lund");
          System.out.println(first.isFree() + " " + second.isFree());
          System.out.println(first + " / " + second);
          second.release();
          first.assign("Mei Tan");
          System.out.println(first + " / " + second);
        hidden: true
    more:
      - task: |
          A garden center's greenhouses open their vents when it gets warm. The team drew this box, and `Main.java` was written from it:

          ```classes
          class Greenhouse
          - name: String
          - degrees: double
          - open: boolean
          + Greenhouse(name: String, degrees: double)
          + getName(): String
          + getDegrees(): double
          + isOpen(): boolean
          + warm(by: double): void
          + openVents(): void
          ```

          In `Greenhouse.java`, three method headers don't match the box, so the program doesn't compile. Fix them (and anything inside those methods that has to change with them), so that the class matches the box. Leave `Main.java` as it is. The program should print:

          ```
          Palm house: true, 26.0 degrees
          ```
        seed:
          Greenhouse.java: |
            public class Greenhouse {
                private String name;
                private double degrees;
                private boolean open;

                public Greenhouse(String name, double degrees) {
                    this.name = name;
                    this.degrees = degrees;
                    this.open = false;
                }

                public String getName() {
                    return this.name;
                }

                public int getDegrees() {
                    return this.degrees;
                }

                public boolean isOpen() {
                    return this.open;
                }

                public void warm(int by) {
                    this.degrees += by;
                }

                private void openVents() {
                    this.open = true;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Greenhouse palm = new Greenhouse("Palm house", 24.5);
                    palm.warm(1.5);
                    if (palm.getDegrees() > 25) {
                        palm.openVents();
                    }
                    System.out.println(palm.getName() + ": " + palm.isOpen() + ", " + palm.getDegrees() + " degrees");
                }
            }
        solution:
          Greenhouse.java: |
            public class Greenhouse {
                private String name;
                private double degrees;
                private boolean open;

                public Greenhouse(String name, double degrees) {
                    this.name = name;
                    this.degrees = degrees;
                    this.open = false;
                }

                public String getName() {
                    return this.name;
                }

                public double getDegrees() {
                    return this.degrees;
                }

                public boolean isOpen() {
                    return this.open;
                }

                public void warm(double by) {
                    this.degrees += by;
                }

                public void openVents() {
                    this.open = true;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Greenhouse palm = new Greenhouse("Palm house", 24.5);
                    palm.warm(1.5);
                    if (palm.getDegrees() > 25) {
                        palm.openVents();
                    }
