                public String getName() {
                    return this.name;
                }

                @Override
                public String toString() {
                    return this.name + ", room " + this.room + ", " + this.temperature + " degrees";
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Bed bed = new Bed(3);
                    Patient ines = new Patient("Ines Moreau", 12, 38.4);
                    Patient oskar = new Patient("Oskar Lund", 12, 36.9);
                    System.out.println(bed);
                    System.out.println(bed.assign(ines) + " " + bed.assign(oskar));
                    System.out.println(bed);
                    bed.release();
                    System.out.println(bed.getPatient() == null);
                }
            }
        solution:
          Bed.java: |
            public class Bed {
                private int number;
                private Patient patient;

                public Bed(int number) {
                    this.number = number;
                    this.patient = null;
                }

                public Patient getPatient() {
                    return this.patient;
                }

                public boolean assign(Patient patient) {
                    if (this.patient != null) {
                        return false;
                    }
                    this.patient = patient;
                    return true;
                }

                public void release() {
                    this.patient = null;
                }

                @Override
                public String toString() {
                    if (this.patient == null) {
                        return "Bed " + this.number + ": free";
                    }
                    return "Bed " + this.number + ": " + this.patient.getName();
                }
            }
          Patient.java: |
            public class Patient {
                private String name;
                private int room;
                private double temperature;

                public Patient(String name, int room, double temperature) {
                    this.name = name;
                    this.room = room;
                    this.temperature = temperature;
                }

                public String getName() {
                    return this.name;
                }

                @Override
                public String toString() {
                    return this.name + ", room " + this.room + ", " + this.temperature + " degrees";
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Bed bed = new Bed(3);
                    Patient ines = new Patient("Ines Moreau", 12, 38.4);
                    Patient oskar = new Patient("Oskar Lund", 12, 36.9);
                    System.out.println(bed);
                    System.out.println(bed.assign(ines) + " " + bed.assign(oskar));
                    System.out.println(bed);
                    bed.release();
                    System.out.println(bed.getPatient() == null);
                }
            }
        hints:
          - "The arrow with `0..1` is a field that may be `null`: `private Patient patient;`, set to `null` in the constructor."
          - "`assign` checks `this.patient != null` first and returns `false` if the bed is taken. `toString` must check for `null` too, before it calls `this.patient.getName()`."
        require:
          - pattern: \bprivate\s+Patient\s+patient\s*;
            message: "The arrow from Bed to Patient, named `patient`, is a field: `private Patient patient;`."
        tests:
