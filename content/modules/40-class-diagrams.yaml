      Ward.java: |
        import java.util.ArrayList;

        public class Ward {
            private String name;
            private ArrayList<Patient> patients;

            public Ward(String name) {
                this.name = name;
                this.patients = new ArrayList<>();
            }

            public void admit(Patient patient) {
                this.patients.add(patient);
            }

            public ArrayList<Patient> withFever() {
                ArrayList<Patient> fever = new ArrayList<>();
                for (Patient patient : this.patients) {
                    if (patient.getTemperature() >= 38.0) {
                        fever.add(patient);
                    }
                }
                return fever;
            }

            @Override
            public String toString() {
                return this.name + ": " + this.patients.size() + " patients";
            }
        }
      Patient.java: |
        public class Patient {
            private String name;
            private int room;
            private double temperature;

            public Patient(String name, int room, double temperature) {
                this.name = name;
                this.room = room;
                this.temperature = temperature;
            }

            public String getName() {
                return this.name;
            }

            public double getTemperature() {
                return this.temperature;
            }

            @Override
            public String toString() {
                return this.name + ", room " + this.room + ", " + this.temperature + " degrees";
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Ward ward = new Ward("Ward 5B");
                ward.admit(new Patient("Ines Moreau", 12, 38.4));
                ward.admit(new Patient("Oskar Lund", 12, 36.9));
                ward.admit(new Patient("Mei Tan", 14, 38.0));
                System.out.println(ward);
                for (Patient patient : ward.withFever()) {
                    System.out.println(patient.getName());
                }
            }
        }
    hints:
      - "Ward's instance variables are its `name` and, for the arrow with the star, `private ArrayList<Patient> patients;`, created in the constructor with `new ArrayList<>()`. `Ward.java` needs `import java.util.ArrayList;` at the top."
      - "`withFever` makes a new list, adds each patient whose `getTemperature()` is at least 38.0, and returns it. `toString` uses the size of the ward's list."
    require:
      - pattern: \bprivate\s+ArrayList<Patient>\s+\w+\s*[;=]
        message: "The arrow with the star is a list: `private ArrayList<Patient> patients;`."
      - pattern: \bpublic\s+ArrayList<Patient>\s+withFever\s*\(\s*\)
        message: "The box's line `+withFever(): ArrayList<Patient>` is the header `public ArrayList<Patient> withFever()`."
