                }
            }
        hints:
          - "Read javac's messages, then compare each method's header with its line in the box: the sign in front, the parameter's type, and the return type after the colon."
          - "`getDegrees(): double` returns a `double`, `warm(by: double)` takes a `double`, and the `+` in front of `openVents` makes it public."
        require:
          - pattern: \bpublic\s+double\s+getDegrees\s*\(\s*\)
            message: "The box's line `+getDegrees(): double` is the header `public double getDegrees()`."
          - pattern: \bpublic\s+void\s+warm\s*\(\s*double\s+\w+\s*\)
            message: "The box's line `+warm(by: double): void` is the header `public void warm(double by)`."
          - pattern: \bpublic\s+void\s+openVents\s*\(\s*\)
