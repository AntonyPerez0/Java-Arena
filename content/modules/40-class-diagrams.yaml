              Bed bed = new Bed(3);
              Patient ines = new Patient("Ines Moreau", 12, 38.4);
              Patient oskar = new Patient("Oskar Lund", 12, 36.9);
              System.out.println(bed);
              System.out.println(bed.assign(ines) + " " + bed.assign(oskar));
              System.out.println(bed);
              bed.release();
              System.out.println(bed.getPatient() == null);
          - call: |
              Bed a = new Bed(1);
              Bed b = new Bed(2);
              Patient mei = new Patient("Mei Tan", 4, 37.2);
              Patient leo = new Patient("Leo Park", 5, 36.5);
              System.out.println(b.assign(leo));
              a.release();
              System.out.println(a + " / " + b);
              System.out.println(a.assign(mei) + " " + a.getPatient().getName() + " " + b.getPatient().getName());
