      - task: |
          A school's timetable program has two classes in the package `school.domain`: `Period`, a lesson of the day with its subject and its number, and `Teacher`. Main imports the whole package. What does this program print?
        predict: |
          import school.domain.*;

          public class Main {
              public static void main(String[] args) {
                  Teacher teacher = new Teacher("Ms. Ito");
                  teacher.teach(new Period("Math", 1));
                  teacher.teach(new Period("Art", 3));
                  java.util.ArrayList<String> subjects = teacher.subjects();
                  subjects.add("Music");
                  System.out.println(teacher + " " + subjects);
                  System.out.println(subjects.getClass().getName());
                  System.out.println(teacher.getClass().getName());
              }
          }
          // ==== school/domain/Period.java ====
          package school.domain;

          public class Period {
              private String subject;
