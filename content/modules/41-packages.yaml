      - task: |
          In a real project, a class's tests are in the same package as the class, so they can test its package-private methods too. Here the test class is simply one more file in the package's folder.

          `DeskFee.java`, in the package `cowork.logic`, works out what a desk in a coworking space costs. `price(int minutes)` is public, and it uses the package-private helper `startedHours(int minutes)`, which counts every hour that has started: 1 to 60 minutes is 1 hour, 61 to 120 minutes are 2 hours, and so on. The price is the started hours times the price of an hour, but never more than the daily maximum.

          `DeskFeeTest.java` is in the same package and has one test. Add two more, with `assertEquals`:

          - a test of `startedHours`: 1 minute is 1 hour, 60 minutes are 1 hour, and 61 minutes are 2 hours
          - a test of the daily maximum: with 4 dollars an hour and a maximum of 25 dollars, 600 minutes cost 25 dollars

          The checks run your tests on the DeskFee as it is, where every test should pass, and on versions of DeskFee with a bug, where at least one of your tests should fail.
