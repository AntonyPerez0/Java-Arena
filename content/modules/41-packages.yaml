      - task: |
          A school has lockers in its halls and in its gym, and its program has two classes called `Locker`: one in the default package, next to `Main`, and one in the package `school.gym`. What does this program print?
        predict: |
          public class Main {
              public static void main(String[] args) {
                  school.gym.Locker gymLocker = new school.gym.Locker(14);
                  Locker hallLocker = new Locker(14);
                  gymLocker.lock();
                  System.out.println(gymLocker);
                  System.out.println(hallLocker);
                  System.out.println(gymLocker.getClass().getName());
                  System.out.println(hallLocker.getClass().getName());
              }
          }
          // ==== Locker.java ====
          public class Locker {
              private int number;

              public Locker(int number) {
                  this.number = number;
              }

              @Override
              public String toString() {
                  return "Hall locker " + this.number;
              }
          }
          // ==== school/gym/Locker.java ====
          package school.gym;

          public class Locker {
              private int number;
              private boolean locked;

              public Locker(int number) {
                  this.number = number;
                  this.locked = false;
              }

              public void lock() {
                  this.locked = true;
              }

              @Override
              public String toString() {
                  if (this.locked) {
                      return "Gym locker " + this.number + ", locked";
                  }
                  return "Gym locker " + this.number + ", open";
              }
          }
        hints:
          - "`Locker` on its own, with no package, means the Locker of Main's own package: the default one, in `Locker.java` at the top. The full name `school.gym.Locker` means the other class."
          - "`getName()` gives the full name of the object's class: with its package for the gym's locker, and just `Locker` for the class in the default package."
      - task: |
          A beekeeper's program keeps its classes in the folder `apiary/domain/`, for the package `apiary.domain`, but it doesn't compile: the package lines of both files are wrong. `Hive.java` has none, and `Harvest.java` names only part of the package. javac prints many messages for this. The telling one is `file does not contain class apiary.domain.Hive`: javac looked for the class in the folder of its package, and found a file whose package line is missing or says something else.

          Fix the first line of code of each file so that it matches the file's folder. In `Hive.java`, the package line comes first, before the import. Don't change `Main.java`. The program should print:

          ```
          Linden: 2 harvests, 7300 grams
          apiary.domain.Hive
          ```
