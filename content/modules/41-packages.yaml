            package cowork.logic;

            import static org.junit.Assert.assertEquals;

            import org.junit.Test;

            public class DeskFeeTest {
                @Test
                public void priceIsPerStartedHour() {
                    DeskFee fee = new DeskFee(4, 25);
                    assertEquals(8, fee.price(90));
                }

                @Test
                public void startedHoursCountsEveryStartedHour() {
                    DeskFee fee = new DeskFee(4, 25);
                    assertEquals(1, fee.startedHours(1));
                    assertEquals(1, fee.startedHours(60));
                    assertEquals(2, fee.startedHours(61));
                }

                @Test
                public void priceStopsAtTheDailyMaximum() {
                    DeskFee fee = new DeskFee(4, 25);
                    assertEquals(25, fee.price(600));
                }
            }
