      - task: |
          A laundromat's program has three classes that use `Machine`, which is in the package `laundromat.domain`:

          - `Technician`, in the same package, calls `stopNow()`, to stop a machine in the middle of a cycle
          - `Dryer`, a subclass of Machine in the package `laundromat.dryers`, changes `minutesLeft` directly, to add time to a running cycle
          - `Main`, in the default package, creates machines and calls `start` and `pass`

          In `Machine.java`, only the class and `toString` have a word in front of them yet, so the program doesn't compile. Give each variable, the constructor and each method the most restricted access that still works: `private` for what only Machine itself uses, nothing for what only its own package uses, `protected` for what a subclass in another package needs, and `public` for what Main uses. Change only `Machine.java`. The program should print:

          ```
          Machine 4: 25 minutes left
          Machine 9: 25 minutes left
          Machine 4: free
          ```
        seed:
          laundromat/domain/Machine.java: |
            package laundromat.domain;

            public class Machine {
                int number;
                int minutesLeft;

                Machine(int number) {
                    this.number = number;
                    this.minutesLeft = 0;
                }

                void start(int minutes) {
                    this.minutesLeft = minutes;
                }

                void pass(int minutes) {
                    this.minutesLeft -= minutes;
                    if (this.minutesLeft < 0) {
                        this.minutesLeft = 0;
                    }
                }

                void stopNow() {
                    this.minutesLeft = 0;
                }

                @Override
                public String toString() {
                    if (this.minutesLeft == 0) {
                        return "Machine " + this.number + ": free";
                    }
                    return "Machine " + this.number + ": " + this.minutesLeft + " minutes left";
                }
            }
          laundromat/domain/Technician.java: |
            package laundromat.domain;

            public class Technician {
                public void stop(Machine machine) {
                    machine.stopNow();
                }
            }
          laundromat/dryers/Dryer.java: |
            package laundromat.dryers;

            import laundromat.domain.Machine;

            public class Dryer extends Machine {
                public Dryer(int number) {
                    super(number);
                }

                public void addTime(int minutes) {
                    if (this.minutesLeft > 0) {
                        this.minutesLeft += minutes;
                    }
                }
            }
          Main.java: |
            import laundromat.domain.Machine;
            import laundromat.domain.Technician;
            import laundromat.dryers.Dryer;

            public class Main {
                public static void main(String[] args) {
                    Machine washer = new Machine(4);
                    Dryer dryer = new Dryer(9);
                    washer.start(45);
                    dryer.start(30);
                    dryer.addTime(15);
                    washer.pass(20);
                    dryer.pass(20);
                    System.out.println(washer);
                    System.out.println(dryer);
                    new Technician().stop(washer);
                    System.out.println(washer);
                }
            }
        solution:
          laundromat/domain/Machine.java: |
            package laundromat.domain;

            public class Machine {
                private int number;
                protected int minutesLeft;

                public Machine(int number) {
                    this.number = number;
                    this.minutesLeft = 0;
                }

                public void start(int minutes) {
                    this.minutesLeft = minutes;
                }

                public void pass(int minutes) {
                    this.minutesLeft -= minutes;
                    if (this.minutesLeft < 0) {
                        this.minutesLeft = 0;
                    }
                }

                void stopNow() {
                    this.minutesLeft = 0;
                }

                @Override
                public String toString() {
                    if (this.minutesLeft == 0) {
                        return "Machine " + this.number + ": free";
                    }
                    return "Machine " + this.number + ": " + this.minutesLeft + " minutes left";
                }
            }
          laundromat/domain/Technician.java: |
            package laundromat.domain;

            public class Technician {
                public void stop(Machine machine) {
                    machine.stopNow();
                }
            }
          laundromat/dryers/Dryer.java: |
            package laundromat.dryers;

            import laundromat.domain.Machine;

            public class Dryer extends Machine {
                public Dryer(int number) {
                    super(number);
                }

                public void addTime(int minutes) {
                    if (this.minutesLeft > 0) {
                        this.minutesLeft += minutes;
                    }
                }
            }
          Main.java: |
            import laundromat.domain.Machine;
            import laundromat.domain.Technician;
            import laundromat.dryers.Dryer;

            public class Main {
                public static void main(String[] args) {
                    Machine washer = new Machine(4);
                    Dryer dryer = new Dryer(9);
                    washer.start(45);
                    dryer.start(30);
                    dryer.addTime(15);
                    washer.pass(20);
                    dryer.pass(20);
                    System.out.println(washer);
                    System.out.println(dryer);
                    new Technician().stop(washer);
                    System.out.println(washer);
                }
            }
