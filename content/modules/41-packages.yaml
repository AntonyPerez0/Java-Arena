          school/logic/SchoolDay.java: |
            package school.logic;

            import java.util.ArrayList;
            import school.domain.Period;

            public class SchoolDay {
                private ArrayList<Period> periods;

                public SchoolDay() {
                    this.periods = new ArrayList<>();
                }

                public void add(Period period) {
                    this.periods.add(period);
                }

                public String subjectAt(int number) {
                    for (Period period : this.periods) {
                        if (period.getNumber() == number) {
                            return period.getSubject();
                        }
                    }
                    return "free";
                }

                public int count(String subject) {
                    int count = 0;
                    for (Period period : this.periods) {
                        if (period.getSubject().equals(subject)) {
                            count++;
                        }
                    }
                    return count;
                }
            }
