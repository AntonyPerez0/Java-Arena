            package shoestore.ui;

            import java.util.Scanner;
            import shoestore.domain.Shoe;
            import shoestore.logic.Stock;

            public class TextUI {
                private Scanner scanner;
                private Stock stock;

                public TextUI(Scanner scanner, Stock stock) {
                    this.scanner = scanner;
                    this.stock = stock;
                }

                public void start() {
                    while (true) {
                        System.out.print("> ");
                        String command = this.scanner.nextLine();
                        if (command.equals("quit")) {
                            System.out.println("Pairs left: " + this.stock.count());
                            break;
                        }
                        if (command.equals("add")) {
                            this.add();
                        } else if (command.equals("sell")) {
                            this.sell();
                        } else if (command.equals("size")) {
                            int size = Integer.valueOf(this.scanner.nextLine());
