          codes.add("1357");
          codes.add("8642");
          System.out.println(codes.isValid("8642"));
          System.out.println(codes.isValid("1234"));
      - call: |
          DoorCodes door = new CodeList();
          System.out.println(door.isValid("1357"));
        hidden: true
      - call: |
          CodeList codes = new CodeList();
          codes.add("0000");
          codes.add("4455");
          codes.add("9021");
          System.out.println(codes.isValid("9021") + " " + codes.isValid("0000") + " " + codes.isValid("4456"));
        hidden: true
    more:
      - task: |
          This keypad locks itself after too many wrong codes. Its `isValid` throws no checked exception, but it may throw an unchecked one. What does the program print?
        predict: |
          import java.io.IOException;

          public class Main {
              public static void main(String[] args) {
                  DoorCodes codes = new LimitedCode("2468", 2);
                  String[] tries = {"1111", "2468", "3333", "2468"};
                  for (String code : tries) {
                      try {
                          System.out.println(code + ": " + codes.isValid(code));
                      } catch (IOException e) {
                          System.out.println("out of order");
                      } catch (IllegalStateException e) {
                          System.out.println(e.getMessage());
                      }
                  }
              }
          }
          // ==== DoorCodes.java ====
          import java.io.IOException;

          public interface DoorCodes {
              boolean isValid(String code) throws IOException;
          }
          // ==== LimitedCode.java ====
          public class LimitedCode implements DoorCodes {
              private String code;
              private int limit;
              private int wrong;

              public LimitedCode(String code, int limit) {
                  this.code = code;
                  this.limit = limit;
              }

              @Override
              public boolean isValid(String code) {
                  if (this.wrong >= this.limit) {
                      throw new IllegalStateException("Locked after " + this.limit + " wrong codes");
                  }
                  if (this.code.equals(code)) {
                      return true;
                  }
                  this.wrong++;
                  return false;
              }
          }
        hints:
