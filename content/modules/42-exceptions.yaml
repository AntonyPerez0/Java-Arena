          try {
              oven.setDegrees(300);
          } catch (IllegalArgumentException e) {
              System.out.println(e.getMessage());
          }
          System.out.println(oven.getDegrees());
      - call: |
          try {
              new Oven(20);
              System.out.println("accepted");
          } catch (IllegalArgumentException e) {
              System.out.println("refused: " + e.getMessage());
          }
          try {
              new Oven(-10);
              System.out.println("accepted");
          } catch (IllegalArgumentException e) {
              System.out.println("refused: " + e.getMessage());
          }
        hidden: true
