          A kitchen scale app reads weights in grams, one per line, until the line `done`. It adds up the lines that are whole numbers. For every other line, it prints `Not grams: ` and the line, and carries on with the next one. At the end it prints the total. For the input shown, it prints:

          ```
          Not grams: 1 kg
          Not grams: half
          Total: 1250 g
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int total = 0;
                  while (true) {
                      String line = scanner.nextLine();
                      if (line.equals("done")) {
