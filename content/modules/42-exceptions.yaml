        solution:
          Main.java: |
            import java.nio.file.Paths;
            import java.util.Scanner;

            public class Main {
                public static void main(String[] args) {
                    Heating heating = new Heating();
                    try (Scanner scanner = new Scanner(Paths.get("schedule.txt"))) {
                        int number = 0;
                        while (scanner.hasNextLine()) {
                            number++;
                            String[] parts = scanner.nextLine().split(" ");
                            try {
                                int degrees = Integer.parseInt(parts[1]);
                                heating.add(parts[0], degrees);
                                System.out.println(parts[0] + " -> " + degrees);
                            } catch (NumberFormatException e) {
                                System.out.println("Line " + number + ": not a number: " + parts[1]);
                            } catch (IllegalArgumentException e) {
                                System.out.println("Line " + number + ": " + e.getMessage());
                            }
                        }
                    } catch (Exception e) {
                        System.out.println("Could not read schedule.txt");
                    }
                    System.out.println("Changes: " + heating.count());
                }
            }
          Heating.java: |
            import java.util.ArrayList;

            public class Heating {
                private ArrayList<String> changes;

                public Heating() {
                    this.changes = new ArrayList<>();
                }

                public void add(String time, int degrees) {
                    if (degrees < 5 || degrees > 30) {
                        throw new IllegalArgumentException(degrees + " degrees is not a room temperature");
                    }
                    this.changes.add(time + " " + degrees);
                }

                public int count() {
                    return this.changes.size();
                }
            }
