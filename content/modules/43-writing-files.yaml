id: writing-files
summary: Writing text files. PrintWriter with println, print and close, and the checked exception its constructor may throw, adding to the end of a file with FileWriter, try-with-resources for writing, a list of objects written one per line with commas between the values, a class that saves its data to a file and loads it back, and the end of part 11. MOOC sections 11.4 and 11.5.
steps:
  - id: writing-files-printwriter
    slug: printwriter
    title: Writing a file with PrintWriter
    text: |
      Module 20 read files that were already there. This module writes them. Everything a program keeps in its variables is gone when it ends, so a program that should remember something until the next time it runs, such as a shopping list, a high-score table or a to-do list, saves it in a file and reads it back when it starts again.

      ### PrintWriter

      The class `PrintWriter`, in the package `java.io`, writes text into a file. Its methods are named like those of `System.out`, so you know them already:

      ```java run
      import java.io.PrintWriter;

      public class Main {
          public static void main(String[] args) throws Exception {
              PrintWriter writer = new PrintWriter("shopping.txt");
              writer.println("oat milk");
              writer.println("rye bread");
              writer.print("apples");
              writer.println(", 6");
              writer.close();
              System.out.println("List saved");
          }
      }
      ```

      ```output
      List saved
      ```

      Only `List saved` appears in the output: it's the only text printed with `System.out`. The rest went into a file. After the run, the program's working folder has a file called `shopping.txt`, and it holds:

      ```text
      oat milk
      rye bread
      apples, 6
      ```

      - `new PrintWriter("shopping.txt")` opens the file `shopping.txt` for writing. A name alone means a file in the working folder, as in module 20. When there's no file by that name, it's created. When there is one, it's emptied first, so what the program writes replaces what the file held. (The next step shows how to add to a file instead.)
      - `writer.println(...)` writes the text and a line break into the file, as `System.out.println` does on the screen. `writer.print(...)` writes the text without a line break, so whatever comes next goes on the same line: `apples` and `, 6` make one line.
      - `writer.close()` closes the file once the program is done with it. Don't leave it out: the next section shows why.
      - `throws Exception` in `main`'s header is there because creating a PrintWriter may throw an exception. The last section of this step is about it.

      On Java Arena, **Run with my input** shows the files your program created or changed below its output, each under its name. The checks of this module look at those files too. Each test runs your program in a folder of its own, which holds only the files the task gives, and then compares the files your program should have written with the ones the model solution wrote, the same way it compares the output: line endings, spaces at the ends of lines and blank lines at the end don't matter; everything else does.

      ### Close the file

      A PrintWriter doesn't send each `println` to the file right away. It gathers the text in memory and writes it to the file in larger pieces, which is much faster than writing every line on its own. `close()` writes whatever is still waiting, and then gives the file back to the operating system: an open file is a resource, as module 42 said. When the program ends, the operating system takes the file back, as it does with everything a program has open, but nothing calls the PrintWriter's `close()`, so the text still waiting in memory never reaches the file. A program that never calls `close()` can leave the file empty.

      This program forgets to close its writer, and then reads the file back with a Scanner, as module 20 did:

      ```java run
      import java.io.PrintWriter;
      import java.nio.file.Paths;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) throws Exception {
              PrintWriter writer = new PrintWriter("reminders.txt");
              writer.println("Call the dentist");
              writer.println("Buy stamps");

              int lines = 0;
              try (Scanner reader = new Scanner(Paths.get("reminders.txt"))) {
                  while (reader.hasNextLine()) {
                      System.out.println("Read: " + reader.nextLine());
                      lines++;
                  }
              }
              System.out.println("Lines read: " + lines);
          }
      }
      ```

      ```output
      Lines read: 0
      ```

      Creating the PrintWriter created the file, but the two lines were still waiting in memory, so the file was empty when the Scanner read it. With `writer.close();` right after the second `println`, the same program prints `Read: Call the dentist`, `Read: Buy stamps` and `Lines read: 2`.

      (The try-with-resources that reads the file has no `catch` block: `main` passes exceptions on with `throws Exception`, which module 42 said is enough.)

      ### The exception

      Opening a file for writing can fail. The name might belong to a folder, the folder the file should go in might not exist, or the program might not be allowed to write there. PrintWriter's constructor then throws a `FileNotFoundException`. That's a kind of IOException, and so a checked exception (module 42): the program must catch it or declare it. With neither, javac refuses the program:

      ```java error
      import java.io.PrintWriter;

      public class Main {
          public static void main(String[] args) {
              PrintWriter writer = new PrintWriter("shopping.txt");
              writer.println("oat milk");
              writer.close();
          }
      }
      ```

      ```javac
      Main.java:5: error: unreported exception FileNotFoundException; must be caught or declared to be thrown
              PrintWriter writer = new PrintWriter("shopping.txt");
                                   ^
      1 error
      ```

      You have module 42's two choices.

      **Declare it.** `throws Exception` in `main`'s header passes the exception on to Java, which stops the program with a report when it happens. That's what the examples above do, and the MOOC's examples do the same. Here the file should go into a folder called `backup`, which doesn't exist:

      ```java run crash
      import java.io.PrintWriter;

      public class Main {
          public static void main(String[] args) throws Exception {
              PrintWriter writer = new PrintWriter("backup/shopping.txt");
              writer.println("oat milk");
              writer.close();
          }
      }
      ```

      ```crash
      Exception in thread "main" java.io.FileNotFoundException: backup/shopping.txt (No such file or directory)
      	at Main.main(Main.java:5)
      ```

      A PrintWriter creates the file, but not the folders on the way to it. A method of your own that writes a file can declare the exception in the same way, such as `public static void saveList(String fileName) throws Exception`, and then the code that calls it has the same two choices.

      **Catch it.** A `try` around the writing lets the program go on, and tell the user what went wrong:

      ```java run
      import java.io.FileNotFoundException;
      import java.io.PrintWriter;

      public class Main {
          public static void main(String[] args) {
              String[] names = {"shopping.txt", "backup/shopping.txt"};
              for (String name : names) {
                  try {
                      PrintWriter writer = new PrintWriter(name);
                      writer.println("oat milk");
                      writer.close();
                      System.out.println("Saved " + name);
                  } catch (FileNotFoundException e) {
                      System.out.println("Could not save " + name);
                  }
              }
          }
      }
      ```

      ```output
      Saved shopping.txt
      Could not save backup/shopping.txt
      ```

      **Your turn:** a time capsule program reads lines until the input ends, writes each of them into the file `capsule.txt`, and at the end prints how many lines it sealed in. Fill in the blanks. For the input shown below, it prints:

      ```
      Sealed 3 lines
      ```

      and `capsule.txt` then holds the same three lines as the input.
    fill: |
      import java.io.PrintWriter;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) throws Exception {
              Scanner scanner = new Scanner(System.in);
              PrintWriter writer = new [[PrintWriter]]("capsule.txt");
              int count = 0;
              while (scanner.hasNextLine()) {
                  String line = scanner.nextLine();
                  writer.[[println]](line);
                  count++;
              }
              writer.[[close]]();
              System.out.println("Sealed " + count + " lines");
          }
      }
    hints:
      - "The first blank is the class that writes a file. The second writes a line and its line break into the file, as `System.out`'s method of the same name does on the screen."
      - "The last blank closes the file, so that the lines really reach it: `writer.close()`."
    tests:
      - stdin: |
          Dear me in ten years,
          did the lemon tree survive?
          Love, me
        writes: [capsule.txt]
      - stdin: "Hello from the past\nSee you in 2036\n"
        writes: [capsule.txt]
        hidden: true
      - stdin: |
          Top song: Blue Rain
          Best friend: Noor
          Height: 142 cm
          Bike: red
          Dream: to see a whale
        writes: [capsule.txt]
        hidden: true
    more:
      - task: |
          A shop writes the sign for its door with `print` and `println`, and then reads the file back, printing each line between brackets after its number. What does the program print?
        predict: |
          import java.io.PrintWriter;
          import java.nio.file.Paths;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) throws Exception {
                  PrintWriter writer = new PrintWriter("sign.txt");
                  writer.print("Open");
                  writer.println(" daily");
                  writer.println();
                  writer.print("Closed");
                  writer.print(" on May 1");
                  writer.close();

                  try (Scanner reader = new Scanner(Paths.get("sign.txt"))) {
                      int number = 1;
                      while (reader.hasNextLine()) {
                          System.out.println(number + " [" + reader.nextLine() + "]");
                          number++;
                      }
                  }
              }
          }
        hints:
          - "`print` doesn't end the line, so `Open` and ` daily` end up on one line. `println()` with nothing in the parentheses writes only a line break, which makes an empty line."
          - "The last two `print`s aren't followed by a line break, but their text is still a line of the file: the last one."
      - task: |
          A teacher wants practice sheets for the multiplication table. Write the method `writeGrid(String fileName, int size)`, which writes a grid of products into the file: `size` lines, where line number `row` (counting from 1) holds `row * 1`, `row * 2` and so on up to `row * size`, with a space between the numbers. The method prints nothing. Creating a PrintWriter may throw, so the method's header needs `throws Exception`.

          The check runs `writeGrid("grid.txt", 4);`, and after it `grid.txt` should hold:

          ```text
          1 2 3 4
          2 4 6 8
          3 6 9 12
          4 8 12 16
          ```
        seed: |
          import java.io.PrintWriter;

          public class Main {
              public static void main(String[] args) throws Exception {
                  writeGrid("grid.txt", 4);
              }

              public static void writeGrid(String fileName, int size) {
                  // Write the grid into the file here.
              }
          }
        solution: |
          import java.io.PrintWriter;

          public class Main {
              public static void main(String[] args) throws Exception {
                  writeGrid("grid.txt", 4);
              }

              public static void writeGrid(String fileName, int size) throws Exception {
                  PrintWriter writer = new PrintWriter(fileName);
                  for (int row = 1; row <= size; row++) {
                      for (int column = 1; column <= size; column++) {
                          writer.print(row * column);
                          if (column < size) {
                              writer.print(" ");
                          }
                      }
                      writer.println();
                  }
                  writer.close();
              }
          }
        hints:
          - "Two loops, one inside the other: the outer one goes through the rows and the inner one through the columns. `writer.print(row * column + \" \")` writes a number and a space without ending the line. A space at the end of a line doesn't matter to the check."
          - "After the inner loop, `writer.println()` ends the row. After both loops, `writer.close()`. And add `throws Exception` after the method's parentheses."
        tests:
          - call: writeGrid("grid.txt", 4);
            writes: [grid.txt]
          - call: writeGrid("one.txt", 1);
            writes: [one.txt]
            hidden: true
          - call: writeGrid("sheet.txt", 7);
            writes: [sheet.txt]
            hidden: true
          - call: |
              writeGrid("grid.txt", 5);
              writeGrid("grid.txt", 2);
            writes: [grid.txt]
            hidden: true

  - id: writing-files-appending
    slug: adding-to-a-file
    title: Adding to a file
    text: |
      ### Writing replaces

      A workout log gets a new line after every workout. Here's `workouts.txt` after two of them, and a program that should add Friday's yoga to it, written with what step 1 taught. It then reads the file back:

      ```file workouts.txt
      Mon: run, 5 km
      Wed: swim, 40 min
      ```

      ```java run
      import java.io.PrintWriter;
      import java.nio.file.Paths;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) throws Exception {
              PrintWriter writer = new PrintWriter("workouts.txt");
              writer.println("Fri: yoga, 30 min");
              writer.close();

              try (Scanner reader = new Scanner(Paths.get("workouts.txt"))) {
                  while (reader.hasNextLine()) {
                      System.out.println(reader.nextLine());
                  }
              }
          }
      }
      ```

      ```output
      Fri: yoga, 30 min
      ```

      Monday's run and Wednesday's swim are gone: creating the PrintWriter emptied the file before anything was written. That's right for a file the program writes from scratch, but a log should grow.

      ### FileWriter, which can append

      `FileWriter`, also in `java.io`, writes into a file as well, and its constructor takes a second parameter: `new FileWriter("workouts.txt", true)`. `true` means **append**: the file keeps what it holds, and the new text goes after it. When the file doesn't exist yet, it's created, as before.

      A FileWriter has no `print` or `println`. Its `write` methods write the text as it is, with no line break: `write("Fri: yoga, 30 min\n")` needs the `\n` at the end. Give the FileWriter to a PrintWriter's constructor instead, and you get `println` and `print`, which write through the FileWriter into the file:

      ```file workouts.txt
      Mon: run, 5 km
      Wed: swim, 40 min
      ```

      ```java run
      import java.io.FileWriter;
      import java.io.PrintWriter;
      import java.nio.file.Paths;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) throws Exception {
              PrintWriter writer = new PrintWriter(new FileWriter("workouts.txt", true));
              writer.println("Fri: yoga, 30 min");
              writer.close();

              try (Scanner reader = new Scanner(Paths.get("workouts.txt"))) {
                  while (reader.hasNextLine()) {
                      System.out.println(reader.nextLine());
                  }
              }
          }
      }
      ```

      ```output
      Mon: run, 5 km
      Wed: swim, 40 min
      Fri: yoga, 30 min
      ```

      - `new PrintWriter(new FileWriter("workouts.txt", true))` makes two objects. The FileWriter opens the file for appending, and the PrintWriter writes into the FileWriter. Closing the PrintWriter closes the FileWriter too.
      - Without the `true`, or with `false`, a FileWriter empties the file first, just as a PrintWriter does.
      - FileWriter's constructor can throw an IOException (step 1's FileNotFoundException is one kind of it), so it needs `throws` or `catch` too. A `catch (IOException e)` block, with `import java.io.IOException;`, catches every kind.
      - Every run adds one line. Run the program three times on your own computer, and the file ends with three yoga lines. Each check on Java Arena starts again from the files the test gives, so there each run adds exactly one.

      ### Append or replace?

      - A log, a diary or a list of events grows: each run adds to it, so the program appends.
      - A file that holds all of a program's data, such as a to-do list or a high-score table, is written again from the start each time, so it's replaced. Appending there would write the old contents into the file a second time. Step 4 is about such files.

      **Your turn:** a reading log. The program reads the title of a book you've just finished, adds it as a new line at the end of `books.txt`, and prints `Added: ` and the title. Fill in the blanks, so that the titles already in the file stay, and the file is created if there isn't one yet. For the input `Dune` and the file shown below, it prints:

      ```
      Added: Dune
      ```

      and `books.txt` then ends with the line `Dune`.
    fill: |
      import java.io.FileWriter;
      import java.io.PrintWriter;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) throws Exception {
              Scanner scanner = new Scanner(System.in);
              String title = scanner.nextLine();
              PrintWriter writer = new PrintWriter(new [[FileWriter]]("books.txt", [[true]]));
              writer.println(title);
              writer.close();
              System.out.println("Added: " + title);
          }
      }
    hints:
      - "The class that can append to a file is `FileWriter`, and the PrintWriter writes through it."
      - "FileWriter's second parameter says whether to append: `true` keeps what the file holds and writes after it."
    tests:
      - stdin: Dune
        files:
          books.txt: |
            The Hobbit
            Beloved
        writes: [books.txt]
      - name: Without the file
        stdin: Emma
        writes: [books.txt]
        hidden: true
      - stdin: Kindred
        files:
          books.txt: |
            Matilda
            Ulysses
            Frankenstein
        writes: [books.txt]
        hidden: true
    more:
      - task: |
          A calculator keeps its history in `history.txt`, and its method `save` writes a line there, appending or not. The folder is empty when the program starts. What does the program print?
        predict: |
          import java.io.FileWriter;
          import java.io.PrintWriter;
          import java.nio.file.Paths;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) throws Exception {
                  save("2 + 2 = 4", true);
                  save("5 * 3 = 15", true);
                  save("9 / 3 = 3", false);
                  save("7 + 1 = 8", true);

                  try (Scanner reader = new Scanner(Paths.get("history.txt"))) {
                      while (reader.hasNextLine()) {
                          System.out.println(reader.nextLine());
                      }
                  }
              }

              public static void save(String line, boolean append) throws Exception {
                  PrintWriter writer = new PrintWriter(new FileWriter("history.txt", append));
                  writer.println(line);
                  writer.close();
              }
          }
        hints:
          - "`new FileWriter(\"history.txt\", true)` creates the file when it isn't there yet, and otherwise adds after what it holds. With `false`, it empties the file first."
          - "The third call empties the file, so the first two lines are gone. Only one call comes after it."
      - task: |
          A sleep tracker adds a line to its log every morning. Write the method `logNight(String fileName, String day, int hours)`, which adds the line `day: hours h`, such as `Tue: 7 h`, at the end of the file, keeping what the file holds. When there's no such file yet, it's created. Use a FileWriter that appends.

          Nobody sleeps less than 0 or more than 24 hours in a night. For such hours, `logNight` throws an IllegalArgumentException with the message `impossible: ` and the hours and ` hours`, such as `impossible: 30 hours`, and writes nothing.

          The check calls `logNight` for Tuesday (7 hours) and Wednesday (6 hours) on the file shown below, which has Monday's line, and after it `sleep.txt` should hold:

          ```text
          Mon: 8 h
          Tue: 7 h
          Wed: 6 h
          ```
        seed: |
          import java.io.FileWriter;
          import java.io.PrintWriter;

          public class Main {
              public static void main(String[] args) throws Exception {
                  logNight("sleep.txt", "Tue", 7);
                  logNight("sleep.txt", "Wed", 6);
              }

              // Write the method logNight here.
          }
        solution: |
          import java.io.FileWriter;
          import java.io.PrintWriter;

          public class Main {
              public static void main(String[] args) throws Exception {
                  logNight("sleep.txt", "Tue", 7);
                  logNight("sleep.txt", "Wed", 6);
              }

              public static void logNight(String fileName, String day, int hours) throws Exception {
                  if (hours < 0 || hours > 24) {
                      throw new IllegalArgumentException("impossible: " + hours + " hours");
                  }
                  PrintWriter writer = new PrintWriter(new FileWriter(fileName, true));
                  writer.println(day + ": " + hours + " h");
                  writer.close();
              }
          }
        hints:
          - "Check the hours first, and `throw new IllegalArgumentException(\"impossible: \" + hours + \" hours\")` before the file is opened. The header ends with `throws Exception`, for the FileWriter."
          - "Then `PrintWriter writer = new PrintWriter(new FileWriter(fileName, true));`, one `println` with the day, `: `, the hours and ` h`, and `writer.close()`."
        require:
          - pattern: new\s+FileWriter\s*\([^;]*,\s*true\s*\)
            message: "Append with a FileWriter: `new FileWriter(fileName, true)`."
        tests:
          - call: |
              logNight("sleep.txt", "Tue", 7);
              logNight("sleep.txt", "Wed", 6);
            files:
              sleep.txt: |
                Mon: 8 h
            writes: [sleep.txt]
          - call: logNight("nights.txt", "Sun", 9);
            writes: [nights.txt]
            hidden: true
          - call: |
              try {
                  logNight("sleep.txt", "Thu", 30);
              } catch (IllegalArgumentException e) {
                  System.out.println(e.getMessage());
              }
              logNight("sleep.txt", "Fri", 0);
              try {
                  logNight("sleep.txt", "Sat", -2);
              } catch (IllegalArgumentException e) {
                  System.out.println(e.getMessage());
              }
              logNight("sleep.txt", "Sun", 24);
            files:
              sleep.txt: |
                Wed: 5 h
                Thu: 6 h
            writes: [sleep.txt]
            hidden: true

  - id: writing-files-objects
    slug: lists-of-objects
    title: try-with-resources, and objects in a file
    text: |
      ### Closed however the block ends

      A PrintWriter is a resource like the Scanner that reads a file: its class implements AutoCloseable, so it can go in the parentheses of a try-with-resources (module 42), which closes it as soon as the block ends. That matters when something goes wrong halfway. Here a game saves its players' points from text, and one of them isn't a number:

      ```java run
      import java.io.PrintWriter;
      import java.nio.file.Paths;
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) throws Exception {
              String[] points = {"120", "95", "x", "80"};
              try (PrintWriter writer = new PrintWriter("points.txt")) {
                  for (String point : points) {
                      writer.println(Integer.parseInt(point));
                  }
              } catch (NumberFormatException e) {
                  System.out.println("Stopped: " + e.getMessage());
              }

              try (Scanner reader = new Scanner(Paths.get("points.txt"))) {
                  while (reader.hasNextLine()) {
                      System.out.println("Saved: " + reader.nextLine());
                  }
              }
          }
      }
      ```

      ```output
      Stopped: For input string: "x"
      Saved: 120
      Saved: 95
      ```

      - `parseInt("x")` throws, and the loop stops there. The writer is closed on the way out of the `try` block, before the `catch` block runs, so the two lines written before the problem reach the file.
      - Written as in step 1, with `writer.close()` as the last line of the `try` block, the exception would skip `close()`, and the file would stay empty.
      - In a method that passes exceptions on with `throws Exception`, a try-with-resources needs no `catch`: the writer is closed, and then the exception goes on to the caller.

      try-with-resources is shorter than calling `close()` yourself, and there's nothing to forget, so from here on this module writes files that way.

      ### A list of objects, one per line

      A game keeps a high-score table: a list of HighScore objects, each with a player and points. To save it, the program writes one line per object, with the values separated by commas, like the CSV files module 20 read:

      ```java run
      import java.io.PrintWriter;
      import java.util.ArrayList;

      public class Main {
          public static void main(String[] args) throws Exception {
              ArrayList<HighScore> scores = new ArrayList<>();
              scores.add(new HighScore("Mia", 4200));
              scores.add(new HighScore("Leo", 3950));
              scores.add(new HighScore("Ana", 3100));

              try (PrintWriter writer = new PrintWriter("highscores.csv")) {
                  for (HighScore score : scores) {
                      writer.println(score.toCsv());
                  }
              }
              System.out.println("Saved " + scores.size() + " scores");
              System.out.println(scores.get(0));
          }
      }
      // ==== HighScore.java ====
      public class HighScore {
          private String player;
          private int points;

          public HighScore(String player, int points) {
              this.player = player;
              this.points = points;
          }

          public String getPlayer() {
              return this.player;
          }

          public int getPoints() {
              return this.points;
          }

          public String toCsv() {
              return this.player + "," + this.points;
          }

          @Override
          public String toString() {
              return this.player + ": " + this.points;
          }
      }
      ```

      ```output
      Saved 3 scores
      Mia: 4200
      ```

      After the run, `highscores.csv` holds:

      ```text
      Mia,4200
      Leo,3950
      Ana,3100
      ```

      - The loop writes one line per object, in the list's order.
      - `toCsv()` says how one HighScore looks as a line of the file. The format is then written in one place: the class knows its own values, and every program that saves HighScores writes the same lines.
      - `toString()` is for people: it's what `println(scores.get(0))` showed on the screen. `toCsv()` is for the program that reads the file back. `writer.println(score)` would write `Mia: 4200` into the file, which is harder to take apart again. `Mia,4200` splits with module 20's `split(",")` into the player and the points, and `Integer.valueOf` turns the points back into a number. Step 4 does exactly that.

      ### Headers and commas

      - A file meant for a spreadsheet often starts with a header line that names the columns, such as `player,points` (module 20 skipped such a line when reading). Write it once, before the loop.
      - A value with a comma of its own, such as the player `Lee, Jr.`, would split into too many parts when the file is read back. Choose a separator that doesn't occur in the data (`;` is common, as module 20 said), or refuse such values when an object is created (module 42).

      **Your turn:** a teacher exports a course's gradebook for a spreadsheet. `StudentRecord.java` is ready: a record has the student's name and the points of the exam and of the project, and `total()` returns their sum. In `Main.java`, write the method `export(ArrayList<StudentRecord> records, String fileName)`, which writes the file: first the header line `name,exam,project,total`, and then one line for each record, in the list's order, with its four values separated by commas. Write the file in a try-with-resources, and let the method pass exceptions on with `throws Exception`. It prints nothing.

