        import java.util.Scanner;

        public class Notebook {
            private ArrayList<Note> notes;

            public Notebook() {
                this.notes = new ArrayList<>();
            }

            public void add(Note note) {
                this.notes.add(note);
            }

            public int count() {
                return this.notes.size();
            }

            public void printAll() {
                for (Note note : this.notes) {
                    System.out.println(note);
                }
            }

            // Write the methods save and load here.
        }
      Note.java: |
        public class Note {
            private String title;
            private String text;

            public Note(String title, String text) {
                this.title = title;
                this.text = text;
            }

            public String getTitle() {
                return this.title;
            }

            public String getText() {
                return this.text;
            }

            @Override
            public String toString() {
                return this.title + ": " + this.text;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) throws Exception {
                Notebook notebook = new Notebook();
                notebook.load("notes.txt");
                notebook.add(new Note("Shopping", "milk; eggs; bread"));
                notebook.save("notes.txt");
                notebook.printAll();
            }
        }
    solution:
      Notebook.java: |
        import java.io.PrintWriter;
        import java.nio.file.Paths;
        import java.util.ArrayList;
        import java.util.Scanner;

        public class Notebook {
            private ArrayList<Note> notes;

            public Notebook() {
                this.notes = new ArrayList<>();
            }

            public void add(Note note) {
                this.notes.add(note);
            }

            public int count() {
                return this.notes.size();
            }

            public void printAll() {
                for (Note note : this.notes) {
                    System.out.println(note);
                }
            }

            public void save(String fileName) throws Exception {
                try (PrintWriter writer = new PrintWriter(fileName)) {
                    for (Note note : this.notes) {
                        writer.println(note.getTitle() + ";" + note.getText());
                    }
                }
            }

            public void load(String fileName) throws Exception {
                try (Scanner reader = new Scanner(Paths.get(fileName))) {
                    while (reader.hasNextLine()) {
                        String line = reader.nextLine();
                        int at = line.indexOf(";");
                        this.notes.add(new Note(line.substring(0, at), line.substring(at + 1)));
                    }
                }
            }
        }
      Note.java: |
        public class Note {
            private String title;
            private String text;

            public Note(String title, String text) {
                if (title.contains(";")) {
                    throw new IllegalArgumentException("a title can't contain ;");
                }
                this.title = title;
                this.text = text;
            }

            public String getTitle() {
                return this.title;
            }

            public String getText() {
                return this.text;
            }

            @Override
            public String toString() {
                return this.title + ": " + this.text;
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) throws Exception {
                Notebook notebook = new Notebook();
                notebook.load("notes.txt");
                notebook.add(new Note("Shopping", "milk; eggs; bread"));
                notebook.save("notes.txt");
                notebook.printAll();
            }
        }
    hints:
      - "Note's constructor checks the title with `contains` and throws before it stores anything. `save` works like TodoList's `save` in step 4, writing the title, a `;` and the text of each note. `load` needs only the line's first `;`, since the text may contain more."
      - "In Note's constructor: `if (title.contains(\";\")) { throw new IllegalArgumentException(\"a title can't contain ;\"); }`. `save` writes `note.getTitle() + \";\" + note.getText()`. `load` can't use `split(\";\")`, since the text may contain `;` too. Find the first one with `int at = line.indexOf(\";\");`: the title is `line.substring(0, at)`, and the text is `line.substring(at + 1)`."
