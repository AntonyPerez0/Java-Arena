      - task: |
          A last look at exceptions and files together. `save` throws an IllegalArgumentException for an empty item, and one of the files is to go into a folder that doesn't exist. `Files.readAllLines` returns a file's lines in a list. What does the program print?
        predict: |
          import java.io.FileNotFoundException;
          import java.io.PrintWriter;
          import java.nio.file.Files;
          import java.nio.file.Paths;

          public class Main {
              public static void main(String[] args) throws Exception {
                  String[] items = {"eggs", "", "milk"};
                  save("list.txt", items);
                  save("shop/list.txt", items);
                  System.out.println(Files.readAllLines(Paths.get("list.txt")));
              }

              public static void save(String fileName, String[] items) {
                  try (PrintWriter writer = new PrintWriter(fileName)) {
                      for (String item : items) {
                          if (item.isEmpty()) {
                              throw new IllegalArgumentException("empty item");
                          }
                          writer.println(item);
                      }
                      System.out.println("saved " + fileName);
                  } catch (IllegalArgumentException e) {
                      System.out.println("stopped: " + e.getMessage());
                  } catch (FileNotFoundException e) {
                      System.out.println("no folder for " + fileName);
                  } finally {
                      System.out.println("done");
                  }
              }
          }
        hints:
          - "In the first call, `eggs` is written, and then the empty item throws. The writer is closed on the way out, the first `catch` block prints its line, and `finally` prints `done`. `saved list.txt` is never printed."
          - "In the second call, creating the PrintWriter already throws a FileNotFoundException, since there's no folder `shop`. Last, `list.txt` holds the one line written before the problem."
      - task: |
          Two roommates keep their own shopping lists, `mine.txt` and `yours.txt`, one item per line in small letters. Write the method `merge(String first, String second, String target)`, which writes every item of the files `first` and `second` into the file `target`, each item only once, in alphabetical order. The method prints nothing, and passes exceptions on with `throws Exception`.

          The check runs `merge("mine.txt", "yours.txt", "shared.txt");` with the files shown below, and after it `shared.txt` should hold:

          ```text
          apples
          bread
          coffee
          milk
          ```
        seed: |
          import java.io.PrintWriter;
          import java.nio.file.Files;
          import java.nio.file.Paths;
          import java.util.ArrayList;
          import java.util.Collections;

          public class Main {
              public static void main(String[] args) throws Exception {
                  merge("mine.txt", "yours.txt", "shared.txt");
              }

              // Write the method merge here.
          }
        solution: |
          import java.io.PrintWriter;
          import java.nio.file.Files;
          import java.nio.file.Paths;
          import java.util.ArrayList;
          import java.util.Collections;

          public class Main {
              public static void main(String[] args) throws Exception {
                  merge("mine.txt", "yours.txt", "shared.txt");
              }

              public static void merge(String first, String second, String target) throws Exception {
                  ArrayList<String> items = new ArrayList<>();
                  for (String item : Files.readAllLines(Paths.get(first))) {
                      if (!items.contains(item)) {
                          items.add(item);
                      }
                  }
                  for (String item : Files.readAllLines(Paths.get(second))) {
                      if (!items.contains(item)) {
                          items.add(item);
                      }
                  }
                  Collections.sort(items);
                  try (PrintWriter writer = new PrintWriter(target)) {
                      for (String item : items) {
                          writer.println(item);
                      }
                  }
              }
          }
        hints:
          - "Collect the items of both files into one list, adding an item only when the list doesn't contain it yet. `Files.readAllLines(Paths.get(first))` returns a file's lines as a list you can loop over."
          - "`Collections.sort(items)` puts the list in alphabetical order. Then write it with a PrintWriter in a try-with-resources, one item per line."
