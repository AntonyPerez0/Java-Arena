      ScoreBoard.java: |
        import java.io.PrintWriter;
        import java.nio.file.Paths;
        import java.util.ArrayList;
        import java.util.Scanner;

        public class ScoreBoard {
            private ArrayList<HighScore> scores;

            public ScoreBoard() {
                this.scores = new ArrayList<>();
            }

            public void add(HighScore score) {
                this.scores.add(score);
            }

            public HighScore best() {
                HighScore best = null;
                for (HighScore score : this.scores) {
                    if (best == null || score.getPoints() > best.getPoints()) {
                        best = score;
                    }
                }
                return best;
            }

            public void save(String fileName) throws Exception {
                try (PrintWriter writer = new PrintWriter(fileName)) {
                    for (HighScore score : this.scores) {
                        writer.println(score.toCsv());
                    }
                }
            }

            public void load(String fileName) throws Exception {
                try (Scanner reader = new Scanner(Paths.get(fileName))) {
                    while (reader.hasNextLine()) {
                        String[] parts = reader.nextLine().split(",");
                        this.scores.add(new HighScore(parts[0], Integer.valueOf(parts[1])));
                    }
                }
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) throws Exception {
                ScoreBoard board = new ScoreBoard();
                board.load("scores.csv");
                board.add(new HighScore("Kai", 5100));
                board.save("scores.csv");
                System.out.println(board.best());
            }
        }
