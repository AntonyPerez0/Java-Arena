          AllOf.java: |
            import java.util.ArrayList;

            public class AllOf<T> implements Rule<T> {
                private ArrayList<Rule<T>> rules;

                public AllOf() {
                    this.rules = new ArrayList<>();
                }

                public void add(Rule<T> rule) {
                    this.rules.add(rule);
                }

                @Override
                public boolean allows(T value) {
                    for (Rule<T> rule : this.rules) {
                        if (!rule.allows(value)) {
                            return false;
                        }
                    }
                    return true;
                }
            }
          Rule.java: |
            public interface Rule<T> {
                boolean allows(T value);
            }
