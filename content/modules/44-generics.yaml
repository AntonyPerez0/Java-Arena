      - task: |
          A sports club's trophies pass from holder to holder. The chess trophy goes to a player, given by name. The relay shield goes to a team, given by its number. In `Trophy.java`, write the class `Trophy<T>` with:

          - a constructor `Trophy(String name, T holder)`: the trophy's name and its first holder
          - `getHolder()`, which returns the current holder
          - `passTo(T newHolder)`, which makes `newHolder` the holder, and returns the holder before it
          - `toString()`, which returns the trophy's name, a colon and the holder, like `Chess Cup: Ravi`

          The name is always a String; only the holder's type changes. The check runs:

          ```java fragment
          Trophy<String> chess = new Trophy<String>("Chess Cup", "Ada");
          String before = chess.passTo("Ravi");
          System.out.println(before + " passed it on");
          System.out.println(chess);
          Trophy<Integer> relay = new Trophy<Integer>("Relay Shield", 4);
          int old = relay.passTo(7);
          System.out.println(old + relay.getHolder());
          System.out.println(relay);
          ```

          and expects:

          ```
          Ada passed it on
          Chess Cup: Ravi
          11
          Relay Shield: 7
          ```
