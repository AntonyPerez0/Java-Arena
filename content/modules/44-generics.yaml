        solution:
          Trophy.java: |
            public class Trophy<T> {
                private String name;
                private T holder;

                public Trophy(String name, T holder) {
                    this.name = name;
                    this.holder = holder;
                }

                public T getHolder() {
                    return this.holder;
                }

                public T passTo(T newHolder) {
                    T previous = this.holder;
                    this.holder = newHolder;
                    return previous;
                }

                @Override
                public String toString() {
                    return this.name + ": " + this.holder;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    Trophy<String> chess = new Trophy<String>("Chess Cup", "Ada");
                    String before = chess.passTo("Ravi");
                    System.out.println(before + " passed it on");
                    System.out.println(chess);
                    Trophy<Integer> relay = new Trophy<Integer>("Relay Shield", 4);
                    int old = relay.passTo(7);
                    System.out.println(old + relay.getHolder());
                    System.out.println(relay);
                }
            }
        hints:
