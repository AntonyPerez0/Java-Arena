          Main.java: |
            import java.util.ArrayList;

            public class Main {
                public static void main(String[] args) {
                    ArrayList<Box<Integer>> boxes = new ArrayList<>();
                    boxes.add(new Box<>(120));
                    boxes.add(new Box<>(450));
                    boxes.add(new Box<>(80));
                    System.out.println(total(boxes));
                    Box<Integer> most = fullest(boxes);
                    System.out.println(most.getContent());
                    most.setContent(0);
                    System.out.println(total(boxes));
                }

                public static int total(ArrayList<Box<Integer>> boxes) {
                    int sum = 0;
                    for (Box<Integer> box : boxes) {
                        sum += box.getContent();
                    }
                    return sum;
                }

                public static Box<Integer> fullest(ArrayList<Box<Integer>> boxes) {
                    Box<Integer> most = boxes.get(0);
                    for (Box<Integer> box : boxes) {
                        if (box.getContent() > most.getContent()) {
                            most = box;
                        }
                    }
                    return most;
                }
            }
          Box.java: |
            public class Box<T> {
                private T content;

                public Box(T content) {
                    this.content = content;
                }

                public T getContent() {
                    return this.content;
                }

                public void setContent(T content) {
                    this.content = content;
                }
            }
        hints:
