                    System.out.println(sprint.getPlace(1) + ", " + sprint.getPlace(2) + ", " + sprint.getPlace(3));
                    System.out.println(sprint.finishers() + " finished");
                    Podium<Integer> marathon = new Podium<>();
                    marathon.finish(204);
                    int winner = marathon.getPlace(1);
