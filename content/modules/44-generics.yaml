          Podium.java: |
            import java.util.ArrayList;

            public class Podium<T> {
                private ArrayList<T> places;
                private int finishers;

                public Podium() {
                    this.places = new ArrayList<>();
                    this.finishers = 0;
                }

                public void finish(T competitor) {
                    if (this.places.size() < 3) {
                        this.places.add(competitor);
                    }
                    this.finishers++;
                }

                public T getPlace(int place) {
                    if (place > this.places.size()) {
                        return null;
                    }
                    return this.places.get(place - 1);
                }

                public int finishers() {
                    return this.finishers;
                }
            }
