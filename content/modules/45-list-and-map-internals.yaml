          SimpleSet.java: |
            import java.util.ArrayList;

            public class SimpleSet<T> {
                private ArrayList<T>[] buckets;
                private int size;

                @SuppressWarnings("unchecked")
                public SimpleSet() {
                    this.buckets = new ArrayList[8];
                    for (int i = 0; i < this.buckets.length; i++) {
                        this.buckets[i] = new ArrayList<>();
                    }
                    this.size = 0;
                }

                private ArrayList<T> bucketFor(T value) {
                    int index = Math.abs(value.hashCode() % this.buckets.length);
                    return this.buckets[index];
                }

                public boolean add(T value) {
                    ArrayList<T> bucket = bucketFor(value);
                    if (bucket.contains(value)) {
                        return false;
                    }
                    bucket.add(value);
                    this.size++;
                    if (this.size > 0.75 * this.buckets.length) {
                        grow();
                    }
                    return true;
                }

                public boolean contains(T value) {
                    return bucketFor(value).contains(value);
                }

                public boolean remove(T value) {
                    if (bucketFor(value).remove(value)) {
                        this.size--;
                        return true;
                    }
                    return false;
                }

                @SuppressWarnings("unchecked")
                private void grow() {
                    ArrayList<T>[] old = this.buckets;
                    this.buckets = new ArrayList[old.length * 2];
                    for (int i = 0; i < this.buckets.length; i++) {
                        this.buckets[i] = new ArrayList<>();
                    }
                    for (ArrayList<T> bucket : old) {
                        for (T value : bucket) {
                            bucketFor(value).add(value);
                        }
                    }
                }

                public int size() {
                    return this.size;
                }

                public int bucketCount() {
                    return this.buckets.length;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    SimpleSet<String> played = new SimpleSet<>();
                    System.out.println(played.add("maple") + " " + played.add("otter") + " " + played.add("maple"));
                    System.out.println(played.contains("otter") + " " + played.contains("cedar") + " " + played.size());
                }
            }
