      extensions.put("Amara", 214);
      extensions.put("Bo", 102);
      extensions.put("Carmen", 305);
      System.out.println(extensions.get("Bo"));
      System.out.println(extensions.get("Frank"));
      ```

      and expects:

      ```
      102
      null
      ```
