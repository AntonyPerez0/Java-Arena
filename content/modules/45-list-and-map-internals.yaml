          To end the module: Java's HashSet keeps each value once, and finds it fast. Build your own, the way SimpleMap works, only with values and no pairs. A word game uses it for the words already played: each word may be played only once.

          In `SimpleSet.java`, write the generic class `SimpleSet<T>`, with an array of buckets that are `ArrayList<T>` lists:

          - a constructor with no parameters: 8 buckets, each an empty list
          - `add(T value)`: if the set has the value already, it returns `false` and changes nothing. Otherwise it puts the value in its bucket and returns `true`. After adding, when the size is more than 0.75 times the number of buckets, the buckets become twice as many, with every value put again in its new bucket.
          - `contains(T value)`, which returns whether the set has the value
          - `remove(T value)`, which removes the value and returns `true`, or returns `false` when the set doesn't have it
          - `size()`, the number of values in the set
          - `bucketCount()`, the number of buckets, so that the check can watch the set grow

