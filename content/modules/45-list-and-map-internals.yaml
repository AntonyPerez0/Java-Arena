          A solar panel reports how many watt-hours it made each day. The program reads the reports, one whole number per line, until the line `end`. Keep them in an `int` array that starts with room for 2 reports. Only when a report doesn't fit, create an array twice as long, copy the reports into it, and go on with the new array. No ArrayList.

          After `end`, print how many reports were read and the length of the array, as shown, and then the reports in the order they came, on one line, each followed by a space. For the input shown, the program prints:

          ```
          5 reports in an array of length 8
          410 380 455 120 390
          ```
