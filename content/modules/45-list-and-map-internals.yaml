          Pile.java: |
            public class Pile<T> {
                private T[] values;
                private int size;

                @SuppressWarnings("unchecked")
                public Pile() {
                    this.values = (T[]) new Object[4];
                    this.size = 0;
                }

                @SuppressWarnings("unchecked")
                public void put(T value) {
                    if (this.size == this.values.length) {
                        T[] bigger = (T[]) new Object[this.values.length * 2];
                        for (int i = 0; i < this.size; i++) {
                            bigger[i] = this.values[i];
                        }
                        this.values = bigger;
                    }
                    this.values[this.size] = value;
                    this.size++;
                }

                public T take() {
                    if (this.size == 0) {
                        throw new IllegalStateException("The pile is empty");
                    }
                    T top = this.values[this.size - 1];
                    this.values[this.size - 1] = null;
                    this.size--;
                    return top;
                }

                public int size() {
                    return this.size;
                }
            }
