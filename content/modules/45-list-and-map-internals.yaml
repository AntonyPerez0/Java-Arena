        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  int[] reports = new int[2];
                  int count = 0;
                  while (true) {
                      String line = scanner.nextLine();
                      if (line.equals("end")) {
                          break;
                      }
                      if (count == reports.length) {
                          int[] bigger = new int[reports.length * 2];
                          for (int i = 0; i < count; i++) {
                              bigger[i] = reports[i];
                          }
                          reports = bigger;
                      }
                      reports[count] = Integer.parseInt(line);
                      count++;
                  }
                  System.out.println(count + " reports in an array of length " + reports.length);
                  for (int i = 0; i < count; i++) {
                      System.out.print(reports[i] + " ");
                  }
                  System.out.println();
              }
          }
        hints:
