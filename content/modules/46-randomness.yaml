          SeatingPlan.java: |
            import java.util.ArrayList;
            import java.util.Collections;
            import java.util.Random;

            public class SeatingPlan {
                private ArrayList<String> order;
                private int tables;

                public SeatingPlan(ArrayList<String> guests, int tables, Random random) {
                    this.order = new ArrayList<>(guests);
                    Collections.shuffle(this.order, random);
                    this.tables = tables;
                }

                public ArrayList<String> table(int number) {
                    ArrayList<String> seated = new ArrayList<>();
                    for (int i = 0; i < this.order.size(); i++) {
                        if (i % this.tables == number - 1) {
                            seated.add(this.order.get(i));
                        }
                    }
                    return seated;
                }

                @Override
                public String toString() {
                    String plan = "";
                    for (int number = 1; number <= this.tables; number++) {
                        if (number > 1) {
                            plan += "\n";
                        }
                        plan += "Table " + number + ": ";
                        ArrayList<String> seated = this.table(number);
                        for (int i = 0; i < seated.size(); i++) {
                            if (i > 0) {
                                plan += ", ";
                            }
                            plan += seated.get(i);
                        }
                    }
                    return plan;
                }
            }
