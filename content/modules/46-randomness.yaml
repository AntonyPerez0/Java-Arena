              for (int i = 0; i < 10000; i++) {
                  if (bonus(random)) {
                      bonuses++;
                  }
              }
              System.out.println("Bonus on " + bonuses + " of 10000 squares");
          }

          public static boolean bonus(Random random) {
              return random.[[nextDouble]]() < [[0.25]];
          }
