                }

                public int drop(int column, char piece) {
                    for (int row = this.board.length - 1; row >= 0; row--) {
                        if (this.board[row][column] == '.') {
                            this.board[row][column] = piece;
                            return row;
                        }
                    }
                    return -1;
                }

                public boolean wins(char piece) {
                    int[] rowSteps = {0, 1, 1, 1};
                    int[] columnSteps = {1, 0, 1, -1};
                    for (int row = 0; row < this.board.length; row++) {
                        for (int column = 0; column < this.board[row].length; column++) {
                            for (int i = 0; i < rowSteps.length; i++) {
                                if (this.fourFrom(row, column, rowSteps[i], columnSteps[i], piece)) {
                                    return true;
                                }
                            }
                        }
                    }
                    return false;
                }

                private boolean fourFrom(int row, int column, int rowStep, int columnStep, char piece) {
                    for (int i = 0; i < 4; i++) {
                        int r = row + i * rowStep;
                        int c = column + i * columnStep;
                        if (r < 0 || r >= this.board.length || c < 0 || c >= this.board[r].length) {
                            return false;
                        }
                        if (this.board[r][c] != piece) {
                            return false;
                        }
                    }
                    return true;
                }

                @Override
                public String toString() {
                    StringBuilder text = new StringBuilder();
                    for (int row = 0; row < this.board.length; row++) {
                        if (row > 0) {
                            text.append("\n");
                        }
                        for (int column = 0; column < this.board[row].length; column++) {
                            text.append(this.board[row][column]);
                        }
                    }
                    return text.toString();
                }
            }
