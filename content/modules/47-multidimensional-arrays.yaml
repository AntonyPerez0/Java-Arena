        public class Main {
            public static void main(String[] args) {
                FourInARow game = new FourInARow(4, 5);
                System.out.println(game.drop(1, 'X'));
                System.out.println(game.drop(1, 'O'));
                System.out.println(game.drop(3, 'X'));
                System.out.println(game);
            }
        }
