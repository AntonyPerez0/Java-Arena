      - task: |
          A cinema's room has 5 rows of 8 seats. Write its booking program. It reads bookings, one per line, until the line `end`. A booking is a row and a seat, counted from 1 as people count them, with a space between them, such as `3 4`. Every row is 1 to 5 and every seat 1 to 8. Keep track of the booked seats in a `boolean[][]`:

          - a free seat gets booked, and the program prints `Booked row 3, seat 4`
          - a seat that's already booked stays as it is, and the program prints `Row 3, seat 4 is taken`

          At the end, it prints how many seats were booked. For the input `3 4`, `1 1`, `3 4`, `5 8` and `end` the program prints:

          ```
          Booked row 3, seat 4
          Booked row 1, seat 1
          Row 3, seat 4 is taken
          Booked row 5, seat 8
          Seats booked: 3
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  boolean[][] booked = new boolean[5][8];
                  int count = 0;
                  while (true) {
                      String line = scanner.nextLine();
                      if (line.equals("end")) {
                          break;
                      }
                      String[] parts = line.split(" ");
                      int row = Integer.valueOf(parts[0]);
                      int seat = Integer.valueOf(parts[1]);
                      if (booked[row - 1][seat - 1]) {
                          System.out.println("Row " + row + ", seat " + seat + " is taken");
                      } else {
                          booked[row - 1][seat - 1] = true;
                          count++;
                          System.out.println("Booked row " + row + ", seat " + seat);
                      }
                  }
                  System.out.println("Seats booked: " + count);
              }
          }
        hints:
          - "Create the map with `new boolean[5][8]`. For each line, `split(\" \")` gives the row and the seat as text, and `Integer.valueOf` turns each into a number."
          - "Row `row`, seat `seat` as people count is `booked[row - 1][seat - 1]`. If it's `true`, the seat is taken; otherwise set it to `true` and add one to a counter."
        require:
          - pattern: new\s+boolean\s*\[\s*5\s*\]\s*\[\s*8\s*\]
            message: "Keep the seat map in a `boolean[][]` of 5 rows and 8 seats: `new boolean[5][8]`."
        forbid:
          - pattern: \b(ArrayList|HashMap|HashSet|List|Map|Set)\b
            message: "Keep track of the seats in the two-dimensional array, without a list, set or map."
