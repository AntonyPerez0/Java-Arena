          ChocolateBox.java: |
            import java.util.Arrays;

            public class ChocolateBox {
                private Chocolate[][] places;

                public ChocolateBox(int rows, int columns) {
                    this.places = new Chocolate[rows][columns];
                }

                public void put(int row, int column, Chocolate chocolate) {
                    this.places[row][column] = chocolate;
                }

                public Chocolate take(int row, int column) {
                    Chocolate chocolate = this.places[row][column];
                    this.places[row][column] = null;
                    return chocolate;
                }

                public int gramsLeft() {
                    int grams = 0;
                    for (Chocolate[] row : this.places) {
                        for (Chocolate chocolate : row) {
                            if (chocolate != null) {
                                grams += chocolate.getGrams();
                            }
                        }
                    }
                    return grams;
                }

                @Override
                public String toString() {
                    return Arrays.deepToString(this.places);
                }
            }
