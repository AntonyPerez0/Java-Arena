          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  String[] size = scanner.nextLine().split(" ");
                  int stores = Integer.valueOf(size[0]);
                  int months = Integer.valueOf(size[1]);
                  int[][] sales = new int[stores][months];
                  for (int row = 0; row < stores; row++) {
                      String[] parts = scanner.nextLine().split(" ");
                      for (int column = 0; column < months; column++) {
                          sales[row][column] = Integer.valueOf(parts[column]);
                      }
                  }

                  int total = 0;
                  for (int[] row : sales) {
                      for (int value : row) {
                          total += value;
                      }
                  }
                  System.out.println("Total: " + total);

                  int bestStore = 0;
                  for (int row = 1; row < stores; row++) {
                      if (rowTotal(sales, row) > rowTotal(sales, bestStore)) {
                          bestStore = row;
                      }
                  }
                  System.out.println("Best store: " + (bestStore + 1) + " (" + rowTotal(sales, bestStore) + " mattresses)");

                  int bestMonth = 0;
                  for (int column = 1; column < months; column++) {
                      if (columnTotal(sales, column) > columnTotal(sales, bestMonth)) {
                          bestMonth = column;
                      }
                  }
                  System.out.println("Best month: " + (bestMonth + 1) + " (" + columnTotal(sales, bestMonth) + " mattresses)");
              }

              public static int rowTotal(int[][] grid, int row) {
                  int total = 0;
                  for (int column = 0; column < grid[row].length; column++) {
                      total += grid[row][column];
                  }
                  return total;
              }

              public static int columnTotal(int[][] grid, int column) {
                  int total = 0;
                  for (int row = 0; row < grid.length; row++) {
                      total += grid[row][column];
                  }
                  return total;
              }
          }
