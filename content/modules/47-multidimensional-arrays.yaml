              public static int inLine(char[][] board, int row, int column, int rowStep, int columnStep) {
                  char piece = board[row][column];
                  int count = 0;
                  while (row >= 0 && row < board.length && column >= 0 && column < board[row].length && board[row][column] == piece) {
                      count++;
                      row += rowStep;
                      column += columnStep;
                  }
                  return count;
              }
          }
