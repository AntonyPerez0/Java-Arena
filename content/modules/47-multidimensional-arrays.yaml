      - task: |
          A photo app can flip a picture from left to right, as a mirror does. Write a method `mirrored(int[][] image)` that returns a **new** grid of the same size, where each row holds the values of the same row of `image`, in the reverse order. The grid it's given must stay as it was. The check passes this grid:

          ```java fragment
          int[][] image = {
              {1, 2, 3},
              {4, 5, 6}
          };
          ```

          and prints each row of the grid your method returns with `Arrays.toString`:

          ```
          [3, 2, 1]
          [6, 5, 4]
          ```
        seed: |
          import java.util.Arrays;

          public class Main {
              public static void main(String[] args) {
                  int[][] image = {
                      {1, 2, 3},
                      {4, 5, 6}
                  };
                  int[][] flipped = mirrored(image);
                  for (int[] row : flipped) {
                      System.out.println(Arrays.toString(row));
                  }
              }

              // Write the mirrored method here.
          }
        solution: |
          import java.util.Arrays;

          public class Main {
              public static void main(String[] args) {
                  int[][] image = {
                      {1, 2, 3},
                      {4, 5, 6}
                  };
                  int[][] flipped = mirrored(image);
                  for (int[] row : flipped) {
                      System.out.println(Arrays.toString(row));
                  }
              }

              public static int[][] mirrored(int[][] image) {
                  int[][] result = new int[image.length][image[0].length];
                  for (int row = 0; row < image.length; row++) {
                      for (int column = 0; column < image[row].length; column++) {
                          result[row][column] = image[row][image[row].length - 1 - column];
                      }
                  }
                  return result;
              }
          }
        hints:
          - "The method starts `public static int[][] mirrored(int[][] image) {` and creates the new grid with `new int[image.length][image[0].length]`."
          - "In row `row`, the value for column `column` comes from the other end of the same row: `image[row][image[row].length - 1 - column]`."
