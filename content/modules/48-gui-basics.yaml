    hints:
      - "Each node goes into `slip.getChildren()`, the pane's list of children, in the order it should appear. The title belongs to the stage."
      - "`slip.getChildren().add(new Label(\"Order 21: green tea\"));`, then a `new Button(...)` for each button, and `stage.setTitle(\"Tea order\");`."
