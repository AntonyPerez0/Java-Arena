      public class Main extends Application {

          @Override
          public void start(Stage stage) {
              FlowPane form = new FlowPane();

              stage.setScene(new Scene(form));
              stage.setTitle("Renew a loan");
              stage.show();
          }

          public static void main(String[] args) {
              launch(Main.class);
          }
      }
