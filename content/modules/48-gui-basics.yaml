                    stage.setScene(new Scene(board));
                    stage.setTitle("Stop 14 departures");
                    stage.show();
                }

                private void addRow(GridPane grid, int row, String first, String second, String third) {
                    grid.add(new Label(first), 0, row);
                    grid.add(new Label(second), 1, row);
                    grid.add(new Label(third), 2, row);
                }

                public static void main(String[] args) {
                    launch(Main.class);
                }
