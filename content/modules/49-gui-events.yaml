      import javafx.scene.control.Label;
      import javafx.scene.layout.HBox;
      import javafx.scene.layout.VBox;
      import javafx.stage.Stage;

      public class Main extends Application {

          @Override
          public void start(Stage stage) {
              Label glasses = new Label("Glasses of water: 0");
              Button drink = new Button("Drink one");
              Button newDay = new Button("New day");
              int count = 0;
              drink.setOnAction(event -> {
                  count++;
                  glasses.setText("Glasses of water: " + count);
              });
              newDay.setOnAction(event -> {
                  count = 0;
                  glasses.setText("Glasses of water: " + count);
              });

              stage.setScene(new Scene(new VBox(glasses, new HBox(drink, newDay))));
              stage.setTitle("Water tracker");
              stage.show();
          }

          public static void main(String[] args) {
              launch(Main.class);
          }
      }
    solution: |
      import javafx.application.Application;
      import javafx.scene.Scene;
      import javafx.scene.control.Button;
      import javafx.scene.control.Label;
      import javafx.scene.layout.HBox;
      import javafx.scene.layout.VBox;
      import javafx.stage.Stage;

      public class Main extends Application {
          private int count;

          @Override
          public void start(Stage stage) {
              Label glasses = new Label("Glasses of water: 0");
              Button drink = new Button("Drink one");
              Button newDay = new Button("New day");
              drink.setOnAction(event -> {
                  this.count++;
                  glasses.setText("Glasses of water: " + this.count);
              });
              newDay.setOnAction(event -> {
                  this.count = 0;
                  glasses.setText("Glasses of water: " + this.count);
              });

              stage.setScene(new Scene(new VBox(glasses, new HBox(drink, newDay))));
              stage.setTitle("Water tracker");
              stage.show();
          }

          public static void main(String[] args) {
              launch(Main.class);
          }
      }
    hints:
      - "A lambda can change an instance variable of Main but not a local variable of `start`, so move the count out of `start`."
      - "Declare the count in the class, above `start`: `private int count;`. Then remove the line `int count = 0;` from `start`. In the lambdas, `this.count` is the instance variable: `this.count++;` and `this.count = 0;`."
    require:
