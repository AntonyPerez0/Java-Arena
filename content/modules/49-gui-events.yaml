        solution:
          PomodoroCycle.java: |
            public class PomodoroCycle {
                private int step;

                public PomodoroCycle() {
                    this.step = 0;
                }

                public String current() {
                    if (this.step == 7) {
                        return "Long break";
                    }
                    if (this.step % 2 == 1) {
                        return "Short break";
                    }
                    return "Work " + (this.step / 2 + 1);
                }

                public void next() {
                    this.step = (this.step + 1) % 8;
                }

                public void restart() {
                    this.step = 0;
                }
            }
          Main.java: |
