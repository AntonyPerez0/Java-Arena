          A pomodoro timer goes through a fixed plan of steps: `Work 1`, `Short break`, `Work 2`, `Short break`, `Work 3`, `Short break`, `Work 4`, `Long break`, and then from `Work 1` again. Write both parts:

          - In `PomodoroCycle.java`, the class `PomodoroCycle`, without anything from JavaFX: a constructor that starts at `Work 1`, `current()`, which returns the name of the current step, `next()`, which moves to the next step, and `restart()`, which goes back to `Work 1`.
          - In `Main.java`, the window is built already: the label `Now: Work 1`, and under it the buttons `Next` and `Start over`. Make a PomodoroCycle in `start`. **Next** moves the cycle to its next step and **Start over** restarts it; after either one, the label shows `Now: ` and the current step, like `Now: Short break`.

          The task card shows the window after seven clicks on Next.
