    solution:
      UsernameChecker.java: |
        import java.util.ArrayList;

        public class UsernameChecker {
            private ArrayList<String> taken;

            public UsernameChecker() {
                this.taken = new ArrayList<>();
            }

            public void addTaken(String name) {
                this.taken.add(name.toLowerCase());
            }

            public boolean isFree(String name) {
                return name.length() >= 3 && !this.taken.contains(name.toLowerCase());
            }

            public String message(String name) {
                if (name.length() < 3) {
                    return "At least 3 characters";
                }
                if (this.taken.contains(name.toLowerCase())) {
                    return name + " is taken";
                }
                return name + " is free";
            }
        }
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                UsernameChecker checker = new UsernameChecker();
                checker.addTaken("admin");
                checker.addTaken("Ada");
                System.out.println(checker.message("ad"));
                System.out.println(checker.message("ADA"));
                System.out.println(checker.message("ada_l"));
                System.out.println(checker.isFree("Admin") + " " + checker.isFree("linus"));
            }
        }
    hints:
