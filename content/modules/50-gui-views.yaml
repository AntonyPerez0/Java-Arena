          import javafx.application.Application;
          import javafx.scene.Scene;
          import javafx.scene.control.Button;
          import javafx.scene.control.Label;
          import javafx.scene.layout.HBox;
          import javafx.scene.layout.VBox;
          import javafx.stage.Stage;

          public class Main extends Application {

              @Override
              public void start(Stage stage) {
                  Button begin = new Button("Start");
                  Scene startScene = new Scene(new VBox(10, new Label("Space quiz"), begin));

                  Button mars = new Button("Mars");
                  Button jupiter = new Button("Jupiter");
                  Button venus = new Button("Venus");
                  HBox answers = new HBox(10, mars, jupiter, venus);
                  Scene questionScene = new Scene(new VBox(10, new Label("Which planet is the largest?"), answers));

                  Label result = new Label("");
                  Button again = new Button("Play again");
                  Scene resultScene = new Scene(new VBox(10, result, again));

                  begin.setOnAction(event -> stage.setScene(questionScene));
                  jupiter.setOnAction(event -> {
                      result.setText("Right: Jupiter is the largest.");
                      stage.setScene(resultScene);
                  });
                  mars.setOnAction(event -> {
                      result.setText("Not quite: the largest is Jupiter.");
                      stage.setScene(resultScene);
                  });
                  venus.setOnAction(event -> {
                      result.setText("Not quite: the largest is Jupiter.");
                      stage.setScene(resultScene);
                  });
                  again.setOnAction(event -> stage.setScene(startScene));

                  stage.setScene(startScene);
                  stage.setTitle("Space quiz");
                  stage.show();
              }

              public static void main(String[] args) {
                  launch(Main.class);
              }
          }
