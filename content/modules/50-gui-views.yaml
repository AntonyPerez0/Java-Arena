        solution: |
          import javafx.application.Application;
          import javafx.scene.Scene;
          import javafx.scene.control.Button;
          import javafx.scene.control.Label;
          import javafx.scene.control.TextField;
          import javafx.scene.layout.VBox;
          import javafx.stage.Stage;

          public class Main extends Application {

              @Override
              public void start(Stage stage) {
                  TextField guests = new TextField();
                  Button book = new Button("Book");
                  Label message = new Label("");
                  Scene form = new Scene(new VBox(8, new Label("Guests"), guests, book, message));

                  Label booked = new Label("");
                  Button change = new Button("Change");
                  Scene bookedScene = new Scene(new VBox(8, booked, change));

                  book.setOnAction(event -> {
                      try {
                          int count = Integer.valueOf(guests.getText());
                          if (count < 1) {
                              message.setText("At least 1 guest, please.");
                          } else if (count > 8) {
                              message.setText("For more than 8 guests, please call us.");
                          } else {
                              booked.setText("A table for " + count + " is booked.");
                              message.setText("");
                              stage.setScene(bookedScene);
                          }
                      } catch (NumberFormatException e) {
                          message.setText("Type the number of guests in digits.");
                      }
                  });
                  change.setOnAction(event -> stage.setScene(form));

                  stage.setScene(form);
                  stage.setTitle("Table booking");
                  stage.show();
              }

              public static void main(String[] args) {
                  launch(Main.class);
              }
          }
        hints:
          - "Put the reading and the checks in a `try` block: `int count = Integer.valueOf(guests.getText());` jumps to `catch (NumberFormatException e)` when the text isn't a whole number, and that's where the first message is set."
          - "Inside the `try`, an `if`, `else if`, `else` chain handles below 1, above 8, and the booking. Only the last branch empties the message and calls `stage.setScene(bookedScene)`."
        tests:
