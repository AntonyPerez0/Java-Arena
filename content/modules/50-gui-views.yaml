    solution: |
      import javafx.application.Application;
      import javafx.scene.Scene;
      import javafx.scene.control.Button;
      import javafx.scene.control.Label;
      import javafx.scene.control.TextField;
      import javafx.scene.layout.VBox;
      import javafx.stage.Stage;

      public class Main extends Application {
          private int rooms;

          @Override
          public void start(Stage stage) {
              TextField name = new TextField();
              Button checkIn = new Button("Check in");
              Label message = new Label("");
              Scene form = new Scene(new VBox(8, new Label("Pet's name"), name, checkIn, message));

              Label room = new Label("");
              Button next = new Button("Next pet");
              Scene roomScene = new Scene(new VBox(8, room, next));

              checkIn.setOnAction(event -> {
                  String pet = name.getText().trim();
                  if (pet.isEmpty()) {
                      message.setText("Type the pet's name first.");
                  } else {
                      this.rooms++;
                      room.setText("Room " + this.rooms + " is ready for " + pet + ".");
                      stage.setScene(roomScene);
                  }
              });
              next.setOnAction(event -> {
                  name.clear();
                  message.setText("");
                  stage.setScene(form);
              });

              stage.setScene(form);
              stage.setTitle("Pet hotel");
              stage.show();
          }

          public static void main(String[] args) {
              launch(Main.class);
          }
      }
    hints:
      - "In Check in's handler, read the name once: `String pet = name.getText().trim();`. If `pet.isEmpty()`, set the message; otherwise count the room, set the room's label and call `stage.setScene(roomScene)`."
      - "The room number changes at each check-in, so it can't be a local variable of `start`: declare `private int rooms;` in the class and add one with `this.rooms++` before you use it."
