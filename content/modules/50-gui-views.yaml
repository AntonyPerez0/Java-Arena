            import javafx.geometry.Insets;
            import javafx.scene.Parent;
            import javafx.scene.control.Label;
            import javafx.scene.layout.VBox;

            public class MissedView {
                private CardBox box;
                private PracticeRound round;

                public MissedView(CardBox box, PracticeRound round) {
                    this.box = box;
                    this.round = round;
                }

                public Parent getView() {
                    VBox view = new VBox(4);
                    view.setPadding(new Insets(10));
                    if (this.round.missed().isEmpty()) {
                        view.getChildren().add(new Label("Nothing missed so far."));
                        return view;
                    }
                    view.getChildren().add(new Label("Practice these again:"));
                    for (String country : this.round.missed()) {
                        view.getChildren().add(new Label(country + ": " + this.box.capitalOf(country)));
                    }
                    return view;
                }
            }
