      - task: |
          A restaurant books tables online. The form is a VBox with the spacing 8 holding the label `Guests`, a text field, the button `Book` and an empty label for messages. The booked scene is a VBox with the spacing 8 holding an empty label and the button `Change`. Both are built already: write the handlers.

          **Book** reads the number of guests from the field and checks it, in this order:

          - not a whole number (`Integer.valueOf` throws a NumberFormatException, module 42): the message is `Type the number of guests in digits.`
          - below 1: `At least 1 guest, please.`
          - above 8: `For more than 8 guests, please call us.`
          - otherwise the booked scene's label says `A table for 4 is booked.` (with the number), the message label is emptied, and the window shows the booked scene.

          In the first three cases the window stays on the form. **Change** shows the form again, with the number still in the field. The task card shows the window after typing `4` and clicking Book.
