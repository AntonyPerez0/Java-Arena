      - task: |
          A phone has a home scene and a settings scene. The program clicks its own buttons with `fire()`, which runs a button's handler whether or not its scene is showing. What does it print?
        predict: |
          import javafx.application.Application;
          import javafx.scene.Scene;
          import javafx.scene.control.Button;
          import javafx.scene.control.Label;
          import javafx.scene.layout.VBox;
          import javafx.stage.Stage;

          public class Main extends Application {

              @Override
              public void start(Stage stage) {
                  Label status = new Label("Wi-Fi is on");
                  Button open = new Button("Settings");
                  Scene home = new Scene(new VBox(status, open));

                  Button off = new Button("Turn Wi-Fi off");
                  Button back = new Button("Back");
                  Scene settings = new Scene(new VBox(off, back));

                  open.setOnAction(event -> {
                      stage.setScene(settings);
                      stage.setTitle("Settings");
                  });
                  off.setOnAction(event -> status.setText("Wi-Fi is off"));
                  back.setOnAction(event -> {
                      stage.setScene(home);
                      stage.setTitle("Home");
                  });

                  stage.setScene(home);
                  stage.setTitle("Home");
                  System.out.println(stage.getTitle() + ": " + status.getText());
                  open.fire();
                  off.fire();
                  System.out.println(stage.getTitle() + " " + (stage.getScene() == home));
                  back.fire();
                  System.out.println(stage.getTitle() + ": " + status.getText());
                  stage.show();
              }

              public static void main(String[] args) {
                  launch(Main.class);
              }
          }
        hints:
          - "`open.fire()` shows the settings scene and sets the title to `Settings`, so the window no longer shows `home`."
          - "`off` changes the label in the home scene while the settings show. The label keeps its new text, and `back` shows the home scene with it."
      - task: |
          A quiz with one question has three scenes. The start scene and the question scene are built already, each a VBox with the spacing 10:

          - start: the label `Space quiz` and the button `Start`
          - question: the label `Which planet is the largest?` and an HBox with the spacing 10 holding the buttons `Mars`, `Jupiter` and `Venus`

          Build the third scene, the result: a VBox with the spacing 10 and no padding, holding an empty label and the button `Play again`. Then give the buttons their handlers:

          - `Start` shows the question scene.
          - `Jupiter` sets the result's label to `Right: Jupiter is the largest.` and shows the result scene.
          - `Mars` and `Venus` set it to `Not quite: the largest is Jupiter.` and show the result scene.
          - `Play again` shows the start scene.

          The window's title stays `Space quiz`. The task card shows the window after Start and Jupiter.
