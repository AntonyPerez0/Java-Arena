      - task: |
          A running club logs how far its training group ran each week, in kilometers, in `weeks.csv`. A week without a training run has a `-`:

          ```text
          week,km
          1,24.5
          2,-
          3,31
          4,28.5
          ```

          Write the class `DistanceLog` in `DistanceLog.java`, with the method `public static Map<Integer, Double> read(String fileName) throws IOException`. It reads the file (the header first, then one row per week) and returns a map from each week's number to its kilometers, as a double. A week with a `-` isn't in the map at all.

          `Main.java` is a test drive. The check runs:

          ```java fragment
          Map<Integer, Double> km = DistanceLog.read("weeks.csv");
          System.out.println(km.size());
          System.out.println(km.get(1));
          System.out.println(km.get(3));
          System.out.println(km.containsKey(2));
          ```

          and expects, for the file above:

          ```
          3
          24.5
          31.0
          false
          ```
