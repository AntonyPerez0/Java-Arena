      CupPyramid.java: |
        import java.util.ArrayList;
        import java.util.List;

        public class CupPyramid {

            public static List<Integer> cups(int maxRows) {
                List<Integer> counts = new ArrayList<>();
                int total = 0;
                counts.add(total);
                for (int row = 1; row <= maxRows; row++) {
                    total += row;
                    counts.add(total);
                }
                return counts;
            }
        }
      Main.java: |
