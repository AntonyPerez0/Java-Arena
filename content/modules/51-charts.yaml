        solution: |
          import java.nio.file.Files;
          import java.nio.file.Paths;
          import java.util.List;
          import javafx.application.Application;
          import javafx.scene.Scene;
          import javafx.scene.chart.BarChart;
          import javafx.scene.chart.CategoryAxis;
          import javafx.scene.chart.LineChart;
          import javafx.scene.chart.NumberAxis;
          import javafx.scene.chart.XYChart;
          import javafx.stage.Stage;

          public class Main extends Application {

              @Override
              public void start(Stage stage) throws Exception {
                  List<String> lines = Files.readAllLines(Paths.get("chart.csv"));
                  String[] first = lines.get(0).split(",");
                  String[] header = lines.get(1).split(",");

                  if (first[0].equals("bar")) {
                      stage.setScene(new Scene(this.barChart(first[1], header, lines)));
                  } else {
                      stage.setScene(new Scene(this.lineChart(first[1], header, lines)));
                  }
                  stage.setTitle("My chart");
                  stage.show();
              }

              private BarChart<String, Number> barChart(String title, String[] header, List<String> lines) {
                  CategoryAxis x = new CategoryAxis();
                  x.setLabel(header[0]);
                  NumberAxis y = new NumberAxis();
                  y.setLabel(header[1]);
                  BarChart<String, Number> chart = new BarChart<>(x, y);
                  chart.setTitle(title);
                  chart.setLegendVisible(false);
                  XYChart.Series<String, Number> series = new XYChart.Series<>();
                  series.setName(header[1]);
                  for (int i = 2; i < lines.size(); i++) {
                      String[] parts = lines.get(i).split(",");
                      if (!parts[1].equals("-")) {
                          series.getData().add(new XYChart.Data<>(parts[0], Double.valueOf(parts[1])));
                      }
                  }
                  chart.getData().add(series);
                  return chart;
              }

              private LineChart<Number, Number> lineChart(String title, String[] header, List<String> lines) {
                  NumberAxis x = new NumberAxis();
                  x.setLabel(header[0]);
                  NumberAxis y = new NumberAxis();
                  y.setLabel(header[1]);
                  LineChart<Number, Number> chart = new LineChart<>(x, y);
                  chart.setTitle(title);
                  chart.setLegendVisible(false);
                  XYChart.Series<Number, Number> series = new XYChart.Series<>();
                  series.setName(header[1]);
                  for (int i = 2; i < lines.size(); i++) {
                      String[] parts = lines.get(i).split(",");
                      if (!parts[1].equals("-")) {
                          series.getData().add(new XYChart.Data<>(Double.valueOf(parts[0]), Double.valueOf(parts[1])));
                      }
                  }
                  chart.getData().add(series);
                  return chart;
              }

              public static void main(String[] args) {
                  launch(Main.class);
              }
          }
        hints:
          - "The two kinds of chart have different types (`BarChart<String, Number>` and `LineChart<Number, Number>`), so a method for each keeps them apart. Both are nodes that a Scene can hold."
          - "The rows start at index 2, after the first line and the header. In each method, skip a row whose `parts[1]` is `\"-\"`."
