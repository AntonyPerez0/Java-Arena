          SalesLog.java: |
            import java.util.ArrayList;
            import java.util.HashMap;
            import java.util.List;
            import java.util.Map;

            public class SalesLog {

                public static Map<String, Integer> totals(List<String> rows) {
                    Map<String, Integer> totals = new HashMap<>();
                    for (String row : rows) {
                        String[] parts = row.split(",");
                        int kilos = Integer.valueOf(parts[1]);
                        totals.put(parts[0], totals.getOrDefault(parts[0], 0) + kilos);
                    }
                    return totals;
                }

                public static List<String> products(List<String> rows) {
                    List<String> products = new ArrayList<>();
                    for (String row : rows) {
                        String product = row.split(",")[0];
                        if (!products.contains(product)) {
                            products.add(product);
                        }
                    }
                    return products;
                }
            }
