      import java.nio.file.Files;
      import java.nio.file.Paths;
      import java.util.ArrayList;
      import java.util.Collections;
      import java.util.HashMap;
      import java.util.List;
      import java.util.Map;
      import javafx.application.Application;
      import javafx.scene.Scene;
      import javafx.scene.chart.LineChart;
      import javafx.scene.chart.NumberAxis;
      import javafx.scene.chart.XYChart;
      import javafx.stage.Stage;

      public class Main extends Application {

          @Override
          public void start(Stage stage) throws Exception {
              List<String> lines = Files.readAllLines(Paths.get("temps.csv"));
              Map<Integer, Integer> lowest = new HashMap<>();
              Map<Integer, Integer> highest = new HashMap<>();
              for (int i = 1; i < lines.size(); i++) {
                  String[] parts = lines.get(i).split(",");
                  if (!parts[2].equals("-")) {
                      int day = Integer.valueOf(parts[0]);
                      int temp = Integer.valueOf(parts[2]);
                      if (!lowest.containsKey(day) || temp < lowest.get(day)) {
                          lowest.put(day, temp);
                      }
                      if (!highest.containsKey(day) || temp > highest.get(day)) {
                          highest.put(day, temp);
                      }
                  }
              }
              List<Integer> days = new ArrayList<>(lowest.keySet());
              Collections.sort(days);

              NumberAxis dayAxis = new NumberAxis();
              dayAxis.setLabel("Day");
              NumberAxis tempAxis = new NumberAxis();
              tempAxis.setLabel("Temperature (°C)");
              LineChart<Number, Number> chart = new LineChart<>(dayAxis, tempAxis);
              chart.setTitle("Coldest and warmest");
              XYChart.Series<Number, Number> low = new XYChart.Series<>();
              low.setName("Lowest");
              XYChart.Series<Number, Number> high = new XYChart.Series<>();
              high.setName("Highest");
              for (int day : days) {
                  low.getData().add(new XYChart.Data<>(day, lowest.get(day)));
                  high.getData().add(new XYChart.Data<>(day, highest.get(day)));
              }
              chart.getData().add(low);
              chart.getData().add(high);

              stage.setScene(new Scene(chart));
              stage.setTitle("Mountain hut");
              stage.show();
          }

          public static void main(String[] args) {
              launch(Main.class);
          }
      }
