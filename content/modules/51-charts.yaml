      - task: |
          A coffee machine in an office logs the cups it made each day. Some rows have a `-`, and one row lost its value altogether. What does this program print?
        predict: |
          import java.util.ArrayList;

          public class Main {
              public static void main(String[] args) {
                  String[] rows = {"day,cups", "Mon,4", "Tue,-", "Wed,6", "Thu,", "Fri,5"};
                  ArrayList<Integer> cups = new ArrayList<>();
                  int skipped = 0;
                  for (int i = 1; i < rows.length; i++) {
                      String[] parts = rows[i].split(",");
                      if (parts.length < 2 || parts[1].equals("-")) {
                          skipped++;
                      } else {
                          cups.add(Integer.valueOf(parts[1]));
                      }
                  }
                  System.out.println(cups);
                  System.out.println(skipped + " skipped");
                  System.out.println(rows[0].split(",").length);
              }
          }
        hints:
