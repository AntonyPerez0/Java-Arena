                  price.valueProperty().addListener((observable, oldValue, newValue) -> {
                      int perGb = newValue.intValue();
                      label.setText("Plan B: " + perGb + " euros per GB");
                      this.fill(planB, perGb);
                  });

                  stage.setScene(new Scene(new VBox(10, price, label, chart)));
                  stage.setTitle("Phone plans");
                  stage.show();
              }

              private void fill(XYChart.Series<Number, Number> plan, int perGb) {
                  plan.getData().clear();
                  for (int gb = 0; gb <= 10; gb++) {
                      plan.getData().add(new XYChart.Data<>(gb, perGb * gb));
                  }
              }

              public static void main(String[] args) {
                  launch(Main.class);
              }
          }
        hints:
          - "Write a method `fill(XYChart.Series<Number, Number> plan, int perGb)` that clears the series and adds the 11 points. Call it in `start` with 3, before adding Plan B to the chart."
          - "In the listener of `price.valueProperty()`, take `newValue.intValue()`, set the label's text and call `fill` again with the new price."
