                  for (int y = 0; y < 8; y++) {
                      for (int x = 0; x < 8; x++) {
                          writer.setColor(x, y, Color.WHITE);
                      }
                  }
                  ImageView view = new ImageView(picture);
                  Label count = new Label("Black pixels: 0");
                  view.setOnMouseClicked(event -> {
                      int x = (int) event.getX();
                      int y = (int) event.getY();
                      if (picture.getPixelReader().getColor(x, y).equals(Color.WHITE)) {
                          writer.setColor(x, y, Color.BLACK);
                          this.black++;
                      } else {
                          writer.setColor(x, y, Color.WHITE);
                          this.black--;
                      }
                      count.setText("Black pixels: " + this.black);
                  });

                  stage.setScene(new Scene(new VBox(view, count)));
                  stage.setTitle("Pixel editor");
                  stage.show();
              }

              public static void main(String[] args) {
                  launch(Main.class);
              }
          }
