          import java.nio.file.Files;
          import java.nio.file.Paths;
          import java.util.List;
          import javafx.application.Application;
          import javafx.scene.Scene;
          import javafx.scene.image.ImageView;
          import javafx.scene.image.PixelWriter;
          import javafx.scene.image.WritableImage;
          import javafx.scene.layout.Pane;
          import javafx.scene.paint.Color;
          import javafx.stage.Stage;

          public class Main extends Application {

              @Override
              public void start(Stage stage) throws Exception {
                  List<String> rows = Files.readAllLines(Paths.get("art.txt"));
                  int width = rows.get(0).length();
                  int height = rows.size();
                  WritableImage art = new WritableImage(width, height);
                  PixelWriter writer = art.getPixelWriter();
                  for (int y = 0; y < height; y++) {
                      for (int x = 0; x < width; x++) {
                          char c = rows.get(y).charAt(x);
                          if (c == '#') {
                              writer.setColor(x, y, Color.BLACK);
                          } else if (c == 'o') {
                              writer.setColor(x, y, Color.ORANGE);
                          } else {
                              writer.setColor(x, y, Color.WHITE);
                          }
                      }
                  }

                  stage.setScene(new Scene(new Pane(new ImageView(art))));
                  stage.setTitle("Pixel art");
                  stage.show();
              }

              public static void main(String[] args) {
                  launch(Main.class);
              }
          }
