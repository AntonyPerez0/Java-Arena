          import javafx.application.Application;
          import javafx.scene.Scene;
          import javafx.scene.canvas.Canvas;
          import javafx.scene.canvas.GraphicsContext;
          import javafx.scene.layout.Pane;
          import javafx.scene.paint.Color;
          import javafx.stage.Stage;

          public class Main extends Application {
              private double startX;
              private double startY;

              @Override
              public void start(Stage stage) {
                  Canvas canvas = new Canvas(200, 150);
                  GraphicsContext pen = canvas.getGraphicsContext2D();
                  pen.setFill(Color.LIGHTSTEELBLUE);
                  canvas.setOnMousePressed(event -> {
                      this.startX = event.getX();
                      this.startY = event.getY();
                  });
                  canvas.setOnMouseReleased(event -> {
                      double x = Math.min(this.startX, event.getX());
                      double y = Math.min(this.startY, event.getY());
                      double width = Math.abs(event.getX() - this.startX);
                      double height = Math.abs(event.getY() - this.startY);
                      if (width > 0 && height > 0) {
                          pen.fillRect(x, y, width, height);
                          pen.strokeRect(x, y, width, height);
                      }
                  });

                  stage.setScene(new Scene(new Pane(canvas)));
                  stage.setTitle("Room planner");
                  stage.show();
              }

              public static void main(String[] args) {
                  launch(Main.class);
              }
          }
