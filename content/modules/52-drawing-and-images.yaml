          import java.nio.file.Files;
          import java.nio.file.Paths;
          import java.util.List;
          import javafx.application.Application;
          import javafx.scene.Scene;
          import javafx.scene.canvas.Canvas;
          import javafx.scene.canvas.GraphicsContext;
          import javafx.scene.control.Label;
          import javafx.scene.layout.VBox;
          import javafx.scene.paint.Color;
          import javafx.stage.Stage;

          public class Main extends Application {

              @Override
              public void start(Stage stage) throws Exception {
                  Canvas canvas = new Canvas(300, 60);
                  GraphicsContext pen = canvas.getGraphicsContext2D();
                  List<String> codes = Files.readAllLines(Paths.get("colors.txt"));
                  for (int i = 0; i < codes.size(); i++) {
                      pen.setFill(Color.web(codes.get(i)));
                      pen.fillRect(10 + 50 * i, 10, 40, 40);
                  }
                  Label count = new Label("Colors: " + codes.size());

                  stage.setScene(new Scene(new VBox(canvas, count)));
                  stage.setTitle("Color card");
                  stage.show();
              }

              public static void main(String[] args) {
                  launch(Main.class);
              }
          }
