          import javafx.application.Application;
          import javafx.scene.Scene;
          import javafx.scene.chart.BarChart;
          import javafx.scene.chart.CategoryAxis;
          import javafx.scene.chart.NumberAxis;
          import javafx.scene.chart.XYChart;
          import javafx.scene.image.Image;
          import javafx.scene.image.PixelReader;
          import javafx.scene.paint.Color;
          import javafx.stage.Stage;

          public class Main extends Application {

              @Override
              public void start(Stage stage) {
                  Image picture = new Image("file:pic.png");
                  PixelReader reader = picture.getPixelReader();
                  int dark = 0;
                  int middle = 0;
                  int light = 0;
                  for (int y = 0; y < (int) picture.getHeight(); y++) {
                      for (int x = 0; x < (int) picture.getWidth(); x++) {
                          Color color = reader.getColor(x, y);
                          int red = (int) Math.round(color.getRed() * 255);
                          int green = (int) Math.round(color.getGreen() * 255);
                          int blue = (int) Math.round(color.getBlue() * 255);
                          int brightness = (red + green + blue) / 3;
                          if (brightness < 85) {
                              dark++;
                          } else if (brightness < 170) {
                              middle++;
                          } else {
                              light++;
                          }
                      }
                  }

                  BarChart<String, Number> chart = new BarChart<>(new CategoryAxis(), new NumberAxis());
                  chart.setTitle("Brightness of pic.png");
                  chart.setLegendVisible(false);
                  XYChart.Series<String, Number> pixels = new XYChart.Series<>();
                  pixels.setName("Pixels");
                  pixels.getData().add(new XYChart.Data<>("dark", dark));
                  pixels.getData().add(new XYChart.Data<>("middle", middle));
                  pixels.getData().add(new XYChart.Data<>("light", light));
                  chart.getData().add(pixels);

                  stage.setScene(new Scene(chart));
                  stage.setTitle("Brightness");
                  stage.show();
              }

              public static void main(String[] args) {
                  launch(Main.class);
              }
          }
