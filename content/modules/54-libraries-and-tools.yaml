      - task: |
          A community kitchen plans its volunteer shifts. Read lines such as `Saturday Ada` (a day, a space and a name) until an empty line. Then print, for each day, the day, a colon and the names of that day's volunteers in the order they were read, separated by `, `. Print the days in the order they first came up in the input.

          Keep the names in a `HashMap<String, List<String>>` from each day to its list of names (module 33). A HashMap doesn't keep its keys in the order they came, so keep the days' order in a list of its own. For the input shown, the program prints:

          ```
          Saturday: Ada, Ben, Dina
          Monday: Carl
          ```
        seed: |
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner scanner = new Scanner(System.in);
                  HashMap<String, List<String>> shifts = new HashMap<>();
                  List<String> days = new ArrayList<>();
                  while (true) {
                      String line = scanner.nextLine();
                      if (line.isEmpty()) {
                          break;
                      }
                      String[] parts = line.split(" ");
                      String day = parts[0];
                      if (!shifts.containsKey(day)) {
                          shifts.put(day, new ArrayList<>());
                          days.add(day);
                      }
                      shifts.get(day).add(parts[1]);
                  }
                  for (String day : days) {
                      System.out.println(day + ": " + String.join(", ", shifts.get(day)));
                  }
              }
          }
        hints:
          - "When a day comes up for the first time (`!shifts.containsKey(day)`), put a new empty list for it in the map and add the day to the list of days. Then add the name to `shifts.get(day)`."
          - "At the end, go through the list of days, not the map. `String.join(\", \", names)` joins a list of Strings with `, ` between them."
        require:
          - pattern: new\s+HashMap
            message: "Keep each day's names in a `HashMap<String, List<String>>`."
