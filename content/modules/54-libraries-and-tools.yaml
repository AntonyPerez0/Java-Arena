          MapRepairJobDao.java: |
            import java.util.ArrayList;
            import java.util.Comparator;
            import java.util.HashMap;
            import java.util.List;
            import java.util.Map;

            public class MapRepairJobDao implements RepairJobDao {
                private Map<Integer, RepairJob> jobs;
                private int nextId;

                public MapRepairJobDao() {
                    this.jobs = new HashMap<>();
                    this.nextId = 1;
                }

                @Override
                public List<RepairJob> list() {
                    List<RepairJob> all = new ArrayList<>(this.jobs.values());
                    all.sort(Comparator.comparing(RepairJob::getId));
                    return all;
                }

                @Override
                public int add(String bike, String problem) {
                    int id = this.nextId;
                    this.nextId++;
                    this.jobs.put(id, new RepairJob(id, bike, problem, false));
                    return id;
                }

                @Override
                public RepairJob findById(int id) {
                    return this.jobs.get(id);
                }

                @Override
                public boolean update(RepairJob job) {
                    if (!this.jobs.containsKey(job.getId())) {
                        return false;
                    }
                    this.jobs.put(job.getId(), job);
                    return true;
                }

                @Override
                public boolean remove(int id) {
                    return this.jobs.remove(id) != null;
                }
            }
