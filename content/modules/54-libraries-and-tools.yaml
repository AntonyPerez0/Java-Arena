id: libraries-and-tools
summary: The tools around a Java program, and the end of the course. Maven, a project's folders and pom.xml, dependencies and where libraries come from; data access objects (DAOs) that keep storing apart from the rest of a program, with an in-memory DAO you write and a text UI that talks only to its interface; a real database with JDBC and H2 on your own computer; packaging a program as a jar; and a look back at the whole course. MOOC sections 14.4 and 14.5.
steps:
  - id: libraries-and-tools-build-tools
    slug: build-tools
    title: "Build tools: Maven and a project's layout"
    text: |
      Every program in this course so far was a few files that Java Arena compiled and ran for you. Real projects are bigger, and they almost never start from nothing: they use **libraries**, code that other people wrote, tested and packaged for anyone to use. You've used two already. JUnit (module 26) is a library for unit tests, and JavaFX (modules 48 to 53) is a library for windows. On this site they were simply there: Java Arena puts JUnit and its practice version of JavaFX on the class path for you.

      On your own computer, someone has to download the right version of each library, put it where javac and java can find it, compile the files in the right order, run the tests and pack the result. A **build tool** does all of that from a description of the project. The MOOC's exercise templates use **Maven**, one of the two build tools most Java projects use (the other is Gradle).

      This module is about the tools that sit around a program. Maven, libraries and databases need your own computer: nothing on this page runs Maven or opens a database. The programs you write here use only the JDK, and the "database" in them is a data access object that keeps its data in memory, in a list or a map. Each step says what you'd do on your own computer.

      ### A Maven project's folders

      Maven expects every project to have the same folders, so anyone who knows Maven finds their way around a new project at once:

      ```text
      repair-queue/
          pom.xml
          src/
              main/
                  java/
                      com/example/repairs/
                          Main.java
                          RepairJob.java
              test/
                  java/
                      com/example/repairs/
                          RepairJobTest.java
          target/
      ```

      - `pom.xml` describes the project. It's at the top, in the project's own folder.
      - `src/main/java` holds the program's own classes, in the folders of their packages (module 41): the class `com.example.repairs.Main` is in `src/main/java/com/example/repairs/Main.java`.
      - `src/test/java` holds the test classes, in the same packages, so a test can use the classes it tests without imports, package-private parts included. They're compiled and run for the tests, and they aren't part of the finished program.
      - `target` is where Maven puts what it makes: compiled classes, test reports and the finished jar. Maven creates it, and you can delete it any time: the next build makes it again.

      ### pom.xml

      POM stands for Project Object Model. The file is written in XML, a text format of nested **elements**: `<version>1.0-SNAPSHOT</version>` is an element named `version` whose content is `1.0-SNAPSHOT`, and an element can hold other elements. A small `pom.xml` looks like this:

      ```xml pom.xml
      <?xml version="1.0" encoding="UTF-8"?>
      <project xmlns="http://maven.apache.org/POM/4.0.0"
               xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
          <modelVersion>4.0.0</modelVersion>

          <groupId>com.example</groupId>
          <artifactId>repair-queue</artifactId>
          <version>1.0-SNAPSHOT</version>

          <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
          </properties>

          <dependencies>
              <dependency>
                  <groupId>junit</groupId>
                  <artifactId>junit</artifactId>
                  <version>4.13.2</version>
                  <scope>test</scope>
              </dependency>
          </dependencies>
      </project>
      ```

      The first lines are the same in every pom.xml: they say which kind of XML file this is. The rest is about this project:

      - **groupId, artifactId and version** name the project. The groupId is usually a domain name turned around, like a package name (`com.example`); the artifactId is the project's own name (`repair-queue`); the version is its version. `SNAPSHOT` at the end means "still being worked on": a finished release drops it (`1.0`).
      - **properties** are settings. `maven.compiler.release` is the Java version to compile for, and the source encoding says the files are UTF-8.
      - **dependencies** lists the libraries the project uses.

      ### A dependency

      Every library is named the same three ways as the project itself. Those three names are a library's **coordinates**, often written on one line with colons between them: `junit:junit:4.13.2`, or `com.h2database:h2:2.2.224` for the database library of step 4. To use a library, you add a `dependency` element with its coordinates inside `dependencies`:

      ```xml
      <dependency>
          <groupId>com.h2database</groupId>
          <artifactId>h2</artifactId>
          <version>2.2.224</version>
      </dependency>
      ```

      A dependency can also have a **scope**. JUnit's above is `<scope>test</scope>`: the library is there when the tests are compiled and run, and not in the program itself, since the program never uses JUnit. A dependency without a scope is there everywhere.

      ### Where libraries come from

      Maven downloads libraries from **Maven Central**, a large public repository of Java libraries. You can search it at [central.sonatype.com](https://central.sonatype.com) or through [mvnrepository.com](https://mvnrepository.com), which the MOOC mentions; each library's page shows the `dependency` element to copy, with its newest version.

      Maven keeps what it downloads on your computer, in a **local repository**: a folder named `.m2/repository` in your home folder. A jar's place there comes from its coordinates. The dots of the groupId become folders, then come a folder for the artifactId and one for the version, and the jar is named after the artifactId and the version. So `com.h2database:h2:2.2.224` is kept as:

      ```text
      .m2/repository/com/h2database/h2/2.2.224/h2-2.2.224.jar
      ```

      The next build finds it there and downloads nothing. A library can need libraries of its own: JUnit 4.13.2 needs Hamcrest Core 1.3, so Maven downloads that too, without a line about it in your pom.xml. These are called **transitive dependencies**.

      ### On your own computer

      To build a Maven project on your own computer, install a JDK (version 21, as on this site) and Maven 3.9 or newer, or an editor that comes with Maven, such as IntelliJ IDEA, NetBeans (which the MOOC uses) or VS Code with its Java extensions. These editors open a folder with a pom.xml as a project and run Maven for you from their menus. In a terminal, in the project's folder:

      ```shell
      mvn compile
      mvn test
      mvn package
      mvn compile exec:java -Dexec.mainClass=com.example.repairs.Main
      ```

      - `mvn compile` downloads what's missing and compiles `src/main/java` into `target/classes`.
      - `mvn test` compiles the tests too and runs them, with a report of what passed.
      - `mvn package` does both and packs the program into a jar in `target` (step 5).
      - The last line runs the program's `main` with the exec plugin, which Maven downloads the first time.

      The first build takes a while, since Maven downloads its own plugins too; later ones are fast. The MOOC's [section 14.4](https://java-programming.mooc.fi/part-14/4-maven-and-third-party-libraries) shows how its exercise templates use Maven.

      ### And here

      Java Arena runs no Maven. It compiles your files with javac, and JUnit and its practice JavaFX are already on the class path. The folders of packages still work the same way here as on your own computer, and the files of a challenge are what would go in `src/main/java`.

      **Your turn:** a small tool for a project prints where a class's file goes in a Maven project. Fill in the blanks so that `sourcePath` returns the path of a class's file from its full name: `src/main/java`, then the package's folders, then the class's name and `.java`. The program prints:

      ```
      src/main/java/com/example/repairs/Main.java
      src/main/java/com/example/repairs/RepairJob.java
      ```
    fill: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(sourcePath("com.example.repairs.Main"));
              System.out.println(sourcePath("com.example.repairs.RepairJob"));
          }

          public static String sourcePath(String className) {
              return "[[src/main/java]]/" + className.[[replace]](".", "/") + ".java";
          }
      }
    hints:
      - "The program's own classes go in `src/main/java` (the tests in `src/test/java`). After it comes one folder for each part of the package name."
      - "The dots of `com.example.repairs.Main` become the slashes of `com/example/repairs/Main`: that's `className.replace(\".\", \"/\")`."
    tests:
      - name: Two classes of one package
      - call: |
          System.out.println(sourcePath("org.kiln.schedule.Firing"));
          System.out.println(sourcePath("Main"));
        hidden: true
    more:
      - task: |
          Library pages often give a dependency as one line of coordinates, `group:artifact:version`, and sometimes a fourth part, the scope: `junit:junit:4.13.2:test`. Write the method `printDependency(String coordinates)`, which prints the `dependency` element for pom.xml, with its parts on lines of their own, indented by 4 spaces:

          - `<dependency>`
          - the groupId, the artifactId and the version, each in its element
          - only when the coordinates have a fourth part: the scope in a `scope` element
          - `</dependency>`

          The program calls it for `com.h2database:h2:2.2.224` and prints:

          ```
          <dependency>
              <groupId>com.h2database</groupId>
              <artifactId>h2</artifactId>
              <version>2.2.224</version>
          </dependency>
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  printDependency("com.h2database:h2:2.2.224");
              }

              public static void printDependency(String coordinates) {

              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  printDependency("com.h2database:h2:2.2.224");
              }

              public static void printDependency(String coordinates) {
                  String[] parts = coordinates.split(":");
                  System.out.println("<dependency>");
                  System.out.println("    <groupId>" + parts[0] + "</groupId>");
                  System.out.println("    <artifactId>" + parts[1] + "</artifactId>");
                  System.out.println("    <version>" + parts[2] + "</version>");
                  if (parts.length == 4) {
                      System.out.println("    <scope>" + parts[3] + "</scope>");
                  }
                  System.out.println("</dependency>");
              }
          }
        hints:
          - "`coordinates.split(\":\")` gives the parts in an array: the groupId at index 0, the artifactId at 1 and the version at 2."
          - "The array's `length` is 4 when there's a scope. Print its line only then, between the version and `</dependency>`."
        tests:
          - name: H2, without a scope
          - call: printDependency("junit:junit:4.13.2:test");
            hidden: true
          - call: |
              printDependency("org.hamcrest:hamcrest-core:1.3");
              printDependency("org.openjfx:javafx-controls:21.0.12:compile");
            hidden: true
      - task: |
          In Maven's local repository, a library's jar is in folders named after its coordinates, as the lesson showed. What does this program print?
        predict: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(jarPath("junit:junit:4.13.2"));
                  System.out.println(jarPath("org.hamcrest:hamcrest-core:1.3"));
              }

              public static String jarPath(String coordinates) {
                  String[] parts = coordinates.split(":");
                  String group = parts[0].replace(".", "/");
                  String artifact = parts[1];
                  String version = parts[2];
                  return group + "/" + artifact + "/" + version + "/" + artifact + "-" + version + ".jar";
              }
          }
        hints:
          - "Only the groupId's dots become slashes. The version keeps its dots, and so does the artifactId (it has none here)."
          - "`junit` has no dots, so its folder is just `junit`, then the artifactId's folder `junit`, then the version's folder, then the jar's name."

  - id: libraries-and-tools-daos
    slug: data-access-objects
    title: Data access objects
    text: |
      A program that keeps data for longer than one run stores it somewhere: in files (module 43), in a database (step 4), or on a server somewhere else. Where it's stored is a decision that can change. A shop's program might start with a file, move to a database when it grows, and use a list in memory in its tests.

      If code all over the program reads and writes the file itself, each such change means changing all of that code. A **data access object**, a **DAO** for short, puts everything about storing in one class. The rest of the program asks it for the data and hands it new data, and never knows where the data lives. It's the same idea as module 25's split between the user interface and the program's logic, one layer further down.

      ### The interface

      A DAO is usually described by an interface (module 35): the things it can do, with no word about how. A recipe box keeps recipes:

      ```java fragment
      public interface RecipeDao {
          List<Recipe> list();
          int add(String name, int minutes);
          Recipe findById(int id);
      }
      ```

      - `list()` returns every recipe.
      - `add(name, minutes)` stores a new recipe and returns the **id** it got: a number that names this recipe and no other.
      - `findById(id)` returns the recipe with that id, or `null` when there's none.

      Why ids? Two recipes can have the same name, and a name can change. A table usually has an id column whose numbers the database hands out, and the rest of the program uses that number to say which one it means: "show recipe 3", "remove recipe 5". The DAO hands out the ids, never the caller.

      ### An implementation that keeps everything in memory

      The simplest DAO keeps its recipes in a list. Its data is gone when the program ends, but everything else works as with a real database, which makes it right for trying a program out and for tests:

      ```java run
      public class Main {
          public static void main(String[] args) {
              RecipeDao recipes = new InMemoryRecipeDao();
              int curry = recipes.add("Chickpea curry", 40);
              recipes.add("Herb flatbread", 20);
              System.out.println("The curry got id " + curry);
              System.out.println(recipes.list());
              System.out.println(recipes.findById(2));
              System.out.println(recipes.findById(7));
          }
      }
      // ==== RecipeDao.java ====
      import java.util.List;

      public interface RecipeDao {
          List<Recipe> list();
          int add(String name, int minutes);
          Recipe findById(int id);
      }
      // ==== InMemoryRecipeDao.java ====
      import java.util.ArrayList;
      import java.util.List;

      public class InMemoryRecipeDao implements RecipeDao {
          private List<Recipe> recipes;
          private int nextId;

          public InMemoryRecipeDao() {
              this.recipes = new ArrayList<>();
              this.nextId = 1;
          }

          @Override
          public List<Recipe> list() {
              return new ArrayList<>(this.recipes);
          }

          @Override
          public int add(String name, int minutes) {
              int id = this.nextId;
              this.nextId++;
              this.recipes.add(new Recipe(id, name, minutes));
              return id;
          }

          @Override
          public Recipe findById(int id) {
              for (Recipe recipe : this.recipes) {
                  if (recipe.getId() == id) {
                      return recipe;
                  }
              }
              return null;
          }
      }
      // ==== Recipe.java ====
      public class Recipe {
          private int id;
          private String name;
          private int minutes;

          public Recipe(int id, String name, int minutes) {
              this.id = id;
              this.name = name;
              this.minutes = minutes;
          }

          public int getId() {
              return this.id;
          }

          public String getName() {
              return this.name;
          }

          public int getMinutes() {
              return this.minutes;
          }

          @Override
          public String toString() {
              return "#" + this.id + " " + this.name + ", " + this.minutes + " min";
          }
      }
      ```

      ```output
      The curry got id 1
      [#1 Chickpea curry, 40 min, #2 Herb flatbread, 20 min]
      #2 Herb flatbread, 20 min
      null
      ```

      ```classes
      interface RecipeDao
      + list(): List<Recipe>
      + add(name: String, minutes: int): int
      + findById(id: int): Recipe

      class InMemoryRecipeDao implements RecipeDao
      - recipes: List<Recipe>
      - nextId: int

      class Recipe
      - id: int
      - name: String
      - minutes: int

      InMemoryRecipeDao --> * Recipe
      ```

      - **Ids grow from 1.** `nextId` is the id the next recipe gets. `add` takes it and counts it up, so every recipe gets a new one. A database table with an identity column, like the one in step 4, does the same: H2 doesn't hand out a removed row's id again, even after the program restarts. That matters because an old "recipe 5" written down somewhere must never come to mean another recipe.
      - **`list()` returns a new list** with the same recipes. If it returned `this.recipes` itself, a caller could `clear()` it, or add a recipe with any id it likes, past the DAO. A database's DAO also builds a new list for every call, so a caller can't tell the difference.
      - **`main` uses the interface.** The variable's type is `RecipeDao`; only the line with `new` names the class. Swap that one line for another DAO, and the rest of the program stays the same.

      ### Changing and removing

      A DAO usually does two more things:

      ```java fragment
      boolean update(Recipe recipe);
      boolean remove(int id);
      ```

      `update` stores the recipe it's given in place of the one with the same id, and `remove` removes the one with that id. Both return whether there was such a recipe. Together with `add` and the two ways of reading, these are often called **CRUD**: create, read, update and delete, the four things a program does with stored data.

      **Your turn:** a bike repair shop keeps a queue of repair jobs. `RepairJob.java` and the interface `RepairJobDao.java` are ready. Write the class `InMemoryRepairJobDao`, which keeps the jobs in a list:

      - `list()` returns a new list with every job, in the order they were added
      - `add(bike, problem)` stores a new job that isn't ready yet, with the next id, and returns the id; the first id is 1
      - `findById(id)` returns the job with that id, or `null`

      Each DAO has ids of its own: a new DAO starts from 1 again. The program prints:

      ```
      1 and 2
      [#1 red road bike: flat tire (waiting), #2 green cargo bike: squeaky brakes (waiting)]
      #2 green cargo bike: squeaky brakes (waiting)
      null
      ```
