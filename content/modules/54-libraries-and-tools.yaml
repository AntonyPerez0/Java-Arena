            import java.util.ArrayList;
            import java.util.List;

            public class InMemoryRepairJobDao implements RepairJobDao {
                private List<RepairJob> jobs;
                private int nextId;

                public InMemoryRepairJobDao() {
                    this.jobs = new ArrayList<>();
                    this.nextId = 1;
