      RepairJob.java: |
        public class RepairJob {
            private int id;
            private String bike;
            private String problem;
            private boolean ready;

            public RepairJob(int id, String bike, String problem, boolean ready) {
                this.id = id;
                this.bike = bike;
                this.problem = problem;
                this.ready = ready;
            }

            public int getId() {
                return this.id;
            }

            public String getBike() {
                return this.bike;
            }

            public String getProblem() {
