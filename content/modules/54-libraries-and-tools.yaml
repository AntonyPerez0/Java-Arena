        solution:
          CappedTariff.java: |
            public class CappedTariff implements Tariff {
                private int centsPerMinute;
                private int cap;

                public CappedTariff(int centsPerMinute, int cap) {
                    this.centsPerMinute = centsPerMinute;
                    this.cap = cap;
                }

                @Override
                public int price(int minutes) {
                    return Math.min(minutes * this.centsPerMinute, this.cap);
                }
            }
          Main.java: |
            import java.util.ArrayList;
            import java.util.List;

            public class Main {
                public static void main(String[] args) {
                    Tariff capped = new CappedTariff(30, 600);
                    System.out.println(capped.price(5));
                    System.out.println(capped.price(40));

                    List<Tariff> tariffs = new ArrayList<>();
                    tariffs.add(new PerMinuteTariff(25));
                    tariffs.add(capped);
                    System.out.println(cheapest(tariffs, 20));
                }

                public static int cheapest(List<Tariff> tariffs, int minutes) {
                    int lowest = tariffs.get(0).price(minutes);
                    for (Tariff tariff : tariffs) {
                        int price = tariff.price(minutes);
                        if (price < lowest) {
                            lowest = price;
                        }
                    }
                    return lowest;
                }
            }
          Tariff.java: |
            public interface Tariff {
                int price(int minutes);
            }
          PerMinuteTariff.java: |
            public class PerMinuteTariff implements Tariff {
                private int centsPerMinute;

                public PerMinuteTariff(int centsPerMinute) {
                    this.centsPerMinute = centsPerMinute;
                }

                @Override
                public int price(int minutes) {
                    return minutes * this.centsPerMinute;
                }
            }
        hints:
          - "`CappedTariff implements Tariff`, keeps both numbers in instance variables, and its `price` returns the smaller of the full price and the cap: `Math.min(minutes * this.centsPerMinute, this.cap)`."
          - "`cheapest` starts from the first tariff's price and goes through the list, keeping the lowest price so far. It only calls `price`, so it works for any kind of Tariff."
