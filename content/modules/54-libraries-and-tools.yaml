                this.bike = bike;
                this.problem = problem;
                this.ready = ready;
            }

            public int getId() {
                return this.id;
            }

            public String getBike() {
                return this.bike;
            }

            public String getProblem() {
                return this.problem;
            }

            public boolean isReady() {
                return this.ready;
            }

