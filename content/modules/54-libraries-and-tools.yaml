            import java.util.List;
            import java.util.Scanner;

            public class QueueUi {
                private RepairJobDao queue;
                private Scanner scanner;

                public QueueUi(RepairJobDao queue, Scanner scanner) {
                    this.queue = queue;
                    this.scanner = scanner;
                }

                public void start() {
                    while (true) {
                        System.out.print("> ");
                        String command = this.scanner.nextLine();
                        if (command.equals("quit")) {
                            System.out.println("Bye");
                            break;
                        }
                        if (command.equals("list")) {
                            list();
                        } else if (command.equals("add")) {
                            add();
                        } else if (command.equals("ready")) {
                            ready();
                        } else if (command.equals("remove")) {
                            remove();
                        } else if (command.equals("next")) {
                            next();
                        } else {
                            System.out.println("Unknown command: " + command);
                        }
                    }
                }

                private void list() {
                    List<RepairJob> jobs = this.queue.list();
                    if (jobs.isEmpty()) {
                        System.out.println("The queue is empty");
                    }
                    for (RepairJob job : jobs) {
                        System.out.println(job);
                    }
                }

                private void add() {
                    String bike = this.scanner.nextLine();
                    String problem = this.scanner.nextLine();
                    int id = this.queue.add(bike, problem);
                    System.out.println("Added job " + id);
                }

                private void ready() {
                    int id = Integer.valueOf(this.scanner.nextLine());
                    RepairJob job = this.queue.findById(id);
                    if (job == null) {
                        System.out.println("No job " + id);
                        return;
                    }
                    this.queue.update(new RepairJob(id, job.getBike(), job.getProblem(), true));
                    System.out.println("Job " + id + " is ready");
                }

                private void remove() {
                    int id = Integer.valueOf(this.scanner.nextLine());
                    if (this.queue.remove(id)) {
                        System.out.println("Removed job " + id);
                    } else {
                        System.out.println("No job " + id);
                    }
                }

                private void next() {
                    for (RepairJob job : this.queue.list()) {
                        if (!job.isReady()) {
                            System.out.println("Next: " + job);
                            return;
                        }
                    }
                    System.out.println("Nothing is waiting");
                }
            }
