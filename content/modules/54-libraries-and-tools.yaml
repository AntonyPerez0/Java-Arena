      - task: |
          The repair queue needs to remove jobs: a customer took their bike home unfixed. The interface now has `boolean remove(int id)`, and `list`, `add` and `findById` are done. Write `remove` in `InMemoryRepairJobDao`: it removes the job with that id and returns `true`, or returns `false` when there's no such job.

          Ids are never handed out again: after job 3 is removed, the next new job still gets the next id, not 3. The program prints:

          ```
          true
          false
          new id 4
          [#1 red road bike: flat tire (waiting), #3 yellow folding bike: bent wheel (waiting), #4 black fixie: worn saddle (waiting)]
          ```
