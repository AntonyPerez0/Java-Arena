          CountingRepairJobDao.java: |
            import java.util.ArrayList;
            import java.util.List;

            public class CountingRepairJobDao implements RepairJobDao {
                private RepairJobDao inner;
                private int reads;
                private int writes;

                public CountingRepairJobDao(RepairJobDao inner) {
                    this.inner = inner;
                    this.reads = 0;
                    this.writes = 0;
                }

                public int getReads() {
                    return this.reads;
                }

                public int getWrites() {
                    return this.writes;
                }

                @Override
                public List<RepairJob> list() {
                    this.reads++;
                    return new ArrayList<>(this.inner.list());
                }

                @Override
                public int add(String bike, String problem) {
                    this.writes++;
                    return this.inner.add(bike, problem);
                }

                @Override
                public RepairJob findById(int id) {
                    this.reads++;
                    return this.inner.findById(id);
                }

                @Override
                public boolean update(RepairJob job) {
                    this.writes++;
                    return this.inner.update(job);
                }

                @Override
                public boolean remove(int id) {
                    this.writes++;
                    return this.inner.remove(id);
                }
            }
