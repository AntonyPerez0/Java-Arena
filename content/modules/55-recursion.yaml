      - task: |
          A bookshop owner wants to know in how many different orders a number of books can stand on a shelf. One book stands in 1 order. With 2 books there are 2 orders, and with 3 books 6: any of the 3 can stand first, and the other 2 stand after it in 2 orders. In general, `n` books stand in `n` times as many orders as `n - 1` books. That's the factorial of `n`, written `n!`. An empty shelf counts as 1 order (`0! = 1`).

          The numbers grow fast, so write the method `orders(int books)` that returns a `long`, with recursion and no loop. A `long` holds factorials up to `20!`. The check runs:

          ```java fragment
          System.out.println(orders(3));
          System.out.println(orders(0));
          System.out.println(orders(15));
          ```

          and expects:

          ```
          6
          1
          1307674368000
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(orders(3));
                  System.out.println(orders(0));
                  System.out.println(orders(15));
              }

              // Write the method orders here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(orders(3));
                  System.out.println(orders(0));
                  System.out.println(orders(15));
              }

              public static long orders(int books) {
                  if (books == 0) {
                      return 1;
                  }
                  return books * orders(books - 1);
              }
          }
        hints:
          - "The base case is an empty shelf: `if (books == 0)`, return 1."
          - "Otherwise the answer is `books` times the orders of one book fewer: `return books * orders(books - 1);`. Since `orders` returns a long, the multiplication is done with longs."
