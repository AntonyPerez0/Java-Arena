                  return findLabel(labels, name, 0, labels.length - 1);
              }

              public static int findLabel(String[] labels, String name, int low, int high) {
                  if (low > high) {
                      return -1;
                  }
                  int middle = (low + high) / 2;
                  int order = name.compareTo(labels[middle]);
                  if (order == 0) {
                      return middle;
                  }
                  if (order > 0) {
                      return findLabel(labels, name, middle + 1, high);
                  }
                  return findLabel(labels, name, low, middle - 1);
              }
          }
        hints:
