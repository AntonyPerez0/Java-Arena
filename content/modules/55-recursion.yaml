          A sheet of paper doubles in thickness each time it's folded in half; a strip cut in three and stacked triples. Write the method `power(int base, int exponent)`, which returns `base` multiplied by itself `exponent` times, as a `long`: `power(2, 5)` is 2 * 2 * 2 * 2 * 2, 32. Any number to the power of 0 is 1, and that's the base case. Use recursion, no loop and no `Math.pow`. The exponent is never negative. The check runs:

          ```java fragment
