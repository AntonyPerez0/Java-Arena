    more:
      - task: |
          A word game gives bonus points for palindromes, words that read the same backwards, such as `kayak` or `noon`. Write the method `isPalindrome(String word)` with recursion and no loop: a word is a palindrome if its first and last characters are the same and the part between them is a palindrome. A word of 0 or 1 characters is always a palindrome. `word.substring(1, word.length() - 1)` is the part between the ends: `isPalindrome` itself calls itself on it, not through a helper method. Don't reverse the word: compare its ends. The check runs:

          ```java fragment
          System.out.println(isPalindrome("kayak"));
          System.out.println(isPalindrome("noon"));
          System.out.println(isPalindrome("kayaks"));
          ```

          and expects:

          ```
          true
          true
          false
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(isPalindrome("kayak"));
                  System.out.println(isPalindrome("noon"));
                  System.out.println(isPalindrome("kayaks"));
              }

              // Write the method isPalindrome here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(isPalindrome("kayak"));
                  System.out.println(isPalindrome("noon"));
                  System.out.println(isPalindrome("kayaks"));
              }

              public static boolean isPalindrome(String word) {
                  if (word.length() <= 1) {
                      return true;
                  }
                  if (word.charAt(0) != word.charAt(word.length() - 1)) {
                      return false;
                  }
                  return isPalindrome(word.substring(1, word.length() - 1));
              }
          }
        hints:
          - "Two base cases: a word of at most one character is a palindrome (`true`), and a word whose first and last characters differ isn't (`false`)."
          - "If the ends are equal, the answer is the answer for the middle: `return isPalindrome(word.substring(1, word.length() - 1));`"
