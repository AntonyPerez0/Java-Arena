      - task: |
          A hiking trail is split into stages, and an array holds each stage's length in kilometers. Write the method `kilometersFrom(int[] stages, int start)`, which returns the total length of the stages from index `start` to the end of the array, with recursion and no loop: the stage at `start` plus the kilometers from `start + 1`. When `start` is the array's length, no stages are left, and the total is 0. The check runs:

          ```java fragment
          int[] stages = {12, 8, 15, 6, 9};
          System.out.println(kilometersFrom(stages, 0));
          System.out.println(kilometersFrom(stages, 3));
          ```

          and expects:

          ```
          50
          15
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  int[] stages = {12, 8, 15, 6, 9};
                  System.out.println(kilometersFrom(stages, 0));
                  System.out.println(kilometersFrom(stages, 3));
              }

              // Write the method kilometersFrom here.
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  int[] stages = {12, 8, 15, 6, 9};
                  System.out.println(kilometersFrom(stages, 0));
                  System.out.println(kilometersFrom(stages, 3));
              }

              public static int kilometersFrom(int[] stages, int start) {
                  if (start == stages.length) {
                      return 0;
                  }
                  return stages[start] + kilometersFrom(stages, start + 1);
              }
          }
