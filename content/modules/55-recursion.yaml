        solution: |
          import java.util.Arrays;

          public class Main {
              public static void main(String[] args) {
                  String[] words = {"orbit", "fig", "ash", "lantern", "elm", "pearl"};
                  System.out.println(Arrays.toString(sortByLength(words)));
              }

              public static String[] sortByLength(String[] words) {
                  if (words.length <= 1) {
                      return words;
                  }
                  int middle = words.length / 2;
                  String[] left = sortByLength(Arrays.copyOfRange(words, 0, middle));
                  String[] right = sortByLength(Arrays.copyOfRange(words, middle, words.length));
                  return mergeByLength(left, right);
              }

              public static String[] mergeByLength(String[] first, String[] second) {
                  String[] merged = new String[first.length + second.length];
                  int i = 0;
                  int j = 0;
                  int k = 0;
                  while (i < first.length && j < second.length) {
                      if (first[i].length() <= second[j].length()) {
                          merged[k] = first[i];
                          i++;
                      } else {
                          merged[k] = second[j];
                          j++;
                      }
                      k++;
                  }
                  while (i < first.length) {
                      merged[k] = first[i];
                      i++;
                      k++;
                  }
                  while (j < second.length) {
                      merged[k] = second[j];
                      j++;
                      k++;
                  }
                  return merged;
              }
          }
