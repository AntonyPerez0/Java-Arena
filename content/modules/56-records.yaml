          Gondola.java: |
            import java.util.ArrayList;

            public class Gondola {
                private int maxKilos;
                private ArrayList<Rider> riders;

                public Gondola(int maxKilos) {
                    this.maxKilos = maxKilos;
                    this.riders = new ArrayList<>();
                }

                public boolean board(Rider rider) {
                    if (this.riders.contains(rider)) {
                        return false;
                    }
                    if (this.totalKilos() + rider.kilos() > this.maxKilos) {
                        return false;
                    }
                    this.riders.add(rider);
                    return true;
                }

                public int totalKilos() {
                    int total = 0;
                    for (Rider rider : this.riders) {
                        total = total + rider.kilos();
                    }
                    return total;
                }

                public boolean leave(String name) {
                    for (Rider rider : this.riders) {
                        if (rider.name().equals(name)) {
                            this.riders.remove(rider);
                            return true;
                        }
                    }
                    return false;
                }
            }
