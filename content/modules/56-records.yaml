id: records
summary: An extra module, not part of the MOOC. Records, Java's short way to write a class that only holds values (Java 16 and later). Declaring a record and reading its components, the equals, hashCode and toString Java writes for it, records as HashMap keys and in a HashSet, compact constructors that check or tidy the values, methods and static factories in a record, and when a class is the better choice.
steps:
  - id: records-declaring
    slug: declaring-a-record
    title: Declaring a record
    text: |
      This module is an extra: the MOOC doesn't cover it. Many classes you've written only hold a few values that never change after the object is made: a place on a map, an amount of money, an entry in a timetable. For each, you wrote instance variables, a constructor, getters, a `toString`, and for HashMap keys an `equals` and a `hashCode` too. A **record**, part of Java since Java 16, declares such a class in one line, and Java writes all of those parts for you. Records are common in newer Java code, so they're worth being able to read and write.

      ### A timetable entry as a class

      A station's departure board shows, for each train, its name, where it's going and its platform. As a class in the style of the course, that's:

      ```java fragment
      public class Departure {
          private final String train;
          private final String destination;
          private final int platform;

          public Departure(String train, String destination, int platform) {
              this.train = train;
              this.destination = destination;
              this.platform = platform;
          }

          public String getTrain() {
              return this.train;
          }

          public String getDestination() {
              return this.destination;
          }

          public int getPlatform() {
              return this.platform;
          }
      }
      ```

      Twenty-odd lines, and there's still no `toString`, `equals` or `hashCode`.

      ### The same as a record

      ```java run
      public class Main {
          public static void main(String[] args) {
              Departure express = new Departure("IC 27", "Tampere", 8);
              System.out.println(express.train() + " to " + express.destination() + ", platform " + express.platform());
              System.out.println(express);
          }
      }
      // ==== Departure.java ====
      public record Departure(String train, String destination, int platform) {
      }
      ```

      ```output
      IC 27 to Tampere, platform 8
      Departure[train=IC 27, destination=Tampere, platform=8]
      ```

      The word `record` takes the place of `class`, and after the name, in parentheses, come the record's **components**: the values each Departure holds, written like a constructor's parameters. From that one line, Java makes a class with:

      - a `private final` instance variable for each component;
      - a constructor that takes the components in the same order, `new Departure("IC 27", "Tampere", 8)`, and stores them;
      - an **accessor** method for each component, named exactly like the component: `train()`, `destination()`, `platform()`. There's no `get` in front;
      - a `toString` that shows the record's name and each component with its value, in brackets: `Departure[train=IC 27, destination=Tampere, platform=8]`;
      - an `equals` and a `hashCode` that use the components (the next step).

      The braces after the header hold the record's body. It's empty here; step 4 puts methods in it. A public record goes in a file of its name, `Departure.java`, just like a public class.

      ### No getters, no setters

      The accessors are named after the components, so a getter's name doesn't compile:

      ```java error
      public class Main {
          public static void main(String[] args) {
              Departure express = new Departure("IC 27", "Tampere", 8);
              System.out.println(express.getPlatform());
          }
      }
      // ==== Departure.java ====
      public record Departure(String train, String destination, int platform) {
      }
      ```

      ```javac
      Main.java:4: error: cannot find symbol
              System.out.println(express.getPlatform());
                                        ^
        symbol:   method getPlatform()
        location: variable express of type Departure
      1 error
      ```

      There are no setters either, and the instance variables are `final`: once a record is made, its values stay as they are, like a String's characters. When a train moves to another platform, the program makes a new Departure (step 4 shows a neat way to do that).

      **Your turn:** a city map app marks places with pins, each at a column `x` and a row `y` of the map. Fill in the blanks: the word that makes `Pin` a record, its second component, the record's name after `new`, and the accessor that reads the bakery's column. The program prints:

      ```
      Bakery at 3, 5
      Library at 8, 1
      ```
    fill: |
      public class Main {
          public static void main(String[] args) {
              Pin bakery = new [[Pin]](3, 5);
              Pin library = new Pin(8, 1);
              System.out.println("Bakery at " + bakery.[[x]]() + ", " + bakery.y());
              System.out.println("Library at " + library.x() + ", " + library.y());
          }
      }
      // ==== Pin.java ====
      public [[record]] Pin(int x, int [[y]]) {
      }
    hints:
      - "A record is declared like a class, with `record` in place of `class`, and its components in parentheses after the name: `public record Pin(int x, int y)`."
      - "The accessor of the component `x` is `x()`, with no `get` in front. A record is created with `new` and its name, like any object."
    tests:
      - expect: |
          Bakery at 3, 5
          Library at 8, 1
    more:
      - task: |
          A weather service keeps temperature readings, each with the station's name and the temperature in degrees Celsius. `Reading` is a record, in `Reading.java`. In `Main.java`, write the method `report(Reading reading)`, which prints one line: the station, a colon, the temperature, the word `degrees` and a comma, and then `below freezing` when it's under 0, `at freezing` when it's exactly 0, and `above freezing` otherwise. Read the values with the record's accessors. The check runs:

          ```java fragment
          report(new Reading("Oulu", -4.5));
          report(new Reading("Turku", 0.0));
          report(new Reading("Helsinki", 3.2));
          ```

          and expects:

          ```
          Oulu: -4.5 degrees, below freezing
          Turku: 0.0 degrees, at freezing
          Helsinki: 3.2 degrees, above freezing
          ```
        seed:
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    report(new Reading("Oulu", -4.5));
                    report(new Reading("Turku", 0.0));
                    report(new Reading("Helsinki", 3.2));
                }

                public static void report(Reading reading) {

                }
            }
          Reading.java: |
            public record Reading(String station, double celsius) {
            }
        solution:
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    report(new Reading("Oulu", -4.5));
                    report(new Reading("Turku", 0.0));
                    report(new Reading("Helsinki", 3.2));
                }

                public static void report(Reading reading) {
                    String feel = "above freezing";
                    if (reading.celsius() < 0) {
                        feel = "below freezing";
                    } else if (reading.celsius() == 0) {
                        feel = "at freezing";
                    }
                    System.out.println(reading.station() + ": " + reading.celsius() + " degrees, " + feel);
                }
            }
          Reading.java: |
            public record Reading(String station, double celsius) {
            }
        hints:
