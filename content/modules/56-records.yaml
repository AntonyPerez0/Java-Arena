          Volunteers counting birds note each sighting as the bird and the numbered square of the nature reserve where it was seen. When two volunteers note the same bird in the same square, that's one sighting. In `Main.java`, write the method `withoutRepeats(ArrayList<Sighting> sightings)`, which returns a new list with each different sighting once, in the order it first came. Use a `HashSet<Sighting>` to remember which sightings you've already taken. The check runs:

          ```java fragment
          ArrayList<Sighting> notes = new ArrayList<>();
          notes.add(new Sighting("heron", 4));
          notes.add(new Sighting("crane", 4));
          notes.add(new Sighting("heron", 4));
          notes.add(new Sighting("heron", 7));
          notes.add(new Sighting("crane", 4));
          ArrayList<Sighting> unique = withoutRepeats(notes);
          System.out.println(unique);
          System.out.println(notes.size() + " notes, " + unique.size() + " sightings");
          ```

          and expects:

          ```
          [Sighting[bird=heron, square=4], Sighting[bird=crane, square=4], Sighting[bird=heron, square=7]]
          5 notes, 3 sightings
          ```
        seed:
          Main.java: |
            import java.util.ArrayList;
            import java.util.HashSet;

            public class Main {
                public static void main(String[] args) {
                    ArrayList<Sighting> notes = new ArrayList<>();
                    notes.add(new Sighting("heron", 4));
                    notes.add(new Sighting("crane", 4));
                    notes.add(new Sighting("heron", 4));
                    notes.add(new Sighting("heron", 7));
                    notes.add(new Sighting("crane", 4));
                    ArrayList<Sighting> unique = withoutRepeats(notes);
                    System.out.println(unique);
                    System.out.println(notes.size() + " notes, " + unique.size() + " sightings");
                }

                public static ArrayList<Sighting> withoutRepeats(ArrayList<Sighting> sightings) {
                    return sightings;
                }
            }
          Sighting.java: |
            public record Sighting(String bird, int square) {
            }
        solution:
          Main.java: |
            import java.util.ArrayList;
            import java.util.HashSet;

            public class Main {
                public static void main(String[] args) {
                    ArrayList<Sighting> notes = new ArrayList<>();
                    notes.add(new Sighting("heron", 4));
                    notes.add(new Sighting("crane", 4));
                    notes.add(new Sighting("heron", 4));
                    notes.add(new Sighting("heron", 7));
                    notes.add(new Sighting("crane", 4));
                    ArrayList<Sighting> unique = withoutRepeats(notes);
                    System.out.println(unique);
                    System.out.println(notes.size() + " notes, " + unique.size() + " sightings");
                }

                public static ArrayList<Sighting> withoutRepeats(ArrayList<Sighting> sightings) {
                    HashSet<Sighting> seen = new HashSet<>();
                    ArrayList<Sighting> unique = new ArrayList<>();
                    for (Sighting sighting : sightings) {
                        if (seen.add(sighting)) {
                            unique.add(sighting);
                        }
                    }
                    return unique;
                }
            }
          Sighting.java: |
            public record Sighting(String bird, int square) {
            }
        hints:
          - "Make an empty `HashSet<Sighting>` and an empty `ArrayList<Sighting>`. Go through the sightings in order; one that isn't in the set yet goes into both."
          - "`seen.add(sighting)` returns `true` only when the sighting wasn't in the set yet, so it can be the if's condition. The list keeps the order; the set only answers \"seen before?\"."
        require:
          - pattern: HashSet\s*<
            message: "Remember the sightings you've taken in a `HashSet<Sighting>`."
        tests:
          - call: |
              ArrayList<Sighting> notes = new ArrayList<>();
              notes.add(new Sighting("heron", 4));
              notes.add(new Sighting("crane", 4));
              notes.add(new Sighting("heron", 4));
              notes.add(new Sighting("heron", 7));
              notes.add(new Sighting("crane", 4));
              ArrayList<Sighting> unique = withoutRepeats(notes);
              System.out.println(unique);
              System.out.println(notes.size() + " notes, " + unique.size() + " sightings");
          - call: |
              ArrayList<Sighting> notes = new ArrayList<>();
              notes.add(new Sighting("owl", 12));
              notes.add(new Sighting("owl", 21));
              notes.add(new Sighting("Owl", 12));
              notes.add(new Sighting("owl", 12));
              notes.add(new Sighting("owl", 21));
              ArrayList<Sighting> unique = withoutRepeats(notes);
              System.out.println(unique);
              System.out.println(notes.size() + " notes, " + unique.size() + " sightings");
              System.out.println(withoutRepeats(new ArrayList<>()));
            hidden: true

  - id: records-compact-constructors
    slug: compact-constructors
    title: Checking values with a compact constructor
    text: |
      The constructor Java writes for a record stores whatever it's given. Often some values make no sense: a temperature colder than absolute zero, a percentage of 140, a name with spaces around it. A record can check and tidy its values in a constructor of its own.

      ### A compact constructor

      ```java run crash
      public class Main {
          public static void main(String[] args) {
              Reading oulu = new Reading("  Oulu ", -4.5);
              System.out.println(oulu);
              Reading wrong = new Reading("Kemi", -300.0);
              System.out.println(wrong);
          }
      }
      // ==== Reading.java ====
      public record Reading(String station, double celsius) {
          public Reading {
              if (celsius < -273.15) {
                  throw new IllegalArgumentException("colder than absolute zero: " + celsius);
              }
              station = station.trim();
          }
      }
      ```

      ```output
      Reading[station=Oulu, celsius=-4.5]
      ```

      ```crash
      Exception in thread "main" java.lang.IllegalArgumentException: colder than absolute zero: -300.0
      	at Reading.<init>(Reading.java:4)
      	at Main.main(Main.java:5)
      ```

      `public Reading { ... }` is a **compact constructor**: the record's name with no parameter list at all. Its parameters are the components, `station` and `celsius`, and Java runs the code in the braces first and then stores the parameters in the instance variables by itself. So inside it you can:

      - check a value and throw an exception (module 42) when it's wrong, so that no Reading with an impossible temperature can ever exist;
      - change a parameter before it's stored: `station = station.trim();` gives the parameter a tidied value, and that's the value the record keeps. That's why `"  Oulu "` comes out as `Oulu`.

      Note that it says `station = ...`, not `this.station = ...`. The parameter is what gets stored at the end; the instance variable itself is `final`, and only Java's own assignment after your code may set it:

      ```java error
      public class Main {
          public static void main(String[] args) {
              System.out.println(new Reading(" Oulu", -4.5));
          }
      }
      // ==== Reading.java ====
      public record Reading(String station, double celsius) {
          public Reading {
              this.station = station.trim();
          }
      }
      ```

      ```javac
      Reading.java:3: error: cannot assign a value to final variable station
              this.station = station.trim();
                  ^
      1 error
      ```

      ### The long form

      The constructor that takes all the components is the record's **canonical constructor**. The compact form is a short way to write it. Here is the same one written in full, with the parameter list repeated and every `this.x = x` assignment written out:

      ```java fragment
      public Reading(String station, double celsius) {
          if (celsius < -273.15) {
              throw new IllegalArgumentException("colder than absolute zero: " + celsius);
          }
          this.station = station.trim();
          this.celsius = celsius;
      }
      ```

      Both forms declare the same constructor, so a record can have only one of them. The compact form is what you'll usually see, since its whole point is to leave out what Java can write for you.

      A tidied value matters for equality too: since the records keep `Oulu` either way, `new Reading("  Oulu ", -4.5)` equals `new Reading("Oulu", -4.5)`.

      **Your turn:** an online chess club keeps each player's nickname and rating. Nicknames are typed in carelessly, with spaces around them and capital letters here and there, but `" Rook99 "` and `"rook99"` are the same player. In `Player.java`, give the record `Player` a compact constructor that trims the nickname and turns it into small letters (`toLowerCase()`). The check runs:

      ```java fragment
      Player typed = new Player("  Rook99 ", 1450);
      Player stored = new Player("rook99", 1450);
      System.out.println(typed);
      System.out.println(typed.equals(stored));
      System.out.println(new Player("QueenSide", 1720).nickname());
      ```

      and expects:

      ```
      Player[nickname=rook99, rating=1450]
      true
      queenside
      ```
    seed:
