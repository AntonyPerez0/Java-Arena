      }
    hints:
      - "`==` is true only for the very same object: `same` is `mine` itself, but `copy` was made with its own `new`. `equals` compares the components."
      - "The names are compared with String's `equals`, which tells small letters from capitals. A list's `contains` uses `equals` too."
