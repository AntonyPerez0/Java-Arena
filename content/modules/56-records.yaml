              TimeOfDay delayed = departure.plusMinutes(70);
              System.out.println(departure + " becomes " + delayed);
              System.out.println(delayed.toMinutes() + " " + delayed.hour());
              System.out.println(new TimeOfDay(23, 50).plusMinutes(25));
              System.out.println(TimeOfDay.midnight().plusMinutes(-15));
          - call: |
              System.out.println(TimeOfDay.midnight() + " " + TimeOfDay.fromMinutes(1440) + " " + TimeOfDay.fromMinutes(-1));
              TimeOfDay late = new TimeOfDay(22, 30);
              System.out.println(late.plusMinutes(600) + " " + late.plusMinutes(-1350) + " " + late);
              System.out.println(TimeOfDay.fromMinutes(725).equals(new TimeOfDay(12, 5)) + " " + new TimeOfDay(13, 0).toMinutes());
              System.out.println(TimeOfDay.fromMinutes(3000).minute() + " " + TimeOfDay.fromMinutes(3000).hour());
