              System.out.println(visits.get(new Cell(5, 0)) + " " + visits.get(new Cell(0, 5)) + " " + visits.get(new Cell(5, 3)));
              System.out.println(visits.getOrDefault(new Cell(5, 5), 0));
              System.out.println(countVisits(new ArrayList<>()).size());
