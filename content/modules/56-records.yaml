      - task: |
          A robot vacuum notes the cell of the floor grid it's in once a minute. `Cell` is a record with the column `x` and the row `y`. In `Main.java`, write the method `countVisits(ArrayList<Cell> path)`, which returns a `HashMap<Cell, Integer>` from each cell on the path to how many times it's there. The check runs:

          ```java fragment
          ArrayList<Cell> path = new ArrayList<>();
          path.add(new Cell(0, 0));
          path.add(new Cell(0, 1));
          path.add(new Cell(0, 0));
          path.add(new Cell(2, 1));
          path.add(new Cell(0, 0));
          HashMap<Cell, Integer> visits = countVisits(path);
          System.out.println(visits.size() + " different cells");
          System.out.println(visits.get(new Cell(0, 0)));
          System.out.println(visits.get(new Cell(2, 1)));
          System.out.println(visits.getOrDefault(new Cell(1, 0), 0));
          ```

          and expects:

          ```
          3 different cells
          3
          1
          0
          ```
        seed:
          Main.java: |
            import java.util.ArrayList;
            import java.util.HashMap;

            public class Main {
                public static void main(String[] args) {
                    ArrayList<Cell> path = new ArrayList<>();
                    path.add(new Cell(0, 0));
                    path.add(new Cell(0, 1));
                    path.add(new Cell(0, 0));
                    path.add(new Cell(2, 1));
                    path.add(new Cell(0, 0));
                    HashMap<Cell, Integer> visits = countVisits(path);
                    System.out.println(visits.size() + " different cells");
                    System.out.println(visits.get(new Cell(0, 0)));
                    System.out.println(visits.get(new Cell(2, 1)));
                    System.out.println(visits.getOrDefault(new Cell(1, 0), 0));
                }

                public static HashMap<Cell, Integer> countVisits(ArrayList<Cell> path) {
                    HashMap<Cell, Integer> visits = new HashMap<>();
                    return visits;
                }
            }
          Cell.java: |
            public record Cell(int x, int y) {
            }
        solution:
          Main.java: |
            import java.util.ArrayList;
            import java.util.HashMap;

            public class Main {
                public static void main(String[] args) {
                    ArrayList<Cell> path = new ArrayList<>();
                    path.add(new Cell(0, 0));
                    path.add(new Cell(0, 1));
                    path.add(new Cell(0, 0));
                    path.add(new Cell(2, 1));
                    path.add(new Cell(0, 0));
                    HashMap<Cell, Integer> visits = countVisits(path);
                    System.out.println(visits.size() + " different cells");
                    System.out.println(visits.get(new Cell(0, 0)));
                    System.out.println(visits.get(new Cell(2, 1)));
                    System.out.println(visits.getOrDefault(new Cell(1, 0), 0));
                }

                public static HashMap<Cell, Integer> countVisits(ArrayList<Cell> path) {
                    HashMap<Cell, Integer> visits = new HashMap<>();
                    for (Cell cell : path) {
                        visits.put(cell, visits.getOrDefault(cell, 0) + 1);
                    }
                    return visits;
                }
            }
          Cell.java: |
            public record Cell(int x, int y) {
            }
        hints:
          - "Go through the path with a for-each loop. For each cell, put it in the map with one more than it had: `visits.getOrDefault(cell, 0) + 1`."
          - "Cell is a record, so two `new Cell(0, 0)` objects are the same key: the map adds up their visits without any `equals` or `hashCode` of your own."
