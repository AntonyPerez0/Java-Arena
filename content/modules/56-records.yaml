      - task: |
          A timetable stores times of day as minutes after midnight, but shows them as hours and minutes. In `TimeOfDay.java`, add to the record `TimeOfDay(int hour, int minute)`:

          - a static factory `fromMinutes(int minutes)`, which makes the TimeOfDay that many minutes after midnight. It wraps around the day: 1440 minutes (24 hours) is midnight again, and -15 is 23:45;
          - a static factory `midnight()`, which returns 00:00;
          - `toMinutes()`, which returns how many minutes after midnight this time is;
          - `plusMinutes(int minutes)`, which returns the time that many minutes later (or earlier, for a negative number), wrapping around the day too;
          - `toString()`, which shows the time with two digits each, like `08:05`.

          The check runs:

          ```java fragment
          TimeOfDay departure = TimeOfDay.fromMinutes(485);
          TimeOfDay delayed = departure.plusMinutes(70);
          System.out.println(departure + " becomes " + delayed);
          System.out.println(delayed.toMinutes() + " " + delayed.hour());
          System.out.println(new TimeOfDay(23, 50).plusMinutes(25));
          System.out.println(TimeOfDay.midnight().plusMinutes(-15));
          ```

          and expects:

          ```
          08:05 becomes 09:15
          555 9
          00:15
          23:45
          ```
        seed:
          TimeOfDay.java: |
            public record TimeOfDay(int hour, int minute) {
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    TimeOfDay departure = TimeOfDay.fromMinutes(485);
                    TimeOfDay delayed = departure.plusMinutes(70);
                    System.out.println(departure + " becomes " + delayed);
                    System.out.println(delayed.toMinutes() + " " + delayed.hour());
                    System.out.println(new TimeOfDay(23, 50).plusMinutes(25));
                    System.out.println(TimeOfDay.midnight().plusMinutes(-15));
                }
            }
        solution:
          TimeOfDay.java: |
            public record TimeOfDay(int hour, int minute) {
                public static TimeOfDay fromMinutes(int minutes) {
                    int inDay = minutes % 1440;
                    if (inDay < 0) {
                        inDay = inDay + 1440;
                    }
                    return new TimeOfDay(inDay / 60, inDay % 60);
                }

                public static TimeOfDay midnight() {
                    return new TimeOfDay(0, 0);
                }

                public int toMinutes() {
                    return this.hour * 60 + this.minute;
                }

                public TimeOfDay plusMinutes(int minutes) {
                    return fromMinutes(this.toMinutes() + minutes);
                }

                @Override
                public String toString() {
                    String text = "";
                    if (this.hour < 10) {
                        text = "0";
                    }
                    text = text + this.hour + ":";
                    if (this.minute < 10) {
                        text = text + "0";
                    }
                    return text + this.minute;
                }
            }
          Main.java: |
            public class Main {
                public static void main(String[] args) {
                    TimeOfDay departure = TimeOfDay.fromMinutes(485);
                    TimeOfDay delayed = departure.plusMinutes(70);
                    System.out.println(departure + " becomes " + delayed);
                    System.out.println(delayed.toMinutes() + " " + delayed.hour());
                    System.out.println(new TimeOfDay(23, 50).plusMinutes(25));
                    System.out.println(TimeOfDay.midnight().plusMinutes(-15));
                }
            }
        hints:
          - "In `fromMinutes`, `minutes % 1440` wraps a time past midnight back into the day. For a negative number `%` gives a negative remainder (-15 % 1440 is -15), so add 1440 when it's below 0. Then the hour is `inDay / 60` and the minute `inDay % 60`."
          - "`toMinutes()` is `this.hour * 60 + this.minute`, and `plusMinutes` can reuse both: `return fromMinutes(this.toMinutes() + minutes);`. In `toString`, put a `\"0\"` in front of an hour or a minute under 10."
        require:
          - pattern: static\s+TimeOfDay\s+fromMinutes
            message: "`fromMinutes` should be a static method of the record: `public static TimeOfDay fromMinutes(int minutes)`."
        tests:
