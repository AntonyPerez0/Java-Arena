  - id: switch-and-text-switch-expressions
    slug: switch-expressions
    title: switch expressions and arrows
    text: |
      Since Java 14, a case can be written with an arrow, `->`, in place of the colon. An arrow case runs only what's after its arrow, and never falls through, so it needs no `break`:

      ```java main
      int button = 2;
      switch (button) {
          case 1 -> System.out.println("Chips");
          case 2 -> System.out.println("Chocolate bar");
          case 4, 5 -> System.out.println("Water");
          default -> System.out.println("No such button");
      }
      ```

      ```output
      Chocolate bar
      ```

      After an arrow comes one statement, or a block in braces for several. Several values share a case with commas, `case 4, 5 ->`. One switch uses either colons or arrows, not both.

      ### A switch that gives a value

      Most switches choose a value: the name of a snack, a price, a number of points. Since Java 14, a switch can be an **expression**, which gives a value like `a + b` does. The value of each case is what comes after its arrow:

      ```java main
      int button = 4;
      String snack = switch (button) {
          case 1 -> "Chips";
          case 2 -> "Chocolate bar";
          case 3 -> "Apple";
          case 4, 5 -> "Water";
          default -> "nothing";
      };
      System.out.println("You get: " + snack);
      ```

      ```output
      You get: Water
      ```

      - The whole `switch (...) { ... }` is the value given to `snack`, so the statement ends with a semicolon after the closing brace.
      - Every case gives a value of the same kind, here a String.
      - A switch expression can be used wherever a value can: assigned to a variable, printed, or returned, as in `return switch (button) { ... };`.

      ### Every value needs a case

      A variable must get a value, so a switch expression must have a case for every value its selector can have. For an int, that means a `default`:

      ```java error
      public class Main {
          public static void main(String[] args) {
              int button = 4;
              String snack = switch (button) {
                  case 1 -> "Chips";
                  case 2 -> "Chocolate bar";
              };
              System.out.println(snack);
          }
      }
      ```

      ```javac
      Main.java:4: error: the switch expression does not cover all possible input values
              String snack = switch (button) {
                             ^
      1 error
      ```

      A switch *statement* with arrows, like the first example of this step, has no such rule: a value without a case simply does nothing.

      ### Several statements: yield

      When a case needs a few statements to work out its value, the arrow is followed by a block, and `yield` gives the block's value. Buttons 6 to 9 are sandwiches, which cost more on the weekend:

      ```java run
      public class Main {
          public static void main(String[] args) {
              System.out.println(price(2, false));
              System.out.println(price(7, false));
              System.out.println(price(7, true));
          }

          public static int price(int button, boolean weekend) {
              return switch (button) {
                  case 1, 2, 3 -> 150;
                  case 4, 5 -> 120;
                  case 6, 7, 8, 9 -> {
                      int base = 350;
                      if (weekend) {
                          base = base + 50;
                      }
                      yield base;
                  }
                  default -> 0;
              };
          }
      }
      ```

      ```output
      150
      350
      400
      ```

      `yield base;` ends the block, and `base` becomes the value of the switch. It's `yield`, not `return`: a `return` would try to leave the whole method, and javac doesn't allow it inside a switch expression. A block that reaches its end without a `yield` doesn't compile either: javac says "switch rule completes without providing a value".

      **Your turn:** a shopping mall's directory sign shows what is on each level. The program reads a floor's number, a whole number on one line, and prints its place, with a chain of `if` and `else if`. Rewrite it so that a switch expression with arrows gives the place, and the program prints it. Keep what it prints the same: `Parking` for -1, `Lobby` for 0, `Shops` for 1, `Food court` for 2, and `Offices` for any other floor. With the input `2`, the program prints:

      ```
      Food court
      ```
    seed: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int floor = Integer.valueOf(scanner.nextLine());
              String place;
              if (floor == -1) {
                  place = "Parking";
              } else if (floor == 0) {
                  place = "Lobby";
              } else if (floor == 1) {
                  place = "Shops";
              } else if (floor == 2) {
                  place = "Food court";
              } else {
                  place = "Offices";
              }
              System.out.println(place);
          }
      }
    solution: |
      import java.util.Scanner;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int floor = Integer.valueOf(scanner.nextLine());
              String place = switch (floor) {
                  case -1 -> "Parking";
                  case 0 -> "Lobby";
                  case 1 -> "Shops";
                  case 2 -> "Food court";
                  default -> "Offices";
              };
              System.out.println(place);
          }
      }
    hints:
      - "Start with `String place = switch (floor) {` and give each floor a line such as `case 0 -> \"Lobby\";`."
      - "The `else` becomes `default -> \"Offices\";`. Remember the semicolon after the switch's closing brace: the whole switch is the value of `place`."
    require:
      - pattern: (=|return|\()\s*switch\s*\(
        message: "Get the place from a switch expression, such as `String place = switch (floor) { ... };`."
      - pattern: ->
        message: "Write the cases with arrows, such as `case 0 -> \"Lobby\";`."
    forbid:
      - pattern: \bif\s*\(
        message: "Replace the `if` chain with the switch."
    tests:
      - stdin: "2"
      - stdin: "-1"
        hidden: true
      - stdin: "0"
        hidden: true
      - stdin: "1"
        hidden: true
      - stdin: "14"
        hidden: true
      - stdin: "-2"
        hidden: true
    more:
      - task: |
          A calendar needs the number of days in each month of a year that isn't a leap year. Write the method `daysInMonth(int month)`, which returns the number of days in the month (1 is January, 12 is December) with a switch expression with arrows: 31 for months 1, 3, 5, 7, 8, 10 and 12, 30 for months 4, 6, 9 and 11, and 28 for month 2. For any other number it returns 0. Give each number of days one case, with several values per case. The check runs `System.out.println(daysInMonth(4));`, which prints:

          ```
          30
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(daysInMonth(4));
              }

              public static int daysInMonth(int month) {
                  return 0;
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(daysInMonth(4));
              }

              public static int daysInMonth(int month) {
                  return switch (month) {
                      case 1, 3, 5, 7, 8, 10, 12 -> 31;
                      case 4, 6, 9, 11 -> 30;
                      case 2 -> 28;
                      default -> 0;
                  };
              }
          }
        hints:
          - "A case can list several values with commas: `case 4, 6, 9, 11 -> 30;`."
          - "Return the switch's value straight away: `return switch (month) { ... };`, with `default -> 0;` as the last case."
        require:
          - pattern: \bswitch\s*\(\s*month\s*\)
            message: "Choose the number with `switch (month)`."
          - pattern: \bcase\s+\d+\s*,\s*\d+
            message: "List the months that have the same number of days in one case, such as `case 4, 6, 9, 11 -> 30;`."
          - pattern: ->
            message: "Write the cases with arrows."
        forbid:
          - pattern: \bif\s*\(
            message: "Use the switch instead of `if`."
        tests:
          - call: System.out.println(daysInMonth(4));
          - call: System.out.println(daysInMonth(1) + " " + daysInMonth(2) + " " + daysInMonth(3));
            hidden: true
          - call: System.out.println(daysInMonth(7) + " " + daysInMonth(8) + " " + daysInMonth(9));
            hidden: true
          - call: System.out.println(daysInMonth(11) + " " + daysInMonth(12) + " " + daysInMonth(13) + " " + daysInMonth(0));
            hidden: true
      - task: |
          A parcel service charges by zone, in cents. Write the method `postage(int zone, int grams)` with a switch expression on the zone:

          - zone 1 (the same town): 150, whatever the weight
          - zone 2 (the same country): 300, whatever the weight
          - zone 3 (abroad): 800, plus 50 for each full 100 grams over 500 grams. A parcel of 1250 grams is 750 grams over, which holds seven full hundreds, so it costs 800 + 7 * 50 = 1150.
          - any other zone: -1

          Work out zone 3's price in a block that ends with `yield`. The check runs `System.out.println(postage(3, 1250));`, which prints:

          ```
          1150
          ```
        seed: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(postage(3, 1250));
              }

              public static int postage(int zone, int grams) {
                  return 0;
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println(postage(3, 1250));
              }

              public static int postage(int zone, int grams) {
                  return switch (zone) {
                      case 1 -> 150;
                      case 2 -> 300;
                      case 3 -> {
                          int over = Math.max(0, grams - 500);
                          yield 800 + over / 100 * 50;
                      }
                      default -> -1;
                  };
              }
          }
        hints:
          - "Zone 3's case is a block: `case 3 -> { ... yield price; }`. Inside it, work out how many grams the parcel is over 500. A parcel under 500 grams is over by 0, not by a negative number: `Math.max(0, grams - 500)`."
          - "Integer division drops the rest: `750 / 100` is 7, the number of full hundreds. Then `yield 800 + over / 100 * 50;`."
        require:
          - pattern: \bswitch\s*\(\s*zone\s*\)
            message: "Choose the price with `switch (zone)`."
          - pattern: \byield\b
            message: "Work out zone 3's price in a block that ends with `yield`."
        tests:
          - call: System.out.println(postage(3, 1250));
          - call: System.out.println(postage(1, 2000) + " " + postage(2, 300));
            hidden: true
          - call: System.out.println(postage(3, 400) + " " + postage(3, 500) + " " + postage(3, 599));
            hidden: true
          - call: System.out.println(postage(3, 600) + " " + postage(3, 3000));
            hidden: true
          - call: System.out.println(postage(4, 100) + " " + postage(0, 100));
            hidden: true

  - id: switch-and-text-strings-and-enums
    slug: strings-and-enums
    title: switch on strings and enums
    text: |
      ### Strings

      Since Java 7, a switch can choose by a String. The labels are String literals, and a label matches when the String `equals` it, exactly: capitals count, and so do spaces. A radio reads commands:

      ```java main
      Scanner scanner = new Scanner(System.in);
      int volume = 5;
      while (true) {
          String command = scanner.nextLine();
          if (command.equals("off")) {
              break;
          }
          switch (command) {
              case "louder" -> volume++;
              case "quieter" -> volume--;
              case "status" -> System.out.println("Volume " + volume);
              default -> System.out.println("Unknown command: " + command);
          }
      }
      System.out.println("Radio off at volume " + volume);
      ```

      ```input
      louder
      louder
      status
      Quieter
      off
      ```

      ```output
      Volume 7
      Unknown command: Quieter
      Radio off at volume 7
      ```

      `Quieter` with a capital Q isn't `quieter`, so it goes to `default`. A program that should take both can switch on `command.toLowerCase()`.

      The check for `off` stays an `if` before the switch, and here's why: inside a switch, `break` ends the switch, not the loop around it. A `break` in a case would leave the switch and go on reading commands.

      One more thing to know: a switch on a String that is `null` throws a NullPointerException, as calling a method on it would.

      ### Enums

      A switch on an enum (module 39) uses the constants' names as labels. A cinema's tickets come in three kinds:

      ```java run
      public class Main {
          public static void main(String[] args) {
              System.out.println(price(Ticket.CHILD));
              System.out.println(price(Ticket.ADULT) + price(Ticket.SENIOR));
          }

          public static int price(Ticket ticket) {
              return switch (ticket) {
                  case CHILD -> 6;
                  case ADULT -> 12;
                  case SENIOR -> 8;
              };
          }
      }
      // ==== Ticket.java ====
      public enum Ticket {
          CHILD, ADULT, SENIOR
      }
      ```

      ```output
      6
      20
      ```

      - A label is the constant's name alone, `case CHILD`, not `case Ticket.CHILD`: the switch already knows the enum. (Since Java 21 the long name is allowed too, but the short one is the custom.)
      - This switch expression has no `default`, and it doesn't need one: an enum has only the values it lists, and the three cases cover them all, so javac knows the switch always gives a value.

      ### When the enum grows

      Leaving out `default` pays off when someone adds a constant. Say the cinema starts selling STUDENT tickets:

      ```java error
      public class Main {
          public static void main(String[] args) {
              System.out.println(price(Ticket.STUDENT));
          }

          public static int price(Ticket ticket) {
              return switch (ticket) {
                  case CHILD -> 6;
                  case ADULT -> 12;
                  case SENIOR -> 8;
              };
          }
      }
      // ==== Ticket.java ====
      public enum Ticket {
          CHILD, ADULT, SENIOR, STUDENT
      }
      ```

      ```javac
      Main.java:7: error: the switch expression does not cover all possible input values
              return switch (ticket) {
                     ^
      1 error
      ```

      javac points at every switch expression that has no case for STUDENT, and once each has one, the program is complete again. With `default -> 0;` in the switch, it would have compiled, and every student would have got in for free without anyone noticing. So for an enum, list every constant and leave `default` out.

      A switch *statement* on an enum, with arrows or with colons, may leave constants out, like a switch statement on an int.

      **Your turn:** a drinks machine is run by commands, one per line, until the line `quit`. It keeps a credit of coins, at first 0. Write the switch on the command, so that:

      - `coin` adds one coin to the credit and prints the credit, like `Credit: 2`
      - `tea` costs 2 coins: if the credit is at least 2, it takes them and prints `Here is your tea`; otherwise it prints `Tea costs 2 coins`
      - `refund` prints the coins given back, like `Returned 3 coins`, and sets the credit to 0
      - any other command prints `Unknown command: ` and the command

      The loop and the check for `quit` are written. With this input:

      ```input
      coin
      tea
      coin
