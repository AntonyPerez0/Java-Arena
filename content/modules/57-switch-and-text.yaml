      - task: |
          A snack bar prints receipts. The program reads lines, each an item, its price and a quantity separated by spaces, such as `coffee 2.80 2`, until the line `end`. For each item it prints the name left-aligned in 10 characters and the item's total (price times quantity) right-aligned in 8 characters with two decimals. Then it prints a line of 18 minus signs, and `TOTAL` with the sum of the totals in the same two columns. With this input:

          ```input
          coffee 2.80 2
          bagel 3.25 1
          juice 4.10 3
          end
          ```

          the program prints:

          ```
          coffee        5.60
          bagel         3.25
          juice        12.30
          ------------------
          TOTAL        21.15
          ```
        seed: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  var scanner = new Scanner(System.in);

              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  var scanner = new Scanner(System.in);
                  var sum = 0.0;
                  while (true) {
                      var line = scanner.nextLine();
                      if (line.equals("end")) {
                          break;
                      }
                      var parts = line.split(" ");
                      var price = Double.valueOf(parts[1]);
                      var quantity = Integer.valueOf(parts[2]);
                      var total = price * quantity;
                      sum += total;
                      System.out.println(String.format("%-10s%8.2f", parts[0], total));
                  }
                  System.out.println("------------------");
                  System.out.println(String.format("%-10s%8.2f", "TOTAL", sum));
              }
          }
        hints:
          - "Split each line with `split(\" \")`: the name, the price (`Double.valueOf`) and the quantity (`Integer.valueOf`). Keep a running sum of the totals."
          - "`String.format(\"%-10s%8.2f\", name, total)` makes one line of the receipt, and the TOTAL line uses the same format."
        require:
          - pattern: '%-10s'
            raw: true
            message: "Left-align the names with `%-10s`."
          - pattern: '%8\.2f'
            raw: true
            message: "Right-align the amounts with `%8.2f`."
        tests:
          - stdin: |
              coffee 2.80 2
              bagel 3.25 1
              juice 4.10 3
              end
          - stdin: |
