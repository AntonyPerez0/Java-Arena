      - task: |
          The chat app keeps its contacts in a list. A `ChatUser` has a nickname and a phone number, and two ChatUsers are the same person when their phone numbers are equal, whatever their nicknames. In `ChatUser.java`, write the method `equals(Object compared)` the way module 32 did, but with a pattern in place of the cast: `true` for the very same object, `false` when `compared` isn't a ChatUser (`null` included), and otherwise a comparison of the phone numbers. The class already has a `hashCode` that agrees with it. The check runs:

          ```java fragment
          ArrayList<ChatUser> contacts = new ArrayList<>();
          contacts.add(new ChatUser("Aino", "040 123 4567"));
          contacts.add(new ChatUser("Ben", "050 765 4321"));
          ChatUser newcomer = new ChatUser("Aino K.", "040 123 4567");
          System.out.println(contacts.contains(newcomer));
          System.out.println(contacts.indexOf(new ChatUser("Benny", "050 765 4321")));
          System.out.println(newcomer.equals("040 123 4567"));
          System.out.println(newcomer.equals(null));
          ```

          and expects:

          ```
          true
          1
          false
          false
          ```
