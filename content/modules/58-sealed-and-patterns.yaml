          A small calculator stores an expression such as `(2 + 3) * 4` as a tree of records. An `Expr` is a number, `Num(int value)`, or the sum or the product of two smaller expressions, `Add(Expr left, Expr right)` and `Mul(Expr left, Expr right)`. The method `show` in `Main.java` already turns an expression into text, with a switch over record patterns that calls itself for the parts. Write `eval(Expr expr)` in the same way: it returns the expression's value. Use a case with a record pattern for each of the three records, and no `default`. The check runs:

