          - "`if (!(compared instanceof ChatUser other)) { return false; }` returns for everything that isn't a ChatUser. After it, `other` is a ChatUser: `return this.phone.equals(other.phone);`."
        require:
          - pattern: public\s+boolean\s+equals\s*\(\s*Object\s+\w+\s*\)
            message: "Write `public boolean equals(Object compared)`, so that ArrayList's `contains` and `indexOf` use it."
          - pattern: instanceof\s+ChatUser\s+[A-Za-z_]\w*
            message: "Test the type with a pattern, such as `compared instanceof ChatUser other`."
        forbid:
