        solution:
          PrintQueue.java: |
            public class PrintQueue {
                private JobNode head;
                private JobNode tail;
                private int size;

                public PrintQueue() {
                    this.head = null;
                    this.tail = null;
                    this.size = 0;
                }

                public void enqueue(String document) {
                    JobNode node = new JobNode(document);
                    if (this.tail == null) {
                        this.head = node;
                    } else {
                        this.tail.next = node;
                    }
                    this.tail = node;
                    this.size++;
                }

                public String dequeue() {
                    if (this.head == null) {
                        throw new IllegalStateException("Nothing to print");
                    }
                    String document = this.head.document;
                    this.head = this.head.next;
                    if (this.head == null) {
                        this.tail = null;
                    }
                    this.size--;
                    return document;
                }

                public boolean isEmpty() {
                    return this.head == null;
                }

                public int size() {
                    return this.size;
                }
            }
