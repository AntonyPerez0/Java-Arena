      glossary.add("loop");
      glossary.add("array");
      glossary.add("method");
      glossary.add("class");
      glossary.add("variable");
      glossary.add("array");
      glossary.printShape();
      ```

      and expects:

      ```
      loop
        L: array
          R: class
        R: method
          R: variable
      ```
