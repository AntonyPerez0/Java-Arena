        public class WordTree {
            private WordNode root;

            public void add(String word) {
                this.root = add(this.root, word);
            }

            private WordNode add(WordNode node, String word) {
                if (node == null) {
                    return new WordNode(word);
                }
                int comparison = word.compareTo(node.word);
                if (comparison < 0) {
                    node.left = add(node.left, word);
                } else if (comparison > 0) {
                    node.right = add(node.right, word);
                }
                return node;
            }

            public void printShape() {
                printShape(this.root, "", "");
            }

            private void printShape(WordNode node, String indent, String label) {
                if (node == null) {
                    return;
                }
                System.out.println(indent + label + node.word);
                printShape(node.left, indent + "  ", "L: ");
                printShape(node.right, indent + "  ", "R: ");
            }
        }
