                public static boolean balanced(String formula) {
                    CharStack open = new CharStack();
                    for (int i = 0; i < formula.length(); i++) {
                        char c = formula.charAt(i);
                        if (c == '(' || c == '[' || c == '{') {
                            open.push(c);
                        } else if (c == ')' || c == ']' || c == '}') {
                            if (open.isEmpty()) {
                                return false;
                            }
                            char opening = open.pop();
                            if (c == ')' && opening != '(') {
                                return false;
                            }
                            if (c == ']' && opening != '[') {
                                return false;
                            }
                            if (c == '}' && opening != '{') {
                                return false;
                            }
                        }
                    }
                    return open.isEmpty();
                }
            }
