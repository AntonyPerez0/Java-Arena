          ReadingList.java: |
            public class ReadingList {
                private TitleNode head;
                private TitleNode tail;
                private int size;

                public ReadingList() {
                    this.head = null;
                    this.tail = null;
                    this.size = 0;
                }

                public void addFirst(String title) {
                    this.head = new TitleNode(title, this.head);
                    if (this.tail == null) {
                        this.tail = this.head;
                    }
                    this.size++;
                }

                public void addLast(String title) {
                    TitleNode node = new TitleNode(title, null);
                    if (this.tail == null) {
                        this.head = node;
                    } else {
                        this.tail.next = node;
                    }
                    this.tail = node;
                    this.size++;
                }

                public String get(int index) {
                    if (index < 0 || index >= this.size) {
                        throw new IndexOutOfBoundsException("Index " + index + " out of bounds for size " + this.size);
                    }
                    TitleNode current = this.head;
                    for (int i = 0; i < index; i++) {
                        current = current.next;
                    }
                    return current.title;
                }

                public String removeFirst() {
                    if (this.head == null) {
                        throw new IllegalStateException("The reading list is empty");
                    }
                    String title = this.head.title;
                    this.head = this.head.next;
                    if (this.head == null) {
                        this.tail = null;
                    }
                    this.size--;
                    return title;
                }

                public int size() {
                    return this.size;
                }

                @Override
                public String toString() {
                    String result = "[";
                    TitleNode current = this.head;
                    while (current != null) {
                        result += current.title;
                        if (current.next != null) {
                            result += ", ";
                        }
                        current = current.next;
                    }
                    return result + "]";
                }
            }
