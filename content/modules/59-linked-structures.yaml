          ReadingList.java: |
            public class ReadingList {
                private TitleNode head;
                private TitleNode tail;
                private int size;

                public ReadingList() {
                    this.head = null;
                    this.tail = null;
                    this.size = 0;
                }

                public void addFirst(String title) {
