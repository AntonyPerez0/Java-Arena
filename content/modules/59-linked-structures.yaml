      InTray.java: |
        public class InTray {
            private LetterNode top;
            private int size;

            public InTray() {
                this.top = null;
                this.size = 0;
            }

            public void push(String letter) {
                this.top = new LetterNode(letter, this.top);
                this.size++;
            }

            public String pop() {
                String letter = peek();
                this.top = this.top.next;
                this.size--;
                return letter;
            }

            public String peek() {
                if (this.top == null) {
                    throw new IllegalStateException("The tray is empty");
                }
                return this.top.letter;
            }

            public boolean isEmpty() {
                return this.top == null;
            }

            public int size() {
                return this.size;
            }
        }
