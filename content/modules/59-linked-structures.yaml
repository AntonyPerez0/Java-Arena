            public class Main {
                public static void main(String[] args) {
                    System.out.println(balanced("=SUM((A1+B2)*[C3])"));
                    System.out.println(balanced("=MAX(A1,{B2)}"));
                    System.out.println(balanced("=(A1+B2"));
