    why: "`Collections.sort` uses Swimmer's `compareTo`, and a negative answer means `this` comes first. Here the two values are swapped, `Integer.compare(other.seconds, this.seconds)`, so it's negative when `this` has *more* seconds: the slowest swimmer comes first. It prints `[Cy, Ana, Ben]`."

  - module: useful-techniques
    type: predict
    body: |
      String code = "[A-D]-(0|1)?[0-9]";
      System.out.println("B-7".matches(code) + " " + "C-17".matches(code) + " " + "E-4".matches(code) + " " + "A-27".matches(code));
    why: "`[A-D]` is one capital from A to D, `(0|1)?` is an optional 0 or 1, and `[0-9]` is one digit. `matches` asks whether the *whole* text has that form: `B-7` and `C-17` do, `E-4` doesn't because E isn't in `[A-D]`, and `A-27` doesn't because 2 isn't a 0 or a 1, so the 7 is left over. It prints `true true false false`."

  - module: class-diagrams
    type: choice
    prompt: "A class diagram has an arrow from the box of `Patient` to the box of `Nurse`, with a `*` at Patient's end, where the arrow starts, and a `1` at Nurse's end. Which code fits the diagram?"
    choices:
      - "`Nurse` has `private ArrayList<Patient> patients;`"
      - "`Patient` has `private ArrayList<Nurse> nurses;`"
      - "`Patient` has `private Nurse nurse;`"
      - "`Nurse` has `private Patient patient;`"
    answer: 3
    why: "The arrow starts at the class that holds the reference, Patient, and the `1` at its head means one Nurse: a plain field. The `*` at the start only says many patients can share a nurse; the Nurse doesn't know them, so it has no list."

