# The placement quiz: one question per written module, in course order. The first question
# missed shows where to start. Each question is a drill (see README.md) with a `module`.
questions:
  - module: printing
    type: predict
    body: |
      System.out.print("Hel");
      System.out.println("lo");
      System.out.println("World");
    why: "`print` stays on the line, so `Hel` and `lo` join into `Hello`; `println` then ends the line, and `World` gets its own."

  - module: reading-input
    type: predict
    stdin: Mia
    body: |
      Scanner scanner = new Scanner(System.in);
      String name = scanner.nextLine();
      System.out.println("Hi " + name + "!");
    why: "`nextLine()` reads the line typed as input, `Mia`, and `+` joins it into the greeting."

  - module: variables
    type: predict
    body: |
      int a = 3;
      int b = a;
      a = 10;
      System.out.println(a + " " + b);
    why: "`int b = a;` copies the value 3 into `b`. Changing `a` afterwards doesn't change `b`."

  - module: calculating
    type: predict
    body: |
      System.out.println(7 / 2);
      System.out.println(7 / 2.0);
    why: "Two `int`s divide as whole numbers, so `7 / 2` is 3. With a `double` in the calculation, the result keeps its decimals: 3.5."

  - module: conditionals
    type: predict
    body: |
      int temperature = 15;
      if (temperature > 20) {
          System.out.println("warm");
      } else if (temperature > 10) {
          System.out.println("mild");
      } else {
          System.out.println("cold");
      }
    why: "15 isn't above 20, so the first block is skipped; it is above 10, so the `else if` block runs, and the chain stops there."

  - module: boolean-logic
    type: choice
    prompt: Which condition is true exactly when `n` is even and positive?
    choices:
      - "`n % 2 == 0 && n > 0`"
      - "`n % 2 == 0 || n > 0`"
      - "`n / 2 == 0 && n > 0`"
      - "`n % 2 == 1 && n > 0`"
    answer: 1
    why: "A number is even when the remainder of dividing by 2 is 0, and both parts must hold, so the two are joined with `&&`. With `||`, any positive number (or any even number) would do."

