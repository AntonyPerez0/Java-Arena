  - module: text-ui
    type: predict
    classes: |
      class Score {
          private int total;

          public Score() {
              this.total = 0;
          }

          public void add(int points) {
              this.total = this.total + points;
          }

          public int getTotal() {
              return this.total;
          }
      }

      class ScoreUi {
          private Scanner scanner;
          private Score score;

          public ScoreUi(Scanner scanner, Score score) {
              this.scanner = scanner;
              this.score = score;
          }

          public void start() {
              while (true) {
                  String command = this.scanner.nextLine();
                  if (command.equals("quit")) {
                      break;
                  }
                  if (command.equals("add")) {
                      this.score.add(Integer.valueOf(this.scanner.nextLine()));
                  }
              }
          }
      }
    body: |
      Score score = new Score();
      ScoreUi ui = new ScoreUi(new Scanner("add\n5\nadd\n10\nquit\nadd\n20\n"), score);
      ui.start();
      System.out.println(score.getTotal());
    why: "The user interface reads commands until `quit`, so it adds 5 and 10 and never reads the last `add`. `score` in main and `this.score` in the UI are the same object, so main sees the total the UI built: 15."

  - module: unit-testing
    type: choice
    prompt: "`isTeen(age)` should be true for ages 13 to 19, but it was written as shown. Which JUnit test fails on it, and so catches the bug?"
    pre: |
      public static boolean isTeen(int age) {
          return age > 13 && age < 19;
      }
    choices:
      - "`assertTrue(isTeen(15));`"
      - "`assertFalse(isTeen(10));`"
      - "`assertTrue(isTeen(13));`"
      - "`assertFalse(isTeen(25));`"
    answer: 3
    why: "The mistake is at the limits, 13 and 19, where `>` and `>=` disagree. For 15, 10 and 25 the buggy method gives the right answer, so those tests pass. Only a test at a limit, such as 13, fails."

  - module: paradigms
    type: choice
    prompt: "This program keeps a game piece's square in an `int` in `main` and moves it with a static method. Which change makes it object-oriented?"
    pre: |
      public static int move(int square, int steps) {
          return Math.min(square + steps, 30);
      }
    body: |
      int square = 1;
      square = move(square, 4);
      System.out.println(square);
    choices:
      - "Moving `move` into a class `Board` and calling it as `Board.move(square, 4)`"
      - "A `Piece` class that keeps its square and has a method `move(int steps)`, used as `piece.move(4)`"
      - "Keeping the square in an `int[]` array and passing the array to `move`"
      - "Making `move` a `void` method, called as `move(square, 4)`"
    answer: 2
    why: "Object-oriented means the data and the methods that change it live together in an object. A static method in another class is still a procedure that is handed the square, and so is one that is handed an array; a `void` static method couldn't even change `main`'s `int`. A `Piece` object keeps its square itself and changes it when told to."

  - module: sorting-searching
    type: predict
    body: |
      int[] a = {7, 4, 9, 1, 3};
      for (int i = 0; i < 2; i++) {
          int low = i;
          for (int j = i + 1; j < a.length; j++) {
              if (a[j] < a[low]) {
                  low = j;
              }
          }
          int temp = a[i];
          a[i] = a[low];
          a[low] = temp;
      }
      System.out.println(Arrays.toString(a));
    why: "Two rounds of selection sort. The first swaps the smallest value, 1, to index 0: [1, 4, 9, 7, 3]. The second finds the smallest from index 1 on, the 3 at index 4, and swaps it with the 4. The rest isn't sorted yet, so it prints [1, 3, 9, 7, 4]."

  - module: larger-programs
    type: predict
    body: |
      Scanner scanner = new Scanner("log\nCleo\n3\nlog\nAda\n2\nquit\n");
      ArrayList<String> names = new ArrayList<>();
      names.add("Ada");
      while (true) {
          String command = scanner.nextLine();
          if (command.equals("quit")) {
              break;
          }
          if (command.equals("log")) {
              String name = scanner.nextLine();
              if (!names.contains(name)) {
                  System.out.println("No " + name);
                  continue;
              }
              int hours = Integer.valueOf(scanner.nextLine());
              System.out.println(name + " " + hours);
          } else {
              System.out.println("Unknown " + command);
          }
      }
    why: "The check skips the rest of the command before its hours line is read, so the next round reads `3` as a command. A command should read all of its lines before checking any of them."
