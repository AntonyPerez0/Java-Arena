      map.put(new Seat(7), "Ada");
      System.out.println(list.contains(new Seat(7)) + " " + map.containsKey(new Seat(7)));
    why: "A list's `contains` uses only `equals`, so it finds the equal seat. A HashMap looks at the hash code first, and Seat has no `hashCode` of its own: each new Seat gets Java's default one, which in practice is a different number for each object, so `containsKey` never gets as far as `equals`."

