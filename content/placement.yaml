# The placement quiz: one question per written module, in course order. The first question
# missed shows where to start. Each question is a drill (see README.md) with a `module`.
questions:
  - module: printing
    type: predict
    body: |
      System.out.print("Hel");
      System.out.println("lo");
      System.out.println("World");
    why: "`print` stays on the line, so `Hel` and `lo` join into `Hello`; `println` then ends the line, and `World` gets its own."

  - module: reading-input
    type: predict
    stdin: Mia
    body: |
      Scanner scanner = new Scanner(System.in);
      String name = scanner.nextLine();
      System.out.println("Hi " + name + "!");
    why: "`nextLine()` reads the line typed as input, `Mia`, and `+` joins it into the greeting."

  - module: variables
    type: predict
    body: |
      int a = 3;
      int b = a;
      a = 10;
      System.out.println(a + " " + b);
    why: "`int b = a;` copies the value 3 into `b`. Changing `a` afterwards doesn't change `b`."

  - module: calculating
    type: predict
    body: |
      System.out.println(7 / 2);
      System.out.println(7 / 2.0);
    why: "Two `int`s divide as whole numbers, so `7 / 2` is 3. With a `double` in the calculation, the result keeps its decimals: 3.5."

  - module: conditionals
    type: predict
    body: |
      int temperature = 15;
      if (temperature > 20) {
          System.out.println("warm");
      } else if (temperature > 10) {
          System.out.println("mild");
      } else {
          System.out.println("cold");
      }
    why: "15 isn't above 20, so the first block is skipped; it is above 10, so the `else if` block runs, and the chain stops there."

  - module: boolean-logic
    type: choice
    prompt: Which condition is true exactly when `n` is even and positive?
    choices:
      - "`n % 2 == 0 && n > 0`"
      - "`n % 2 == 0 || n > 0`"
      - "`n / 2 == 0 && n > 0`"
      - "`n % 2 == 1 && n > 0`"
    answer: 1
    why: "A number is even when the remainder of dividing by 2 is 0, and both parts must hold, so the two are joined with `&&`. With `||`, any positive number (or any even number) would do."

  - module: problem-patterns
    type: predict
    body: |
      System.out.println(Math.max(3, Math.abs(-8)));
    why: "`Math.abs(-8)` is 8, and `Math.max(3, 8)` is the larger of the two, 8."

  - module: loops
    type: predict
    body: |
      int sum = 0;
      int n = 1;
      while (true) {
          if (n > 4) {
              break;
          }
          sum += n;
          n++;
      }
      System.out.println(sum);
    why: "The loop adds 1, 2, 3 and 4 before `n` reaches 5 and `break` ends it: 1 + 2 + 3 + 4 is 10."

  - module: for-loops
    type: predict
    body: |
      for (int i = 10; i > 0; i -= 3) {
          System.out.print(i + " ");
      }
      System.out.println();
    why: "`i` starts at 10 and goes down by 3 while it's above 0: 10, 7, 4 and 1. The next value, -2, fails the condition."

  - module: methods
    type: predict
    pre: |
      public static void addOne(int x) {
          x = x + 1;
      }
    body: |
      int n = 5;
      addOne(n);
      System.out.println(n);
    why: "The method gets a copy of the value 5 in its own variable `x`. Changing `x` doesn't change `n` in `main`."

  - module: return-values
    type: predict
    pre: |
      public static int twice(int x) {
          return x * 2;
      }
    body: |
      System.out.println(twice(twice(3)) + 1);
    why: "The inner call runs first: `twice(3)` returns 6, `twice(6)` returns 12, and adding 1 gives 13."

  - module: debugging
    type: choice
    prompt: "A program stops with `ArithmeticException: / by zero`. The lines under it are `at Main.average(Main.java:14)` and then `at Main.main(Main.java:6)`. Where did the division by zero happen?"
    choices:
      - "In the method `average`, on line 14"
      - "In `main`, on line 6"
      - "On line 6 of `average`"
      - "It can't be told without seeing the code"
    answer: 1
    why: "The first `at` line is where the crash happened: `average`, line 14. The line below it says `average` was called from line 6 of `main`."

  - module: lists
    type: predict
    body: |
      ArrayList<String> letters = new ArrayList<>();
      letters.add("b");
      letters.add("a");
      letters.add("t");
      System.out.println(letters.get(1) + letters.get(letters.size() - 1) + letters.size());
    why: "Indexes start at 0, so `get(1)` is the second value, `a`, and the last index is `size() - 1`, which gives `t`. The size is 3, so it prints `at3`."

  - module: list-methods
    type: predict
    body: |
      ArrayList<Integer> scores = new ArrayList<>();
      scores.add(4);
      scores.add(3);
      scores.add(1);
      ArrayList<Integer> other = scores;
      other.remove(1);
      int sum = 0;
      for (int score : scores) {
          sum += score;
      }
      System.out.println(sum);
    why: "`other = scores` gives the same list a second name, so the removal changes `scores` too. `remove(1)` gets an `int`, so it removes index 1, the 3, which leaves `[4, 1]`: the sum is 5."

  - module: arrays
    type: predict
    body: |
      int[] counts = new int[4];
      counts[1] = 5;
      counts[3] = counts[1] + counts[2];
      System.out.println(counts[3] + " " + counts.length);
    why: "A new int array is filled with 0s, so `counts[2]` is 0 and `counts[3]` becomes 5. `length` is the size given when the array was created, 4, even though only two elements were assigned."

  - module: strings
    type: predict
    body: |
      String line = "Rosa,7,cats";
      String[] parts = line.split(",");
      System.out.println(parts[2].substring(0, 3) + parts.length);
    why: "`split` cuts at both commas, giving 3 parts, and `parts[2]` is `cats`. `substring(0, 3)` stops before index 3, giving `cat`, and the 3 is joined as text: `cat3`."

  - module: classes
    type: predict
    classes: |
      class Jar {
          private int beans;

          public Jar(int beans) {
              this.beans = beans;
          }

          public void add(int more) {
              this.beans = this.beans + more;
          }

          public void print() {
              System.out.println(this.beans);
          }
      }
    body: |
      Jar red = new Jar(10);
      Jar blue = new Jar(10);
      red.add(5);
      blue.add(1);
      red.add(2);
      blue.print();
      red.print();
    why: "Each Jar object has its own `beans`. `red` gets 5 and 2 more (17), and `blue` gets only 1 (11): a call changes just the object in front of the dot."

  - module: object-methods
    type: predict
    classes: |
      class Mug {
          private int ml;

          public Mug(int ml) {
              ml = ml;
          }

          public void fill(int ml) {
              this.ml = this.ml + ml;
          }

          public int getMl() {
              return this.ml;
          }

          public String toString() {
              return this.ml + " ml";
          }
      }
    body: |
      Mug mug = new Mug(100);
      mug.fill(50);
      System.out.println(mug.getMl() + 1);
      System.out.println(mug);
    why: "The constructor's `ml = ml;` copies the parameter into itself, so the mug starts at 0, not 100. `fill` uses `this.ml`, making it 50. The getter returns 50, plus 1 is 51, and printing the mug calls `toString`: `50 ml`."

  - module: lists-of-objects
    type: predict
    classes: |
      class Pet {
          private String name;
          private int age;

          public Pet(String name, int age) {
              this.name = name;
              this.age = age;
          }

          public String getName() {
              return this.name;
          }

          public int getAge() {
              return this.age;
          }
      }
    body: |
      ArrayList<Pet> pets = new ArrayList<>();
      pets.add(new Pet("Rex", 4));
      pets.add(new Pet("Kiwi", 11));
      pets.add(new Pet("Bo", 2));
      Pet oldest = pets.get(0);
      int young = 0;
      for (Pet pet : pets) {
          if (pet.getAge() > oldest.getAge()) {
              oldest = pet;
          }
          if (pet.getAge() < 5) {
              young++;
          }
      }
      System.out.println(oldest.getName() + " " + young);
    why: "`oldest` holds a whole Pet, and it is replaced when a pet is older, so after the loop it is Kiwi. Rex (4) and Bo (2) are under 5, so `young` is 2."

  - module: reading-files
    type: predict
    body: |
      Scanner reader = new Scanner("5\n\n7\nx\n2");
      int sum = 0;
      try {
          while (reader.hasNextLine()) {
              String line = reader.nextLine();
              if (line.isEmpty()) {
                  continue;
              }
              sum += Integer.valueOf(line);
          }
          System.out.println("Sum " + sum);
      } catch (Exception e) {
          System.out.println("Error after " + sum);
      }
    why: "The empty line is skipped, so 5 and 7 are added. `Integer.valueOf(\"x\")` then throws, the rest of the `try` block (the 2 and the `Sum` line) is skipped, and the `catch` block prints `Error after 12`."
