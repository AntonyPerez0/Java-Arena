  - module: object-methods
    type: predict
    classes: |
      class Mug {
          private int ml;

          public Mug(int ml) {
              ml = ml;
          }

          public void fill(int ml) {
              this.ml = this.ml + ml;
          }

          public int getMl() {
              return this.ml;
          }

          public String toString() {
              return this.ml + " ml";
          }
      }
    body: |
      Mug mug = new Mug(100);
      mug.fill(50);
      System.out.println(mug.getMl() + 1);
      System.out.println(mug);
    why: "The constructor's `ml = ml;` copies the parameter into itself, so the mug starts at 0, not 100. `fill` uses `this.ml`, making it 50. The getter returns 50, plus 1 is 51, and printing the mug calls `toString`: `50 ml`."

  - module: lists-of-objects
    type: predict
    classes: |
      class Pet {
          private String name;
          private int age;

          public Pet(String name, int age) {
              this.name = name;
              this.age = age;
          }

          public String getName() {
              return this.name;
          }

          public int getAge() {
              return this.age;
          }
      }
    body: |
      ArrayList<Pet> pets = new ArrayList<>();
      pets.add(new Pet("Rex", 4));
      pets.add(new Pet("Kiwi", 11));
      pets.add(new Pet("Bo", 2));
      Pet oldest = pets.get(0);
      int young = 0;
      for (Pet pet : pets) {
          if (pet.getAge() > oldest.getAge()) {
              oldest = pet;
          }
          if (pet.getAge() < 5) {
              young++;
          }
      }
      System.out.println(oldest.getName() + " " + young);
    why: "`oldest` holds a whole Pet, and it is replaced when a pet is older, so after the loop it is Kiwi. Rex (4) and Bo (2) are under 5, so `young` is 2."

  - module: reading-files
    type: predict
    body: |
      Scanner reader = new Scanner("5\n\n7\nx\n2");
      int sum = 0;
      try {
          while (reader.hasNextLine()) {
              String line = reader.nextLine();
              if (line.isEmpty()) {
                  continue;
              }
              sum += Integer.valueOf(line);
          }
          System.out.println("Sum " + sum);
      } catch (Exception e) {
          System.out.println("Error after " + sum);
      }
    why: "The empty line is skipped, so 5 and 7 are added. `Integer.valueOf(\"x\")` then throws, the rest of the `try` block (the 2 and the `Sum` line) is skipped, and the `catch` block prints `Error after 12`."

  - module: class-design
    type: predict
    classes: |
      class Flask {
          private String drink;
          private int ml;

          public Flask(String drink, int ml) {
              this.drink = drink;
              this.ml = ml;
          }

          public Flask(String drink) {
              this(drink, 250);
          }

          public Flask(int ml) {
              this("water", ml);
          }

          public String toString() {
              return this.ml + " ml of " + this.drink;
          }
      }
    body: |
      System.out.println(new Flask("tea"));
      System.out.println(new Flask(400));
    why: "`new` picks the constructor by the type of the value: a String runs `Flask(String drink)`, an int runs `Flask(int ml)`. Each hands the work to `Flask(String drink, int ml)` with `this(...)`, filling in the missing value: 250 ml for the tea, and water for the 400 ml."

  - module: references
    type: predict
    classes: |
      class Box {
          private int count;

          public Box(int count) {
              this.count = count;
          }

          public void add(int more) {
              this.count = this.count + more;
          }

          public int getCount() {
              return this.count;
          }
      }
    body: |
      int n = 5;
      int m = n;
      m = m + 1;
      Box a = new Box(5);
      Box b = a;
      b.add(1);
      System.out.println(n + " " + a.getCount());
    why: "`int m = n;` copies the value, so changing `m` leaves `n` at 5. `Box b = a;` copies the reference, so `a` and `b` point at the same Box, and `b.add(1)` shows through `a`: 6."

  - module: object-interaction
    type: predict
    classes: |
      class Seat {
          private String row;
          private int number;

          public Seat(String row, int number) {
              this.row = row;
              this.number = number;
          }

          public boolean equals(Object compared) {
              if (this == compared) {
                  return true;
              }
              if (!(compared instanceof Seat)) {
                  return false;
              }
              Seat other = (Seat) compared;
              return this.row.equals(other.row) && this.number == other.number;
          }
      }
    body: |
      Seat a = new Seat("B", 7);
      Seat b = new Seat("B", 7);
      ArrayList<Seat> booked = new ArrayList<>();
      booked.add(a);
      System.out.println((a == b) + " " + a.equals(b) + " " + booked.contains(b));
    why: "`a` and `b` are two objects, so `==` is false. Seat's own `equals` compares the row and the number, so they're equal, and `contains` uses `equals`, so it finds the seat equal to `b`: `false true true`."

  - module: objects-with-lists
    type: predict
