  - module: paradigms
    type: choice
    prompt: "This program keeps a game piece's square in an `int` in `main` and moves it with a static method. Which change makes it object-oriented?"
    pre: |
      public static int move(int square, int steps) {
          return Math.min(square + steps, 30);
      }
    body: |
      int square = 1;
      square = move(square, 4);
      System.out.println(square);
    choices:
      - "Moving `move` into a class `Board` and calling it as `Board.move(square, 4)`"
      - "A `Piece` class that keeps its square and has a method `move(int steps)`, used as `piece.move(4)`"
      - "Keeping the square in an `int[]` array and passing the array to `move`"
      - "Making `move` a `void` method, called as `move(square, 4)`"
    answer: 2
    why: "Object-oriented means the data and the methods that change it live together in an object. A static method in another class is still a procedure that is handed the square, and so is one that is handed an array; a `void` static method couldn't even change `main`'s `int`. A `Piece` object keeps its square itself and changes it when told to."

  - module: sorting-searching
    type: predict
    body: |
      int[] a = {7, 4, 9, 1, 3};
      for (int i = 0; i < 2; i++) {
          int low = i;
          for (int j = i + 1; j < a.length; j++) {
              if (a[j] < a[low]) {
                  low = j;
              }
          }
          int temp = a[i];
          a[i] = a[low];
          a[low] = temp;
      }
      System.out.println(Arrays.toString(a));
    why: "Two rounds of selection sort. The first swaps the smallest value, 1, to index 0: [1, 4, 9, 7, 3]. The second finds the smallest from index 1 on, the 3 at index 4, and swaps it with the 4. The rest isn't sorted yet, so it prints [1, 3, 9, 7, 4]."

