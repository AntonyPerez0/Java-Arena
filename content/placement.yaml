  - module: exceptions
    type: predict
    pre: |
      public static int dial(String text) {
          int degrees = Integer.parseInt(text);
          if (degrees < 50 || degrees > 250) {
              throw new IllegalArgumentException("No oven setting for " + degrees + " degrees");
          }
          return degrees;
      }
    body: |
      String[] settings = {"180", "hot", "300"};
      for (String setting : settings) {
          try {
              System.out.print(dial(setting));
          } catch (IllegalArgumentException e) {
              System.out.print("refused");
          } finally {
              System.out.print(", ");
          }
      }
      System.out.println("done");
    why: "`parseInt(\"hot\")` throws a NumberFormatException, and a NumberFormatException is an IllegalArgumentException, so the `catch` block catches it just as it catches the one `dial` throws for 300. The `finally` block prints the comma after every setting, thrown or not, and the loop carries on to `done`."

  - module: writing-files
    type: predict
    body: |
      try {
          java.io.PrintWriter writer = new java.io.PrintWriter("log.txt");
          writer.println("zero");
          writer.close();
          writer = new java.io.PrintWriter("log.txt");
          writer.println("one");
          writer.close();
          writer = new java.io.PrintWriter(new java.io.FileWriter("log.txt", true));
          writer.print("two");
          writer.println("three");
          writer.close();
          System.out.println(java.nio.file.Files.readAllLines(java.nio.file.Paths.get("log.txt")));
      } catch (Exception e) {
          System.out.println("Error");
      }
    why: "A new PrintWriter empties the file, so `zero` is gone before `one` is written. A FileWriter with `true` appends after `one`, and `print` doesn't end the line, so `two` and `three` make one line: `[one, twothree]`."
