  - module: recap
    type: predict
    classes: |
      class Plank {
          private String wood;
          private int length;

          public Plank(String wood, int length) {
              this.wood = wood;
              this.length = length;
          }

          public void cut(int piece) {
              this.length -= piece;
          }

          public boolean equals(Object compared) {
              if (this == compared) {
                  return true;
              }
              if (!(compared instanceof Plank)) {
                  return false;
              }
              Plank other = (Plank) compared;
              return this.wood.equals(other.wood) && this.length == other.length;
          }
      }
    body: |
      ArrayList<Plank> rack = new ArrayList<>();
      rack.add(new Plank("oak", 100));
      Plank piece = rack.get(0);
      piece.cut(40);
      System.out.println(rack.contains(new Plank("oak", 100)) + " " + rack.contains(new Plank("oak", 60)) + " " + (piece == rack.get(0)));
    why: "`get` gives the plank in the list itself, not a copy, so cutting `piece` cuts the plank in the rack: it's now 60 cm. `contains` compares with `equals`, which looks at the wood and the length, so a new oak plank of 100 cm isn't found, while a new one of 60 cm is, although it's another object. `piece == rack.get(0)` is true: both are the same object."

