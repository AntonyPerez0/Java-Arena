  - module: equals-hashcode
    type: predict
    classes: |
      class Seat {
          private int number;

          public Seat(int number) {
              this.number = number;
          }

          public boolean equals(Object compared) {
              if (!(compared instanceof Seat)) {
                  return false;
              }
              Seat other = (Seat) compared;
