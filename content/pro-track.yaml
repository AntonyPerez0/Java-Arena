# The Pro Track (/pro/): projects for the learner's own computer, with a JDK 21, Maven and JUnit 5.
# Each project is a folder pro-track/<id>/ (its model solution in pro-track-solutions/<id>/); this
# file lists them in the order the site shows them, with what the site needs besides the project's
# README.md (its title, summary and sections come from there). pro-track/README.md, "For
# contributors", says what each key means.
projects:
  - id: word-stats
    hours: 3 to 5
    practices:
      - module: reading-files
        what: reading text files line by line
      - module: hash-maps
        what: counting words with a HashMap
      - module: sorting-objects
        what: sorting with a comparator
      - module: exceptions
        what: throwing and catching exceptions
      - module: unit-testing
        what: unit tests, now with JUnit 5
    checklist:
      - id: setup
        text: "`mvn test` runs, and the tests fail"
      - id: split-words
        text: Step 1, splitting words, passes `WordsTest`
      - id: count
        text: Step 2, counting, passes `TextStatsTest`
      - id: most-frequent
        text: Step 3, the most frequent words, passes `MostFrequentTest`
      - id: read-files
        text: Step 4, reading a file, passes `TextFilesTest`
      - id: command-line
        text: Step 5, the command line, passes `CommandLineTest`
      - id: whole-program
        text: Step 6, the whole program, passes `WordStatsTest`
      - id: run-it
        text: I ran the program on my own text files
      - id: github
        text: The tests pass in my GitHub repository's Actions tab
  - id: h2-database
    hours: 3 to 5
    practices:
      - module: libraries-and-tools
        what: a DAO over a real H2 database with JDBC
      - module: exceptions
        what: try-with-resources, and turning checked exceptions into unchecked ones
      - module: interfaces
        what: writing a class to an interface
      - module: hash-maps
        what: building a map from query results
      - module: unit-testing
        what: running JUnit 5 tests and reading their failures (each test gets a fresh database in memory)
    checklist:
      - id: setup
        text: "`mvn test` runs, and the tests fail"
      - id: schema
        text: Step 1, creating the table, passes `SchemaTest`
      - id: add-find
        text: Step 2, add and findById, passes `AddAndFindTest`
      - id: list-search
        text: Step 3, list and search, passes `ListAndSearchTest`
      - id: update-remove
        text: Step 4, update and remove, passes `UpdateAndRemoveTest`
      - id: totals
        text: Step 5, the totals, passes `TotalsTest`
      - id: run-it
        text: I ran the program, quit, and found my yarn still there the next time
      - id: github
        text: The tests pass in my GitHub repository's Actions tab
  - id: javafx-game
    hours: 3 to 5
    practices:
      - module: gui-views
        what: a JavaFX window over a class that holds the rules
      - module: gui-events
        what: buttons and their event handlers
      - module: randomness
        what: shuffling with a seeded Random, so tests can check it
      - module: useful-techniques
        what: an enum for what a move did
      - module: unit-testing
        what: unit tests, now with JUnit 5 and without a window
    checklist:
      - id: setup
        text: "`mvn test` runs, and the tests fail"
      - id: deck
        text: Step 1, shuffling the cards, passes `DeckTest`
      - id: new-game
        text: Step 2, a new game, passes `NewGameTest`
      - id: flip-match
        text: Step 3, flipping and matching, passes `FlipTest`
      - id: mismatch
        text: Step 4, cards that don't match, passes `MismatchTest`
      - id: win
        text: Step 5, winning, passes `EndOfGameTest`
      - id: status-line
        text: Step 6, the status line, passes `StatusLineTest`
      - id: window
        text: Step 7, I played a whole game in the window with `mvn javafx:run`
      - id: github
        text: The tests pass in my GitHub repository's Actions tab
