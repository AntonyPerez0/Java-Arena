        import java.util.HashMap;
        import java.util.List;

        public class Calculator {
            private HashMap<String, Double> variables;

            public Calculator() {
                this.variables = new HashMap<>();
            }

            public String calculate(String line) {
                List<Token> tokens = Lexer.tokenize(line);
                if (tokens.size() >= 2 && tokens.get(0) instanceof NameToken name && tokens.get(1) instanceof SymbolToken equals && equals.symbol() == '=') {
                    double value = eval(new Parser(tokens.subList(2, tokens.size())).parse());
                    this.variables.put(name.name(), value);
                    return name.name() + " = " + format(value);
                }
                Expr expr = new Parser(tokens).parse();
                return format(eval(expr));
            }

            private double eval(Expr expr) {
                return switch (expr) {
                    case Literal(double value) -> value;
                    case Variable(String name) -> valueOf(name);
                    case Negate(Expr inner) -> -eval(inner);
                    case Operation(char operator, Expr left, Expr right) -> apply(operator, eval(left), eval(right));
                };
            }

            private double valueOf(String name) {
                if (!this.variables.containsKey(name)) {
                    throw new IllegalArgumentException("unknown variable " + name);
                }
                return this.variables.get(name);
            }

            private double apply(char operator, double left, double right) {
                return switch (operator) {
                    case '+' -> left + right;
                    case '-' -> left - right;
                    case '*' -> left * right;
                    default -> left / right;
                };
            }

            // 15 becomes "15", 3.5 stays "3.5"
            public static String format(double value) {
                if (value == Math.floor(value) && Math.abs(value) < 1e15) {
                    return String.valueOf((long) value);
                }
                return String.valueOf(value);
            }
        }
