        import java.util.ArrayList;
        import java.util.List;

        public class Lexer {
            public static List<Token> tokenize(String line) {
                List<Token> tokens = new ArrayList<>();
                int i = 0;
                while (i < line.length()) {
                    char c = line.charAt(i);
                    if (c == ' ') {
                        i++;
                    } else if (Character.isDigit(c) || c == '.') {
                        int start = i;
                        while (i < line.length() && (Character.isDigit(line.charAt(i)) || line.charAt(i) == '.')) {
                            i++;
                        }
                        String text = line.substring(start, i);
                        try {
                            tokens.add(new NumberToken(Double.parseDouble(text), start + 1));
                        } catch (NumberFormatException e) {
                            throw new CalcException("bad number " + text + " at column " + (start + 1));
                        }
                    } else if (Character.isLetter(c)) {
                        int start = i;
                        while (i < line.length() && Character.isLetterOrDigit(line.charAt(i))) {
                            i++;
                        }
                        tokens.add(new NameToken(line.substring(start, i), start + 1));
                    } else if ("+-*/()=".indexOf(c) >= 0) {
                        tokens.add(new SymbolToken(c, i + 1));
                        i++;
                    } else {
                        throw new CalcException("unexpected character " + c + " at column " + (i + 1));
                    }
                }
                return tokens;
            }
        }
