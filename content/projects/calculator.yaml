milestones:
  - id: tokens
    title: "Tokens"
    task: |
      A calculator can't work with `12 + 3.5` as one piece of text. Its first job is to split the line into **tokens**: the numbers and the symbols. Each token also keeps its **column**, the place in the line where it starts, counted from 1, so that error messages can point at it in the last milestone.

      The token types are ready. `Token.java` is a sealed interface, and `NumberToken.java` and `SymbolToken.java` are its two records. In `Lexer.java`, write `tokenize(String line)`. It goes through the line one character at a time and returns the tokens in a list, in order:

      - A space is skipped.
      - A digit or a `.` starts a number, which goes on as long as digits and dots follow. `Double.parseDouble` turns the number's text into a double, and it becomes a `NumberToken` with the column of its first character.
      - `+`, `-`, `*` and `/` each become a `SymbolToken`.
      - For any other character, throw an `IllegalArgumentException`. The last milestone gives it a proper message.

      `Character.isDigit(c)` is true when the character `c` is a digit, such as 0 to 9. `main` is ready: it prints the tokens of each line it reads. The check runs:

      ```java fragment
      System.out.println(Lexer.tokenize("12 + 3.5"));
      ```

      and expects this (a record's `toString` shows the values of its parts):

      ```
      [NumberToken[value=12.0, column=1], SymbolToken[symbol=+, column=4], NumberToken[value=3.5, column=6]]
      ```
    hints:
      - "Use an index `i` and a `while (i < line.length())` loop rather than a for loop: a number takes several characters, so each step moves `i` on by as many characters as it used."
      - "For a number: remember `int start = i;`, move `i` on while it points at a digit or a dot (check `i < line.length()` first), and then `line.substring(start, i)` is the number's text. Its column is `start + 1`."
      - "`\"+-*/\".indexOf(c) >= 0` is true when `c` is one of the four symbols."
    require:
      - pattern: "\\bnew\\s+NumberToken\\s*\\("
        message: "Put each number in the list as a `new NumberToken(value, column)`."
      - pattern: "\\bnew\\s+SymbolToken\\s*\\("
        message: "Put each symbol in the list as a `new SymbolToken(symbol, column)`."
    tests:
      - name: "Tokens of a sum"
        call: |
          System.out.println(Lexer.tokenize("12 + 3.5"));
      - name: "Tokens without spaces"
        call: |
          System.out.println(Lexer.tokenize("7*8/2-1"));
      - name: "Extra spaces, decimals and an empty line"
        call: |
          System.out.println(Lexer.tokenize("  100 /  4 "));
          System.out.println(Lexer.tokenize("0.25-.5"));
          System.out.println(Lexer.tokenize(""));
        hidden: true
    solution:
      Main.java: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner scanner = new Scanner(System.in);
                while (scanner.hasNextLine()) {
                    String line = scanner.nextLine();
                    System.out.println(Lexer.tokenize(line));
                }
            }
        }
      Lexer.java: |
        import java.util.ArrayList;
        import java.util.List;

        public class Lexer {
            public static List<Token> tokenize(String line) {
                List<Token> tokens = new ArrayList<>();
                int i = 0;
                while (i < line.length()) {
                    char c = line.charAt(i);
                    if (c == ' ') {
                        i++;
                    } else if (Character.isDigit(c) || c == '.') {
                        int start = i;
                        while (i < line.length() && (Character.isDigit(line.charAt(i)) || line.charAt(i) == '.')) {
                            i++;
                        }
                        double value = Double.parseDouble(line.substring(start, i));
                        tokens.add(new NumberToken(value, start + 1));
                    } else if ("+-*/".indexOf(c) >= 0) {
                        tokens.add(new SymbolToken(c, i + 1));
                        i++;
                    } else {
                        throw new IllegalArgumentException("unexpected character " + c);
                    }
                }
                return tokens;
            }
        }
      Token.java: |
        public sealed interface Token permits NumberToken, SymbolToken {
        }
      NumberToken.java: |
        public record NumberToken(double value, int column) implements Token {
        }
      SymbolToken.java: |
        public record SymbolToken(char symbol, int column) implements Token {
        }
  - id: left-to-right
    title: "Left to right"
    task: |
      Now the calculator calculates. `Calculator.java` is new. Its `format` is ready: it turns a result into text without `.0` on whole numbers, so 15.0 becomes `15` and 3.5 stays `3.5`.

      1. In `Calculator.java`, write a method `apply(char operator, double left, double right)` with a switch expression: it returns `left + right` for `'+'`, `left - right` for `'-'`, and so on for `*` and `/`.
      2. Write `calculate(String line)`. It splits the line into tokens and works through them **from left to right**: the first number, then an operator and a number, again and again, using `apply` each time. It returns the result as text, made by `format`. For now, `2 + 3 * 4` gives 20, as (2 + 3) * 4 is. The next milestone teaches the calculator that multiplication comes first.
      3. Change `main`: it creates one `Calculator`, and prints what `calculate` returns for each line it reads. It skips blank lines: `line.trim().isEmpty()` is true for a line with nothing but spaces.

      You may assume for now that every line is a correct calculation of numbers and the four operators. With the input:

      ```text
      12 + 3.5
      10 - 4 - 3
      7 / 2
      2 * 3 * 4
      ```

      the program prints:

      ```
      15.5
      3
      3.5
      24
      ```
    files:
      Calculator.java: |
        import java.util.List;

        public class Calculator {

            public String calculate(String line) {
                List<Token> tokens = Lexer.tokenize(line);
                return "";
            }

            // 15 becomes "15", 3.5 stays "3.5"
            public static String format(double value) {
                if (value == Math.floor(value) && Math.abs(value) < 1e15) {
                    return String.valueOf((long) value);
                }
                return String.valueOf(value);
            }
        }
