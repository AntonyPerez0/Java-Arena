      Parser.java: |
        import java.util.List;

        public class Parser {
            private List<Token> tokens;
            private int next;

            public Parser(List<Token> tokens) {
                this.tokens = tokens;
                this.next = 0;
            }

            public Expr parse() {
                Expr result = expression();
                if (this.next < this.tokens.size()) {
                    throw new CalcException("expected an operator " + where());
                }
                return result;
            }

            // terms joined by + and -
            private Expr expression() {
                Expr result = term();
                while (nextSymbol() == '+' || nextSymbol() == '-') {
                    char operator = nextSymbol();
                    this.next++;
                    result = new Operation(operator, result, term());
                }
                return result;
            }

            // factors joined by * and /
            private Expr term() {
                Expr result = factor();
                while (nextSymbol() == '*' || nextSymbol() == '/') {
                    char operator = nextSymbol();
                    this.next++;
                    result = new Operation(operator, result, factor());
                }
                return result;
            }

            // a number, a name, an expression in parentheses, or a factor with a minus in front
            private Expr factor() {
                if (nextSymbol() == '(') {
                    this.next++;
                    Expr inside = expression();
                    if (nextSymbol() != ')') {
                        throw new CalcException("expected ) " + where());
                    }
                    this.next++;
                    return inside;
                }
                if (nextSymbol() == '-') {
                    this.next++;
                    return new Negate(factor());
                }
                if (this.next < this.tokens.size() && this.tokens.get(this.next) instanceof NumberToken number) {
                    this.next++;
                    return new Literal(number.value());
                }
                if (this.next < this.tokens.size() && this.tokens.get(this.next) instanceof NameToken name) {
                    this.next++;
                    return new Variable(name.name());
                }
                throw new CalcException("expected a number " + where());
            }

            // the symbol of the next token, or a space when the next token isn't a symbol
            private char nextSymbol() {
                if (this.next < this.tokens.size() && this.tokens.get(this.next) instanceof SymbolToken token) {
                    return token.symbol();
                }
                return ' ';
            }

            // where the next token is, for an error message
            private String where() {
                if (this.next < this.tokens.size()) {
                    return "at column " + this.tokens.get(this.next).column();
                }
                return "at the end";
