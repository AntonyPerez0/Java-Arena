      - "A token is a NumberToken or a SymbolToken. `if (tokens.get(i) instanceof NumberToken number)` checks which and gives you `number.value()` in the same step."
      - "A switch expression on a char: `return switch (operator) { case '+' -> left + right; ... default -> left / right; };`"
