      Calculator.java: |
        public class Calculator {

            public String calculate(String line) {
                Expr expr = new Parser(Lexer.tokenize(line)).parse();
                return format(eval(expr));
            }

            private double eval(Expr expr) {
                return switch (expr) {
                    case Literal(double value) -> value;
                    case Operation(char operator, Expr left, Expr right) -> apply(operator, eval(left), eval(right));
                };
            }

            private double apply(char operator, double left, double right) {
                return switch (operator) {
                    case '+' -> left + right;
                    case '-' -> left - right;
                    case '*' -> left * right;
                    default -> left / right;
                };
            }

            // 15 becomes "15", 3.5 stays "3.5"
            public static String format(double value) {
                if (value == Math.floor(value) && Math.abs(value) < 1e15) {
                    return String.valueOf((long) value);
                }
                return String.valueOf(value);
            }
        }
      Expr.java: |
        public sealed interface Expr permits Literal, Operation {
        }
      Literal.java: |
        public record Literal(double value) implements Expr {
        }
      Operation.java: |
        public record Operation(char operator, Expr left, Expr right) implements Expr {
        }
      Parser.java: |
        import java.util.List;

        public class Parser {
            private List<Token> tokens;
            private int next;

            public Parser(List<Token> tokens) {
                this.tokens = tokens;
                this.next = 0;
            }

            public Expr parse() {
                return expression();
            }

            // terms joined by + and -
            private Expr expression() {
                Expr result = term();
                while (nextSymbol() == '+' || nextSymbol() == '-') {
                    char operator = nextSymbol();
                    this.next++;
                    result = new Operation(operator, result, term());
                }
                return result;
            }

            // numbers joined by * and /
            private Expr term() {
                Expr result = number();
                while (nextSymbol() == '*' || nextSymbol() == '/') {
                    char operator = nextSymbol();
                    this.next++;
                    result = new Operation(operator, result, number());
                }
                return result;
            }

            private Expr number() {
                if (this.next < this.tokens.size() && this.tokens.get(this.next) instanceof NumberToken number) {
                    this.next++;
                    return new Literal(number.value());
                }
                throw new IllegalArgumentException("expected a number");
            }

            // the symbol of the next token, or a space when the next token isn't a symbol
            private char nextSymbol() {
                if (this.next < this.tokens.size() && this.tokens.get(this.next) instanceof SymbolToken token) {
                    return token.symbol();
                }
                return ' ';
            }
        }
  - id: parentheses
    title: "Parentheses and minus signs"
    task: |
      Parentheses say what is calculated first: `(2 + 3) * 4` is 20. And a minus sign can stand in front of a number or a parenthesis: `-5`, `2 - -3`, `-(2 + 3)`.

      - In `Lexer.java`, `(` and `)` become SymbolTokens too.
      - `Negate.java` is new: the record `Negate(Expr inner)` is a part of the tree with a minus in front. The program doesn't compile when this milestone starts: javac says that Negate isn't allowed to implement Expr. Add it to Expr's `permits` list. Then javac says that the switch in `eval` doesn't cover all possible input values: give it a case for Negate, whose value is minus the value of `inner`.
      - In `Parser.java`, rename `number()` to `factor()` (term() calls it), and teach it two more things before it looks for a number:
        - `(`: step past it, read a whole `expression()`, and then a `)` must come: step past that too. The expression inside is the factor's tree. If the `)` is missing, throw an IllegalArgumentException for now.
        - `-`: step past it and return `new Negate(factor())`, the factor after it with a minus in front.

      The parser now calls itself in a circle: `expression()` calls `term()`, `term()` calls `factor()`, and `factor()` calls `expression()` for the part in parentheses. That's recursion, as in module 55, and a number is its base case.

      With the input:

      ```text
      (2 + 3) * 4
      2 * (10 - (3 + 1))
      (1 + 2) / (4 - 1.5)
      ```

      the program prints:

      ```
      20
      12
      1.2
      ```
    files:
      Negate.java: |
        public record Negate(Expr inner) implements Expr {
        }
    hints:
      - "For `(`: `if (nextSymbol() == '(') { this.next++; Expr inside = expression(); ... }`. After the expression, `nextSymbol()` must be `')'`: step past it with `this.next++` and `return inside;`."
      - "The minus in front: `if (nextSymbol() == '-') { this.next++; return new Negate(factor()); }`. Calling `factor()` again lets `- -3` and `-(2 + 3)` work too."
      - "In eval: `case Negate(Expr inner) -> -eval(inner);`"
    require:
      - pattern: "\\bcase\\s+Negate\\s*\\("
        message: "Give eval a case with a record pattern for Negate: `case Negate(Expr inner) -> ...`."
      - pattern: "\\bnew\\s+Negate\\s*\\("
        message: "In the parser, a minus in front of a factor becomes a `new Negate(...)`."
    tests:
      - name: "Parentheses first"
        stdin: |
          (2 + 3) * 4
          2 * (10 - (3 + 1))
          (1 + 2) / (4 - 1.5)
      - name: "Minus signs"
        stdin: |
          -5 + 2
          2 - -3
          -(2 + 3) * 2
          6 / -4
      - name: "The tree of -(1 + 2)"
        call: |
          System.out.println(new Parser(Lexer.tokenize("-(1 + 2)")).parse());
      - name: "Deep parentheses"
        stdin: |
          ((7))
          -(-(4)) * (2 + 1) / 3
          ((1 + 1) * (2 + 2)) - -0.5
          (10)/(4)
