id: calculator
title: A calculator
after: sealed-and-patterns
summary: "A calculator you type into, line by line. Split the text into tokens, build a tree of records that knows times comes before plus, add parentheses, minus signs and variables, and answer bad input with a message that says what's wrong and where."
intro: |
  A calculator that reads what you type, such as `rate * (hours - 0.5)`, has a harder job than it looks. The line is only text: the program has to find the numbers and symbols in it, know that `*` comes before `-` unless parentheses say otherwise, remember names, and say clearly what's wrong when the text isn't a calculation. In this project you build that calculator, one line at a time.

  When it's finished, a session looks like this. The calculator reads these lines:

  ```text
  rate = 12.5
  hours = 8
  pay = rate * (hours - 0.5)
  pay / 3
  -(2 + 3) * 4
  pay / (hours - 8)
  2 + * 3
  ```

  and answers each one:

  ```text
  rate = 12.5
  hours = 8
  pay = 93.75
  31.25
  -20
  Error: division by zero
  Error: expected a number at column 5
  ```

  A line with `=` saves a value under a name. Every other line is calculated and its value printed. A mistake doesn't stop the program: it gets a message, and the next line is read as usual.

  ### How it works

  The calculator works in three stages. The first two are how javac reads your code too:

  1. The **lexer** splits the text into **tokens**: `rate`, `*`, `(`, `hours`, `-`, `0.5`, `)`. Each token knows its column, so a message can point at it.
  2. The **parser** builds a **tree** from the tokens, as records. In the tree of `2 + 3 * 4`, the multiplication sits under the addition, so it's calculated first.
  3. The **calculator** evaluates the tree with a switch over record patterns, as in the last challenge of module 58. There the tree was written by hand; here the parser builds it from text.

  ### What you need

  Everything up to module 58: strings and `charAt` (module 16), lists (module 13), classes and objects (modules 17 to 19), hash maps (module 31), exceptions (module 42), recursion (module 55), records (module 56), switch expressions (module 57), and sealed interfaces with record patterns (module 58). The few library methods the project needs beyond these, such as `Character.isDigit`, are explained where they're used.

  ### The milestones

  1. Tokens: the lexer splits a line into numbers and symbols.
  2. Left to right: the first calculations, one operator after another.
  3. Multiplication first: a parser that builds a tree with precedence.
  4. Parentheses and minus signs.
  5. Variables: saving values under names.
  6. Clear error messages for bad input.

  Calculations use `double`, so `7 / 2` is 3.5, and a whole number is shown without `.0`.
