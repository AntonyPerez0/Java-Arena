  - id: variables
    title: "Variables"
    task: |
      A line such as `rate = 12.5` saves a value under a name, and later lines can use the name: `rate * 8`.

      - **Tokens.** `NameToken.java` is new: `NameToken(String name, int column)`. Add it to Token's `permits` list. In `Lexer.java`, a letter starts a name, which goes on as long as letters and digits follow, so `side2` is one name. `Character.isLetter(c)` is true for a letter, and `Character.isLetterOrDigit(c)` for a letter or a digit. `=` becomes a SymbolToken.
      - **The tree.** `Variable.java` is new: `Variable(String name)`. Add it to Expr's `permits` list. In `factor()`, a NameToken becomes a Variable.
      - **The values.** Calculator keeps them in a field, a map (a `HashMap<String, Double>`) created in a constructor, so that each line can use what the lines before it saved.
      - **Saving.** In `calculate`: when the first token is a name and the second is `=`, the tokens after them are an expression. Calculate it, save the value under the name, and return the name, ` = ` and the value, such as `pay = 80`. A name can get a new value, and its expression can use the old one: `x = x * 3`. `tokens.subList(2, tokens.size())` gives the tokens from index 2 on. Any other line is calculated as before.
      - **Using.** In `eval`, a Variable's value is the one saved under its name. For a name that has no value yet, throw an IllegalArgumentException for now.

      Names are case sensitive: `Total` and `total` are two variables. With the input:

      ```text
      rate = 12.5
      hours = 8
      rate * hours
      pay = rate * hours - 20
      pay / 2
      ```

      the program prints:

      ```
      rate = 12.5
      hours = 8
      100
      pay = 80
      40
      ```
