  - id: errors
    title: "Clear error messages"
    task: |
      Right now a typing mistake crashes the calculator. A good one says what's wrong and where, and goes on with the next line.

      `CalcException.java` is new: an unchecked exception that carries a message. Throw it instead of IllegalArgumentException, everywhere, with exactly these messages (the numbers and texts in them are examples):

      - `unexpected character # at column 5`: the lexer meets a character that can't be part of any token.
      - `bad number 1.2.3 at column 1`: `Double.parseDouble` can't read a number's text. It throws a NumberFormatException then: catch it in the lexer.
      - `expected a number at column 5`: `factor()` finds no number, name, `(` or `-`. When the line has ended, it's `expected a number at the end`. This also holds for `x =`, which is a save with nothing after the `=`.
      - `expected ) at column 8`, or `expected ) at the end`: a parenthesis isn't closed.
      - `expected an operator at column 3`: `parse()` has read a whole expression, but there are tokens left, as in `2 3`. Make `parse()` check for that.
      - `division by zero`: the right side of a `/` is 0.
      - `unknown variable cost`: a name without a value.

      The column is the column of the token where the problem is. To ask any token for its column, add the method `int column();` to the Token interface: each of the three records already has a method of that name, so they implement it as they are.

      `main` catches CalcException, prints `Error: ` and the message, and goes on with the next line. A line with an error saves nothing. With the input:

      ```text
      2 + # 3
      2 + * 3
      2 +
      (2 + 3
      2 3
      ```

      the program prints:

      ```
      Error: unexpected character # at column 5
      Error: expected a number at column 5
      Error: expected a number at the end
      Error: expected ) at the end
      Error: expected an operator at column 3
      ```
