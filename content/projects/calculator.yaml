      Calculator.java: |
        import java.util.List;

        public class Calculator {

            public String calculate(String line) {
                List<Token> tokens = Lexer.tokenize(line);
                double result = numberAt(tokens, 0);
                int i = 1;
                while (i + 1 < tokens.size()) {
                    if (tokens.get(i) instanceof SymbolToken operator) {
                        result = apply(operator.symbol(), result, numberAt(tokens, i + 1));
                    }
                    i += 2;
                }
                return format(result);
            }

            private double numberAt(List<Token> tokens, int index) {
                if (tokens.get(index) instanceof NumberToken number) {
                    return number.value();
                }
                throw new IllegalArgumentException("expected a number");
            }

            private double apply(char operator, double left, double right) {
                return switch (operator) {
                    case '+' -> left + right;
                    case '-' -> left - right;
                    case '*' -> left * right;
                    default -> left / right;
                };
            }

            // 15 becomes "15", 3.5 stays "3.5"
            public static String format(double value) {
                if (value == Math.floor(value) && Math.abs(value) < 1e15) {
                    return String.valueOf((long) value);
                }
                return String.valueOf(value);
            }
        }
  - id: precedence
    title: "Multiplication first"
    replaces: [Left to right]
    task: |
      In math, `2 + 3 * 4` is 14, because `*` and `/` come before `+` and `-`. Going from left to right can't do that. So the calculator first builds a **tree** of the expression, and then calculates the tree.

      Three new files hold the tree: `Expr.java` is a sealed interface, and its records are `Literal(double value)` for a number and `Operation(char operator, Expr left, Expr right)`. The tree of `2 + 3 * 4` is:

      ```java fragment
      new Operation('+', new Literal(2), new Operation('*', new Literal(3), new Literal(4)))
      ```

      `Parser.java` is new too. It reads the tokens with `next`, the index of the next token, and has one method per level:

      - `expression()` reads a term. Then, as long as the next token is `+` or `-`, it steps past that operator, reads another term, and joins the two: `result = new Operation(operator, result, term())`.
      - `term()` does the same one level lower: numbers joined by `*` and `/`.
      - `number()` and `nextSymbol()` are ready.

      `term()` reads all of `3 * 4` before `expression()` sees the rest, so the multiplication ends up lower in the tree, as one part of the addition.

      Then in `Calculator.java`:

      - Write `eval(Expr expr)`, which returns the value of a tree, with a switch over record patterns. An operation's value is `apply` on its operator and the values of its two parts.
      - Change `calculate` so that it returns `format(eval(new Parser(tokens).parse()))`. The left-to-right loop isn't needed any more: delete it, and any helper method only it used.

      With the input:

      ```text
      2 + 3 * 4
      10 - 6 / 2 - 1
      8 / 4 / 2
      ```

      the program prints:

      ```
      14
      6
      1
      ```
    files:
      Expr.java: |
        public sealed interface Expr permits Literal, Operation {
        }
      Literal.java: |
        public record Literal(double value) implements Expr {
        }
      Operation.java: |
        public record Operation(char operator, Expr left, Expr right) implements Expr {
        }
      Parser.java: |
        import java.util.List;

        public class Parser {
            private List<Token> tokens;
            private int next;

            public Parser(List<Token> tokens) {
                this.tokens = tokens;
                this.next = 0;
            }

            public Expr parse() {
                return expression();
            }

            // terms joined by + and -
            private Expr expression() {
                return term();
            }

            // numbers joined by * and /
            private Expr term() {
                return number();
            }

            private Expr number() {
                if (this.next < this.tokens.size() && this.tokens.get(this.next) instanceof NumberToken number) {
                    this.next++;
                    return new Literal(number.value());
                }
                throw new IllegalArgumentException("expected a number");
            }

            // the symbol of the next token, or a space when the next token isn't a symbol
            private char nextSymbol() {
                if (this.next < this.tokens.size() && this.tokens.get(this.next) instanceof SymbolToken token) {
                    return token.symbol();
                }
                return ' ';
            }
        }
    hints:
      - "In `expression()`: `Expr result = term();`, then `while (nextSymbol() == '+' || nextSymbol() == '-')`. Inside, remember `char operator = nextSymbol();`, step past it with `this.next++`, and join `result` with the next term."
      - "`term()` is `expression()` with `number()` in place of `term()`, and `*` and `/` in place of `+` and `-`."
      - "In eval: `case Literal(double value) -> value;` and `case Operation(char operator, Expr left, Expr right) -> apply(operator, eval(left), eval(right));`"
    require:
      - pattern: "\\bcase\\s+Literal\\s*\\("
        message: "Give eval a case with a record pattern for a Literal: `case Literal(double value) -> ...`."
      - pattern: "\\bcase\\s+Operation\\s*\\("
        message: "Give eval a case with a record pattern for an Operation: `case Operation(char operator, Expr left, Expr right) -> ...`."
      - pattern: "\\bnew\\s+Operation\\s*\\("
        min: 2
        message: "Build the tree in Parser: `expression()` and `term()` each create a `new Operation(...)`."
    tests:
      - name: "Times before plus"
        stdin: |
          2 + 3 * 4
          10 - 6 / 2 - 1
          8 / 4 / 2
      - name: "The tree of 2 + 3 * 4"
        call: |
          System.out.println(new Parser(Lexer.tokenize("2 + 3 * 4")).parse());
      - name: "Mixed operators"
        stdin: |
          1 + 2 * 3 - 4 / 8
          100 / 10 * 3
          5 - 2 - 1
          7
        hidden: true
      - name: "The tree of 9 - 3 - 2 * 5"
        call: |
          System.out.println(new Parser(Lexer.tokenize("9 - 3 - 2 * 5")).parse());
        hidden: true
