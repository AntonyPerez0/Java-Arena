      Board.java: |
        public class Board {
            private boolean[][] cells;
            private int generation;
            private boolean wrapping;

            public Board(int rows, int columns) {
                this.cells = new boolean[rows][columns];
                this.generation = 0;
                this.wrapping = false;
            }

            public int getRows() {
                return this.cells.length;
            }

            public int getColumns() {
                return this.cells[0].length;
            }

            public void setAlive(int row, int column) {
                this.cells[row][column] = true;
            }

            public boolean isAlive(int row, int column) {
                return this.cells[row][column];
            }

            public int countAlive() {
                int count = 0;
                for (int row = 0; row < getRows(); row++) {
                    for (int column = 0; column < getColumns(); column++) {
                        if (this.cells[row][column]) {
                            count++;
                        }
                    }
                }
                return count;
            }

            public int countNeighbors(int row, int column) {
                int count = 0;
                for (int r = row - 1; r <= row + 1; r++) {
                    for (int c = column - 1; c <= column + 1; c++) {
                        if (r == row && c == column) {
                            continue;
                        }
                        int checkRow = r;
                        int checkColumn = c;
                        if (this.wrapping) {
                            checkRow = (r + getRows()) % getRows();
                            checkColumn = (c + getColumns()) % getColumns();
                        }
                        if (checkRow >= 0 && checkRow < getRows() && checkColumn >= 0 && checkColumn < getColumns() && this.cells[checkRow][checkColumn]) {
                            count++;
                        }
                    }
                }
                return count;
            }

            public boolean willLive(int row, int column) {
                int neighbors = countNeighbors(row, column);
                if (this.cells[row][column]) {
                    return neighbors == 2 || neighbors == 3;
                }
                return neighbors == 3;
            }

            public void step() {
                boolean[][] next = new boolean[getRows()][getColumns()];
                for (int row = 0; row < getRows(); row++) {
                    for (int column = 0; column < getColumns(); column++) {
                        next[row][column] = willLive(row, column);
                    }
                }
                this.cells = next;
                this.generation++;
            }

            public int getGeneration() {
                return this.generation;
            }

            public void setWrapping(boolean wrapping) {
                this.wrapping = wrapping;
            }

            public String toString() {
                StringBuilder text = new StringBuilder();
                for (int row = 0; row < getRows(); row++) {
                    if (row > 0) {
                        text.append("\n");
                    }
                    for (int column = 0; column < getColumns(); column++) {
                        if (this.cells[row][column]) {
                            text.append("O");
                        } else {
                            text.append(".");
                        }
                    }
                }
                return text.toString();
            }
        }
  - id: pattern-file
    title: Patterns from a file
    task: |
      Setting cells one by one is slow. Life patterns are often kept in text files that look like a printed board, and many Life programs read files like this one:

      ```text
      !Name: Glider
      !It moves one cell down and one to the right every four generations.
      .O
      ..O
      OOO
      ......
      ```

      A line that starts with `!` is a comment. Every other line is a row of the board, from the top: `O` is a live cell, and any other character a dead one. The rows can have different lengths. The board is as wide as the longest row, and a shorter row continues with dead cells. An empty line is a row of dead cells.

      Write a method `public static Board readPattern(String fileName) throws IOException` in `Main` that reads the file and returns its board. The files in the checks have at least one row that isn't empty. When the file can't be read, the method doesn't catch the exception: it leaves it to the caller, which is what `throws IOException` says. The check gives the program the file above as `glider.txt` and runs:

      ```java fragment
      Board board = readPattern("glider.txt");
      System.out.println(board.getRows() + " by " + board.getColumns());
      System.out.println(board);
      System.out.println(board.countAlive());
      ```

      and expects:

      ```
      4 by 6
      .O....
      ..O...
      OOO...
      ......
      5
      ```
    hints:
      - "`Files.readAllLines(Paths.get(fileName))` returns the file's lines (module 42). Go through them once to keep the lines that don't start with `!` in an `ArrayList<String>`, and to find the length of the longest one."
      - "Then create `new Board(rows.size(), longest)`, and for each row go through the characters of its line: `setAlive(row, column)` where `line.charAt(column) == 'O'`. Loop to `line.length()`, not to the width of the board, and a short line leaves the rest of its row dead."
      - "The method needs `import java.io.IOException;`, `import java.nio.file.Files;` and `import java.nio.file.Paths;` at the top of `Main.java`, and `import java.util.ArrayList;` for the list."
    tests:
