        message: "Check the indexes before reading a cell, instead of catching the exception."
    solution:
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Board board = new Board(4, 6);
                board.setAlive(0, 1);
                board.setAlive(1, 2);
                board.setAlive(2, 0);
                board.setAlive(2, 1);
                board.setAlive(2, 2);
                System.out.println(board);
                System.out.println(board.countAlive() + " cells are alive.");
            }
        }
      Board.java: |
        public class Board {
            private boolean[][] cells;

            public Board(int rows, int columns) {
                this.cells = new boolean[rows][columns];
            }

            public int getRows() {
                return this.cells.length;
            }

            public int getColumns() {
                return this.cells[0].length;
            }

            public void setAlive(int row, int column) {
                this.cells[row][column] = true;
            }

            public boolean isAlive(int row, int column) {
                return this.cells[row][column];
            }

            public int countAlive() {
                int count = 0;
                for (int row = 0; row < getRows(); row++) {
                    for (int column = 0; column < getColumns(); column++) {
                        if (this.cells[row][column]) {
                            count++;
                        }
                    }
                }
                return count;
            }

            public int countNeighbors(int row, int column) {
                int count = 0;
                for (int r = row - 1; r <= row + 1; r++) {
                    for (int c = column - 1; c <= column + 1; c++) {
                        if (r == row && c == column) {
                            continue;
                        }
                        if (r >= 0 && r < getRows() && c >= 0 && c < getColumns() && this.cells[r][c]) {
                            count++;
                        }
                    }
                }
                return count;
            }

            public boolean willLive(int row, int column) {
                int neighbors = countNeighbors(row, column);
                if (this.cells[row][column]) {
                    return neighbors == 2 || neighbors == 3;
                }
                return neighbors == 3;
            }

            public String toString() {
                StringBuilder text = new StringBuilder();
                for (int row = 0; row < getRows(); row++) {
                    if (row > 0) {
                        text.append("\n");
                    }
                    for (int column = 0; column < getColumns(); column++) {
                        if (this.cells[row][column]) {
                            text.append("O");
                        } else {
                            text.append(".");
                        }
                    }
                }
                return text.toString();
            }
        }
  - id: generation
    title: One generation
    task: |
      Now the whole board takes a step. Every cell changes **at the same time**: the next generation is worked out from the current one alone. So the program can't change the cells one by one in `cells`, because a cell it has already changed would give its neighbors the wrong count. Build the next generation in a new array instead, and put it in place when it's complete.

      1. Add a field `generation`, an `int` that is 0 for a new board.
      2. Write `step()`, which creates a new `boolean[][]` of the same size, fills it with `willLive` for every cell, and then makes it the board's `cells`. It also adds one to `generation`.
      3. Write `getGeneration()`, which returns how many steps the board has taken.

      To watch it in your own program, add `board.step();` and another `System.out.println(board);` at the end of `main`. The check runs:

      ```java fragment
      Board board = new Board(5, 5);
      board.setAlive(2, 1);
      board.setAlive(2, 2);
      board.setAlive(2, 3);
      board.step();
      System.out.println(board);
      System.out.println(board.getGeneration());
      board.step();
      System.out.println(board);
      System.out.println(board.getGeneration());
      ```

      and expects a **blinker**, a row of three that turns into a column and back:

      ```
      .....
      ..O..
      ..O..
      ..O..
      .....
      1
      .....
      .....
      .OOO.
      .....
      .....
      2
      ```
    hints:
      - "The new array has the same size as the board, `getRows()` by `getColumns()`, and `willLive` already does all the work for each cell. It reads only `cells`, which doesn't change until the loops are done."
      - "`boolean[][] next = new boolean[getRows()][getColumns()];`, then two loops with `next[row][column] = willLive(row, column);`. After the loops, `this.cells = next;` puts the new generation in place, and `this.generation++;` counts the step."
    tests:
