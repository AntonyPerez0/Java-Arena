          board.setAlive(0, 1);
          board.setAlive(1, 2);
          board.setAlive(2, 0);
          board.setAlive(2, 1);
          board.setAlive(2, 2);
          for (int i = 0; i < 4; i++) {
              board.step();
          }
          System.out.println(board);
          System.out.println(board.getGeneration() + " " + board.countAlive());
