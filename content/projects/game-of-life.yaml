  - id: generations
    title: Generations as text
    task: |
      Time to put it all together in `main`. Replace the example board in `main` with a program that reads three lines of input:

      1. the name of a pattern file,
      2. how many generations to show after the first one,
      3. `wrap` for a board that wraps around at its edges, or `edges` for one that doesn't.

      The program reads the board with `readPattern` and prints generation 0, then takes a step and prints the next generation, until it has shown the number of generations that was asked for. Each generation starts with a line such as `Generation 2: 5 alive` (its number and how many cells are alive), followed by the board. An empty line comes before every generation except the first.

      Two more things:

      - Some patterns stop changing, such as a block, or a board where everything has died. Change `step()` in `Board` to return a `boolean`: `true` when at least one cell changed, and `false` when the new generation is exactly the old one. When a step changes nothing, the program prints the empty line and `Nothing changes after generation 3.` (with the number of the last generation it printed), and stops.
      - When the file can't be read, the program prints `Could not read nothing.txt.` (with the name that was given) and nothing else.

      With this `blinker.txt`

      ```text
      !Blinker
      .....
      .OOO.
      .....
      ```

      and the input `blinker.txt`, `2` and `edges`, the program prints:

      ```
      Generation 0: 3 alive
      .....
      .OOO.
      .....

      Generation 1: 3 alive
      ..O..
      ..O..
      ..O..

      Generation 2: 3 alive
      .....
      .OOO.
      .....
      ```
    hints:
      - "Read the three lines with `scanner.nextLine()`, and turn the second into a number with `Integer.parseInt`. `board.setWrapping(edges.equals(\"wrap\"))` sets the edges."
      - "`readPattern` throws an IOException when the file can't be read: call it inside `try`, and in the `catch` print the message and `return` from `main`."
      - "A loop `while (board.getGeneration() < generations)` takes the steps. In `step()`, compare each new cell with the old one, `next[row][column] != this.cells[row][column]`, and remember in a `boolean` whether any of them differed. After a step that changed nothing, `getGeneration()` is already one more than the generation that was printed last."
    tests:
