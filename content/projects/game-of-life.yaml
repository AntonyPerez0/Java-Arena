milestones:
  - id: grid
    title: A grid of cells
    task: |
      `Board.java` has the field for the cells: `cells` is a `boolean[][]`, where `true` means the cell is alive. `Main` already uses some of these methods, so the program compiles once you've written them all. Write in `Board`:

      1. A constructor `Board(int rows, int columns)` that creates a grid of that many rows and columns, with every cell dead.
      2. `getRows()` and `getColumns()`, which return the number of rows and of columns. The boards always have at least one row and one column.
      3. `setAlive(int row, int column)`, which makes that cell alive, and `isAlive(int row, int column)`, which returns whether it's alive. Rows and columns are counted from 0, as array indexes are.
      4. `countAlive()`, which returns how many cells of the board are alive.
      5. `toString()`, which returns the board one row per line: `O` (the capital letter) for a live cell and `.` for a dead one. Put a line break (`\n`) between the rows, but not after the last one, so `System.out.println(board)` prints no empty line at the end.

      The check runs:

      ```java fragment
      Board board = new Board(3, 5);
      board.setAlive(0, 1);
      board.setAlive(1, 2);
      board.setAlive(2, 4);
      System.out.println(board.getRows() + " by " + board.getColumns());
      System.out.println(board);
      System.out.println(board.countAlive());
      System.out.println(board.isAlive(1, 2));
      System.out.println(board.isAlive(2, 3));
      ```

      and expects:

      ```
      3 by 5
      .O...
      ..O..
      ....O
      3
      true
      false
      ```
    hints:
      - "The constructor only has to create the array: a new `boolean` array starts all `false`, so every cell is dead. The getters need no fields of their own: the number of rows is the array's length, and the number of columns is the length of one row. `countAlive` and `toString` both go through every cell with two loops, rows outside and columns inside."
      - "In code: `this.cells = new boolean[rows][columns];`, then `this.cells.length` and `this.cells[0].length`. In `toString`, append `\"\\n\"` to a StringBuilder before every row except the first one (`if (row > 0)`)."
