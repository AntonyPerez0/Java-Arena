    solution:
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Board board = new Board(4, 6);
                board.setAlive(0, 1);
                board.setAlive(1, 2);
                board.setAlive(2, 0);
                board.setAlive(2, 1);
                board.setAlive(2, 2);
                System.out.println(board);
