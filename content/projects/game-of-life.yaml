      Board.java: |
        public class Board {
            private boolean[][] cells;

            public Board(int rows, int columns) {
                this.cells = new boolean[rows][columns];
            }

            public int getRows() {
                return this.cells.length;
            }

            public int getColumns() {
                return this.cells[0].length;
            }

            public void setAlive(int row, int column) {
                this.cells[row][column] = true;
            }

            public boolean isAlive(int row, int column) {
                return this.cells[row][column];
            }

            public int countAlive() {
                int count = 0;
                for (int row = 0; row < getRows(); row++) {
                    for (int column = 0; column < getColumns(); column++) {
                        if (this.cells[row][column]) {
                            count++;
                        }
                    }
                }
                return count;
            }

            public String toString() {
                StringBuilder text = new StringBuilder();
                for (int row = 0; row < getRows(); row++) {
                    if (row > 0) {
                        text.append("\n");
                    }
                    for (int column = 0; column < getColumns(); column++) {
                        if (this.cells[row][column]) {
                            text.append("O");
                        } else {
                            text.append(".");
                        }
                    }
                }
                return text.toString();
            }
        }
  - id: neighbors
    title: Counting neighbors
    task: |
      Whether a cell lives on depends on its eight neighbors. Add two methods to `Board`:

      1. `countNeighbors(int row, int column)` returns how many of the eight cells around that cell are alive. The cell itself doesn't count. A cell on the edge of the board has fewer neighbors: a place outside the board counts as a dead cell.
      2. `willLive(int row, int column)` returns whether the cell is alive in the next generation, by the rules of the game:
         - a live cell stays alive with 2 or 3 live neighbors, and dies otherwise;
         - a dead cell comes alive with exactly 3 live neighbors, and stays dead otherwise.

      The check runs:

      ```java fragment
      Board board = new Board(4, 5);
      board.setAlive(1, 1);
      board.setAlive(1, 2);
      board.setAlive(1, 3);
      board.setAlive(0, 4);
      System.out.println(board);
      System.out.println(board.countNeighbors(1, 2));
      System.out.println(board.countNeighbors(0, 2));
      System.out.println(board.countNeighbors(0, 0));
      System.out.println(board.countNeighbors(3, 4));
      System.out.println(board.willLive(1, 2));
      System.out.println(board.willLive(1, 1));
      System.out.println(board.willLive(0, 2));
      System.out.println(board.willLive(2, 2));
      ```

      and expects:

      ```
      ....O
      .OOO.
      .....
      .....
      2
      3
      1
      0
      true
      false
      true
      true
      ```
    hints:
      - "Go through the block of 3 by 3 cells with two loops, from `row - 1` to `row + 1` and from `column - 1` to `column + 1`, and skip the cell in the middle with `continue`, as module 47 did for the mines."
      - "Read `this.cells[r][c]` only when `r` is from 0 to `getRows() - 1` and `c` from 0 to `getColumns() - 1`. Put those checks first in one condition joined with `&&`, then the cell itself."
      - "In `willLive`, count the neighbors once and keep the number in a variable. Then return `neighbors == 2 || neighbors == 3` for a live cell, and `neighbors == 3` for a dead one."
