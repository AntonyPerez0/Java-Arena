    require:
      - pattern: new\s+boolean\s*\[
        min: 2
        message: "Build the next generation in a new array, `new boolean[getRows()][getColumns()]`, in `step()`."
    solution:
      Main.java: |
        public class Main {
            public static void main(String[] args) {
                Board board = new Board(4, 6);
                board.setAlive(0, 1);
                board.setAlive(1, 2);
                board.setAlive(2, 0);
                board.setAlive(2, 1);
                board.setAlive(2, 2);
                System.out.println(board);
                System.out.println(board.countAlive() + " cells are alive.");
            }
        }
      Board.java: |
        public class Board {
            private boolean[][] cells;
            private int generation;

            public Board(int rows, int columns) {
                this.cells = new boolean[rows][columns];
                this.generation = 0;
            }

            public int getRows() {
                return this.cells.length;
            }

            public int getColumns() {
                return this.cells[0].length;
            }

            public void setAlive(int row, int column) {
                this.cells[row][column] = true;
            }

            public boolean isAlive(int row, int column) {
                return this.cells[row][column];
            }

            public int countAlive() {
                int count = 0;
                for (int row = 0; row < getRows(); row++) {
                    for (int column = 0; column < getColumns(); column++) {
                        if (this.cells[row][column]) {
                            count++;
                        }
                    }
                }
                return count;
            }

            public int countNeighbors(int row, int column) {
                int count = 0;
                for (int r = row - 1; r <= row + 1; r++) {
                    for (int c = column - 1; c <= column + 1; c++) {
                        if (r == row && c == column) {
                            continue;
                        }
                        if (r >= 0 && r < getRows() && c >= 0 && c < getColumns() && this.cells[r][c]) {
                            count++;
                        }
                    }
                }
                return count;
            }

            public boolean willLive(int row, int column) {
                int neighbors = countNeighbors(row, column);
                if (this.cells[row][column]) {
                    return neighbors == 2 || neighbors == 3;
                }
                return neighbors == 3;
            }

            public void step() {
                boolean[][] next = new boolean[getRows()][getColumns()];
                for (int row = 0; row < getRows(); row++) {
                    for (int column = 0; column < getColumns(); column++) {
                        next[row][column] = willLive(row, column);
                    }
                }
                this.cells = next;
                this.generation++;
            }

            public int getGeneration() {
                return this.generation;
            }

            public String toString() {
                StringBuilder text = new StringBuilder();
                for (int row = 0; row < getRows(); row++) {
                    if (row > 0) {
                        text.append("\n");
                    }
                    for (int column = 0; column < getColumns(); column++) {
                        if (this.cells[row][column]) {
                            text.append("O");
                        } else {
                            text.append(".");
                        }
                    }
                }
                return text.toString();
            }
        }
  - id: wrapping
    title: Wrapping around
    task: |
      A glider on the board you have now soon reaches an edge, turns into a block and stops. Many Life programs let the edges **wrap around** instead: the row above the top row is the bottom row, and the column to the left of the first column is the last column. The board becomes like the surface of a doughnut, with no edges at all, and a glider that leaves on one side comes back on the other.

      1. Add a field `wrapping`, a `boolean` that is `false` for a new board, and a method `setWrapping(boolean wrapping)` that sets it.
      2. When `wrapping` is `true`, `countNeighbors` wraps around: on a board of 5 rows, row -1 is row 4 and row 5 is row 0, and the same for the columns. When it's `false`, the method counts as before.

      `willLive` and `step` use `countNeighbors`, so they wrap too, with no change. The check runs:

      ```java fragment
      Board board = new Board(5, 5);
      board.setAlive(1, 0);
      board.setAlive(2, 0);
      board.setAlive(3, 0);
      board.setWrapping(true);
      System.out.println(board.countNeighbors(2, 4));
      System.out.println(board.countNeighbors(0, 0));
      board.step();
      System.out.println(board);
      ```

      and expects a blinker on the left edge to turn across it:

      ```
      3
      1
      .....
      .....
      OO..O
      .....
      .....
      ```
    hints:
      - "The remainder `%` wraps a number around: `(r + getRows()) % getRows()` turns -1 into the last row and `getRows()` into 0, and leaves every row in between as it is. Adding `getRows()` first matters, because in Java `-1 % 5` is -1, not 4."
      - "Work out the row and column to read before the check: when `wrapping` is on, replace `r` and `c` with their wrapped values. A wrapped index is always inside the board, so the check that keeps out the places outside can stay as it is."
    tests:
