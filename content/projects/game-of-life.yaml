    require:
      - pattern: \bboolean\s+step\s*\(
        message: "Change `step()` to return a `boolean`: `public boolean step()`."
      - pattern: readPattern\s*\(
        min: 2
        message: "Read the board in `main` with your method `readPattern`."
    solution:
      Main.java: |
        import java.io.IOException;
        import java.nio.file.Files;
        import java.nio.file.Paths;
        import java.util.ArrayList;
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner scanner = new Scanner(System.in);
                String fileName = scanner.nextLine();
                int generations = Integer.parseInt(scanner.nextLine());
                String edges = scanner.nextLine();

                Board board;
                try {
                    board = readPattern(fileName);
                } catch (IOException e) {
                    System.out.println("Could not read " + fileName + ".");
                    return;
                }
                board.setWrapping(edges.equals("wrap"));

                printGeneration(board);
                while (board.getGeneration() < generations) {
                    System.out.println();
                    if (!board.step()) {
                        System.out.println("Nothing changes after generation " + (board.getGeneration() - 1) + ".");
                        return;
                    }
                    printGeneration(board);
                }
            }

            public static void printGeneration(Board board) {
                System.out.println("Generation " + board.getGeneration() + ": " + board.countAlive() + " alive");
                System.out.println(board);
            }

            public static Board readPattern(String fileName) throws IOException {
                ArrayList<String> rows = new ArrayList<>();
                int columns = 0;
                for (String line : Files.readAllLines(Paths.get(fileName))) {
                    if (line.startsWith("!")) {
                        continue;
                    }
                    rows.add(line);
                    if (line.length() > columns) {
                        columns = line.length();
                    }
                }

                Board board = new Board(rows.size(), columns);
                for (int row = 0; row < rows.size(); row++) {
                    String line = rows.get(row);
                    for (int column = 0; column < line.length(); column++) {
                        if (line.charAt(column) == 'O') {
                            board.setAlive(row, column);
                        }
                    }
                }
                return board;
            }
        }
      Board.java: |
        public class Board {
            private boolean[][] cells;
            private int generation;
            private boolean wrapping;

            public Board(int rows, int columns) {
                this.cells = new boolean[rows][columns];
                this.generation = 0;
                this.wrapping = false;
            }

            public int getRows() {
                return this.cells.length;
            }

            public int getColumns() {
                return this.cells[0].length;
            }

            public void setAlive(int row, int column) {
                this.cells[row][column] = true;
            }

            public boolean isAlive(int row, int column) {
                return this.cells[row][column];
            }

            public int countAlive() {
                int count = 0;
                for (int row = 0; row < getRows(); row++) {
                    for (int column = 0; column < getColumns(); column++) {
                        if (this.cells[row][column]) {
                            count++;
                        }
                    }
                }
                return count;
            }

            public int countNeighbors(int row, int column) {
                int count = 0;
                for (int r = row - 1; r <= row + 1; r++) {
                    for (int c = column - 1; c <= column + 1; c++) {
                        if (r == row && c == column) {
                            continue;
                        }
                        int checkRow = r;
                        int checkColumn = c;
                        if (this.wrapping) {
                            checkRow = (r + getRows()) % getRows();
                            checkColumn = (c + getColumns()) % getColumns();
                        }
                        if (checkRow >= 0 && checkRow < getRows() && checkColumn >= 0 && checkColumn < getColumns() && this.cells[checkRow][checkColumn]) {
                            count++;
                        }
                    }
                }
                return count;
            }

            public boolean willLive(int row, int column) {
                int neighbors = countNeighbors(row, column);
                if (this.cells[row][column]) {
                    return neighbors == 2 || neighbors == 3;
                }
                return neighbors == 3;
            }

            public boolean step() {
                boolean[][] next = new boolean[getRows()][getColumns()];
                boolean changed = false;
                for (int row = 0; row < getRows(); row++) {
                    for (int column = 0; column < getColumns(); column++) {
                        next[row][column] = willLive(row, column);
                        if (next[row][column] != this.cells[row][column]) {
                            changed = true;
                        }
                    }
                }
                this.cells = next;
                this.generation++;
                return changed;
            }

            public int getGeneration() {
                return this.generation;
            }

            public void setWrapping(boolean wrapping) {
                this.wrapping = wrapping;
            }

            public String toString() {
                StringBuilder text = new StringBuilder();
                for (int row = 0; row < getRows(); row++) {
                    if (row > 0) {
                        text.append("\n");
                    }
                    for (int column = 0; column < getColumns(); column++) {
                        if (this.cells[row][column]) {
                            text.append("O");
                        } else {
                            text.append(".");
                        }
                    }
                }
                return text.toString();
            }
        }
