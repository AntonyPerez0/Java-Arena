        import java.io.IOException;
        import java.io.PrintWriter;
        import java.util.ArrayList;
        import java.util.Collections;
        import java.util.HashMap;

        public class ToolShelf {
            private HashMap<String, Tool> tools;
            private HashMap<String, Member> members;
            private HashMap<String, Loan> loans;

            public ToolShelf() {
                this.tools = new HashMap<>();
                this.members = new HashMap<>();
                this.loans = new HashMap<>();
            }

            public void addTool(Tool tool) {
                this.tools.put(tool.getCode(), tool);
            }

            public void addMember(Member member) {
                this.members.put(member.getCard(), member);
            }

            public Tool getTool(String code) throws LoanException {
                if (!this.tools.containsKey(code)) {
                    throw new LoanException("No tool with the code " + code);
                }
                return this.tools.get(code);
            }

            public Member getMember(String card) throws LoanException {
                if (!this.members.containsKey(card)) {
                    throw new LoanException("No member with the card " + card);
                }
                return this.members.get(card);
            }

            public void printTools() {
                ArrayList<String> codes = new ArrayList<>(this.tools.keySet());
                Collections.sort(codes);
                for (String code : codes) {
                    System.out.println(this.tools.get(code));
                }
            }

            public void printMembers() {
                ArrayList<String> cards = new ArrayList<>(this.members.keySet());
                Collections.sort(cards);
                for (String card : cards) {
                    System.out.println(this.members.get(card));
                }
            }

            public Loan lend(String toolCode, String card, int today) throws LoanException {
                Tool tool = this.getTool(toolCode);
                Member member = this.getMember(card);
                if (this.loans.containsKey(toolCode)) {
                    int dueDay = this.loans.get(toolCode).getDueDay();
                    throw new LoanException(tool + " is out, due back on day " + dueDay);
                }
                if (this.countLoans(card) >= 2) {
                    throw new LoanException(member + " already has 2 tools");
                }
                Loan loan = new Loan(tool, member, today + 7);
                this.loans.put(toolCode, loan);
                return loan;
            }

            private int countLoans(String card) {
                int count = 0;
                for (Loan loan : this.loans.values()) {
                    if (loan.getMember().getCard().equals(card)) {
                        count++;
                    }
                }
                return count;
            }

            public int giveBack(String toolCode, int today) throws LoanException {
                Tool tool = this.getTool(toolCode);
                if (!this.loans.containsKey(toolCode)) {
                    throw new LoanException(tool + " is not out");
                }
                Loan loan = this.loans.get(toolCode);
                this.loans.remove(toolCode);
                if (loan.isLate(today)) {
                    return today - loan.getDueDay();
                }
                return 0;
            }

            public void printLoans() {
                if (this.loans.isEmpty()) {
                    System.out.println("No tools are out");
                }
                ArrayList<String> codes = new ArrayList<>(this.loans.keySet());
                Collections.sort(codes);
                for (String code : codes) {
                    System.out.println(this.loans.get(code));
                }
            }

            public void printLate(int today) {
                ArrayList<Loan> late = new ArrayList<>();
                for (Loan loan : this.loans.values()) {
                    if (loan.isLate(today)) {
                        late.add(loan);
                    }
                }
                if (late.isEmpty()) {
                    System.out.println("Nothing is late");
                }
                Collections.sort(late);
                for (Loan loan : late) {
                    System.out.println(loan);
                }
            }

            public void save(String fileName) throws IOException {
                try (PrintWriter writer = new PrintWriter(fileName)) {
                    ArrayList<String> codes = new ArrayList<>(this.tools.keySet());
                    Collections.sort(codes);
                    for (String code : codes) {
                        writer.println("tool," + code + "," + this.tools.get(code).getName());
                    }
                    ArrayList<String> cards = new ArrayList<>(this.members.keySet());
                    Collections.sort(cards);
                    for (String card : cards) {
                        writer.println("member," + card + "," + this.members.get(card).getName());
                    }
                    ArrayList<String> lent = new ArrayList<>(this.loans.keySet());
                    Collections.sort(lent);
                    for (String code : lent) {
                        Loan loan = this.loans.get(code);
                        writer.println("loan," + code + "," + loan.getMember().getCard() + "," + loan.getDueDay());
                    }
                }
            }
        }
