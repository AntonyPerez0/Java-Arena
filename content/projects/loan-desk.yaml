milestones:
  - id: tools-and-members
    title: Tools and members
    task: |
      Every tool on the shelf has a code, such as `T1`, and a name. `Tool.java` is ready. Every member has a card, such as `M1`, and a name.

      In `Member.java`, write the class `Member`:

      - a constructor `Member(String card, String name)`
      - `getCard()` and `getName()`, which return them
      - `toString()`, which returns the name and the card in parentheses: `Noor (M1)`

      In `ToolShelf.java`, write the class `ToolShelf`. It keeps the tools in a `HashMap<String, Tool>` called `tools`, with the codes as keys, and the members in a `HashMap<String, Member>` called `members`, with the cards as keys. A map finds a tool by its code at once, which the next milestones need.

      - a constructor without parameters, which creates the empty maps
      - `addTool(Tool tool)` and `addMember(Member member)`, which put them in their maps
      - `printTools()`, which prints every tool, one per line, in the alphabetical order of their codes
      - `printMembers()`, which prints every member the same way, in the order of their cards

      A HashMap keeps its keys in an order of its own, so copy the keys into a list and sort it before printing. The check runs:

      ```java fragment
      ToolShelf shelf = new ToolShelf();
      shelf.addTool(new Tool("T2", "Hand saw"));
      shelf.addTool(new Tool("T1", "Cordless drill"));
      shelf.addMember(new Member("M2", "Ilse"));
      shelf.addMember(new Member("M1", "Noor"));
      shelf.printTools();
      shelf.printMembers();
      ```

      and expects:

      ```
      T1 Cordless drill
      T2 Hand saw
      Noor (M1)
      Ilse (M2)
      ```
    hints:
      - "Member looks like Tool: two private String fields, a constructor that sets them, two getters and a `toString` with `@Override` above it."
      - "To print in order: `ArrayList<String> codes = new ArrayList<>(this.tools.keySet());`, then `Collections.sort(codes);`, then a for-each loop over `codes` that prints `this.tools.get(code)`. ToolShelf needs imports for ArrayList, Collections and HashMap."
    require:
      - pattern: \bHashMap\s*<\s*String\s*,\s*Tool\s*>
        message: "Keep the tools in a `HashMap<String, Tool>`, with the codes as keys."
      - pattern: \bHashMap\s*<\s*String\s*,\s*Member\s*>
        message: "Keep the members in a `HashMap<String, Member>`, with the cards as keys."
    tests:
