  - id: the-desk
    title: The desk
    task: |
      Last, the desk itself. The new file `TextUi.java` holds the class `TextUi`, the program's text UI. Its constructor takes a Scanner and a ToolShelf and keeps them in the fields `scanner` and `shelf`, and the day, kept in the `int` field `today`, starts as day 1. `main` creates the shelf and the TextUi, and calls its `start()`, which:

      1. Loads `shelf.csv`. When there's no such file (an IOException), it prints `No shelf.csv yet, so the shelf starts empty` and goes on. When the file is damaged (a LoanException), it prints `Can't load shelf.csv. ` and the exception's message, and ends at once, without saving: saving would overwrite the lines it couldn't read.
      2. Reads commands, one per line, until `quit` or the end of the input. The words of a command are separated by spaces.
      3. Saves the shelf into `shelf.csv` and prints `Saved shelf.csv` (or `Could not save: ` and the message when that fails).

      The commands:

      - `day 14` makes it day 14 and prints `It's day 14`. A day before today prints `The day can't go back: it's day 14`, and a day that isn't a whole number `Not a day number: soon`.
      - `tools`, `members` and `loans` print the shelf's tools, members and loans; `late` prints the loans that are late today.
      - `lend T1 M2` lends T1 to M2 today and prints `Lent: ` and the loan.
      - `return T3` gives T3 back and prints `T3 Ladder is back`, followed by `, 3 days late` when it's late (`, 1 day late` for one day).
      - When the shelf refuses a loan or a return, the desk prints `Sorry: ` and the exception's message.
      - Anything else, including a command with the wrong number of words, prints `Unknown command: ` and the line.

      Input isn't echoed. The check gives the program the `shelf.csv` of the introduction:

      ```text
      tool,T1,Cordless drill
      tool,T2,Hand saw
      tool,T3,Ladder
      member,M1,Noor
      member,M2,Ilse
      loan,T3,M1,11
      ```

      For the input shown, the program prints:

      ```
      It's day 14
      T3 Ladder: Noor (M1), due day 11
      Lent: T1 Cordless drill: Ilse (M2), due day 21
      Sorry: T3 Ladder is out, due back on day 11
      T3 Ladder is back, 3 days late
      Nothing is late
      Saved shelf.csv
      ```
