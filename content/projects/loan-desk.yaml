            }

            public void printMembers() {
                ArrayList<String> cards = new ArrayList<>(this.members.keySet());
                Collections.sort(cards);
                for (String card : cards) {
                    System.out.println(this.members.get(card));
                }
            }
        }

  - id: loans
    title: Loans and due days
    task: |
      A loan lasts 7 days: a tool lent on day 4 is due back on day 11, and it's late from day 12 on. A new file, `Loan.java`, holds the class `Loan`. Write it:

      - a constructor `Loan(Tool tool, Member member, int dueDay)`
      - `getTool()`, `getMember()` and `getDueDay()`
      - `isLate(int today)`, which returns `true` when `today` is after the due day
      - `toString()`, which returns the tool, a colon, the member and the due day: `T3 Ladder: Noor (M1), due day 11`
      - Loan implements `Comparable<Loan>`: its natural order is by due day, and loans with the same due day are in the order of their tools' codes.

      Then add to ToolShelf a third map, a `HashMap<String, Loan>` called `loans`, with the loans by their tools' codes (a tool can be out only once), and these methods:

      - `lend(String toolCode, String card, int today)` creates a loan of that tool to that member, due on `today + 7`, puts it in the map and returns it. For now, it may assume that the tool and the member exist and that the tool is on the shelf.
      - `giveBack(String toolCode, int today)` removes the tool's loan and returns how many days late it was: 0 when it's back on or before its due day.
      - `printLoans()` prints every loan in the order of the tools' codes, or `No tools are out` when there are none.
      - `printLate(int today)` prints the loans that are late on that day, in their natural order (by due day), or `Nothing is late`.

      The check runs:

      ```java fragment
      ToolShelf shelf = new ToolShelf();
      shelf.addTool(new Tool("T1", "Cordless drill"));
      shelf.addTool(new Tool("T2", "Hand saw"));
      shelf.addTool(new Tool("T3", "Ladder"));
      shelf.addMember(new Member("M1", "Noor"));
      shelf.addMember(new Member("M2", "Ilse"));
      shelf.printLoans();
      System.out.println(shelf.lend("T3", "M1", 4));
      shelf.lend("T1", "M2", 6);
      shelf.printLoans();
      System.out.println("Late on day 12:");
      shelf.printLate(12);
      System.out.println("Late on day 14:");
      shelf.printLate(14);
      ```

      and expects:

      ```
      No tools are out
      T3 Ladder: Noor (M1), due day 11
      T1 Cordless drill: Ilse (M2), due day 13
      T3 Ladder: Noor (M1), due day 11
      Late on day 12:
      T3 Ladder: Noor (M1), due day 11
      Late on day 14:
      T3 Ladder: Noor (M1), due day 11
      T1 Cordless drill: Ilse (M2), due day 13
      ```
