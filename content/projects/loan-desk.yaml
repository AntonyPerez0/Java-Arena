        public class Loan implements Comparable<Loan> {
            private Tool tool;
            private Member member;
            private int dueDay;

            public Loan(Tool tool, Member member, int dueDay) {
                this.tool = tool;
                this.member = member;
                this.dueDay = dueDay;
            }

            public Tool getTool() {
                return this.tool;
            }

            public Member getMember() {
                return this.member;
            }

            public int getDueDay() {
                return this.dueDay;
            }

            public boolean isLate(int today) {
                return today > this.dueDay;
            }

            @Override
            public int compareTo(Loan other) {
                if (this.dueDay != other.dueDay) {
                    return Integer.compare(this.dueDay, other.dueDay);
                }
                return this.tool.getCode().compareTo(other.tool.getCode());
            }

            @Override
            public String toString() {
                return this.tool + ": " + this.member + ", due day " + this.dueDay;
            }
        }
