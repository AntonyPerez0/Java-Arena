  - id: loading
    title: Loading, and damaged lines
    task: |
      Now the other direction. Add to ToolShelf a method `load(String fileName)` that reads a file that `save` wrote and adds its tools, members and loans to the shelf. It reads the file with a Scanner, line by line, and splits each line at the commas:

      - `tool,T1,Cordless drill` adds a tool, and `member,M1,Noor` a member.
      - `loan,T3,M1,11` puts a loan of the tool T3 to the member M1, due on day 11, straight into the loans map (it's a loan that was already made, so `lend`'s rules don't apply). The tool and the member must already be on the shelf: find them with `getTool` and `getMember`, which throw when they aren't.
      - An empty line is skipped.

      A file can be damaged, for example by someone who edited it by hand. Then `load` throws a LoanException whose message starts with `Line `, the number of the line (the first line is 1, and empty lines count) and a colon:

      - a line that isn't one of the three kinds, or doesn't have their number of parts: `Line 3: Can't read gadget,X1`, with the whole line
      - a due day that isn't a whole number: `Line 4: Not a day number: soon`
      - a tool or a member that isn't on the shelf: `Line 5: No tool with the code T9`, with `getTool`'s or `getMember`'s message

      The lines before the damaged one stay loaded. `load` declares `throws IOException, LoanException`: a file that can't be read at all throws an IOException, as Scanner does.

      The check gives the program this `shelf.csv`:

      ```text
      tool,T1,Cordless drill
      tool,T3,Ladder
      member,M1,Noor
      member,M2,Ilse
      loan,T3,M1,11
      loan,T1,M2,15
      ```

      and runs:

      ```java fragment
      ToolShelf shelf = new ToolShelf();
      shelf.load("shelf.csv");
      shelf.printTools();
      shelf.printMembers();
      shelf.printLoans();
      shelf.printLate(14);
      ```

      It expects:

      ```
      T1 Cordless drill
      T3 Ladder
      Noor (M1)
      Ilse (M2)
      T1 Cordless drill: Ilse (M2), due day 15
      T3 Ladder: Noor (M1), due day 11
      T3 Ladder: Noor (M1), due day 11
      ```
    hints:
      - "Count the lines in a variable that grows by one for every line read, before the empty ones are skipped. Read each line in a method of its own, such as `private void readLine(String line) throws LoanException`, and call it in a `try` block: `catch (LoanException e)` throws a new one, `new LoanException(\"Line \" + number + \": \" + e.getMessage())`."
      - "In that method, `String[] parts = line.split(\",\");`, then check the kind and the length together: `parts[0].equals(\"loan\") && parts.length == 4`. Turn the day into a number with `Integer.parseInt` in a `try` block, and catch its NumberFormatException to throw a LoanException instead."
    require:
      - pattern: \bcatch\s*\(\s*NumberFormatException\b
        message: "Catch the NumberFormatException of a due day that isn't a number, and throw a LoanException instead."
      - pattern: \bnew\s+Scanner\s*\(\s*Paths\.get\s*\(
        message: "Read the file with `new Scanner(Paths.get(fileName))`."
