      TextUi.java: |
        import java.io.IOException;
        import java.util.Scanner;

        public class TextUi {
            private Scanner scanner;
            private ToolShelf shelf;
            private int today;

            public TextUi(Scanner scanner, ToolShelf shelf) {
                this.scanner = scanner;
                this.shelf = shelf;
                this.today = 1;
            }

            public void start() {
                try {
                    this.shelf.load("shelf.csv");
                } catch (IOException e) {
                    System.out.println("No shelf.csv yet, so the shelf starts empty");
                } catch (LoanException e) {
                    System.out.println("Can't load shelf.csv. " + e.getMessage());
                    return;
                }
                while (this.scanner.hasNextLine()) {
                    String command = this.scanner.nextLine();
                    if (command.equals("quit")) {
                        break;
                    }
                    try {
                        this.handle(command);
                    } catch (LoanException e) {
                        System.out.println("Sorry: " + e.getMessage());
                    }
                }
                try {
                    this.shelf.save("shelf.csv");
                    System.out.println("Saved shelf.csv");
                } catch (IOException e) {
                    System.out.println("Could not save: " + e.getMessage());
                }
            }

            private void handle(String command) throws LoanException {
                String[] parts = command.split(" ");
                if (command.equals("tools")) {
                    this.shelf.printTools();
                } else if (command.equals("members")) {
                    this.shelf.printMembers();
                } else if (command.equals("loans")) {
                    this.shelf.printLoans();
                } else if (command.equals("late")) {
                    this.shelf.printLate(this.today);
                } else if (parts[0].equals("day") && parts.length == 2) {
                    this.changeDay(parts[1]);
                } else if (parts[0].equals("lend") && parts.length == 3) {
                    Loan loan = this.shelf.lend(parts[1], parts[2], this.today);
                    System.out.println("Lent: " + loan);
                } else if (parts[0].equals("return") && parts.length == 2) {
                    this.giveBack(parts[1]);
                } else {
                    System.out.println("Unknown command: " + command);
                }
            }

            private void changeDay(String text) {
                int day = 0;
                try {
                    day = Integer.parseInt(text);
                } catch (NumberFormatException e) {
                    System.out.println("Not a day number: " + text);
                    return;
                }
                if (day < this.today) {
                    System.out.println("The day can't go back: it's day " + this.today);
                    return;
                }
                this.today = day;
                System.out.println("It's day " + this.today);
            }

            private void giveBack(String code) throws LoanException {
                int late = this.shelf.giveBack(code, this.today);
                String text = this.shelf.getTool(code) + " is back";
                if (late == 1) {
                    text = text + ", 1 day late";
                } else if (late > 1) {
                    text = text + ", " + late + " days late";
                }
                System.out.println(text);
            }
        }
