      ToolShelf.java: |
        import java.util.ArrayList;
        import java.util.Collections;
        import java.util.HashMap;

        public class ToolShelf {
            private HashMap<String, Tool> tools;
            private HashMap<String, Member> members;
            private HashMap<String, Loan> loans;

            public ToolShelf() {
                this.tools = new HashMap<>();
                this.members = new HashMap<>();
                this.loans = new HashMap<>();
            }

            public void addTool(Tool tool) {
                this.tools.put(tool.getCode(), tool);
            }

            public void addMember(Member member) {
                this.members.put(member.getCard(), member);
            }

            public void printTools() {
                ArrayList<String> codes = new ArrayList<>(this.tools.keySet());
                Collections.sort(codes);
                for (String code : codes) {
                    System.out.println(this.tools.get(code));
                }
            }

            public void printMembers() {
                ArrayList<String> cards = new ArrayList<>(this.members.keySet());
                Collections.sort(cards);
                for (String card : cards) {
                    System.out.println(this.members.get(card));
                }
            }

            public Loan lend(String toolCode, String card, int today) {
                Loan loan = new Loan(this.tools.get(toolCode), this.members.get(card), today + 7);
                this.loans.put(toolCode, loan);
                return loan;
            }

            public int giveBack(String toolCode, int today) {
                Loan loan = this.loans.get(toolCode);
                this.loans.remove(toolCode);
                if (loan.isLate(today)) {
                    return today - loan.getDueDay();
                }
                return 0;
            }

            public void printLoans() {
                if (this.loans.isEmpty()) {
                    System.out.println("No tools are out");
                }
                ArrayList<String> codes = new ArrayList<>(this.loans.keySet());
                Collections.sort(codes);
                for (String code : codes) {
                    System.out.println(this.loans.get(code));
                }
            }

            public void printLate(int today) {
                ArrayList<Loan> late = new ArrayList<>();
                for (Loan loan : this.loans.values()) {
                    if (loan.isLate(today)) {
                        late.add(loan);
                    }
                }
                if (late.isEmpty()) {
                    System.out.println("Nothing is late");
                }
                Collections.sort(late);
                for (Loan loan : late) {
                    System.out.println(loan);
                }
            }
        }
      Loan.java: |
        public class Loan implements Comparable<Loan> {
            private Tool tool;
            private Member member;
            private int dueDay;

            public Loan(Tool tool, Member member, int dueDay) {
                this.tool = tool;
                this.member = member;
                this.dueDay = dueDay;
            }

            public Tool getTool() {
                return this.tool;
            }

            public Member getMember() {
                return this.member;
            }

            public int getDueDay() {
                return this.dueDay;
            }

            public boolean isLate(int today) {
                return today > this.dueDay;
            }

            @Override
            public int compareTo(Loan other) {
                if (this.dueDay != other.dueDay) {
                    return Integer.compare(this.dueDay, other.dueDay);
                }
                return this.tool.getCode().compareTo(other.tool.getCode());
            }

            @Override
            public String toString() {
                return this.tool + ": " + this.member + ", due day " + this.dueDay;
            }
        }

  - id: refusals
    title: Refusals
    task: |
      So far, `lend` trusts what it's given. At a real desk, people mistype codes and ask for tools that are already out. Now the shelf refuses such loans with an exception of its own kind, so the desk can show the reason and go on.

      In the new file `LoanException.java`, make `LoanException` a checked exception: it extends `Exception`, and its constructor takes the message and hands it on with `super(message)`.

      Then add to ToolShelf:

      - `getTool(String code)`, which returns the tool with that code, or throws a LoanException with the message `No tool with the code T9` (with the code it was given)
      - `getMember(String card)`, the same for members: `No member with the card M7`

      and change `lend` and `giveBack` so that they declare `throws LoanException` and refuse, before anything changes:

      - `lend`: a tool or a member that doesn't exist, with the messages above; a tool that is already out: `T1 Cordless drill is out, due back on day 10`; and a member who already has 2 tools out: `Noor (M1) already has 2 tools`. Check in this order and refuse at the first problem: the tool exists, the member exists, the tool is on the shelf, the member has fewer than 2 tools out. So a tool that is out gets the `is out` message even when the member also has 2 tools.
      - `giveBack`: a tool that doesn't exist, and a tool that isn't out: `T3 Ladder is not out`

      The check runs:

      ```java fragment
      ToolShelf shelf = new ToolShelf();
      shelf.addTool(new Tool("T1", "Cordless drill"));
      shelf.addTool(new Tool("T2", "Hand saw"));
      shelf.addTool(new Tool("T3", "Ladder"));
      shelf.addMember(new Member("M1", "Noor"));
      shelf.lend("T1", "M1", 3);
      shelf.lend("T2", "M1", 3);
      try {
          shelf.lend("T9", "M1", 5);
      } catch (LoanException e) {
          System.out.println(e.getMessage());
      }
      try {
          shelf.lend("T3", "M7", 5);
      } catch (LoanException e) {
          System.out.println(e.getMessage());
      }
      try {
          shelf.lend("T1", "M1", 5);
      } catch (LoanException e) {
          System.out.println(e.getMessage());
      }
      try {
          shelf.lend("T3", "M1", 5);
      } catch (LoanException e) {
          System.out.println(e.getMessage());
      }
      ```

      and expects:

      ```
      No tool with the code T9
      No member with the card M7
      T1 Cordless drill is out, due back on day 10
      Noor (M1) already has 2 tools
      ```
    files:
      LoanException.java: |
        public class LoanException extends Exception {

        }
    hints:
      - "LoanException needs only a constructor: `public LoanException(String message) { super(message); }`. In `getTool`, check `this.tools.containsKey(code)` and throw before calling `get`."
      - "In `lend`, call `getTool` and `getMember` first: they throw for you. Then check `this.loans.containsKey(toolCode)`, and count the member's loans in `this.loans.values()` by comparing `loan.getMember().getCard()` with the card. Create the loan only after all the checks."
    require:
      - pattern: \bclass\s+LoanException\s+extends\s+Exception\b
        message: "Make LoanException a checked exception: `public class LoanException extends Exception`."
      - pattern: \bthrow\s+new\s+LoanException\s*\(
        message: "Refuse with `throw new LoanException(...)`."
