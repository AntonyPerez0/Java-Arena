  - id: saving
    title: Saving to a CSV file
    task: |
      The shelf forgets everything when the program ends. Add to ToolShelf a method `save(String fileName)` that writes the whole shelf into that file in CSV form: one line per tool, member and loan, with the parts separated by commas.

      - first the tools, in the order of their codes: `tool`, the code and the name
      - then the members, in the order of their cards: `member`, the card and the name
      - last the loans, in the order of the tools' codes: `loan`, the tool's code, the member's card and the due day

      Write the file with a PrintWriter in try-with-resources, so it's closed when the method ends. `save` declares `throws IOException`: the code that calls it decides what to do when the file can't be written. Names have no commas in them, so a comma always separates two parts.

      The check builds a shelf, lends the hand saw to Ilse on day 4, and calls `save("shelf.csv")`:

      ```java fragment
      ToolShelf shelf = new ToolShelf();
      shelf.addTool(new Tool("T2", "Hand saw"));
      shelf.addTool(new Tool("T1", "Cordless drill"));
      shelf.addMember(new Member("M2", "Ilse"));
      shelf.addMember(new Member("M1", "Noor"));
      shelf.lend("T2", "M2", 4);
      shelf.save("shelf.csv");
      ```

      It prints nothing, and `shelf.csv` holds:

      ```text
      tool,T1,Cordless drill
      tool,T2,Hand saw
      member,M1,Noor
      member,M2,Ilse
      loan,T2,M2,11
      ```
    hints:
      - "`try (PrintWriter writer = new PrintWriter(fileName)) { ... }`, with imports for `java.io.PrintWriter` and `java.io.IOException`. Inside, three loops over sorted keys, as in `printTools`, `printMembers` and `printLoans`."
      - "A loan's line: `writer.println(\"loan,\" + code + \",\" + loan.getMember().getCard() + \",\" + loan.getDueDay());`. Use the getters, not `toString`: the file needs the parts, not the text the desk shows."
    require:
      - pattern: \bnew\s+PrintWriter\s*\(
        message: "Write the file with a `PrintWriter`."
      - pattern: \bvoid\s+save\s*\(\s*String\s+\w+\s*\)\s*throws\s+IOException\b
        message: "Declare `public void save(String fileName) throws IOException`."
