  - id: save-and-load
    title: Saving and loading
    task: |
      Last, the player can stop and come back later. `save` writes the state of the game to a file, `save.txt`, and `load` reads it back. The file uses the same style of lines as `world.txt`:

      ```text
      at;Boathouse
      moves;3
      carry;oil
      carry;key
      lock;Cottage;east;key
      ```

      - `at;Boathouse`: the room the player is in. Always the first line.
      - `moves;3`: the player's count of moves. Always the second line.
      - `carry;oil`: one line for each item the player carries, in their order.
      - Then, for each room in the order of the world file: an `item;...` line for each item in it, as in `world.txt` (`item;rope;Shore`), and a `lock;...` line for each exit of it that is still locked (as above).

      ### Writing a file

      Module 43 covers writing files in depth; here's the part you need. The class `PrintWriter` (`import java.io.PrintWriter;`) writes text into a file, with the same `println` you know from `System.out`. Open it in a `try (...)` as you open a Scanner for a file: the `try` also closes it at the end of the block, and only then is all the text in the file. Creating it makes the file, or empties it when it's already there.

      ```java fragment
      try (PrintWriter writer = new PrintWriter("save.txt")) {
          writer.println("at;" + player.getRoom().getName());
      } catch (Exception e) {
          System.out.println("Error: " + e.getMessage());
      }
      ```

      ### What to do

      1. Give `Player` the methods `getItems()` (returns the list), `clearItems()` and `setMoves(int moves)`. Give `Room` the methods `getItems()`, `getExits()`, `clearItems()` and `openAll()` (every exit's key becomes `""`).
      2. The command `save` writes `save.txt` as described above and prints `Game saved.`
      3. The command `load` reads `save.txt`. It first empties the player's and every room's items and opens every exit, then goes through the lines: `at` moves the player there, `moves` sets the count with `setMoves` (the file's `at` line comes first, and moving the player there with `moveTo` adds 1, which this line then overwrites), `carry` gives the player the item, and `item` and `lock` lines work as in `world.txt`. Then it prints `Game loaded.` and the room the player is in. When there's no `save.txt`, it prints `There is no saved game.` and the game goes on as it was.

      With the whole lighthouse world and the commands `go north`, `take oil`, `go south`, `go east`, `take key`, `save` and `quit`, the program writes the file above and prints:

      ```
      [Shore]
      Cold waves break on gray pebbles.
      Exits: north, east
      [Cottage]
      A keeper's cottage. The stove is cold.
      Exits: south, east
      You see: oil
      You take the oil.
      [Shore]
      Cold waves break on gray pebbles.
      Exits: north, east
      [Boathouse]
      An old rowboat lies upside down. It smells of tar.
      Exits: west
      You see: key
      You take the key.
      Game saved.
      Goodbye.
      ```
    hints:
      - "Write `save(Player player, ArrayList<Room> rooms)` and `load(Player player, ArrayList<Room> rooms)` in `Main`. Saving is three loops inside the `try`: the player's items, then the rooms, and inside each room its items and its exits (`if (exit.isLocked())`)."
      - "Loading reads `save.txt` the way `main` reads `world.txt`: split each line at `;` and look at `parts[0]`. Empty the items and open the exits right after the file is opened, inside the `try`, so nothing changes when there's no file."
      - "`Integer.valueOf(parts[1])` turns the moves into a number. Print `There is no saved game.` in the `catch` block."
