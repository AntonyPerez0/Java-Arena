    solution:
      Main.java: |
        import java.io.PrintWriter;
        import java.nio.file.Paths;
        import java.util.ArrayList;
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                ArrayList<Room> rooms = new ArrayList<>();
                String goalRoom = "";
                String goalItem = "";
                String goalText = "";
                try (Scanner file = new Scanner(Paths.get("world.txt"))) {
                    while (file.hasNextLine()) {
                        String[] parts = file.nextLine().split(";");
                        if (parts[0].equals("room")) {
                            rooms.add(new Room(parts[1], parts[2]));
                        } else if (parts[0].equals("exit")) {
                            findRoom(rooms, parts[1]).addExit(new Exit(parts[2], parts[3]));
                        } else if (parts[0].equals("item")) {
                            findRoom(rooms, parts[2]).addItem(parts[1]);
                        } else if (parts[0].equals("lock")) {
                            findRoom(rooms, parts[1]).lock(parts[2], parts[3]);
                        } else if (parts[0].equals("goal")) {
                            goalRoom = parts[1];
                            goalItem = parts[2];
                            goalText = parts[3];
                        }
                    }
                } catch (Exception e) {
                    System.out.println("Error: " + e.getMessage());
                }

                Player player = new Player(rooms.get(0));
                System.out.println(player.getRoom());
                Scanner scanner = new Scanner(System.in);
                while (scanner.hasNextLine()) {
                    String command = scanner.nextLine();
                    if (command.equals("quit")) {
                        System.out.println("Goodbye.");
                        break;
                    } else if (command.equals("look")) {
                        System.out.println(player.getRoom());
                    } else if (command.startsWith("go ")) {
                        move(player, rooms, command.substring(3));
                    } else if (command.startsWith("take ")) {
                        take(player, command.substring(5));
                    } else if (command.startsWith("drop ")) {
                        drop(player, command.substring(5));
                    } else if (command.equals("inventory")) {
                        System.out.println(player.inventory());
                    } else if (command.startsWith("use ")) {
                        use(player, command.substring(4));
                    } else if (command.equals("save")) {
                        save(player, rooms);
                    } else if (command.equals("load")) {
                        load(player, rooms);
                    } else {
                        System.out.println("I don't understand \"" + command + "\".");
                    }

                    if (player.getRoom().getName().equals(goalRoom) && player.has(goalItem)) {
                        System.out.println(goalText);
                        System.out.println("You won in " + player.getMoves() + " moves.");
                        break;
                    }
                }
            }

            public static Room findRoom(ArrayList<Room> rooms, String name) {
                for (Room room : rooms) {
                    if (room.getName().equals(name)) {
                        return room;
                    }
                }
                // Every room name in world.txt belongs to a room line, so this isn't reached.
                return rooms.get(0);
            }

            public static void move(Player player, ArrayList<Room> rooms, String direction) {
                String target = player.getRoom().getTarget(direction);
                if (target.isEmpty()) {
                    System.out.println("You can't go " + direction + " from here.");
                } else if (player.getRoom().isLocked(direction)) {
                    System.out.println("The way " + direction + " is locked.");
                } else {
                    player.moveTo(findRoom(rooms, target));
                    System.out.println(player.getRoom());
                }
            }

            public static void take(Player player, String item) {
                Room room = player.getRoom();
                if (room.hasItem(item)) {
                    room.removeItem(item);
                    player.take(item);
                    System.out.println("You take the " + item + ".");
                } else {
                    System.out.println("There is no " + item + " here.");
                }
            }

            public static void drop(Player player, String item) {
                if (player.has(item)) {
                    player.drop(item);
                    player.getRoom().addItem(item);
                    System.out.println("You drop the " + item + ".");
                } else {
                    System.out.println("You aren't carrying the " + item + ".");
                }
            }

            public static void use(Player player, String item) {
                if (!player.has(item)) {
                    System.out.println("You aren't carrying the " + item + ".");
                    return;
                }
                String direction = player.getRoom().unlock(item);
                if (direction.isEmpty()) {
                    System.out.println("Nothing happens.");
                } else {
                    System.out.println("You unlock the way " + direction + " with the " + item + ".");
                }
            }

            public static void save(Player player, ArrayList<Room> rooms) {
                try (PrintWriter writer = new PrintWriter("save.txt")) {
                    writer.println("at;" + player.getRoom().getName());
                    writer.println("moves;" + player.getMoves());
                    for (String item : player.getItems()) {
                        writer.println("carry;" + item);
                    }
                    for (Room room : rooms) {
                        for (String item : room.getItems()) {
                            writer.println("item;" + item + ";" + room.getName());
                        }
                        for (Exit exit : room.getExits()) {
                            if (exit.isLocked()) {
                                writer.println("lock;" + room.getName() + ";" + exit.getDirection() + ";" + exit.getKey());
                            }
                        }
                    }
                    System.out.println("Game saved.");
                } catch (Exception e) {
                    System.out.println("Error: " + e.getMessage());
                }
            }

            public static void load(Player player, ArrayList<Room> rooms) {
                try (Scanner file = new Scanner(Paths.get("save.txt"))) {
                    player.clearItems();
                    for (Room room : rooms) {
                        room.clearItems();
                        room.openAll();
                    }
                    while (file.hasNextLine()) {
                        String[] parts = file.nextLine().split(";");
                        if (parts[0].equals("at")) {
                            player.moveTo(findRoom(rooms, parts[1]));
                        } else if (parts[0].equals("moves")) {
                            player.setMoves(Integer.valueOf(parts[1]));
                        } else if (parts[0].equals("carry")) {
                            player.take(parts[1]);
                        } else if (parts[0].equals("item")) {
                            findRoom(rooms, parts[2]).addItem(parts[1]);
                        } else if (parts[0].equals("lock")) {
                            findRoom(rooms, parts[1]).lock(parts[2], parts[3]);
                        }
                    }
                    System.out.println("Game loaded.");
                    System.out.println(player.getRoom());
                } catch (Exception e) {
                    System.out.println("There is no saved game.");
                }
            }
        }
