        message: "Write a method `findRoom` and use it to find rooms by name."
    solution:
      Main.java: |
        import java.nio.file.Paths;
        import java.util.ArrayList;
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                ArrayList<Room> rooms = new ArrayList<>();
                try (Scanner file = new Scanner(Paths.get("world.txt"))) {
                    while (file.hasNextLine()) {
                        String[] parts = file.nextLine().split(";");
                        if (parts[0].equals("room")) {
                            rooms.add(new Room(parts[1], parts[2]));
                        } else if (parts[0].equals("exit")) {
                            findRoom(rooms, parts[1]).addExit(new Exit(parts[2], parts[3]));
                        }
                    }
                } catch (Exception e) {
                    System.out.println("Error: " + e.getMessage());
                }

                Player player = new Player(rooms.get(0));
                System.out.println(player.getRoom());
                Scanner scanner = new Scanner(System.in);
                while (scanner.hasNextLine()) {
                    String command = scanner.nextLine();
                    if (command.equals("quit")) {
                        System.out.println("Goodbye.");
                        break;
                    } else if (command.equals("look")) {
                        System.out.println(player.getRoom());
                    } else if (command.startsWith("go ")) {
                        move(player, rooms, command.substring(3));
                    } else {
                        System.out.println("I don't understand \"" + command + "\".");
                    }
                }
            }

            public static Room findRoom(ArrayList<Room> rooms, String name) {
                for (Room room : rooms) {
                    if (room.getName().equals(name)) {
                        return room;
                    }
                }
                // Every room name in world.txt belongs to a room line, so this isn't reached.
                return rooms.get(0);
            }

            public static void move(Player player, ArrayList<Room> rooms, String direction) {
                String target = player.getRoom().getTarget(direction);
                if (target.isEmpty()) {
                    System.out.println("You can't go " + direction + " from here.");
                } else {
                    player.moveTo(findRoom(rooms, target));
                    System.out.println(player.getRoom());
                }
            }
        }
      Room.java: |
        import java.util.ArrayList;

        public class Room {
            private String name;
            private String description;
            private ArrayList<Exit> exits;

            public Room(String name, String description) {
                this.name = name;
                this.description = description;
                this.exits = new ArrayList<>();
            }

            public String getName() {
                return this.name;
            }

            public void addExit(Exit exit) {
                this.exits.add(exit);
            }

            public String getTarget(String direction) {
                for (Exit exit : this.exits) {
                    if (exit.getDirection().equals(direction)) {
                        return exit.getTarget();
                    }
                }
                return "";
            }

            public String toString() {
                String text = "[" + this.name + "]\n" + this.description;
                if (!this.exits.isEmpty()) {
                    text += "\nExits: ";
                    for (int i = 0; i < this.exits.size(); i++) {
                        if (i > 0) {
                            text += ", ";
                        }
                        text += this.exits.get(i).getDirection();
                    }
                }
                return text;
            }
        }
      Player.java: |
        public class Player {
            private Room room;

            public Player(Room room) {
                this.room = room;
            }

            public Room getRoom() {
                return this.room;
            }

            public void moveTo(Room room) {
                this.room = room;
            }
        }
      Exit.java: |
        public class Exit {
            private String direction;
            private String target;

            public Exit(String direction, String target) {
                this.direction = direction;
                this.target = target;
            }

            public String getDirection() {
                return this.direction;
            }

            public String getTarget() {
                return this.target;
            }
        }
  - id: items
    title: Things to carry
    task: |
      Time for things to pick up. A line such as `item;oil;Cottage` puts the item `oil` in the room called Cottage. An item is just its name, a `String`.

      1. Give `Room` a list of the items in it, an `ArrayList<String>`, with the methods `addItem(String item)`, `hasItem(String item)` (true when the item is in the room) and `removeItem(String item)`.
      2. When a room has items, its `toString()` ends with one more line, after the exits: `You see: oil, rope`, in the order they were added. A room without items prints as before.
      3. Give `Player` a list of the items they carry, with the methods `take(String item)` (adds it), `has(String item)`, `drop(String item)` (removes it) and `inventory()`, which returns `You carry: shell, oil` in the order they were taken, or `You carry nothing.` when the list is empty.
      4. In `Main`, put each item line's item into its room, and add three commands:
         - `take oil` moves the oil from the room to the player and prints `You take the oil.` When the room has no oil, it prints `There is no oil here.`
         - `drop oil` moves it from the player to the end of the room's items and prints `You drop the oil.` When the player doesn't carry it, it prints `You aren't carrying the oil.`
         - `inventory` prints what `inventory()` returns.

      With this `world.txt`

      ```text
      room;Shore;Cold waves break on gray pebbles.
      room;Cottage;A keeper's cottage. The stove is cold.
      room;Boathouse;An old rowboat lies upside down. It smells of tar.
      exit;Shore;north;Cottage
      exit;Shore;east;Boathouse
      exit;Cottage;south;Shore
      exit;Boathouse;west;Shore
      item;shell;Shore
      item;oil;Cottage
      item;rope;Cottage
      ```

      and the commands `inventory`, `take shell`, `take shell`, `go north`, `take oil`, `inventory`, `drop shell`, `look` and `quit`, the program prints:

      ```
      [Shore]
      Cold waves break on gray pebbles.
      Exits: north, east
      You see: shell
      You carry nothing.
      You take the shell.
      There is no shell here.
      [Cottage]
      A keeper's cottage. The stove is cold.
      Exits: south
      You see: oil, rope
      You take the oil.
      You carry: shell, oil
      You drop the shell.
      [Cottage]
      A keeper's cottage. The stove is cold.
      Exits: south
      You see: rope, shell
      Goodbye.
      ```
    hints:
      - "The list methods of module 14 do the work: `contains` for `hasItem` and `has`, `remove` with the item's name for `removeItem` and `drop`."
      - "`take(Player player, String item)` and `drop(Player player, String item)` in `Main` keep the loop short. The room is `player.getRoom()`: check with `hasItem` or `has` first, then move the item."
      - "`inventory()` joins the names with commas just as the exits are joined in `toString()`."
    tests:
