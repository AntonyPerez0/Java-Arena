        import java.util.ArrayList;

        public class Room {
            private String name;
            private String description;
            private ArrayList<Exit> exits;
            private ArrayList<String> items;

            public Room(String name, String description) {
                this.name = name;
                this.description = description;
                this.exits = new ArrayList<>();
                this.items = new ArrayList<>();
            }

            public String getName() {
                return this.name;
            }

            public void addExit(Exit exit) {
                this.exits.add(exit);
            }

            public ArrayList<Exit> getExits() {
                return this.exits;
            }

            public String getTarget(String direction) {
                for (Exit exit : this.exits) {
                    if (exit.getDirection().equals(direction)) {
                        return exit.getTarget();
                    }
                }
                return "";
            }

            public void lock(String direction, String key) {
                for (Exit exit : this.exits) {
                    if (exit.getDirection().equals(direction)) {
                        exit.setKey(key);
                    }
                }
            }

            public boolean isLocked(String direction) {
                for (Exit exit : this.exits) {
                    if (exit.getDirection().equals(direction)) {
                        return exit.isLocked();
                    }
                }
                return false;
            }

            public String unlock(String item) {
                for (Exit exit : this.exits) {
                    if (exit.isLocked() && exit.getKey().equals(item)) {
                        exit.setKey("");
                        return exit.getDirection();
                    }
                }
                return "";
            }

            public void openAll() {
                for (Exit exit : this.exits) {
                    exit.setKey("");
                }
            }

            public void addItem(String item) {
                this.items.add(item);
            }

            public boolean hasItem(String item) {
                return this.items.contains(item);
            }

            public void removeItem(String item) {
                this.items.remove(item);
            }

            public ArrayList<String> getItems() {
                return this.items;
            }

            public void clearItems() {
                this.items.clear();
            }

            public String toString() {
                String text = "[" + this.name + "]\n" + this.description;
                if (!this.exits.isEmpty()) {
                    text += "\nExits: ";
                    for (int i = 0; i < this.exits.size(); i++) {
                        if (i > 0) {
                            text += ", ";
                        }
                        text += this.exits.get(i).getDirection();
                    }
                }
                if (!this.items.isEmpty()) {
                    text += "\nYou see: ";
                    for (int i = 0; i < this.items.size(); i++) {
                        if (i > 0) {
                            text += ", ";
                        }
                        text += this.items.get(i);
                    }
                }
                return text;
            }
        }
