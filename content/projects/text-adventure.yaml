    title: A locked door
    task: |
      Some ways are locked. A line such as `lock;Cottage;east;key` locks the exit east from the Cottage, and the item `key` opens it. A lock line comes after the exit line it locks.

      1. Give `Exit` a third instance variable, `key`: the item that opens it, or `""` when the exit isn't locked. The constructor stays as it is and sets `key` to `""`. Add the methods `getKey()`, `setKey(String key)` and `isLocked()`, which is true when the key isn't `""`.
      2. Give `Room` three methods:
         - `lock(String direction, String key)` sets the key of the exit in that direction.
         - `isLocked(String direction)` is true when the exit in that direction is locked.
         - `unlock(String item)` looks for a locked exit whose key is that item. It opens the first one it finds (its key becomes `""`) and returns its direction, or returns `""` when the item opens nothing here.
      3. In `Main`, lock the exit of each lock line. `go` through a locked exit prints `The way east is locked.` and the player stays.
      4. A new command, `use key`:
         - When the player doesn't carry the key, it prints `You aren't carrying the key.`
         - When the key opens a locked exit of the room, it prints `You unlock the way east with the key.` The player keeps the key.
         - Otherwise it prints `Nothing happens.`

