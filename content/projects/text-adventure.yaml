      - "In `getTarget`, loop over the exits and return `exit.getTarget()` when `exit.getDirection().equals(direction)`. After the loop, `return \"\";`. The caller checks the result with `isEmpty()`."
      - "To join the directions with commas, put `\", \"` before every direction except the first: loop with an index and check `i > 0`."
