                    System.out.println("You can't go " + direction + " from here.");
                } else if (player.getRoom().isLocked(direction)) {
                    System.out.println("The way " + direction + " is locked.");
                } else {
                    player.moveTo(findRoom(rooms, target));
                    System.out.println(player.getRoom());
                }
            }

            public static void take(Player player, String item) {
                Room room = player.getRoom();
                if (room.hasItem(item)) {
                    room.removeItem(item);
                    player.take(item);
                    System.out.println("You take the " + item + ".");
                } else {
                    System.out.println("There is no " + item + " here.");
                }
            }

            public static void drop(Player player, String item) {
                if (player.has(item)) {
                    player.drop(item);
                    player.getRoom().addItem(item);
                    System.out.println("You drop the " + item + ".");
                } else {
                    System.out.println("You aren't carrying the " + item + ".");
                }
            }

            public static void use(Player player, String item) {
                if (!player.has(item)) {
                    System.out.println("You aren't carrying the " + item + ".");
                    return;
                }
                String direction = player.getRoom().unlock(item);
                if (direction.isEmpty()) {
                    System.out.println("Nothing happens.");
                } else {
                    System.out.println("You unlock the way " + direction + " with the " + item + ".");
                }
            }
        }
