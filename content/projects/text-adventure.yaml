  - id: exits
    title: Exits and moves
    task: |
      Now the rooms get exits. A line such as `exit;Shore;north;Cottage` means: from the Shore, the way north leads to the Cottage. A world file lists its room lines first, so every room an exit line names already exists when the line is read. A new file, `Exit.java`, has been added to your program.

      1. Write the class `Exit`, with a constructor `Exit(String direction, String target)` and the getters `getDirection()` and `getTarget()`. The target is the name of the room the exit leads to.
      2. Give `Room` a list of its exits, an `ArrayList<Exit>` created in the constructor, and two methods:
         - `addExit(Exit exit)` adds an exit to the list.
         - `getTarget(String direction)` returns the name of the room the exit in that direction leads to, or `""` when the room has no exit that way.
      3. When a room has exits, its `toString()` ends with one more line that lists their directions in the order they were added: `Exits: north, east`. A room without exits prints as before.
      4. In `Main`, write a method `findRoom(ArrayList<Room> rooms, String name)` that returns the room of that name, and use it to add an `Exit` to the right room for each exit line.
      5. A new command, `go` and a direction such as `go north`, moves the player through that exit and prints the new room. When there's no exit that way, it prints `You can't go west from here.` (with the direction the player typed). Only a command that starts with `go ` (with the space) is a move; a bare `go` is a command the game doesn't understand.

      With this `world.txt`

      ```text
      room;Shore;Cold waves break on gray pebbles.
      room;Cottage;A keeper's cottage. The stove is cold.
      room;Boathouse;An old rowboat lies upside down. It smells of tar.
      exit;Shore;north;Cottage
      exit;Shore;east;Boathouse
      exit;Cottage;south;Shore
      exit;Boathouse;west;Shore
      ```

      and the commands `go north`, `go west`, `go south` and `quit`, the program prints:

      ```
      [Shore]
      Cold waves break on gray pebbles.
      Exits: north, east
      [Cottage]
      A keeper's cottage. The stove is cold.
      Exits: south
      You can't go west from here.
      [Shore]
      Cold waves break on gray pebbles.
      Exits: north, east
      Goodbye.
      ```
