milestones:
  - id: rooms
    title: Rooms and commands
    task: |
      The starting code reads `world.txt` line by line and splits each line at `;`. A line such as `room;Shore;Cold waves break on gray pebbles.` is a room: its name, then its description. `Player.java` is ready: a player is always in one room.

      1. Write the class `Room`, with a constructor `Room(String name, String description)`, a getter `getName()`, and a `toString()` that returns the name in square brackets, a line break (`\n`), and the description:

         ```text
         [Shore]
         Cold waves break on gray pebbles.
         ```

      2. In `main`, create a `Room` from each room line and add it to `rooms`.
      3. Create a `Player` in the first room of the list and print that room.
      4. Then read commands, one per line, until the player types `quit`:
         - `look` prints the room again.
         - `quit` prints `Goodbye.` and ends the game.
         - Anything else prints `I don't understand "dance".`, with the command in the quotes.

           Inside quotes, `\"` is a quote character: `"say \"hi\""` prints `say "hi"`.

      With this `world.txt`

      ```text
      room;Shore;Cold waves break on gray pebbles.
      room;Cottage;A keeper's cottage. The stove is cold.
      ```

      and the commands `look`, `dance` and `quit`, the program prints:

      ```
      [Shore]
      Cold waves break on gray pebbles.
      [Shore]
      Cold waves break on gray pebbles.
      I don't understand "dance".
      Goodbye.
      ```
    hints:
      - "`rooms.add(new Room(parts[1], parts[2]));` goes inside the `if` of the room lines. The game starts in `rooms.get(0)`: `Player player = new Player(rooms.get(0));`."
      - "Read the commands in a `while (scanner.hasNextLine())` loop. Compare each one with `equals`, and leave the loop with `break` after printing `Goodbye.`"
      - "The line with the quotes: `\"I don't understand \\\"\" + command + \"\\\".\"`"
