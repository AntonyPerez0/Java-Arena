# The topics reference (/topics/): Java keywords, classes, methods and ideas, A to Z, each with one
# plain line and the steps that teach it. The content build (scripts/build-content.mjs, with
# scripts/content/topics.mjs) checks every entry against the lessons: each step id must exist, and
# the term or one of its check phrases must appear in that step (a keyword, literal, annotation,
# operator, separator, class or method in its code; an idea or a tool anywhere in its text). See
# content/README.md, "The topics reference".
#
#   term     what the reader looks for
#   kind     keyword, literal, annotation, operator, separator, class, method, idea or tool
#   about    one line saying what it is, true for Java 21 (inline `code` allowed)
#   steps    one to three step ids, the step that teaches it first
#   aliases  other words the search also finds (optional; the check doesn't use them)
#   check    phrases the check accepts in a step that doesn't have the term itself (optional):
#            specific ones that only the steps teaching it have, in at most 5% of all the steps
#   drills   the Deathmatch topic that practices it (optional)

# ---------------------------------------------------------------- keywords, literals, annotations, operators and separators
- term: abstract
  kind: keyword
  about: Marks a class that can't be made into objects, or a method without a body that every concrete subclass must have.
  steps: [inheritance-abstract, interfaces-collection]
  drills: inheritance

- term: boolean
  kind: keyword
  about: The primitive type of the two truth values, `true` and `false`.
  aliases: ["true", "false", Boolean]
  steps: [variables-doubles-booleans, boolean-logic-variables]
  drills: boolean-logic

- term: break
  kind: keyword
  about: Leaves the innermost loop or switch at once; the program goes on after it.
  steps: [loops-while-break, switch-and-text-switch-statements]
  drills: loops

- term: case
  kind: keyword
  about: One label of a switch, with the code that runs when the value matches it.
  steps: [switch-and-text-switch-statements, switch-and-text-switch-expressions]
  drills: switch-and-text

- term: catch
  kind: keyword
  about: Follows a try block and handles the exceptions of the class it names (and its subclasses), so the program can go on.
  steps: [exceptions-catching, exceptions-choosing, reading-files-errors]
  drills: exceptions

- term: char
  kind: keyword
  about: The primitive type of a single character, written in single quotes, such as `'a'`.
  steps: [strings-characters, references-primitives]
  drills: strings

- term: class
  kind: keyword
  about: Declares a class, the blueprint of objects, with their instance variables, constructors and methods.
  steps: [classes-creating, classes-constructor, classes-methods]
  drills: classes

- term: continue
  kind: keyword
  about: Skips the rest of the loop's body and goes on with the next round.
  steps: [loops-continue]
  drills: loops

- term: default
  kind: keyword
  about: The branch of a switch that runs when no case matches.
  steps: [switch-and-text-switch-statements, switch-and-text-switch-expressions]
  drills: switch-and-text

- term: double
  kind: keyword
  about: "The primitive type of decimal numbers (64-bit floating point), such as `3.75`; `Double.valueOf` reads one from text."
  aliases: [Double, Double.valueOf]
  steps: [variables-types, variables-doubles-booleans, calculating-division]
  drills: variables

- term: else
  kind: keyword
  about: "The branch of an if statement that runs when its condition is false; `else if` checks another condition first."
  aliases: ["else if"]
  steps: [conditionals-else, conditionals-else-if, conditionals-order]
  drills: conditionals

- term: enum
  kind: keyword
  about: Declares an enum, a type with a fixed set of named values, such as the suits of playing cards.
  steps: [useful-techniques-enums, useful-techniques-enum-fields, switch-and-text-strings-and-enums]
  drills: useful-techniques

- term: extends
  kind: keyword
  about: Makes a class a subclass of another class, so it inherits that class's methods and variables.
  steps: [inheritance-extends, inheritance-super-constructor]
  drills: inheritance

- term: final
  kind: keyword
  about: Marks a variable that can be given a value only once; a final class can't be extended, and a final method can't be overridden.
  steps: [gui-events-effectively-final, asteroids-edges]

- term: finally
  kind: keyword
  about: A block after try and catch that runs whether the try block ends normally or with an exception.
  steps: [exceptions-choosing, exceptions-resources]
  drills: exceptions

- term: for
  kind: keyword
  about: "A loop with its start, condition and update in one line: `for (int i = 0; i < 10; i++)`."
  steps: [for-loops-for, for-loops-bounds, useful-techniques-for-loop]
  drills: for-loops

- term: if
  kind: keyword
  about: Runs a block of code only when its condition is true.
  steps: [conditionals-if, conditionals-comparisons]
  drills: conditionals

- term: implements
  kind: keyword
  about: Says that a class implements an interface; unless the class is abstract, it must then have all of the interface's abstract methods.
  steps: [interfaces-promise, interfaces-several]
  drills: interfaces

- term: import
  kind: keyword
  about: Lets a file use a class of another package by its short name, as in `import java.util.Scanner;`.
  steps: [reading-input-scanner, packages-import]
  drills: packages

- term: instanceof
  kind: keyword
  about: Checks whether an object is of a given type; with a name after the type, as in `o instanceof Dog d`, it also gives the object that type.
  steps: [polymorphism-instanceof, sealed-and-patterns-instanceof, object-interaction-equals]
  drills: polymorphism

- term: int
  kind: keyword
  about: The primitive type of whole numbers from -2147483648 to 2147483647 (32 bits).
  steps: [variables-types, variables-reading-integers]
  drills: variables

- term: interface
  kind: keyword
  about: Declares an interface, a type that lists methods; every class that implements it promises to have them.
  steps: [interfaces-promise, interfaces-variable-type, interfaces-parameter-type]
  drills: interfaces

- term: long
  kind: keyword
  about: The primitive type of whole numbers too big for an int (64 bits); a long literal ends with L, as in `5000000000L`.
  steps: [references-primitives, streams-why]

- term: new
  kind: keyword
  about: Makes a new object (running its constructor) or a new array.
  steps: [classes-constructor, arrays-creating, lists-creating]
  drills: classes

- term: "null"
  kind: literal
  about: The value of a reference variable that refers to no object; calling a method on it throws a NullPointerException.
  steps: [references-null]
  drills: references

- term: package
  kind: keyword
  about: The line at the top of a file that says which package (folder of classes) its classes belong to.
  aliases: [packages]
  steps: [packages-package-line, packages-import, packages-access]
  drills: packages

- term: private
  kind: keyword
  about: Makes a variable, constructor or method usable only inside its own class.
  aliases: [access modifier]
  steps: [classes-creating, inheritance-access, packages-access]
  drills: classes

- term: protected
  kind: keyword
  about: Makes a member usable in its own class, its subclasses and the other classes of its package.
  steps: [inheritance-access, packages-access]
  drills: inheritance

- term: public
  kind: keyword
  about: Makes a class or member usable from every class, in any package.
  steps: [classes-creating, packages-access]
  drills: packages

- term: record
  kind: keyword
  about: Declares a record, a class for plain data whose constructor, accessor methods, equals, hashCode and toString Java writes for you.
  aliases: [records]
  steps: [records-declaring, records-equality, records-class-or-record]
  drills: records

- term: return
  kind: keyword
  about: Ends a method and hands a value back to the code that called it (a void method can return with no value).
  steps: [return-values-returning, return-values-branches]
  drills: return-values

- term: sealed
  kind: keyword
  about: "Limits which classes may extend a class or implement an interface; they're usually listed after `permits`, and a `non-sealed` one is open again."
  aliases: [permits, non-sealed]
  steps: [sealed-and-patterns-sealed, sealed-and-patterns-switch]
  drills: sealed-and-patterns

- term: static
  kind: keyword
  about: "Makes a method or variable belong to the class itself rather than to its objects, so it's used without an object: `Math.sqrt(2)`."
  steps: [methods-define-and-call, paradigms-procedural, gui-basics-first-window]
  drills: methods

- term: super
  kind: keyword
  about: "Refers to the superclass: `super(...)` calls its constructor and `super.name()` its version of a method."
  steps: [inheritance-super-constructor, inheritance-overriding]
  drills: inheritance

- term: switch
  kind: keyword
  about: Picks the code to run, or the value to give, by matching one value against several cases.
  steps: [switch-and-text-switch-statements, switch-and-text-switch-expressions, switch-and-text-strings-and-enums]
  drills: switch-and-text

- term: this
  kind: keyword
  about: "Refers to the object a method or constructor runs for, as in `this.name = name`; `this(...)` calls another constructor of the class."
  steps: [object-methods-this, class-design-this-call]
  drills: object-methods

- term: throw
  kind: keyword
  about: Throws an exception, as in `throw new IllegalArgumentException("negative price");`.
  steps: [exceptions-throwing, exceptions-details]
  drills: exceptions

- term: throws
  kind: keyword
  about: Lists in a method's header the exceptions it may throw to its caller; a checked exception must be caught or listed.
  steps: [exceptions-checked, exceptions-interfaces]
  drills: exceptions

- term: try
  kind: keyword
  about: Starts a block whose exceptions the catch blocks after it handle.
  steps: [exceptions-catching, reading-files-errors]
  drills: exceptions

- term: var
  kind: keyword
  about: Lets the compiler work out a local variable's type from its starting value, as in `var names = new ArrayList<String>();`.
  steps: [switch-and-text-var]
  drills: switch-and-text

- term: void
  kind: keyword
  about: Says in a method's header that the method returns no value.
  steps: [methods-define-and-call, return-values-returning]
  drills: methods

- term: while
  kind: keyword
  about: Repeats a block for as long as its condition is true, checking the condition before every round.
  steps: [loops-while-break, for-loops-while-condition, for-loops-condition-checked]
  drills: loops

- term: yield
  kind: keyword
  about: Gives the value of a switch expression from a case with a block in braces or from a colon case.
  steps: [switch-and-text-switch-expressions]
  drills: switch-and-text

- term: "@Override"
  kind: annotation
  about: An annotation that asks the compiler to check that the method really overrides a method of a superclass or interface.
  steps: [inheritance-overriding, inheritance-actual-type]
  drills: inheritance

- term: "%"
  kind: operator
  about: "The remainder operator: `17 % 5` is 2, and `n % 2 == 0` checks that n is even."
  aliases: [remainder, modulo]
  steps: [boolean-logic-remainder]
  drills: boolean-logic

- term: "&&"
  kind: operator
  about: "Logical and: true only when both sides are true; the right side isn't evaluated when the left side is false."
  aliases: [and]
  steps: [boolean-logic-operators]
  drills: boolean-logic

- term: "||"
  kind: operator
  about: "Logical or: true when at least one side is true; the right side isn't evaluated when the left side is true."
  aliases: [or]
  steps: [boolean-logic-operators]
  drills: boolean-logic

- term: "!"
  kind: operator
  about: "Logical not: turns true into false and false into true, as in `!name.isEmpty()`."
  aliases: [not]
  steps: [boolean-logic-operators]
  drills: boolean-logic

- term: "=="
  kind: operator
  about: "Compares two values (`!=` checks that they differ); for objects it checks whether both are the very same object, so compare strings with equals."
  aliases: ["!="]
  steps: [conditionals-comparisons, boolean-logic-strings, references-objects]
  drills: conditionals

- term: "++"
  kind: operator
  about: "Adds one to a variable, as in `count++`; `--` takes one away."
  aliases: [increment, "--"]
  steps: [loops-counting, for-loops-for]
  drills: loops

- term: "+="
  kind: operator
  about: "Adds a value to a variable: `sum += price` makes sum bigger by price (`-=` and `*=` work the same way)."
  steps: [loops-summing, for-loops-multiplying]
  drills: loops

- term: "->"
  kind: separator
  about: "Separates a lambda's parameters from its body, as in `x -> x * 2`, and a switch case from its result, as in `case 1 -> \"one\";`."
  aliases: [arrow]
  steps: [streams-lambdas, switch-and-text-switch-expressions]
  drills: streams

# ---------------------------------------------------------------- classes
- term: String
  kind: class
  about: "Text, a sequence of characters in double quotes; a String never changes, so methods such as toUpperCase give a new string."
  steps: [reading-input-string-variables, strings-reading-printing]
  drills: strings

- term: Scanner
  kind: class
  about: Reads text one line (or one piece) at a time, from what the user types, `new Scanner(System.in)`, or from a file.
  steps: [reading-input-scanner, reading-files-reading]
  drills: reading-input

- term: ArrayList
  kind: class
  about: A list that grows as values are added, keeping them in order at indexes from 0.
  steps: [lists-creating, lists-types, list-methods-summary]
  drills: lists

- term: List
  kind: class
  about: The interface of lists, which ArrayList implements; a variable of type List can hold any kind of list.
  steps: [interfaces-list]
  drills: interfaces

- term: HashMap
  kind: class
  about: A map that keeps pairs of a key and a value and finds the value of a key quickly, using the key's hashCode.
  steps: [hash-maps-keys-and-values, hash-maps-one-value-per-key, hash-maps-going-through]
  drills: hash-maps

- term: Map
  kind: class
  about: The interface of maps, which HashMap and TreeMap implement.
  steps: [interfaces-map]
  drills: interfaces

- term: HashSet
  kind: class
  about: A set kept in a hash table, with no duplicates, a quick contains, and no promised order.
  steps: [interfaces-set]
  drills: interfaces

- term: Set
  kind: class
  about: The interface of collections that hold each value at most once.
  steps: [interfaces-set, interfaces-collection]
  drills: interfaces

- term: Math
  kind: class
  about: A class of ready-made math methods and constants, such as `Math.sqrt`, `Math.abs`, `Math.max` and `Math.PI`.
  steps: [patterns-math]
  drills: problem-patterns

- term: Integer
  kind: class
  about: The class of int values as objects; lists hold Integer, and `Integer.valueOf` reads a whole number from text.
  steps: [variables-reading-integers, lists-types]
  drills: variables

- term: Object
  kind: class
  about: The class every class inherits from, directly or through its superclasses; it has equals, hashCode and toString.
  steps: [inheritance-object, object-interaction-equals]
  drills: inheritance

- term: StringBuilder
  kind: class
  about: Builds a text piece by piece with append, without making a new String every time; toString gives the result.
  steps: [useful-techniques-stringbuilder]
  drills: useful-techniques

- term: Random
  kind: class
  about: Makes random numbers; with a seed, as in `new Random(42)`, it gives the same numbers on every run.
  steps: [randomness-next-int, randomness-seeds, randomness-chances]
  drills: randomness

- term: Arrays
  kind: class
  about: Ready-made methods for arrays, such as `Arrays.toString` and `Arrays.sort`.
  steps: [arrays-shorthand, sorting-searching-ready-made]
  drills: sorting-searching

- term: Collections
  kind: class
  about: Ready-made methods for lists and other collections, such as `Collections.sort` and `Collections.shuffle`.
  steps: [sorting-searching-ready-made, randomness-lists]
  drills: sorting-searching

- term: Files
  kind: class
  about: Ready-made methods for files, such as `Files.lines` and `Files.readAllLines` (in java.nio.file).
  steps: [streams-files, exceptions-checked]
  drills: streams

- term: Paths
  kind: class
  about: "`Paths.get(\"data.txt\")` makes the Path of a file, for a Scanner or Files to read."
  aliases: [Path]
  steps: [reading-files-files, reading-files-reading]
  drills: reading-files

- term: PrintWriter
  kind: class
  about: "Writes text with print and println; `new PrintWriter(\"notes.txt\")` empties the file first, and close finishes the writing."
  steps: [writing-files-printwriter, writing-files-objects]
  drills: writing-files

- term: FileWriter
  kind: class
  about: Writes text into a file; `new FileWriter(name, true)` adds to the end of the file instead of emptying it first.
  steps: [writing-files-appending]
  drills: writing-files

- term: Iterator
  kind: class
  about: Goes through a collection one value at a time with hasNext and next, and can remove the value it just gave.
  aliases: [iterator, hasNext]
  steps: [useful-techniques-iterators]
  drills: useful-techniques

- term: Comparable
  kind: class
  about: The interface of classes with a natural order; its compareTo method says which of two objects comes first.
  aliases: [natural order]
  steps: [sorting-objects-comparable, sorting-objects-choosing]
  drills: sorting-objects

- term: Comparator
  kind: class
  about: An object that compares two values, given to a sort to choose the order, such as `Comparator.comparing(Book::getYear)`.
  steps: [sorting-objects-comparator, sorting-objects-several-criteria, sorting-objects-choosing]
  drills: sorting-objects

- term: IntStream
  kind: class
  about: A stream of int values, with sum, average and max; `IntStream.range(0, 5)` gives 0 to 4.
  steps: [streams-reduce]
  drills: streams

- term: ArrayDeque
  kind: class
  about: A double-ended queue kept in an array, which works as a stack (push, pop, peek) and as a queue (offer, poll).
  aliases: [Deque]
  steps: [linked-structures-array-deque]
  drills: linked-structures

- term: TreeMap
  kind: class
  about: A map that keeps its keys in sorted order, in a binary search tree; a TreeSet keeps a set's values the same way.
  aliases: [TreeSet]
  steps: [linked-structures-tree-map-set]
  drills: linked-structures

- term: Exception
  kind: class
  about: The class of the problems a program is meant to catch; each kind of problem is a subclass of it.
  aliases: [exceptions]
  steps: [exceptions-catching, exceptions-choosing, reading-files-errors]
  drills: exceptions

- term: RuntimeException
  kind: class
  about: The superclass of the unchecked exceptions other than Error and its subclasses, which a method doesn't have to catch or list after throws.
  steps: [exceptions-choosing, exceptions-details]
  drills: exceptions

- term: IllegalArgumentException
  kind: class
  about: The exception to throw when a method is given a value it can't accept.
  steps: [exceptions-throwing, exceptions-details]
  drills: exceptions

- term: NullPointerException
  kind: class
  about: Thrown when code uses null as if it were an object, such as calling a method through a variable that holds null.
  steps: [references-null]
  drills: references

- term: IndexOutOfBoundsException
  kind: class
  about: Thrown when a list is given an index below 0 or not below its size; arrays and strings throw subclasses with their own names.
  aliases: [ArrayIndexOutOfBoundsException, StringIndexOutOfBoundsException]
  check: [ArrayIndexOutOfBoundsException, StringIndexOutOfBoundsException]
  steps: [lists-index-errors, arrays-length-and-loops, strings-characters]
  drills: lists

- term: NumberFormatException
  kind: class
  about: Thrown when text that isn't a number is turned into one, as in `Integer.valueOf("ten")`.
  steps: [variables-reading-integers, exceptions-catching]
  drills: exceptions

- term: IOException
  kind: class
  about: The checked exception of reading and writing problems, such as a file that can't be read.
  steps: [exceptions-checked, writing-files-appending]
  drills: exceptions

- term: ArithmeticException
  kind: class
  about: Thrown when a whole number is divided by zero, with / or %; with doubles, dividing by zero gives Infinity or NaN instead.
  steps: [debugging-reading-crashes, return-values-call-stack]
  drills: debugging

- term: StackOverflowError
  kind: class
  about: Thrown when calls nest too deep for the call stack, usually a recursion that never reaches its base case.
  steps: [recursion-going-wrong]
  drills: recursion

- term: Application
  kind: class
  about: "The class a JavaFX program extends; `launch(Main.class)` in main starts it, and its start method gets the window (a Stage) to fill."
  aliases: [launch]
  steps: [gui-basics-first-window, gui-events-launch-parameters]
  drills: gui-basics

- term: Stage
  kind: class
  about: A JavaFX window; start is given the main one, and setScene puts what it shows in it.
  steps: [gui-basics-first-window, gui-views-switching-scenes]
  drills: gui-basics

- term: Scene
  kind: class
  about: What a JavaFX window shows, built around one root node, usually a layout with the components inside it.
  steps: [gui-basics-scene-layout, gui-views-switching-scenes]
  drills: gui-basics

- term: Button
  kind: class
  about: A JavaFX button; setOnAction gives it the code to run when it's pressed.
  steps: [gui-basics-scene-layout, gui-events-button-actions]
  drills: gui-events

- term: Label
  kind: class
  about: A JavaFX component that shows a text the user can't edit.
  steps: [gui-basics-first-window, gui-basics-scene-layout]
  drills: gui-basics

- term: TextField
  kind: class
  about: A JavaFX box for one line of text the user types, read with getText; a TextArea holds several lines.
  aliases: [TextArea]
  steps: [gui-basics-text-input, gui-events-button-actions]
  drills: gui-basics

- term: BorderPane
  kind: class
  about: A JavaFX layout with five regions, top, bottom, left, right and center.
  steps: [gui-basics-border-pane, gui-views-changing-center]
  drills: gui-basics

- term: VBox
  kind: class
  about: A JavaFX layout that puts its components one under another in a column; an HBox puts them side by side in a row.
  aliases: [HBox]
  steps: [gui-basics-boxes-grids, gui-basics-nesting]
  drills: gui-basics

- term: GridPane
  kind: class
  about: A JavaFX layout that places its components in the cells of a grid, by column and row.
  steps: [gui-basics-boxes-grids, gui-views-end-of-part-13]
  drills: gui-basics

- term: LineChart
  kind: class
  about: A JavaFX chart that joins each series' points with lines, usually on two NumberAxis axes.
  aliases: [NumberAxis]
  steps: [charts-line-chart, charts-several-series]
  drills: charts

- term: BarChart
  kind: class
  about: A JavaFX chart of bars for the categories of a CategoryAxis.
  aliases: [CategoryAxis]
  steps: [charts-bar-charts, charts-honest-charts]
  drills: charts

- term: XYChart.Series
  kind: class
  about: One named line or set of bars of a JavaFX chart, holding its points (XYChart.Data).
  aliases: [XYChart.Data]
  steps: [charts-line-chart, charts-several-series]
  drills: charts

- term: Canvas
  kind: class
  about: A JavaFX surface to draw on, through its GraphicsContext and methods such as setFill, fillRect and fillOval.
  aliases: [GraphicsContext, fillRect, fillOval]
  steps: [drawing-and-images-canvas, drawing-and-images-mouse]
  drills: drawing-and-images

- term: Image
  kind: class
  about: A picture loaded into a JavaFX program, shown in a window with an ImageView.
  aliases: [ImageView]
  steps: [drawing-and-images-pixels, drawing-and-images-scaling-down]
  drills: drawing-and-images

- term: WritableImage
  kind: class
  about: An image a program writes pixel by pixel with its PixelWriter, while a PixelReader reads the pixels of any image.
  aliases: [PixelReader, PixelWriter]
  steps: [drawing-and-images-pixels, drawing-and-images-scaling-down, drawing-and-images-color-filters]
  drills: drawing-and-images

- term: AnimationTimer
  kind: class
  about: Runs its handle method once for every frame the screen draws, which makes a game loop.
  steps: [asteroids-keys, asteroids-vectors]
  drills: asteroids

- term: Point2D
  kind: class
  about: An unchangeable pair of an x and a y, used for positions and movements; add gives a new point.
  steps: [asteroids-vectors]
  drills: asteroids

- term: Connection
  kind: class
  about: A connection to a database through JDBC, made with `DriverManager.getConnection` and closed when done.
  aliases: [DriverManager]
  steps: [libraries-and-tools-jdbc]
  drills: libraries-and-tools

- term: PreparedStatement
  kind: class
  about: An SQL statement with ? marks for its values, filled in with setString and setInt, which keeps the values apart from the SQL.
  steps: [libraries-and-tools-jdbc]
  drills: libraries-and-tools

- term: ResultSet
  kind: class
  about: The rows a database query returns, read one at a time with next and getString or getInt.
  steps: [libraries-and-tools-jdbc]
  drills: libraries-and-tools

# ---------------------------------------------------------------- methods
- term: System.out.println
  kind: method
  about: Prints a value and then ends the line; System.out.print prints without ending it.
  aliases: [println, System.out.print]
  steps: [printing-first-program, printing-print-and-println]
  drills: printing

- term: System.out.printf
  kind: method
