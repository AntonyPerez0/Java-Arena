<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>javac.wasm main-thread test</title>
</head>
<body>
<script type="module">
  // Same compiler on the page's main thread, only so that run.mjs can read the
  // JS heap (which holds the Wasm GC objects) with CDP after many compiles.
  import { createJavac } from '../../../dist/compiler/javac-host.mjs';
  const javac = await createJavac({ wasm: fetch('../../../dist/compiler/javac.wasm'), sdk: fetch('../../../dist/compiler/java-base-sdk.bin') });
  window.compileOnce = (files) => javac.compile(files).success;
  window.javacReady = true;
</script>
</body>
</html>
